<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>사건의 열쇠 화면 시안</title>
<style>
@font-face{font-family:"Paperlogy";src:url("../assets/fonts/Paperlogy-4Regular.woff2") format("woff2");font-weight:400}
@font-face{font-family:"Paperlogy";src:url("../assets/fonts/Paperlogy-7Bold.woff2") format("woff2");font-weight:700}
@font-face{font-family:"Paperlogy Display";src:url("../assets/fonts/Paperlogy-6SemiBold.woff2") format("woff2");font-weight:400}
:root{--ground:#B6BDA5;--paper:#FBF4E6;--paper-2:#F4EAD4;--ink:#4A3628;--ink-soft:#7D6A58;--honey:#F2CF73;--line:#E3D5B8;--berry:#C96F86;--sheet:#FDFAEE;--pen:#34506E;
  --f-display:"Paperlogy Display","Paperlogy",system-ui,sans-serif;--f-hand:"Paperlogy",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--f-hand)}
.wrap{max-width:1600px;margin:0 auto;padding:28px 20px 56px}
h1{font-family:var(--f-display);font-weight:400;font-size:24px;margin:0 0 4px}
.lead{margin:0 0 22px;font-size:14px;opacity:.8;max-width:820px;line-height:1.6}
.grid{display:flex;flex-wrap:wrap;gap:34px 28px;align-items:flex-start}
.opt{width:360px;max-width:100%}
.opt h2{margin:0 0 10px;font-family:var(--f-display);font-weight:400;font-size:17px}
.opt p{margin:12px 2px 0;font-size:13px;line-height:1.6;color:var(--ink-soft)}
.rec{display:inline-block;padding:1px 8px;border-radius:10px;background:var(--honey);font-size:11px;vertical-align:2px}

/* the phone and what every option shares: the case line, the close button, the three steps, 해석, 다음 */
.phone{position:relative;width:360px;max-width:100%;height:740px;border-radius:36px;overflow:hidden;background:var(--paper);box-shadow:0 10px 30px rgba(40,30,20,.25);display:flex;flex-direction:column}
.top{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:20px 18px 0}
.top .case{font-family:var(--f-display);font-size:13px;color:var(--berry)}
.top .x{width:40px;height:40px;background:url(../assets/ui/close-button.png) center/100% no-repeat;border:0}
.steps{position:relative;z-index:2;display:flex;gap:6px;padding:10px 18px 0}
.steps i{flex:1;height:6px;border-radius:3px;background:#E3D5B8}
.steps i:first-child{background:#E0A93A}
.go{position:absolute;left:18px;right:18px;bottom:22px;z-index:3;height:50px;border:2px solid transparent;font-family:var(--f-display);font-size:17px;color:#FFFDF7;background:none;
  border-image:url(../assets/ui/buttons/berry-flat.png) 60 62 62 62 fill / 20px 20.6px stretch}
.ko{display:none;font-size:13px;color:var(--berry);font-weight:700;margin-top:2px}
.show-ko .ko{display:block}
.kobtn{padding:3px 12px;border:2px solid transparent;background:none;font-family:var(--f-display);font-size:12px;color:var(--ink);border-image:url(../assets/ui/buttons/cream-flat.png) 60 62 62 62 fill / 12px 12.4px stretch}
.show-ko .kobtn{border-image-source:url(../assets/ui/buttons/sky-flat.png)}
mark{background:linear-gradient(transparent 55%,rgba(242,207,115,.75) 55%);color:inherit;padding:0 1px}

/* ---- B. the key pinned with a red tack, the examples as three taped notes ---- */
.b .top .case{color:#5B3A22;background:rgba(253,250,238,.85);padding:3px 10px;border-radius:10px}
.b .steps i{background:rgba(253,250,238,.6)}
.b .card{position:relative;margin:26px 22px 0;padding:22px 18px 16px;background:var(--sheet);border-radius:4px;box-shadow:2px 6px 10px rgba(50,30,15,.35);transform:rotate(-1.5deg)}
.b .card::before{content:"";position:absolute;left:50%;top:-16px;width:24px;height:33px;margin-left:-9px;background:url(../assets/ui/tack-red.webp) center/100% no-repeat}
.b .card .head{display:flex;justify-content:space-between;align-items:center;font-family:var(--f-display);font-size:15px;color:var(--ink-soft)}
.b .card .word{margin:6px 0 2px;font-family:var(--f-display);font-size:50px;line-height:1}
.b .card .why{font-size:13.5px;line-height:1.55}
.b .notes{display:flex;flex-direction:column;gap:14px;margin:22px 20px 0}
.b .note{position:relative;padding:12px 14px;font-size:16px;box-shadow:2px 4px 6px rgba(50,30,15,.3);border-radius:2px}
.b .note:nth-child(1){background:#FFF1B8;transform:rotate(1.2deg);margin-right:30px}
.b .note:nth-child(2){background:#DCEBF7;transform:rotate(-1deg);margin-left:30px}
.b .note:nth-child(3){background:#F8DDE3;transform:rotate(.8deg);margin-right:14px}
.b .note::before{content:"";position:absolute;left:50%;top:-7px;width:46px;height:14px;margin-left:-23px;background:rgba(255,253,240,.6);transform:rotate(-3deg)}
.b .note{display:flex;align-items:center;gap:10px}
.b .note>span:first-child{flex:1}
.b .note .play{flex:none;width:30px;height:30px;border:1.5px solid var(--ink);border-radius:50%;background:#FFFDF7 url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Cpath d=%27M4 2.5 L13 8 L4 13.5Z%27 fill=%27%234A3628%27/%3E%3C/svg%3E") 55% 50%/12px no-repeat}
.b mark{background:linear-gradient(transparent 55%,rgba(201,111,134,.35) 55%)}

/* B-2, applied to the game (user decision): B without the cork, on graph paper; ▶ by each example (user request) */
.b .card,.b .notes{z-index:1}
.b .notes{position:relative}
.b .steps i:first-child{background:#E0A93A}
.b.cream .steps i:not(:first-child){background:var(--line)}
.b.cream{background-color:var(--paper);background-image:repeating-linear-gradient(0deg,transparent 0 21px,rgba(125,106,88,.1) 21px 22px),repeating-linear-gradient(90deg,transparent 0 21px,rgba(125,106,88,.1) 21px 22px)}
.b.cream .card{box-shadow:2px 5px 9px rgba(70,50,30,.22)}
.b.cream .note{box-shadow:1px 3px 5px rgba(70,50,30,.2)}
.b.cream .top .case,</style>
</head>
<body>
<div class="wrap">
  <h1>사건의 열쇠 화면 시안 — 게임 적용</h1>
  <p class="lead">고른 안: B-2 모눈 종이(열쇠 카드 + 색 쪽지, 코르크판 그림 없음), 예문마다 ▶. 게임의 사건의 열쇠 화면에 적용했어요.</p>
  <div class="grid" id="grid"></div>
</div>
<script>
const EX = [['The shop opens <mark>at eleven</mark>.', '가게는 11시에 문을 열어요.'], ["Let's meet <mark>at noon</mark>.", '정오에 만나요.'], ['The train leaves <mark>at six fifteen</mark>.', '기차는 6시 15분에 떠나요.']];
const WHY = '시각 하나를 콕 집어 말할 때 써요. "몇 시에"예요. at six = 6시에.';
const topBar = () => `<div class="top"><span class="case">Case 01 · 도서관 살인사건</span><button class="x" type="button" aria-label="닫기"></button></div><div class="steps"><i></i><i></i><i></i></div>`;
const ko = '<button class="kobtn" type="button" data-ko>해석</button>';
const lines = () => EX.map(([en, k]) => `<div>${en}<span class="ko">${k}</span></div>`).join('');
const bHTML = () => `${topBar()}<div class="card"><div class="head">이번 사건의 열쇠 ${ko}</div><div class="word">at</div><div class="kind" style="font-family:var(--f-display);font-size:12px;color:var(--ink-soft)">시간 전치사</div><div class="why">${WHY}</div></div>
      <div class="notes">${EX.map(([en, k]) => `<div class="note"><span>${en}<span class="ko">${k}</span></span><button class="play" type="button" aria-label="예문 듣기"></button></div>`).join('')}</div><button class="go" type="button">다음</button>`;
const OPTS = [
  ['b cream', 'B-2. 모눈 종이 (적용)', '', '크림 종이에 옅은 모눈, 열쇠 카드는 빨간 압정, 예문은 테이프 붙인 색 쪽지 세 장과 ▶.', bHTML],
];
document.getElementById('grid').innerHTML = OPTS.map(([k, title, rec, text, html]) => `<section class="opt"><h2>${title}${rec ? '' : ''}</h2><div class="phone ${k}">${html()}</div><p>${text}</p></section>`).join('');
document.addEventListener('click', e => { const b = e.target.closest('[data-ko]'); if(b) b.closest('.phone').classList.toggle('show-ko'); });
</script>
</body>
</html>
