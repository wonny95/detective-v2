<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>사건 타이틀 시안</title>
<style>
@font-face{font-family:"Paperlogy";src:url("../assets/fonts/Paperlogy-4Regular.woff2") format("woff2");font-weight:400}
@font-face{font-family:"Paperlogy";src:url("../assets/fonts/Paperlogy-7Bold.woff2") format("woff2");font-weight:700}
@font-face{font-family:"PD";src:url("../assets/fonts/Paperlogy-6SemiBold.woff2") format("woff2");font-weight:400}
@font-face{font-family:"PD";src:url("../assets/fonts/Paperlogy-7Bold.woff2") format("woff2");font-weight:700}
:root{--paper:#FBF4E6;--paper-2:#F4EAD4;--ink:#4A3628;--ink-soft:#7D6A58;--honey:#F2CF73;--berry:#C96F86;--red:#B8473C}
body{margin:0;background:#A9B79C;font-family:"Paperlogy",sans-serif;color:var(--ink)}
header{padding:16px 20px 4px}
h1{font-family:PD;font-weight:400;font-size:20px;margin:0 0 4px}
header p{margin:0;font-size:13px;color:#3d3328}
.replay{margin-top:8px;font:inherit;font-family:PD;padding:7px 14px;border:2px solid var(--ink);border-radius:12px;background:var(--paper);cursor:pointer}
.grid{display:flex;flex-wrap:wrap;gap:18px;padding:12px 20px 30px}
figure{margin:0}
figcaption{font-family:PD;font-size:15px;margin:0 0 6px}
figcaption span{display:block;font-family:Paperlogy;font-size:12px;color:#3d3328;max-width:280px;line-height:1.4}
.phone{position:relative;width:280px;height:500px;border-radius:26px;overflow:hidden;background:url("../assets/places/picnic-storyboard/picnic-wide.png") 40% 50%/auto 100%;box-shadow:0 4px 14px #0003}
.phone .who{position:absolute;left:50%;bottom:40px;height:330px;transform:translateX(-50%)}
.phone::after{content:"";position:absolute;left:0;right:0;bottom:0;height:64px;background:var(--paper)}
.card{position:absolute;inset:0;z-index:3;display:grid;place-items:center;pointer-events:none}

/* A — 리본 띠 */
.a{background:radial-gradient(ellipse at center,rgba(40,28,20,.25),rgba(40,28,20,.6));animation:fade 2.4s ease forwards}
.a .band{width:100%;background:var(--ink);color:var(--paper);text-align:center;padding:14px 0 16px;position:relative;box-shadow:0 6px 0 rgba(0,0,0,.18);animation:band 2.4s cubic-bezier(.2,.9,.3,1.2) forwards}
.a .band::before,.a .band::after{content:"";position:absolute;left:0;right:0;height:5px;background:repeating-linear-gradient(90deg,var(--honey) 0 10px,transparent 10px 16px)}
.a .band::before{top:5px}.a .band::after{bottom:5px}
.a small{display:block;font-family:PD;font-size:13px;letter-spacing:.25em;color:var(--honey)}
.a b{display:block;font-family:PD;font-weight:700;font-size:28px;margin-top:2px}

/* B — 쪽지 + 테이프 + 도장 */
.b{background:rgba(40,28,20,.45);animation:fade 2.4s ease forwards}
.b .note{position:relative;background:var(--paper);padding:24px 18px 18px;width:236px;text-align:center;transform:rotate(-3deg);box-shadow:3px 6px 0 rgba(0,0,0,.2);border-radius:3px;animation:drop 2.4s cubic-bezier(.2,.9,.3,1.3) forwards}
.b .note::before{content:"";position:absolute;top:-12px;left:50%;width:84px;height:24px;transform:translateX(-50%) rotate(2deg);background:rgba(242,207,115,.85);box-shadow:0 1px 2px #0002}
.b .note b{display:block;font-family:PD;font-weight:700;font-size:26px;white-space:nowrap;line-height:1.2}
.b .stamp{position:absolute;right:-18px;top:-20px;font-family:PD;font-weight:700;font-size:14px;color:var(--red);border:3px solid var(--red);border-radius:6px;padding:3px 8px;transform:rotate(12deg);background:rgba(251,244,230,.9);opacity:0;animation:stampIn 2.4s ease forwards;white-space:nowrap;width:max-content}

/* C — 사건 파일 폴더 */
.c{background:rgba(40,28,20,.45);animation:fade 2.4s ease forwards}
.c .folder{position:relative;width:230px;background:#E3C48E;border:3px solid var(--ink);border-radius:4px 12px 12px 12px;padding:22px 16px 18px;text-align:center;box-shadow:4px 6px 0 rgba(0,0,0,.22);animation:rise 2.4s cubic-bezier(.2,.9,.3,1.2) forwards}
.c .tab{position:absolute;left:-3px;top:-30px;background:#E3C48E;border:3px solid var(--ink);border-bottom:none;border-radius:10px 10px 0 0;padding:4px 14px 6px;font-family:PD;font-size:13px;letter-spacing:.12em}
.c .label{background:var(--paper);border:2px dashed var(--ink-soft);border-radius:6px;padding:10px 6px}
.c .label b{display:block;font-family:PD;font-weight:700;font-size:26px}
.c .label small{display:block;font-size:11px;color:var(--ink-soft);letter-spacing:.2em;margin-bottom:2px}

/* D — 영화 자막 */
.d{animation:fade 2.4s ease forwards}
.d::before,.d::after{content:"";position:absolute;left:0;right:0;height:70px;background:#1d1510;animation:bars 2.4s ease forwards}
.d::before{top:0;transform-origin:top}.d::after{bottom:0;transform-origin:bottom}
.d .glow{position:absolute;inset:0;background:rgba(20,14,10,.55)}
.d .txt{position:relative;text-align:center;color:#fff;animation:rise 2.4s ease forwards}
.d small{display:inline-block;font-family:PD;font-size:13px;letter-spacing:.3em;color:var(--honey);border-top:2px solid var(--honey);border-bottom:2px solid var(--honey);padding:3px 10px;margin-bottom:8px}
.d b{display:block;font-family:PD;font-weight:700;font-size:32px;text-shadow:0 3px 0 var(--ink),0 0 18px rgba(0,0,0,.6);-webkit-text-stroke:1px rgba(74,54,40,.4)}


.card i{display:block;font-style:normal;font-family:Paperlogy;font-weight:400;font-size:13px;margin-top:4px;opacity:.85}
.a i{color:var(--paper-2)}
.b .note i,.c .label i{color:var(--ink-soft)}
.d i{color:#fff;text-shadow:0 2px 0 var(--ink)}
@keyframes fade{0%{opacity:0}12%{opacity:1}82%{opacity:1}100%{opacity:0}}
@keyframes band{0%{transform:scaleX(0)}16%{transform:scaleX(1)}100%{transform:scaleX(1)}}
@keyframes drop{0%{transform:translateY(-60px) rotate(-8deg)}18%{transform:translateY(0) rotate(-3deg)}100%{transform:rotate(-3deg)}}
@keyframes stampIn{0%,22%{opacity:0;transform:rotate(12deg) scale(2)}30%{opacity:1;transform:rotate(12deg) scale(1)}100%{opacity:1;transform:rotate(12deg) scale(1)}}
@keyframes rise{0%{transform:translateY(30px);opacity:0}18%{transform:translateY(0);opacity:1}100%{transform:translateY(0)}}
@keyframes bars{0%{transform:scaleY(0)}15%{transform:scaleY(1)}85%{transform:scaleY(1)}100%{transform:scaleY(0)}}
.still .card,.still .card *,.still .card::before,.still .card::after{animation-delay:-1.3s!important;animation-play-state:paused!important}
</style></head>
<body>
<header>
  <h1>사건 타이틀 시안 4개</h1>
  <p>사건을 시작해 첫 인물을 만날 때 잠깐 나오는 제목이에요. 영어 제목(The 없이)을 크게, 한국어 제목을 작게. 그림 없이 CSS로만 만들어 크레딧은 들지 않아요.</p>
  <button class="replay" type="button" onclick="replay()">▶ 다시 보기</button>
  <button class="replay" type="button" onclick="hold()">⏸ 가운데에서 멈추기</button>
</header>
<div class="grid" id="grid">
  <figure><figcaption>A · 리본 띠<span>화면을 가로지르는 진한 갈색 띠가 펼쳐지고, 위아래에 노란 점선. 가장 눈에 잘 띄어요.</span></figcaption>
    <div class="phone"><img class="who" src="../assets/characters/rosie-higgsfield.png" alt=""><div class="card a"><div class="band"><small>CASE 01</small><b>Mixed-Up Bags</b><i>바뀐 소풍 가방</i></div></div></div></figure>
  <figure><figcaption>B · 쪽지 + 도장<span>테이프 붙은 쪽지가 위에서 떨어지고, 빨간 "CASE 01" 도장이 쾅 찍혀요. 탐정 노트 느낌.</span></figcaption>
    <div class="phone"><img class="who" src="../assets/characters/rosie-higgsfield.png" alt=""><div class="card b"><div class="note"><span class="stamp">CASE 01</span><b>Mixed-Up Bags</b><i>바뀐 소풍 가방</i></div></div></div></figure>
  <figure><figcaption>C · 사건 파일 폴더<span>누런 서류 폴더의 탭에 "CASE 01", 가운데 이름표에 제목. 사건 목록의 파일 느낌과 이어져요.</span></figcaption>
    <div class="phone"><img class="who" src="../assets/characters/rosie-higgsfield.png" alt=""><div class="card c"><div class="folder"><span class="tab">CASE 01</span><div class="label"><b>Mixed-Up Bags</b><i>바뀐 소풍 가방</i></div></div></div></div></figure>
  <figure><figcaption>D · 영화 자막<span>위아래 검은 띠가 내려오고, 큰 흰 글씨 제목. 가장 극적이고 무게감 있어요.</span></figcaption>
    <div class="phone"><img class="who" src="../assets/characters/rosie-higgsfield.png" alt=""><div class="card d"><div class="glow"></div><div class="txt"><small>CASE 01</small><b>Mixed-Up Bags</b><i>바뀐 소풍 가방</i></div></div></div></figure>
</div>
<script>
function replay(){const g=document.getElementById('grid');g.classList.remove('still');document.querySelectorAll('.card').forEach(c=>{const n=c.cloneNode(true);c.replaceWith(n)})}
function hold(){replay();document.getElementById('grid').classList.add('still')}
hold();
</script>
</body></html>
