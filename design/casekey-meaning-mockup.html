<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>열쇠 카드 뜻 시안</title>
<style>
@font-face{font-family:"Paperlogy";src:url("../assets/fonts/Paperlogy-4Regular.woff2") format("woff2");font-weight:400}
@font-face{font-family:"Paperlogy";src:url("../assets/fonts/Paperlogy-7Bold.woff2") format("woff2");font-weight:700}
@font-face{font-family:"Paperlogy Display";src:url("../assets/fonts/Paperlogy-6SemiBold.woff2") format("woff2");font-weight:400}
@font-face{font-family:"Paperlogy Display";src:url("../assets/fonts/Paperlogy-7Bold.woff2") format("woff2");font-weight:700}
:root{--ink:#4A3628;--ink-soft:#7D6A58;--berry:#C96F86;--ground:#B6BDA5;
  --f-display:"Paperlogy Display","Paperlogy",system-ui,sans-serif;--f-body:"Paperlogy",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--f-body)}
header.bar{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:12px 20px;background:#E9ECDF;border-bottom:2px solid #9AA287}
header.bar h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:18px}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{font:inherit;font-size:13px;padding:6px 12px;border:2px solid var(--ink);border-radius:999px;background:#FFFDF7;color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:#FFFDF7}
.cols{display:flex;flex-wrap:wrap;justify-content:center;gap:22px;padding:20px 16px 40px}
.col{width:430px;display:flex;flex-direction:column;gap:8px}
.col h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:17px}
.col p.desc{margin:0;min-height:58px;font-size:12.5px;line-height:1.5;color:#3E4A35}

/* the phone: the game's key page as it is now (header ⑥, card A, no tack, -0.6deg) */
.phone{position:relative;height:860px;border-radius:26px;overflow:hidden;box-shadow:0 6px 18px rgba(40,50,30,.25);
  background:linear-gradient(rgba(250,242,222,.4),rgba(250,242,222,.4)),#F8EED7 url(../assets/ui/casekey/graph-paper.webp) 0 0/176px 176px repeat}
.page{position:absolute;inset:0;display:flex;flex-direction:column;padding:0 18px 16px}
.ck-top{flex:none;display:flex;align-items:center;gap:10px;min-height:42px;padding-top:10px}
.ck-case{margin:0;display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-family:var(--f-display);font-weight:400;font-size:20px;line-height:1.25}
.ck-case .no{flex:none;padding:3px 8px 2px;border-radius:7px;background:var(--berry);color:#FFFDF7;font-size:12px;line-height:1.2}
.close-button{margin-left:auto;flex:none;width:42px;height:42px;border:0;background:url(../assets/ui/close-button.png) center/contain no-repeat;filter:drop-shadow(0 3px 0 rgba(74,54,40,.3))}
.body{flex:1;min-height:0;padding:0 6px 12px}
.ck-card{position:relative;display:flex;flex-direction:column;margin:10px 6px 0;padding:8px 8px 4px;border:12px solid transparent;border-image:url(../assets/ui/casekey/card.webp) 20 fill / 12px stretch;filter:drop-shadow(2px 4px 4px rgba(70,50,30,.2));transform:rotate(-.6deg)}
.ck-key{display:flex;flex-direction:column}
.eyebrow{margin-bottom:4px;font-family:var(--f-display);font-size:12.5px;color:var(--ink-soft)}
.eyebrow .n{color:var(--berry)}
.ck-key h3{position:relative;margin:0;padding-right:40px;font-family:var(--f-display);font-weight:400;font-size:34px;line-height:1.15;text-wrap:balance}
.ck-key h3 .part{white-space:nowrap}
.ck-key h3 .replay-q{position:absolute;top:2px;right:2px}
.gko{margin:10px 0 0;font-size:15px;line-height:1.55;word-break:keep-all;text-wrap:pretty}
.replay-q{display:inline-block;flex:none;width:34px;height:34px;padding:0;border:0;background:url(../assets/ui/icons/play.png) 58% 50%/46% auto no-repeat,url(../assets/ui/buttons/round-cream.png) center/100% no-repeat;cursor:pointer}
.ck-notes{display:flex;flex-direction:column;gap:14px;margin:22px 4px 0}
.ck-note{--note:url(../assets/ui/casekey/note-yellow.webp);position:relative;display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:2px 6px;margin:0;padding:3px 0 3px 4px;font-family:var(--f-body);font-size:17px;line-height:1.35;border:11px solid transparent;border-width:11px 26px 11px 11px;border-image:var(--note) 22 54 22 22 fill / 11px 26px 11px 11px stretch;filter:drop-shadow(1px 3px 3px rgba(70,50,30,.18))}
.ck-note:nth-child(3n+1){transform:rotate(1.2deg);margin-right:20px}
.ck-note:nth-child(3n+2){--note:url(../assets/ui/casekey/note-blue.webp);transform:rotate(-1deg);margin-left:20px}
.ck-note:nth-child(3n){--note:url(../assets/ui/casekey/note-pink.webp);transform:rotate(.8deg);margin-right:8px}
.ck-note::before{content:"";position:absolute;left:50%;top:-19px;width:58px;height:18px;margin-left:-29px;background:url(../assets/ui/casekey/tape.webp) center/100% 100% no-repeat;opacity:.92;transform:rotate(-3deg)}
.ck-note:nth-child(3n+2)::before{transform:rotate(4deg)}
.ck-note mark{background:linear-gradient(transparent 55%,rgba(201,111,134,.35) 55%);color:inherit}
.ck-note .replay-q{grid-row:1;grid-column:2;width:32px;height:32px}
.pill{display:inline-flex;align-items:center;justify-content:center;border:2px solid transparent;background:none;font-family:var(--f-display);font-size:14px;color:var(--ink);cursor:pointer;
  --btn:url(../assets/ui/buttons/cream-flat.png);--bw:15px;border-image:var(--btn) 60 62 62 62 fill / var(--bw) calc(var(--bw) * 1.03) stretch;padding:6px 12px}
.pill.sm{--bw:12px;height:32px;padding:0 10px;font-size:12px}
.ck-note .pill.sm{grid-row:1;grid-column:3}
.ck-note:not(.ko-on) .ko{display:none}
.ck-note .ko{grid-column:1 / -1;font-size:12.5px;font-weight:700;color:var(--berry)}
.ck-dots{flex:none;display:flex;justify-content:center;align-items:center;gap:9px;margin-bottom:10px}
.ck-dots i{width:8px;height:8px;border-radius:50%;background:rgba(74,54,40,.22)}
.ck-dots i.now{background:#E0A526;transform:scale(1.3)}
.ck-foot{flex:none;display:flex;gap:8px}
.ck-foot .pill:not(.big){flex:none;padding:0 18px}
.ck-foot .big{flex:1;--btn:url(../assets/ui/buttons/berry-flat.png);--bw:20px;font-size:17px;padding:11px 14px;color:#FFFDF7}

/* the meaning, hidden unless the variant shows it */
.mean{display:none}
/* A: one line under the form: word in ink, meaning in berry */
.v-a .mean{display:block;margin-top:6px;font-size:16px;line-height:1.5;word-break:keep-all}
.v-a .mean .w{font-family:var(--f-display)}
.v-a .mean .k{margin-left:5px;font-weight:700;color:var(--berry)}
.v-a .mean .sep{margin:0 7px;color:var(--ink-soft)}
/* B: chips, one per word */
.v-b .mean{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.v-b .mean .sep{display:none}
.v-b .mean .it{display:inline-flex;align-items:baseline;gap:6px;padding:3px 10px 2px;border:1.5px solid rgba(201,111,134,.55);border-radius:999px;background:rgba(255,253,247,.7);font-size:14.5px}
.v-b .mean .w{font-family:var(--f-display)}
.v-b .mean .k{font-weight:700;color:var(--berry)}
/* C: a small dictionary table between the form and the explanation, dashed rules */
.v-c .mean{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;margin-top:10px;padding:7px 2px;border-top:1.5px dashed rgba(74,54,40,.3);border-bottom:1.5px dashed rgba(74,54,40,.3);font-size:15px}
.v-c .mean .it{display:contents}
.v-c .mean .sep{display:none}
.v-c .mean .w{font-family:var(--f-display)}
.v-c .mean .k{font-weight:700;color:var(--berry)}
/* D: highlighter under each word, as the notes' marks */
.v-d .mean{display:block;margin-top:6px;font-size:16px;line-height:1.6;word-break:keep-all}
.v-d .mean .sep{margin:0 5px;color:var(--ink-soft)}
.v-d .mean .it{white-space:nowrap}
.v-d .mean .w{font-family:var(--f-display);background:linear-gradient(transparent 58%,rgba(224,165,38,.38) 58%)}
.v-d .mean .k{margin-left:2px;color:var(--ink)}
.v-d .mean .k::before{content:"= ";color:var(--ink-soft)}
</style>
</head>
<body>
<header class="bar">
  <h1>열쇠 카드 · 뜻 넣는 자리 시안</h1>
  <div class="seg" id="caseSeg"></div>
  <div class="seg" id="pageSeg"></div>
</header>
<div class="cols" id="cols"></div>
<script>
// the cases, keys and text come straight from the game's GRAMMAR (../index.html), so the mockup shows the game's words
const CASES = [['picnic','Case 01','바뀐 소풍 가방','ownership'], ['umbrella','Case 02','주인 없는 우산','whose'], ['violin','Case 03','사라진 음악 대회 바이올린','place-prep'], ['library','Case 04','도서관 살인사건','time-prep']];
const VARIANTS = [
  { id:'now', label:'지금', desc:'뜻 없이 형태 → 설명.' },
  { id:'a', label:'A · 한 줄', desc:'형태 바로 아래 한 줄: 영어는 진한 글씨, 뜻은 분홍. 가장 가볍다.' },
  { id:'b', label:'B · 낱말 칩', desc:'낱말마다 둥근 칩(영어 + 분홍 뜻). 한눈에 짝이 보이고 줄이 넘으면 칩째 다음 줄로.' },
  { id:'c', label:'C · 작은 사전 표', desc:'형태와 설명 사이에 점선으로 나눈 두 칸 표(왼쪽 영어, 오른쪽 뜻). 사전 느낌이 가장 강하고 카드가 가장 길다.' },
  { id:'d', label:'D · 형광펜 = 뜻', desc:'영어 낱말에 쪽지와 같은 형광펜, 뒤에 "= 뜻". 쪽지의 표시와 이어진다.' }
];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' })[c]);
const mark = s => esc(s).replace(/\{([^}]+)\}/g, '<mark>$1</mark>');
let G, caseAt = 1, at = 2;
function pageHTML(c, i){
  const exs = G[c[3]].examples, ex = exs[i], last = i === exs.length - 1, play = '<button class="replay-q" type="button" aria-label="듣기"></button>';
  const form = ex.parts ? ex.parts.map(p => `<span class="part">${esc(p)}</span>`).join(' ') : esc(ex.head);
  const mean = (ex.mean || []).map(([w, k]) => `<span class="it"><span class="w">${esc(w)}</span><span class="k">${esc(k)}</span></span>`).join('<span class="sep">·</span>');
  return `<div class="ck-top"><h2 class="ck-case"><span class="no">${c[1]}</span>${c[2]}</h2><button class="close-button" type="button" aria-label="닫기"></button></div>
    <div class="body"><div class="ck-card"><div class="ck-key">
      <div class="eyebrow">이번 사건의 열쇠 <span class="n">· ${i + 1}/${exs.length}</span></div>
      <h3>${form}${play}</h3><div class="mean">${mean}</div><p class="gko">${esc(ex.why || ex.ko)}</p></div></div>
      <div class="ck-notes">${ex.lines.map(([en, ko]) => `<p class="ck-note"><span>${mark(en)}</span>${play}<button class="pill sm" type="button" data-ko>해석</button><span class="ko">${esc(ko)}</span></p>`).join('')}</div></div>
    <div class="ck-dots">${exs.map((x, j) => `<i${j === i ? ' class="now"' : ''}></i>`).join('')}</div>
    <div class="ck-foot">${i ? '<button class="pill" type="button" data-prev>이전</button>' : ''}<button class="pill big" type="button" data-next>${last ? '사건 시작' : '다음'}</button></div>`;
}
function render(){
  const c = CASES[caseAt], n = G[c[3]].examples.length;
  document.getElementById('cols').innerHTML = VARIANTS.map(v => `<section class="col"><h2>${v.label}</h2><p class="desc">${v.desc}</p><div class="phone v-${v.id}"><div class="page"></div></div></section>`).join('');
  document.querySelectorAll('.phone .page').forEach(page => {
    let tallest = 0;
    for(let i = 0; i < n; i++){ page.innerHTML = pageHTML(c, i); tallest = Math.max(tallest, page.querySelector('.ck-card').offsetHeight); }
    page.innerHTML = pageHTML(c, at); page.querySelector('.ck-card').style.minHeight = tallest + 'px';
  });
  document.getElementById('caseSeg').innerHTML = CASES.map((k, i) => `<button type="button" data-case="${i}" aria-pressed="${i === caseAt}">${k[1]} ${k[2]}</button>`).join('');
  document.getElementById('pageSeg').innerHTML = G[c[3]].examples.map((x, i) => `<button type="button" data-page="${i}" aria-pressed="${i === at}">${i + 1}쪽</button>`).join('');
}
document.addEventListener('click', e => {
  const t = e.target;
  if(t.closest('[data-case]')){ caseAt = +t.closest('[data-case]').dataset.case; at = 0; return render(); }
  if(t.closest('[data-page]')){ at = +t.closest('[data-page]').dataset.page; return render(); }
  if(t.closest('[data-next]')){ if(at < G[CASES[caseAt][3]].examples.length - 1){ at++; render(); } return; }
  if(t.closest('[data-prev]')){ at--; return render(); }
  const ko = t.closest('[data-ko]'); if(ko) ko.closest('.ck-note').classList.toggle('ko-on');
});
fetch('../index.html').then(r => r.text()).then(h => {
  const lines = h.split('\n'), s = lines.findIndex(l => /^const GRAMMAR = \{/.test(l));
  let e = s; while(!/^\};/.test(lines[e])) e++;
  G = new Function(lines.slice(s, e + 1).join('\n') + ';return GRAMMAR;')();
  document.fonts.ready.then(render); render();
});
</script>
</body>
</html>
