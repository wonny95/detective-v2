<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>나무 간판 타이틀 디벨롭</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Jua&family=Pacifico&family=Caveat+Brush&family=Lilita+One&display=swap" rel="stylesheet">
<style>
@font-face{font-family:"Paperlogy";src:url("../assets/fonts/Paperlogy-4Regular.woff2") format("woff2");font-weight:400}
@font-face{font-family:"PD";src:url("../assets/fonts/Paperlogy-6SemiBold.woff2") format("woff2");font-weight:400}
:root{--paper:#FBF4E6;--ink:#4A3628}
body{margin:0;background:#A9B79C;font-family:"Paperlogy",sans-serif;color:var(--ink)}
header{padding:16px 20px 4px}
h1{font-family:PD;font-weight:400;font-size:20px;margin:0 0 4px}
header p{margin:0;font-size:13px;color:#3d3328;max-width:900px}
.replay{margin-top:8px;font:inherit;font-family:PD;padding:7px 14px;border:2px solid var(--ink);border-radius:12px;background:var(--paper);cursor:pointer}
.grid{display:flex;flex-wrap:wrap;gap:18px;padding:12px 20px 30px}
figure{margin:0}
figcaption{font-family:PD;font-size:15px;margin:0 0 6px}
figcaption span{display:block;font-family:Paperlogy;font-size:12px;color:#3d3328;max-width:280px;line-height:1.4;min-height:52px}
.phone{position:relative;width:280px;height:500px;border-radius:26px;overflow:hidden;background:url("../assets/places/christmas/tree.jpg") 50% 50%/auto 100%;box-shadow:0 4px 14px #0003}
.phone .who{position:absolute;left:50%;bottom:40px;height:330px;transform:translateX(-50%)}
.phone::after{content:"";position:absolute;left:0;right:0;bottom:0;height:64px;background:var(--paper)}
.card{position:absolute;inset:0;z-index:3;pointer-events:none;background:rgba(30,22,16,.4);animation:fade 3s ease forwards}
.sign{position:absolute;left:50%;top:104px;width:256px;margin-left:-128px;animation:drop 3s linear forwards}

/* the board: two planks, nails, grain */
.board{position:relative;padding:30px 26px 18px;text-align:center;border:3px solid #5E3B1C;border-radius:9px;
  background:linear-gradient(var(--b1,#A8743F) 0 50%,#3A2410 50% calc(50% + 3px),var(--b2,#9A6A38) calc(50% + 3px));box-shadow:3px 6px 0 rgba(0,0,0,.28)}
.board::before{content:"";position:absolute;inset:0;border-radius:6px;opacity:var(--grain,.5);
  background:repeating-linear-gradient(176deg,transparent 0 11px,rgba(110,74,40,.55) 11px 12.5px,transparent 12.5px 22px)}
.nail{position:absolute;width:8px;height:8px;border-radius:50%;background:#C9C2B4;border:1.5px solid #5E5040}
.nail.tl{left:9px;top:9px}.nail.tr{right:9px;top:9px}.nail.bl{left:9px;bottom:9px}.nail.br{right:9px;bottom:9px}

/* the case number plate sits on the top edge, sticking out above it */
.plate{position:absolute;left:50%;top:0;transform:translate(-50%,-55%);background:linear-gradient(#E6E0D2,#CFC7B5);border:2.5px solid #5E5040;border-radius:6px;
  padding:4px 18px;font-family:Fredoka,PD;font-weight:600;font-size:14px;letter-spacing:.12em;color:#3b2a1c;box-shadow:2px 3px 0 rgba(0,0,0,.25);white-space:nowrap}
.plate::before,.plate::after{content:"";position:absolute;top:50%;width:5px;height:5px;margin-top:-2.5px;border-radius:50%;background:#5E5040}
.plate::before{left:6px}.plate::after{right:6px}

.en{position:relative;font-family:Fredoka,PD;color:#FFF6E2;text-shadow:0 2px 0 #5E3B1C,0 0 6px rgba(60,35,15,.4);line-height:1.05}
.en .lo{display:block;font-weight:500;font-size:17px;letter-spacing:.06em;opacity:.95;margin-bottom:1px}
.en .hi{display:block;font-weight:700;font-size:33px;white-space:nowrap}
.en.inline .lo{display:inline;font-size:20px;margin:0 4px 0 0}
.en.inline .hi{display:inline;font-size:30px}
.en.same .hi{font-size:28px}
.ko{position:relative;font-family:Jua,Paperlogy;font-size:13px;color:#F6E6C6;margin-top:7px;text-shadow:0 1px 0 #5E3B1C}


/* designed title text (logo-like), on the two-line layout */
.en.logo .hi,.en.logo .lo{paint-order:stroke fill}
.en.l1 .hi{font-weight:700;font-size:34px;color:#FFF3D6;-webkit-text-stroke:5px #4A2A12;text-shadow:0 4px 0 #4A2A12,0 6px 0 rgba(0,0,0,.25)}
.en.l1 .lo{font-weight:600;font-size:16px;color:#F2CF73;-webkit-text-stroke:3.5px #4A2A12;letter-spacing:.14em;text-shadow:0 2px 0 #4A2A12}
.en.l2 .lo{font-weight:600;font-size:15px;color:#FFF3D6;letter-spacing:.2em;-webkit-text-stroke:3px #4A2A12;text-shadow:0 2px 0 #4A2A12;margin-bottom:-4px}
.en.l2 svg{display:block;width:232px;height:62px;margin:0 auto;overflow:visible}
.en.l2 text{font-family:Fredoka;font-weight:700;font-size:31px;fill:#FFF3D6;stroke:#4A2A12;stroke-width:6px;stroke-linejoin:round;paint-order:stroke fill;filter:drop-shadow(0 4px 0 #4A2A12)}
.en.l3 .hi{font-weight:700;font-size:34px;-webkit-text-stroke:6px #FFF8EA;paint-order:stroke fill;text-shadow:0 4px 0 #4A2A12,0 5px 6px rgba(0,0,0,.35)}
.en.l3 .hi .c1{color:#C2453A}.en.l3 .hi .c2{color:#E0A526}
.en.l3 .lo{font-weight:600;font-size:16px;color:#3E5A2C;-webkit-text-stroke:4px #FFF8EA;letter-spacing:.14em;text-shadow:0 2px 0 #4A2A12}
.sign.tall .board{padding-top:30px;padding-bottom:20px}

/* playful designed titles */
.en.p1 .lo{font-family:Pacifico;font-size:19px;color:#F2CF73;-webkit-text-stroke:4px #4A2A12;paint-order:stroke fill;display:block;width:max-content;transform:rotate(-8deg);margin:0 0 -3px 6px;text-shadow:0 2px 0 #4A2A12;position:relative;z-index:2}
.en.p1 .hi{font-family:Fredoka;font-weight:700;font-size:30px}
.en .ch{display:inline-block;color:#FFF3D6;-webkit-text-stroke:5.5px #4A2A12;paint-order:stroke fill;text-shadow:0 4px 0 #4A2A12}
.en .ch.sp{width:.28em}
.en.p2 .ribbon{display:inline-block;position:relative;background:#C2453A;color:#FFF3D6;font-family:Fredoka;font-weight:600;font-size:13px;letter-spacing:.18em;padding:3px 16px;transform:rotate(-3deg);box-shadow:0 2px 0 #4A2A12;margin-bottom:2px}
.en.p2 .ribbon::before,.en.p2 .ribbon::after{content:"";position:absolute;top:4px;border:9px solid #8E2E26;z-index:-1}
.en.p2 .ribbon::before{left:-12px;border-left-color:transparent}.en.p2 .ribbon::after{right:-12px;border-right-color:transparent}
.en.p2 .hi{font-family:'Lilita One';font-size:31px;transform:rotate(-3deg);letter-spacing:.01em;filter:drop-shadow(0 3px 0 #4A2A12)}
.en.p2 .hi .ch{text-shadow:none;-webkit-text-stroke:0;filter:drop-shadow(0 0 1.5px #4A2A12) drop-shadow(0 0 1.5px #4A2A12)}
.en.p2 .hi .ch{background:linear-gradient(#FFF6DA 30%,#F2C25A);-webkit-background-clip:text;background-clip:text;color:transparent}
.en .spark{position:absolute;color:#F2CF73;font-size:16px;-webkit-text-stroke:2px #4A2A12;paint-order:stroke fill}
.en.p3 .lo{font-family:'Caveat Brush';font-size:24px;color:#FFF3D6;-webkit-text-stroke:4px #4A2A12;paint-order:stroke fill;text-shadow:0 3px 0 #4A2A12;display:block;transform:rotate(-4deg);margin-bottom:-6px}
.en.p3 .hi{font-family:Fredoka;font-weight:700;font-size:30px}
.en.p3 .ch.cap{position:relative}
.en.p3 .ch.cap::before{content:"";position:absolute;left:4%;right:4%;top:.06em;height:.2em;background:#fff;border-radius:.2em .2em .08em .08em;box-shadow:0 1px 0 #cfd8e0;z-index:2}
.en.p3 .hi .w2 .ch{color:#F2CF73}
.en.p3 .snow{position:absolute;height:7px;background:#fff;border-radius:6px 6px 3px 3px;box-shadow:0 1px 0 #cfd8e0}
/* room on both sides of the title (user: it looked packed) */
.en{zoom:.86}
.cols{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}.cols b{font:13px PD}.cols button{font:13px Paperlogy;padding:5px 10px;border:2px solid var(--ink);border-radius:10px;background:var(--paper);cursor:pointer}.cols button[aria-pressed=true]{background:#F2CF73}
@keyframes fade{0%{opacity:0}8%{opacity:1}86%{opacity:1}100%{opacity:0}}
@keyframes drop{0%{transform:translateY(-330px)}14%{transform:translateY(0)}20%{transform:translateY(-16px)}26%{transform:translateY(0)}31%{transform:translateY(-5px)}36%,100%{transform:translateY(0)}}
.still .card,.still .sign{animation-delay:-1.6s!important;animation-play-state:paused!important}
</style></head>
<body>
<header>
  <h1>나무 간판 (줄 없음) 디벨롭</h1>
  <p>D–F는 제목 글씨를 로고처럼 디자인한 것(나중에 제목만 Higgsfield 그림으로 뽑아도 이 방향). 간판 위아래 여백을 늘리고, 사건 번호판을 간판 위 가장자리에 걸쳐 살짝 튀어나오게 했어요. 영어 제목은 꾸미는 말(Missing)은 작게, 핵심 말(Christmas Star)은 크게.</p>
  <button class="replay" type="button" onclick="play()">▶ 다시 보기</button>
  <button class="replay" type="button" onclick="hold()">⏸ 멈춘 화면</button>
  <div class="cols" id="cols"><b>간판 색</b>
    <button data-c="#A8743F,#9A6A38,.5">지금(밝은 갈색)</button>
    <button data-c="#6B4426,#5E3B20,.35">진한 호두나무</button>
    <button data-c="#4A2E1A,#40271A,.3">아주 진한 나무</button>
    <button data-c="#2F5A3A,#284E32,.25">초록 칠한 나무</button>
    <button data-c="#8E2F28,#7C2822,.25">빨강 칠한 나무</button></div>
</header>
<div class="grid" id="grid">
  <figure><figcaption>A · 두 줄로 나눔 (추천)<span>Missing을 위에 작게, Christmas Star를 아래 크게. 핵심 말을 가장 크게 쓸 수 있어요.</span></figcaption>
    <div class="phone"><img class="who" src="../assets/characters/ella-higgsfield.png" alt=""><div class="slot" data-k="stack"></div></div></figure>
  <figure><figcaption>B · 한 줄, 크기만 다름<span>한 줄에 Missing은 작게, Christmas Star는 크게. 문장처럼 이어 읽혀요. 긴 제목은 글씨가 조금 작아져요.</span></figcaption>
    <div class="phone"><img class="who" src="../assets/characters/ella-higgsfield.png" alt=""><div class="slot" data-k="inline"></div></div></figure>
  <figure><figcaption>C · 크기 같음 (비교용)<span>강조를 나누지 않고 같은 크기로 키우기만 한 것.</span></figcaption>
    <div class="phone"><img class="who" src="../assets/characters/ella-higgsfield.png" alt=""><div class="slot" data-k="same"></div></div></figure>
  <figure><figcaption>D · 로고: 진한 테두리 + 입체<span>크림색 글씨에 굵은 갈색 테두리와 아래로 두께감. 게임 로고 같은 느낌.</span></figcaption>
    <div class="phone"><img class="who" src="../assets/characters/ella-higgsfield.png" alt=""><div class="slot" data-k="logo l1"></div></div></figure>
  <figure><figcaption>E · 로고: 아치형<span>D에 핵심 말을 위로 살짝 휘게. 동화책·영화 포스터 제목 느낌이 가장 강해요.</span></figcaption>
    <div class="phone"><img class="who" src="../assets/characters/ella-higgsfield.png" alt=""><div class="slot" data-k="logo l2"></div></div></figure>
  <figure><figcaption>F · 로고: 사건 색 포인트<span>흰 테두리 스티커 글씨에 사건마다 색을 줌(크리스마스: Christmas 빨강, Star 금색, Missing 초록).</span></figcaption>
    <div class="phone"><img class="who" src="../assets/characters/ella-higgsfield.png" alt=""><div class="slot" data-k="logo l3"></div></div></figure>
  <figure><figcaption>G · 글자 통통 + 필기체<span>Missing은 기울어진 필기체로 모서리에 걸치고, 큰 글자는 하나씩 높이·각도가 달라 통통 튀어요.</span></figcaption>
    <div class="phone"><img class="who" src="../assets/characters/ella-higgsfield.png" alt=""><div class="slot" data-k="p1"></div></div></figure>
  <figure><figcaption>H · 리본 + 금빛 글씨<span>Missing은 빨간 리본 띠 위에, 큰 글씨는 두꺼운 금빛 그라데이션에 살짝 기울임, 반짝이 별.</span></figcaption>
    <div class="phone"><img class="who" src="../assets/characters/ella-higgsfield.png" alt=""><div class="slot" data-k="p2"></div></div></figure>
  <figure><figcaption>I · 붓글씨 + 사건 소품<span>Missing은 붓 글씨, Star는 금색, 글자 위에 눈이 소복이(사건마다 소품을 바꿈: 소풍은 잎, 바이올린은 음표).</span></figcaption>
    <div class="phone"><img class="who" src="../assets/characters/ella-higgsfield.png" alt=""><div class="slot" data-k="p3"></div></div></figure>
</div>
<script>
const BOUNCE = [[-3,-6],[2,4],[-2,-3],[3,5],[-1,-5],[2,3],[-3,-2],[1,6],[-2,-4],[0,0],[2,-5],[-3,4],[1,-2],[-2,5]];
function letters(word, wi, bounce, caps){ return [...word].map((c, i) => { const [y, r] = bounce ? BOUNCE[(i + wi * 9) % BOUNCE.length] : [0, 0]; return `<span class="ch${caps && caps.includes(i + wi * 100) ? ' cap' : ''}" style="transform:translateY(${y}px) rotate(${r}deg)">${c}</span>`; }).join(''); }
function playful(k){
  const words = ['Christmas', 'Star'];
  const caps = k === 'p3' ? [0, 4, 7, 100, 102] : null;
  const hi = words.map((w, wi) => `<span class="w${wi + 1}">${letters(w, wi, k !== 'p2', caps)}</span>`).join('<span class="ch sp"> </span>');
  if(k === 'p1') return `<span class="lo">Missing</span><span class="hi">${hi}</span>`;
  if(k === 'p2') return `<span class="ribbon">MISSING</span><span class="hi">${hi}</span><span class="spark" style="right:2px;top:20px">★</span><span class="spark" style="left:4px;bottom:2px;font-size:12px">★</span>`;
  return `<span class="lo">Missing</span><span class="hi">${hi}</span>`;
}
let n = 0;
const signHTML = k => (n++, `<div class="card"><div class="sign"><div class="board"><span class="nail tl"></span><span class="nail tr"></span><span class="nail bl"></span><span class="nail br"></span>
  <span class="plate">CASE 05</span>
  <div class="en ${k}">${k === 'same' ? '<span class="hi">Missing Christmas Star</span>'
    : k.includes('l2') ? '<span class="lo">Missing</span><svg viewBox="0 0 232 62"><path id="arc-${n}" d="M8 58 Q116 8 224 58" fill="none"/><text text-anchor="middle"><textPath href="#arc-${n}" startOffset="50%">Christmas Star</textPath></text></svg>'
    : /^p\d/.test(k) ? playful(k)
    : k.includes('l3') ? '<span class="lo">Missing</span><span class="hi"><span class="c1">Christmas</span> <span class="c2">Star</span></span>'
    : '<span class="lo">Missing</span><span class="hi">Christmas Star</span>'}</div>
  <div class="ko">사라진 크리스마스트리의 별</div></div></div></div>`);
function tw(el){ if(!el) return 0; const r = document.createRange(); r.selectNodeContents(el); return r.getBoundingClientRect().width; }
function fit(){ document.querySelectorAll('.en').forEach(e => { if(!e.querySelector('.hi') || /p\d/.test(e.className)) return; const hi = e.querySelector('.hi'), lo = e.querySelector('.lo'), inline = e.classList.contains('inline');
  const sc = e.closest('.board').getBoundingClientRect().width / 256; let f = parseFloat(getComputedStyle(hi).fontSize);
  const w = () => (inline ? tw(lo) + tw(hi) + 4 * sc : tw(hi)) / sc;
  while(w() > 230 && f > 14){ f -= .5; hi.style.fontSize = f + 'px'; if(inline) lo.style.fontSize = (f * .66) + 'px'; } }); }
function play(){ document.getElementById('grid').classList.remove('still'); document.querySelectorAll('.slot').forEach(s => s.innerHTML = signHTML(s.dataset.k)); fit(); }
function hold(){ play(); document.getElementById('grid').classList.add('still'); }
function setCol(b){ const [c1, c2, g] = b.dataset.c.split(','); const st = document.documentElement.style; st.setProperty('--b1', c1); st.setProperty('--b2', c2); st.setProperty('--grain', g);
  document.querySelectorAll('#cols button').forEach(x => x.setAttribute('aria-pressed', x === b)); }
document.querySelectorAll('#cols button').forEach(b => b.onclick = () => setCol(b));
setCol(document.querySelectorAll('#cols button')[1]);
document.fonts.ready.then(() => setTimeout(hold, 300));
</script>
</body></html>
