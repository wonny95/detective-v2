<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>레시피북 한 쪽 시안</title>
<style>
  body{margin:0;background:#E9E1D6;font-family:'Pretendard','Malgun Gothic',sans-serif;color:#3E2C22}
  header{padding:22px 28px 6px}
  h1{margin:0 0 6px;font-size:22px}
  header p{margin:0;font-size:14px;color:#6B5848;line-height:1.6}
  .row{display:flex;flex-wrap:wrap;gap:26px;padding:18px 28px 34px}
  .opt{width:330px}
  .opt h2{font-size:17px;margin:0 0 4px}
  .opt p{font-size:13px;margin:0 0 10px;color:#6B5848;line-height:1.5;min-height:58px}
  .pages{display:flex;flex-direction:column;gap:14px}
  svg{width:330px;height:auto;display:block;border-radius:14px;box-shadow:0 4px 14px rgba(60,40,30,.18)}
  .food-pick{padding:0 28px;font-size:14px}
  .food-pick button{font:inherit;margin:0 4px 6px 0;padding:5px 10px;border-radius:14px;border:1.5px solid #8B6E5A;background:#FFF8EA;cursor:pointer}
  .food-pick button.on{background:#C9708A;color:#fff;border-color:#6E3446}
</style>
</head>
<body>
<header>
  <h1>레시피북 한 쪽 · 시안 3개</h1>
  <p>지금 쪽은 그림·글자·쪽수만 있어 단어 카드처럼 보여요. 세 안 모두 <b>크게 꾸민 첫 글자</b>(누르는 곳)는 그대로 가장 눈에 띄게 두고, 재료·만드는 법을 더해 레시피처럼 보이게 했어요.<br>
  쪽 크기·자리는 게임과 같아요(352×396). 아래 음식 단추로 다른 쪽도 볼 수 있어요.</p>
</header>
<div class="food-pick" id="pick"></div>
<div class="row" id="row"></div>
<script>
const RB = '../assets/places/recipe/';
const HAND = `font-family="'Ink Free','Segoe Print','Comic Sans MS',cursive" fill="#3E2C22"`;
// page, cap, rest, food, ingredients, steps, time
const PAGES = [
  [80, 'P', 'ancakes', 'pancakes', ['2 cups flour', '1 cup milk', '2 eggs', 'butter, honey'], ['Mix it all.', 'Cook in a pan.', 'Add butter on top.'], '20 min'],
  [19, 'L', 'ollipops', 'lollipops', ['2 cups sugar', '1/2 cup water', 'lemon juice'], ['Boil the sugar.', 'Pour on sticks.', 'Let it cool.'], '30 min'],
  [16, 'E', 'gg tart', 'egg-tart', ['3 eggs', '1 cup milk', '1/2 cup sugar', 'pie crust'], ['Mix the eggs.', 'Pour in the crust.', 'Bake 20 min.'], '40 min'],
  [40, 'A', 'pple pie', 'apple-pie', ['4 apples', '2 cups flour', 'butter, sugar'], ['Cut the apples.', 'Fill the crust.', 'Bake 45 min.'], '1 hour']
];
let at = 0;
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
// the decorated first letter + the rest of the name, centred on cx
function title(cap, rest, cx, y, capW, size, restSize){
  const restW = rest.length * restSize * 0.5, total = capW + 8 + restW, x0 = cx - total / 2;
  return `<rect x="${x0}" y="${y}" width="${capW}" height="${capW}" rx="${capW * .18}" fill="#FCE4EC" stroke="#C2557A" stroke-width="3"/>` +
    `<rect x="${x0 + 5}" y="${y + 5}" width="${capW - 10}" height="${capW - 10}" rx="${capW * .12}" fill="none" stroke="#E89AB4" stroke-width="1.5" stroke-dasharray="4 4"/>` +
    `<text x="${x0 + capW / 2}" y="${y + capW * .76}" text-anchor="middle" font-size="${size}" font-weight="700" font-family="Georgia,serif" fill="#B23C68">${cap}</text>` +
    `<text x="${x0 + capW + 8}" y="${y + capW * .7}" font-size="${restSize}" font-family="Georgia,serif" fill="#4A3426">${esc(rest)}</text>`;
}
const frame = inner => `<svg viewBox="0 0 352 396" xmlns="http://www.w3.org/2000/svg"><rect width="352" height="396" rx="10" fill="#FFF8EA"/>` +
  `<rect width="18" height="396" fill="#EADBC4" opacity=".7"/>` + inner +
  `<image href="${RB}note.webp" x="304" y="10" width="40" height="53" transform="rotate(6 324 36)"/></svg>`;

// A · recipe card: title on top, a ruled line, picture right, ingredients with check boxes left, steps under, page number
function optA([n, cap, rest, food, ing, steps, time]){
  let s = title(cap, rest, 176, 22, 58, 42, 27);
  s += `<line x1="36" y1="94" x2="330" y2="94" stroke="#E2B9C6" stroke-width="2"/><text x="183" y="114" text-anchor="middle" font-size="13" font-family="Georgia,serif" fill="#9A7B66">⏱ ${time}</text>`;
  s += `<image href="${RB}food/${food}.webp" x="196" y="122" width="140" height="112" preserveAspectRatio="xMidYMid meet"/>`;
  s += `<text x="38" y="146" font-size="15" font-weight="700" font-family="Georgia,serif" fill="#B23C68">Ingredients</text>`;
  s += ing.map((t, i) => `<rect x="40" y="${158 + i * 22}" width="11" height="11" rx="2" fill="none" stroke="#8B6E5A" stroke-width="1.5"/><text x="58" y="${168 + i * 22}" font-size="15" ${HAND}>${esc(t)}</text>`).join('');
  s += `<text x="38" y="268" font-size="15" font-weight="700" font-family="Georgia,serif" fill="#B23C68">Steps</text>`;
  s += steps.map((t, i) => `<circle cx="47" cy="${283 + i * 25}" r="9" fill="#FCE4EC" stroke="#C2557A" stroke-width="1.5"/><text x="47" y="${288 + i * 25}" text-anchor="middle" font-size="12" font-weight="700" font-family="Georgia,serif" fill="#B23C68">${i + 1}</text><text x="64" y="${289 + i * 25}" font-size="15" ${HAND}>${esc(t)}</text>`).join('');
  s += `<text x="176" y="384" text-anchor="middle" font-size="18" font-family="Georgia,serif" fill="#8B6E5A">${n}</text>`;
  return frame(s);
}
// B · grandma's notebook: ruled paper with a margin line, the picture taped on, everything handwritten, a little stain
function optB([n, cap, rest, food, ing, steps]){
  let s = '';
  for(let y = 112; y < 370; y += 24) s += `<line x1="18" y1="${y}" x2="352" y2="${y}" stroke="#BFD3E6" stroke-width="1.2"/>`;
  s += `<line x1="58" y1="0" x2="58" y2="396" stroke="#F0A9B4" stroke-width="1.5"/>`;
  s += `<circle cx="292" cy="338" r="26" fill="#E9C98F" opacity=".22"/><circle cx="300" cy="346" r="12" fill="#E9C98F" opacity=".2"/>`;
  s += title(cap, rest, 176, 24, 62, 46, 28);
  s += `<g transform="rotate(4 268 172)"><rect x="200" y="116" width="134" height="112" fill="#fff" stroke="#E6D8C4"/><image href="${RB}food/${food}.webp" x="206" y="122" width="122" height="100" preserveAspectRatio="xMidYMid meet"/>` +
    `<rect x="244" y="106" width="48" height="16" fill="#F7C9D6" opacity=".85"/></g>`;
  s += `<text x="66" y="130" font-size="16" font-weight="700" ${HAND}>You need:</text>`;
  s += ing.map((t, i) => `<text x="70" y="${154 + i * 24}" font-size="15" ${HAND}>· ${esc(t)}</text>`).join('');
  s += steps.map((t, i) => `<text x="66" y="${274 + i * 24}" font-size="15" ${HAND}>${i + 1}. ${esc(t)}</text>`).join('');
  s += `<text x="300" y="${274 + 3 * 24}" text-anchor="end" font-size="14" fill="#C2557A" font-family="'Ink Free','Segoe Print',cursive">yum! ♥</text>`;
  s += `<text x="330" y="386" text-anchor="end" font-size="16" font-family="Georgia,serif" fill="#8B6E5A">${n}</text>`;
  return frame(s);
}
// C · printed cookbook: big picture on top with a soft frame, title, a small info bar, two columns
function optC([n, cap, rest, food, ing, steps, time]){
  let s = `<rect x="34" y="16" width="300" height="140" rx="10" fill="#F6E6D6"/><image href="${RB}food/${food}.webp" x="44" y="20" width="280" height="132" preserveAspectRatio="xMidYMid meet"/>`;
  s += title(cap, rest, 184, 166, 54, 40, 26);
  s += `<rect x="96" y="228" width="176" height="20" rx="10" fill="#FCE4EC"/><text x="184" y="242" text-anchor="middle" font-size="12" font-family="Georgia,serif" fill="#8A3A52">Serves 4  ·  ${time}</text>`;
  s += `<text x="38" y="270" font-size="13" font-weight="700" font-family="Georgia,serif" fill="#B23C68">INGREDIENTS</text>`;
  s += ing.map((t, i) => `<text x="38" y="${289 + i * 19}" font-size="12.5" font-family="Georgia,serif" fill="#4A3426">• ${esc(t)}</text>`).join('');
  s += `<line x1="184" y1="262" x2="184" y2="354" stroke="#E6D3C0" stroke-width="1.5"/>`;
  s += `<text x="196" y="270" font-size="13" font-weight="700" font-family="Georgia,serif" fill="#B23C68">STEPS</text>`;
  s += steps.map((t, i) => `<text x="196" y="${289 + i * 19}" font-size="12.5" font-family="Georgia,serif" fill="#4A3426">${i + 1}. ${esc(t)}</text>`).join('');
  s += `<text x="176" y="384" text-anchor="middle" font-size="16" font-family="Georgia,serif" fill="#8B6E5A">— ${n} —</text>`;
  return frame(s);
}
const OPTS = [
  ['A · 레시피 카드', '제목 아래 줄·시간, 오른쪽에 작은 그림, 왼쪽에 체크 칸이 있는 재료, 아래에 번호 붙은 만드는 법. 깔끔하고 어떤 음식이든 같은 틀.', optA],
  ['B · 할머니 손글씨 공책', '줄 공책에 손글씨, 사진은 테이프로 붙이고 얼룩·하트 한 점. 할머니가 직접 쓴 느낌이 가장 강해요(유산 이야기와 잘 맞음).', optB],
  ['C · 인쇄된 요리책', '큰 그림 위, 제목, 인분·시간 띠, 재료와 만드는 법 두 칸. 진짜 요리책 같지만 글자가 작아 폰에서 덜 읽힘.', optC]
];
function draw(){
  document.getElementById('pick').innerHTML = '음식: ' + PAGES.map((p, i) => `<button class="${i === at ? 'on' : ''}" data-i="${i}">${p[0]} ${p[1]}${p[2]}</button>`).join('');
  document.getElementById('row').innerHTML = OPTS.map(([h, d, f]) => `<div class="opt"><h2>${h}</h2><p>${d}</p><div class="pages">${f(PAGES[at])}</div></div>`).join('');
}
document.getElementById('pick').onclick = e => { const b = e.target.closest('button'); if(b){ at = +b.dataset.i; draw(); } };
draw();
</script>
</body>
</html>
