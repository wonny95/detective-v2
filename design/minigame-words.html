<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>단어 미니게임 시안</title>
<style>
  @font-face{font-family:"Paperlogy Display";src:url("../assets/fonts/Paperlogy-6SemiBold.woff2") format("woff2");font-weight:400}
  @font-face{font-family:"Paperlogy Display";src:url("../assets/fonts/Paperlogy-7Bold.woff2") format("woff2");font-weight:700}
  @font-face{font-family:"Paperlogy";src:url("../assets/fonts/Paperlogy-4Regular.woff2") format("woff2");font-weight:400}
  @font-face{font-family:"Paperlogy";src:url("../assets/fonts/Paperlogy-7Bold.woff2") format("woff2");font-weight:700}
  :root{
    --ground:#B6BDA5;--paper:#FBF4E6;--paper-2:#F4EAD4;--line:#E3D5B8;--ink:#4A3628;--ink-soft:#7D6A58;
    --moss:#8DB48E;--moss-deep:#5E8A63;--peach:#F6B89A;--honey:#F2CF73;--berry:#C96F86;--sky:#BFD3EE;--no:#C25B5B;
    --f-display:"Paperlogy Display","Paperlogy",system-ui,sans-serif;
    --r-wobble:18px 22px 16px 24px / 22px 16px 24px 18px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);font-family:"Paperlogy",system-ui,sans-serif;color:var(--ink)}
  h1{margin:20px 16px 4px;font-family:var(--f-display);font-size:22px}
  p.lead{margin:0 16px 18px;font-size:14px;line-height:1.55;max-width:960px}
  .row{display:flex;flex-wrap:wrap;gap:22px;padding:0 16px 32px}
  figure{margin:0;width:300px}
  figcaption{margin-top:10px;font-size:13px;line-height:1.5}
  figcaption b{display:block;font-family:var(--f-display);font-size:16px;margin-bottom:3px}
  figcaption ul{margin:4px 0 0;padding-left:18px}

  /* phone */
  .phone{position:relative;width:300px;height:580px;border-radius:28px;overflow:hidden;background:var(--paper);
    box-shadow:0 8px 20px rgba(0,0,0,.22);display:flex;flex-direction:column;user-select:none}
  .bar{display:flex;align-items:center;gap:8px;padding:12px 14px 8px;font-family:var(--f-display);font-size:16px}
  .bar .back{width:28px;height:28px;border-radius:50%;background:var(--paper-2);display:grid;place-items:center;font-size:15px}
  .bar .name{flex:1}
  .bar .prog{font-size:13px;color:var(--ink-soft)}
  .track{height:8px;margin:0 14px 10px;border-radius:6px;background:var(--line);overflow:hidden}
  .track i{display:block;height:100%;width:0;background:var(--honey);transition:width .3s}
  .body{flex:1;position:relative;padding:0 14px 14px;display:flex;flex-direction:column}
  .play{width:44px;height:44px;border-radius:50%;border:0;background:var(--honey);color:var(--ink);font-size:18px;cursor:pointer;
    box-shadow:0 3px 0 #C9A445;display:grid;place-items:center}
  .play:active{transform:translateY(2px);box-shadow:0 1px 0 #C9A445}
  .btn{border:0;border-radius:var(--r-wobble);background:var(--moss-deep);color:#fff;font-family:var(--f-display);font-size:16px;
    padding:12px 18px;cursor:pointer;box-shadow:0 3px 0 #3F6644}
  .btn:active{transform:translateY(2px);box-shadow:0 1px 0 #3F6644}
  .shake{animation:shake .4s}
  @keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
  .done{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(251,244,230,.92);z-index:5}
  .done.on{display:flex}
  .done img{width:140px;transform:rotate(-8deg)}
  .done b{font-family:var(--f-display);font-size:20px}
  .ph{font-size:10px;color:var(--ink-soft);text-align:center;margin-top:4px}

  /* 1 단서 잇기 */
  .cork{flex:1;position:relative;border:14px solid transparent;border-image:url(../assets/ui/corkboard-frame.webp) 60 fill / 14px stretch;
    background:url(../assets/ui/corkboard-cork.webp) center/cover;border-radius:6px}
  .cork .cols{position:absolute;inset:8px;display:flex;justify-content:space-between}
  .cork .col{display:flex;flex-direction:column;justify-content:space-around;width:44%}
  .note{position:relative;background:#FFFDF6;border-radius:3px;padding:12px 6px;text-align:center;font-size:15px;font-weight:700;
    box-shadow:0 2px 3px rgba(0,0,0,.25);cursor:pointer;transition:transform .15s,opacity .3s}
  .note:nth-child(odd){transform:rotate(-2deg)} .note:nth-child(even){transform:rotate(1.5deg)}
  .note.up{transform:scale(1.08);outline:3px solid var(--honey)}
  .note.ok{opacity:.55;pointer-events:none}
  .note .tack{position:absolute;top:50%;width:14px;height:14px;margin-top:-7px;background:url(../assets/ui/tack-red.webp) center/contain no-repeat}
  .col.l .tack{right:-7px} .col.r .tack{left:-7px}
  .note .stamp{position:absolute;right:2px;top:-6px;font-size:10px;color:var(--no);border:1.5px solid var(--no);border-radius:4px;padding:0 3px;transform:rotate(10deg);display:none;background:#fff}
  .note.ok .stamp{display:block}
  svg.str{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
  svg.str line{stroke:#C0392B;stroke-width:3;stroke-linecap:round}

  /* 2 철자 금고 */
  .safe{margin:14px auto 0;width:250px;padding:18px 14px 20px;border-radius:22px;background:linear-gradient(#7C8A93,#5E6B73);
    box-shadow:inset 0 -6px 0 rgba(0,0,0,.2),0 6px 10px rgba(0,0,0,.25);color:#fff;text-align:center}
  .safe .lock{font-size:34px;line-height:1}
  .dials{display:flex;justify-content:center;gap:8px;margin:12px 0 4px}
  .dial{width:54px;display:flex;flex-direction:column;align-items:center;gap:4px}
  .dial button{width:40px;height:26px;border:0;border-radius:8px;background:#46525A;color:#fff;cursor:pointer}
  .dial .ch{width:54px;height:62px;border-radius:12px;background:#FFFDF6;color:var(--ink);display:grid;place-items:center;
    font-family:var(--f-display);font-size:34px;box-shadow:inset 0 4px 6px rgba(0,0,0,.18)}
  .safe.open{background:linear-gradient(#8DB48E,#5E8A63)}
  .meaning{display:inline-block;margin-top:10px;padding:6px 16px 5px;background:#FFFDF6;color:var(--ink);border-radius:4px;
    font-family:var(--f-display);font-size:22px;transform:rotate(-1.5deg);box-shadow:0 2px 0 rgba(0,0,0,.2)}
  .center{display:flex;flex-direction:column;align-items:center;gap:10px}

  /* 3 암호 해독 */
  .pic{width:150px;height:150px;margin:6px auto 0;border-radius:18px;background:var(--paper-2);display:grid;place-items:center;font-size:92px;transition:filter .4s}
  .slots{display:flex;justify-content:center;gap:6px;margin:16px 0}
  .slot{width:30px;height:40px;border-bottom:3px solid var(--ink);display:grid;place-items:center;font-family:var(--f-display);font-size:26px}
  .keys{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:auto}
  .key{height:44px;border:0;border-radius:10px;background:#FFFDF6;font-family:var(--f-display);font-size:20px;color:var(--ink);cursor:pointer;box-shadow:0 3px 0 var(--line)}
  .key.hit{background:var(--moss);color:#fff;box-shadow:none}
  .key.miss{background:var(--line);color:var(--ink-soft);box-shadow:none}
  .hintrow{display:flex;justify-content:center;align-items:center;gap:10px;font-size:12px;color:var(--ink-soft)}

  /* 4 상자 분류 */
  .card4{margin:22px auto 0;width:200px;height:120px;border-radius:var(--r-wobble);background:#FFFDF6;box-shadow:0 4px 8px rgba(0,0,0,.18);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-family:var(--f-display);font-size:30px;transition:transform .35s,opacity .35s}
  .card4 .play{width:34px;height:34px;font-size:14px}
  .card4.flyL{transform:translate(-70px,230px) scale(.3);opacity:0}
  .card4.flyR{transform:translate(70px,230px) scale(.3);opacity:0}
  .boxes{margin-top:auto;display:flex;gap:12px}
  .box{flex:1;height:150px;border:0;border-radius:10px 10px 16px 16px;cursor:pointer;position:relative;
    background:linear-gradient(#D9B784,#C49A5E);box-shadow:inset 0 14px 0 rgba(0,0,0,.08),0 4px 0 #9C7744;font-family:var(--f-display);color:var(--ink)}
  .box .lbl{position:absolute;left:50%;top:44px;transform:translateX(-50%) rotate(-2deg);background:#FFFDF6;padding:6px 12px;border-radius:4px;font-size:16px;white-space:nowrap}
  .box .cnt{position:absolute;bottom:12px;left:0;right:0;font-size:13px}

  /* 5 단어 빙고 */
  .bingo{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
  .cell{aspect-ratio:1;border:0;border-radius:14px;background:#FFFDF6;font-size:44px;cursor:pointer;position:relative;box-shadow:0 3px 0 var(--line)}
  .cell.hit::after{content:"";position:absolute;inset:10%;background:url(../assets/ui/icons-v2/acorn.webp) center/70% no-repeat;opacity:.9}
  .cell.hit{background:#F6E7BF}
  .cell.win{background:var(--honey)}
  .callrow{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:6px}
  .callrow .q{font-size:13px;color:var(--ink-soft)}
</style>
</head>
<body>
<h1>사건 밖 단어 미니게임 시안</h1>
<p class="lead">사건과 관계없는 주제 단어로 하는 미니게임 5가지입니다. 다섯 화면 모두 눌러서 해 볼 수 있습니다.
지금 녹음이 있는 단어(fox, owl, dog, umbrella, book 등)로 만들었고, 단어 그림 자리는 이모지로 대신했습니다. 실제로는 Higgsfield 단어 그림 시트(16칸, 장당 약 2크레딧)로 바꿉니다.
화면 안에는 조작 설명을 넣지 않습니다(처음 한 번 탐정 앞발 시연). 마음에 드는 것을 번호로 골라 주세요.</p>

<div class="row">

<!-- 1 -->
<figure>
  <div class="phone" id="g1">
    <div class="bar"><span class="back">‹</span><span class="name">단서 잇기</span><span class="prog">0/5</span></div>
    <div class="track"><i></i></div>
    <div class="body">
      <div class="cork"><svg class="str"></svg><div class="cols"><div class="col l"></div><div class="col r"></div></div></div>
      <div class="done"><img src="../assets/ui/complete-stamp.webp" alt=""><b>단서 5개 연결!</b><button class="btn" data-reset>다시</button></div>
    </div>
  </div>
  <figcaption><b>① 단서 잇기 (짝 맞추기)</b>
    코르크 게시판에서 영어와 뜻을 빨간 실로 잇습니다. 영어 카드를 누르면 소리가 나고, 오른쪽에는 짝 없는 카드가 1장 섞여 있습니다.
    <ul><li>새 그림 없음(게시판·압정 재사용)</li><li>뜻 대신 그림이나 ▶ 소리로 바꾸면 난도가 올라감</li></ul></figcaption>
</figure>

<!-- 2 -->
<figure>
  <div class="phone" id="g2">
    <div class="bar"><span class="back">‹</span><span class="name">철자 금고</span><span class="prog">1/3</span></div>
    <div class="track"><i></i></div>
    <div class="body">
      <div class="center" style="margin-top:8px"><button class="play" data-play>▶</button></div>
      <div class="safe"><div class="lock">🔒</div><div class="meaning"></div><div class="dials"></div></div>
      <div class="center" style="margin-top:auto"><button class="btn" data-open>열기</button></div>
      <div class="done"><img src="../assets/ui/complete-stamp.webp" alt=""><b>금고 3개 열림!</b><button class="btn" data-reset>다시</button></div>
    </div>
  </div>
  <figcaption><b>② 철자 금고</b>
    금고에 붙은 뜻 쪽지(예: 여우)를 보고 소리를 들으며 다이얼을 돌려 철자를 맞춥니다. 칸마다 글자 4개 중 하나라서 알파벳 전체를 돌리지 않아도 됩니다.
    <ul><li>새 그림 없음(금고는 CSS, 나중에 소품 시트 가능)</li><li>3–5글자 단어에 맞음</li></ul></figcaption>
</figure>

<!-- 3 -->
<figure>
  <div class="phone" id="g3">
    <div class="bar"><span class="back">‹</span><span class="name">암호 해독</span><span class="prog">1/3</span></div>
    <div class="track"><i></i></div>
    <div class="body">
      <div class="pic"></div>
      <div class="ph">그림 자리</div>
      <div class="slots"></div>
      <div class="hintrow"><span class="miss-n"></span><button class="play" data-play style="width:34px;height:34px;font-size:13px;visibility:hidden">▶</button></div>
      <div class="keys"></div>
      <div class="done"><img src="../assets/ui/complete-stamp.webp" alt=""><b>암호 3개 해독!</b><button class="btn" data-reset>다시</button></div>
    </div>
  </div>
  <figcaption><b>③ 암호 해독 (글자 맞히기)</b>
    흐린 그림을 보고 글자를 하나씩 눌러 단어를 완성합니다. 목숨은 없고, 틀릴수록 그림이 선명해지며 두 번 틀리면 ▶ 소리가 열립니다.
    <ul><li>단어 그림 필요</li><li>철자 + 추리 느낌이 가장 강함</li></ul></figcaption>
</figure>

<!-- 4 -->
<figure>
  <div class="phone" id="g4">
    <div class="bar"><span class="back">‹</span><span class="name">증거 상자</span><span class="prog">0/8</span></div>
    <div class="track"><i></i></div>
    <div class="body">
      <div class="card4"><span class="w"></span><button class="play" data-play>▶</button></div>
      <div class="boxes"><button class="box" data-k="a"><span class="lbl">동물</span><span class="cnt">0</span></button><button class="box" data-k="o"><span class="lbl">물건</span><span class="cnt">0</span></button></div>
      <div class="done"><img src="../assets/ui/complete-stamp.webp" alt=""><b>증거 8개 분류!</b><button class="btn" data-reset>다시</button></div>
    </div>
  </div>
  <figcaption><b>④ 증거 상자 분류</b>
    단어 카드를 알맞은 상자에 넣습니다(동물 / 물건, 음식 / 탈것 등 주제를 바꿔 가며). 뜻을 몰라도 소리와 철자로 짐작하게 됩니다.
    <ul><li>새 그림 없음</li><li>가장 쉬움, 첫 판·워밍업용</li></ul></figcaption>
</figure>

<!-- 5 -->
<figure>
  <div class="phone" id="g5">
    <div class="bar"><span class="back">‹</span><span class="name">단어 빙고</span><span class="prog">0</span></div>
    <div class="track"><i></i></div>
    <div class="body">
      <div class="callrow"><button class="play" data-play>▶</button><span class="q">다시 듣기</span></div>
      <div class="bingo"></div>
      <div class="ph">그림 자리</div>
      <div class="done"><img src="../assets/ui/complete-stamp.webp" alt=""><b>빙고!</b><button class="btn" data-reset>다시</button></div>
    </div>
  </div>
  <figcaption><b>⑤ 단어 빙고</b>
    불러 주는 단어를 듣고 그림을 눌러 도토리를 놓습니다. 한 줄이 이어지면 빙고. 글자 없이 소리 ↔ 그림만 연결하는 듣기 판입니다.
    <ul><li>단어 그림·녹음 필요</li><li>3×3(쉬움) → 4×4(어려움)</li></ul></figcaption>
</figure>

</div>

<script>
const W = {
  fox:{ko:'여우',e:'🦊',k:'a'}, owl:{ko:'부엉이',e:'🦉',k:'a'}, dog:{ko:'개',e:'🐶',k:'a'}, goat:{ko:'염소',e:'🐐',k:'a'},
  umbrella:{ko:'우산',e:'☂️',k:'o'}, book:{ko:'책',e:'📕',k:'o'}, clock:{ko:'시계',e:'⏰',k:'o'}, guitar:{ko:'기타',e:'🎸',k:'o'},
  ladder:{ko:'사다리',e:'🪜',k:'o'}, bread:{ko:'빵',e:'🍞',k:'o'}, door:{ko:'문',e:'🚪',k:'o'}, pen:{ko:'펜',e:'🖊️',k:'o'}, lantern:{ko:'등불',e:'🏮',k:'o'}
};
let cur;
function say(w){
  if(cur){cur.pause();}
  cur = new Audio('../audio/words/'+w+'.wav');
  cur.play().catch(()=>{ try{const u=new SpeechSynthesisUtterance(w);u.lang='en-US';speechSynthesis.speak(u);}catch(e){} });
}
const shuffle = a => a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1]);
const $ = (r,s) => r.querySelector(s);
function shake(el){el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');}
function setProg(root,n,total,label){ $(root,'.prog').textContent = label ?? (n+'/'+total); $(root,'.track i').style.width = (n/total*100)+'%'; }
function finish(root){ $(root,'.done').classList.add('on'); }
function wireReset(root,fn){ $(root,'[data-reset]').onclick = ()=>{ $(root,'.done').classList.remove('on'); fn(); }; }

/* 1 단서 잇기 */
(function(){
  const root = document.getElementById('g1');
  function start(){
    const pairs = ['umbrella','fox','book','clock','owl'];
    const right = shuffle([...pairs,'goat']);
    const L = $(root,'.col.l'), R = $(root,'.col.r'), svg = $(root,'svg.str');
    L.innerHTML = R.innerHTML = svg.innerHTML = '';
    let pick = null, done = 0, lock = false;
    const mk = (w,side) => { const d=document.createElement('div'); d.className='note'; d.dataset.w=w; d.dataset.side=side;
      d.innerHTML = (side==='l'? w : W[w].ko) + '<span class="tack"></span><span class="stamp">확인</span>'; return d; };
    shuffle(pairs).forEach(w=>L.appendChild(mk(w,'l')));
    right.forEach(w=>R.appendChild(mk(w,'r')));
    setProg(root,0,5);
    root.querySelectorAll('.note').forEach(n=>n.onclick=()=>{
      if(lock) return;
      if(n.dataset.side==='l') say(n.dataset.w);
      if(!pick || pick.dataset.side===n.dataset.side){ if(pick) pick.classList.remove('up'); if(pick===n){pick=null;return;} pick=n; n.classList.add('up'); return; }
      const a=pick, b=n; a.classList.remove('up'); pick=null;
      if(a.dataset.w===b.dataset.w){
        const box=svg.getBoundingClientRect(), p=x=>x.querySelector('.tack').getBoundingClientRect();
        const pa=p(a), pb=p(b), ln=document.createElementNS('http://www.w3.org/2000/svg','line');
        ln.setAttribute('x1',pa.left+7-box.left); ln.setAttribute('y1',pa.top+7-box.top);
        ln.setAttribute('x2',pb.left+7-box.left); ln.setAttribute('y2',pb.top+7-box.top);
        svg.appendChild(ln); a.classList.add('ok'); b.classList.add('ok');
        done++; setProg(root,done,5); if(done===5) setTimeout(()=>finish(root),500);
      } else { shake(a); shake(b); lock=true; setTimeout(()=>lock=false,600); }
    });
  }
  wireReset(root,start); start();
})();

/* 2 철자 금고 */
(function(){
  const root = document.getElementById('g2');
  const AB='abcdefghijklmnopqrstuvwxyz'; let words, i, dials;
  function load(){
    const w = words[i]; setProg(root,i,3,(i+1)+'/3');
    $(root,'.meaning').textContent = W[w].ko;
    const box = $(root,'.dials'); box.innerHTML=''; $(root,'.safe').classList.remove('open'); $(root,'.lock').textContent='🔒';
    dials = [...w].map(ch=>{
      const opts = shuffle([ch,...shuffle([...AB].filter(c=>c!==ch)).slice(0,3)]);
      let k = opts.indexOf(ch); k = (k+1+Math.floor(Math.random()*3))%4; // never start on the answer
      const d=document.createElement('div'); d.className='dial';
      d.innerHTML='<button>▲</button><div class="ch"></div><button>▼</button>';
      const show=()=>d.querySelector('.ch').textContent=opts[k];
      d.children[0].onclick=()=>{k=(k+3)%4;show();}; d.children[2].onclick=()=>{k=(k+1)%4;show();};
      show(); box.appendChild(d); return {get:()=>opts[k]};
    });
    setTimeout(()=>say(w),200);
  }
  function start(){ words=shuffle(['fox','owl','dog','pen','book']).slice(0,3); i=0; load(); }
  $(root,'[data-play]').onclick=()=>say(words[i]);
  $(root,'[data-open]').onclick=()=>{
    if(dials.map(d=>d.get()).join('')===words[i]){
      $(root,'.safe').classList.add('open'); $(root,'.lock').textContent='🔓';
      setProg(root,i+1,3,(i+1)+'/3');
      setTimeout(()=>{ i++; if(i<3) load(); else finish(root); },900);
    } else shake($(root,'.safe'));
  };
  wireReset(root,start); start();
})();

/* 3 암호 해독 */
(function(){
  const root = document.getElementById('g3'); let words, i, got, miss;
  function blur(){ $(root,'.pic').style.filter='blur('+Math.max(0,12-miss*4)+'px)'; }
  function load(){
    const w=words[i]; got=new Set(); miss=0; setProg(root,i,3,(i+1)+'/3');
    $(root,'.pic').textContent=W[w].e; blur();
    $(root,'[data-play]').style.visibility='hidden'; $(root,'.miss-n').textContent='';
    const slots=$(root,'.slots'); slots.innerHTML=[...w].map(()=>'<span class="slot"></span>').join('');
    const extra=shuffle([...'abcdefghijklmnopqrstuvwxyz'].filter(c=>!w.includes(c))).slice(0,10-new Set(w).size);
    const keys=$(root,'.keys'); keys.innerHTML='';
    shuffle([...new Set(w),...extra]).forEach(c=>{
      const b=document.createElement('button'); b.className='key'; b.textContent=c;
      b.onclick=()=>{
        if(b.disabled) return; b.disabled=true;
        if(w.includes(c)){ b.classList.add('hit'); got.add(c);
          [...w].forEach((ch,j)=>{ if(ch===c) slots.children[j].textContent=c; });
          if([...w].every(ch=>got.has(ch))){ miss=3; blur(); say(w); setProg(root,i+1,3,(i+1)+'/3'); setTimeout(()=>{i++; if(i<3) load(); else finish(root);},1100); }
        } else { b.classList.add('miss'); miss++; blur(); shake($(root,'.slots'));
          if(miss>=2) $(root,'[data-play]').style.visibility='visible';
          $(root,'.miss-n').textContent = miss>=2 ? '소리 힌트' : ''; }
      };
      keys.appendChild(b);
    });
  }
  function start(){ words=shuffle(['clock','goat','bread','door','ladder']).slice(0,3); i=0; load(); }
  $(root,'[data-play]').onclick=()=>say(words[i]);
  wireReset(root,start); start();
})();

/* 4 증거 상자 */
(function(){
  const root=document.getElementById('g4'); let list,i,cnt;
  function show(){ const c=$(root,'.card4'); c.className='card4'; $(root,'.w').textContent=list[i]; say(list[i]); }
  function start(){ list=shuffle(['fox','umbrella','owl','book','dog','guitar','goat','lantern']); i=0; cnt={a:0,o:0};
    root.querySelectorAll('.cnt').forEach(c=>c.textContent=0); setProg(root,0,8); show(); }
  $(root,'[data-play]').onclick=()=>say(list[i]);
  root.querySelectorAll('.box').forEach(b=>b.onclick=()=>{
    if(i>=list.length) return;
    const c=$(root,'.card4'); if(c.classList.contains('flyL')||c.classList.contains('flyR')) return;
    if(W[list[i]].k===b.dataset.k){
      c.classList.add(b.dataset.k==='a'?'flyL':'flyR'); cnt[b.dataset.k]++; b.querySelector('.cnt').textContent=cnt[b.dataset.k];
      i++; setProg(root,i,8); setTimeout(()=>{ if(i<list.length) show(); else finish(root); },400);
    } else { shake(c); shake(b); }
  });
  wireReset(root,start); start();
})();

/* 5 단어 빙고 */
(function(){
  const root=document.getElementById('g5'); let cells,call,hits,left;
  const LINES=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  function next(){ call=left.splice(Math.floor(Math.random()*left.length),1)[0]; setTimeout(()=>say(call),300); }
  function start(){
    cells=shuffle(['fox','owl','dog','goat','umbrella','book','clock','guitar','bread']); hits=new Set(); left=[...cells];
    const g=$(root,'.bingo'); g.innerHTML='';
    cells.forEach((w,j)=>{ const b=document.createElement('button'); b.className='cell'; b.textContent=W[w].e;
      b.onclick=()=>{
        if(hits.has(j)) return;
        if(w===call){ hits.add(j); b.classList.add('hit'); setProg(root,hits.size,9,String(hits.size));
          const line=LINES.find(L=>L.every(x=>hits.has(x)));
          if(line){ line.forEach(x=>g.children[x].classList.add('win')); setTimeout(()=>finish(root),700); }
          else next();
        } else shake(b);
      }; g.appendChild(b); });
    setProg(root,0,9,'0'); next();
  }
  $(root,'[data-play]').onclick=()=>say(call);
  wireReset(root,start); start();
})();
</script>
