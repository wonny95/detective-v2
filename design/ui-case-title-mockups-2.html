<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>사건 타이틀 시안 2</title>
<style>
@font-face{font-family:"Paperlogy";src:url("../assets/fonts/Paperlogy-4Regular.woff2") format("woff2");font-weight:400}
@font-face{font-family:"Paperlogy";src:url("../assets/fonts/Paperlogy-7Bold.woff2") format("woff2");font-weight:700}
@font-face{font-family:"PD";src:url("../assets/fonts/Paperlogy-6SemiBold.woff2") format("woff2");font-weight:400}
@font-face{font-family:"PD";src:url("../assets/fonts/Paperlogy-7Bold.woff2") format("woff2");font-weight:700}
:root{--paper:#FBF4E6;--paper-2:#F4EAD4;--ink:#4A3628;--ink-soft:#7D6A58;--honey:#F2CF73;--berry:#C96F86;--red:#B8473C;--wood:#9A6A3F;--wood-d:#6E4A2A}
body{margin:0;background:#A9B79C;font-family:"Paperlogy",sans-serif;color:var(--ink)}
header{padding:16px 20px 4px}
h1{font-family:PD;font-weight:400;font-size:20px;margin:0 0 4px}
header p{margin:0;font-size:13px;color:#3d3328}
.replay{margin-top:8px;font:inherit;font-family:PD;padding:7px 14px;border:2px solid var(--ink);border-radius:12px;background:var(--paper);cursor:pointer}
.grid{display:flex;flex-wrap:wrap;gap:18px;padding:12px 20px 30px}
figure{margin:0}
figcaption{font-family:PD;font-size:15px;margin:0 0 6px}
figcaption span{display:block;font-family:Paperlogy;font-size:12px;color:#3d3328;max-width:280px;line-height:1.4;min-height:50px}
.phone{position:relative;width:280px;height:500px;border-radius:26px;overflow:hidden;background:url("../assets/places/picnic-storyboard/picnic-wide.png") 40% 50%/auto 100%;box-shadow:0 4px 14px #0003}
.phone .who{position:absolute;left:50%;bottom:40px;height:330px;transform:translateX(-50%)}
.phone::after{content:"";position:absolute;left:0;right:0;bottom:0;height:64px;background:var(--paper)}
.card{position:absolute;inset:0;z-index:3;display:grid;place-items:center;pointer-events:none}
.card small{display:block;font-family:PD;font-size:12px;letter-spacing:.22em}
.card b{display:block;font-family:PD;font-weight:700;white-space:nowrap}
.card i{display:block;font-style:normal;font-size:13px;margin-top:3px}

/* E — 돋보기 */
.e{background:rgba(30,22,16,.5);animation:fade 2.6s ease forwards}
.e .lens{position:relative;width:226px;height:226px;border-radius:50%;border:12px solid var(--wood-d);background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.95),var(--paper) 55%,var(--paper-2));box-shadow:inset 0 0 0 4px var(--honey),5px 8px 0 rgba(0,0,0,.25);display:grid;place-content:center;text-align:center;animation:lens 2.6s cubic-bezier(.2,.9,.3,1.25) forwards}
.e .lens::after{content:"";position:absolute;width:26px;height:96px;background:linear-gradient(90deg,var(--wood-d),var(--wood),var(--wood-d));border-radius:12px;right:-38px;bottom:-84px;transform:rotate(-45deg);box-shadow:3px 4px 0 rgba(0,0,0,.2)}
.e .lens::before{content:"";position:absolute;left:30px;top:22px;width:44px;height:20px;border-radius:50%;background:rgba(255,255,255,.8);transform:rotate(-30deg)}
.e small{color:var(--berry)}
.e b{font-size:21px;color:var(--ink)}
.e i{color:var(--ink-soft)}

/* F — 마을 신문 */
.f{background:rgba(30,22,16,.5);animation:fade 2.6s ease forwards}
.f .paper{width:236px;background:#F2EBDD;padding:10px 14px 14px;box-shadow:4px 6px 0 rgba(0,0,0,.25);text-align:center;animation:spin 2.6s cubic-bezier(.2,.8,.3,1) forwards}
.f .mast{font-family:PD;font-weight:700;font-size:13px;letter-spacing:.12em;border-bottom:3px double var(--ink);padding-bottom:4px}
.f .date{display:flex;justify-content:space-between;font-size:9px;color:var(--ink-soft);border-bottom:1px solid var(--ink);padding:3px 0;margin-bottom:8px}
.f small{color:var(--red)}
.f b{font-size:28px;line-height:1.15;margin:2px 0}
.f i{color:var(--ink-soft)}
.f .lines{margin-top:9px;height:26px;background:repeating-linear-gradient(transparent 0 5px,rgba(74,54,40,.25) 5px 7px)}

/* G — 나무 간판 */
.g{background:rgba(30,22,16,.35);animation:fade 2.6s ease forwards;place-items:start center}
.g .hang{margin-top:84px;transform-origin:50% -80px;animation:swing 2.6s ease-out forwards}
.g .rope{display:flex;justify-content:space-between;width:180px;margin:-80px auto 0;height:80px}
.g .rope span{width:3px;background:#C9A77A}
.g .board{width:244px;background:repeating-linear-gradient(0deg,var(--wood) 0 14px,#A87547 14px 16px,var(--wood) 16px 30px);border:4px solid var(--wood-d);border-radius:10px;padding:14px 10px 12px;text-align:center;box-shadow:4px 7px 0 rgba(0,0,0,.25);color:#FFF6E2}
.g small{color:var(--honey)}
.g b{font-size:26px;text-shadow:0 2px 0 var(--wood-d)}
.g i{color:#F4E3C4}

/* H — 동화책 챕터 */
.h{background:var(--paper);animation:pagefade 2.6s ease forwards}
.h .page{text-align:center;padding:0 20px;animation:rise 2.6s ease forwards}
.h .orn{font-size:20px;color:var(--berry);letter-spacing:.4em}
.h small{color:var(--ink-soft);margin:6px 0 10px}
.h b{font-size:31px;color:var(--ink)}
.h .rule{width:120px;height:2px;margin:12px auto 8px;background:linear-gradient(90deg,transparent,var(--ink),transparent)}
.h i{color:var(--ink-soft)}
.h .paw{margin-top:16px;font-size:22px;opacity:.5}

@keyframes fade{0%{opacity:0}10%{opacity:1}84%{opacity:1}100%{opacity:0}}
@keyframes pagefade{0%{opacity:0}12%{opacity:1}82%{opacity:1}100%{opacity:0}}
@keyframes lens{0%{transform:scale(.2) rotate(-40deg)}20%{transform:scale(1) rotate(0)}100%{transform:scale(1)}}
@keyframes spin{0%{transform:scale(.1) rotate(-540deg)}22%{transform:scale(1) rotate(-4deg)}100%{transform:rotate(-4deg)}}
@keyframes swing{0%{transform:translateY(-300px) rotate(0)}15%{transform:translateY(0) rotate(6deg)}25%{transform:rotate(-4deg)}34%{transform:rotate(2deg)}42%,100%{transform:rotate(0)}}
@keyframes rise{0%{transform:translateY(16px);opacity:0}20%{transform:translateY(0);opacity:1}100%{transform:none}}

/* I — 게시판 전단 */
.i{background:rgba(30,22,16,.45);animation:fade 2.6s ease forwards}
.i .board{position:relative;width:250px;padding:16px 14px;background:#C9945B radial-gradient(#b07c45 1px,transparent 1.5px) 0 0/7px 7px;border:8px solid var(--wood-d);border-radius:6px;box-shadow:4px 7px 0 rgba(0,0,0,.25);animation:rise 2.6s ease forwards}
.i .flyer{position:relative;background:#FFFDF6;padding:16px 10px 12px;text-align:center;transform:rotate(-2deg);box-shadow:2px 3px 0 rgba(0,0,0,.18);animation:pin 2.6s cubic-bezier(.2,.9,.3,1.3) forwards}
.i .flyer::before,.i .flyer::after{content:"";position:absolute;top:-6px;width:13px;height:13px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#f08a8a,var(--red));box-shadow:1px 2px 0 rgba(0,0,0,.3)}
.i .flyer::before{left:14px}.i .flyer::after{right:14px}
.i .help{font-family:PD;font-weight:700;font-size:15px;color:var(--red);letter-spacing:.18em}
.i small{color:var(--ink-soft);margin-top:2px}
.i b{font-size:27px;color:var(--ink);margin:3px 0}
.i i{color:var(--ink-soft)}
.i .tear{display:flex;justify-content:center;gap:4px;margin-top:9px}
.i .tear span{width:16px;height:22px;border:1px dashed var(--ink-soft);border-top:none}
.i .note2{position:absolute;right:10px;bottom:-14px;width:46px;height:40px;background:var(--honey);transform:rotate(8deg);box-shadow:1px 2px 0 rgba(0,0,0,.2)}

/* J — 나뭇잎 쪽지 */
.j{background:rgba(30,22,16,.4);animation:fade 2.6s ease forwards}
.j .leaf{position:relative;width:266px;height:166px;display:grid;place-content:center;text-align:center;animation:fall 2.6s ease-out forwards}
.j .leaf::before{content:"";position:absolute;inset:0;background:linear-gradient(160deg,#9CBF6A,#6E9A47);border-radius:0 80% 0 80%/0 100% 0 100%;transform:rotate(-8deg);box-shadow:3px 6px 0 rgba(0,0,0,.25);z-index:-1}
.j .leaf::after{content:"";position:absolute;left:8%;right:8%;top:50%;height:2px;background:rgba(255,255,230,.45);transform:rotate(-14deg);z-index:-1}
.j .stem{position:absolute;left:-14px;bottom:30px;width:30px;height:5px;background:#6B4F2A;border-radius:3px;transform:rotate(-30deg)}
.j small{color:#FFF6CF}
.j b{font-size:23px;color:#fff;text-shadow:0 2px 0 #4F6E31}
.j i{color:#F4F8E4}
@keyframes pin{0%{transform:translateY(-40px) rotate(-10deg);opacity:0}16%{transform:translateY(0) rotate(-2deg);opacity:1}100%{transform:rotate(-2deg)}}
@keyframes fall{0%{transform:translate(-60px,-280px) rotate(-30deg)}8%{transform:translate(50px,-200px) rotate(15deg)}14%{transform:translate(-30px,-110px) rotate(-12deg)}20%{transform:translate(15px,-40px) rotate(6deg)}26%,100%{transform:translate(0,0) rotate(0)}}
.still .card,.still .card *,.still .card::before,.still .card::after{animation-delay:-1.3s!important;animation-play-state:paused!important}
</style></head>
<body>
<header>
  <h1>사건 타이틀 시안 2 (E–H + 게시판·나뭇잎)</h1>
  <p>영어 제목 크게(The 없이), 한국어 제목 작게. 그림 없이 CSS로만 만들어 크레딧은 들지 않아요. 마음에 드는 방향이 있으면 Higgsfield 그림으로 더 다듬을 수 있어요.</p>
  <button class="replay" type="button" onclick="replay()">▶ 다시 보기</button>
  <button class="replay" type="button" onclick="hold()">⏸ 가운데에서 멈추기</button>
</header>
<div class="grid" id="grid">
  <figure><figcaption>E · 돋보기<span>커다란 돋보기가 빙글 돌며 다가오고, 렌즈 안에 제목. 탐정 게임이라는 게 한눈에 보여요.</span></figcaption>
    <div class="phone"><img class="who" src="../assets/characters/rosie-higgsfield.png" alt=""><div class="card e"><div class="lens"><small>CASE 01</small><b>Mixed-Up Bags</b><i>바뀐 소풍 가방</i></div></div></div></figure>
  <figure><figcaption>F · 마을 신문<span>옛날 영화처럼 신문이 빙글빙글 돌며 날아와 멈춰요. 머리기사가 사건 제목. 마을 이름(Acorn Hollow)도 살아나요.</span></figcaption>
    <div class="phone"><img class="who" src="../assets/characters/rosie-higgsfield.png" alt=""><div class="card f"><div class="paper"><div class="mast">ACORN HOLLOW NEWS</div><div class="date"><span>No. 01</span><span>SPECIAL CASE</span></div><small>CASE 01</small><b>Mixed-Up Bags</b><i>바뀐 소풍 가방</i><div class="lines"></div></div></div></div></figure>
  <figure><figcaption>G · 나무 간판<span>밧줄에 매달린 나무 간판이 위에서 내려와 흔들리다 멈춰요. 숲속 마을 동화 분위기.</span></figcaption>
    <div class="phone"><img class="who" src="../assets/characters/rosie-higgsfield.png" alt=""><div class="card g"><div class="hang"><div class="rope"><span></span><span></span></div><div class="board"><small>CASE 01</small><b>Mixed-Up Bags</b><i>바뀐 소풍 가방</i></div></div></div></div></figure>
  <figure><figcaption>H · 동화책 첫 장<span>화면 전체가 책의 새 장(章)으로 바뀌고, 가운데 제목. 장면이 확실히 끊겨서 "이제 시작"이 분명해요.</span></figcaption>
    <div class="phone"><img class="who" src="../assets/characters/rosie-higgsfield.png" alt=""><div class="card h"><div class="page"><div class="orn">✦ ✦ ✦</div><small>CASE 01</small><b>Mixed-Up Bags</b><div class="rule"></div><i>바뀐 소풍 가방</i><div class="paw">🐾</div></div></div></div></figure>
  <figure><figcaption>I · 게시판 전단<span>코르크 게시판에 "HELP!" 의뢰 전단이 압정으로 꽂혀요. 아래는 뜯어 가는 연락처 쪽지. 모든 사건이 의뢰로 시작하는 것과 맞아요.</span></figcaption>
    <div class="phone"><img class="who" src="../assets/characters/rosie-higgsfield.png" alt=""><div class="card i"><div class="board"><div class="flyer"><div class="help">HELP!</div><small>CASE 01</small><b>Mixed-Up Bags</b><i>바뀐 소풍 가방</i><div class="tear"><span></span><span></span><span></span><span></span><span></span></div></div><div class="note2"></div></div></div></div></figure>
  <figure><figcaption>J · 나뭇잎 쪽지<span>큰 나뭇잎이 팔랑팔랑 흔들리며 떨어지다 멈추고, 잎에 제목이 쓰여 있어요. 숲속 마을 느낌, 가볍고 귀여워요.</span></figcaption>
    <div class="phone"><img class="who" src="../assets/characters/rosie-higgsfield.png" alt=""><div class="card j"><div class="leaf"><span class="stem"></span><small>CASE 01</small><b>Mixed-Up Bags</b><i>바뀐 소풍 가방</i></div></div></div></figure>
</div>
<script>
function replay(){const g=document.getElementById('grid');g.classList.remove('still');document.querySelectorAll('.card').forEach(c=>{const n=c.cloneNode(true);c.replaceWith(n)})}
function hold(){replay();document.getElementById('grid').classList.add('still')}
hold();
</script>
</body></html>
