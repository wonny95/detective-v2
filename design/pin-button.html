<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>메모 압정 시안</title>
<style>
@font-face{font-family:"Paperlogy";src:url("../assets/fonts/Paperlogy-4Regular.woff2") format("woff2");font-weight:400}
@font-face{font-family:"Paperlogy";src:url("../assets/fonts/Paperlogy-7Bold.woff2") format("woff2");font-weight:700}
@font-face{font-family:"Paperlogy Display";src:url("../assets/fonts/Paperlogy-6SemiBold.woff2") format("woff2");font-weight:400}
:root{--ground:#B6BDA5;--paper:#FBF4E6;--paper-2:#F4EAD4;--ink:#4A3628;--ink-soft:#7D6A58;--honey:#F2CF73;--line:#E3D5B8;--berry:#C96F86;--sheet:#FDFAEE}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:"Paperlogy",system-ui,sans-serif}
.wrap{max-width:1240px;margin:0 auto;padding:28px 20px 56px}
h1{font-family:"Paperlogy Display","Paperlogy",sans-serif;font-weight:400;font-size:24px;margin:0 0 4px}
.lead{margin:0 0 22px;font-size:14px;opacity:.8;max-width:780px;line-height:1.6}
code{font-family:inherit;background:#F1E4C8;padding:0 4px;border-radius:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:30px 24px}
.opt h2{margin:0 0 8px;font-family:"Paperlogy Display","Paperlogy",sans-serif;font-weight:400;font-size:17px}
.opt p{margin:10px 2px 0;font-size:13px;line-height:1.55;color:var(--ink-soft)}
.rec{display:inline-block;padding:1px 8px;border-radius:10px;background:var(--honey);font-size:11px;vertical-align:2px}

/* a piece of the notebook page: a checked question, two evidence cards (one pinned), the evidence detail's buttons */
.page{background:var(--sheet);border-radius:8px;padding:16px 18px 18px;display:flex;flex-direction:column;gap:16px;box-shadow:0 2px 0 rgba(74,54,40,.12)}
.qlabel{font-size:13px;font-weight:700;color:var(--ink-soft)}
.qlabel .pin{float:right;margin:-8px -10px 0 4px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:16px 14px}
.cell{position:relative;display:flex}
.card{flex:1;display:flex;flex-direction:column;gap:2px;padding:6px 6px 8px;background:#FFFDF7;border:2px solid var(--ink);border-radius:5px;box-shadow:2px 3px 0 rgba(74,54,40,.12)}
.card .ph{aspect-ratio:4/3;border:1px solid var(--line);background:#556 url(../assets/places/library-higgsfield-v2.png) 30% 40%/260% auto}
.cell:nth-child(2) .ph{background-position:80% 70%}
.card b{font-size:14px;margin-top:3px}
.card small{font-size:11px;color:var(--ink-soft)}
.cell .pin{position:absolute;top:-10px;right:-10px}
.btns{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.pill{padding:3px 12px;border:1.5px solid var(--ink);border-radius:20px;background:#FFFDF7;font:inherit;font-size:12px}
.states{display:flex;gap:18px;margin-top:10px;font-size:12px;color:var(--ink-soft);align-items:center}
.states span{display:flex;align-items:center;gap:6px}

/* the button: the same spot and size as now (32px), a simple line icon in the notebook's ink */
.pin{position:relative;display:inline-grid;place-items:center;width:32px;height:32px;padding:0;border:0;border-radius:50%;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background .2s,box-shadow .2s}
.pin svg{width:20px;height:20px;overflow:visible;fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s cubic-bezier(.3,1.6,.5,1),opacity .2s}
.pin .fill{fill:none;transition:fill .2s}
.pin:active svg{transform:scale(.88)}
/* off: a cream dot with a thin line, so the icon reads on a photo too */
.pin:not(.on){background:#FFFDF7;box-shadow:inset 0 0 0 1.5px var(--line)}

/* ---- the cute push pins: a short needle, a round chunky head; off = grey outline lying tilted, on = berry head
   standing on a honey dot with a little shine ---- */
.pin .shine{fill:none;stroke:none}
.pin:not(.on) svg{stroke:var(--ink-soft);opacity:.65;transform:rotate(38deg)}
.pin.on{background:var(--honey);box-shadow:inset 0 0 0 1.5px var(--ink)}
.pin.on .fill{fill:var(--berry)}
.pin.on .shine{fill:#FFF4F0;opacity:.9}
.pin.on svg{transform:rotate(-8deg)}
.pin.on.just svg{animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:rotate(-8deg) translateY(-4px) scale(.8)}}
</style>
</head>
<body>
<div class="wrap">
  <h1>메모 압정 시안</h1>
  <p class="lead">진술·증거를 메모에 붙이는 버튼 — 켜짐/꺼짐이 한눈에 보이게. 게임에 적용한 안(사용자 선택). 고르지 않은 안: 손그림 압정 그림, 종이 동전, 종이 클립, 클립 끼우기, 납작 압정. 자리와 크기는 지금과 같다(질문 줄 오른쪽, 증거 카드 모서리, 증거 상세의 <code>해석</code> 옆). 아이콘은 단순한 선 아이콘(노트 잉크색, 사용자 요청: 압정 안, 바늘이 길면 안 귀여움 → 짧고 둥글게), 크레딧 없음. 압정을 눌러 켜고 꺼 볼 수 있어요.</p>
  <div class="grid" id="grid"></div>
</div>
<script>
const OPTS = [
  ['a1', '동글 압정', 1, '둥근 머리 + 짧은 바늘. 꺼짐: 크림 동그라미 안에 회색 선 압정이 비스듬히 누워 있다. 켜짐: 꿀색 동그라미 위에서 똑바로 서고 머리가 분홍, 작은 반짝임. 누르면 톡 꽂힌다.'],
];
const ICON = {
  a1:'<svg viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M12 2.8a4.2 4.2 0 0 1 2.6 7.5l.4 1.4h1.6a1.6 1.6 0 0 1 0 3.2H7.4a1.6 1.6 0 0 1 0-3.2H9l.4-1.4A4.2 4.2 0 0 1 12 2.8z"/><path d="M12 14.9v4.3"/><ellipse class="shine" cx="10.4" cy="6.1" rx="1.2" ry=".8" transform="rotate(-35 10.4 6.1)"/></svg>',
};
let K = 'a1';
const pin = on => `<button class="pin${on ? ' on' : ''}" type="button" aria-pressed="${on}">${ICON[K]}</button>`;
document.getElementById('grid').innerHTML = OPTS.map(([k, title, rec, text]) => (K = k, `<section class="opt ${k}"><h2>${title}${rec ? ' <span class="rec">사용자 선택</span>' : ''}</h2>
  <div class="page">
    <div class="qlabel">${pin(true)}Q. Who found the victim?</div>
    <div class="cards">
      <div class="cell"><div class="card"><span class="ph"></span><b>Window</b><small>Old Library</small></div>${pin(true)}</div>
      <div class="cell"><div class="card"><span class="ph"></span><b>Crayons</b><small>Old Library</small></div>${pin(false)}</div>
    </div>
    <div class="btns">${pin(false)}<span class="pill">해석</span></div>
  </div>
  <div class="states"><span>${pin(false)} 꺼짐</span><span>${pin(true)} 켜짐</span></div>
  <p>${text}</p></section>`)).join('');
document.addEventListener('click', e => {
  const b = e.target.closest('.pin'); if(!b) return;
  const on = !b.classList.contains('on');
  b.classList.toggle('on', on); b.setAttribute('aria-pressed', on);
  b.classList.toggle('just', on); if(on) setTimeout(() => b.classList.remove('just'), 380);
});
</script>
</body>
</html>
