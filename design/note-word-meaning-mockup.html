<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>노트 단어 뜻 시안</title>
<style>
@font-face{font-family:"Paperlogy Display";src:url("../assets/fonts/Paperlogy-6SemiBold.woff2") format("woff2")}
@font-face{font-family:"Paperlogy";src:url("../assets/fonts/Paperlogy-4Regular.woff2") format("woff2")}
body{margin:0;background:#B6BDA5;color:#4A3628;font-family:"Paperlogy",system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;padding:12px 20px;background:#E9ECDF;border-bottom:2px solid #9AA287}
header h1{margin:0;font-family:"Paperlogy Display";font-weight:400;font-size:18px}
header p{margin:4px 0 0;font-size:13px;color:#3E4A35}
.cols{display:flex;flex-wrap:wrap;justify-content:center;gap:22px;padding:20px 16px 40px}
.col{width:430px;display:flex;flex-direction:column;gap:8px}
.col h2{margin:0;font-family:"Paperlogy Display";font-weight:400;font-size:17px}
.col p{margin:0;min-height:76px;font-size:12.5px;line-height:1.5;color:#3E4A35}
iframe{width:430px;height:860px;border:0;border-radius:26px;box-shadow:0 6px 18px rgba(40,50,30,.25);background:#F8EED7}
</style>
</head>
<body>
<header>
  <h1>노트 · 맞힌 뒤에 단어 뜻 보기 시안</h1>
  <p>사용자 결정: 받아 적는 동안에는 뜻을 보여 주지 않고, 그 질문을 바르게 기록한 뒤에만. 실제 게임(우산 사건 엘라의 첫 노트)을 띄워 정답을 넣고 확인한 상태에 방법만 덧붙였다. 소리는 끔. 눌러 볼 수 있다.</p>
</header>
<div class="cols" id="cols"></div>
<script>
// meanings for this note: the blanks' words (the words the review list already teaches) and every word of the sentence
const BLANKS = [['left', '두고 갔다 (leave의 과거)'], ['owner', '주인']];
const MEAN = { someone:'누군가', left:'두고 갔다', that:'저, 그', umbrella:'우산', here:'여기에', can:'~할 수 있다', you:'너, 당신', help:'돕다', me:'나를', find:'찾다', its:'그것의', owner:'주인' };
const VARIANTS = [
  { id:'now', label:'지금', desc:'맞히면 단어 카드가 사라지고 지문(문장 전체)·▶·해석이 남는다. 해석은 문장 전체 한국어뿐.' },
  { id:'ko', label:'A · 해석에 함께 (추천)', desc:'해석을 누르면 문장 해석 아래에 빈칸 단어의 뜻 표(열쇠 카드와 같은 점선 표)가 함께 나온다. 새 버튼이 없고 "한국어는 해석을 눌러야만" 규칙 그대로.' },
  { id:'btn', label:'B · 단어 버튼 따로', desc:'해석 옆에 단어 버튼. 문장 해석과 단어 뜻을 따로 연다. 버튼이 하나 늘어난다.' },
  { id:'blank', label:'C · 맞힌 빈칸을 톡', desc:'초록으로 맞힌 빈칸 단어를 누르면 말풍선으로 뜻. 화면이 그대로지만 누를 수 있다는 것이 안 보인다(튜토리얼 필요). (owner를 누른 모습)' },
  { id:'word', label:'D · 지문의 모든 단어를 톡', desc:'지문의 아무 단어나 누르면 말풍선으로 뜻. 가장 넓게 도와주지만 모든 대사의 모든 단어에 뜻 데이터가 필요하다. (help를 누른 모습)' }
];
const CSS = `
.wm-tip{position:fixed;z-index:200;transform:translate(-50%,calc(-100% - 10px));padding:6px 11px 5px;border-radius:10px;background:#4A3628;color:#FFFDF7;font-family:var(--f-display);font-size:14px;line-height:1.3;white-space:nowrap;box-shadow:0 3px 8px rgba(40,30,20,.3);pointer-events:none}
.wm-tip b{font-weight:400;margin-right:7px;color:#F2CF73}
.wm-tip::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:#4A3628}
.wm-dict{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;margin:0;padding:7px 2px;border-top:1.5px dashed var(--line);font-size:14px;line-height:1.4}
.wm-dict[hidden]{display:none}
.wm-dict dt{font-family:var(--f-display)}
.wm-dict dd{margin:0;font-weight:700;color:var(--berry)}
.np-actions .wm-btn[aria-pressed="true"],.np-actions [data-passage-ko][aria-pressed="true"]{}
.wm-w{cursor:pointer;border-radius:4px}
.wm-w.on,.blank.wm-on{background:rgba(242,207,115,.55)!important}`;
const wait = ms => new Promise(r => setTimeout(r, ms));
async function setup(frame, v){
  const w = frame.contentWindow, d = frame.contentDocument;
  const play = w.HTMLMediaElement.prototype.play;
  w.HTMLMediaElement.prototype.play = function(){ this.muted = true; return play.call(this); };   // silent, but still ends
  const style = d.createElement('style'); style.textContent = CSS; d.head.appendChild(style);
  // ask e0, write the answers and check them
  // the greeting has to finish before the question can be asked: keep pressing it until the note's word cards are there
  let bank;
  for(let i = 0; i < 60 && !bank; i++){
    const q = [...d.querySelectorAll('button')].find(b => /How can I help/.test(b.textContent));
    if(q) q.click();
    await wait(700);
    bank = d.querySelector('#bank .word');
  }
  if(!bank) return;
  for(const ans of ['left', 'owner']){ [...d.querySelectorAll('#bank .word')].find(b => b.dataset.w === ans).click(); await wait(300); }
  d.querySelector('#finish').click();
  await wait(3200);
  after(d, v);
}
function tip(d, el, word){
  d.querySelectorAll('.wm-tip').forEach(t => t.remove()); d.querySelectorAll('.wm-on,.wm-w.on').forEach(x => x.classList.remove('wm-on', 'on'));
  const k = MEAN[word.toLowerCase()]; if(!k) return;
  el.classList.add(el.classList.contains('blank') ? 'wm-on' : 'on');
  const r = el.getBoundingClientRect(), t = d.createElement('div');
  t.className = 'wm-tip'; t.innerHTML = `<b>${word}</b>${k}`;
  t.style.left = (r.left + r.width / 2) + 'px'; t.style.top = r.top + 'px'; d.body.appendChild(t);
}
const dict = d => `<dl class="wm-dict">${BLANKS.map(([w, k]) => `<dt>${w}</dt><dd>${k}</dd>`).join('')}</dl>`;
function after(d, v){
  const passage = d.querySelector('.npassage'), ko = passage?.querySelector('.np-ko'), koBtn = passage?.querySelector('[data-passage-ko]');
  if(!passage) return;
  if(v === 'ko'){
    ko.insertAdjacentHTML('afterend', dict(d));
    const dl = passage.querySelector('.wm-dict');
    new MutationObserver(() => { dl.hidden = ko.hidden; }).observe(ko, { attributes:true, attributeFilter:['hidden'] });
    koBtn.click(); dl.hidden = ko.hidden;
  }
  if(v === 'btn'){
    ko.insertAdjacentHTML('afterend', dict(d));
    const dl = passage.querySelector('.wm-dict');
    koBtn.insertAdjacentHTML('afterend', '<button class="pill sm wm-btn" type="button" aria-pressed="true">단어</button>');
    const b = passage.querySelector('.wm-btn');
    b.onclick = () => { const on = b.getAttribute('aria-pressed') !== 'true'; b.setAttribute('aria-pressed', on); dl.hidden = !on; };
  }
  if(v === 'blank'){
    d.querySelectorAll('.nline .blank.ok').forEach(b => b.addEventListener('click', () => tip(d, b, b.value)));
    const o = d.querySelector('.blank.ok[data-ans="owner"]'); if(o) tip(d, o, 'owner');
    d.addEventListener('pointerdown', e => { if(!e.target.closest('.blank')) { d.querySelectorAll('.wm-tip').forEach(t => t.remove()); d.querySelectorAll('.wm-on').forEach(x => x.classList.remove('wm-on')); } });
  }
  if(v === 'word'){
    const p = passage.querySelector('p');
    p.innerHTML = p.textContent.replace(/[A-Za-z']+/g, m => `<span class="wm-w" data-w="${m}">${m}</span>`);
    p.querySelectorAll('.wm-w').forEach(s => s.addEventListener('click', () => tip(d, s, s.dataset.w)));
    const help = [...p.querySelectorAll('.wm-w')].find(s => s.dataset.w === 'help'); if(help) tip(d, help, 'help');
    d.addEventListener('pointerdown', e => { if(!e.target.closest('.wm-w')) { d.querySelectorAll('.wm-tip').forEach(t => t.remove()); d.querySelectorAll('.wm-w.on').forEach(x => x.classList.remove('on')); } });
  }
}
document.getElementById('cols').innerHTML = VARIANTS.map(v => `<section class="col"><h2>${v.label}</h2><p>${v.desc}</p><iframe data-v="${v.id}" src="../?case=umbrella&preview=talk"></iframe></section>`).join('');
document.querySelectorAll('iframe').forEach(f => f.addEventListener('load', () => setup(f, f.dataset.v)));
</script>
</body>
</html>
