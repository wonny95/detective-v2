<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>진술 내밀기 시안</title>
<style>
  :root{--bg:#EFE8DA;--fg:#3B2E25;--muted:#7A6A5C;--line:#D8CBB4;--accent:#34506E}
  body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;padding:24px max(16px,env(safe-area-inset-left,0px)) 40px max(16px,env(safe-area-inset-right,0px))}
  .wrap{display:flex;gap:28px;flex-wrap:wrap;align-items:flex-start}
  iframe{width:390px;height:844px;max-width:100%;border:0;border-radius:28px;box-shadow:0 6px 18px rgba(60,40,20,.25);background:#fff}
  .side{flex:1;min-width:260px;max-width:460px}
  h1{font-size:20px;margin:0 0 6px}
  p{margin:0 0 12px;color:var(--muted)}
  .opts{display:flex;flex-direction:column;gap:8px;margin:14px 0}
  .opts button{font:inherit;text-align:left;padding:10px 14px;border-radius:14px;border:1.5px solid var(--line);background:#fff;color:var(--fg);cursor:pointer}
  .opts button b{display:block;font-size:15px}
  .opts button span{color:var(--muted);font-size:13px}
  .opts button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <iframe id="game" src="../index.html?preview=interview" title="게임"></iframe>
  <div class="side">
    <h1>진술 내밀기 — 증거 서랍 시안</h1>
    <p>심문 장면에서 피오나가 "Mrs. Bear came in to buy bread at eight thirty."라고 할 때 여는 증거 서랍이에요. 사진 옆에 노트에 받아 적은 진술을 함께 담아요. 카드를 누르면 아래에 문장·▶·내밀기가 나와요(지금 사진과 같음).</p>
    <p>곰 부인 얼굴은 아직 그림이 없어 갈색 동그라미로 대신했어요.</p>
    <div class="opts" id="opts">
      <button type="button" data-v="a" aria-pressed="true"><b>A · 사진 / 진술 탭</b><span>서랍 위에 두 탭. 한 번에 한 종류만 보여요.</span></button>
      <button type="button" data-v="b" aria-pressed="false"><b>B · 한 줄에 함께</b><span>사진 뒤에 진술 쪽지가 이어져요. 쪽지는 줄 노트 종이 + 얼굴 압정.</span></button>
      <button type="button" data-v="c" aria-pressed="false"><b>C · 두 줄</b><span>위 줄 사진, 아래 줄 진술 쪽지(가로로 긴 메모).</span></button>
    </div>
  </div>
</div>
<script>
const SAYS = [
  { who:'bear', name:'Mrs. Bear', en:'The bakery was dark. The door was locked.', full:"Yes, I went at eight thirty to get my bread. But the bakery was dark, and the door was locked." },
  { who:'bear', name:'Mrs. Bear', en:"She didn't see Fiona.", full:"No. Nobody was there. So I came home with no bread." },
  { who:'duck', name:'Mr. Duck', en:'Ray never left the stage.', full:"No, never. I was behind the counter all night, and I watched him. He played twelve songs!" },
  { who:'fiona', name:'Fiona Fox', en:'Fiona was at the bakery from 7 PM to 10 PM.', full:"I was at my bakery all evening, from seven to ten. I was baking blueberry pies for the festival tomorrow." },
  { who:'mole', name:'Mrs. Mole', en:'The big clock was not ticking.', full:"I came back at nine to lock the door. The professor was on the floor, and the big clock was not ticking." }
];
const CSS = `
.mock-tabs{display:flex;gap:6px;margin-left:12px}
.mock-tabs .pill{min-height:30px;height:30px;padding:0 12px;font-size:13px}
.face{display:block;width:30px;height:30px;border-radius:50%;background:#FFF8E9 center/88% no-repeat;border:1.5px solid var(--ink);flex:none}
.face.bear{background:#A9744A}
/* a statement slip: lined note paper with the speaker's face pinned on it */
.scard{flex:none;width:118px;display:flex;flex-direction:column;gap:4px;padding:8px 8px 9px;text-align:left;scroll-snap-align:start;position:relative;
  background:#FFFDF2 repeating-linear-gradient(transparent 0 17px,rgba(120,150,190,.35) 17px 18px) 0 34px/100% auto no-repeat;
  border:2px solid var(--ink);border-radius:3px 8px 4px 6px;box-shadow:2px 3px 0 rgba(74,54,40,.15);transform:rotate(-1.2deg);transition:transform .2s,box-shadow .2s}
.scard:nth-child(even){transform:rotate(1deg)}
.scard .who{display:flex;align-items:center;gap:6px;font-family:var(--f-display);font-size:12.5px;line-height:1.1}
.scard .say{font-family:var(--f-hand);font-weight:700;font-size:12.5px;line-height:18px;color:var(--ink)}
.scard[aria-pressed="true"]{transform:translateY(-6px) rotate(-2deg);box-shadow:0 0 0 3px var(--berry),3px 8px 10px rgba(74,54,40,.25)}
/* C: the second row of long slips */
.mock-row-label{padding:0 16px;font-family:var(--f-display);font-size:13px;color:var(--ink-soft);margin-bottom:-12px}
.drawer-strip.says .scard{width:196px;flex-direction:row;align-items:flex-start;gap:8px}
.drawer-strip.says .scard .who span{display:none}
.drawer-strip.photos .dcard{width:92px}
`;
let v = 'a', tab = 'photo';
const f = document.getElementById('game');
const wait = ms => new Promise(r => setTimeout(r, ms));
function face(s){ return `<i class="face ${s.who}"${s.who === 'bear' ? '' : ` style="background-image:url(assets/ui/icons-v2/${s.who}.png)"`}></i>`; }
function slip(s, i){ return `<button class="scard" type="button" data-mock-say="${i}" aria-pressed="false"><span class="who">${face(s)}<span>${s.name}</span></span><span class="say">${s.en}</span></button>`; }
async function ready(){
  const d = f.contentDocument;
  for(let k = 0; k < 60 && !d.querySelector('[data-end="present"]'); k++){
    d.querySelector('[data-end="next"]')?.click(); await wait(400);
  }
  d.querySelector('[data-end="present"]')?.click(); await wait(500);
  const st = d.createElement('style'); st.textContent = CSS; d.head.appendChild(st);
  window.photos = d.getElementById('drawerStrip').innerHTML;
  render();
}
function render(){
  const d = f.contentDocument, drawer = d.getElementById('drawer'), strip = d.getElementById('drawerStrip');
  if(!drawer) return;
  drawer.querySelector('.mock-tabs')?.remove(); drawer.querySelectorAll('.mock-extra').forEach(x => x.remove());
  strip.className = 'drawer-strip';
  d.getElementById('drawerPick').hidden = true;
  const slips = SAYS.map(slip).join('');
  drawer.querySelector('.drawer-head h3').textContent = '증거';
  if(v === 'a'){
    drawer.querySelector('.drawer-head h3').insertAdjacentHTML('afterend', `<div class="mock-tabs"><button class="pill sm" type="button" data-mock-tab="photo" aria-pressed="${tab === 'photo'}">사진</button><button class="pill sm" type="button" data-mock-tab="say" aria-pressed="${tab === 'say'}">진술</button></div>`);
    strip.innerHTML = tab === 'photo' ? window.photos : slips;
  } else if(v === 'b'){
    strip.innerHTML = window.photos + slips;
  } else {
    strip.innerHTML = window.photos; strip.classList.add('photos');
    strip.insertAdjacentHTML('afterend', `<div class="mock-row-label mock-extra">진술</div><div class="drawer-strip says mock-extra">${slips}</div>`);
  }
  strip.scrollLeft = v === 'b' ? 9999 : 0;
}
f.onload = () => { const d = f.contentDocument;
  d.addEventListener('click', e => {
    const t = e.target.closest('[data-mock-tab]');
    if(t){ e.stopPropagation(); tab = t.dataset.mockTab; render(); return; }
    const s = e.target.closest('[data-mock-say]');
    if(s){
      e.stopPropagation();
      d.querySelectorAll('[data-mock-say],[data-pick]').forEach(x => x.setAttribute('aria-pressed', x === s));
      const say = SAYS[+s.dataset.mockSay], pick = d.getElementById('drawerPick');
      pick.innerHTML = `<p><b>${say.name}:</b> “${say.full}”</p><button class="pill big" type="button">내밀기</button>`; pick.hidden = false;
    }
  }, true);
  setTimeout(ready, 1200);
};
document.getElementById('opts').addEventListener('click', e => {
  const b = e.target.closest('[data-v]'); if(!b) return;
  v = b.dataset.v; document.querySelectorAll('#opts [data-v]').forEach(x => x.setAttribute('aria-pressed', x === b)); render();
});
</script>
</body>
</html>
