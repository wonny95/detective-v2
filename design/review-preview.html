<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>복습 화면 시안 · 숲속 탐정 Pioo</title>
<style>
@font-face{font-family:Paperlogy;src:url(../assets/fonts/Paperlogy-4Regular.woff2) format('woff2');font-weight:400}
@font-face{font-family:'Paperlogy Display';src:url(../assets/fonts/Paperlogy-6SemiBold.woff2) format('woff2');font-weight:400}
:root{--ground:#B6BDA5;--paper:#FBF4E6;--paper-2:#F4EAD4;--line:#E3D5B8;--ink:#4A3628;--ink-soft:#7D6A58;--moss:#8DB48E;--moss-deep:#5E8A63;--honey:#F2CF73;--berry:#C96F86;--sky:#BFD3EE;--ok:#5E8A63;--no:#C25B5B;--f-body:Paperlogy,system-ui,sans-serif;--f-display:'Paperlogy Display',Paperlogy,system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:14px;display:flex;justify-content:center;align-items:center;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px dashed var(--berry);outline-offset:2px}
img{max-width:100%}
.preview{width:100%;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:12px}
.preview-switch{display:flex;gap:7px;max-width:430px;width:100%;justify-content:center}
.preview-switch button{border:0;background:#FBF4E6cc;border-radius:10px;padding:7px 10px;font-family:var(--f-display);font-size:12px}
.preview-switch button[aria-pressed=true]{background:var(--honey)}
.app{width:100%;max-width:430px;height:min(820px,calc(100vh - 82px));min-height:620px;background:var(--paper);overflow:hidden;display:flex;flex-direction:column}
.review{height:100%;display:flex;flex-direction:column;gap:14px;padding:16px 16px 18px}
/* which step: dots above the button, like the case key's pages (user decision), the step shown in honey */
.rv-dots{flex:none;display:flex;justify-content:center;align-items:center;gap:9px;margin-bottom:-4px}
.rv-dots i{width:8px;height:8px;border-radius:50%;background:rgba(74,54,40,.22)}
.rv-dots i.now{background:#E0A526;transform:scale(1.3)}
.rv-body{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding:3px 2px 8px;scrollbar-width:none}
.rv-body.result-body{justify-content:center;padding-bottom:35px}
.rv-body::-webkit-scrollbar{display:none}
.rv-foot{flex:none}
.pill{--btn:url(../assets/ui/buttons/cream-flat.png);--bw:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:2px solid transparent;border-image:var(--btn) 60 62 62 62 fill / var(--bw) calc(var(--bw) * 1.03) stretch;background:none;padding:6px 12px;font-family:var(--f-display);font-size:14px;min-height:40px}
.pill.sm{min-height:32px;padding:3px 10px;font-size:12px}
.pill.big{--btn:url(../assets/ui/buttons/berry-flat.png);--bw:20px;width:100%;min-height:53px;font-size:15px}
.pill.hint{--btn:url(../assets/ui/buttons/honey-flat.png)}
.pill.green{--btn:url(../assets/ui/buttons/sage-flat.png)}
.pill:active{transform:translateY(1px)}
.pill:disabled{opacity:.48}
.play-btn{flex:none;width:32px;height:32px;border:0;padding:0;background:url(../assets/ui/icons/play.png) 58% 50%/46% auto no-repeat,url(../assets/ui/buttons/round-cream.png) center/100% no-repeat}
.rv-title{font-family:var(--f-display);font-weight:400;font-size:22px;line-height:1.35;margin:0}
.rv-sub{font-size:13px;color:var(--ink-soft);line-height:1.6;margin:0}
.rv-file{position:relative;align-self:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;width:min(80%,270px);margin:22px 0 8px;padding:12px 12px 12px;border:12px solid transparent;border-image:url(../assets/ui/casekey/card.webp) 20 fill / 12px stretch;filter:drop-shadow(2px 4px 4px rgba(70,50,30,.2));transform:rotate(-1.5deg);text-align:center}
.rv-file:before{content:"";position:absolute;left:50%;top:-31px;width:24px;height:33px;margin-left:-10px;background:url(../assets/ui/tack-red.webp) center/100% no-repeat;z-index:2}
.rv-file small{font-family:var(--f-display);font-size:13px;color:var(--berry)}
.rv-file b{font-family:var(--f-display);font-weight:400;font-size:20px}
.rv-file .stamp{position:absolute;right:-22px;top:14px;width:104px;transform:rotate(11deg);z-index:1}
/* the case's photo on the file (user decision: B, the stamp on the photo): the culprit's mugshot when someone was caught,
   the thing itself when something was found (cut from the place art, like an evidence photo) */
.rv-photo{position:relative;align-self:stretch;height:150px;margin-bottom:7px;border:5px solid #FFFDF8;box-shadow:0 1px 3px rgba(60,40,20,.25);overflow:hidden;background:#fff}
.rv-photo.mug{background:repeating-linear-gradient(to bottom,transparent 0 13px,rgba(74,54,40,.28) 13px 14px),linear-gradient(#DCD8CB,#CFCABC)}
.rv-photo.mug:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(to bottom,transparent 0 41px,rgba(74,54,40,.55) 41px 43px)}
/* her head and body sit at 41.7% of the picture's width (the tail takes the right): that point goes to the middle */
.rv-photo.mug .who{position:absolute;left:50%;bottom:-25%;width:72%;transform:translateX(-41.7%)}
.rv-photo .plate{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);padding:3px 8px;background:#2E2A27;color:#F3EBDD;border-radius:3px;font:700 9px/1.25 var(--f-body);letter-spacing:.06em;text-align:center;white-space:nowrap}
.rv-photo .plate b{display:block;font-family:var(--f-body);font-size:11px;letter-spacing:.08em}
.rv-stars{display:flex;justify-content:center;gap:9px;margin-top:8px}
.rv-stars img{width:49px;height:auto}
/* under the stars, three tiles of the same size, no sentences (user decision: B): blanks right at the first check, lines to
   hear again (honey: the next thing to do; ✓ 모두 맞힘 when there are none), new words */
.rv-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rv-tiles .tile{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px 9px;background:#FFFDF7;border:2px solid var(--line);border-radius:12px;font-size:12px;color:var(--ink-soft);text-align:center}
.rv-tiles .tile b{font-family:var(--f-display);font-weight:400;font-size:21px;color:var(--ink)}
.rv-tiles .tile b small{font-size:13px;color:var(--ink-soft)}
.rv-tiles .tile.hot{border-color:#E6C46A;background:#FFF7DE}
/* 다시 듣기, kept plain (user request): the question on its own line; under it, in a card like the word rows, the ▶ and
   천천히 of the answer (user request: not beside the question, which they do not play) and the note's line with its blanks (no first answers: with four cards they would give the answer away); right or wrong shows on the blanks only */
.rv-q{margin:0;font-family:var(--f-display);font-size:17px}
.rv-play{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-bottom:6px}
.rv-line{padding:14px 14px 12px;background:#FFFDF7;border:2px solid var(--line);border-radius:12px}
.rv-line p{margin:0;font-size:16px;line-height:2.1}
.rv-slot{display:inline-grid;place-items:center;min-width:66px;min-height:31px;margin:0 2px;padding:0 5px;border:0;border-radius:8px;background:rgba(125,106,88,.17);font:700 15px var(--f-body);color:#34506E}
.rv-slot.hit{background:rgba(94,138,99,.18);color:var(--ok)}
.rv-slot.miss{background:rgba(194,91,91,.15);color:var(--no)}
.rv-bank{display:flex;flex-wrap:wrap;gap:8px}
.word{min-height:36px;border:1.5px solid var(--ink);border-radius:12px 14px 11px 15px;background:#FFFDF7;padding:5px 12px;font-family:var(--f-body);font-weight:700;font-size:15px;box-shadow:1.5px 2px 0 rgba(74,54,40,.18)}
.rv-word{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:8px;padding:9px 10px;background:#FFFDF7;border:2px solid var(--line);border-radius:12px}
.rv-word.kept{border-color:#9FBF9F;background:#F2F7EC}
.rv-word .wword{font-family:var(--f-display);font-size:17px}
.rv-word .wko{display:block;font-size:12px;color:var(--berry);margin-top:3px}
.rv-word .keep{min-width:57px}
/* ▶ sits on the right, beside the row's own button (user request), as on the case key's notes */
/* the case's grammar: one word-page row per form (user request: the same clean rows as 새 단어), the form with its short
   name, the line from the case under it, ▶ plays that line, 해석 opens its Korean in the row */
.rv-gram{align-items:start}.rv-gram .play-btn,.rv-gram .pill{margin-top:2px}
.rv-gram .wword small{margin-left:7px;font-family:var(--f-body);font-size:12px;color:var(--ink-soft)}
.rv-gram .gsent{display:block;margin-top:4px;font-size:14px;line-height:1.45}
.word-list{display:flex;flex-direction:column;gap:8px}
.word-summary{font-size:13px;color:var(--ink-soft);margin:0}
@media(min-width:520px){.app{border-radius:38px 42px 36px 44px/44px 36px 42px 38px}}
@media(max-width:390px){.rv-photo{height:130px}.review{gap:12px}.rv-body{gap:12px}}
</style>
</head>
<body>
<div class="preview">
  <div class="preview-switch" aria-label="시안 화면 바로 보기">
    <button type="button" data-jump="0">사건 기록</button><button type="button" data-jump="1">다시 듣기</button><button type="button" data-jump="2">표현 정리</button><button type="button" data-jump="3">단어 담기</button>
  </div>
  <main class="app"><div class="review" id="review"></div></main>
</div>
<script>
const steps=['사건 기록','다시 듣기','표현 정리','단어 담기'];
const forms=[
  {head:'from A to B',name:'시작부터 끝까지',pattern:'from + 시작 시각 + to + 끝 시각',sentence:'I played my guitar on stage from eight to nine thirty.',ko:'나는 8시부터 9시 30분까지 무대에서 기타를 연주했어.'},
  {head:'at',name:'하나의 시각',pattern:'at + 시각',sentence:'The shop opens at eleven.',ko:'가게는 11시에 문을 열어요.'},
  {head:'between A and B',name:'두 시각 사이',pattern:'between + 시작 시각 + and + 끝 시각',sentence:'The bus comes between five and six.',ko:'버스는 5시에서 6시 사이에 와요.'}
];
const words=[['guitar','기타'],['stage','무대'],['cafe','카페'],['lantern','랜턴, 등불']];
const state={step:0,form:0,slots:['',''],checked:false,error:false,tr:new Set(),kept:new Set(['guitar'])};
const asset=p=>`../assets/ui/${p}`;
function playLine(text,slow=false){if(!('speechSynthesis' in window))return;window.speechSynthesis.cancel();const utter=new SpeechSynthesisUtterance(text);utter.lang='en-US';utter.rate=slow?.72:.9;window.speechSynthesis.speak(utter)}
function button(label,attrs='',extra=''){return `<button type="button" class="pill ${extra}" ${attrs}>${label}</button>`}
function render(){
 document.querySelectorAll('[data-jump]').forEach(b=>b.setAttribute('aria-pressed',Number(b.dataset.jump)===state.step));
 let content='',foot='';
 if(state.step===0){
  content=`<div class="rv-file"><div class="rv-photo mug"><img class="who" src="../assets/characters/fiona-sad.png" alt="피오나 폭스"><span class="plate"><b>FIONA FOX</b>ACORN HOLLOW · 01</span></div><img class="stamp" src="${asset('complete-stamp.png')}" alt="COMPLETE"><small>Case 01</small><b>도서관 살인사건</b></div><div class="rv-stars" aria-label="별 2개"><img src="${asset('star.png')}" alt=""><img src="${asset('star.png')}" alt=""><img src="${asset('star-empty.png')}" alt=""></div><div class="rv-tiles"><div class="tile"><b>26<small> / 30</small></b>받아 적기</div><div class="tile hot"><b>2</b>다시 들을 문장</div><div class="tile"><b>4</b>새 단어</div></div>`;
  foot=button('다음','data-next','big');
 }
 if(state.step===1){
  const ans=['8 PM','9:30 PM'],slot=k=>`<button class="rv-slot ${state.checked?'hit':state.error&&state.slots[k]&&state.slots[k]!==ans[k]?'miss':''}" type="button" data-slot="${k}" aria-label="${k?'끝':'시작'} 시각">${state.slots[k]||''}</button>`;
  content=`<h2 class="rv-title">다시 들을 문장 <small style="font-size:14px;color:var(--ink-soft)">1 / 2</small></h2><p class="rv-q">Where were you?</p><div class="rv-line"><div class="rv-play"><button class="play-btn" type="button" data-play="line" aria-label="대답 듣기"></button>${button('천천히','data-play="slow"','sm')}</div><p>He played the guitar from ${slot(0)} to ${slot(1)}.</p></div>${state.checked?'':`<div class="rv-bank">${['8 PM','9:30 PM','7 PM','10 PM'].map(w=>`<button type="button" class="word" data-word="${w}">${w}</button>`).join('')}</div>`}`;
  foot=state.checked?button('다음','data-next','big'):button('확인','data-check','big');
 }
 if(state.step===2){content=`<h2 class="rv-title">이번 사건의 문법</h2><div class="word-list">${forms.map((form,i)=>`<div class="rv-word rv-gram"><span><span class="wword">${form.head}<small>${form.name}</small></span><span class="gsent">${form.sentence}</span>${state.tr.has(i)?`<span class="wko">${form.ko}</span>`:''}</span><button type="button" class="play-btn" data-play="form-${i}" aria-label="예문 듣기"></button>${button('해석',`data-translate="${i}" aria-pressed="${state.tr.has(i)}"`,'sm')}</div>`).join('')}</div>`;foot=button('다음','data-next','big');}
 if(state.step===3){content=`<h2 class="rv-title">새 단어 <small style="font-size:14px;color:var(--ink-soft)">${state.kept.size} / ${words.length}</small></h2><p class="rv-sub">기억하고 싶은 단어를 수첩에 담아요.</p><div class="word-list">${words.map(([word,ko])=>`<div class="rv-word ${state.kept.has(word)?'kept':''}"><span><span class="wword">${word}</span><span class="wko">${ko}</span></span><button type="button" class="play-btn" data-play-word="${word}" aria-label="${word} 발음 듣기"></button>${button(state.kept.has(word)?'담음':'담기',`data-keep="${word}"`,'sm '+(state.kept.has(word)?'green':''))}</div>`).join('')}</div><p class="word-summary">${state.kept.size}개를 수첩에 담았어요.</p>`;foot=button('완료','data-done','big');}
 document.getElementById('review').innerHTML=`<div class="rv-body ${state.step===0?'result-body':''}">${content}</div><div class="rv-dots" aria-label="복습 ${state.step+1} / 4">${steps.map((_,i)=>`<i class="${i===state.step?'now':''}"></i>`).join('')}</div><div class="rv-foot">${foot}</div>`;
}
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.jump!==undefined){state.step=Number(b.dataset.jump);state.tr.clear();render();return;}
 if(b.hasAttribute('data-next')){state.step=Math.min(3,state.step+1);render();return;}
 if(b.hasAttribute('data-check')){state.checked=state.slots[0]==='8 PM'&&state.slots[1]==='9:30 PM';state.error=!state.checked;render();return;}
 if(b.dataset.word){const index=state.slots.findIndex(x=>!x);if(index>=0)state.slots[index]=b.dataset.word;state.error=false;render();return;}
 if(b.dataset.slot!==undefined&&!state.checked){state.slots[Number(b.dataset.slot)]='';render();return;}
 if(b.dataset.play){playLine(b.dataset.play.startsWith('form-')?forms[Number(b.dataset.play.slice(5))].sentence:'I was at the Lake Cafe. I played my guitar on stage from eight to nine thirty.',b.dataset.play==='slow');return;}
 if(b.dataset.playWord){playLine(b.dataset.playWord);return;}
 if(b.dataset.translate!==undefined){const i=Number(b.dataset.translate);state.tr.has(i)?state.tr.delete(i):state.tr.add(i);render();return;}
  if(b.dataset.keep){state.kept.has(b.dataset.keep)?state.kept.delete(b.dataset.keep):state.kept.add(b.dataset.keep);render();return;}
 if(b.hasAttribute('data-done')){state.step=0;render();}
});
render();
</script>
</body>
</html>
