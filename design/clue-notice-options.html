:root{--paper:#FBF4E6;--paper-2:#F4EAD4;--ink:#4A3628;--soft:#6f5946;--berry:#C96F86;--honey:#F2CF73}
*{box-sizing:border-box}body{margin:0;background:#e9dfcb;color:var(--ink);font-family:P,sans-serif;padding:24px 16px 40px}
h1{font:400 22px PD;margin:0 auto 4px;max-width:1080px}.lead{max-width:1080px;margin:0 auto 14px;font-size:14px;line-height:1.5;color:var(--soft);word-break:keep-all}
.bar{max-width:1080px;margin:0 auto 18px;display:flex;gap:8px;flex-wrap:wrap}
.bar button{font:400 14px PD;color:var(--ink);background:var(--paper);border:2px solid var(--ink);border-radius:14px;padding:8px 14px;min-height:44px;cursor:pointer}
.bar button[aria-pressed=true]{background:var(--honey)}

.chip{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--paper);border:2px solid var(--ink);border-radius:14px;padding:5px 14px;font:400 15px PD;white-space:nowrap}
.nav{position:absolute;inset:auto 0 0 0;height:64px;background:var(--paper-2);border-top:2px solid var(--ink);display:flex;z-index:5}
.nav div{flex:1;display:grid;place-items:center;align-content:center;font:400 10.5px PD;gap:1px}.nav img{width:34px;height:34px;object-fit:contain}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:8}
.play .flash{animation:fl .4s both}@keyframes fl{0%{opacity:0}25%{opacity:.9}100%{opacity:0}}
.item .flash{display:none}
.new{flex:none;font:400 10px PD;letter-spacing:.06em;background:var(--berry);color:#fff;border-radius:6px;padding:1px 5px}
.n{opacity:0;pointer-events:none;z-index:6}
.a{position:absolute;left:0;right:0;top:64px;display:flex;justify-content:center}
.a .pill{display:flex;align-items:center;gap:7px;max-width:94%;background:var(--paper);border-radius:999px;padding:4px 14px 4px 5px;box-shadow:0 3px 0 rgba(74,54,40,.25);font:400 14px PD;white-space:nowrap}
.a img{width:34px;height:34px;border-radius:50%;object-fit:cover;background:#fff}.item .a img{object-fit:contain;padding:3px}
.a b{font-weight:400}.a span.r{font:400 12.5px P}
.play .a{animation:pop 4.6s .45s both}@keyframes pop{0%{opacity:0;transform:scale(.6)}6%{opacity:1;transform:scale(1.08)}9%{transform:scale(1)}93%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-10px)}}
.b{position:absolute;left:14px;right:14px;top:66px}
.b .card{position:relative;display:flex;align-items:center;gap:14px;background:var(--paper);border:2px solid var(--ink);border-radius:6px 16px 8px 14px;padding:12px 14px 12px 12px;box-shadow:0 5px 0 rgba(74,54,40,.25)}
.b .card::before{content:"";position:absolute;left:38%;top:-10px;width:66px;height:18px;background:rgba(242,207,115,.85);transform:rotate(-3deg)}
.b.notape .card::before{display:none}
.b .pic{flex:none;width:86px;height:70px;background:#fff;padding:5px 5px 11px;box-shadow:0 2px 5px rgba(74,54,40,.35);transform:rotate(-5deg)}
.b .pic img{width:100%;height:100%;object-fit:cover;display:block}.item .b .pic{background:none;box-shadow:none;padding:0}.item .b .pic img{object-fit:contain}
.b .t{min-width:0;display:grid;gap:3px;justify-items:start}.b b{font:400 19px/1.15 PD}.b span.r{font-size:13px;color:var(--soft)}
.play .b{animation:slide 4.6s .45s both}@keyframes slide{0%{opacity:0;transform:translateX(-110%)}8%{opacity:1;transform:translateX(10px)}11%{transform:none}93%{opacity:1;transform:none}100%{opacity:0;transform:translateX(-110%)}}
.c{position:absolute;bottom:84px;left:50%;width:280px;margin-left:-140px}
.c .pol{position:relative;margin:0 auto;width:236px;background:#fff;padding:10px 10px 12px;box-shadow:0 5px 12px rgba(74,54,40,.4);text-align:center}
.c .pol img{display:block;width:100%;height:168px;object-fit:cover;background:#f5efe2}.item .c .pol img{object-fit:contain;padding:6px}
.c b{display:block;font:400 19px PD;margin-top:8px}.c .new{position:absolute;left:-12px;top:-8px;font-size:12px;padding:2px 7px;transform:rotate(-8deg)}
.c .r{display:table;margin:10px auto 0;background:var(--ink);color:var(--paper);border-radius:12px;padding:5px 12px;font-size:13px;white-space:nowrap}
.play .c{animation:hold 3.9s .45s both}.play .c .pol{--x:0px;animation:drop 3.9s .45s both}.play.item .c .pol{--x:108px}
/* the photo big (user request 2026-11-26: 사진이 크게) */
@keyframes hold{0%{opacity:0}4%{opacity:1}97%{opacity:1}100%{opacity:0}}
@keyframes drop{0%{transform:scale(1.5)}7%{transform:scale(.96) rotate(-4deg)}10%{transform:rotate(-3deg)}80%{transform:rotate(-3deg)}100%{transform:translate(var(--x),210px) scale(.14) rotate(-12deg)}}
.play .nav .go{animation:bump .5s 4.2s}@keyframes bump{40%{transform:scale(1.18)}}
@keyframes fade{0%{opacity:0}5%,95%{opacity:1}100%{opacity:0}}
@media(prefers-reduced-motion:reduce){.play .n{animation:fade 4.6s .2s both}.play .c .pol,.play .flash,.play .nav .go{animation:none}}
</style></head><body>
<h1>단서 알림 시안</h1>
<p class="lead">크리스마스 사건의 실제 그림으로 만든 움직이는 시안이에요. 화면을 누르면 다시 나와요. 이름만 보여 주고 무슨 뜻인지는 말하지 않아요.</p>
