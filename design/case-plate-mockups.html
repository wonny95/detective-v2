<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사건 번호 명판 시안</title>
<style>
  @font-face{font-family:"Paperlogy Display";src:url("../assets/fonts/Paperlogy-6SemiBold.woff2") format("woff2");font-weight:400}
  @font-face{font-family:"Paperlogy Display";src:url("../assets/fonts/Paperlogy-7Bold.woff2") format("woff2");font-weight:700}
  @font-face{font-family:"Paperlogy";src:url("../assets/fonts/Paperlogy-4Regular.woff2") format("woff2");font-weight:400}
  :root{--ink:#4A3628;--f-display:"Paperlogy Display","Paperlogy",system-ui,sans-serif}
  body{margin:0;background:#B6BDA5;font-family:"Paperlogy",system-ui,sans-serif;color:var(--ink)}
  h1{margin:20px 16px 4px;font-size:20px}
  p.lead{margin:0 16px 16px;font-size:14px;line-height:1.5;max-width:900px}
  .row{display:flex;flex-wrap:wrap;gap:18px;padding:0 16px 28px}
  figure{margin:0;width:260px}
  .phone{position:relative;width:260px;height:300px;border-radius:22px;overflow:hidden;background:#000 url(../assets/places/kite/park.webp) center/cover;box-shadow:0 6px 16px rgba(0,0,0,.25)}
  .phone::before{content:"";position:absolute;inset:0;background:rgba(30,22,16,.55)}
  figcaption{margin-top:8px;font-size:13px;line-height:1.45}
  figcaption b{display:block;font-size:15px;margin-bottom:2px}
  /* the game's own title card (index.html .stage-card), standing still */
  .hang{position:absolute;left:50%;top:96px;transform:translateX(-50%);width:min(244px,80%)}
  .sign{position:relative;border:15px solid transparent;border-image:url(../assets/ui/title-sign.webp) 44 fill / 15px stretch;padding:14px 6px 6px;text-align:center;filter:drop-shadow(4px 7px 0 rgba(0,0,0,.25));color:#FFF6E2}
  .sign b{display:block;font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.15;text-wrap:balance;text-shadow:0 2px 0 #6E4A2A}
  .sign small{display:block;font-size:13px;margin-top:6px;color:#F4E3C4}
  .no{position:absolute;left:50%;top:-15px;transform:translate(-50%,-55%);white-space:nowrap;font-family:var(--f-display);font-size:12px;line-height:1.2;letter-spacing:.22em;text-transform:uppercase}
  /* now: drawn with CSS */
  .no.css{padding:4px 12px 3px 14px;background:#6E4A2A;border:2px solid #F2CF73;border-radius:6px;box-shadow:0 2px 0 rgba(0,0,0,.25);color:#F2CF73}
  /* the pictures: the plate is a fixed-size picture under the live text (CASE 01–12 are all the same length) */
  .no.pic{display:grid;place-items:center;height:var(--h);width:var(--w);padding-left:.22em;box-sizing:border-box;background:var(--img) center/100% 100% no-repeat;filter:drop-shadow(0 2px 0 rgba(0,0,0,.25))}
  .p1{--img:url(../assets/ui/case-plate-1.webp);--w:118px;--h:40px;color:#F2CF73;text-shadow:0 1px 0 #3A2414}
  .p2{--img:url(../assets/ui/case-plate-2.webp);--w:122px;--h:38px;color:#6E4A2A;font-weight:700}
  .p3{--img:url(../assets/ui/case-plate-3.webp);--w:122px;--h:37px;color:#5A3A22;font-weight:700;padding-top:3px}
  .p4{--img:url(../assets/ui/case-plate-4.webp);--w:136px;--h:41px;color:#FFF0C8;padding-bottom:6px;text-shadow:0 1px 0 #6E2020}
</style>
</head>
<body>
<h1>사건 번호 명판 시안</h1>
<p class="lead">사건 시작 때 내려오는 나무 간판 위의 "CASE 01" 칸이에요. 맨 앞은 지금 모습(CSS로 그린 상자)이고, 나머지 넷은 Higgsfield로 그린 후보예요(한 장에 넷, 2크레딧). 글씨는 그림에 없고 화면에서 써요. 그래서 사건 번호가 바뀌어도 그림 하나로 다 쓸 수 있어요.</p>
<div class="row" id="row"></div>
<script>
const frames = [
  { cls:'css', t:'지금', d:'갈색 상자에 노란 테두리를 CSS로 그린 것.' },
  { cls:'pic p1', t:'1 · 진한 나무 판', d:'간판보다 어두운 나무에 금색 선. 지금 모양과 가장 가깝고, 간판과 같은 나무라 한 덩어리로 보여요.' },
  { cls:'pic p2', t:'2 · 놋쇠 명판', d:'양 끝에 나사가 박힌 금속 문패. 나무 간판 위에서 가장 눈에 띄어요.' },
  { cls:'pic p3', t:'3 · 못 박은 나무 조각', d:'밝은 판자를 못 두 개로 박은 것. 손으로 만든 느낌이 가장 강해요.' },
  { cls:'pic p4', t:'4 · 빨간 리본', d:'끝이 갈라진 천 리본에 금색 바느질. 색이 가장 달라서 번호가 먼저 보여요.' }
];
document.getElementById('row').innerHTML = frames.map(f => `<figure><div class="phone"><div class="hang"><div class="sign">
  <span class="no ${f.cls}">Case 01</span><b>The Lost Kite</b><small>잃어버린 연</small></div></div></div>
  <figcaption><b>${f.t}</b>${f.d}</figcaption></figure>`).join('');
</script>
</body>
</html>
