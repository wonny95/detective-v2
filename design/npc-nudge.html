<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>인물 부르는 모션 시안</title>
<style>
@font-face{font-family:"Paperlogy";src:url("../assets/fonts/Paperlogy-4Regular.woff2") format("woff2");font-weight:400}
@font-face{font-family:"Paperlogy";src:url("../assets/fonts/Paperlogy-7Bold.woff2") format("woff2");font-weight:700}
@font-face{font-family:"Paperlogy Display";src:url("../assets/fonts/Paperlogy-6SemiBold.woff2") format("woff2");font-weight:400}
:root{--ground:#B6BDA5;--paper:#FBF4E6;--ink:#4A3628;--ink-soft:#7D6A58;--honey:#F2CF73;--berry:#C96F86;
  --f-display:"Paperlogy Display","Paperlogy",system-ui,sans-serif;--f-hand:"Paperlogy",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--f-hand)}
.wrap{max-width:1600px;margin:0 auto;padding:28px 20px 56px}
h1{font-family:var(--f-display);font-weight:400;font-size:24px;margin:0 0 4px}
h3{font-family:var(--f-display);font-weight:400;font-size:19px;margin:30px 0 12px}
.lead{margin:0 0 10px;font-size:14px;opacity:.85;max-width:860px;line-height:1.6}
.grid{display:flex;flex-wrap:wrap;gap:26px 22px;align-items:flex-start}
.opt{width:250px;max-width:100%}
.opt h2{margin:0 0 8px;font-family:var(--f-display);font-weight:400;font-size:15px}
.opt p{margin:8px 2px 0;font-size:12.5px;line-height:1.55;color:var(--ink-soft)}

/* the phone (cropped round Ray): the cafe with Ray and Mr. Duck; only Ray still has questions */
.phone{position:relative;width:250px;max-width:100%;height:400px;border-radius:28px;overflow:hidden;background:#6B4A30 url(../assets/places/cafe-higgsfield.png) 62% 50%/auto 100% no-repeat;box-shadow:0 8px 24px rgba(40,30,20,.25);cursor:pointer;user-select:none}
.npc{position:absolute;bottom:7%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center}
.npc img{display:block;height:150px;transform-origin:50% 100%;animation:breathe 4.8s ease-in-out infinite}
.npc.duck{left:24%} .npc.duck img{height:140px}
.npc.ray{left:70%}
.tag{margin-top:-6px;padding:2px 8px;border:1.5px solid var(--ink);border-radius:12px;background:var(--paper);font-size:12px;font-weight:700;white-space:nowrap}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.008,1.012)}}

/* the mark over Ray's head (assets/ui/nudge-bang.png), stays until the player taps anything */
.mark{position:absolute;left:50%;bottom:100%;margin-bottom:6px;pointer-events:none;opacity:0;transform:translateX(-50%) scale(.2);transform-origin:50% 100%}
.mark img{display:block;height:100%;width:auto;filter:drop-shadow(1px 2px 1px rgba(52,32,17,.25))}
.go .mark{opacity:1;transform:translateX(-50%);animation:mark-in .45s cubic-bezier(.3,1.6,.5,1) both}
@keyframes mark-in{from{opacity:0;transform:translateX(-50%) scale(.2)}}
/* 느낌표: a little jump and wiggle every few seconds */
.bang .mark{height:var(--h,52px)}
.bang.go .mark img{transform-origin:50% 100%;animation:bang 2.4s ease-in-out .5s infinite}
@keyframes bang{0%,62%,100%{transform:none}70%{transform:translateY(-8px) rotate(-8deg)}78%{transform:translateY(0) rotate(6deg) scale(1.05,.95)}86%{transform:rotate(-3deg)}94%{transform:none}}
@media(prefers-reduced-motion:reduce){.go .mark,.go .mark img{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <h1>인물 부르는 모션 시안</h1>
  <p class="lead">고른 안: 말풍선 속 느낌표(사용자 결정). 게임에 적용했어요(장소 화면에서 약 8초 동안 입력이 없으면 물어볼 게 남은 인물 한 명 위에 뜨고, 아무 입력에 사라짐). 시안에서는 3초 뒤에 떠요.</p>
  <div class="grid" id="bangs"></div>
</div>
<script>
// [file, title, note, height on screen]
const BANGS = [
  ['nudge-bang', '말풍선 속 느낌표 (적용)', '크림 말풍선 안의 빨간 느낌표. 몇 초마다 톡 뛰며 흔들려요.', 44],
];
const phone = (kind, [file, title, note, h]) => `<section class="opt"><h2>${title}</h2>
  <div class="phone ${kind}" style="--h:${h}px">
    <div class="npc duck"><img src="../assets/characters/duck-higgsfield.png" alt=""><span class="tag">Mr. Duck</span></div>
    <div class="npc ray"><span class="mark"><img src="../assets/ui/${file}.png" alt=""></span><img src="../assets/characters/ray-higgsfield.png" alt=""><span class="tag">Ray</span></div>
  </div><p>${note}</p></section>`;
document.getElementById('bangs').innerHTML = BANGS.map(o => phone('bang', o)).join('');

// every phone counts its own quiet time: after 3s the mark shows and stays until that phone is tapped
document.querySelectorAll('.phone').forEach(ph => {
  let quiet = 0;
  setInterval(() => { quiet += .5; if(quiet === 3) ph.classList.add('go'); }, 500);
  ph.addEventListener('pointerdown', () => { quiet = 0; ph.classList.remove('go'); });
});
</script>
</body>
</html>
