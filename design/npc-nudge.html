<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>인물 부르는 모션 시안</title>
<style>
@font-face{font-family:"Paperlogy";src:url("../assets/fonts/Paperlogy-4Regular.woff2") format("woff2");font-weight:400}
@font-face{font-family:"Paperlogy";src:url("../assets/fonts/Paperlogy-7Bold.woff2") format("woff2");font-weight:700}
@font-face{font-family:"Paperlogy Display";src:url("../assets/fonts/Paperlogy-6SemiBold.woff2") format("woff2");font-weight:400}
:root{--ground:#B6BDA5;--paper:#FBF4E6;--ink:#4A3628;--ink-soft:#7D6A58;--honey:#F2CF73;--berry:#C96F86;
  --f-display:"Paperlogy Display","Paperlogy",system-ui,sans-serif;--f-hand:"Paperlogy",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--f-hand)}
.wrap{max-width:1600px;margin:0 auto;padding:28px 20px 56px}
h1{font-family:var(--f-display);font-weight:400;font-size:24px;margin:0 0 4px}
.lead{margin:0 0 22px;font-size:14px;opacity:.85;max-width:860px;line-height:1.6}
.grid{display:flex;flex-wrap:wrap;gap:34px 28px;align-items:flex-start}
.opt{width:340px;max-width:100%}
.opt h2{margin:0 0 10px;font-family:var(--f-display);font-weight:400;font-size:17px;display:flex;align-items:center;gap:8px}
.opt p{margin:12px 2px 0;font-size:13px;line-height:1.6;color:var(--ink-soft)}
.rec{display:inline-block;padding:1px 8px;border-radius:10px;background:var(--honey);font-size:11px}
.clock{margin-left:auto;font-family:var(--f-hand);font-size:12px;color:var(--ink-soft)}

/* the phone: the cafe with Ray and Mr. Duck (Ray still has questions, so only he calls) */
.phone{position:relative;width:340px;max-width:100%;height:600px;border-radius:34px;overflow:hidden;background:#6B4A30 url(../assets/places/cafe-higgsfield.png) 58% 50%/auto 100% no-repeat;box-shadow:0 10px 30px rgba(40,30,20,.25);cursor:pointer;user-select:none}
.npc{position:absolute;bottom:9%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center}
.npc img{display:block;height:180px;transform-origin:50% 100%;animation:breathe 4.8s ease-in-out infinite}
.npc.duck{left:26%} .npc.duck img{height:168px}
.npc.ray{left:72%}
.tag{margin-top:-6px;padding:2px 8px;border:1.5px solid var(--ink);border-radius:12px;background:var(--paper);font-size:13px;font-weight:700;white-space:nowrap}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.008,1.012)}}

/* A. 콩 뛰기 + "…" 말풍선 */
.a .ray.go img{animation:hop 1s ease-out}
@keyframes hop{0%,100%{transform:none}10%{transform:scale(1.04,.95)}24%{transform:translateY(-14px) scale(.97,1.04)}38%{transform:scale(1.03,.96)}52%{transform:translateY(-8px)}66%,100%{transform:none}}
.dots{position:absolute;left:62%;bottom:100%;margin-bottom:-4px;width:74px;height:46px;display:flex;align-items:center;justify-content:center;gap:6px;opacity:0;transform:scale(.4);transform-origin:20% 100%;filter:drop-shadow(1px 2px 1px rgba(52,32,17,.25))}
.dots::before{content:"";position:absolute;inset:0;z-index:-1;background-color:#FFF8E9;background-clip:padding-box;border:12px solid transparent;border-image:url(../assets/ui/speech-paper-frame.png) 150 190 fill / 18px 22px / 0 stretch}
.dots::after{content:"";position:absolute;left:14px;bottom:-12px;width:24px;height:16px;background:url(../assets/ui/speech-paper-tail-pencil.png) center/contain no-repeat;transform:rotate(18deg)}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--ink)}
.a .ray.go .dots{animation:dots-in 2.6s ease-out both}
.a .ray.go .dots i{animation:dot 0.9s ease-in-out infinite}
.a .ray.go .dots i:nth-child(2){animation-delay:.15s}.a .ray.go .dots i:nth-child(3){animation-delay:.3s}
@keyframes dots-in{0%{opacity:0;transform:scale(.4)}12%{opacity:1;transform:scale(1.08)}20%,80%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.9)}}
@keyframes dot{0%,100%{transform:translateY(0);opacity:.45}40%{transform:translateY(-4px);opacity:1}}

/* B. 손 흔들기 + 이름표 */
.b .ray.go img{animation:sway 1.4s ease-in-out}
@keyframes sway{0%,100%{transform:none}20%{transform:rotate(-4deg)}45%{transform:rotate(3.5deg)}70%{transform:rotate(-2deg)}}
.b .ray.go .tag{animation:tag 1.6s ease-in-out}
@keyframes tag{0%,100%{background:var(--paper)}25%,70%{background:var(--honey);transform:scale(1.08)}}

/* C. 발밑 빛 고리 */
.ring{position:absolute;left:50%;bottom:6px;width:200px;height:48px;margin-left:-100px;border-radius:50%;pointer-events:none;opacity:0;border:3px solid #F2CF73;background:radial-gradient(closest-side,rgba(255,236,170,.7),rgba(255,236,170,0));box-shadow:0 0 12px 3px rgba(255,226,140,.7)}
.c .ray.go .ring{animation:ring 1.6s ease-in-out 2}
.c .ray.go .ring+.ring{animation-delay:.5s}
@keyframes ring{0%{opacity:0;transform:scale(.4)}15%{opacity:1}60%{opacity:.85}100%{opacity:0;transform:scale(1.15)}}

/* D. 손가락 */
.hand{position:absolute;left:70%;top:56%;width:54px;height:62px;opacity:0;pointer-events:none;filter:drop-shadow(1px 2px 1px rgba(52,32,17,.3))}
.d.go .hand{animation:hand 2.2s ease-in-out both}
@keyframes hand{0%{opacity:0;transform:translate(16px,18px)}15%{opacity:1;transform:none}30%{transform:translateY(6px) scale(.94)}42%{transform:none}55%{transform:translateY(6px) scale(.94)}67%{transform:none}85%{opacity:1}100%{opacity:0}}
.tap{position:absolute;left:72%;top:58%;width:34px;height:34px;margin:-17px 0 0 -17px;border:3px solid #FFF8E9;border-radius:50%;opacity:0;pointer-events:none}
.d.go .tap{animation:tap 2.2s ease-out both}
@keyframes tap{0%,28%{opacity:0;transform:scale(.3)}32%{opacity:.9}52%{opacity:0;transform:scale(1.5)}54%{opacity:0;transform:scale(.3)}57%{opacity:.9}78%,100%{opacity:0;transform:scale(1.5)}}
</style>
</head>
<body>
<div class="wrap">
  <h1>인물 부르는 모션 시안</h1>
  <p class="lead">장소에서 한동안 아무것도 누르지 않으면, 아직 물어볼 게 남은 인물 한 명이 플레이어를 불러요. 여기서는 레이만 물어볼 게 남았고 오리 아저씨는 대화를 마친 상태예요. 시안에서는 <b>3초</b> 뒤에 시작해 4초마다 되풀이해요(게임에서는 약 8초). 화면 아무 데나 누르면 멈추고 처음부터 다시 세요.</p>
  <div class="grid" id="grid"></div>
</div>
<script>
const OPTS = [
  ['a', 'A. 콩 뛰기 + 말줄임 말풍선', 1, '두 번 콩콩 뛰고 머리 위에 손그림 “…” 말풍선이 떴다 사라져요. 게임의 종이 말풍선 그림을 작게 썼어요. “할 말이 있어요”가 그림만으로 전해져요.'],
  ['b', 'B. 손 흔들기 + 이름표', 0, '몸을 좌우로 기울이고 이름표가 꿀색으로 한 번 빛나요. 가장 조용하지만 눈에 덜 띌 수 있어요.'],
  ['c', 'C. 발밑 빛 고리', 0, '발밑에 꿀색 고리가 두 번 퍼져요. 잘 보이지만 게임 UI 느낌이 강해요.'],
  ['d', 'D. 손가락', 0, '인물 위에 손가락이 나타나 두 번 톡톡 눌러요. 가장 확실하지만 튜토리얼 같아서 처음 한 번만 쓰는 걸 권해요.'],
];
const HAND = `<svg class="hand" viewBox="0 0 54 62" aria-hidden="true"><path d="M17 6c0-3 2-5 5-5s5 2 5 5v20l3-.6c2-.4 4 .5 5 2l1 .2c2-.3 4 .7 5 2.3 2-.2 4 1 4.5 3l1.5 9c1 7-3 14-9 17-5 2.5-12 2-16-1L9 48c-2-2-3-5-1-7 2-2 5-1.5 7 .3l2 2z" fill="#FFF8E9" stroke="#4A3628" stroke-width="2.4" stroke-linejoin="round"/><path d="M27 26v8M35 28v7M41 31v6" fill="none" stroke="#4A3628" stroke-width="2" stroke-linecap="round"/></svg>`;
document.getElementById('grid').innerHTML = OPTS.map(([k, title, rec, text]) => `<section class="opt"><h2>${title}${rec ? '<span class="rec">추천</span>' : ''}<span class="clock" data-clock></span></h2>
  <div class="phone ${k}">
    <div class="npc duck"><img src="../assets/characters/duck-higgsfield.png" alt=""><span class="tag">Mr. Duck</span></div>
    <div class="npc ray"><span class="ring"></span><span class="ring"></span><span class="dots"><i></i><i></i><i></i></span><img src="../assets/characters/ray-higgsfield.png" alt=""><span class="tag">Ray</span></div>
    ${k === 'd' ? HAND + '<span class="tap"></span>' : ''}
  </div><p>${text}</p></section>`).join('');

// each phone counts its own quiet time: 3s, then the call every 4s until it is tapped
document.querySelectorAll('.phone').forEach(phone => {
  const ray = phone.querySelector('.ray'), hand = phone.querySelector('.hand'), tap = phone.querySelector('.tap');
  const clock = phone.closest('.opt').querySelector('[data-clock]');
  let quiet = 0;
  const call = () => { [ray, phone].forEach(el => { el.classList.remove('go'); void el.offsetWidth; el.classList.add('go'); }); };
  setInterval(() => {
    quiet += .5;
    clock.textContent = `조용히 ${quiet.toFixed(0)}초`;
    if(quiet >= 3 && (quiet - 3) % 4 === 0) call();
  }, 500);
  phone.addEventListener("pointerdown", () => { quiet = 0; ray.classList.remove("go"); phone.classList.remove("go"); });
});
</script>
</body>
</html>
