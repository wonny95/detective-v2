<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>단어 짝맞추기 아이콘 시안</title>
<style>
  body{margin:0;font-family:system-ui,sans-serif;background:#D69C62 url(../assets/ui/corkboard-cork.webp) 0 0/300px 300px repeat;color:#3B2A1C}
  h1{font-size:18px;font-weight:600;margin:20px 16px 4px;background:#FFFDF6;display:inline-block;padding:6px 12px;border-radius:6px}
  p.note{margin:6px 16px 16px;background:#FFFDF6;display:inline-block;padding:6px 12px;border-radius:6px;font-size:14px}
  .row{display:flex;flex-wrap:wrap;gap:22px;padding:8px 16px 40px;align-items:flex-end}
  .opt{width:170px;display:flex;flex-direction:column;align-items:center;gap:10px}
  .opt img{width:100%;aspect-ratio:400/413;object-fit:contain;filter:drop-shadow(3px 6px 4px rgba(50,30,15,.35))}
  .tag{white-space:nowrap;padding:3px 12px;background:#FFFDF6;border-radius:4px;font-weight:600;font-size:14px;transform:rotate(3deg);box-shadow:0 2px 3px rgba(0,0,0,.2)}
  .num{font-size:13px;background:#3B2A1C;color:#FFFDF6;border-radius:999px;padding:2px 9px}
  .now{opacity:.85}
</style>
</head>
<body>
<h1>단어 짝맞추기 아이콘 시안</h1><br>
<p class="note">사건 목록 코르크판 위, 철자 금고와 같은 크기로 놓아 봤어요. 번호로 골라 주세요.</p>
<div class="row">
  <div class="opt now"><img src="../assets/ui/safe-closed.webp" alt=""><span class="tag">철자 금고</span><span class="num">비교용</span></div>
  <div class="opt"><img src="match-icon-options/1.png" alt=""><span class="tag">단어 짝맞추기</span><span class="num">1 실로 이은 메모판</span></div>
  <div class="opt"><img src="match-icon-options/2.png" alt=""><span class="tag">단어 짝맞추기</span><span class="num">2 퍼즐 조각</span></div>
  <div class="opt"><img src="match-icon-options/3.png" alt=""><span class="tag">단어 짝맞추기</span><span class="num">3 집게 단어 카드</span></div>
  <div class="opt"><img src="match-icon-options/4.png" alt=""><span class="tag">단어 짝맞추기</span><span class="num">4 탐정 수첩</span></div>
</div>
</body>
</html>
