<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light"><title>누가 화단을 망쳤을까? · 상세 기획</title>

<style id="case-plan-common" data-version="1">

</div></main><template id="reader-source"><section id="flow-overview"><div id="event-flow" class="plan-anchor"></div><h3>사건 흐름도</h3><p>제작자용 · 발생 과정과 조사·해결 과정. 화살표는 정보의 선행 관계이며 방문 순서는 고정하지 않는다. 피아·거스 방문은 자유다. 모든 면담과 필수 사진을 모아 추리하며 공 사진은 선택이다.</p><h4>01 · 사건이 벌어진 과정</h4><figure style="margin:12px 0 28px"><div tabindex="0" aria-label="01 · 사건이 벌어진 과정" style="overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:#fffdf8"><svg xmlns="http://www.w3.org/2000/svg" viewbox="0 0 1340 280" role="img" aria-labelledby="truth-flow-title truth-flow-desc" style="display:block;width:100%;min-width:1060px;height:auto;font-family:Malgun Gothic,Apple SD Gothic Neo,sans-serif"><title id="truth-flow-title">01 · 사건이 벌어진 과정</title><desc id="truth-flow-desc">제작자용 진실 · 조사 전에 일어난 일. 꽃 심기·정상 상태 기록 → 루카는 길에서 촬영 → 거스가 공을 회수 → 훼손 발견·의뢰</desc><defs><marker id="flow-arrow-truth" viewbox="0 0 10 10" refx="9" refy="5" markerwidth="7" markerheight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#978b7b"></path></marker></defs><path data-edge="ft1:ft2" d="M305 147 H350" fill="none" stroke="#978b7b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#flow-arrow-truth)"></path><path data-edge="ft2:ft3" d="M645 147 H690" fill="none" stroke="#978b7b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#flow-arrow-truth)"></path><path data-edge="ft3:ft4" d="M985 147 H1030" fill="none" stroke="#978b7b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#flow-arrow-truth)"></path><g data-flow-node="ft1"><rect x="15" y="65" width="290" height="165" rx="12" fill="#f9e5df" stroke="#bd7d68" stroke-opacity=".65" stroke-width="1.5"></rect><text x="160.0" y="102" text-anchor="middle" fill="#44362c" font-size="21" font-weight="700">꽃 심기·정상 상태 기록</text><text x="160.0" y="137" text-anchor="middle" fill="#605347" font-size="16.5">올리·피아가 심고 올리가 사진 촬영</text><text x="160.0" y="164" text-anchor="middle" fill="#605347" font-size="16.5">멀쩡한 꽃 확인 뒤 함께 가게로 감</text></g><g data-flow-node="ft2"><rect x="355" y="65" width="290" height="165" rx="12" fill="#eee6f4" stroke="#9473ad" stroke-opacity=".65" stroke-width="1.5"></rect><text x="500.0" y="102" text-anchor="middle" fill="#44362c" font-size="21" font-weight="700">루카는 길에서 촬영</text><text x="500.0" y="137" text-anchor="middle" fill="#605347" font-size="16.5">정원 길에 머물다 벤치로 돌아옴</text><text x="500.0" y="164" text-anchor="middle" fill="#605347" font-size="16.5">렌이 이동·촬영 전 구간을 봄</text></g><g data-flow-node="ft3"><rect x="695" y="65" width="290" height="165" rx="12" fill="#e3ede2" stroke="#658868" stroke-opacity=".65" stroke-width="1.5"></rect><text x="840.0" y="102" text-anchor="middle" fill="#44362c" font-size="21" font-weight="700">거스가 공을 회수</text><text x="840.0" y="137" text-anchor="middle" fill="#605347" font-size="16.5">울타리 너머로 간 공을 찾으러 들어감</text><text x="840.0" y="164" text-anchor="middle" fill="#605347" font-size="16.5">꽃 사이를 곧장 걸어 실수로 밟음</text></g><g data-flow-node="ft4"><rect x="1035" y="65" width="290" height="165" rx="12" fill="#e2edf4" stroke="#688da6" stroke-opacity=".65" stroke-width="1.5"></rect><text x="1180.0" y="102" text-anchor="middle" fill="#44362c" font-size="21" font-weight="700">훼손 발견·의뢰</text><text x="1180.0" y="137" text-anchor="middle" fill="#605347" font-size="16.5">돌아온 올리·피아가 망가진 꽃 발견</text><text x="1180.0" y="164" text-anchor="middle" fill="#605347" font-size="16.5">올리는 현장에 남아 탐정에게 부탁</text></g></svg></div><figcaption style="color:var(--muted);font-size:14px;margin-top:9px">사건 전말을 보여 주는 제작자용 흐름입니다.</figcaption></figure><h4>02 · 탐정이 해결하는 과정</h4><figure style="margin:12px 0 28px"><div tabindex="0" aria-label="02 · 탐정이 해결하는 과정" style="overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:#fffdf8"><svg xmlns="http://www.w3.org/2000/svg" viewbox="0 0 1340 1000" role="img" aria-labelledby="solve-flow-title solve-flow-desc" style="display:block;width:100%;min-width:1060px;height:auto;font-family:Malgun Gothic,Apple SD Gothic Neo,sans-serif"><title id="solve-flow-title">02 · 탐정이 해결하는 과정</title><desc id="solve-flow-desc">단서는 선행 조건으로 연결 · 방문 순서를 하나로 강제하지 않음. 올리의 의뢰·사진 → 화단·영수증·울타리 → 피아에게 작업 순서 질문 → 거스에게 공 회수 질문 → 벤치 건너편 루카 조사 → 렌의 목격으로 대조 → 기록·필수 사진으로 추리 → 거스에게 돌아가 출입 확인 → 공의 위치·회수 경로 질문 → 현장 사진 대조·훼손 인정 → 올리에게 결과 보고</desc><defs><marker id="flow-arrow-solve" viewbox="0 0 10 10" refx="9" refy="5" markerwidth="7" markerheight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#978b7b"></path></marker></defs><rect x="5" y="10" width="310" height="970" rx="16" fill="#f9e5df" fill-opacity=".32"></rect><rect x="5" y="10" width="310" height="76" rx="14" fill="#f9e5df"></rect><text x="160" y="42" text-anchor="middle" fill="#44362c" font-size="23" font-weight="700">01 · 의뢰·현장 확인</text><text x="160" y="66" text-anchor="middle" fill="#786b5d" font-size="16">정상 작업과 훼손 구별</text><rect x="345" y="10" width="310" height="970" rx="16" fill="#eee6f4" fill-opacity=".32"></rect><rect x="345" y="10" width="310" height="76" rx="14" fill="#eee6f4"></rect><text x="500" y="42" text-anchor="middle" fill="#44362c" font-size="23" font-weight="700">02 · 피아·거스 조사</text><text x="500" y="66" text-anchor="middle" fill="#786b5d" font-size="16">두 장소 방문 순서는 자유</text><rect x="685" y="10" width="310" height="970" rx="16" fill="#e3ede2" fill-opacity=".32"></rect><rect x="685" y="10" width="310" height="76" rx="14" fill="#e3ede2"></rect><text x="840" y="42" text-anchor="middle" fill="#44362c" font-size="23" font-weight="700">03 · 목격 대조·추리</text><text x="840" y="66" text-anchor="middle" fill="#786b5d" font-size="16">후속 질문은 조건 충족 뒤</text><rect x="1025" y="10" width="310" height="970" rx="16" fill="#e2edf4" fill-opacity=".32"></rect><rect x="1025" y="10" width="310" height="76" rx="14" fill="#e2edf4"></rect><text x="1180" y="42" text-anchor="middle" fill="#44362c" font-size="23" font-weight="700">04 · 직접 확인·인정·보고</text><text x="1180" y="66" text-anchor="middle" fill="#786b5d" font-size="16">추리만으로 훼손 확정 금지</text><path data-edge="fs1 -weight="700">기록·필수 사진으로 추리</text><text x="840.0" y="672" text-anchor="middle" fill="#605347" font-size="16.5">루카는 렌의 목격으로 제외</text><text x="840.0" y="699" text-anchor="middle" fill="#605347" font-size="16.5">거스의 두 길 진술 모순 확인</text><text x="840.0" y="726" text-anchor="middle" fill="#605347" font-size="16.5">공 사진 없이도 추리·확인 가능</text></g></a><a href="#scene-8" aria-label="거스에게 돌아가 출입 확인 대본 보기"><g data-flow-node="fs8"><rect x="1045" y="130" width="270" height="150" rx="12" fill="#e2edf4" stroke="#688da6" stroke-opacity=".65" stroke-width="1.5"></rect><text x="1180.0" y="167" text-anchor="middle" fill="#44362c" font-size="21" font-weight="700">거스에게 돌아가 출입 확인</text><text x="1180.0" y="202" text-anchor="middle" fill="#605347" font-size="16.5">바깥길 주장에 렌의 진술 제시</text><text x="1180.0" y="229" text-anchor="middle" fill="#605347" font-size="16.5">정원 안쪽 길에서 돌아온 사실 대조</text><text x="1180.0" y="256" text-anchor="middle" fill="#605347" font-size="16.5">거스가 정원 출입을 먼저 인정</text></g></a><a href="#scene-8" aria-label="공의 위치·회수 경로 질문 대본 보기"><g data-flow-node="fs9"><rect x="1045" y="365" width="270" height="150" rx="12" fill="#e2edf4" stroke="#688da6" stroke-opacity=".65" stroke-width="1.5"></rect><text x="1180.0" y="402" text-anchor="middle" fill="#44362c" font-size="21" font-weight="700">공의 위치·회수 경로 질문</text><text x="1180.0" y="437" text-anchor="middle" fill="#605347" font-size="16.5">공은 화단 한가운데에 있었다</text><text x="1180.0" y="464" text-anchor="middle" fill="#605347" font-size="16.5">길에서 공까지 곧장 걸었다고 답함</text><text x="1180.0" y="491" text-anchor="middle" fill="#605347" font-size="16.5">아직 꽃을 밟았다고 인정하지 않음</text></g></a><a href="#scene-8" aria-label="현장 사진 대조·훼손 인정 대본 보기"><g data-flow-node="fs10"><rect x="1045" y="600" width="270" height="150" rx="12" fill="#e2edf4" stroke="#688da6" stroke-opacity=".65" stroke-width="1.5"></rect><text x="1180.0" y="637" text-anchor="middle" fill="#44362c" font-size="21" font-weight="700">현장 사진 대조·훼손 인정</text><text x="1180.0" y="672" text-anchor="middle" fill="#605347" font-size="16.5">본인 경로와 눌린 꽃 구간을 대조</text><text x="1180.0" y="699" text-anchor="middle" fill="#605347" font-size="16.5">실수로 밟았다는 대답을 들음</text><text x="1180.0" y="726" text-anchor="middle" fill="#605347" font-size="16.5">겁나서 숨긴 이유·복구 의사 확인</text></g></a><a href="#scene-8" aria-label="올리에게 결과 보고 대본 보기"><g data-flow-node="fs11"><rect x="1045" y="815" width="270" height="150" rx="26" fill="#dcebd7" stroke="#4d7856" stroke-opacity=".65" stroke-width="1.5"></rect><text x="1180.0" y="852" text-anchor="middle" fill="#44362c" font-size="21" font-weight="700">올리에게 결과 보고</text><text x="1180.0" y="887" text-anchor="middle" fill="#605347" font-size="16.5">탐정만 직접 화단으로 돌아감</text><text x="1180.0" y="914" text-anchor="middle" fill="#605347" font-size="16.5">확인한 훼손 경위·복구 의사를 전달</text><text x="1180.0" y="941" text-anchor="middle" fill="#605347" font-size="16.5">올리가 결과를 듣고 사건 해결</text></g></a></svg></div><figcaption style="color:var(--muted);font-size:14px;margin-top:9px">화살표는 정보의 선행 관계입니다. 벤치는 피아의 대답 뒤 열리며 렌의 후속 질문은 거스·루카 기록 뒤 열립니다. 공 사진은 선택입니다. 카드를 누르면 같은 페이지의 대본으로 이동합니다.</figcaption></figure></section><section id="case-summary"><div class="callout"><strong>점검 개선 반영</strong> · 7개 주요 항목과 사진·영수증·복습 설정을 다듬었습니다. 대본 검토 대기이며 원화·음성·게임은 아직 검증하지 않았습니다. <a href="case-flowerbed-review.html">점검·개선 기록 보기 ↗</a></div><p>제작자용 · 발생 과정과 조사·해결 과정. 화살표는 정보의 선행 관계이며 방문 순서는 고정하지 않는다. 피아·거스 방문은 자유다. 모든 면담과 필수 사진을 모아 추리하며 공 사진은 선택이다.</p></section><section class="hero"><div class="hero-copy"><span class="eyebrow">L1-06 · B 공 안 승인 · 번호 미정</span><h1>누가 화단을 망쳤을까?</h1><p class="lead">공을 꺼내다 꽃을 밟은 사건. 했다는 말과 하지 않았다는 말을 사진·다른 진술과 대조해 실제 행위자를 찾는다.</p><div class="chips"><span class="chip">질문 15개 · 빈칸 38칸</span><span class="chip">인물 5명 · 장소 4곳</span><span class="chip">필수 사진 3장 · 선택 1장</span><span class="chip">추리 6문항 · 확인 2차례</span><span class="chip status">점검 개선 반영 · 검토 대기</span></div></div><figure class="hero-art"><div class="plan-art-pending">공이 정원으로 넘어감<br>회수 중 꽃을 밟음<br>기록을 대조해 행위자 확인</div><figcaption>제작자용 전말 · 실제 원화·음성 제작 전</figcaption></figure></section><section id="storyboard"><article class="scene" id="scene-0"><div class="scene-head"><span class="scene-kicker">00 · 예습</span><h3>이번 사건의 열쇠</h3><p>사건 밖 예문으로 준비한다. 본편 반복 횟수에는 넣지 않는다.</p></div><div class="scene-body"><div class="key-plan"><section class="key-card"><span class="key-page">01 / 03</span><h4>Did ...?</h4><p class="key-why">끝난 행동을 했는지 묻는다. did 뒤에는 동사원형을 쓴다.</p><details class="key-example"><summary>Did you open the window?<span>해석</span></summary><p>창문을 열었니?</p></details><details class="key-example"><summary>Did she finish her homework?<span>해석</span></summary><p>그 친구는 숙제를 끝냈니?</p></details><details class="key-example"><summary>Did they watch the film?<span>해석</span></summary><p>그 친구들은 영화를 봤니?</p></details></section><section class="key-card"><span class="key-page">02 / 03</span><h4>didn't + 동사원형</h4><p class="key-why">하지 않은 행동을 말한다. 부정문에서는 동사에 과거형을 또 붙이지 않는다.</p><details class="key-example"><summary>I didn't open the window.<span>해석</span></summary><p>난 창문을 열지 않았어.</p></details><details class="key-example"><summary>He didn't finish his homework.<span>해석</span></summary><p>그 친구는 숙제를 끝내지 않았어.</p></details><details class="key-example"><summary>They didn't watch the film.<span>해석</span></summary><p>그 친구들은 영화를 보지 않았어.</p></details></section><section class="key-card"><span class="key-page">03 / 03</span><h4>went · go의 과거형</h4><p class="key-why">한 행동을 긍정문으로 말할 때 과거형을 쓴다. 대표 went와 did/didn’t 뒤 go를 구별한다.</p><details class="key-example"><summary>I went to school yesterday.<span>해석</span></summary><p>난 어제 학교에 갔어.</p></details><details class="key-example"><summary>We went home after lunch.<span>해석</span></summary><p>우리는 점심 뒤 집에 갔어.</p></details><details class="key-example"><summary>She went to the library on Monday.<span>해석</span></summary><p>그 친구는 월요일에 도서관에 갔어.</p></details></section></div><div class="scene-next"><strong>준비할 내용</strong><p>사건 밖 예문으로 Did 질문, didn’t 부정, 과거형 긍정을 준비한다.</p></div></div></article><article class="scene" id="scene-1"><div class="scene-head"><span class="scene-kicker">장면 1 · 마을 화단</span><h3>마을 화단 — 올리의 의뢰</h3><p>대사·질문·노트와 진행 조건</p></div><div class="scene-body"><div class="turn" data-line="ollie:hello"><span class="who">올리</span><p class="en">Oh, hi! It's me, Ollie.</p><p class="ko">어, 안녕! 나야, 올리.</p><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">제작 메모 · 재생 조건</summary><div style="display:grid;gap:12px;padding-top:14px"><p class="fine">올리와 재회 · 이름을 직접 말함</p></div></details></div><div class="question-choice" data-ref="ollie:n0"><span class="choice-no">ollie:n0</span><p class="ask">How can I help you?</p><p class="translation">무엇을 도와줄까?</p><p class="reply">I came back and found our flowers damaged. Can you find out who did it?<em>돌아왔더니 우리 꽃들이 망가져 있었어. 누가 그랬는지 알아봐 줄래?</em></p><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">학습 설계 · 받아쓰기</summary><div style="display:grid;gap:12px;padding-top:14px"><div class="note-task"><b>노트</b> · <span class="note-text">I came back and found our [flowers] [damaged]. Can you find out who [did] it?</span><span class="bank">보기 · flowers · damaged · did · bottles · planted · does</span></div></div></details><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">제작 메모 · 질문 조건</summary><div style="display:grid;gap:12px;padding-top:14px"><span class="choice-no">ollie:n0 · 첫 질문 하나만 표시 · 채점 뒤 n1 해금</span></div></details></div><div class="question-choice" data-ref="ollie:n1"><span class="choice-no">ollie:n1</span><p class="ask">What were the flowers like before you left?</p><p class="translation">자리를 비우기 전 꽃들은 어떤 상태였니?</p><p class="reply">I took this photo after planting. All the flowers were fine.<em>꽃을 심은 뒤 이 사진을 찍었어. 꽃들이 모두 멀쩡했어.</em></p><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">학습 설계 · 받아쓰기</summary><div style="display:grid;gap:12px;padding-top:14px"><div class="note-task"><b>노트</b> · <span class="note-text">I [took] this [photo] after planting. All the flowers were [fine].</span><span class="bank">보기 · took · photo · fine · take · drawing · damaged</span></div></div></details><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">제작 메모 · 질문 조건</summary><div style="display:grid;gap:12px;padding-top:14px"><span class="choice-no">ollie:n1 · n0 뒤 · 휴대전화 사진을 가리킴 · garden-photo 기록 허용</span></div></details></div><div class="scene-next"><strong>얻은 정보</strong><p>올리의 의뢰와 꽃을 심은 뒤 찍은 사진을 확인한다.</p></div><article class="evidence-card object-card" data-evidence="garden-photo" data-reader-inspector-only=""><span class="result-tag">필수 촬영 · 사진과 영수증</span><h3>사진과 영수증</h3><div class="room-sketch"><div class="sketch-cell"><strong>멀쩡한 화단이 찍힌 화면·실제 영수증의 Plant Shop 상호</strong></div></div><p>n1 뒤 벤치의 휴대전화 화면과 옆 모종 영수증 촬영</p><p>정상 상태와 가게를 기록. 촬영 순서는 올리 답변으로 확인. 필수</p></article><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">제작 메모 · 장면 조건</summary><div style="display:grid;gap:12px;padding-top:14px"><p>올리는 n1 답변 때 자신의 휴대전화에서 아까 찍은 사진을 열어 앞에서 보여 준다. 인쇄 사진은 없다. 대화 뒤에는 화면을 켠 휴대전화를 벤치의 작업일지 위에 놓는다. 옆에는 처음 산 모종의 실제 영수증이 있고 Plant Shop 상호를 읽을 수 있다. garden-photo는 사진 화면과 옆 영수증을 한 프레임에 기록한다. 영수증은 가게의 인쇄 상호를 보여 주는 소품이며 구매자·정확한 시각·후보 이름을 알려 주는 자료가 아니다. 함께 외출한 사실은 피아와 렌의 답변에서 확인한다.</p></div></details></div></article><article class="scene" id="scene-2"><div class="scene-head"><span class="scene-kicker">장면 2</span><h3>화단 현장·휴대전화 사진과 영수증·울타리</h3><p>대사·질문·노트와 진행 조건</p></div><div class="scene-body"><div class="turn det" data-line="obs:f1"><span class=" ence="ball-photo" data-reader-inspector-only=""><span class="result-tag">선택 촬영 · 흙 묻은 공</span><h3>흙 묻은 공</h3><div class="room-sketch"><div class="sketch-cell"><strong>공 대부분은 깨끗하고 작고 옅은 흙 얼룩만 있음</strong></div></div><p>g4 허락·열린 거스 질문 완료 뒤 선택 촬영</p><p>선택 기록. 흙의 출처·훼손·범인을 입증하지 않으며 해금·완료 조건이 아님</p></article><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">제작 메모 · 장면 조건</summary><div style="display:grid;gap:12px;padding-top:14px"><p>거스 발치에 공이 보인다. 거스는 살펴봐도 된다는 허락만 하며 공의 상태나 닦았는지는 말하지 않는다. 오염 상태는 대화 종료 뒤 탐정의 직접 관찰과 촬영으로 발견한다. 첫인사·인물 외형·알림에 범인 표시를 하지 않는다. g4는 촬영 허락을 얻는 조사 질문이므로 받아쓰기 15개에 포함한다. 기록을 마친 뒤 공을 현장에서 선택 촬영할 수 있고 실제 공은 거스 곁에 남긴다. 촬영하지 않아도 진행 가능하다. 흙이 조금 묻었다는 사실만으로 그 흙의 출처나 훼손 행위자를 확정하지 않는다.</p></div></details></div></article><article class="scene" id="scene-5"><div class="scene-head"><span class="scene-kicker">장면 5 · 공원 벤치</span><h3>공원 벤치 — 렌</h3><p>대사·질문·노트와 진행 조건</p></div><div class="scene-body"><div class="turn" data-line="wren:hello"><span class="who">렌</span><p class="en">Hello there. I'm Wren.</p><p class="ko">반가워. 난 렌이야.</p><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">제작 메모 · 재생 조건</summary><div style="display:grid;gap:12px;padding-top:14px"><p class="fine">벤치 첫 만남</p></div></details></div><div class="turn det" data-line="det:wren-open"><span class="who">탐정</span><p class="en">The flowers in the garden are damaged. I'm finding out what happened.</p><p class="ko">정원의 꽃들이 망가졌어. 무슨 일이 있었는지 알아보고 있어.</p><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">제작 메모 · 재생 조건</summary><div style="display:grid;gap:12px;padding-top:14px"><p class="fine">렌 소개 뒤</p></div></details></div><div class="turn" data-line="wren:ready"><span class="who">렌</span><p class="en">Oh, no! I'll hel ><span class="bank">보기 · ball · fence · didn't · bottle · bench · did</span></div></div></details><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">제작 메모 · 질문 조건</summary><div style="display:grid;gap:12px;padding-top:14px"><span class="choice-no">wren:w2 · w1 뒤 · 목격 범위 제한</span></div></details></div><div class="question-choice" data-ref="wren:w3"><span class="choice-no">wren:w3</span><p class="ask">Did anyone come back with a ball?</p><p class="translation">공을 들고 돌아온 친구가 있었니?</p><p class="reply">Yes. Gus came back with a ball from the garden path.<em>응. 거스가 정원 안쪽 길에서 공을 들고 돌아왔어.</em></p><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">학습 설계 · 받아쓰기</summary><div style="display:grid;gap:12px;padding-top:14px"><div class="note-task"><b>노트</b> · <span class="note-text">Yes. [Gus] came back with a ball from the [garden path].</span><span class="bank">보기 · Gus · garden path · Pia · yard path</span></div></div></details><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">제작 메모 · 질문 조건</summary><div style="display:grid;gap:12px;padding-top:14px"><span class="choice-no">wren:w3 · w2·거스 소개·g2·g3 뒤. 공 사진은 필요 없음</span></div></details></div><div class="question-choice" data-ref="wren:w4"><span class="choice-no">wren:w4</span><p class="ask">Did you see Luca near the flower bed?</p><p class="translation">화단 근처에서 루카를 봤니?</p><p class="reply">Yes, I watched the whole time. He stayed on the path.<em>응, 내내 지켜봤어. 길 위에 머물렀어.</em></p><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">학습 설계 · 받아쓰기</summary><div style="display:grid;gap:12px;padding-top:14px"><div class="note-task"><b>노트</b> · <span class="note-text">Yes, I [watched] the whole time. He [stayed] on the [path].</span><span class="bank">보기 · watched · stayed · path · washed · stepped · bed</span></div></div></details><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">제작 메모 · 질문 조건</summary><div style="display:grid;gap:12px;padding-top:14px"><span class="choice-no">wren:w4 · 루카 l1·l2 뒤 · 촬영 시작부터 길을 따라 돌아올 때까지의 목격</span></div></details></div><div class="turn det" data-line="think:wren-again" data-optional="true"><span class="who">탐정</span><p class="en">I should ask Wren who brought the ball back.</p><p class="ko">렌에게 누가 공을 가져왔는지 물어봐야겠어.</p><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">제작 메모 · 재생 조건</summary><div style="display:grid;gap:12px;padding-top:14px"><p class="fine">렌을 이미 만난 상태에서 w3의 나머지 조건을 새로 충족할 때만</p></div></details></div><div class="scene-next"><strong>얻은 정보</strong><p>렌이 본 공의 회수와 루카의 이동 경로를 기록한다.</p></div><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">제작 메모 · 장면 조건</summary><div style="display:grid;gap:12px;padding-top:14px"><p>w1·w2만 열린 첫 방문은 그 둘을 마치고 끝낼 수 있다. w3는 거스의 공 이동·출입 부인 진술 뒤, w4는 루카의 두 질문 기록 뒤 열린다. 이미 조건을 갖추고 렌을 처음 만났다면 한 방문에서 이어진다. 렌은 공을 집는 손동작이나 꽃을 밟은 순간은 못 봤으며, <strong>공을 들고 돌아온 사람과 길</strong>만 말한다. 목격 시야는 배경에서 확인한다.</p></div></details></div></article><article class="scene" id="scene-6"><div class="scene-head"><span class="scene-kicker">장면 6 · 공원 벤치 건너편</span><h3>공원 벤치 건너편 — 루카</h3><p>대사·질문·노트와 진행 조건</p></div><div class="scene-body"><div class="turn" data-line="luca:hello"><span class="who">루카</span><p class="en">Hello! I'm Luca.</p><p class="ko">안녕! 난 루카야.</p><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">제작 메모 · 재생 조건</summary><div style="display:grid;gap:12px;padding-top:14px"><p class="fine">벤치 건너편 첫 만남 · 아직 직업·알리바이를 말하지 않음</p></div></details></div><div class="turn det" data-line="det:luca-open"><span class="who">탐정</span><p class="en">I'm asking about the damaged flowers.</p><p class="ko">망가진 꽃들에 관해 알아보고 있어.</p><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">제작 메모 · 재생 조건</summary><div style="display:grid;gap:12px;padding-top:14px"><p class="fine">루카 소개 뒤</p></div></details></div><div class="turn" data-line="luca:ready"><span class="who">루카</span><p class="en">Oh, what would you like to know?</p><p class="ko">어, 무엇이 궁금하니?</p><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">제작 메모 · 재생 조건</summary><div style="display:grid;gap:12px;padding-top:14px"><p class="fine">조사 정보는 질문에서 제공</p></div></details></div><div class="question-choice" data-ref="luca:l1"><span class="choice-no">luca:l1</span><p class="ask">Did you go into the garden today?</p><p class="translation">오늘 정원에 들어갔니?</p><p class="reply">Yes. I took photos of the flowers. I didn't touch them.<em>응. 꽃 사진을 찍었어. 꽃들을 건드리지는 않았어.</em></p><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">학습 설계 · 받아쓰기</summary><div style="display:grid;gap:12px;padding-top:14px"><div class="note-task"><b>노트</b> · <span class="note-text">Yes. I [took] [photos] of the flowers. I didn't touch them.</span><span class="bank">보기 · took · photos · take · flowers</span></div></div></details><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">제작 메모 · 질문 조건</summary><div style="display:grid;gap:12px;padding-top:14px"><span class="choice-no">luca:l1 · 루카 소개 뒤 첫 질문 · 정원 출입 인정, 접촉 부정은 아직 주장</span></div></details></div><div class="question-choice" data-ref="luca:l2"><span class="choice-no">luca:l2</span><p class="ask">Where did you stand to take the photos?</p><p class="translation">어디에 서서 사진을 찍었니?</p><p class="reply">On the garden path. I didn't walk between the flowers.<em>정원 안쪽 길에 있었어. 꽃 사이로 걷지는 않았어.</em></p><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">학습 설계 · 받아쓰기</summary><div style="display:grid;gap:12px;padding-top:14px"><div class="note-task"><b>노트</b> · <span class="note-text">On the garden path. I [didn't] walk [between] the flowers.</span><span class="bank">보기 · didn't · between · did · behind</span></div></div></details><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">제작 메모 · 질문 조건</summary><div style="display:grid;gap:12px;padding-top:14px"><span class="choice-no">luca:l2 · l1 뒤 · 렌 w4 확인 질문 해금</span></div></details></div><div class="turn det" data-line="think:luca-check" data-optional="true"><span class="who">탐정</span><p class="en">Luca went into the garden. I should ask Wren what he saw.</p><p class="ko">루카가 정원에 들어갔대. 렌이 무엇을 봤는지 물어봐야겠어.</p><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">제작 메모 · 재생 조건</summary><div style="display:grid;gap:12px;padding-top:14px"><p class="fine">l2 뒤 렌을 이미 만났을 때만 · 같은 장소에 머묾</p></div></details></div><div class="scene-next"><strong>얻은 정보</strong><p>루카가 정원에 들어간 이유를 듣고 렌의 목격과 대조한다.</p></div><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">제작 메모 · 장면 조건</summary><div style="display:grid;gap:12px;padding-top:14px"><p>루카가 정원에 들어가 사진을 찍은 것은 인정하지만 그 말만으로 꽃을 밟았거나 밟지 않았다고 확정하지 var(--muted);font-size:13px">제작 메모 · 재생 조건</summary><div style="display:grid;gap:12px;padding-top:14px"><p class="fine">복구 의사 전달</p></div></details></div><div class="turn" data-line="ollie:ending"><span class="who">올리</span><p class="en">I'm sad about the flowers. Thank you for finding out what happened.</p><p class="ko">꽃들이 망가져 속상해. 무슨 일이 있었는지 알아봐 줘서 고마워.</p><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">제작 메모 · 재생 조건</summary><div style="display:grid;gap:12px;padding-top:14px"><p class="fine">의뢰인 보고 완료 · 즉석 복구 없음</p></div></details></div><h3>확인 대화의 오답 반응</h3><div class="turn" data-line="gus:wrong" data-optional="true"><span class="who">거스</span><p class="en">That doesn't explain it.</p><p class="ko">그걸로는 설명이 안 되잖아.</p><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">제작 메모 · 재생 조건</summary><div style="display:grid;gap:12px;padding-top:14px"><p class="fine">오답 제시 때만 · 같은 주장 유지, 정상 음성 횟수 제외</p></div></details></div><div class="scene-next"><strong>해결</strong><p>거스가 말한 공의 위치와 회수 경로를 현장 흔적과 대조하고 올리에게 결과를 전한다.</p></div><article class="evidence-card object-card" data-evidence="bed-photo" data-reader-inspector-only=""><span class="result-tag">필수 촬영 · 화단</span><h3>화단</h3><div class="room-sketch"><div class="sketch-cell"><strong>좁은 구간을 따라 눌린 꽃·그 사이 흐트러진 흙·가장자리의 작은 삽과 심기 구멍. 개별 발 모양 없음</strong></div></div><p>올리 n1 뒤 화단 흙과 꽃</p><p>정상 작업과 이후 훼손을 구별. 사람의 종·신원은 알 수 없음</p></article><article class="evidence-card object-card" data-evidence="fence-photo" data-reader-inspector-only=""><span class="result-tag">필수 촬영 · 울타리</span><h3>울타리</h3><div class="room-sketch"><div class="sketch-cell"><strong>울타리의 넘은 자국·안쪽 길 가까이부터 이어지는 눌린 꽃과 흐트러진 흙·밖의 마당 쪽 길·울타리 너머 골대·공놀이 마당 전경</strong></div></div><p>올리 n1 뒤 낮은 울타리와 바닥</p><p>두 길과 이동 범위를 구별. 이름·소유자·CCTV 인물은 없음</p></article><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">제작 메모 · 장면 조건</summary><div style="display:grid;gap:12px;padding-top:14px"><p>기존 엔딩의 사진/진술 제시 흐름을 현장 확인에 쓴다. 경찰·새 조사실·후보 전원 집합은 없다. 15문항·필수 사진 3종·추리 6문항을 마친 뒤 직접 거스에게 돌아와 확인 시작을 고른다. 아래 choice는 모두 선택지이며 자동으로 질문하지 않는다. 별도 받아쓰기는 추가하지 않는다.</p><div class="matrix"><table><thead><tr><th>차례</th><th>주장</th><th>플레이어가 제시할 것</th><th>함께 확인하는 이미 얻은 자료</th><th>넘어가는 때</th></tr></thead><tbody><tr><td>확인 1</td><td>마당 바깥길에서 공을 찾았고 정원에는 안 들어감</td><td>wren:w3 진술</td><td>gus:g3·fence-photo의 두 길 구도</td><td>det:r1 뒤 cq1 선택 → 거스가 정원 출입 인정</td></tr><tr><td>확인 2</td><td>정원에는 갔지만 꽃은 안 밟음</td><td>bed-photo 사진</td><td>gus:ball-place·ball-route로 들은 중앙 위치·직선 회수 경로와 눌린 구간</td><td>두 후속 질문을 먼저 선택해 들은 뒤 사진 제시·cq2 → 훼손 인정</td></tr></tbody></table></div><p>두 번째 확인에서는 먼저 공의 위치와 회수 경로를 선택 질문으로 듣는다. 두 대답을 들은 뒤 bed-photo를 제시한다. 공이 있었다고 말한 중앙의 빈 흙과 길 사이에는 꽃이 심긴 구간이 있고, 사진의 눌린 구간이 거스가 말한 직선 경로와 이어진다. 익명의 흔적만으로 범인을 입증하지 않고 본인의 구체적 설명과 대조해 질문한다. 공의 흙·공 사진은 증거 제출에 요구하지 않는다. 오답은 현재 차례에서 다시 고르며, 이미 들은 후속 답변과 맞힌 첫 차례는 보존한다.</p><p>공을 돌려주는 사건이 아니므로 공 건네주기나 강제 습득은 없다. 확인 뒤 탐정만 올리에게 이동하고 거스는 마당에 남는다. 복구 의사를 전하고 감사로 끝내며 꽃이 즉시 멀쩡해지거나 원화가 정상 화단으로 바뀌지 않는다. 해결 후 복습에서만 실제 행위자 얼굴·인정 내용·사건 요약을 공개한다.</p></div></details></div></article></section><section id="fieldwork"><div class="section-head"><h2>현장 조사와 진행 조건</h2><p>제작자용 · 수정 대본 검토</p></div><p>물건·흔적은 사진으로 기록하고 사람의 말은 질문·받아쓰기로 기록한다. 필수 사진은 3종·선택 사진은 1종이며 소지품으로 받는 물건은 없다. 사진 제목은 실제로 보이는 대상만 쓰고 주인·범인·발생 시각을 표시하지 않는다.</p>
<div class="matrix"><table><thead><tr><th>사진 ID</th><th>중립 제목</th><th>촬영 지점·조건</th><th>함께 보여야 할 사실</th><th>쓰임과 한계</th></tr></thead><tbody><tr><td>bed-photo</td><td>화단</td><td>올리 n1 뒤 화단 흙과 꽃</td><td>좁은 구간을 따라 눌린 꽃·그 사이 흐트러진 흙·가장자리의 작은 삽과 심기 구멍. 개별 발 모양 없음</td><td>정상 작업과 이후 훼손을 구별. 사람의 종·신원은 알 수 없음</td></tr><tr><td>garden-photo</td><td>사진과 영수증</td><td>n1 뒤 벤치의 휴대전화 화면과 옆 모종 영수증 촬영</td><td>멀쩡한 화단이 찍힌 화면·실제 영수증의 Plant Shop 상호</td><td>정상 상태와 가게를 기록. 촬영 순서는 올리 답변으로 확인. 필수</td></tr><tr><td>fence-photo</td><td>울타리</td><td>올리 n1 뒤 낮은 울타리와 바닥</td><td>울타리의 넘은 자국·안쪽 길 가까이부터 이어지는 눌린 꽃과 흐트러진 흙·밖의 마당 쪽 길·울타리 너머 골대·공놀이 마당 전경</td><td>두 길과 이동 범위를 구별. 이름·소유자·CCTV 인물은 없음</td></tr><tr><td>ball-photo</td><td>흙 묻은 공</td><td>g4 허락·열린 거스 질문 완료 뒤 선택 촬영</td><td>공 대부분은 깨끗하고 작고 옅은 흙 얼룩만 있음</td><td>선택 기록. 흙의 출처·훼손·범인을 입증하지 않으며 해금·완료 조건이 아님</td></tr></tbody></table></div>
<p>사진 하나가 자동으로 거스의 인물을 해금하거나 지목하지 않는다. 개인 소유나 진실은 이미 들은 말과 추리로 잇는다. 화단의 생생한 훼손 사진이 곧 범인의 행동을 재현하는 장면이 되지 않게 한다.</p><div class="matrix"><table><thead><tr><th>정보/행동</th><th>열리는 조건</th><th>열리는 것</th><th>열리지 않는 것</th></tr></thead><tbody><tr><td>최초 의뢰</td><td>올리 자기소개</td><td>n0 하나만</td><td>다른 질문·다른 장소</td></tr><tr><td>정상 상태 기록</td><td>n0 채점</td><td>n1</td><td>후보 이름·범인</td></tr><tr><td>현장 촬영</td><td>n1 채점 뒤 최초 대화 완료</td><td>bed-photo·garden-photo·fence-photo 조사</td><td>흔적의 행위자·동물 종류</td></tr><tr><td>모종 작업실</td><td>garden-photo 기록·실제 모종 영수증의 Plant Shop 상호 확인</td><td>장소, 도착 뒤 피아 소개</td><td>사진에 없는 피아 이름·알리바이</td></tr><tr><td>공놀이 마당</td><td>fence-photo 기록·울타리 너머 실제 마당 관찰</td><td>장소, 도착 뒤 거스 소개</td><td>공이 넘어왔다는 추측·범인 지정</td></tr><tr><td>피아 후속</td><td>p1 → p3 → p4</td><td>작업 뒤의 일·벤치의 두 친구</td><td>피아를 용의자로 취급</td></tr><tr><td>공원 벤치</td><td>pia:p4 채점</td><td>렌·루카를 각각 만나 소개</td><td>소개 전 이름</td></tr><tr><td>거스 후속</td><td>g1 → g2·g4, g2 → g3</td><td>공 이동과 정원 출입 질문</td><td>g1에서 묻지 않은 출입 부인</td></tr><tr><td>렌 첫 목격</td><td>w1 → w2</td><td>출발 뒤 공 이동</td><td>공 착지·훼손을 봤다는 사실</td></tr><tr><td>렌 귀환 목격</td><td>w2·거스 소개·gus:g2·g3 채점</td><td>w3</td><td>공 사진 촬영을 필수로 요구</td></tr><tr><td>루카 위치 확인</td><td>luca:l1·l2 채점·렌 소개</td><td>w4</td><td>본인 주장만으로 제외</td></tr><tr><td>공의 선택 조사</td><td>g4 허락 기록·열린 거스 질문 완료</td><td>obs:f4·ball-photo 선택 촬영</td><td>공 습득·사진 미촬영으로 질문·추리 잠금</td></tr><tr><td>추리</td><td>질문 15개·필수 사진 3종</td><td>추리 6문항</td><td>ball-photo 미수집으로 진행 차단</td></tr><tr><td>마지막 확인</td><td>추리 완료·거스에게 직접 돌아가 선택</td><td>출입 확인 → 회수 위치·경로 선택 질문 → 현장 흔적 대조</td><td>사진만으로 훼손 확정</td></tr><tr><td>보고</td><td>거스가 훼손을 직접 인정</td><td>올리에게 직접 이동·결과 설명</td><td>해결 전 범인 요약</td></tr></tbody></table></div>
<p>한 방문에서는 그때 열린 질문만 마쳐도 떠날 수 있다. 렌 w3·w4의 외부 조건 때문에 첫 방문에 가두지 않는다. 공을 살펴보는 허락 질문 g4는 기존 받아쓰기 질문이지만, 공 사진 촬영은 선택이다. 공을 찍지 않은 경로에서도 렌의 목격·추리·확인·결말이 모두 열린다. 이름·질문·사진의 개수는 제작자 문서에서만 표시한다. 발견 뒤 자동 이동하지 않는다.</p></section><section id="background-tts"><div class="section-head"><h2>상세 배경과 선택 클릭 TTS</h2><p>제작자용 상세 기획</p></div><p>장소마다 2개, 총 8개의 선택 관찰이다. 촬영·받아쓰기·추가 발견을 하지 않으며 진행 조건도 아니다. 아래 배치는 기획용 관계도다.</p><div class="grid-2"><article class="sound-zone background-plan"><h3>마을 화단</h3><div class="room-sketch"><div class="sketch-cell"><strong>올리 · 입구 옆</strong></div><div class="sketch-cell"><strong>정원 안쪽 길 → 눌린 꽃</strong></div><div class="sketch-cell"><strong>울타리 밖 마당 쪽 길</strong></div></div><div class="turn det prop-tts" data-prop="bed:labels"><span class="who">탐정 · 작은 식물 이름표</span><p class="en prop-en">Small labels beside the plants.</p><p class="ko prop-ko">식물 옆의 작은 이름표들이네.</p><p class="fine">선택 관찰 · bed:labels</p></div><div class="turn det prop-tts" data-prop="bed:pot"><span class="who">탐정 · 빈 화분</span><p class="en prop-en">An empty flowerpot beside the path.</p><p class="ko prop-ko">길 옆에 빈 화분이 있어.</p><p class="fine">선택 관찰 · bed:pot</p></div></article><article class="sound-zone background-plan"><h3>모종 작업실</h3><div class="room-sketch"><div class="sketch-cell"><strong>피아 · 작업대 옆</strong></div><div class="sketch-cell"><strong>모종판·장갑</strong></div><div class="sketch-cell"><strong>Plant Shop과 같은 장소</strong></div></div><div class="turn det prop-tts" data-prop="shop:tray"><span class="who">탐정 · 모종판</span><p class="en prop-en">Small plants in a tray.</p><p class="ko prop-ko">모종판에 작은 식물들이 있어.</p><p class="fine">선택 관찰 · shop:tray</p></div><div class="turn det prop-tts" data-prop="shop:gloves"><span class="who">탐정 · 장갑</span><p class="en prop-en">A pair of gloves on the table.</p><p class="ko prop-ko">탁자 위에 장갑 한 켤레가 있어.</p><p class="fine">선택 관찰 · shop:gloves</p></div></article><article class="sound-zone background-plan"><h3>공놀이 마당</h3><div class="room-sketch"><div class="sketch-cell"><strong>거스 · 골대 옆</strong></div><div class="sketch-cell"><strong>공은 발치에 둠</strong></div><div class="sketch-cell"><strong>울타리 너머 정원</strong></div></div><div class="turn det prop-tts" data-prop="yard:goal"><span class="who">탐정 · 골대</span><p class="en prop-en">A goal at the end of the yard.</p><p class="ko prop-ko">마당 끝에 골대가 있어.</p><p class="fine">선택 관찰 · yard:goal</p></div><div class="turn det prop-tts" data-prop="yard:bottle"><span class="who">탐정 · 물병</span><p class="en prop-en">A water bottle beside the bench.</p><p class="ko prop-ko">벤치 옆에 물병이 있어.</p><p class="fine">선택 관찰 · yard:bottle</p></div></article><article class="sound-zone background-plan"><h3>공원 벤치</h3><div class="room-sketch"><div class="sketch-cell"><strong>렌 · 벤치에 고정</strong></div><div class="sketch-cell"><strong>출입구·안쪽 길은 보임</strong></div><div class="sketch-cell"><strong>울타리 뒤 바닥·발은 가림</strong></div></div><div class="turn det prop-tts" data-prop="bench:board"><span class="who">탐정 · 게시판</span><p class="en prop-en">A noticeboard beside the path.</p><p class="ko prop-ko">길 옆에 게시판이 있어.</p><p class="fine">선택 관찰 · bench:board</p></div><div class="turn det prop-tts" data-prop="bench:lamp"><span class="who">탐정 · 가로등</span><p class="en prop-en">A lamp beside the bench.</p><p class="ko prop-ko">벤치 옆에 가로등이 있어.</p><p class="fine">선택 관찰 · bench:lamp</p></div></article></div></section><section id="story"><div class="section-head"><h2>의뢰와 진실</h2><p>제작자용 · 수정 대본 검토</p></div><ul><li><strong>의뢰인</strong>: 소풍 가방 사건에 등장했던 수달 올리. 이번에는 피아와 마을 화단을 함께 돌본다. 돌아와 망가진 꽃을 발견하고 누가 그랬는지 밝혀 달라고 요청한다. 주변을 막고 꺾인 모종을 보호해야 해서 현장에 남는다. 피아는 모종판을 준비하러 작업실에 가 있다. 이 보호·준비 행동은 별도 퀘스트가 아니다.</li><li><strong>풀 의문</strong>: 꽃을 심는 정상 작업과 이후 생긴 훼손은 어떻게 다른가? 누가 화단에 들어가 꽃을 밟았는가?</li><li><strong>진실</strong>: 너구리 거스가 공놀이를 하다 정원 안으로 공을 넘긴다. 공을 꺼내려 울타리를 넘어 정원 안쪽 길로 들어온 뒤, 화단 중앙의 공까지 곧장 걸으며 꽃을 밟는다. 중앙의 빈 흙은 꽃이 심긴 구간 너머에 있으며 별도 통로나 발판은 없다. 꽃을 망가뜨리려던 고의는 없지만 당황해 바깥길에서 공을 찾았다고 부인한다. 최종 확인에서 출입·훼손·숨긴 이유를 직접 인정한다.</li><li><strong>피아의 작업</strong>: 꽃을 심고 작은 삽을 화단 옆에 두었다. 올리의 사진에서는 심기가 끝난 뒤에도 모든 꽃이 멀쩡하다. 피아와 올리는 그 뒤 함께 가게에 갔다가 함께 돌아와 훼손을 발견한다. 흙 묻은 도구와 심기 흔적만으로 피아를 범인이라고 하지 않는다.</li><li><strong>루카의 행동</strong>: 코알라 루카가 혼자 꽃 사진을 찍으러 정원에 들어갔다. 화단으로 들어가지 않고 정원 안쪽 길에 머물렀다. 사진에 집중하다 꽃을 밟았을 가능성 때문에 조사하지만, 자기 주장만으로 제외하지 않는다. 렌은 루카가 길을 걷고 멈춰 찍다가 벤치로 돌아오는 전 구간과 그때도 멀쩡했던 꽃을 보았다. 거스와 공놀이하거나 함께 정원에 들어간 적은 없다. 현재 벤치 건너편에서 카메라를 정리한다. 꽃 훼손을 아직 보지 못했고 요청받으면 직접 아는 일을 설명한다.</li><li><strong>렌의 시야</strong>: 벤치에 앉아 두 친구의 출발, 울타리 위로 날아간 공, 공을 들고 정원 안쪽 길에서 돌아오는 거스를 보았다. 낮은 울타리와 꽃줄기에 바닥 시야가 가려져 공이 떨어진 위치·발로 밟는 순간은 보지 못했다. 목격하지 않은 훼손을 진술하지 않는다.</li><li><strong>해결</strong>: 피아는 작업 순서를 설명하는 참고인이다. 거스와 루카가 각각 정원에 들어갔을 가능성을 조사한다. 루카는 렌의 전 구간 목격으로 길에 머물렀음을 확인한다. 거스가 말한 마당 쪽 바깥길과 렌이 본 정원 안쪽 길의 차이를 짚고, 거스에게 공이 있던 위치와 공을 꺼낸 경로를 차례로 듣는다. 본인이 말한 직선 회수 경로와 좁은 구간을 따라 눌린 꽃·흐트러진 흙을 대조해 훼손 경위를 묻는다. 사진은 누군가 꽃 사이를 지나갔을 가능성만 보여 주며 사람이나 동물 종을 특정하지 않는다. 공에 묻은 흙의 출처도 단정하지 않는다. 공놀이한 인물이 혼자라는 사실만으로 범인이라고 하지 않는다. 현장에 선명한 공 자국을 새로 만들지 않으며, 공만으로 루카를 제외하지 않는다.</li></ul>
<h3>사건 순서</h3>
<ol><li>조사일 오전 피아와 올리가 꽃을 심는다. 도구·심기 흔적이 남는다.</li><li>올리가 작업 기록 사진을 찍는다. 꽃들이 멀쩡하다. 올리와 피아는 추가 모종을 받으러 가게에 가고 렌은 두 사람이 떠나는 것을 본다.</li><li>올리와 피아가 떠난 뒤 루카가 길 위에서 꽃 사진을 찍고 벤치로 돌아온다. 렌은 이 전 구간을 봤고 꽃은 계속 멀쩡하다.</li><li>거스가 마당에서 공놀이를 하다가 낮은 울타리 너머로 공을 보낸다. 공은 꽃을 직접 누르지 않고 화단 안의 빈 흙 부분에 떨어진다.</li><li>거스가 공을 꺼내려 정원에 들어와 꽃 사이를 걸으며 밟는다. 공에는 흙만 조금 묻는다. 렌은 거스가 정원 안쪽 길에서 공을 들고 나오는 것만 본다.</li><li>올리와 피아가 돌아와 훼손을 발견한다. 올리는 현장을 지키고 피아는 같은 모종 가게의 작업실로 돌아가 모종판을 준비한다. 거스는 마당, 렌은 벤치에 있다.</li><li>같은 날 오후 탐정이 의뢰를 받아 조사한다. 거스는 처음에는 공놀이·공 회수를 말하고, 정원 출입을 물었을 때 부인한다. 정원 출입을 인정한 뒤 공의 위치·회수 경로를 말하고, 현장 흔적을 대조한 마지막 질문에 훼손을 인정한다. 탐정이 올리에게 보고한다.</li></ol>
<p>정확한 시각·밤사이 사건·과거진행 알리바이는 넣지 않는다. 모종 작업실은 Plant Shop 안의 공간이고 같은 가게를 가리킨다. 함께 다녀온 가게와 현재 피아가 있는 작업실을 별도 지도 장소로 늘리지 않는다. 조사 중 NPC는 각자 제자리에 있다. 경찰·후보 전원 집합·즉석 화단 복구는 없다.</p>
<p><strong>인물 구성 변경(사용자 요청 반영)</strong>: 인원을 늘리지 않고 의뢰인 넬을 기존 수달 올리로 대체했다. 올리는 소풍 가방 사건에서 정원에 있던 같은 인물이며, 화단 돌봄은 이번 사건의 제작자용 배경이다. 이후 사용자 요청으로 용의자 루카를 추가해 현재 NPC는 기존 1명·신규 4명으로 총 5명이다. 기존 사건의 대본·설계서는 수정하지 않는다.</p></section><section id="cast"><div class="section-head"><h2>인물·장소·목격 시야</h2><p>제작자용 · 수정 대본 검토</p></div><p>주 의미 대조는 <strong>이미 끝난 행동을 했다 / 하지 않았다</strong>다. 열쇠는 Did ...? 질문, didn't + 동사원형, 긍정 과거형의 대표 went다. planted·played·took·left·came·flew는 사건 속 빈출 과거 어휘로 다루며 각각을 새 문법으로 늘리지 않는다. 과거형을 말했다는 이유만으로 진실이라고 판단하지 않고 물증·다른 기록과 대조한다.</p>
<div class="matrix"><table><thead><tr><th>인물</th><th>신규/재사용</th><th>현재 위치</th><th>제작자용 역할</th></tr></thead><tbody><tr><td>Ollie 올리 · 수달</td><td>재사용 · 소풍 가방 사건</td><td>마을 화단</td><td>의뢰인·정상 상태 사진 제공·피아와 꽃 작업</td></tr><tr><td>Pia 피아 · 돼지</td><td>신규</td><td>모종 작업실(Plant Shop)</td><td>꽃 심기·출발 순서를 설명하는 참고인. 용의자로 취급하지 않음</td></tr><tr><td>Gus 거스 · 너구리</td><td>신규</td><td>공놀이 마당</td><td>공을 회수하다 꽃을 밟은 실제 행위자</td></tr><tr><td>Luca 루카 · 코알라</td><td>신규 제안</td><td>공원 벤치 건너편</td><td>사진을 찍으러 정원에 들어간 별도 용의자. 렌 목격으로 길에 머문 사실 확인</td></tr><tr><td>Wren 렌 · 굴뚝새</td><td>신규</td><td>공원 벤치</td><td>출발·공 이동·귀환을 제한된 시야에서 목격</td></tr><tr><td>다람쥐 탐정</td><td>기존</td><td>플레이어가 선택한 장소</td><td>탐문·촬영·추리·확인·보고</td></tr></tbody></table></div>
<h3>배경과 두 길의 구별</h3>
<div class="matrix"><table><thead><tr><th>배경</th><th>고정 인물·배치</th><th>사진/관찰할 부분</th><th>다른 장소와 연결</th></tr></thead><tbody><tr><td>마을 화단</td><td>올리는 입구 옆. 벤치의 작업일지 위에 휴대전화와 모종 영수증</td><td>좁은 구간을 따라 눌린 꽃·그 사이 흐트러진 흙·작은 삽. 정원 안쪽 길이 꽃 옆을 지남</td><td>낮은 울타리 밖 마당 쪽 길과 안쪽 길이 함께 보임</td></tr><tr><td>모종 작업실</td><td>피아는 작업대 옆</td><td>모종판·장갑. 꽃 심기와 외출을 질문</td><td>Plant Shop은 실제 모종 영수증의 상호로 발견</td></tr><tr><td>공놀이 마당</td><td>거스는 골대 옆, 공은 발치</td><td>공 표면의 작은 흙 얼룩, 마당 쪽 바깥길</td><td>낮은 울타리 너머 정원과 안쪽 길이 보임</td></tr><tr><td>공원 벤치</td><td>렌은 벤치 옆, 루카는 건너편에 고정·각자 대화</td><td>정원 입구·길 위 루카의 이동 전 구간, 꽃머리와 공의 공중 이동</td><td>꽃머리는 보이나 화단 내부 바닥과 발은 가려짐. 루카가 길을 벗어났는지는 볼 수 있음</td></tr></tbody></table></div>
<p><strong>yard path</strong>는 울타리 바깥의 마당 쪽 길, <strong>garden path</strong>는 울타리 안의 정원 길이다. 같은 길을 다른 이름으로 부르지 않는다. 배경 구도가 이 구별을 보여 줘야 한다. 화단은 정원 안쪽 길에 붙어 있는 흙 구역이며, 정원에 들어간 사실과 꽃을 밟은 행동은 별도로 확인한다. 꽃들이 좁은 구간을 따라 연속해서 눌리고 그 사이 흙이 흐트러진 모습만 그린다. 발·발굽·발톱·신발의 윤곽이나 일정한 보행 간격은 그리지 않는다. 흔적으로 동물 종·몸집·개인을 알아낼 수 없으며, 누군가 지나갔다는 판단도 추측으로 말한다.</p>
<h3>배경 시야 확인 도해 — 원화 제작 기준</h3>
<p>벤치에서 정원 출입구와 안쪽 길은 한눈에 보인다. 루카는 그 길 위에서만 이동·촬영·귀환하므로 렌이 전 과정을 지켜볼 수 있다. 화단은 길 옆의 꽃이 심긴 영역이며, 가장자리 꽃줄기·잎에 가려 내부 지면과 발이 꽃에 닿는 순간은 보이지 않는다. 거스가 길로 돌아온 모습은 보이지만 훼손 행위 자체를 목격했다고 하지 않는다. 루카 확인에는 꽃의 전 구간 상태를 봤다는 주장도 필요 없다.</p>
<div class="matrix"><table><thead><tr><th>벤치에서 보는 구역</th><th>보이는 것</th><th>확인할 수 없는 것</th></tr></thead><tbody><tr><td>정원 출입구 → 안쪽 길 → 벤치 귀환</td><td>길 위 루카의 촬영 시작부터 끝까지, 거스의 공을 든 귀환</td><td>화단 내부의 발 접촉·공을 집는 손동작</td></tr><tr><td>길 옆 화단</td><td>정상 사진과 대조할 눌린 꽃·흐트러진 흙. 현장에서는 가까이 조사</td><td>벤치에서 개별 꽃 손상의 원인·개인 식별</td></tr><tr><td>울타리 너머 마당</td><td>골대와 마당, 울타리를 넘는 공의 공중 이동</td><td>공이 땅에 떨어진 정확한 지점</td></tr></tbody></table></div>
<p>이 표는 원화 제작 조건이다. <strong>실제 그림에서 이 시야가 성립하는지는 제작 뒤 확인 필요</strong>이며, 성립하지 않으면 목격 대사와 배치를 함께 재검토한다.</p></section><section id="evidence"><div class="section-head"><h2>필수 사진 3종 · 선택 공 사진 1종</h2><p>제작자용 · 수정 대본 검토</p></div><div class="evidence-grid"><article class="evidence-card" data-evidence="bed-photo"><span class="chip">필수 촬영</span><h3>화단</h3><div class="room-sketch"><div class="sketch-cell"><strong>좁은 구간을 따라 눌린 꽃·그 사이 흐트러진 흙·가장자리의 작은 삽과 심기 구멍. 개별 발 모양 없음</strong></div></div><p>올리 n1 뒤 화단 흙과 꽃</p><p>정상 작업과 이후 훼손을 구별. 사람의 종·신원은 알 수 없음</p></article><article class="evidence-card" data-evidence="garden-photo"><span class="chip">필수 촬영</span><h3>사진과 영수증</h3><div class="room-sketch"><div class="sketch-cell"><strong>멀쩡한 화단이 찍힌 화면·실제 영수증의 Plant Shop 상호</strong></div></div><p>n1 뒤 벤치의 휴대전화 화면과 옆 모종 영수증 촬영</p><p>정상 상태와 가게를 기록. 촬영 순서는 올리 답변으로 확인. 필수</p></article><article class="evidence-card" data-evidence="fence-photo"><span class="chip">필수 촬영</span><h3>울타리</h3><div class="room-sketch"><div class="sketch-cell"><strong>울타리의 넘은 자국·안쪽 길 가까이부터 이어지는 눌린 꽃과 흐트러진 흙·밖의 마당 쪽 길·울타리 너머 골대·공놀이 마당 전경</strong></div></div><p>올리 n1 뒤 낮은 울타리와 바닥</p><p>두 길과 이동 범위를 구별. 이름·소유자·CCTV 인물은 없음</p></article><article class="evidence-card" data-evidence="ball-photo"><span class="chip">선택 촬영</span><h3>흙 묻은 공</h3><div class="room-sketch"><div class="sketch-cell"><strong>공 대부분은 깨끗하고 작고 옅은 흙 얼룩만 있음</strong></div></div><p>g4 허락·열린 거스 질문 완료 뒤 선택 촬영</p><p>선택 기록. 흙의 출처·훼손·범인을 입증하지 않으며 해금·완료 조건이 아님</p></article></div><p>사진은 실제 보이는 흔적과 상태만 기록합니다. 익명의 흔적이나 공의 흙만으로 범인을 확정하지 않습니다.</p></section><section id="learning"><div class="section-head"><h2>학습·복습·실제 균형</h2><p>제작자용 · 수정 대본 검토</p></div><h3>열쇠 카드와 사건 밖 예문</h3>
<p>세 형태의 한국어 설명과 예문 3개씩 준비한다. 실제 사건의 인물·장소·시각을 예문에 쓰지 않는다. 예문은 해석을 눌러 한국어를 확인하며, 핵심 설명은 한국어로 바로 읽는다. 예습·재생 반복은 본편 반복 횟수에 넣지 않는다.</p>
<div class="matrix"><table><thead><tr><th>형태</th><th>설명</th><th>사건 밖 예문 3개</th></tr></thead><tbody><tr><td>Did ...?</td><td>끝난 행동을 했는지 묻는다. did 뒤에는 동사원형을 쓴다.</td><td>Did you open the window? / 창문을 열었니?<br>Did she finish her homework? / 그 친구는 숙제를 끝냈니?<br>Did they watch the film? / 그 친구들은 영화를 봤니?</td></tr><tr><td>didn't + 동사원형</td><td>하지 않은 행동을 말한다. 부정문에서는 동사에 과거형을 또 붙이지 않는다.</td><td>I didn't open the window. / 난 창문을 열지 않았어.<br>He didn't finish his homework. / 그 친구는 숙제를 끝내지 않았어.<br>They didn't watch the film. / 그 친구들은 영화를 보지 않았어.</td></tr><tr><td>went · go의 과거형</td><td>한 행동을 긍정문으로 말할 때 과거형을 쓴다. 대표 went와 did/didn’t 뒤 go를 구별한다.</td><td>I went to school yesterday. / 난 어제 학교에 갔어.<br>We went home after lunch. / 우리는 점심 뒤 집에 갔어.<br>She went to the library on Monday. / 그 친구는 월요일에 도서관에 갔어.</td></tr></tbody></table></div>
<h3>다시 들을 본편 문장</h3>
<div class="matrix"><table><thead><tr><th>형태</th><th>본편 출처</th><th>다시 들을 범위</th></tr></thead><tbody><tr><td>Did ...?</td><td>gus:g2 질문</td><td>Did your ball stay in the yard?</td></tr><tr><td>didn't + 동사원형</td><td>gus:g3 답</td><td>No, I didn't go in. I found it outside, on the yard path.</td></tr><tr><td>긍정 과거 went</td><td>pia:p3 답</td><td>Ollie and I went to the shop for more plants.</td></tr></tbody></table></div>
<p>새 단어는 실제 빈칸에서 고르고 인물 이름은 빼며, 뜻은 사건 해결 뒤 복습에서 기본 표시한다. 과거형 낱말은 문법 형태와 연결하되 모두 별개의 문법 단원으로 늘리지 않는다.</p>
<div class="matrix"><table><thead><tr><th>단어</th><th>뜻</th><th>실제 빈칸 출처</th></tr></thead><tbody><tr><td>flowers</td><td>꽃들</td><td>ollie:n0</td></tr><tr><td>damaged</td><td>망가진</td><td>ollie:n0</td></tr><tr><td>took</td><td>찍었다·가져갔다, take의 과거형</td><td>ollie:n1</td></tr><tr><td>photo</td><td>사진</td><td>ollie:n1</td></tr><tr><td>fine</td><td>멀쩡한·괜찮은</td><td>ollie:n1 · wren:w1</td></tr><tr><td>shop</td><td>가게</td><td>pia:p3</td></tr><tr><td>plants</td><td>식물들·모종들</td><td>pia:p3</td></tr><tr><td>planted</td><td>심었다, plant의 과거형</td><td>pia:p1</td></tr><tr><td>went</td><td>갔다, go의 과거형</td><td>pia:p3 · gus:g2</td></tr><tr><td>friends</td><td>친구들</td><td>pia:p4</td></tr><tr><td>bench</td><td>벤치</td><td>pia:p4</td></tr><tr><td>played</td><td>놀았다, play의 과거형</td><td>gus:g1</td></tr><tr><td>ball</td><td>공</td><td>gus:g1 · wren:w2</td></tr><tr><td>fence</td><td>울타리</td><td>gus:g2 · wren:w2</td></tr><tr><td>back</td><td>다시·돌아와</td><td>gus:g2</td></tr><tr><td>yard path</td><td>마당 쪽 길</td><td>gus:g3</td></tr><tr><td>outside</td><td>바깥에</td><td>gus:g3</td></tr><tr><td>look</td><td>보다</td><td>gus:g4</td></tr><tr><td>here</td><td>여기</td><td>gus:g4</td></tr><tr><td>left</td><td>떠났다, leave의 과거형</td><td>wren:w1</td></tr><tr><td>garden path</td><td>정원 안쪽 길</td><td>wren:w3</td></tr><tr><td>photos</td><td>사진들</td><td>luca:l1</td></tr><tr><td>between</td><td>~ 사이에</td><td>luca:l2</td></tr><tr><td>stayed</td><td>머물렀다</td><td>wren:w4</td></tr><tr><td>watched</td><td>지켜봤다</td><td>wren:w4</td></tr><tr><td>path</td><td>길</td><td>wren:w4</td></tr></tbody></table></div>
<h3>표현·추가 단어 — 근거 발화 포함</h3>
<div class="matrix"><table><thead><tr><th>표현·단어</th><th>뜻</th><th>출처</th></tr></thead><tbody><tr><td>step on</td><td>밟다</td><td>det:cq2 · Did you step on the flowers on the way?</td></tr><tr><td>come back</td><td>돌아오다</td><td>wren:w3 · Gus came back with a ball from the garden path</td></tr><tr><td>by accident</td><td>실수로</td><td>gus:a2 · I stepped on them by accident.</td></tr><tr><td>marks</td><td>흔적들·자국들</td><td>obs:f1 · There are marks in the soil.</td></tr><tr><td>soil</td><td>흙</td><td>obs:f1 · There are marks in the soil.</td></tr><tr><td>mud</td><td>흙·진흙</td><td>obs:f4 · There is a little mud on the ball. 선택 관찰</td></tr><tr><td>receipt</td><td>영수증</td><td>obs:shop-name · The receipt says Plant Shop.</td></tr><tr><td>straight</td><td>곧장</td><td>gus:ball-route · I walked straight from the path to my ball.</td></tr><tr><td>middle</td><td>한가운데</td><td>gus:ball-place · In the middle of the flower bed.</td></tr></tbody></table></div>
<p>come back·step on·by accident는 표현으로 다룬다. whole time(내내)은 wren:w4의 실제 대답에, straight(곧장)·middle(한가운데)은 마지막 회수 질문의 대답에 나오며 새 문법 목표로 늘리지 않는다. didn't·went는 열쇠 문법에 두고 사람 이름은 단어 카드로 만들지 않는다. 추가 marks/soil/mud 어휘는 현장 관찰에 실제 들린다는 출처를 남긴다.</p>
<h3>들은 정보와 판단의 연결</h3>
<div class="matrix"><table><thead><tr><th>알아들어야 하는 말</th><th>연결할 자료</th><th>판단</th></tr></thead><tbody><tr><td>pia:p1 planted / flowers</td><td>정상 작업 사진·올리 n1</td><td>꽃을 심은 행동을 훼손과 구별</td></tr><tr><td>pia:p3 went / plants</td><td>렌 w1 출발 목격·정상 사진</td><td>작업과 이후 훼손의 순서를 확인. 피아를 용의자로 삼지 않음</td></tr><tr><td>gus:g1 played / gus:g3 didn't go</td><td>Q4·wren:w3·fence-photo</td><td>공놀이 긍정과 정원 출입 부정을 구별하고 목격과 대조</td></tr><tr><td>luca:l2 didn't / between · wren:w4 stayed / path</td><td>bed-photo</td><td>루카는 길 위, 눌린 꽃·흐트러진 흙은 화단 안. 전 구간 목격과 대조해 제외</td></tr><tr><td>gus:g2 went over / got it back</td><td>fence-photo·wren:w2</td><td>공의 이동·회수는 들었지만 공 위치는 아직 본인 주장임</td></tr><tr><td>gus:g3 didn't go / outside · wren:w3 garden path</td><td>Q4·Q5·fence-photo</td><td>정원 출입 부정과 안쪽 길 귀환을 구별</td></tr><tr><td>gus:ball-place·ball-route / gus:c2 didn't step</td><td>bed-photo·Q1 정상 상태</td><td>중앙 위치·직선 경로를 눌린 구간과 대조한 뒤 직접 질문</td></tr></tbody></table></div><p>아래는 2단계 작성의 기본 수치 확인이다. 사용자 요청 점검의 개선 반영 결과다. 원화·엔진의 미확인 사항은 남아 있으며, 대본 수정이 개발 인계나 검증 완료를 뜻하지 않는다. 학생 플레이·소요 시간·음성 청취·학습 효과는 검증 안 함이다.</p>

<div class="matrix"><table><thead><tr><th>열쇠 형태</th><th>정상 진행에서 들리는 수</th><th>NPC 질문·답변의 예</th></tr></thead><tbody><tr><td>Did ...? 질문</td><td>9회</td><td>gus:g1·g2·g3·wren:w1·w3·w4·luca:l1</td></tr><tr><td>didn't + 동사원형</td><td>9회</td><td>gus:g3·wren:w2·luca:l1·l2</td></tr><tr><td>긍정 과거 went</td><td>4회</td><td>pia:p3·gus:g2</td></tr></tbody></table></div>
<p>발화 수는 선택한 조사 질문·답변, 필수 현장 관찰·생각·확인·보고·추리 맞장구를 정상적으로 한 번씩 듣는 기준이다. Did 질문 수에는 어순이 다른 who did it·What did you use와 부정 Why didn't 질문을 더하지 않는다. went는 단어 형태의 실제 발생을 센다. 선택 공 관찰 obs:f4·선택 TTS·예습·복습·이동 버튼 문구·추리 완성 문장·힌트·오답 재생·다시 듣기는 제외한다. 조건에 따라 생략되는 think:luca-check·think:wren-again은 제외했다. 루카 확인 생각의 went는 필수 횟수에 넣지 않는다.</p>

<p><strong>이번에 검토받을 것</strong>: 거스의 공 위치·직선 회수 경로와 현장 흔적의 연결, did/didn't 인용과 목격의 대조, 렌 시야 원화의 실현 가능성, 선택 공 사진 없이 끝까지 진행되는 조건. 세부 영어 문장·보기·사진 구도는 제작 제안이며 개별적으로 사용자가 정한 것으로 표기하지 않는다. B안 선택은 사용자 승인이다.</p>

        if(!found.length)continue;
        const group=node('div','','reader-inspector-group');group.append(node('h4',page.label));
        for(const detail of found)for(const child of unwrap(detail))group.append(clone(child));
        panel.append(group);count++;
      }
      if(!count)panel.append(node('p','이 장면은 대화와 행동을 확인하는 장면이야.'));
    } else {
      panel.append(panelHeading('이 장면의 제작 메모'));
      for(const page of scene.pages) {
        const found=page.nodes.flatMap(n=>[...n.querySelectorAll('details')]).filter(n=>text(n.querySelector('summary')).startsWith('제작 메모'));
        if(!found.length)continue;
        const group=node('div','','reader-inspector-group');group.append(node('h4',page.label));
        for(const detail of found)for(const child of unwrap(detail))group.append(clone(child));
        panel.append(group);
      }
      for(const detail of scene.memo)for(const child of unwrap(detail))panel.append(clone(child));
    }
    panel.scrollTop=0;
  }
  function fillFlow() {
    const canvas=$('reader-canvas');
    if(state.item===0) {
      const box=node('div','','reader-summary');
      const summary=clone(flowItems[0].node);summary.querySelector('.section-head')?.remove();
      box.append(...summary.children);
      const hero=source.querySelector('.hero');box.append(clone(hero.querySelector('.chips')));
      box.append(clone(hero.querySelector('.lead')),clone(hero.querySelector('figcaption')));
      const b=node('button','해결 흐름도 보기 →','reader-mini');b.type='button';b.dataset.flow='2';box.append(b);
      canvas.append(box);return;
    }
    const flow=node('div','','reader-flow');
    const toolbar=node('div','','reader-flow-toolbar');
    const b=node('button','확대해서 보기','reader-mini');b.type='button';b.dataset.zoom='toggle';b.setAttribute('aria-pressed','false');
    toolbar.append(b,node('span','카드 선택 → 해당 대본'));
    const paper=node('div','','reader-flow-paper');paper.append(clone(flowItems[state.item].node));flow.append(toolbar,paper);canvas.append(flow);
  }
  function render(focusDialogue=false) {
    const current=selected();
    for(const b of root.querySelectorAll('[data-mode]'))b.setAttribute('aria-pressed',String(b.dataset.mode===state.mode));
    $('reader-context').textContent=current.context;
    $('reader-title').textContent=state.mode==='script'?current.title.replace(/^장면 \d+ · /,'').replace(/^.* — /,''):current.title;
    $('reader-purpose').textContent=current.purpose;
    fillList();
    const stage=$('reader-stage');stage.classList.toggle('reader-wide',state.mode!=='script');
    $('reader-inspector').hidden=state.mode!=='script';
    $('reader-jump').hidden=state.mode==='flow';
    $('reader-jump').classList.toggle('reader-scene-tools',state.mode==='script');
    $('reader-jump').querySelector('label').hidden=state.mode!=='reference';
    $('reader-step').hidden=state.mode!=='reference';
    $('reader-step').replaceChildren();
    if(state.mode==='reference')for(const [index,p] of pages().entries()) {
      const option=node('option',String(state.mode==='script'?index:index+1).padStart(2,'0')+' · '+p.label);option.value=String(index);$('reader-step').append(option);
    }
    if(state.mode==='reference')$('reader-step').value=String(state.page);
    $('reader-jump').querySelector('label').textContent=state.mode==='reference'?'항목 선택':'대화 선택';
    root.querySelector('[data-details-toggle]').hidden=state.mode!=='script';
    const canvas=$('reader-canvas');canvas.replaceChildren();
    if(state.mode==='flow')fillFlow();
    else {
      const page=node('div','',state.mode==='reference'?'reader-reference':'reader-page reader-transcript');
      const groups=state.mode==='script'?selected().pages:[pages()[state.page]];
      for(const [index,group] of groups.entries()) {
        const block=node('div','',state.mode==='script'?'reader-dialogue-block':'reader-reference-block');
        if(state.mode==='script')block.dataset.dialogueIndex=String(index);
        for(const n of group.nodes) {
          if(n.matches('.plan-anchor'))continue;
          const c=clone(n);
          if(state.mode==='script')for(const detail of c.querySelectorAll('details')) {
            if(/^(학습 설계|제작 메모)/.test(text(detail.querySelector('summary'))))detail.remove();
          }
          block.append(c);
        }
        page.append(block);
      }
      canvas.append(page);
      if(state.mode==='script')highlightLearning(page);
    }
    const prev=$('reader-prev'),next=$('reader-next');
    prev.disabled=state.item===0 && (state.mode==='script'||state.page===0);
    next.disabled=state.item===items().length-1 && (state.mode==='script'||state.page===pages().length-1);
    prev.textContent=state.mode==='script'?'← 이전 장면':'← 이전';
    next.textContent=state.mode==='script'?'다음 장면 →':'다음 →';
    $('reader-position').textContent=state.mode==='flow'?(state.item+1)+' / '+items().length:
      state.mode==='script'?'장면 '+(state.item+1)+' / '+items().length:
      '항목 '+(state.page+1)+' / '+pages().length;
    fillInspector();
    canvas.scrollTop=state.mode==='script'?(sceneScroll.get(state.item)||0):0;
    if(state.mode==='script' && focusDialogue) {
      const target=canvas.querySelector('[data-dialogue-index="'+state.page+'"]');
      canvas.scrollTop=Math.max(0,(target?.offsetTop||0)-12);
    }
  }
  function restoreRoute() {
    let hash='';try{hash=decodeURIComponent(location.hash.slice(1));}catch{}
    const target=routes.get(hash) || (hash==='flow-truth'?{mode:'flow',item:1,page:0}:null);
    if(target)select(target.mode,target.item,target.page,false);
    else select('flow',0,0,false);
  }
  root.addEventListener('click',event=> {
    const button=event.target.closest('button');
    if(!button)return;
    if(button.dataset.mode) {
      const mode=button.dataset.mode;
      select(mode,mode===state.mode?state.item:lastItems[mode],undefined,true,true);
    } else if(button.dataset.item!==undefined)select(state.mode,Number(button.dataset.item),undefined,true,true);
    else if(button.dataset.page!==undefined)select('script',state.item,Number(button.dataset.page));
    else if(button.dataset.inspector) {state.inspector=button.dataset.inspector;fillInspector();}
    else if(button.hasAttribute('data-details-toggle'))root.dataset.details=root.dataset.details==='open'?'closed':'open';
    else if(button.dataset.flow)select('flow',Number(button.dataset.flow),0,true,true);
    else if(button.dataset.zoom) {
      state.zoom=!state.zoom;
      root.querySelector('.reader-flow').classList.toggle('is-zoomed',state.zoom);
      button.textContent=state.zoom?'전체 보기':'확대해서 보기';button.setAttribute('aria-pressed',String(state.zoom));
    }
  });
  document.addEventListener('click',event=> {
    const link=event.target.closest('a[href^="#"]');if(!link)return;
    const id=decodeURIComponent(link.getAttribute('href').slice(1)),target=routes.get(id);
    if(target){event.preventDefault();select(target.mode,target.item,target.page,true,true);}
  });
  $('reader-mobile-select').addEventListener('change',e=>select(state.mode,Number(e.target.value),undefined,true,true));
  $('reader-step').addEventListener('change',e=>select(state.mode,state.item,Number(e.target.value)));
  $('reader-prev').addEventListener('click',()=>navigate(-1));$('reader-next').addEventListener('click',()=>navigate(1));
  root.querySelector('[role="tablist"]').addEventListener('keydown',event=> {
    if(!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;
    const tabs=[...root.querySelectorAll('[data-inspector]')];let index=tabs.findIndex(b=>b.dataset.inspector===state.inspector);
    index=event.key==='Home'?0:event.key==='End'?tabs.length-1:(index+(event.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;
    event.preventDefault();event.stopPropagation();state.inspector=tabs[index].dataset.inspector;fillInspector();tabs[index].focus();
  });
  root.addEventListener('keydown',event=> {
    if(event.altKey||event.ctrlKey||event.metaKey||event.shiftKey||event.target.closest('select,input,textarea,summary'))return;
    if(event.key==='ArrowLeft'||event.key==='ArrowRight'){event.preventDefault();navigate(event.key==='ArrowLeft'?-1:1);}
  });
  addEventListener('hashchange',restoreRoute);addEventListener('popstate',restoreRoute);
  // Inspection hook for document verification; it does not change story or game data.
  window.flowerbedPlanningReader={
    snapshot:()=>({state:{...state},scenes:scenes.map(s=>({id:s.id,pages:s.pages.map(p=>p.anchor)})),routes:[...routes.keys()]}),
    select:(mode,item,page)=>select(mode,item,page),navigate
  };
  restoreRoute();
})();
</script></body></html>
