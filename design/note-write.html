<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>받아 적기 화면 시안</title>
<style>
@font-face{font-family:"Paperlogy";src:url("../assets/fonts/Paperlogy-4Regular.woff2") format("woff2");font-weight:400}
@font-face{font-family:"Paperlogy";src:url("../assets/fonts/Paperlogy-7Bold.woff2") format("woff2");font-weight:700}
@font-face{font-family:"Paperlogy Display";src:url("../assets/fonts/Paperlogy-6SemiBold.woff2") format("woff2");font-weight:400}
:root{--ground:#B6BDA5;--ink:#4A3628;--ink-soft:#7D6A58;--honey:#F2CF73;--line:#E3D5B8;--berry:#C96F86;--moss:#8DB48E;--ok:#5E8A63;--sheet:#FDFAEE;--pen:#34506E;
  --f-display:"Paperlogy Display","Paperlogy",system-ui,sans-serif;--f-hand:"Paperlogy",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--f-hand)}
.wrap{max-width:1240px;margin:0 auto;padding:28px 20px 56px}
h1{font-family:var(--f-display);font-weight:400;font-size:24px;margin:0 0 4px}
.lead{margin:0 0 22px;font-size:14px;opacity:.8;max-width:820px;line-height:1.6}
.grid{display:flex;flex-wrap:wrap;gap:34px 30px;align-items:flex-start}
.opt{width:360px;max-width:100%}
.opt h2{margin:0 0 10px;font-family:var(--f-display);font-weight:400;font-size:17px}
.opt ul{margin:12px 0 0;padding-left:18px;font-size:13px;line-height:1.6;color:var(--ink-soft)}
.opt li{margin:2px 0}

/* the phone: the scene (the library, Sgt. Badger standing) with the notebook pulled up over it */
.phone{position:relative;width:360px;max-width:100%;height:740px;border-radius:36px;overflow:hidden;background:#6B4A30 url(../assets/places/library-higgsfield-v2.png) 40% 0/auto 560px no-repeat;box-shadow:0 10px 30px rgba(40,30,20,.25)}
.npc{position:absolute;left:50%;width:220px;transform:translateX(-50%);transition:top .35s}
.s1 .npc{top:40px}
.s2 .npc{top:-6px;width:170px}
.chip{position:absolute;top:16px;left:16px;display:flex;gap:8px;align-items:center}
.chip span{padding:5px 12px;border-radius:14px;background:rgba(253,250,238,.92);font-family:var(--f-display);font-size:14px}
.chip b{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:rgba(253,250,238,.92);font-size:16px}

/* the notebook: the case-file picture with the tabs (as in the game) */
.dock{position:absolute;left:6px;right:6px;bottom:-4px;display:flex;flex-direction:column;padding:7.9% 9% 0 9.5%;transition:bottom .35s,height .35s}
.dock::before{content:"";position:absolute;inset:0;background:url(../assets/ui/casefile-panel.webp) top center/100% auto no-repeat}
.dock > *{position:relative}
.s1 .dock{height:60%}
.note-cats{position:absolute;bottom:100%;margin-bottom:-9.5%;left:7%;display:flex;gap:5px;align-items:flex-end}
.ncat{--tab:url(../assets/ui/tab-1.png);position:relative;width:58px;height:44px;filter:drop-shadow(0 1px 1.2px rgba(30,24,20,.3))}
.ncat:nth-child(2){--tab:url(../assets/ui/tab-2.png)}
.ncat:nth-child(3){--tab:url(../assets/ui/tab-3.png)}
.face{position:absolute;inset:0;display:grid;place-items:center;padding-bottom:6px;background:#DCCCA8;-webkit-mask:var(--tab) center/100% 100% no-repeat;mask:var(--tab) center/100% 100% no-repeat}
.ncat:nth-child(2) .face{background:#D5C39C}
.ncat:nth-child(3) .face{background:#CFBD96}
.face::before{content:"";position:absolute;inset:0;background:var(--tab) center/100% 100% no-repeat;mix-blend-mode:multiply}
.ncat.on{z-index:1;height:52px;filter:none}
.ncat.on .face{padding-bottom:7px;background:var(--sheet);-webkit-mask:var(--tab) top/100% 112% no-repeat,linear-gradient(#000 calc(100% - 5px),transparent);-webkit-mask-composite:source-in;
  mask:var(--tab) top/100% 112% no-repeat,linear-gradient(#000 calc(100% - 5px),transparent);mask-composite:intersect}
.ncat.on .face::before{background-position:top;background-size:100% 112%}
.st{position:relative;color:#7A5C47;opacity:.62;filter:url(#inky);mix-blend-mode:multiply}
.st svg{display:block;width:24px;height:24px}
.ncat.on .st{color:var(--pen);opacity:.92;transform:rotate(-6deg)}
.edge{position:absolute;left:0;right:0;top:0;margin-top:5.4945%;aspect-ratio:728/44;background:url(../assets/ui/casefile-paper-edge.png) 0 0/100% 100% no-repeat;filter:drop-shadow(0 -.5px .8px rgba(40,28,18,.22))}

/* listening tools: one round ▶ (the main thing), the speed chip for slow, the acorn hint with its count — no boxes */
.tools{display:flex;align-items:center;gap:8px;padding:2px 0 10px;border-bottom:2px dashed var(--line)}
.play{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px 0 6px;border:2px solid var(--ink);border-radius:18px;background:#FFFDF7;font-family:var(--f-display);font-size:14px;color:var(--ink);box-shadow:2px 2px 0 rgba(74,54,40,.18)}
.play i{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--ink);color:#FFFDF7;font-style:normal;font-size:11px;padding-left:2px}
.ico{position:relative;display:grid;place-items:center;width:36px;height:36px;border:0;border-radius:50%;background:none;padding:0}
.ico img{width:26px;height:26px;opacity:.55;filter:grayscale(.4)}
.ico.on{background:var(--honey)}
.ico.on img{opacity:1;filter:none}
.ico .n{position:absolute;right:0;bottom:2px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--ink);color:#FFFDF7;font-size:10px;line-height:16px;font-weight:700;text-align:center}
.tools .hint{margin-left:auto}
.tools .hint img{opacity:1;filter:none}

/* the page: the question, then the sentences on the ruled lines, a blank = a gap on the line */
.q{margin:12px 0 2px;font-family:var(--f-display);font-size:13px;color:var(--ink-soft)}
.lines{font-size:19px;line-height:42px;color:var(--ink);background:repeating-linear-gradient(transparent 0 40px,var(--line) 40px 42px)}
.blank{display:inline-block;min-width:96px;height:42px;margin:0 3px;vertical-align:top;border-bottom:2px solid #BFAF92;line-height:40px;text-align:center;color:var(--pen);font-weight:700;transition:border-color .2s}
/* the blank's line is the page's own ruled line, only darker: no second line under the text */
.blank.next{border-bottom:3px solid var(--honey)}
.blank.filled{border-bottom-color:var(--pen);min-width:0;padding:0 6px}
.blank.focus{border-bottom-color:var(--berry);background:rgba(201,111,134,.08);border-radius:6px 6px 0 0;text-align:left;padding:0 6px}
.blank.focus::after{content:"";display:inline-block;width:2px;height:22px;margin-left:1px;vertical-align:-4px;background:var(--pen);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* the word cards: one colour (cream paper), used ones fade */
.bank{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.word{padding:5px 12px;border:1.5px solid var(--ink);border-radius:12px 14px 11px 15px;background:#FFFDF7;font-family:var(--f-hand);font-weight:700;font-size:15px;color:var(--ink);box-shadow:1.5px 2px 0 rgba(74,54,40,.18);cursor:pointer}
.word.used{opacity:.35;box-shadow:none}

/* 기록 완료: the one strong button, at the bottom, pale until every blank has a word */
.done{margin-top:auto;margin-bottom:22px;width:100%;height:46px;border:2px solid var(--ink);border-radius:16px;background:var(--moss);font-family:var(--f-display);font-size:16px;color:var(--ink);box-shadow:2px 3px 0 rgba(74,54,40,.25);transition:.2s}
.done:disabled{background:#E9E1CF;color:#A6957F;border-color:#CDBFA4;box-shadow:none}

/* ---- the keyboard state: the notebook sits on the keyboard, a slim tool strip rides on top of it ---- */
.s2 .dock{bottom:calc(var(--kb) + 46px);height:calc(100% - var(--kb) - 46px - 150px)}
.s2{--kb:262px}
.strip{position:absolute;left:0;right:0;bottom:var(--kb);height:46px;display:flex;align-items:center;gap:6px;padding:0 8px;background:#F4EAD4;border-top:1.5px solid #D8C7A6}
.strip .play{height:32px;padding:0 10px 0 4px;font-size:13px;box-shadow:none}
.strip .play i{width:24px;height:24px}
.strip .ico{width:32px;height:32px}
.strip .ico img{width:22px;height:22px}
.arrows{display:flex;gap:2px;margin-left:auto}
.arrows button{width:32px;height:32px;border:0;border-radius:50%;background:none;font-size:20px;color:var(--ink);padding:0}
.arrows button:disabled{color:#C6B79C}
.strip .ok{height:32px;padding:0 14px;border:2px solid var(--ink);border-radius:14px;background:var(--moss);font-family:var(--f-display);font-size:13px;color:var(--ink)}
.kb{position:absolute;left:0;right:0;bottom:0;height:var(--kb);padding:8px 4px 26px;background:#D1D4DA;display:flex;flex-direction:column;gap:9px;font-family:system-ui,sans-serif}
.kb div{display:flex;justify-content:center;gap:5px}
.kb span{flex:0 0 31px;height:42px;display:grid;place-items:center;border-radius:6px;background:#fff;box-shadow:0 1px 0 #8A8D93;font-size:19px;color:#111}
.kb .w{flex-basis:44px;background:#ADB3BC;font-size:14px}
.kb .sp{flex:1 1 auto;max-width:170px;font-size:14px}
.kb .go{flex-basis:78px;background:#2F6FE0;color:#fff;font-size:14px}

/* 천천히 = a speed chip (user decision, instead of the turtle): 1× / 0.7×, honey when slow */
.spd{height:32px;min-width:48px;padding:0 10px;border:1.5px solid #CDBFA4;border-radius:16px;background:none;font-family:var(--f-display);font-size:13px;color:var(--ink-soft)}
.spd.on{border-color:var(--ink);background:var(--honey);color:var(--ink)}
.strip .spd{height:30px;min-width:44px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="inky"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="1.3"/></filter></svg>
<div class="wrap">
  <h1>받아 적기 화면 시안</h1>
  <p class="lead">게임에 적용한 안(사용자 선택). 질문을 듣고 노트에 받아 적는 화면을 덜 복잡하게, 그리고 직접 입력할 때 키보드가 올라오는 것까지. 천천히 버튼은 속도 칩(고르지 않은 안: 거북이, 글자 토글, 재생 버튼 둘로 나누기, 속도계). 왼쪽은 단어 카드로 채울 때(키보드 없음), 오른쪽은 빈칸을 눌러 직접 입력할 때. 왼쪽은 단어를 눌러 채워 볼 수 있어요. 키보드는 모양만 그린 것이라 실제 높이는 폰마다 다르다(게임에서는 <code>visualViewport</code>로 잰다).</p>
  <div class="grid" id="grid"></div>
</div>
<script>
const STAMP = [
  '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M5 3.5h8.4a3 3 0 0 1 3 3v4.8a3 3 0 0 1-3 3H8.8l-3.6 3v-3H5a3 3 0 0 1-3-3V6.5a3 3 0 0 1 3-3z"/><path fill="currentColor" opacity=".6" d="M17.6 8.6h1.6a2.8 2.8 0 0 1 2.8 2.8v3.6a2.8 2.8 0 0 1-2.8 2.8v2.6l-3-2.6h-2.4a2.8 2.8 0 0 1-2.4-1.4h2.6a4.5 4.5 0 0 0 3.6-4.4z"/></svg>',
  '<svg viewBox="0 0 24 24"><path fill="currentColor" fill-rule="evenodd" d="M4.5 7h3l1.6-2.5h5.8L16.5 7h3a2.5 2.5 0 0 1 2.5 2.5v8.3a2.5 2.5 0 0 1-2.5 2.5h-15A2.5 2.5 0 0 1 2 17.8V9.5A2.5 2.5 0 0 1 4.5 7zM12 9.6a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm0 2a2 2 0 1 1 0 4 2 2 0 0 1 0-4z"/></svg>',
  '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2.5a4.6 4.6 0 0 1 2.9 8.2l.4 1.5h1.6a1.8 1.8 0 0 1 0 3.6h-3.6v4.6a1.3 1.3 0 0 1-2.6 0v-4.6H7.1a1.8 1.8 0 0 1 0-3.6h1.6l.4-1.5A4.6 4.6 0 0 1 12 2.5z"/></svg>',
];
const tabs = `<div class="note-cats">${STAMP.map((s, i) => `<span class="ncat${i ? '' : ' on'}"><span class="face"><span class="st">${s}</span></span></span>`).join('')}</div><div class="edge"></div>`;
const scene = `<img class="npc" src="../assets/characters/sgt-badger-higgsfield.png" alt=""><div class="chip"><b>‹</b><span>Sgt. Badger</span></div>`;
const tools = () => `<div class="tools"><button class="play" type="button"><i>▶</i>다시 듣기</button><button class="spd${toggled.spd ? ' on' : ''}" type="button" data-toggle="spd" aria-label="천천히">${toggled.spd ? '0.7×' : '1×'}</button><button class="ico hint" type="button" aria-label="힌트"><img src="../assets/ui/icons-v2/acorn.png" alt=""><span class="n">3</span></button></div>`;
const ANS = ['library', 'Sgt. Badger'];
const hintBtn = `<button class="ico hint" type="button" aria-label="힌트"><img src="../assets/ui/icons-v2/acorn.png" alt=""><span class="n">3</span></button>`;
const WORDS = ['library', 'bakery', 'Sgt. Badger', 'Mrs. Mole'];
let filled = [];
const toggled = {};
function phone1(){
  const b = i => filled[i] ? `<span class="blank filled">${filled[i]}</span>` : `<span class="blank${i === filled.length ? ' next' : ''}"></span>`;
  return `<div class="phone s1">${scene}<div class="dock">${tabs}${tools()}
    <div class="q">Q. What should I do next?</div>
    <div class="lines">Look around the ${b(0)} carefully.<br>When I know who did it, I tell ${b(1)}.</div>
    <div class="bank">${WORDS.map(w => `<button class="word${filled.includes(w) ? ' used' : ''}" type="button" data-w="${w}">${w}</button>`).join('')}</div>
    <button class="done" type="button"${filled.length < 2 ? ' disabled' : ''}>기록 완료</button></div></div>`;
}
function phone2(){
  const keys = ['qwertyuiop', 'asdfghjkl', 'zxcvbnm'];
  return `<div class="phone s2">${scene}<div class="dock">${tabs}
    <div class="q">Q. What should I do next?</div>
    <div class="lines">Look around the <span class="blank focus">libr</span> carefully.<br>When I know who did it, I tell <span class="blank"></span>.</div></div>
    <div class="strip"><button class="play" type="button"><i>▶</i>다시 듣기</button><button class="spd${toggled.spd ? ' on' : ''}" type="button" data-toggle="spd" aria-label="천천히">${toggled.spd ? '0.7×' : '1×'}</button>
      <span class="arrows"><button type="button" disabled aria-label="앞 빈칸">‹</button><button type="button" aria-label="다음 빈칸">›</button></span><button class="ok" type="button">완료</button></div>
    <div class="kb"><div>${[...keys[0]].map(k => `<span>${k}</span>`).join('')}</div><div>${[...keys[1]].map(k => `<span>${k}</span>`).join('')}</div>
      <div><span class="w">⇧</span>${[...keys[2]].map(k => `<span>${k}</span>`).join('')}<span class="w">⌫</span></div>
      <div><span class="w">123</span><span class="sp">space</span><span class="go">다음</span></div></div></div>`;
}
function render(){
  document.getElementById('grid').innerHTML = `
  <section class="opt"><h2>1. 단어 카드로 채울 때</h2>${phone1()}
    <ul><li>위 줄은 듣기 도구만: 동그란 ▶ <b>다시 듣기</b>, 속도 칩 <b>1× ↔ 0.7×</b>(천천히, 느리게일 때 꿀색 — 사용자 선택, 거북이 대신), 도토리 힌트(남은 수만 작게). 상자 없음.</li>
    <li>빈칸은 노트 줄 위의 밑줄 — 꿀색 카드 배경·회색 상자를 뺐다. 다음에 채울 칸만 꿀색 밑줄, 채운 단어는 파란 잉크.</li>
    <li>단어 카드는 크림 한 색(색에 뜻이 없었다). 쓴 카드는 흐려진다.</li>
    <li><b>기록 완료</b>는 아래 큰 버튼 하나 — 빈칸을 다 채우면 초록으로 켜진다.</li></ul></section>
  <section class="opt"><h2>2. 빈칸을 눌러 직접 입력할 때</h2>${phone2()}
    <ul><li>노트가 키보드 위에 붙는다(키보드 높이만큼 올라감). 장면은 위로 밀려 인물 얼굴만.</li>
    <li>단어 카드는 숨긴다 — 키보드가 대신하고, 그 자리를 문장에.</li>
    <li>키보드 바로 위 얇은 도구 줄: ▶ 다시 듣기 · 1× · ‹ › 앞뒤 빈칸 · <b>완료</b>. 입력하면서 다시 듣기와 완료가 늘 손 닿는 곳에.</li>
    <li>키보드의 엔터 = <b>다음</b>(다음 빈칸으로), 마지막 칸에서는 <b>완료</b>. 자동 대문자·자동 고침·맞춤법 밑줄은 끈다(받아쓰기 철자를 바꾸지 않게).</li></ul></section>`;
}
render();
document.addEventListener('click', e => {
  const t = e.target.closest('[data-toggle]');
  if(t){ const k = t.dataset.toggle; toggled[k] = !toggled[k]; t.classList.toggle('on', toggled[k]); if(k === 'spd') document.querySelectorAll('.spd').forEach(c => { c.classList.toggle('on', toggled.spd); c.textContent = toggled.spd ? '0.7×' : '1×'; }); return; }
  const w = e.target.closest('.s1 .word'); if(!w) return;
  if(filled.includes(w.dataset.w)) filled = filled.filter(x => x !== w.dataset.w);
  else if(filled.length < 2) filled.push(w.dataset.w);
  render();
});
</script>
</body>
</html>
