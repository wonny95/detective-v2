<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>노트 탭 아이콘 시안</title>
<style>
@font-face{font-family:"Paperlogy";src:url("../assets/fonts/Paperlogy-4Regular.woff2") format("woff2");font-weight:400}
@font-face{font-family:"Paperlogy Display";src:url("../assets/fonts/Paperlogy-6SemiBold.woff2") format("woff2");font-weight:400}
:root{--ground:#B6BDA5;--ink:#4A3628;--ink-soft:#7D6A58;--honey:#F2CF73;--line:#E3D5B8;--berry:#C96F86;--sky:#A9C4E0;--sheet:#FDFAEE}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:"Paperlogy",system-ui,sans-serif}
.wrap{max-width:1240px;margin:0 auto;padding:28px 20px 56px}
h1{font-family:"Paperlogy Display","Paperlogy",sans-serif;font-weight:400;font-size:24px;margin:0 0 4px}
.lead{margin:0 0 22px;font-size:14px;opacity:.8;max-width:780px;line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:30px 24px}
.opt h2{margin:0 0 4px;font-family:"Paperlogy Display","Paperlogy",sans-serif;font-weight:400;font-size:17px}
.opt p{margin:10px 2px 0;font-size:13px;line-height:1.55;color:var(--ink-soft);max-width:360px}
.rec{display:inline-block;padding:1px 8px;border-radius:10px;background:var(--honey);font-size:11px;vertical-align:2px}

/* the top of the note at a phone's width (360px), tabs as in the game (divider sheets under the page's edge) */
.dock{position:relative;width:360px;max-width:100%;height:120px;margin-top:60px;padding:7.9% 9% 0 9.5%}
.dock::before{content:"";position:absolute;inset:0;background:url(../assets/ui/casefile-panel.webp) top center/100% auto no-repeat}
.head{position:relative;z-index:1;display:flex;align-items:center;gap:6px;aspect-ratio:81.5/13.6;padding:0 2px;font-family:"Paperlogy Display","Paperlogy",sans-serif;font-size:18px}
.note-cats{position:absolute;bottom:100%;margin-bottom:-9.5%;left:7%;display:flex;gap:5px;align-items:flex-end}
.ncat{--tab:url(../assets/ui/tab-1.png);position:relative;flex:none;display:block;width:58px;height:44px;padding:0;border:0;background:none;cursor:pointer;filter:drop-shadow(0 1px 1.2px rgba(30,24,20,.3))}
.ncat:nth-child(2){--tab:url(../assets/ui/tab-2.png)}
.ncat:nth-child(3){--tab:url(../assets/ui/tab-3.png)}
.face{position:absolute;inset:0;display:grid;place-items:center;padding-bottom:6px;background:#DCCCA8;-webkit-mask:var(--tab) center/100% 100% no-repeat;mask:var(--tab) center/100% 100% no-repeat}
.ncat:nth-child(2) .face{background:#D5C39C}
.ncat:nth-child(3) .face{background:#CFBD96}
.face::before{content:"";position:absolute;inset:0;background:var(--tab) center/100% 100% no-repeat;mix-blend-mode:multiply;pointer-events:none}
.face img{position:relative;width:30px;height:30px;display:block;opacity:.88;filter:drop-shadow(0 0 1.5px rgba(251,244,230,.9))}
.ncat[aria-pressed="true"]{z-index:1;height:52px;filter:none}
.ncat[aria-pressed="true"] .face{padding-bottom:7px;background:var(--sheet);
  -webkit-mask:var(--tab) top/100% 112% no-repeat,linear-gradient(#000 calc(100% - 5px),transparent);-webkit-mask-composite:source-in;
  mask:var(--tab) top/100% 112% no-repeat,linear-gradient(#000 calc(100% - 5px),transparent);mask-composite:intersect}
.ncat[aria-pressed="true"] .face::before{background-position:top;background-size:100% 112%}
.ncat[aria-pressed="true"] img{opacity:1}
.edge{position:absolute;left:0;right:0;top:0;margin-top:5.4945%;aspect-ratio:728/44;background:url(../assets/ui/casefile-paper-edge.png) 0 0/100% 100% no-repeat;filter:drop-shadow(0 -.5px .8px rgba(40,28,18,.22));pointer-events:none}

/* stamps: one solid silhouette pressed in ink on the kraft — a slightly rough edge (#inky), multiplied into the paper */
.st{position:relative;display:grid;place-items:center;color:var(--ink-c,#7A5C47);opacity:.62;filter:url(#inky);mix-blend-mode:multiply;transition:opacity .2s}
.st svg{display:block;width:24px;height:24px}
.ncat[aria-pressed="true"] .st{color:var(--on-c,var(--berry));opacity:.92}

/* 적용한 안: B5 남색 잉크 + B6 기울어짐 — brown when closed; the memo's blue ink, tilted a little, when open */
.pick .ncat{--on-c:#34506E}
.pick .ncat[aria-pressed="true"] .st{transform:rotate(-6deg)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="inky"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="1.3"/></filter></svg>
<div class="wrap">
  <h1>노트 탭 아이콘 시안</h1>
  <p class="lead">노트 위 탭 세 개(인물 · 증거 · 메모). 아래 메뉴의 손그림 아이콘과 겹쳐 복잡해 보인다(사용자 의견), 선 아이콘도 별로 → 게임에 적용한 안: 도장(사용자 선택), 남색 잉크(B5) + 연 탭 기울어짐(B6). 고르지 않은 안: 선 아이콘, 글자 인덱스, 작은 도장 + 글자, 도장 변형(기본 분홍·동그란 고무도장·네모 인장·탭마다 다른 잉크·닳은 자국). 탭 모양은 게임 그대로(칸막이 종이). 탭을 눌러 바꿔 볼 수 있어요. 크레딧 없음.</p>
  <div class="grid" id="grid"></div>
</div>
<script>
// solid silhouettes for the stamps: speech bubbles, a camera, a push pin (the memo collects what was pinned)
const STAMP = [
  '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M5 3.5h8.4a3 3 0 0 1 3 3v4.8a3 3 0 0 1-3 3H8.8l-3.6 3v-3H5a3 3 0 0 1-3-3V6.5a3 3 0 0 1 3-3z"/><path fill="currentColor" opacity=".6" d="M17.6 8.6h1.6a2.8 2.8 0 0 1 2.8 2.8v3.6a2.8 2.8 0 0 1-2.8 2.8v2.6l-3-2.6h-2.4a2.8 2.8 0 0 1-2.4-1.4h2.6a4.5 4.5 0 0 0 3.6-4.4z"/></svg>',
  '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M4.5 7h3l1.6-2.5h5.8L16.5 7h3a2.5 2.5 0 0 1 2.5 2.5v8.3a2.5 2.5 0 0 1-2.5 2.5h-15A2.5 2.5 0 0 1 2 17.8V9.5A2.5 2.5 0 0 1 4.5 7zM12 9.6a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm0 2a2 2 0 1 1 0 4 2 2 0 0 1 0-4z"/></svg>',
  '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2.5a4.6 4.6 0 0 1 2.9 8.2l.4 1.5h1.6a1.8 1.8 0 0 1 0 3.6h-3.6v4.6a1.3 1.3 0 0 1-2.6 0v-4.6H7.1a1.8 1.8 0 0 1 0-3.6h1.6l.4-1.5A4.6 4.6 0 0 1 12 2.5z"/></svg>',
];
const LABEL = ['인물', '증거', '메모'];
const PNG = ['../assets/ui/nav/talk.png', '../assets/ui/icons-v2/camera.png', '../assets/ui/icons/note.png'];
const OPTS = [
  ['now', '이전', '', '손그림 아이콘(말풍선·카메라·수첩). 아래 메뉴와 같은 그림체라 복잡해 보였다.'],
  ['pick', '도장 — 남색 잉크 + 기울어짐', 1, '닫힌 탭은 흐린 갈색 잉크, 연 탭은 노트에 쓰는 파란 잉크(메모 글씨와 같은 색)로 막 찍은 듯 살짝 기울어진다. 메모는 압정(📌로 붙인 것이 모이는 곳, 아래 Note 메뉴의 수첩과 겹치지 않게).'],
];
const TITLES = ['사건 브리핑', '증거 기록', '내 메모'];
const on = {};
const inner = (k, j) => k === 'now' ? `<img src="${PNG[j]}" alt="">` : `<span class="st">${STAMP[j]}</span>`;
function dock(k){
  const i = on[k] || 0;
  return `<div class="dock"><div class="note-cats">${LABEL.map((_, j) => `<button class="ncat" type="button" data-j="${j}" aria-pressed="${i === j}"><span class="face">${inner(k, j)}</span></button>`).join('')}</div><div class="edge"></div>
    <div class="head">${TITLES[i]}</div></div>`;
}
function render(){
  document.getElementById('grid').innerHTML = OPTS.map(([k, title, rec, text]) => `<section class="opt ${k}" data-k="${k}"><h2>${title}${rec ? ' <span class="rec">사용자 선택</span>' : ''}</h2>${dock(k)}<p>${text}</p></section>`).join('');
}
render();
document.addEventListener('click', e => {
  const b = e.target.closest('.ncat'); if(!b) return;
  on[b.closest('.opt').dataset.k] = +b.dataset.j; render();
});
</script>
</body>
</html>
