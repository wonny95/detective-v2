<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light"><title>사라진 크리스마스트리의 별 · 금으로 만든 별 절도안</title>
<!--
사건 상세 기획 공통 서식 v1 (사용자 결정)
1. 이 파일을 case-XX-사건이름.html로 복사한다. {{...}}와 샘플 항목을 사건 내용으로 교체한다.
2. case-plan-common 스타일 블록은 그대로 사용한다. 사건마다 색·글꼴·너비·카드·대본 서식을 다시 만들거나 뒤에서 덮어쓰지 않는다.
3. 문서 순서: 표지 → 장면별 스토리 → 현장 조사 → 배경·클릭 TTS → 한눈에 → 인물·장소 → 단서 비교 → 학습 → 제작 범위.
4. 대화는 turn / turn det, 질문·답·노트는 question-choice / note-task, 클릭 TTS도 turn det를 쓴다.
5. 인물·장소·질문 수에 맞춰 같은 카드를 반복한다. 그림과 사건에만 필요한 도해는 추가할 수 있으나 공통 서식을 바꾸지 않는다.
6. 사용자 요청으로 서식 자체를 바꿀 때만 이 템플릿과 미인계 사건의 동일 스타일 블록을 함께 갱신한다.
7. 인계된 사건은 직접 고치지 않고 STORY_LOG의 개발 요청에 대상 파일·동일 서식 적용 범위를 적는다.
-->
<style id="case-plan-common" data-version="1">
:root { --ink:#44362c; --muted:#786b5d; --paper:#fffaf0; --line:#dfd2bc; --honey:#f1ce75; --rose:#b65f79; --sage:#e5ede0; --green:#456f54; --shadow:0 12px 36px rgba(66,49,30,.09); }

    a { color:inherit; }
    .wrap { width:min(1120px,calc(100% - 36px)); margin:auto; }

    .back-mark { display:grid; place-items:center; width:32px; height:32px; border:2px solid var(--ink); border-radius:50%; background:var(--honey); line-height:1; }

    .nav::-webkit-scrollbar { display:none; }
    .nav a { padding:13px 0; text-decoration:none; }
    .nav a:hover,.back:hover,.text-link:hover { color:var(--rose); }
    main { padding:28px 0 80px; }
    section { scroll-margin-top:94px; margin-top:58px; }
    .hero { display:grid; grid-template-columns:minmax(0,1.6fr) minmax(240px,.7fr); gap:20px; margin-top:0; }
    .hero-copy,.hero-art,.panel,.story-card,.place-card,.person-card,.clue-card,.flow-card,.learning-card,.script-card,.end-card,.status-card { background:var(--paper); border:1.5px solid var(--line); border-radius:26px; box-shadow:var(--shadow); }
    .hero-copy { padding:40px 42px; background:radial-gradient(circle at 92% 10%,#faeab8 0 12%,transparent 12.5%),var(--paper); }

    .learning-card code { font-family:inherit; font-weight:800; color:#476b50; }

</div></main><template id="reader-source"><section class="hero"><div class="hero-copy"><span class="eyebrow">L1-05 · 10 B · 금으로 만든 별 절도안</span><h1>사라진 크리스마스트리의 별</h1><p class="lead">축제를 준비하는 여러 친구가 드나든 창고에서 금으로 만든 별이 사라졌다. 현재 작업에 관한 진술을 대조하고, 개봉 뒤 별 자체의 잎사귀 무늬와 보관함 출처를 확인한다.</p><div class="chips"><span class="chip">면담 18문항 · 43칸</span><span class="chip">필수 사진 8장 · 선택 2장 · 추리 10문항</span><span class="chip status">개발 점검·2차 수정 반영 · 그림·음성 계획 대기</span></div></div><figure class="hero-art"><div class="plan-art-pending">속까지 꽉 찬, 금으로 만든 별<br>전구·전선·배터리 없음 · 그림 미제작</div><figcaption>엘라·테스·경사 재사용 / 데이지·코코·니코 신규</figcaption></figure></section><section class="story-card" id="case-summary"><div class="section-head"><h2>사건 한눈에</h2></div><div class="grid-3"><div class="object-card"><h3>의뢰</h3><p>창고에 보관한 금으로 만든 별이 사라져 엘라가 탐정에게 도움을 청한다.</p></div><div class="object-card"><h3>조사</h3><p>창고의 흔적과 친구들의 말을 모으고, 니코의 운반 설명을 테스의 진술과 대조한다.</p></div><div class="object-card"><h3>해결</h3><p>탐정이 상자를 열어 별을 확인하고, 출처·허락·목적을 들은 뒤 엘라에게 돌려준다.</p></div></div><p style="margin-top:14px">아래는 제작자용 기획서야. 장면별 대본은 펼쳐 두고, 학습 설계와 제작 메모는 필요할 때 열어 볼 수 있어.</p></section><section class="story-card" id="flow-overview"><div class="section-head"><h2>사건 흐름도</h2></div>
<span class="plan-anchor" id="event-flow"></span>

<p>전반부 장면 1–5의 선택 소품 반응은 각 탐색 장면 안에서만 제공하며 흐름도의 다음 장면을 여는 조건이 아니다. 추리 이후에는 추가하지 않는다.</p>
<p>사건의 진실과 플레이 순서를 나눈 제작자용 흐름도다. 창고를 살피고 두 바닥 사진의 자국을 대조한다. 자국은 경로만 보여 주며 발생 시점이나 운전자를 입증하지 않는다. 상자 확인의 핵심 근거는 테스의 장난감 선물 전량이 아직 작업대에 있다는 점과, 코코가 건넨 상자 넷보다 썰매의 상자가 하나 많다는 점이다. 썰매 자리에서 현재 작업대를 살핀다. 니코는 테스가 별을 가져가는 걸 본 것 같다고 혐의를 돌리지만, 천막에 돌아가 보면 테스의 별은 가벼운 별 장난감이다. 심문에서 니코는 테스의 선물 → 모두 코코의 선물 → 테스의 별로 핑계를 바꾸고, 플레이어가 각각 테스·코코의 진술이나 사진으로 반박한다. 경사와 엘라가 함께 진행 상황을 들으러 온다. 니코가 개봉을 거부해도 엘라가 허락하고 경사가 지시하면, 플레이어가 썰매의 똑같은 상자 다섯을 창고 구석의 저울로 달아 보고 골라 탐정이 연다. 별 실물·잎사귀 무늬·출처 확인은 개봉 뒤다. 선물 상자 자체는 물증으로 쓰지 않는다. 별은 엘라에게 돌려주고 트리 광장의 점등식으로 끝난다.</p>
<h4>01 · 사건이 벌어진 과정</h4>
<p>제작자용 진실 · 탐정이 오기 전</p>
<figure style="margin:12px 0 28px"><div tabindex="0" aria-label="01 · 사건이 벌어진 과정" style="overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:#fffdf8"><svg xmlns="http://www.w3.org/2000/svg" viewbox="0 0 1340 280" role="img" aria-labelledby="truth-flow-title truth-flow-desc" style="display:block;width:100%;min-width:1060px;height:auto;font-family:Malgun Gothic,Apple SD Gothic Neo,sans-serif"><title id="truth-flow-title">01 · 사건이 벌어진 과정</title><desc id="truth-flow-desc">제작자용 진실 · 탐정이 오기 전. 창고 보관·축제 준비 → 니코가 별을 가져감 → 무거운 별을 썰매로 운반 → 엘라가 분실 신고</desc><defs><marker id="flow-arrow-truth" viewbox="0 0 10 10" refx="9" refy="5" markerwidth="7" markerheight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#978b7b"></path></marker></defs><path data-edge="t1:t2" d="M305 147 H350" fill="none" stroke="#978b7b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#flow-arrow-truth)"></path><path data-edge="t2:t3" d="M645 147 H690" fill="none" stroke="#978b7b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#flow-arrow-truth)"></path><path data-edge="t3:t4" d="M985 147 H1030" fill="none" stroke="#978b7b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#flow-arrow-truth)"></path><g data-flow-node="t1"><rect x="15" y="65" width="290" height="165" rx="12" fill="#f9e5df" stroke="#bd7d68" stroke-opacity=".65" stroke-width="1.5"></rect><text x="160.0" y="102" text-anchor="middle" fill="#44362c" font-size="21" font-weight="700">창고 보관·축제 준비</text><text x="160.0" y="137" text-anchor="middle" fill="#605347" font-size="16.5">별은 창고 선반 보관함에 둠</text><text x="160.0" y="164" text-anchor="middle" fill="#605347" font-size="16.5">데이지는 장식을 트리 광장에 옮김</text></g><g data-flow-node="t2"><rect x="355" y="65" width="290" height="165" rx="12" fill="#eee6f4" stroke="#9473ad" stroke-opacity=".65" stroke-width="1.5"></rect><text x="500.0" y="102" text-anchor="middle" fill="#44362c" font-size="21" font-weight="700">니코가 별을 가져감</text><text x="500.0" y="137" text-anchor="middle" fill="#605347" font-size="16.5">창고의 별을 빈 선물 상자에 숨김</text><text x="500.0" y="164" text-anchor="middle" fill="#605347" font-size="16.5">닫힌 상자 밖으로는 보이지 않음</text></g><g data-flow-node="t3"><rect x="695" y="65" width="290" height="165" rx="12" fill="#e3ede2" stroke="#658868" stroke-opacity=".65" stroke-width="1.5"></rect><text x="840.0" y="102" text-anchor="middle" fill="#44362c" font-size="21" font-weight="700">무거운 별을 썰매로 운반</text><text x="840.0" y="137" text-anchor="middle" fill="#605347" font-size="16.5">창고 뒷문 앞 썰매에 상자를 실음</text><text x="840.0" y="164" text-anchor="middle" fill="#605347" font-size="16.5">포장 천막 옆으로 끌고 감</text></g><g data-flow-node="t4"><rect x="1035" y="65" width="290" height="165" rx="12" fill="#e2edf4" stroke="#688da6" stroke-opacity=".65" stroke-width="1.5"></rect><text x="1180.0" y="102" text-anchor="middle" fill="#44362c" font-size="21" font-weight="700">엘라가 분실 신고</text><text x="1180.0" y="137" text-anchor="middle" fill="#605347" font-size="16.5">돌아와 빈 보관함을 발견</text><text x="1180.0" y="164" text-anchor="middle" fill="#605347" font-size="16.5">경사에게 신고·탐정에게 경위 설명</text></g></svg></div><figcaption style="color:var(--muted);font-size:14px;margin-top:9px">사건 전말을 보여 주는 제작자용 흐름입니다.</figcaption></figure>

r(--muted);font-size:14px;margin-top:9px">창고의 질문·촬영과 코코·테스 방문 순서는 자유입니다. 기록은 추리 직전에 합류합니다. 선물 상자 자체는 물증이 아닙니다. 카드를 누르면 같은 페이지의 대본으로 이동합니다.</figcaption></figure>

</section><section id="prep"><div class="object-grid"><article class="object-card"><h3>긍정 · be + -ing</h3><p>지금 하는 일을 말한다.</p><ul><li><strong>I&#x27;m reading a book.</strong><p>난 책을 읽고 있어.</p></li><li><strong>She&#x27;s washing a cup.</strong><p>그 애는 컵을 씻고 있어.</p></li><li><strong>They&#x27;re drawing maps.</strong><p>그 애들은 지도를 그리고 있어.</p></li></ul></article><article class="object-card"><h3>부정 · be not + -ing</h3><p>not을 놓치면 반대 행동으로 기록한다.</p><ul><li><strong>I&#x27;m not sleeping.</strong><p>난 자고 있지 않아.</p></li><li><strong>He isn&#x27;t cooking.</strong><p>그 애는 요리하고 있지 않아.</p></li><li><strong>We aren&#x27;t running.</strong><p>우리는 달리고 있지 않아.</p></li></ul></article><article class="object-card"><h3>확인 · be + 주어 + -ing?</h3><p>상대의 현재 행동을 확인한다. Are you로 물으면 자기 행동을 I am으로 답한다.</p><ul><li><strong>Are you reading?</strong><p>너 읽고 있어?</p></li><li><strong>Is she dancing?</strong><p>그 애는 춤추고 있어?</p></li><li><strong>Are they swimming?</strong><p>그 애들은 수영하고 있어?</p></li></ul></article><article class="object-card"><h3>행동·대상 질문 · What + be + 주어 + -ing?</h3><p>지금 하는 행동이나 포장하는 대상을 묻는다.</p><ul><li><strong>What are you reading?</strong><p>무엇을 읽고 있어?</p></li><li><strong>What is he drawing?</strong><p>그 애는 무엇을 그리고 있어?</p></li><li><strong>What are they carrying?</strong><p>그 애들은 무엇을 들고 있어?</p></li></ul></article></div></section><section class="storyboard-section" id="storyboard"><div class="section-head"><h2>장면별 대본</h2></div><nav class="scene-index" aria-label="장면 이동"><a href="#scene-0">준비</a><a href="#scene-1">엘라 의뢰</a><a href="#scene-2">창고·데이지</a><a href="#scene-3">코코</a><a href="#scene-4">테스</a><a href="#scene-5">니코</a><a href="#tess-table-observation">작업대 관찰</a><a href="#scene-6">추리</a><a href="#scene-7">심문</a><a href="#scene-8">자백</a><a href="#scene-9">반환</a></nav><span id="plan-a"></span>
<article class="scene" id="scene-1"><div class="scene-head"><span class="scene-kicker">트리 광장 · 엘라 · 경사</span><h3>장면 1 · 트리 광장 — 경사의 의뢰와 엘라 면담</h3><p>경사에게 안내소에서 신고가 들어왔다는 말을 듣고 직접 찾아가 엘라에게 말을 건다.</p></div><div class="scene-body"><aside class="object-card" data-character-poses="1"><h4>일러스트 연출</h4><p><strong>엘라 · </strong>광장 안내소에서 펼쳐진 축제 안내지를 접는 중이야. 안내지를 내려놓고 탐정을 바라봐.</p><p><strong>오소리 경사 · </strong>광장 입구에서 신고를 적던 수첩을 덮어. 탐정에게 조사 의뢰를 전하고 순찰하러 떠나.</p></aside>

<div class="turn" data-line="badger:hello"><span class="who">경사</span><p class="en">Detective, I&#x27;d like you to look into a missing item.</p><p class="ko">탐정, 이번 사건은 없어진 물건을 조사해 줬으면 좋겠어.</p></div>
<div class="turn det" data-line="det:what-missing"><span class="who">탐정 · 질문 badger:b0</span><p class="en">What&#x27;s missing?</p><p class="ko">뭐가 없어졌는데?</p></div>
<div class="turn" data-line="badger:desk-lead"><span class="who">경사 · 받아 적기(빈칸 Ella · information desk)</span><p class="en">The town&#x27;s Christmas star is missing. Ask Ella at the information desk for more details.</p><p class="ko">마을의 크리스마스 별이 사라졌대. 자세한 내용은 안내소의 엘라에게 들어 봐.</p></div>
<div class="turn det" data-line="det:ella-greeting"><span class="who">탐정 · 말 걸기 선택지</span><p class="en">Hi, Ella! I&#x27;m looking into the missing star.</p><p class="ko">안녕, 엘라! 사라진 별을 조사하고 있어.</p></div>
<div class="turn" data-line="ella:hello"><span class="who">엘라</span><p class="en">Detective! Nice to see you again. I reported it.</p><p class="ko">탐정! 다시 만나서 반가워. 내가 신고했어.</p></div>
<div class="question-choice" data-ref="ella:e0"><span class="choice-no">탐정의 질문 → 엘라</span><p class="ask">What happened?</p><p class="translation">무슨 일이 있었어?</p><p class="reply">I went to show the children around the festival. When I came back, the star was missing.<em>축제에 온 아이들을 안내하러 자리를 비웠어. 돌아와 보니 별이 사라졌더라.</em></p><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">학습 설계 보기 · 노트 빈칸과 보기</summary><div style="display:grid;gap:12px;padding-top:14px"><div class="note-task"><b>노트</b> · “I went to show the children around the festival. When I came back, the [star] was [missing].”<p>보기 · star · string · start · missing · shining · moving</p></div></div></details><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">제작 메모 · 질문 조건과 해금</summary><div style="display:grid;gap:12px;padding-top:14px"><p class="fine">ella:e0</p><p class="unlock">조건 · 경사가 떠난 뒤 안내소에 나타난 엘라에게 탐정이 인사하고 엘라가 답한 뒤 첫 질문으로 표시<br>채점 뒤 · 엘라가 축제에 온 아이들을 안내하고 돌아와 분실을 발견했다는 경위 기록. e1·e2 해금</p></div></details></div>

<div class="scene-next"><strong>얻은 정보</strong><p>진짜 금 · 뒷면 잎사귀 무늬 · 창고 선반 보관함</p><p style="margin-top:6px">다음 · 축제 창고로</p></div><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">제작 메모 · 장면 조건과 연출</summary><div style="display:grid;gap:12px;padding-top:14px"><p>경사는 트리 광장 입구에 있고 엘라는 같은 광장의 안내소에서 일한다. 광장 중앙의 크리스마스트리는 주변 건물 지붕보다 훨씬 높고, 아래에 선 엘라와 경사가 작아 보인다. 광장 안에서는 아래쪽 가지가 배경을 넓게 채우고 꼭대기는 화면 위로 넘어간다. 경사는 없어진 물건을 조사해 달라고 하고, 탐정이 무엇이 없어졌는지 물으면 마을의 크리스마스 별이 사라졌다며 안내소의 엘라에게 자세히 들어 보라고 말한다(사용자 결정). 경사와의 대화가 끝나면 경사는 순찰하러 떠나 광장 화면에서 사라지고, 같은 광장 그림의 안내소 자리에 사슴이 나타난다. 장소 안에서 자리를 옮기는 이동 버튼은 없다(개발 점검 사용자 결정). 사슴을 누르면 탐정이 엘라의 이름을 부르며 인사하고, 엘라가 다시 만나 반갑다며 신고한 사람이라고 밝히면 첫 질문 e0만 열린다. 엘라는 우산 사건에서 탐정을 만났다(사용자 결정: 다시 만난 인사). 이름은 이 인사 뒤부터 표시한다. 안내소는 같은 광장 안의 자리이며 별도 장소를 추가하지 않는다. 경사는 신고 장소만 알려 준다. 엘라를 직접 소개하거나 함께 데려가는 장면은 없다. 탐정이 엘라에게 무슨 일이 있었는지 묻고 답을 기록하면 e1·e2가 열린다. e2 기록 뒤 탐정은 창고로 갈 수 있다. 경사는 이미 주변을 순찰 중이다.</p><p>탐정의 짧은 영어 반응. 누른 소품만 말하며 진행 필수 조건은 아니다.</p><ul><li>badger:hello · 경사 · 자동</li><li>det:what-missing · 탐정 · 선택 질문</li><li>badger:desk-lead · 경사 · 자동</li><li>det:ella-greeting · 탐정 · 말 걸기 선택지</li><li>ella:hello · 엘라 · 자동</li><li>ella:check-supplies · 엘라 · 자동</li><li>det:storeroom-thought · 탐정 · 생각</li><li>move:storeroom · 이동 · 이동 버튼</li></ul></div></details></div></article>

        </svg><figcaption class="fine">촬영 구도 예시 · 창고 모퉁이 바닥</figcaption></figure><p class="en" style="margin-top:10px;font-weight:750">There are marks in the snow.</p><p class="ko">눈 위에 자국이 있어.</p><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">촬영·활용 메모</summary><div style="display:grid;gap:12px;padding-top:14px"><p>c-track-yard · e2 기록 뒤 창고 안의 뒷문으로 나가 모퉁이 바닥 조사</p><p>얇게 눈이 덮인 창고 모퉁이에서 앞문과 뒷문 쪽 바닥을 한 프레임에 넓게 찍는다. 두 자국 모두 새로 내린 눈에 덮여 흐릿하지만 끊기지 않는다. 앞문에서 나온 평행 자국 한 벌은 트리 광장 입구 쪽으로 굽고, 뒷문에서 나온 다른 한 벌은 나무 표지 기둥을 지나 프레임 밖으로 이어진다(개발 점검 사용자 결정). 광장 입구 뒤로 멀리서도 눈에 띄는 커다란 크리스마스트리의 전체 윤곽이 보인다. 트리는 두 자국과 나무 표지 기둥을 가리지 않는다. 자국에 도구명이나 정답 표시는 붙이지 않는다.</p><p>창고의 두 문에서 자국이 서로 다른 쪽으로 가는 모습을 기록한다. 데이지의 손수레 운반 진술과 후속 사진을 대조한다.</p></div></details></aside><div class="question-choice" data-ref="holly:h4"><span class="choice-no">탐정의 질문 → 데이지</span><p class="ask">Did you move any decorations today?</p><p class="translation">오늘 장식품을 옮겼어?</p><p class="reply">Yes. I took some decorations to the Tree Square in a handcart.<em>응. 손수레로 장식품을 트리 광장에 옮겼어.</em></p><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">학습 설계 보기 · 노트 빈칸과 보기</summary><div style="display:grid;gap:12px;padding-top:14px"><div class="note-task"><b>노트</b> · “Yes. I took some decorations to the [Tree Square] in a [handcart].”<p>보기 · Tree Square · gift tent · storeroom · handcart · sleigh · basket</p></div></div></details><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">제작 메모 · 질문 조건과 해금</summary><div style="display:grid;gap:12px;padding-top:14px"><p class="fine">holly:h4</p><p class="unlock">조건 · h1 기록·c-track-yard 촬영 뒤<br>채점 뒤 · 광장 쪽 자국은 데이지의 손수레라는 진술 기록. 자국 추리(tracks)의 근거</p></div></details></div>

<div class="scene-next"><strong>얻은 정보</strong><p>빈 보관함·바닥 사진 · 데이지의 손수레 진술 · 포장 천막 위치</p><p style="margin-top:6px">다음 · 포장 천막의 코코·테스에게</p></div><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">제작 메모 · 장면 조건과 연출</summary><div style="display:grid;gap:12px;padding-top:14px"><p>엘라 e2 기록으로 창고를 발견하고 직접 이동한다. 데이지는 앞문 옆 작업대에, 보관함은 뒷문 가까운 안쪽 선반에 있다. 양의 이름은 자기소개 전에는 표시하지 않는다. 창고는 포장재·장식품을 함께 보관하는 정상 작업 공간이고, 축제 물건이 여기저기 쌓여 있다. 앞문 반대편 구석에는 접시 둘 달린 중간 크기의 양팔 저울(탐정이 들고 다닐 수 있는 크기)이 다른 물건들 사이에 놓여 있다. 저울은 눈에 띄지 않게 평범한 창고 물건으로 그리고, 소품 반응도 다른 물건과 같은 무게로 둔다(사용자 결정: 창고 구석의 저울). 누구나 드나들었다는 사실은 범행을 뜻하지 않는다.</p><p>데이지는 엘라와 함께 축제를 준비하는 성인 양이다. 장식을 정리하고 리본을 달지만 선물을 포장하거나 배송하지 않는다. 본인도 창고에 들어갔다고 답한다. 목격의 범위는 사람들의 출입까지이며 별을 가져가는 손동작·반출품·범행은 보지 못했다.</p><p>e2 기록 뒤 창고 선반의 빈 보관함을 c-case로 촬영할 수 있다. 데이지에게 묻기 전후 어느 쪽이든 가능하다. 관찰: <strong>The case is empty. / 보관함이 비어 있어.</strong> 보관함 사진에 출입자·범인·사람의 목격담을 적지 않는다. 안쪽에서 공용 포장재 선반(c-supplies)과 문턱에서 본 선반의 시야(c-door-view)도 선택 촬영할 수 있다. 공용 포장재는 창고에 들어갈 일상적인 이유를, 문턱 사진은 데이지가 보지 못한 범위를 이해하는 데 쓴다. e2 기록 뒤 창고 안의 뒷문으로 나가 창고 모퉁이에서 앞문과 뒷문 쪽 바닥을 c-track-yard로 촬영한다. 탐정은 바닥에 자국이 보인다고만 말한다. 촬영 뒤 데이지에게 장식을 옮긴 적 있는지 묻는 h4가 열린다(개발 점검 사용자 결정: 받아쓰기로). h2의 출입 목격 뒤 h3에서 코코와 테스의 현재 위치를 묻고 포장 천막을 발견한다.</p><p>탐정의 짧은 영어 반응. 누른 소품만 말하며 진행 필수 조건은 아니다.</p><ul><li>holly:hello · 데이지 · 자동</li><li>det:holly-intro · 탐정 · 자동</li><li>holly:ready · 데이지 · 자동</li><li>holly:h4 · 데이지 · 질문·받아쓰기</li><li>det:gift-thought · 탐정 · 생각</li><li>move:gift · 이동 · 이동 버튼</li></ul></div></details></div></article>

<div class="question-choice" data-ref="mae:m1"><span class="choice-no">탐정의 질문 → 코코</span><p class="ask">What are you doing now?</p><p class="translation">지금 뭐 하고 있어?</p><p class="reply">I&#x27;m making snowflakes for the tree. I&#x27;m helping Daisy.<em>트리에 달 눈송이를 만들고 있어. 데이지를 돕고 있어.</em></p><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">학습 설계 보기 · 노트 빈칸과 보기</summary><div style="display:grid;gap:12px;padding-top:14px"><div class="note-task"><b>노트</b> · “I&#x27;m [making] [snowflakes] for the tree. I&#x27;m helping Daisy.”<p>보기 · making · wrapping · cutting · snowflakes · mittens · stars</p></div></div></details><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">제작 메모 · 질문 조건과 해금</summary><div style="display:grid;gap:12px;padding-top:14px"><p class="fine">mae:m1</p><p class="unlock">조건 · m0에서 선물에 쓸 포장지를 가지러 갔다고 답한 뒤<br>채점 뒤 · m3</p></div></details></div>

<div class="scene-next"><strong>얻은 정보</strong><p>창고에 간 이유 · 지금 하는 일 · 니코에게 건넨 털장갑 상자 넷</p><p style="margin-top:6px">다음 · 같은 천막의 테스에게 · 최초 방문 순서는 자유</p></div><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">제작 메모 · 장면 조건과 연출</summary><div style="display:grid;gap:12px;padding-top:14px"><p>코코는 털장갑 선물 상자 넷의 포장을 끝내 니코에게 건넸고, 지금은 데이지를 도와 트리에 달 종이 눈송이를 만든다(사용자 결정). 데이지는 코코가 창고에 들어간 것을 봤지만, 지금 하는 일만으로 과거 반출을 부정하지 않는다. 탐정은 출입 목격을 근거로 창고에 간 이유부터 묻는다. 선물에 쓸 포장지가 필요했다는 답을 듣고 지금 무엇을 하는지 묻는다. 아직 포장 중인지 물으면 코코는 다 끝내 털장갑 상자 넷을 니코에게 건넸다고 답한다. 상자 수를 썰매와 비교하는 것은 플레이어다. 지금 하는 일만으로 과거의 모든 행동을 무죄로 단정하지 않는다. 데이지 h3는 코코와 테스가 천막에서 일하고 있다고만 말한다(코코는 이미 포장을 끝냈으므로 wrapping이라고 하지 않는다).</p><p>코코 작업대에는 포장을 끝낸 상자가 없다. 트리에 달 종이 눈송이 더미와 가위, 포장하고 남은 리본이 있다. 코코의 털장갑 상자 넷은 이미 니코가 썰매에 실었다. 코코와 테스의 최초 방문 순서는 자유다.</p><p>탐정의 짧은 영어 반응. 누른 소품만 말하며 진행 필수 조건은 아니다.</p><ul><li>mae:hello · 코코 · 자동</li><li>det:mae-intro · 탐정 · 자동</li><li>mae:ready · 코코 · 자동</li></ul></div></details></div></article>

</g></svg><figcaption class="fine">촬영 구도 예시 · 작업하던 상자들과 오른쪽 클립보드</figcaption></figure><p class="en" style="margin-top:10px;font-weight:750">Some boxes are still open.</p><p class="ko">아직 열린 상자들이 있네.</p><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">촬영·활용 메모</summary><div style="display:grid;gap:12px;padding-top:14px"><p>c-toys · 테스 t1 기록 뒤 장난감을 보는 행동 선택지·테스 허락</p><p>작업대를 비스듬히 내려다보며 선물 상자 여섯 개와 배송 준비표를 한 프레임에 담는다. 포장을 마친 상자 두 개는 테스가 손을 뻗기 쉬운 옆쪽에 내려놓았고, 포장 중인 두 개는 작업대 가운데에 종이가 반쯤 접힌 채 놓여 있다. 포장 전 두 개는 가까운 빈 자리로 밀어 두어 안에 든 장난감이 보인다. 하나는 장난감 자동차, 하나는 토이 네스트의 금빛 플라스틱 별 장난감이다(사용자 결정: 테스의 별 장난감). 상자는 같은 줄에 맞추지 않고 간격과 각도를 달리한다. 서로 가려져 상자 수를 세기 어려워지지 않게 한다. 준비표는 작업대 오른쪽 클립보드에 살짝 비스듬히 놓고 짧은 연필을 곁에 둔다. 제목은 “Gifts for This Delivery”다. 전체 수량 “Toy gifts: 6” 아래에 Lumi, Tilly, Bo, Nori, Kit, Poppy를 한 명씩 적고, Lumi와 Tilly의 Packed 칸에만 체크한다. 한 명당 장난감 선물 한 상자다. 명단의 아이들은 이 장면에 등장하지 않는다. 장난감 자동차와 블록 등은 원화 제작 예시이며 종류·색으로 범인을 특정하지 않는다. 미리보기의 자동차 도형은 배치 설명용이며 실제 게임 원화가 아니다.</p><p>준비표에 있는 여섯 명과 첫 사진의 여섯 상자를 대조한다. 썰매 앞에서 현재 작업대의 여섯 상자와 테스의 포장 완료 후 수거 진술 t3를 함께 확인할 수 있다. 심문에서는 테스의 진술 대신 이 사진을 내밀어도 정답이다.</p></div></details></aside><div class="turn det" data-line="det:sleigh-thought"><span class="who">탐정 · 생각</span><p class="en">Tess said Nico is by the sleigh. I should talk to him.</p><p class="ko">테스가 니코는 썰매 옆에 있다고 했어. 니코한테 가 봐야겠어.</p></div>
<div class="turn" data-line="move:sleigh"><span class="who">이동 · 이동 버튼</span><p class="en">Go to the Delivery Sleigh.</p><p class="ko">썰매 앞으로 가기</p></div>
<div class="scene-next"><strong>얻은 정보</strong><p>장난감 선물 여섯 개와 배송 준비표 사진 · 밖에서 기다리는 니코</p><p style="margin-top:6px">다음 · 썰매 앞으로</p></div><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">제작 메모 · 장면 조건과 연출</summary><div style="display:grid;gap:12px;padding-top:14px"><p>테스는 우산 사건에 등장한 거북이며 장난감 가게 토이 네스트의 직원이다(우산 사건 데이터와 같게, 사용자 결정). 탐정과는 우산 사건에서 만났다. 이번 축제에서는 아이들을 위한 자원봉사자로 참여한다. 테스는 작업대에서 이번 배송분 장난감 선물의 포장을 하고 있다. 이미 포장을 끝낸 선물도 같은 작업대에 모아 둔다. 데이지 h2의 창고 출입 목격과 h3의 천막 위치를 모두 기록한 뒤 테스와 면담할 수 있다. 첫 인사 뒤 탐정은 큰 트리의 별이 창고에서 사라졌다고 설명한다. 테스가 별을 못 봤다고 답하면 탐정은 창고에 들어갔다는 말을 들었다며 그 이유를 묻는다. 빈 상자가 필요했다는 답을 듣고 무엇을 포장하는지 묻는다(t1). 앞선 두 문답도 노트에 받아 적고(사용자 결정: 예전에는 받아쓰기 없이 들음), t1을 기록하면 선물의 배송 준비가 끝났는지 묻는 t3와 장난감 조사 선택지가 열린다. 테스의 작업대는 포장 천막 안에 있으며 썰매 쪽 열린 옆면 너머로 작업대가 보인다. 포장 전 선물 둘 가운데 하나는 금빛 별 장난감이며, 처음 방문 때는 아무도 이 별을 말하지 않는다(사용자 결정: 가짜 용의자는 테스의 별 장난감).</p><p>장난감을 보는 선택지는 받거나 건네는 행동 없이 촬영 허락만 구하는, 받아쓰기 없는 행동 선택지다. 허락 뒤 포장 완료 두 개, 포장 중 두 개, 포장 전 두 개(장난감 자동차·금빛 별 장난감)와 이번 배송 수량이 적힌 준비표를 한 화면에 담아 c-toys로 촬영한다. 촬영 시점에는 예정된 장난감 선물 여섯 개가 전부 작업대에 있다. 포장 상태는 진행돼도 썰매 자리에서 보이는 작업대의 전체 수량은 여섯 개다. 테스 t3에서 포장이 끝나면 니코가 선물을 가져갈 예정이며 지금은 썰매 옆에 있다는 말을 듣는다. (사용자 결정: 니코는 데이지의 목격에 나오지 않음) 니코와 썰매는 코코 m4를 기록해야만 나타난다(사용자 결정 2026-11-12).</p><p>탐정의 짧은 영어 반응. 누른 소품만 말하며 진행 필수 조건은 아니다.</p><ul><li>tess:hello · 테스 · 자동</li><li>det:tess-intro · 탐정 · 자동</li><li>tess:ready · 테스 · 자동</li><li>det:tess-star · 탐정 · 선택 질문</li><li>tess:star · 테스 · 자동</li><li>det:tess-storeroom · 탐정 · 선택 질문</li><li>tess:storeroom · 테스 · 자동</li><li>det:toys-q · 탐정 · 행동 선택지</li><li>tess:toys-a · 테스 · 자동</li><li>det:sleigh-thought · 탐정 · 생각</li><li>move:sleigh · 이동 · 이동 버튼</li></ul></div></details></div></article>
<article class="scene" id="scene-5"><div class="scene-head"><span class="scene-kicker">썰매 앞 · 니코</span><h3>장면 5 · 썰매 앞 — 니코의 운반 주장과 별 장난감</h3><p>운반 중인 물건에 관한 설명을 기록하고, 니코가 가리킨 테스의 금빛 별을 확인한다.</p></div><div class="scene-body"><aside class="object-card" data-character-poses="5"><h4>일러스트 연출</h4><p><strong>니코 · </strong>썰매 짐칸에 몸을 숙이고 똑같은 상자 다섯 가운데 하나를 두 손으로 힘겹게 밀어 자리를 잡고 있어. 상자는 짐칸에 두고 고개를 들어. 포장하거나 뚜껑을 여는 손동작은 없어.</p></aside>

<div class="turn" data-line="nico:hello"><span class="who">니코</span><p class="en">Hi there. I&#x27;m Nico. What brings you here?</p><p class="ko">안녕. 난 니코야. 무슨 일이야?</p></div>
<div class="turn det" data-line="det:nico-intro"><span class="who">탐정</span><p class="en">I&#x27;m helping Ella find a missing star.</p><p class="ko">엘라가 없어진 별을 찾는 걸 돕고 있어.</p></div>
<div class="turn" data-line="nico:ready"><span class="who">니코</span><p class="en">The star for the tree? I&#x27;ll help if I can.</p><p class="ko">트리에 달 별 말이야? 도울 일이 있으면 말해 줘.</p></div>

<div class="question-choice" data-ref="nico:n1"><span class="choice-no">탐정의 질문 → 니코</span><p class="ask">What are you doing?</p><p class="translation">뭐 하고 있어?</p><p class="reply">I&#x27;m loading the gifts. I&#x27;m not delivering yet.<em>선물을 싣고 있어. 아직 배달하러 출발하지는 않았어.</em></p><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">학습 설계 보기 · 노트 빈칸과 보기</summary><div style="display:grid;gap:12px;padding-top:14px"><div class="note-task"><b>노트</b> · “I&#x27;m [loading] the gifts. I&#x27;m not [delivering] yet.”<p>보기 · loading · opening · reading · delivering · decorating · wrapping</p></div></div></details><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">제작 메모 · 질문 조건과 해금</summary><div style="display:grid;gap:12px;padding-top:14px"><p class="fine">nico:n1</p><p class="unlock">조건 · 썰매 앞 발견·니코 인사 뒤 첫 질문<br>채점 뒤 · n2. 지금 싣는 물건부터 확인한다.</p></div></details></div>
<div class="question-choice" data-ref="nico:n2"><span class="choice-no">탐정의 질문 → 니코</span><p class="ask">What are you loading?</p><p class="translation">무엇을 싣고 있어?</p><p class="reply">I&#x27;m loading some gifts. Other volunteers wrapped them.<em>선물 몇 개를 싣고 있어. 다른 봉사자들이 포장한 거야.</em></p><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">학습 설계 보기 · 노트 빈칸과 보기</summary><div style="display:grid;gap:12px;padding-top:14px"><div class="note-task"><b>노트</b> · “I&#x27;m loading some [gifts]. Other [volunteers] [wrapped] them.”<p>보기 · gifts · mittens · volunteers · children · wrapped · opened</p></div></div></details><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">제작 메모 · 질문 조건과 해금</summary><div style="display:grid;gap:12px;padding-top:14px"><p class="fine">nico:n2</p><p class="unlock">조건 · n1 기록 뒤<br>채점 뒤 · 다른 봉사자들이 포장한 선물이라는 흐린 주장 기록. 누가 포장했는지는 n3에서 듣는다. 창고 방문 이유를 묻는 선택 질문이 열린다.</p></div></details></div>
<div class="turn det" data-line="det:nico-storeroom"><span class="who">탐정 · 질문 (노트: No. I was [waiting] for all the gifts to be [wrapped].)</span><p class="en">Did you go into the storeroom today?</p><p class="ko">오늘 창고에 들어갔어?</p></div>
<div class="turn" data-line="nico:storeroom-reason"><span class="who">니코</span><p class="en">No. I was waiting for all the gifts to be wrapped.</p><p class="ko">아니. 선물이 다 포장되길 기다리고 있었어.</p></div>
<div class="question-choice" data-ref="nico:n3"><span class="choice-no">탐정의 질문 → 니코</span><p class="ask">Are you wrapping gifts too?</p><p class="translation">선물 포장도 하고 있어?</p><p class="reply">No, I&#x27;m not wrapping gifts. Coco and Tess wrap them.<em>아니, 나는 선물을 포장하지 않아. 포장은 코코와 테스가 해.</em></p><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">학습 설계 보기 · 노트 빈칸과 보기</summary><div style="display:grid;gap:12px;padding-top:14px"><div class="note-task"><b>노트</b> · “No, I&#x27;m [not] [wrapping] [gifts]. Coco and Tess wrap them.”<p>보기 · not · now · wrapping · loading · gifts · decorations · mittens</p></div></div></details><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">제작 메모 · 질문 조건과 해금</summary><div style="display:grid;gap:12px;padding-top:14px"><p class="fine">nico:n3</p><p class="unlock">조건 · n2 기록·창고 방문 이유에 대한 현장 답변 뒤<br>채점 뒤 · 포장은 코코·테스가 맡는다는 니코의 역할 설명 기록·n4 해금</p></div></details></div>
<div class="question-choice" data-ref="nico:n4"><span class="choice-no">탐정의 질문 → 니코</span><p class="ask">Did you see anything strange today?</p><p class="translation">오늘 이상한 거 본 적 있어?</p><p class="reply">No, not really. But I think I saw Tess taking the star.<em>아니, 별로. 그런데 테스가 별을 가져가는 걸 본 것 같아.</em></p><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">학습 설계 보기 · 노트 빈칸과 보기</summary><div style="display:grid;gap:12px;padding-top:14px"><div class="note-task"><b>노트</b> · “No, [not] really. But I think I saw [Tess] taking the [star].”<p>보기 · not · now · Tess · Coco · Daisy · star · box</p></div></div></details><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">제작 메모 · 질문 조건과 해금</summary><div style="display:grid;gap:12px;padding-top:14px"><p class="fine">nico:n4</p><p class="unlock">조건 · n3 기록 뒤<br>채점 뒤 · 테스가 별을 가져가는 걸 본 것 같다며 혐의를 돌리는 니코의 말 기록. 반쯤 사실(테스는 아침에 금빛 별 장난감을 들고 작업대로 왔음)이며 천막으로 돌아가 테스 t4·c-toy-star로 확인한다. 심문에서 니코가 다시 꺼낸다</p></div></details></div>


<div class="question-choice" data-ref="nico:n5"><span class="choice-no">탐정의 질문 → 니코</span><p class="ask">Did you move the sleigh this morning?</p><p class="translation">오늘 아침에 썰매를 옮겼어?</p><p class="reply">No. It stayed right here all morning.<em>아니. 아침 내내 바로 여기 있었어.</em></p><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">학습 설계 보기 · 노트 빈칸과 보기</summary><div style="display:grid;gap:12px;padding-top:14px"><div class="note-task"><b>노트</b> · “No. It [stayed] right here all [morning].”<p>보기 · stayed · moved · started · morning · evening · night</p></div></div></details><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">제작 메모 · 질문 조건과 해금</summary><div style="display:grid;gap:12px;padding-top:14px"><p class="fine">nico:n5</p><p class="unlock">조건 · n1 기록·c-track-sleigh 촬영 뒤<br>채점 뒤 · 썰매를 옮기지 않았다는 니코의 주장 기록. 자국 추리의 근거이며 이동 시점은 증명하지 않음</p></div></details></div>
<h4>천막으로 돌아가 — 테스의 별 장난감</h4>
<div class="turn det" data-line="det:toy-star-thought"><span class="who">탐정 · 생각</span><p class="en">Tess took the star? I should go back and check.</p><p class="ko">테스가 별을 가져갔다고? 돌아가서 확인해 봐야겠어.</p></div>
<div class="turn" data-line="move:tent-back"><span class="who">이동 · 이동 버튼</span><p class="en">Go to the Gift Tent.</p><p class="ko">선물 포장 천막으로 가기</p></div>
<div class="question-choice" data-ref="tess:t4"><span class="choice-no">탐정의 질문 → 테스</span><p class="ask">Is that the star from the storeroom?</p><p class="translation">저게 창고에 있던 별이야?</p><p class="reply">No, it&#x27;s a toy star from Toy Nest. It&#x27;s very light.<em>아니, 토이 네스트의 별 장난감이야. 아주 가벼워.</em></p><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">학습 설계 보기 · 노트 빈칸과 보기</summary><div style="display:grid;gap:12px;padding-top:14px"><div class="note-task"><b>노트</b> · “No, it&#x27;s a [toy] star from Toy Nest. It&#x27;s very [light].”<p>보기 · toy · real · gold · light · heavy · long</p></div></div></details><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">제작 메모 · 질문 조건과 해금</summary><div style="display:grid;gap:12px;padding-top:14px"><p class="fine">tess:t4</p><p class="unlock">조건 · 니코 n4 기록 뒤 천막으로 돌아와 테스에게<br>채점 뒤 · 금빛 별은 가벼운 별 장난감이라는 테스의 진술 기록. 뒷면을 봐도 되는지 묻는 행동 선택지가 열린다</p></div></details></div>

<aside class="object-card" data-evidence="c-boxes"><span class="result-tag">필수 사진 · 썰매 위 상자</span><p class="en" style="margin-top:10px;font-weight:750">The boxes look the same.</p><p class="ko">상자들이 똑같아 보여.</p><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">촬영·활용 메모</summary><div style="display:grid;gap:12px;padding-top:14px"><p>c-boxes · 썰매 앞 도착·니코 인사 뒤 썰매 짐칸 조사</p><p>썰매 짐칸에 같은 축제 공용 포장지와 리본을 두른 닫힌 상자 다섯이 한 프레임에 모두 보인다. 상자끼리 겹치지 않아 하나씩 셀 수 있다. 이름표·배송 라벨·내용물 표시는 없다. 별·금빛은 보이지 않는다.</p><p>코코 m3(상자 넷을 니코에게 건넴)와 대조해 플레이어가 추리 7번에서 상자가 하나 더 있다는 결론을 낸다. 개수는 탐정이 말하지 않는다. 어느 상자가 더 들어간 것인지는 알려 주지 않으며, 개봉 지시 뒤 창고 구석의 저울로 플레이어가 찾을 수 있다.</p></div></details></aside><aside class="object-card" data-evidence="c-track-sleigh"><span class="result-tag">필수 사진 · 나무 기둥 너머 바닥</span><figure style="margin:12px 0 4px" data-track-frame="c-track-sleigh"><svg viewbox="0 0 480 215" style="width:100%;height:auto;display:block;border-radius:8px" role="img" aria-label="같은 나무 표지 기둥 너머로 바닥의 자국과 정차한 썰매가 보인다.">

        </svg><figcaption class="fine">촬영 구도 예시 · 나무 기둥 너머 바닥</figcaption></figure><p class="en" style="margin-top:10px;font-weight:750">More marks over here.</p><p class="ko">이쪽에도 자국이 있네.</p><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">촬영·활용 메모</summary><div style="display:grid;gap:12px;padding-top:14px"><p>c-track-sleigh · 테스 t3를 기록하고 썰매 앞에 도착한 뒤 바닥 조사. 찍은 뒤 니코 n5가 열린다</p><p>첫 사진과 같은 나무 표지 기둥, 기둥 옆 바닥, 정차한 썰매 밑부분을 한 프레임에 담는다. 기둥 옆의 흐릿한 평행 자국 한 벌이 눈에 반쯤 덮였지만 프레임 안에서 끊기지 않고 썰매 아래로 들어가는 모습이 보인다.</p><p>같은 기둥으로 첫 사진과 연결해 창고 뒷문에서 썰매 아래까지 이어진 경로를 확인한다. 이동 시점이나 운전자는 입증하지 않는다. 상자 확인의 핵심 근거는 니코의 선물 주장과 테스의 진술·전량이 남은 작업대, 코코가 건넨 상자 수의 불일치다.</p></div></details></aside><div class="scene-next"><strong>얻은 정보</strong><p>다른 봉사자들이 포장한 선물이라는 주장 · 창고 방문 이유 · 테스 탓 · 썰매 이동 부인 · 나무 기둥 너머 바닥 사진</p><p style="margin-top:6px">다음 · 천막 쪽 작업대 관찰</p></div><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">제작 메모 · 장면 조건과 연출</summary><div style="display:grid;gap:12px;padding-top:14px"><p>썰매 짐칸에는 같은 축제 공용 포장지와 리본을 두른 닫힌 상자 다섯이 실려 있다. 넷은 코코가 포장을 끝내 건넨 털장갑 선물이고 하나에 별이 들어 있지만 겉으로는 똑같다(사용자 결정: 똑같은 선물 상자 맞히기, 코코가 건넨 상자 4개·썰매 5개). 니코는 짐칸 앞에서 몸을 숙여 그중 한 상자를 두 손으로 힘겹게 밀어 자리를 잡는다. 그 상자 자리만 짐칸 바닥판이 살짝 눌려 보인다(대사로 말하지 않음). 움직임은 정지 일러스트의 자세로 보여 준다. 대화할 때 상자는 짐칸에 그대로 둔다. 상자의 외형·손잡이·출처·포장지는 물증이 아니다. 썰매 앞에 오면 짐칸의 상자 다섯을 c-boxes로 한 장에 찍는다. 관찰: <strong>The boxes look the same. / 상자들이 똑같아 보여.</strong> 개수는 탐정이 말하지 않고 플레이어가 센다(사용자 결정: 풀이는 모두 플레이어가). 별·금빛·별 끝은 개봉 전에 전혀 보이지 않는다. n2의 loading은 이미 짐칸에 올린 상자의 자리를 잡는 작업까지 포함한다. 상자를 들고 썰매까지 걷는 장면이나 taking ... to the sleigh 대사는 쓰지 않는다. 니코의 대답은 문법적으로 맞아도 내용은 거짓일 수 있다.</p><p>니코는 처음 만났을 때 다른 봉사자처럼 평소 말투로 답한다. 탐정은 썰매 짐칸에서 일하던 모습을 보고 무엇을 하고 있는지 묻는다.</p><p>니코는 n2에서 다른 봉사자들이 포장한 선물을 싣고 있다고 흐리게 말한다. 누가 포장했는지는 n3에서 코코와 테스라고 듣는다. 탐정은 오늘 창고에 들어갔는지 별도 선택 질문으로 묻는다. 데이지는 코코와 테스만 봤으므로, 니코가 들어갔다고 답하면 앞문의 데이지에게 보이지 않는 뒷문을 썼다는 뜻이 된다. 이 점은 추리 문항으로 만들지 않고 자국 문항을 뒷받침하는 정도로 둔다(사용자 결정). 니코가 포장 천막에서 쓸 빈 상자를 가져왔다고 답하면n3에서 포장도 맡는지 확인한다. 니코는 포장은 코코와 테스가 한다며 부정하고 n4에서 오늘 이상한 것을 봤는지 묻자 별로 없다고 하면서, 테스가 별을 가져가는 걸 본 것 같다고 혐의를 돌린다(사용자 결정: 남 탓하는 거짓 목격, 가짜 용의자는 테스의 별 장난감). 테스가 실제로 금빛 별 장난감을 들고 작업대로 왔으므로 반쯤 사실인 말이다. 탐정은 특정 상자를 가리키지 않는다. 아직 별이 든 사실은 알 수 없다. 열린 질문을 마치면 천막 쪽 작업대를 볼 수 있다. 탐정은 선물 포장이나 배송을 돕지 않는다.</p><p>썰매 앞에 오면 바닥을 c-track-sleigh로 찍을 수 있다. 같은 나무 기둥이 보이도록 구도를 잡는다. 찍은 뒤 니코에게 썰매를 옮겼는지 묻는 n5가 열린다(개발 점검 사용자 결정: 먼저 찍고 묻기, 받아쓰기로). 창고 자국을 찍은 뒤 데이지 h4를 묻는 것과 같은 순서다.</p><p>탐정의 짧은 영어 반응. 누른 소품만 말하며 진행 필수 조건은 아니다.</p><p>니코 n4를 기록하면 탐정은 테스를 확인하러 천막으로 돌아갈 생각을 한다. 테스의 작업대에는 처음부터 금빛 별 장난감이 놓여 있었다(사용자 결정: 가짜 용의자는 테스의 별 장난감). 천막에서 테스에게 t4를 물을 수 있다. 테스는 토이 네스트의 별 장난감이고 아주 가볍다고 답하고, 뒷면을 봐도 되는지 묻자 허락한다. 탐정은 별을 확대 조사해 뒷면에 무늬가 없는 것을 c-toy-star로 찍는다. 별 장난감은 테스의 작업대에 그대로 둔다. 엘라 e1의 진짜 금별(아주 무거움·뒷면 잎사귀 무늬)과 대조해 니코의 말이 반쯤만 사실임을 알고, 개봉 때 무거운 상자를 고르는 단서도 얻는다. 테스는 계속 포장하며 앞의 질문을 다시 하지 않는다.</p><ul><li>nico:hello · 니코 · 자동</li><li>det:nico-intro · 탐정 · 자동</li><li>nico:ready · 니코 · 자동</li><li>det:nico-storeroom · 탐정 · 선택 질문</li><li>nico:storeroom-reason · 니코 · 자동</li><li>nico:n5 · 니코 · 질문·받아쓰기</li><li>det:toy-star-thought · 탐정 · 생각</li><li>move:tent-back · 이동 · 이동 버튼</li><li>tess:t4 · 테스 · 질문·받아쓰기</li><li>det:toy-star-back-q · 탐정 · 행동 선택지</li><li>tess:toy-star-a · 테스 · 자동</li><li>det:back-to-sleigh-thought · 탐정 · 생각</li></ul></div></details></div></article><article class="scene" id="tess-table-observation"><div class="scene-head"><span class="scene-kicker">썰매 앞에서 보이는 천막 · 현장 관찰</span><h3>천막 쪽 작업대 관찰</h3><p>작업대 살펴보기를 선택해 현재 구도를 확인해야 추리가 열린다.</p></div><div class="scene-body"><figure style="margin:12px 0 4px" data-table-view="current"><svg viewbox="0 0 585 205" width="100%" role="img" aria-label="썰매 앞에서 천막 쪽을 바라본 작업대. 포장을 마친 상자 4개, 포장 중 1개, 포장 전 1개가 보인다." style="display:block;height:auto;border-radius:12px">

<div class="turn" data-line="look:current-table"><span class="who">행동 · 필수 관찰 선택지</span><p class="en">Look at Tess&#x27;s table.</p><p class="ko">테스의 작업대 살펴보기</p></div>
<div class="turn det" data-line="det:current-table-observation"><span class="who">탐정 · 관찰 음성</span><p class="en">I can see Tess&#x27;s table.</p><p class="ko">테스의 탁자가 보여.</p></div>

<div class="scene-next"><strong>얻은 정보</strong><p>처음 찍은 사진과 지금 보이는 작업대</p><p style="margin-top:6px">다음 · 단서 비교하기</p></div><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">제작 메모 · 장면 조건과 연출</summary><div style="display:grid;gap:12px;padding-top:14px"><p>관찰 시작 음성: <strong>I can see Tess&#x27;s table. / 테스의 탁자가 보여.</strong> 테스 자기소개와 t3 기록, 니코 면담 뒤 작업대 살펴보기를 선택했을 때만 들린다. 수량·포장 상태의 비교 결과는 말하지 않는다.</p><p>이 관찰은 추리 전에 반드시 완료한다. 테스 t3·c-toys와 니코 면담이 끝나면 작업대를 살펴보는 선택지가 열린다. 선택하면 아래의 현재 작업대 구도를 보여 주고 관찰 완료를 기록한다. 완료 전에는 단서 비교하기가 열리지 않는다. 테스에게 다시 질문하거나 새 사진을 찍을 필요는 없다.</p><p>썰매 자리에서 천막의 열린 옆면 너머 테스의 작업대를 볼 수 있다. 카메라 구도 예시에서는 포장 완료 4개, 포장 중 1개, 포장 전 1개(금빛 별 장난감)가 보이며 클립보드에도 네 개가 체크되어 있다. 증거 노트의 c-toys는 첫 방문 때 찍은 사진이다. 관찰 장면에서는 상자 수를 대사나 정답 문구로 알려 주지 않는다. 플레이어가 현재 보이는 상자와 처음 기록한 배송 준비표, 테스의 포장 완료 후 수거 설명을 대조한다.</p><ul><li>look:current-table · 행동 · 필수 관찰 선택지</li><li>det:current-table-observation · 탐정 · 관찰 음성</li></ul></div></details></div></article>
<article class="scene" id="scene-6"><div class="scene-head"><span class="scene-kicker">썰매 앞 · 탐정</span><h3>장면 6 · 추리 — 누구에게 재확인할까</h3><p>사진과 진술을 비교해 다시 물어볼 사람을 고른다.</p></div><div class="scene-body"><div class="turn det" data-line="det:compare-thought"><span class="who">탐정 · 생각</span><p class="en">I should compare the notes and the photos.</p><p class="ko">기록과 사진을 비교해 봐야겠어.</p></div><div class="scene-next"><strong>행동 선택지</strong><p>Compare the clues. / 단서 비교하기</p></div>



<div class="question-choice" id="deduction-1" data-deduction="deduction:q1"><span class="choice-no">추리 1</span><p class="ask">What did Ella say about the star?</p><p class="translation">엘라가 별에 대해 뭐라고 했어?</p><p class="reply">The star is made of [real gold], so it&#x27;s very [heavy].<em>별은 진짜 금으로 만들어서 아주 무거워.</em></p><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">학습 설계 보기 · 보기·맞장구·힌트·근거</summary><div style="display:grid;gap:12px;padding-top:14px"><p>보기 · 앞 칸 glass · wood · real gold · paper · plastic · silver / 뒤 칸 light · soft · small · heavy · big · thin</p><p>맞장구 · That&#x27;s what Ella told us.</p><p>엘라가 그렇게 말했어.</p><p>힌트 · Listen to Ella&#x27;s answer about the star again.</p><p>엘라의 별 설명을 다시 들어 봐.</p><p>근거 · ella:e1.</p></div></details></div><div class="question-choice" id="deduction-2" data-deduction="deduction:q2"><span class="choice-no">추리 2</span><p class="ask">What star did we find at the festival?</p><p class="translation">축제장에서 어떤 별을 찾았어?</p><p class="reply">We only found [a toy star] at the festival.<em>축제장에서는 장난감 별만 찾았어.</em></p><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">학습 설계 보기 · 보기·맞장구·힌트·근거</summary><div style="display:grid;gap:12px;padding-top:14px"><p>보기 · the gold star · no star · a paper star · a toy star</p><p>맞장구 · Tess&#x27;s star is a light toy from Toy Nest.</p><p>테스의 별은 토이 네스트의 가벼운 장난감이야.</p><p>힌트 · Look at the photo of the back of Tess&#x27;s star.</p><p>테스의 별 뒷면 사진을 봐.</p><p>근거 · tess:t4·c-toy-star.</p></div></details></div><div class="question-choice" id="deduction-3" data-deduction="deduction:q3"><span class="choice-no">추리 3</span><p class="ask">It is real gold. What could have happened to it?</p><p class="translation">진짜 금이야. 별에 무슨 일이 있었을까?</p><p class="reply">The star may have been [stolen].<em>누가 별을 훔쳐 갔을 수도 있어.</em></p><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">학습 설계 보기 · 보기·맞장구·힌트·근거</summary><div style="display:grid;gap:12px;padding-top:14px"><p>보기 · melted · stolen · blown away · broken</p><p>맞장구 · Let&#x27;s check everyone&#x27;s stories.</p><p>모두의 말을 하나씩 확인해 보자.</p><p>힌트 · Real gold is heavy, and it costs a lot.</p><p>진짜 금은 무겁고 아주 비싸.</p><p>근거 · ella:e1(진짜 금·무거움). 저절로 사라질 수 없는 물건이라는 가능성을 플레이어가 연다.</p></div></details></div><div class="question-choice" id="deduction-4" data-deduction="deduction:ox-daisy"><span class="choice-no">추리 4</span><p class="ask">Does Daisy&#x27;s story match the clues? O or X?</p><p class="translation">데이지의 말이 단서와 맞아? O일까 X일까?</p><p class="reply">Daisy: &quot;Coco and Tess went into the storeroom.&quot; [O]<em>데이지: &quot;코코와 테스가 창고에 들어갔어.&quot; O</em></p><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">학습 설계 보기 · 보기·맞장구·힌트·근거</summary><div style="display:grid;gap:12px;padding-top:14px"><p>보기 · O · X</p><p>맞장구 · Coco and Tess both said they went in.</p><p>코코와 테스 둘 다 창고에 들어갔다고 했어.</p><p>힌트 · Listen to Coco&#x27;s and Tess&#x27;s answers about the storeroom.</p><p>코코와 테스의 창고 대답을 들어 봐.</p><p>근거 · holly:h2, mae:m0, tess:storeroom.</p></div></details></div><div class="question-choice" id="deduction-5" data-deduction="deduction:ox-coco"><span class="choice-no">추리 5</span><p class="ask">Does Coco&#x27;s story match the clues? O or X?</p><p class="translation">코코의 말이 단서와 맞아? O일까 X일까?</p><p class="reply">Coco: &quot;I gave Nico four boxes.&quot; [O]<em>코코: &quot;니코에게 상자 넷을 줬어.&quot; O</em></p><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">학습 설계 보기 · 보기·맞장구·힌트·근거</summary><div style="display:grid;gap:12px;padding-top:14px"><p>보기 · O · X</p><p>맞장구 · No clue says something different.</p><p>다르게 말하는 단서는 없어.</p><p>힌트 · Listen to Coco&#x27;s answer about the boxes. Does any clue say something different?</p><p>코코의 상자 대답을 듣고, 다르게 말하는 단서가 있는지 봐.</p><p>근거 · mae:m3.</p></div></details></div><div class="question-choice" id="deduction-6" data-deduction="deduction:ox-tess"><span class="choice-no">추리 6</span><p class="ask">Does Tess&#x27;s story match the clues? O or X?</p><p class="translation">테스의 말이 단서와 맞아? O일까 X일까?</p><p class="reply">Tess: &quot;My gifts aren&#x27;t ready yet.&quot; [O]<em>테스: &quot;내 선물은 아직 준비가 안 됐어.&quot; O</em></p><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">학습 설계 보기 · 보기·맞장구·힌트·근거</summary><div style="display:grid;gap:12px;padding-top:14px"><p>보기 · O · X</p><p>맞장구 · All six toy gifts are still on her table.</p><p>장난감 선물 여섯 개가 다 작업대에 있어.</p><p>힌트 · Look at the photo of Tess&#x27;s table and the list.</p><p>테스의 작업대 사진과 배송 준비표를 봐.</p><p>근거 · tess:t3, c-toys·현재 작업대.</p></div></details></div><div class="question-choice" id="deduction-7" data-deduction="deduction:ox-nico-gifts"><span class="choice-no">추리 7</span><p class="ask">Does Nico&#x27;s story match the clues? O or X?</p><p class="translation">니코의 말이 단서와 맞아? O일까 X일까?</p><p class="reply">Nico: &quot;Other volunteers wrapped these gifts.&quot; [X]<em>니코: &quot;다른 봉사자들이 이 선물들을 포장했어.&quot; X</em></p><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">학습 설계 보기 · 보기·맞장구·힌트·근거</summary><div style="display:grid;gap:12px;padding-top:14px"><p>보기 · O · X</p><p>맞장구 · Coco gave him four boxes, and Tess gave him none. But there are five boxes on the sleigh.</p><p>코코는 상자 넷을 줬고, 테스는 하나도 안 줬어. 그런데 썰매에는 상자가 다섯 개야.</p><p>힌트 · Count the boxes on the sleigh. Then listen to Coco&#x27;s and Tess&#x27;s answers again.</p><p>썰매 위 상자를 세어 보고, 코코와 테스의 대답을 다시 들어 봐.</p><p>근거 · nico:n2·n3, mae:m3, tess:t3·c-toys, c-boxes. 가장 중요한 사실(넷 + 0 ≠ 다섯).</p></div></details></div><div class="question-choice" id="deduction-8" data-deduction="deduction:ox-nico-storeroom"><span class="choice-no">추리 8</span><p class="ask">What about Nico&#x27;s storeroom story? O or X?</p><p class="translation">니코의 창고 이야기는? O일까 X일까?</p><p class="reply">Nico: &quot;I didn&#x27;t go into the storeroom.&quot; [X]<em>니코: &quot;나는 창고에 안 들어갔어.&quot; X</em></p><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">학습 설계 보기 · 보기·맞장구·힌트·근거</summary><div style="display:grid;gap:12px;padding-top:14px"><p>보기 · O · X</p><p>맞장구 · The marks from the storeroom go past the post to his sleigh.</p><p>창고에서 나온 자국이 기둥 옆을 지나 니코의 썰매까지 이어져.</p><p>힌트 · Look at the two photos of the marks. Find the same wooden post.</p><p>자국 사진 두 장을 보고 같은 나무 기둥을 찾아 봐.</p><p>근거 · nico:storeroom, c-track-yard·c-track-sleigh(같은 나무 기둥).</p></div></details></div><div class="question-choice" id="deduction-9" data-deduction="deduction:suspicious"><span class="choice-no">추리 9</span><p class="ask">Who looks suspicious?</p><p class="translation">누가 수상해 보여?</p><p class="reply">[Nico] looks suspicious.<em>니코가 수상해 보여.</em></p><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">학습 설계 보기 · 보기·맞장구·힌트·근거</summary><div style="display:grid;gap:12px;padding-top:14px"><p>보기 · Coco · Tess · Daisy · Nico</p><p>맞장구 · Two of his stories don&#x27;t match the clues.</p><p>니코의 말 두 가지가 단서와 맞지 않아.</p><p>힌트 · Which stories got an X?</p><p>어느 말에 X를 골랐지?</p><p>근거 · 앞의 O·X(플레이어가 고른 X 둘). 범인 확정이 아니라 수상한 사람.</p></div></details></div><div class="question-choice" id="deduction-10" data-deduction="deduction:check-next"><span class="choice-no">추리 10</span><p class="ask">What should we check next?</p><p class="translation">다음에 무엇을 확인해야 할까?</p><p class="reply">We should check [the boxes on the sleigh] <div class="scene-next"><strong>얻은 정보</strong><p>상자 안 별 사진 · 뒷면 무늬 사진 · 엘라가 직접 확인</p><p style="margin-top:6px">다음 · 니코의 자백</p></div><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">제작 메모 · 장면 조건과 연출</summary><div style="display:grid;gap:12px;padding-top:14px"><p>대질은 도서관·바이올린 사건처럼 니코가 먼저 주장하고 플레이어가 증거를 고르는 방식이다. 니코는 핑계를 세 번 바꾼다: 테스의 선물 → 모두 코코의 선물 → 테스의 별(사용자 결정: 두 단계 말 바꾸기와 남 탓하는 거짓 목격, 남 탓은 테스의 별 장난감). 각 주장에는 내밀면 정답인 증거가 있다(테스의 선물과 테스의 별은 진술·사진 둘 중 하나, 코코의 선물은 코코 m3). 주장 넷(테스의 선물·코코·테스의 별·별)이 게이지를 채운다. 니코의 주장 아래에는 증거 내밀기만 열리며 질문 선택지나 받아쓰기는 없다. 탐정의 짧은 선택 대사로 설명의 불일치를 짚으면 니코가 첫 주장을 한다.</p><p>첫 주장은 테스에게 그 선물을 받았다는 차분한 설명이다. n2에서 흐리게 말했던 니코가 여기서 처음 테스의 이름을 댄다. 정답은 진술 탭의 테스 t3 또는 사진 탭의 c-toys이며 둘 중 하나를 내밀면 된다. 탐정은 테스가 아직 포장 중이고 여섯 개가 작업대에 있다는 증거의 사실만 다시 말한다. 오답 반응: <strong>That doesn&#x27;t show Tess&#x27;s toy gifts. / 그건 테스의 장난감 선물을 보여 주지 않잖아.</strong> 반박당한 니코는 말을 바꿔 썰매의 상자가 모두 코코의 선물이라고 한다. 코코가 실제로 상자 넷을 건넸으므로 반쯤 사실인 핑계다. 정답은 코코 m3다. 탐정은 코코가 상자 넷을 줬다고 했다는 사실만 다시 말하고, 썰매의 상자가 다섯이라는 비교는 플레이어가 추리 7번에서 이미 했다(사용자 결정: 풀이는 모두 플레이어가). 오답 반응: <strong>That doesn&#x27;t show Coco&#x27;s gifts. / 그건 코코의 선물을 보여 주지 않잖아.</strong> 같은 주장에 머물며 다시 고른다.</p><p>세 번째 핑계로 니코는 n4에서 했던 말을 다시 꺼내 테스에게 혐의를 돌린다. 테스가 실제로 금빛 별 장난감을 들고 작업대로 왔으므로 반쯤 사실인 말이다. 정답은 진술 탭의 테스 t4 또는 사진 탭의 c-toy-star다. 탐정은 그 별이 토이 네스트의 장난감이라고만 짚는다. 가볍고 무늬가 없다는 판단은 플레이어가 추리 2번에서 이미 했다. 바닥 자국 사진(c-track-yard·c-track-sleigh)과 데이지 h4·니코 n5는 추리의 자국 문항에서 쓰고 심문에서는 내밀지 않는다. 오답 반응: <strong>That doesn&#x27;t show Tess&#x27;s star. / 그건 테스의 별을 보여 주지 않잖아.</strong> 같은 주장에 머물며 다시 고른다.</p><p>니코가 버티는 사이, 경사가 엘라와 함께 진행 상황을 들으러 온다(사용자 결정: 확인하러 온 것이 아니라 조사가 어디까지 왔는지 의논하러 옴). 탐정은 테스·코코의 선물이 모두 그대로이고 니코가 테스 탓까지 했다고 설명한다. 경사는 상자 안을 확인해야 한다고 한다. 니코는 축제 선물이라며 거부하고, 엘라가 축제 물품이니 확인해도 된다고 허락하자 경사가 탐정에게 열라고 한다. 둘은 심문 화면에서 얼굴·이름이 있는 말풍선으로 말하고, 썰매 현장에는 서 있는 그림(기존 그림)으로 나타난다.</p><p>경사의 지시 뒤 심문 화면이 잠시 닫히고 썰매 현장으로 돌아간다(개발 점검 사용자 결정: 심문 멈춤·재개). 상자 열기·c-open·뒷면 확대·c-mark는 현장 조사·확대 조사 화면 그대로 한다. 다 찍으면 심문이 멈춘 곳(nico:claim-star)부터 다시 열린다. 썰매 위에는 똑같아 보이는 닫힌 상자 다섯이 있다(사용자 결정: 똑같은 선물 상자 맞히기, 코코가 건넨 넷과 별 상자 하나). 니코는 다 장갑이라며 아무거나 열어 보라고 하고, 플레이어가 다섯 가운데 하나를 직접 고른다(사용자 결정: 결론은 플레이어가). 탐정은 상자의 무게나 정답을 말하지 않는다. 단서는 코코 m3의 털장갑(가벼운 선물), 엘라 e1의 very heavy(진짜 금별), 테스 t4의 very light(별 장난감), 처음 썰매에 왔을 때 니코가 두 손으로 힘겹게 밀던 상자, 썰매 그림에서 그 상자 자리만 짐칸 바닥판이 살짝 눌린 모습이다. 탐정은 다 똑같아 보이니 확인할 방법이 필요하다는 생각만 하고, 저울·무게·창고를 먼저 말하지 않는다. 플레이어는 바로 고르거나, 장면 2에서 본 창고 구석의 양팔 저울을 떠올려 가져올 수 있다(사용자 결정: 창고 구석의 저울). 심문이 멈춘 동안 썰매를 떠나 창고에 다녀올 수 있고, 니코·경사·엘라는 썰매 앞에 그대로 있다. 개봉 지시 뒤에만 창고 구석의 저울 자리에 "Take the scale." 행동이 열린다(그 전에는 소품 반응만). 엘라가 축제 물건을 확인해도 된다고 허락했으므로 가져가는 데 따로 대사는 없다. 저울이 소지품으로 들어오고, 썰매로 돌아오면 상자 둘 달아 보기가 열린다. 사건 뒤 저울을 돌려놓는 장면은 없다. 상자 둘을 골라 양쪽 접시에 하나씩 올리면 무거운 쪽으로 기울고 무게가 같으면 수평이다. 횟수 제한·벌점은 없고, 탐정은 결과를 말하지 않으며 저울 그림으로만 보인다. 저울은 선택이며 쓰지 않고 바로 열어도 된다. 장갑 상자를 고르면 탐정이 Just mittens in this one.이라고 말하고 다시 닫는다(벌점 없음). 플레이어는 다시 고른다. 플레이어가 상자 열기를 선택하면 탐정이 직접 열고 별이 처음 보인다. 이후 c-open을 촬영한다. 관찰: <strong>A star inside the box. / 상자 안에 별이 있어.</strong> 선물이라는 니코의 주장(n2·심문)과 실제 별의 불일치를 짚는다. 금빛만으로 재질·마을 소유·범행을 확정하지 않는다.</p><p>별 전체를 촬영한 뒤 뒷면을 가까이 조사한다. 별은 조사하는 동안 상자에 둔다. 뒷면은 기존 확대 조사(우산 사건의 우산처럼 지도에 없는 장소)로 본다.</p><p>뒷면의 작은 잎사귀 무늬를 c-mark로 직접 촬영한다. 관찰: <strong>A small leaf pattern on the back of the star. / 별 뒷면에 작은 잎사귀 모양이 있어.</strong> 엘라 e1의 설명과 대조하는 실물 특징이다. 문자로 주인을 써 주거나 범인 이름을 알려 주지 않는다. 한 장의 사진만으로 범행을 확정하지 않고 출처·허락·목적을 더 확인한다.</p><p>c-open·c-mark 조사 뒤 심문이 다시 열리고 니코가 상자 속 장식은 사라진 별이 아니라고 주장한다. 사진 탭에서 별 뒷면 사진(c-mark)을 내밀면 탐정이 무늬를 짚고, 그 자리에 있는 엘라가 e1에서 말한 자기 별의 무늬라고 직접 확인한다. 오답 반응: <strong>That doesn&#x27;t show the back of the star. / 그건 별 뒷면이 안 보이잖아.</strong> 같은 주장에 머물며 다시 고른다. 반박이 끝나면 자백으로 이어진다.</p><ul><li>det:challenge · 탐정 · 선택 대사</li><li>nico:claim-gift · 니코 · 심문 주장</li><li>present:tess-statement · 행동 · 증거 제시 선택지 · 정답</li><li>present:c-toys · 행동 · 증거 제시 선택지 · t3 대신 내밀어도 정답</li><li>det:open-q1 · 탐정 · 정답을 내민 뒤 대사</li><li>nico:claim-may · 니코 · 심문 주장</li><li>present:may-statement · 행동 · 증거 제시 선택지 · 정답</li><li>det:may-boxes · 탐정 · 정답을 내민 뒤 대사</li><li>nico:claim-tess-star · 니코 · 심문 주장</li><li>present:tess-t4 · 행동 · 증거 제시 선택지 · 정답</li><li>present:c-toy-star · 행동 · 증거 제시 선택지 · t4 대신 내밀어도 정답</li><li>det:toy-star · 탐정 · 정답을 내민 뒤 대사</li><li>nico:toy-reply · 니코 · 자동</li><li>det:story-changing · 탐정 · 자동</li><li>badger:check-in · 경사 · 자동</li><li>ella:check-in · 엘라 · 자동</li><li>det:brief-badger · 탐정 · 자동</li><li>badger:reason-to-check · 경사 · 자동</li><li>nico:refuse-open · 니코 · 자동</li><li>ella:allow-open · 엘라 · 자동</li><li>badger:open-order · 경사 · 자동</li><li>nico:any-box · 니코 · 자동</li><li>det:which-box · 탐정 · 생각</li><li>take:scale · 행동 · 창고 구석 · 개봉 지시 뒤</li><li>item:scale · 탐정 · 소지품 설명</li><li>weigh:boxes · 행동 · 저울 비교(소지품에 저울이 있을 때)</li><li>open:box · 행동 · 탐정 조사 행동</li><li>det:mitten-box · 탐정 · 장갑 상자를 골랐을 때</li><li>det:box-contents · 탐정 · 실물 확인 뒤 선택 대사</li><li>look:star-back · 행동 · 조사 행동</li><li>nico:claim-star · 니코 · 심문 주장</li><li>present:c-mark · 행동 · 증거 제시 선택지</li><li>det:found-star · 탐정 · 정답을 내민 뒤 대사</li><li>ella:confirm-owner · 엘라 · 자동</li></ul></div></details></div></article>
<article class="scene" id="scene-8"><div class="scene-head"><span class="scene-kicker">썰매 앞 · 니코 · 경사</span><h3>장면 8 · 니코의 자백 — 별의 출처와 목적</h3><p>니코가 열린 보관함에서 금별을 보고 욕심이 났다고 털어놓는다. 별을 썰매에 실은 이유도 밝힌다.</p></div><div class="scene-body"><aside class="object-card" data-character-poses="8"><h4>일러스트 연출</h4><p><strong>오소리 경사 · </strong>썰매 곁에서 열린 상자와 별의 뒷면을 확인해. 니코의 자백을 듣고 니코를 데리고 떠나.</p></aside>

<div class="turn" data-line="nico:admit"><span class="who">니코</span><p class="en">I took it from the case on the storeroom shelf. I didn&#x27;t ask.</p><p class="ko">창고 선반에 있는 보관함에서 가져왔어. 허락은 안 받았어.</p></div>
<div class="turn" data-line="nico:motive"><span class="who">니코</span><p class="en">I saw the open case and got greedy. I thought the gold would sell for a lot.</p><p class="ko">보관함이 열려 있는 걸 보고 욕심이 났어. 금별을 팔면 큰돈을 받을 수 있을 줄 알았어.</p></div>
<div class="turn" data-line="nico:blame"><span class="who">니코</span><p class="en">I said Tess had the star. That wasn&#x27;t true.</p><p class="ko">테스한테 별이 있다고 했지만 사실이 아니었어.</p></div>
<div class="turn" data-line="nico:weight"><span class="who">니코</span><p class="en">It was too heavy to carry far. I put it on the sleigh.</p><p class="ko">들고 멀리 가기엔 너무 무거웠어. 그래서 썰매에 실었어.</p></div>
<div class="turn" data-line="badger:take"><span class="who">경사</span><p class="en">Nico, come with me.</p><p class="ko">니코, 나와 같이 가자.</p></div>

<div class="scene-next"><strong>얻은 정보</strong><p>창고 보관함 출처 · 금별을 팔려던 동기 · 썰매 운반</p><p style="margin-top:6px">다음 · 별 반환과 점등식</p></div><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">제작 메모 · 장면 조건과 연출</summary><div style="display:grid;gap:12px;padding-top:14px"><p>심문이 끝난 뒤 니코는 별을 가져온 곳과 허락 여부를 스스로 말한다. 열린 보관함의 금별을 보고 욕심이 났고, 별을 팔아 큰돈을 벌 생각이었다고 털어놓는다. 테스 탓이 거짓이었다는 것도 인정하고, 무거운 별을 썰매에 실은 이유도 이어서 밝힌다.</p><p>탐정은 니코의 보관함 진술을 엘라 e2와 빈 보관함 사진 c-case에 대조한다. 경사는 니코를 데리고 떠난다(사용자 결정: 니코는 점등식에 나오지 않음). 엘라는 이미 썰매 앞에 있으므로 소식을 전하는 단계(봉사자·알리기)는 없다(사용자 결정: 경사와 엘라가 함께 옴). 별은 발견한 상자 안에 그대로 둔다.</p><ul><li>nico:admit · 니코 · 자동</li><li>nico:motive · 니코 · 자동</li><li>nico:blame · 니코 · 자동</li><li>nico:weight · 니코 · 자동</li><li>badger:take · 경사 · 자동</li></ul></div></details></div></article>
<article class="scene" id="scene-9"><div class="scene-head"><span class="scene-kicker">썰매 앞 · 트리 광장 · 엘라</span><h3>장면 9 · 썰매 앞과 트리 광장 — 별 반환과 점등식</h3><p>썰매 앞에서 엘라에게 별을 건네고, 트리 광장의 점등식으로 사건을 마무리한다.</p></div><div class="scene-body"><aside class="object-card" data-character-poses="9"><h4>일러스트 연출</h4><p><strong>엘라 · </strong>경사와 함께 썰매 앞에 와서 진행 상황을 물어. 상자를 열면 짐칸의 열린 상자로 몸을 기울여. 별을 들어 올리지 않고 상자 안에서 살짝 기울여 뒷면 무늬를 확인해. 그림은 우산 사건의 서 있는 엘라를 다시 쓴다(사용자 결정).</p></aside>

<div class="turn det" data-line="det:give-star"><span class="who">탐정</span><p class="en">Ella, here&#x27;s your star.</p><p class="ko">엘라, 여기 별이야.</p></div>
<div class="turn" data-line="ella:thanks"><span class="who">엘라</span><p class="en">Thank you for finding it!</p><p class="ko">찾아줘서 고마워!</p></div>
<div class="turn" data-line="ella:lighting-invite"><span class="who">엘라</span><p class="en">The lighting starts soon. Come to the Tree Square!</p><p class="ko">곧 점등식이 시작돼. 트리 광장으로 와!</p></div>
<div class="turn det" data-line="det:tree-thought"><span class="who">탐정 · 생각</span><p class="en">Let&#x27;s go to the Tree Square.</p><p class="ko">트리 광장으로 가 보자.</p></div>

<div class="scene-next"><strong>해결</strong><p>엘라가 직접 확인한 별 · 엘라의 인수 · 점등식</p><p style="margin-top:6px">다음 · 사건 해결 · 복습</p></div><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">제작 메모 · 장면 조건과 연출</summary><div style="display:grid;gap:12px;padding-top:14px"><p>엘라는 심문 중 경사와 함께 와서 개봉과 뒷면 무늬를 직접 봤다. 탐정은 썰매 옆에서 엘라에게 별을 건넨다(엔진: 이동 없는 반환). 엘라는 곧 점등식이 시작된다며 트리 광장으로 오라고 한다. 탐정이 트리 광장으로 가면 해가 진 광장의 트리 꼭대기에 별이 달려 있고, 엘라·데이지·코코·테스가 트리 앞에 모여 있다. 엘라가 셋을 세면 트리에 불이 켜지고(같은 장소의 배경 전환) 모두 Merry Christmas!라고 말한다. 탐정의 마지막 생각 뒤 사건이 해결된다(사용자 결정: 점등식으로 마무리). 엘라는 우산 사건의 서 있는 그림을 쓴다.</p><p>별은 데이지가 손수레로 트리 광장에 옮겨 꼭대기에 단다(장면 밖, 화면에는 결과만). 니코와 경사는 점등식에 나오지 않는다(사용자 결정). 배송받을 아이는 준비표에서 확인하며 배송 경로와 각 집의 위치는 미정이다.</p><ul><li>det:give-star · 탐정 · 자동</li><li>ella:thanks · 엘라 · 자동</li><li>ella:lighting-invite · 엘라 · 자동</li><li>det:tree-thought · 탐정 · 생각</li><li>move:tree-lighting · 이동 · 이동 버튼</li><li>ella:countdown · 엘라 · 자동</li><li>all:merry · 모두 · 자동</li><li>det:star-shining · 탐정 · 생각</li></ul></div></details></div></article>

<h3>c-track-yard · 창고 모퉁이 바닥</h3>
<p class="fine">개발·사용자 결정(2026-11-12): 창고 안 뒷문 위에 통통 튀는 둥근 화살표가 떠서, 누르면 창고 뒤 눈밭 확대 화면이 열리고 그 화면에서 자국을 눌러 찍는다(창고 안에서 바깥 사진이 찍히던 어색함을 고침, 사용자가 시안 C 고름). 그림에는 문 옆에 트리 장식(공 장식·갈랜드·화환·전구 줄·종)을 가득 실은 데이지의 손수레가 서 있고, 손수레 바퀴 자국은 창고에서 시작해 트리까지 굽어 이어진다(사용자 요청).</p>
<div class="matrix"><table><thead><tr><th>항목</th><th>내용</th></tr></thead><tbody>
<tr><td>필수/선택</td><td>필수</td></tr>
<tr><td>열리는 때</td><td>e2 기록 뒤 창고 안의 뒷문으로 나가 모퉁이 바닥 조사</td></tr>
<tr><td>촬영 그림</td><td>얇게 눈이 덮인 창고 모퉁이에서 앞문과 뒷문 쪽 바닥을 한 프레임에 넓게 찍는다. 두 자국 모두 새로 내린 눈에 덮여 흐릿하지만 끊기지 않는다. 앞문에서 나온 평행 자국 한 벌은 트리 광장 입구 쪽으로 굽고, 뒷문에서 나온 다른 한 벌은 나무 표지 기둥을 지나 프레임 밖으로 이어진다(개발 점검 사용자 결정). 광장 입구 뒤로 멀리서도 눈에 띄는 커다란 크리스마스트리의 전체 윤곽이 보인다. 트리는 두 자국과 나무 표지 기둥을 가리지 않는다. 자국에 도구명이나 정답 표시는 붙이지 않는다.</td></tr>
<tr><td>관찰 음성</td><td>There are marks in the snow.</td></tr>
<tr><td>해석</td><td>눈 위에 자국이 있어.</td></tr>
<tr><td>쓰임</td><td>창고의 두 문에서 자국이 서로 다른 쪽으로 가는 모습을 기록한다. 데이지의 손수레 운반 진술과 후속 사진을 대조한다.</td></tr>
</tbody></table></div>

<h3>c-toys · 장난감 선물 여섯 개와 배송 준비표</h3>
<div class="matrix"><table><thead><tr><th>항목</th><th>내용</th></tr></thead><tbody>
<tr><td>필수/선택</td><td>필수</td></tr>
<tr><td>열리는 때</td><td>테스 t1 기록 뒤 장난감을 보는 행동 선택지·테스 허락</td></tr>
<tr><td>촬영 그림</td><td>작업대를 비스듬히 내려다보며 선물 상자 여섯 개와 배송 준비표를 한 프레임에 담는다. 포장을 마친 상자 두 개는 테스가 손을 뻗기 쉬운 옆쪽에 내려놓았고, 포장 중인 두 개는 작업대 가운데에 종이가 반쯤 접힌 채 놓여 있다. 포장 전 두 개는 가까운 빈 자리로 밀어 두어 안에 든 장난감이 보인다. 하나는 장난감 자동차, 하나는 토이 네스트의 금빛 플라스틱 별 장난감이다(사용자 결정: 테스의 별 장난감). 상자는 같은 줄에 맞추지 않고 간격과 각도를 달리한다. 서로 가려져 상자 수를 세기 어려워지지 않게 한다. 준비표는 작업대 오른쪽 클립보드에 살짝 비스듬히 놓고 짧은 연필을 곁에 둔다. 제목은 “Gifts for This Delivery”다. 전체 수량 “Toy gifts: 6” 아래에 Lumi, Tilly, Bo, Nori, Kit, Poppy를 한 명씩 적고, Lumi와 Tilly의 Packed 칸에만 체크한다. 한 명당 장난감 선물 한 상자다. 명단의 아이들은 이 장면에 등장하지 않는다. 장난감 자동차와 블록 등은 원화 제작 예시이며 종류·색으로 범인을 특정하지 않는다. 미리보기의 자동차 도형은 배치 설명용이며 실제 게임 원화가 아니다.</td></tr>
<tr><td>관찰 음성</td><td>Some boxes are still open.</td></tr>
<tr><td>해석</td><td>아직 열린 상자들이 있네.</td></tr>
<tr><td>쓰임</td><td>준비표에 있는 여섯 명과 첫 사진의 여섯 상자를 대조한다. 썰매 앞에서 현재 작업대의 여섯 상자와 테스의 포장 완료 후 수거 진술 t3를 함께 확인할 수 있다. 심문에서는 테스의 진술 대신 이 사진을 내밀어도 정답이다.</td></tr>
</tbody></table></div>
<h3>c-toy-star · 테스의 별 장난감 뒷면</h3>

<h3>c-open · 상자 안</h3>
<div class="matrix"><table><thead><tr><th>항목</th><th>내용</th></tr></thead><tbody>

<p>경사의 조사 의뢰·안내소의 엘라 안내 → 경사가 떠난 뒤 안내소의 엘라에게 말 걸기·엘라의 경위 설명 → 창고의 빈 보관함·데이지의 출입 목격(코코·테스) → 천막의 코코(포장을 끝내 상자 넷을 니코에게 건넴)·테스 → 테스의 말로 썰매의 니코(테스 탓) → 천막으로 돌아가 테스의 별 장난감 확인 → 천막 쪽 작업대 관찰·추리 → 니코의 핑계 셋(테스의 선물·코코·테스의 별)에 진술·사진 제시 → 경사와 엘라 도착·상황 설명·엘라의 허락과 경사의 개봉 지시 → 똑같은 상자 다섯을 (선택) 창고 구석의 저울로 달아 보고 플레이어가 별이 든 상자를 골라 탐정이 엶 → 별 전체·잎사귀 무늬 확인 → 별이 아니라는 주장에 뒷면 사진·엘라가 직접 확인 → 니코의 인정·경사가 니코를 데려감 → 썰매 앞에서 엘라에게 별을 건넴 → 트리 광장의 점등식.</p>
<div class="matrix"><table><thead><tr><th>인물</th><th>신규/재사용</th><th>현재 위치</th><th>제작자용 역할·아는 범위</th></tr></thead><tbody>
<tr><td>엘라 · 사슴 · 성인</td><td>우산 인물 재사용</td><td>트리 광장</td><td>의뢰인. 별의 보관 위치·재질·소유·뒷면 무늬를 앎</td></tr>
<tr><td>데이지 · 양 · 성인</td><td>신규 제안</td><td>축제 창고 앞문 옆 작업대</td><td>엘라와 함께 축제 준비. 장식 정리·리본 달기. 본인과 코코·테스의 창고 출입까지만 앎(뒷문을 쓴 니코는 못 봄)</td></tr>
<tr><td>코코 · 코알라 · 성인</td><td>신규</td><td>포장 천막</td><td>털장갑 포장을 끝내 상자 넷을 니코에게 건넸고 지금은 데이지를 도와 종이 눈송이를 만든다. 창고에 포장지를 가지러 간 정상 배경. 과거 알리바이로 자동 제외하지 않음</td></tr>
<tr><td>테스 · 거북 · 성인</td><td>우산 인물 재사용</td><td>같은 천막의 작업대</td><td>토이 네스트 직원. 빈 상자를 가지러 창고 사용. 축제 봉사자로 장난감 선물을 포장하고 완료한 선물도 그 자리에 둠. 포장 전 선물 가운데 금빛 플라스틱 별 장난감이 있음</td></tr>
<tr><td>니코 · 펭귄 · 성인</td><td>신규</td><td>썰매 앞</td><td>선물 운반·배송만 담당(천막에 빈 상자도 날라 줌). 빈 상자를 가지러 창고 뒷문으로 드나들다 별을 숨김</td></tr>
<tr><td>오소리 경사</td><td>재사용</td><td>초반 트리 광장·후반 썰매 앞</td><td>엘라 신고 확인·주변 순찰·별 발견 확인·니코를 데려감</td></tr>
</tbody></table></div>
<p>인물6명·장소4곳이다. 면담은5명이며 초반과 후반에 등장하는 경사1명을 포함해 L1 인물 기본4–5명을1명 초과한다. 새 준비 담당자를 추가하라는 사용자 요청을 반영한 예외다. 코코의 창고 방문 이유와 테스의 별 장난감(t4)을 포함해 면담은 18개·43칸이다(개발 점검 사용자 결정: 데이지 h4·니코 n5를 받아쓰기로, 재미 보강으로 테스 t4). 경사는 받아쓰기0개다. 재사용3명·신규3명, 탐정은 기존 다람쥐다.</p>
<p>뒷문 가까운 창고 선반 안쪽은 앞문 옆 장식 더미 때문에 계속 보이지 않고, 뒷문 밖의 썰매도 앞문에서는 보이지 않는다. 데이지는 출입은 봤지만 손에 든 것·별 반출은 못 봤다. 창고의 물건·방문자 이름은 자기소개·답변 기록·실제 증거 발견 범위에 맞춰 공개한다. 장식 정리는 선물을 포장하는 일과 다르며 현재 행동을 과거 무죄 근거로 쓰지 않는다.</p>
<span class="plan-anchor" id="map-plan"></span>
<h3>축제장 지도 제작 기획</h3>
<p>사용자 승인 방향이다. 기존 게임의 지도 화면에 쓰는 원화 기획이며, 이미지는 Claude Code가 개발 과정에서 준비한다. 이번 작업에서는 지도 그림·현장 원화·음성을 생성하지 않는다.</p>
<p><strong>범위와 시점</strong>: 사건이 일어나는 작은 축제장 전체를 살짝 위에서 내려다본다. 기존 사건 일러스트와 어울리는 동화책 화풍을 유지한다. 마을 전체를 축소해 넣지 않고, 네 방문 지점의 관계를 알아볼 수 있는 범위로 잡는다.</p>
<div class="matrix"><table><thead><tr><th>지도상 위치</th><th>장소와 눈에 띄는 형태</th><th>연결되는 장면</th></tr></thead><tbody>
<tr><td>중앙 아래</td><td>큰 크리스마스트리와 광장. 작은 안내소가 같은 광장 안에 있다.</td><td>입구에서 경사 의뢰 → 경사가 떠나면 안내소의 엘라 면담 · 결말의 점등식</td></tr>
<tr><td>왼쪽 위</td><td>눈 쌓인 지붕의 축제 창고. 앞문과 앞길, 천막 쪽으로 난 짐 싣는 뒷문이 보인다.</td><td>데이지·빈 보관함·창고 모퉁이 바닥 조사</td></tr>
<tr><td>오른쪽 위</td><td>따뜻한 색의 선물 포장 천막. 썰매 쪽 옆면이 열려 있다.</td><td>코코·테스 면담과 최초 장난감 선물 사진</td></tr>
<tr><td>포장 천막 바로 옆</td><td>열린 옆면에서 가까운 배송용 썰매 자리. 짐칸과 접근 공간이 보인다.</td><td>니코 면담·현재 작업대 관찰·심문·엘라의 최종 확인·별 반환</td></tr>
</tbody></table></div>
<p>안내소는 광장 안의 접근 지점이며 별도 지도 장소로 늘리지 않는다. 썰매 자리는 천막과 가깝지만 별도의 방문 지점이다. 장소는 트리 광장·축제 창고·선물 포장 천막·썰매 앞의 네 곳을 유지한다. 위의 상하좌우는 원화 구성 기준이며 실제 방위·거리·축척은 아직 확정하지 않았다.</p>
<h4>이동 경로와 현장 그림의 연결</h4>
<div class="matrix"><table><thead><tr><th>연결</th><th>반드시 맞춰야 할 공간 관계</th></tr></thead><tbody>
<tr><td>광장 안 입구 → 안내소</td><td>경사와의 대화가 끝나 경사가 떠나면 같은 광장 그림의 안내소 자리에 엘라가 나타난다. 장소 안 이동 버튼은 없다. 경사가 엘라를 데리고 오거나 함께 안내하지 않는다.</td></tr>
<tr><td>창고 앞문 → 트리 광장</td><td>데이지가 장식을 옮긴 손수레 경로. 앞문에서 광장 쪽으로 굽는 길이 있다.</td></tr>
<tr><td>창고 뒷문 → 천막 옆 썰매</td><td>창고 뒷문 앞부터 썰매 자리까지 물건을 끌고 이동할 수 있는 눈길. 중간의 나무 기둥이 두 현장 사진에 같은 모습으로 등장한다.</td></tr>
<tr><td>썰매 자리 → 천막 작업대 시야</td><td>천막의 열린 옆면이 썰매를 향한다. 가까운 작업대에서 여섯 상자가 각각 보이고, 포장이 진행된 상태를 비교할 수 있다. 멀리 떨어진 클립보드의 작은 글자를 읽어야만 풀리게 하지 않는다. 명단·예정 수량은 이미 촬영한 사진에서 확인한다.</td></tr>
<tr><td>광장 → 썰매 앞</td><td>경사와 엘라가 진행 상황을 들으러 걸어오는 짧은 동선. 무거운 별은 썰매 위 상자에 그대로 둔다.</td></tr>
</tbody></table></div>
<p>창고 앞문·뒷문 방향, 천막의 열린 옆면, 테스 작업대, 썰매 방향을 먼저 맞춘 뒤 지도와 현장 배경을 제작한다. 창고 모퉁이 사진의 두 길과 두 사진에 공통으로 보이는 나무 기둥도 같은 배치를 따른다. 도구를 끌고 이동한 흔적은 현장 촬영에서 발견하며, 지도 원화에 정답 경로나 증거 자국을 강조해 넣지 않는다.</p><h4>장면 배치표</h4><p>장면 그림을 만들기 전에 정한 배치다(2026-11-10). 창고의 앞문은 남쪽(광장 쪽), 뒷문은 동쪽(썰매 쪽)이다. 썰매는 창고와 천막 사이, 천막의 열린 서쪽 옆면 바로 앞에 선다. 나무 기둥은 창고 뒷문과 썰매 사이 길에 있다. 트리 광장은 창고의 남동쪽 아래에 있어 창고 모퉁이에서 멀리 트리가 보인다. 각 장면 그림의 왼쪽·가운데·오른쪽은 아래 표를 따른다.</p><figure style="margin:12px 0 20px"><div tabindex="0" aria-label="장면 배치표" style="overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:#fffdf8"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" role="img" aria-label="축제장 배치표: 창고, 천막, 썰매, 나무 기둥, 트리 광장과 장면별 카메라 방향" style="display:block;width:100%;min-width:640px;height:auto;font-family:inherit">

</g></svg></div><figcaption style="color:var(--muted);font-size:14px;margin-top:9px">제작용 배치표다. 북쪽이 위. 빨간 삼각형은 장면 그림의 카메라 위치와 방향, 파란 삼각형은 창고 모퉁이 사진. 점선은 두 자국(지도 원화에는 강조하지 않음). 거리·축척은 그림 구성용이며 실제 크기가 아니다.</figcaption></figure><div class="matrix"><table><thead><tr><th>그림</th><th>카메라</th><th>화면 왼쪽</th><th>가운데</th><th>화면 오른쪽</th></tr></thead><tbody><tr><td>1 트리 광장</td><td>광장 입구(남)에서 북쪽</td><td>경사(입구 쪽), 창고로 가는 길(왼쪽 위)</td><td>큰 트리(꼭대기는 화면 밖, 별 없음)</td><td>안내소(엘라), 천막·썰매로 가는 길(오른쪽 위)</td></tr><tr><td>2 창고 안</td><td>앞문(남)에서 북쪽</td><td>데이지 작업대(앞), 시야를 가리는 장식 상자, 왼쪽 벽의 화환·사다리, 왼쪽 안 구석의 저울과 의자 더미</td><td>통로, 전구 줄 상자, 식탁보 바구니</td><td>오른쪽 벽 안쪽의 뒷문과 바로 옆 별 보관함 선반(빈 보관함), 앞쪽의 포장재 선반</td></tr><tr><td>3 창고 모퉁이(c-track-yard)</td><td>창고 남동쪽 모퉁이 바깥에서 남동쪽</td><td>뒷문에서 나온 자국 → 나무 기둥 → 프레임 밖(동쪽)</td><td>두 자국이 갈라지는 눈 바닥</td><td>앞문에서 나온 손수레 자국이 광장 쪽으로 굽음, 멀리 큰 트리 윤곽</td></tr><tr><td>4 포장 천막</td><td>천막 남쪽 입구에서 북쪽</td><td>열린 서쪽 옆면 바로 안쪽의 테스 작업대(상자 여섯·클립보드), 옆면 너머로 썰매가 살짝 보임</td><td>통로</td><td>코코의 낮은 의자와 눈송이 작업대</td></tr><tr><td>5 썰매 앞</td><td>썰매 남쪽에서 북쪽</td><td>나무 기둥과 기둥에서 썰매 밑으로 들어가는 흐릿한 자국</td><td>썰매 짐칸의 똑같은 상자 다섯, 옆의 열린 빈 상자·큰 자루</td><td>천막의 열린 옆면과 그 안의 테스 작업대</td></tr><tr><td>10 축제장 지도</td><td>위에서, 북쪽이 위</td><td>왼쪽 위 창고</td><td>가운데 위 썰매, 아래 가운데 트리 광장</td><td>오른쪽 위 천막</td></tr></tbody></table></div>

<h4>그림의 강조와 정보 공개</h4>
<ul>
<li>큰 트리가 먼저 눈에 들어오도록 그린다. 주변 지붕보다 훨씬 크되 창고·천막·썰매와 통로를 가리지 않는다.</li>
<li>눈은 푸른 그림자, 천막과 건물은 따뜻한 조명으로 표현한다. 작은 장식을 빽빽하게 채우지 않고 건물 형태와 위치가 구별되게 한다.</li>
<li>장소 이름은 원화에 새기지 않는다. 기존 지도 방식에 따라 발견한 장소부터 이름과 이동 대상을 표시한다. 자기소개 전 인물 이름이나 범인·알리바이를 지도에 노출하지 않는다.</li>
<li>창고는 엘라 e2, 포장 천막은 데이지 h3, 썰매 앞은 테스 t3를 기록한 뒤 방문 가능하다. 이동은 플레이어가 선택한다.</li>
<li>지도는 길과 장소의 관계를 보여 준다. 두 자국이 무엇인지, 언제 생겼는지, 누가 남겼는지는 지도에서 알려 주지 않는다.</li>
</ul>
<p><strong>제작 순서</strong>: 위 배치 기준 확인 → 각 현장 배경의 방향·거리·시야 맞추기 → 개발 단계에서 지도 일러스트 제작. 실제 원화 구도와 게임 지도 동작은 검증 안 함. 지도 계획 추가 당시에는 미인계였으며, 현재 인계 상태는 §10을 따른다.</p>

<p>경사의 의뢰·안내소 신고 정보→경사 퇴장·안내소에 엘라 등장→탐정의 인사→엘라의 인사→e0→e1·e2, e2→축제 창고·데이지·c-case·c-track-yard. 창고 모퉁이 바닥 촬영(c-track-yard)→데이지 h4(손수레). 데이지 h1→h2→h3→포장 천막·코코·테스 면담. 코코 m0 창고 방문 이유→m1 지금 하는 일→m3 포장을 끝내 니코에게 건넨 상자 수. 테스 첫 면담은 별 목격 여부→창고에 간 이유(둘 다 받아쓰기)→t1→t3·장난감 조사 행동, 테스 t3→썰매·니코·c-boxes·c-track-sleigh. c-track-sleigh 촬영→니코 n5(썰매 이동). 니코 n1→n2→창고에 들어갔는지(받아쓰기)→n3 포장 역할 확인→n4 오늘 이상한 것을 봤는지 확인(테스 탓). 니코 n4 뒤 천막으로 돌아가 테스 t4(별 장난감)→뒷면 보기 허락→c-toy-star. 니코의 면담을 마치면 썰매 자리에서 천막 쪽 작업대를 볼 수 있다. 테스 면담에서는 t1·t3를 기록하고 장난감 선물을 촬영한다. 두 면담이 열리면 코코·테스 방문 순서는 자유이며 기록은 추리 직전에 합류한다.</p>
<p>면담 22개·개봉 전 필수 사진 6장·현재 작업대 필수 관찰 완료 → 추리 10문항 → 니코의 핑계에 테스 t3·c-toys → 코코 m3 → 테스의 별에 테스 t4·c-toy-star 제시 → 경사와 엘라 도착·니코의 거부·엘라의 허락·경사의 개봉 지시 → 심문 멈춤·썰매 현장에서 플레이어가 (선택) 창고 구석의 저울을 가져와 상자 다섯을 달아 보고 하나를 골라 탐정이 열어 별 발견 → c-open → 뒷면 조사·c-mark → 심문 재개·니코의 부인에 c-mark·엘라가 직접 확인 → 니코의 인정 → 경사가 니코를 데려감 → 썰매 앞에서 엘라에게 별을 건넴 → 트리 광장으로 이동·점등식. 선택 사진 두 장은 해금 조건에 포함하지 않는다. 선물 상자 사진은 썰매 위 상자 수를 찍는 c-boxes 하나뿐이며 상자 겉모습은 증거가 아니다. 모든 이동은 생각과 버튼을 쓰며 발견·촬영 뒤 자동 이동하지 않는다.</p>
</div></details></section><section class="story-card" id="learning"><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">열쇠 표현·복습·균형표</summary><div style="display:grid;gap:12px;padding-top:14px"><div class="section-head"><h2>8. 학습·복습·문서 집계</h2></div>
<p>새 의미 대조는 현재 작업이 진행 중인지·어떤 행동을 하는지다. 코코의 I&#x27;m not wrapping now와 테스의 I&#x27;m still wrapping은 끝난 일과 진행 중인 일의 대비다. 테스의 still wrapping과 when I finish wrapping을 듣고, 포장 상태와 선물 전체를 포장이 끝난 뒤 나르는 조건을 구분한다. 사진 c-toys의 예정 수량과 작업대의 실제 여섯 개를 대조해 설명 확인 때 니코에게 내민다. 니코의 loading some gifts·Other volunteers wrapped them(n2)은 누가 포장했는지 흐리게 말하는 주장이다. n3의 Coco and Tess로 이어 두 사람의 작업대를 확인하고, 개봉 뒤 별 실물과 대조한다. n3의 I&#x27;m not wrapping gifts는 부정형 표현이다. n4의 not really 뒤에 이어지는 I think I saw Tess taking the star는 니코가 테스 탓을 하는 말이며(saw + 사람 + -ing), 천막으로 돌아가 테스 t4(very light)·c-toy-star로 확인한다. 테스의 very light와 엘라의 very heavy는 썰매의 상자를 고르는 대조어다. 현재 행동을 과거 알리바이로 만들지 않는다. 데이지의 saw·went는 출입 목격의 짧은 배경 표현이며 별도 과거 시제 숙달 목표로 확대하지 않는다.</p>

<tr><td>데이지 h2 I saw Coco and Tess go in. I went in, too.</td><td>여러 사람의 출입을 알지만 그중 누가 별을 가져갔는지는 모름</td></tr>

<h3>열쇠 형태·실제 복습 발화·사건 밖 예문</h3>
<h4>긍정 · be + -ing</h4>
<p>지금 하는 일을 말한다.</p>
<p>실제 발화: <strong>I&#x27;m making snowflakes for the tree. I&#x27;m helping Daisy.</strong> · mae:m1</p>
<div class="matrix"><table><thead><tr><th>사건 밖 예문</th><th>반말 해석</th></tr></thead><tbody>
<tr><td>I&#x27;m reading a book.</td><td>난 책을 읽고 있어.</td></tr>
<tr><td>She&#x27;s washing a cup.</td><td>그 애는 컵을 씻고 있어.</td></tr>
<tr><td>They&#x27;re drawing maps.</td><td>그 애들은 지도를 그리고 있어.</td></tr>
</tbody></table></div>
<h4>부정 · be not + -ing</h4>
<p>not을 놓치면 반대 행동으로 기록한다.</p>
<p>실제 발화: <strong>No, I&#x27;m not wrapping gifts. Coco and Tess wrap them.</strong> · nico:n3</p>
<div class="matrix"><table><thead><tr><th>사건 밖 예문</th><th>반말 해석</th></tr></thead><tbody>
<tr><td>I&#x27;m not sleeping.</td><td>난 자고 있지 않아.</td></tr>
<tr><td>He isn&#x27;t cooking.</td><td>그 애는 요리하고 있지 않아.</td></tr>
<tr><td>We aren&#x27;t running.</td><td>우리는 달리고 있지 않아.</td></tr>
</tbody></table></div>
<h4>확인 · be + 주어 + -ing?</h4>
<p>상대의 현재 행동을 확인한다. Are you로 물으면 자기 행동을 I am으로 답한다.</p>
<p>실제 발화: <strong>Are you still wrapping gifts?</strong> · mae:m3 질문</p>
<div class="matrix"><table><thead><tr><th>사건 밖 예문</th><th>반말 해석</th></tr></thead><tbody>
<tr><td>Are you reading?</td><td>너 읽고 있어?</td></tr>
<tr><td>Is she dancing?</td><td>그 애는 춤추고 있어?</td></tr>
<tr><td>Are they swimming?</td><td>그 애들은 수영하고 있어?</td></tr>
</tbody></table></div>
<h4>행동·대상 질문 · What + be + 주어 + -ing?</h4>
<p>지금 하는 행동이나 포장하는 대상을 묻는다.</p>
<p>실제 발화: <strong>What are you loading?</strong> · nico:n2 질문</p>
<div class="matrix"><table><thead><tr><th>사건 밖 예문</th><th>반말 해석</th></tr></thead><tbody>
<tr><td>What are you reading?</td><td>무엇을 읽고 있어?</td></tr>
<tr><td>What is he drawing?</td><td>그 애는 무엇을 그리고 있어?</td></tr>
<tr><td>What are they carrying?</td><td>그 애들은 무엇을 들고 있어?</td></tr>
</tbody></table></div>
<p>look for·give back·I don&#x27;t know.는 표현 목록이며 문법과 구분한다. 인물 이름은 복습 단어에 넣지 않는다. 노트는 들은 문장 그대로 인용하고 빈칸에 대명사를 바꾸지 않는다.</p>

<p>추가 제안 어휘는 빈칸 단어와 구분한다: empty boxes / 빈 상자들(nico:storeroom-reason: No. I was waiting for all the gifts to be wrapped.), pattern / 무늬(ella:e1·c-mark), sell / 팔다(nico:motive: I thought the gold would sell for a lot.).</p>
<p>해결 뒤 복습: <strong>Nico took the town&#x27;s gold star from the storeroom. He hid it in a gift box. He saw the open case and got greedy. He thought the gold would sell for a lot. Ella came to the sleigh to check the star. / 니코가 창고에서 마을의 금별을 가져가 선물 상자에 숨겼어. 열린 보관함을 보고 욕심이 났고, 금별을 팔면 큰돈을 받을 수 있을 줄 알았어. 엘라가 썰매 앞으로 와서 별을 확인했어.</strong> 범인 얼굴·인정 내용은 해결 뒤 복습에서만 요약한다.</p>
<h3>새 상황 확인·지연 복습</h3>
<ul>
<li>질문: <strong>Are you washing the cup? / 컵을 씻고 있어?</strong></li>
<li>대답: <strong>No, I&#x27;m not washing it. I&#x27;m drying it. / 아니, 씻는 게 아니야. 말리고 있어.</strong></li>
<li>확인: <strong>What is the speaker doing? / 말하는 사람은 무엇을 하고 있어?</strong></li>
<li>보기: drying the cup · washing the cup · painting the cup · filling the cup · buying the cup · dropping the cup.</li>
<li>정답: <strong>The speaker is drying the cup. / 말하는 사람은 컵을 말리고 있어.</strong></li>
<li>피드백: <strong>Listen for “not washing” and “drying.” / “not washing”과 “drying”을 들어 봐.</strong></li>
<li>다른 날 질문: <strong>Are you cutting the paper? / 종이를 자르고 있어?</strong></li>
<li>대답: <strong>No, I&#x27;m not cutting it. I&#x27;m folding it. / 아니, 자르는 게 아니야. 접고 있어.</strong></li>
<li>확인: <strong>What is the speaker doing? / 말하는 사람은 무엇을 하고 있어?</strong></li>
<li>보기: folding the paper · cutting the paper · drawing on the paper · gluing the paper · tearing the paper · carrying the paper.</li>
<li>정답: <strong>The speaker is folding the paper. / 말하는 사람은 종이를 접고 있어.</strong></li>
</ul>
<p>학생의 직접 표현은 새 그림을 보고 I&#x27;m …ing / I&#x27;m not …ing로 짧게 말하기다. 이 추가 활동의 실행·평가는 하지 않았다.</p>

</div></details></section><section class="story-card" id="truth"><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">제작자용 진실·행동 이유</summary><div style="display:grid;gap:12px;padding-top:14px"><div class="callout"><strong>현재안: 금으로 만든 별 절도.</strong> 선물 상자는 숨기는 수단이다. 창고 목격·현재 작업 진술·별 실물의 특징을 함께 확인한다.</div><p><strong>L1-05 현재진행형 · 2026-11-09 Claude Code 개발 인계 · 개발 점검·2차 수정 반영(사용자 합의, §9 끝) · 그림·음성 계획 대기.</strong> <a href="case-10-christmas-star.html">장면별 기획</a></p><p>마을의 큰 크리스마스 축제를 위해 어른들이 아이들 선물을 자원해서 준비한다. 엘라는 축제를 안내하고, 새 인물 데이지는 창고와 장식을 정리한다. 코코는 털장갑, 테스는 장난감 선물을 포장하고 니코는 완성된 선물을 썰매에 나르고 배송하는 역할만 맡는다. 니코는 창고에 보관한 금으로 만든 별을 선물 상자 안에 완전히 숨겨 나른다. <strong>선물 상자 자체·상자의 출처·손잡이·종이 조각은 범행 물증으로 쓰지 않는다.</strong> 썰매 위 상자의 수(c-boxes)와 무게(저울)는 플레이어가 쓰는 단서다.</p><p>별은 속까지 꽉 찬 실제 금으로 만든 장식 하나뿐이다. 밖으로 별 끝이나 금빛이 보이는 설정은 없다. 별 뒷면의 작은 잎사귀 음각 무늬가 실제 물건 확인에 쓰인다. 새 인물 이름·종(양 데이지)과 무늬·구체 대사는 기획자 제안이며 사용자 결정으로 적지 않는다. 새 인물·창고 보관·추가 근거를 넣는 방향은 사용자 승인 사항이다. 그림·음성 생성이나 게임 구현은 하지 않는다.</p><div class="section-head"><h2>1. 제작자용 진실·행동 이유</h2></div>
<ol>
<li>별은 마을이 해마다 쓰는 귀중품이며 창고 선반의 전용 보관함에 둔다. 뒷면에는 작은 잎사귀 무늬가 새겨져 있다. 몸체는 속까지 꽉 차 있고 전기 부품·빈 내부·연결 관은 없다. 가까운 곳까지 잠깐 들어 옮길 수는 있지만, 계속 들고 마을길을 걷기에는 무겁다. 순도·정확한 무게·크기·트리 고정 방식은 미정이다.</li>
<li>엘라는 설치 준비를 위해 보관함 잠금을 풀고 별을 확인한 뒤, 뚜껑만 닫아 두고 광장 입구의 어린 친구들을 안내하러 잠시 나간다. 평소에는 잠가 보관한다. 돌아와 별이 없어진 것을 알고 오소리 경사에게 알린다. 경사는 탐정에게 없어진 물건의 조사를 부탁하고, 무엇이 없어졌는지 묻자 마을의 크리스마스 별이라며 안내소의 엘라에게 자세히 들어 보라고 한다. 경사가 주변 순찰을 떠나면 같은 광장의 안내소 자리에 있는 엘라에게 탐정이 말을 건다. 엘라와 테스는 우산 사건에서 탐정을 만났으므로 다시 만난 인사를 하고, 엘라는 자기가 신고했다고 밝힌다. 탐정은 이어 경위를 묻는다. 엘라는 축제 준비 담당자로서 별을 찾는 데 필요한 탐정이 축제 물품을 확인해도 된다고 허락하고, 조사 중에는 안내 자리에 남는다. 경사는 의뢰 직후 축제장 주변을 확인한다. 후반 합류 때 탐정에게 엘라의 물품 확인 허락을 전달받는다. 후보를 직접 지목하지 않고 위치·특징만 답한다. 사전 별 사진은 없다.</li>
<li>창고에는 앞문과 짐을 싣는 뒷문이 있다. 별 보관함이 있는 선반은 뒷문 가까운 안쪽이다. 데이지는 창고의 장식을 큰 장식 상자에 담아 손수레로 트리 광장에 옮긴 뒤 앞문 옆 작업대에서 장식을 정리하고 리본을 단다. 손수레의 두 바퀴가 남긴 자국은 트리 광장 쪽으로 굽는다. 본인도 창고를 사용한다. 코코는 포장지를, 테스는 빈 선물 상자를 가지러 드나들고(테스는 니코보다 먼저 들렀고 보관함 뚜껑이 닫혀 있어 별을 보지 못했다. 니코는 별을 꺼낸 뒤 뚜껑을 열어 둔 채 갔다. 사용자 결정), 니코는 포장 천막에 가져다줄 빈 상자를 가지러 짐 싣는 뒷문으로만 드나든다. 데이지는 코코와 테스가 앞문으로 들어가는 것은 봤지만 선반 안쪽에서 무엇을 집었는지 계속 보지는 못했고, 뒷문을 쓴 니코는 보지 못했다(사용자 결정). 출입 목격만으로 별을 가져간 사람을 알 수 없다.</li>
<li>니코는 앞문의 데이지에게 보이지 않는 창고 뒷문에 축제 배송용 썰매를 세우고, 포장 천막에 가져다줄 빈 상자를 가지러 뒷문으로 들어간다. 창고 안의 열린 보관함에서 무거운 별을 꺼내 준비용 선물 상자에 숨기고, 뒷문 앞까지 짧게 들어 썰매에 싣는다. 그 썰매를 포장 천막 옆까지 끌어다 세운다. 창고 뒷문에서 썰매 아래까지 이어지는 자국은 이때 생겼다(개발 점검 사용자 결정). 데이지의 손수레 자국과 이 썰매 자국은 모두 눈이 오기 전에 생겼다. 그 뒤 눈이 조금 내려 두 자국 모두 흐릿해졌지만 끊기지 않아 따라갈 수는 있다(사용자 결정: 두 자국 모두 흐릿하게). 코코는 니코가 가져다준 빈 상자에 아이들 털장갑을 넣어 축제 공용 포장지와 리본으로 싸고, 포장을 끝낸 상자 넷을 니코에게 건넸다(테스의 말처럼 포장을 끝내면 니코가 가져간다). 니코는 별을 숨긴 상자도 같은 포장지와 리본으로 싸서 그 사이에 실었으므로 썰매의 상자 다섯은 겉으로 똑같다(사용자 결정: 코코가 건넨 상자 4개·썰매 5개). 털장갑 상자는 아주 가볍고 별 상자는 아주 무겁다. 니코는 별이 든 무거운 상자를 다른 상자들과 함께 나르려 하며, 무엇을 싣는지 묻자 다른 봉사자들이 포장한 선물이라고 흐리게 둘러대고, 심문에서 몰리면 테스의 선물 → 모두 코코의 선물이라는 말로 좁혀 간다(사용자 결정: 니코의 흐린 첫 주장). 정상 역할은 선물 운반·썰매 배송이며 포장을 겸하지 않는다. 닫힌 선물 상자는 숨기는 수단일 뿐 창고 출처를 입증하는 증거가 아니다.</li>
<li>코코·테스는 천막에서 선물을 포장한다. 테스가 이번 배송을 위해 준비한 장난감 선물은 배송 준비표에 적힌 여섯 개 전부이며 모두 작업대에 남아 있다. 촬영 시점에는 포장 완료, 포장 중, 포장 전이 두 개씩이다. 포장 전 둘 가운데 하나는 토이 네스트의 금빛 플라스틱 별 장난감이다. 테스가 아침에 가게에서 들고 왔다. 가볍고 뒷면에 무늬가 없다(사용자 결정: 테스의 별 장난감). 이미 니코에게 건넨 별도 물량은 없다. 니코는 아직 나머지 선물이 준비되지 않아 출발하지 않는다. 자동 도주·타이머는 없다.</li>
<li>탐정은 창고의 빈 보관함을 촬영하고 데이지에게 현재 작업과 출입을 묻는다. 여러 친구가 출입했으므로 그 말만으로 특정하지 않는다. 천막에서 테스의 선물을 전부 포장하면 니코가 가져간다는 말을 듣는다. 니코의 운반 주장을 들은 뒤 썰매 자리에서 보이는 작업대에 여섯 개가 그대로 남아 있다.</li>
<li>니코는 오늘 이상한 것을 봤는지 묻자, 테스가 별을 가져가는 걸 본 것 같다고 혐의를 돌린다(반쯤 사실: 테스는 아침에 토이 네스트의 금빛 별 장난감을 들고 창고에 들렀다가 작업대로 왔고, 니코는 뒷문 쪽에서 그 모습을 언뜻 봤다). 탐정은 천막으로 돌아가 그 별이 가벼운 별 장난감이고 뒷면에 무늬가 없음을 확인한다. 추리를 마치면 탐정이 설명에 맞지 않는 부분이 있다고 짚는다. 니코는 테스의 선물 → 모두 코코의 선물 → 테스의 별 탓으로 핑계를 바꾸고, 플레이어는 테스 t3·c-toys, 코코 m3, 테스 t4·c-toy-star를 내밀어 하나씩 반박한다. 경사는 엘라와 함께 진행 상황을 들으러 온다. 니코는 축제 선물이라며 개봉을 거부하지만, 엘라가 축제 물건이니 확인해도 된다고 허락하고 경사가 탐정에게 열라고 한다. 썰매의 상자 다섯은 똑같아 보이므로, 플레이어가 창고 구석에 있던 양팔 저울을 가져와 상자 둘씩 달아 보는 등 지금까지의 단서로 별이 든 상자를 직접 골라 탐정이 연다.</li>
<li>개봉 뒤 처음으로 별을 발견한다. 선물이라는 니코의 주장과 실제 별 실물이 다름을 확인한다. 별의 뒷면을 조사·촬영해 엘라가 설명한 작은 잎사귀 무늬를 확인한다. 니코가 사라진 별이 아니라고 버티면 탐정이 뒷면 사진을 내밀고, 그 자리의 엘라가 자기 별이라고 직접 확인한다. 이후 니코가 열린 보관함에서 금별을 보고 욕심이 나 허락 없이 가져갔으며, 별을 팔면 큰돈이 될 줄 알았고 테스 탓은 거짓이었다고 인정한다. 경사가 니코를 데려가고, 탐정은 썰매 앞에서 엘라에게 별을 건넨다. 별은 트리 꼭대기에 다시 달리고, 해가 진 트리 광장의 점등식에서 트리에 불이 켜지며 사건이 끝난다.</li>
</ol>
<p>여러 봉사자가 같은 창고에 드나든다. 코코가 포장한 털장갑 상자는 별 상자와 겉이 똑같아, 상자 수와 무게로만 구별된다. 데이지도 출입했고 현재 장식을 정리하므로 후보에서 자동 제외하지 않는다. 현재 작업은 과거 알리바이가 아니다. 범행 물증은 별의 실물·뒷면 무늬·비어 있는 보관 위치다. 데이지와 테스·니코의 말은 진술로 기록한다. 테스의 별 장난감은 금빛이라 처음에는 의심스럽지만 가볍고 뒷면에 무늬가 없다. 박스 손잡이 조각·상자 모양·배송 라벨·동물 종·외형·색을 범인 증거로 쓰지 않는다.</p>

<h3>인물 일러스트 · 작업 중과 대화 중</h3>
<p>인물마다 하던 일이 보이는 전신 작업 자세를 기본 원화로 잡는다. 몸과 손이 보이도록 작업대는 인물 옆에 비스듬히 둔다. 말을 걸면 그 자리에서 손을 멈추거나 시선을 드는 자세를 제안한다. 앉아서 일하던 코코는 앉은 채 답한다. 대화 전후 자세 전환 지원은 개발 점검 항목이며, 한 컷만 쓰는 경우에는 작업 자세에서 얼굴을 탐정 쪽으로 조금 열어 둔다. 몸짓과 소품은 현재 작업을 보여 주는 연출이고 범행이나 알리바이의 증거로 세지 않는다.</p>

<p>기존 동작 조합으로 설계하되 <strong>썰매에서 진행된 포장 배경 확인</strong>, <strong>현장에서 대질을 시작해 개봉·촬영을 거친 뒤 재개</strong>, <strong>두 자국 사진 또는 진술과 사진을 함께 제시</strong>, <strong>발견 알림 뒤 엘라가 썰매 앞에 합류</strong>, <strong>추리 뒤 사진 추가·별 뒷면 확대·후속 심문 조건 갱신</strong>, <strong>경사의 의뢰 뒤 순찰 이탈·같은 광장 안내소로 접근해 엘라에게 말 걸기·후반 조사 완료 뒤 합류</strong>는 개발 점검에서 엔진과 대조해 방식을 정했다(아래 "개발 점검·2차 수정"). 그림·녹음 생성과 게임 실행은 하지 않았다.</p>
<p>사용자 결정: 벤 대신 우산 사건의 거북 테스를 재사용하고 책 선물 여섯 개를 장난감 선물 여섯 개로 대체한다. 니코는 선물 운반·썰매 배송만 담당, 새 준비 인물 추가, 별을 창고에 보관, 테스 진술 외의 근거 보강, 선물 상자 자체는 범행 물증으로 쓰지 않음, 속까지 꽉 찬 실제 금으로 만든 별 하나, 이전안 백업 삭제.</p>
<p>기획자 구체화: 성인 양 데이지, 문 앞 장식 작업대의 목격 범위, 별 뒷면 잎사귀 음각 무늬, 니코의 선물 주장과 별 실물 대조, 코코의 창고 방문 질문을 포함해 면담 15개·36칸으로 조정(개발 점검에서 18개·46칸, 빈칸 4개 질문 정리로 43칸), 필수 사진 8장·선택 2장 구성이다. 전반부 다섯 장면의 선택 음성 10개는 사용자 승인 제안을 반영했다(이후 창고에 3개를 더해 13개, 사용자 요청). 이를 사용자 지정 세부사항으로 적지 않는다.</p>
<p>남은 검토: 별 뒷면 무늬가 실제 그림에서 보이는지, 배송 경로와 각 집의 위치. 창고 시야(뒷문)와 엔진 지원은 아래 "개발 점검·2차 수정"에서 정했다.</p>
<p>검증 안 함: 실제 플레이·소요 시간·학습 효과·학생 청취·녹음 속도·실제 원화·엔진 실행. 문서의 문장 길이·원문 노트·보기·조건·대사·사진·흐름도는 대조하지만 사용자 승인 뒤 정식3단계 규칙별 점검을 대신하지 않는다.</p>
<h3>최종 문서 점검 · 2026-11-09</h3>
<p>최종 표현 조정: 엘라의 You can check는 확인 허락이며 탐정도 Ella said I could check로 전달한다. 한국어도 “확인해도 돼 / 확인해도 된다고 했어”로 일치시켰다. 경사의 개봉 지시는 “We need to check it. Detective, open the box.”로 간결하게 정리했다.</p>
<p>후속 사용자 승인으로 테스의 배송 준비 질문, 니코의 차분한 첫 주장·상자 행선지 질문, 식탁보 관찰 음성을 반영했다. n4는 배송 목적 확인으로 제한하고 개봉 뒤에는 n2의 장난감 선물 주장과 실제 별을 대조한다. 이전의 장식품 운반 부인 근거는 사용하지 않는다.</p>
<p>사용자 요청으로 전반부 관찰 음성·선택 소품 반응을 반영한 뒤 사건 시작부터 보고까지 문서로 대조했다. 이 점검 당시에는 미인계였으며, 이후 인계 상태는 §10을 따른다. 기존 대본의 심문·자백·결말에는 새 소품 대사를 추가하지 않았다.</p>
