<tr><td>중요한 진술의 받아쓰기</td><td>지킴 · 개발 점검 사용자 결정</td><td>데이지의 손수레·니코의 썰매 진술을 holly:h4·nico:n5 받아쓰기로 바꿨다. 받아쓰기 없는 문답은 테스·니코의 창고 방문 이유와 별 목격 여부 같은 보조 문답뿐이다.</td></tr>
<tr><td>미리보기·그림·엔진</td><td>판단 필요</td><td>두 작업대 상태의 상자 수·자국 경로를 실제 원화에서 읽을 수 있는지, 두 사진 동시 제시·개봉 뒤 조사·선택 반응 조건을 엔진이 지원하는지는 개발 점검 대상. 새로운 그림·음성은 생성하지 않음.</td></tr>
</tbody></table></div>
<p><strong>사용자 결정</strong>: 현재 해결 흐름을 유지한다. 다른 후보 전원의 무죄 입증은 추가하지 않으며, 니코의 설명 모순에서 실물 확인·자백으로 이어지는 이 사건의 해결 방식으로 정리한다.</p>
<p><strong>사용자 결정(개발 점검)</strong>: 분량 초과는 유지하고, 현장 진술 두 개는 받아쓰기(h4·n5)로 바꾼다.</p>
<p><strong>기획자가 구체화한 것</strong>: 소품별 활성 시점, 기존 장난감 상자 안의 자동차, 빈 상자와 의심 상자의 구분 배치. 물건을 집거나 새 애니메이션을 재생하는 동작은 요구하지 않는다.</p>
<p><strong>확인하지 못한 것</strong>: 실제 플레이·소요 시간·학습 효과·학생 청취·녹음 속도·실제 원화의 가독성·엔진 실행은 검증 안 함. 순도·무게·크기·트리 고정 방식도 제작 전 구체화가 필요하다.</p>
<h3>개발 점검·2차 수정 · 2026-11-09 (Claude Code + 사용자)</h3>
<p>인계 뒤 Claude Code가 설계서를 엔진(바이올린 사건까지의 조건·행동·심문 대본·반환)과 대조하고, 이야기의 앞뒤를 다시 읽었다. 아래는 사용자와 정해 이 설계서에 반영한 것이다.</p>
<div class="matrix"><table><thead><tr><th>항목</th><th>결정</th></tr></thead><tbody>
<tr><td>경사의 퇴장</td><td>인물이 조건에 따라 사라지는 기능을 엔진에 더한다. 경사는 광장 대화를 마치면 사라진다. 엘라와 함께 진행 상황을 들으러 썰매에 오면 다시 서 있는 그림으로 나온다(심문 화면에서는 말풍선).</td></tr>
<tr><td>안내소</td><td>경사가 떠나면 같은 광장 그림의 안내소 자리에 엘라가 나타난다. 장소 안 이동 버튼(Go to the information desk.)은 뺐다. 탐정 생각은 남긴다.</td></tr>
<tr><td>심문 중 개봉</td><td>경사의 개봉 지시 뒤 심문을 멈추고 썰매 현장에서 상자 열기·c-open·뒷면 확대·c-mark를 한 뒤, 멈춘 곳(nico:claim-star)부터 심문을 재개한다. 엔진에 심문 멈춤·재개를 더한다.</td></tr>
<tr><td>증거 두 개</td><td>테스 핑계에는 tess:t3 또는 c-toys, 코코 핑계에는 mae:m3, 테스의 별 탓에는 tess:t4 또는 c-toy-star 중 하나를 내밀면 정답(바이올린 심문의 방식). 탐정은 고른 증거의 사실만 다시 말한다(사용자 결정: 풀이는 모두 플레이어가).</td></tr>
<tr><td>결말</td><td>엘라는 심문 중 경사와 함께 와서 개봉을 직접 본다. 알리기·봉사자 단계는 없고 썰매 앞에서 그대로 별을 건넨다(엔진에 이동 없는 반환을 더함). 그 뒤 트리 광장의 점등식으로 끝난다(아래 "점등식"). 엘라는 우산 사건의 서 있는 그림을 다시 쓴다.</td></tr>
<tr><td>테스</td><td>우산 사건 데이터와 같이 토이 네스트 직원. I run Toy Nest.는 뺐다.</td></tr>
<tr><td>다시 만난 인사</td><td>엘라·테스는 우산 사건에서 탐정을 만났으므로 Nice to see you again으로 인사한다. 탐정도 엘라의 이름을 부른다.</td></tr>
<tr><td>썰매는 창고 뒷문</td><td>앞문 옆 작업대의 데이지가 썰매를 보지 못하도록 니코는 짐 싣는 뒷문에 썰매를 세웠다. 니코는 뒷문으로만 드나들어 데이지는 니코를 보지 못했다. 보관함 선반은 뒷문 가까운 안쪽이다. c-track-yard는 창고 모퉁이에서 앞문(손수레 → 광장)과 뒷문(→ 나무 기둥 → 썰매) 자국을 한 장에 담는다.</td></tr>
<tr><td>썰매 자국 순서</td><td>썰매 앞에 오면 c-track-sleigh를 찍을 수 있고, 찍은 뒤 니코 n5가 열린다(창고 자국 → 데이지 h4와 같은 순서).</td></tr>
<tr><td>두 자국 모두 흐릿하게</td><td>데이지가 손수레로 장식을 옮기고 니코가 썰매를 옮긴 뒤 눈이 조금 내려, 앞문 → 광장 손수레 자국과 뒷문 → 나무 기둥 → 썰매 자국이 모두 흐릿하다(끊기지 않아 따라갈 수는 있다). 한쪽만 흐리면 쓰이지 않는 시간 단서처럼 보이므로 같게 둔다. 흐릿함은 시점으로 채점하지 않는다.</td></tr>
<tr><td>천막 작업대</td><td>썰매에서 작업대를 관찰한 뒤에는 천막 배경도 포장이 진행된 그림으로 바뀐다. 썰매에서 보는 작업대는 이 그림에서 잘라 쓴다.</td></tr>
<tr><td>분량</td><td>인물 6명·필수 사진 8장·천막 소품 4개·창고 소품 5개의 초과는 유지한다. 면담·추리 분량 줄이기는 개발한 뒤 다시 생각한다(사용자 결정).</td></tr>
<tr><td>현장 진술의 받아쓰기</td><td>데이지의 손수레(h4)·니코의 썰매(n5) 진술을 받아쓰기로 바꿨다. 테스 t4를 더해 면담은 18개·빈칸 44개.</td></tr>
<tr><td>보기</td><td>모든 노트 보기를 6장 이상·오답 4장 이상으로 늘렸다(개발 규칙, 동음어 없음).</td></tr>
<tr><td>니코의 핑계</td><td>니코는 테스의 선물 → 모두 코코의 선물 → 테스의 별 탓으로 핑계를 바꾼다(두 단계 말 바꾸기·남 탓하는 거짓 목격). n4에서 테스가 별을 가져가는 걸 본 것 같다고 미리 말해 두며, 테스가 실제로 금빛 별 장난감을 들고 왔으므로 반쯤 사실이다. 자백에서 거짓이었다고 인정한다. 바닥 자국과 데이지 h4·니코 n5는 추리의 자국 문항에서만 쓴다.</td></tr>
<tr><td>경사·엘라의 도착</td><td>심문 중 경사와 엘라가 함께 와서 진행 상황을 묻는다(확인하러 온 것이 아니라 의논하러 옴). 의뢰 때의 약속 대사는 사용자 결정으로 우선 넣지 않았다. 개봉은 엘라가 허락하고 경사가 지시한다.</td></tr>
<tr><td>데이지의 목격</td><td>데이지 h2에서 니코를 뺐다(코코·테스만 봄). 니코는 짐 싣는 뒷문으로만 드나들어 앞문의 데이지가 보지 못했고, 탐정은 테스 t3에서 니코를 처음 알게 된다. 니코에게는 오늘 창고에 들어갔는지 그냥 묻는다. 추리 1번 정답은 Coco and Tess.</td></tr>
<tr><td>가짜 용의자</td><td>테스의 별 장난감(사용자 결정). 테스 작업대의 포장 전 선물 가운데 토이 네스트의 금빛 플라스틱 별이 있다. 니코가 n4에서 테스가 별을 가져가는 걸 본 것 같다고 하면 탐정은 천막으로 돌아가 테스 t4를 듣고 뒷면을 찍는다(c-toy-star). 무늬가 없다는 판단은 탐정이 말하지 않고 플레이어가 추리 2번에서 한다.</td></tr>
<tr><td>헷갈리는 물건 단서</td><td>뺐다(2026-11-12 사용자 결정). 선반 아래 금빛 반짝이(c-glitter)와 그 추리 문항(deduction:glitter)을 없앴다. 선물로 보낼 별 장난감의 뒷면이 까져 있는 것과, 상자만 가지러 간 테스가 별 장난감을 들고 창고에 간 것이 어색했기 때문이다. 창고 그림의 반짝이도 지웠다. 추리는 다시 8문항이다.</td></tr>
<tr><td>니코의 흐린 첫 주장</td><td>니코 n2를 "I&#x27;m loading some gifts. Other volunteers wrapped them."으로 바꿨다(사용자 결정). 처음에는 누가 포장했는지 흐리게 말하고, n3의 Coco and Tess를 들은 플레이어가 두 사람의 작업대를 확인한다. 심문에서 몰리면 테스의 선물 → 모두 코코의 선물이라는 말로 좁혀 간다. 빈칸 3 → 4(전체 45), 추리 4번 정답과 보기, 추리 7·9번 근거에 mae:m3.</td></tr>
<tr><td>저울 퍼즐</td><td>창고 구석에 있던 양팔 저울로 상자 둘씩 무게를 비교한다(사용자 결정: 방탈출식 조작 퍼즐 가운데 저울만. 눈을 쓸어 자국을 잇는 안은 탐정이 억지로 단서를 만드는 것 같아 뺐다). 썰매 옆 배송 저울은 이야기에서 소개되지 않아 뜬금없으므로, 장면 2 창고 구석에 평범한 물건으로 두고 플레이어가 떠올려 가져오는 소지품으로 바꿨다(사용자 결정). 저울이 눈에 띄지 않도록 창고에 전구 줄·화환 소품과 배경 물건을 더했다(사용자 요청). 상자 고르기에서 탐정은 "확인할 방법이 필요해"까지만 생각한다. 엘라의 허락이 있으므로 가져가는 대사 없음, 돌려놓는 장면 없음. 횟수 제한·벌점 없음, 결과는 그림으로만, 쓰지 않고 바로 열어도 된다. 엔진에 소지품을 현장 물건(썰매의 상자)에 쓰는 저울 비교 동작과 심문 멈춤 중 다른 장소 다녀오기를 더한다.</td></tr>
<tr><td>코코의 털장갑 상자</td><td>코코는 쿠키 대신 아이들 털장갑을 포장하고, 포장을 끝낸 상자 넷을 니코에게 건넸다. 썰매에는 상자 다섯(사용자 결정). 코코는 지금 데이지를 도와 트리에 달 종이 눈송이를 만든다(사용자 결정). m0·m1·m3를 새로 쓰고 c-cookies·코코의 닫힌 상자 혼동·쿠키 저울을 뺐다. 새 필수 사진 c-boxes, 추리 7번을 상자 수 문항(deduction:count)으로, 심문 두 번째 핑계 "Oh, I mean they&#x27;re all Coco&#x27;s gifts.", 개봉 반응 "They&#x27;re just mittens!"·"Just mittens in this one.", 경사 보고는 니코가 한 말만. 데이지 h3는 데이지가 아는 지난 정보로 그대로 둔다.</td></tr>
<tr><td>똑같은 상자</td><td>썰매에는 겉이 똑같은 닫힌 상자 다섯이 있다(코코가 건넨 털장갑 상자 넷·별 하나, 사용자 결정). 개봉 지시 뒤 니코가 아무거나 열어 보라고 하고, 플레이어가 하나를 직접 고른다(사용자 결정: 결론은 플레이어가). 단서는 코코 m3의 상자 넷과 c-boxes의 다섯(추리 7), 엘라 e1의 very heavy, 테스 t4의 very light, 창고 구석의 저울, 니코가 힘겹게 밀던 상자와 그 자리만 눌린 짐칸. 장갑 상자는 Just mittens in this one. 뒤 다시 고른다.</td></tr>
<tr><td>점등식</td><td>결말을 트리 광장의 점등식으로 바꿨다(사용자 결정). 썰매 앞에서 별을 건넨 뒤 엘라가 트리 광장으로 부르고, 해가 진 광장에서 엘라가 셋을 세면 트리에 불이 켜지며 모두 Merry Christmas!라고 말한다. 니코는 경사가 데려가 점등식에 나오지 않는다(사용자 결정). 엔진에 반환 뒤 마무리 장면(같은 장소의 배경 전환)을 더한다. 새 그림: 해 진 트리 광장(불 꺼진·켜진 트리)과 모인 인물.</td></tr>
</tbody></table></div>
<p>그림·음성은 장면별 계획(새로 만들기·재사용, 크레딧)을 사용자와 정한 뒤 만든다: 새 인물 데이지·코코·니코와 니코의 심문 표정, 장소 4곳(창고 앞문·뒷문, 진행된 천막, 해 진 트리 광장의 점등식 포함), 증거 사진(테스의 별 장난감 뒷면 포함), 썰매의 똑같은 상자 다섯·저울에 상자를 올린 모습, 창고 구석의 양팔 저울과 새 창고 소품(전구 줄·화환), 저울 소지품 카드, 상자 속 별·별 뒷면, 축제장 지도, 새 인물과 탐정의 음성.</p>

<p>2026-11-09 Codex가 Claude Code에 개발 인계했다. Claude Code가 점검하고 사용자와 2차 수정을 합의해 이 설계서에 반영했다(§9 끝 "개발 점검·2차 수정"). 재미 보강(테스의 별 장난감·똑같은 상자 넷·점등식)도 사용자와 정해 반영했다. 다음은 그림·음성의 장면별 계획을 사용자와 정한 뒤 엔진 추가(조건으로 사라지고 나타나는 인물, 심문 멈춤·재개, 이동 없는 반환, 반환 뒤 마무리 장면)와 사건 데이터 개발이다. 분량 줄이기는 개발한 뒤 다시 본다. 이후 대본·설계서 수정은 Claude Code가 사용자와 한다.</p>

    state.page=Math.max(0,Math.min(page??remembered,pages().length-1));
    root.dataset.details='closed';state.zoom=false;
    render(mode==='script' && page!==undefined);if(updateURL)setHash(pages()[state.page].anchor,push);
  }
  function navigate(direction) {
    if(state.mode==='prep') {
      if(direction>0)select('script',0,0,true,true);
      return;
    }
    if(state.mode==='script') {
      const next=state.item+direction;
      if(next>=0 && next<scenes.length)select('script',next,0);
      return;
    }
    let page=state.page+direction,item=state.item;
    if(page<0) {if(item===0)return;item--;page=state.mode==='flow'?0:items()[item].pages.length-1;}
    else if(page>=pages().length) {if(item===items().length-1)return;item++;page=0;}
    select(state.mode,item,page);
  }
  function fillList() {
    const titles={script:'장면 선택',flow:'사건 흐름',prep:'예습 항목',reference:'점검 항목'};
    $('reader-list-title').textContent=titles[state.mode];
    $('reader-list').replaceChildren();$('reader-mobile-select').replaceChildren();
    items().forEach((item,index)=> {
      const label=state.mode==='script'?sceneLabels[index]:item.title;
      const b=node('button');b.type='button';b.dataset.item=String(index);
      b.append(node('span',String(index+1).padStart(2,'0'),'reader-item-number'),node('span',label,'reader-item-label'));
      b.setAttribute('aria-current',String(index===state.item));
      $('reader-list').append(b);
      const option=node('option',label);option.value=String(index);$('reader-mobile-select').append(option);
    });
    $('reader-mobile-select').value=String(state.item);
    $('reader-list').querySelector('[aria-current="true"]')?.scrollIntoView({block:'nearest'});
  }
  function panelHeading(textValue) {return node('h3',textValue);}
  function fillInspector() {
    const panel=$('reader-inspector-content');panel.replaceChildren();
    for(const b of root.querySelectorAll('[data-inspector]')) {
      const active=b.dataset.inspector===state.inspector;
      b.setAttribute('aria-selected',String(active));b.tabIndex=active?0:-1;
    }
    panel.setAttribute('aria-labelledby','reader-tab-'+state.inspector);
    if(state.mode!=='script')return;
    const scene=selected();
    if(state.inspector==='clues') {
      panel.append(panelHeading('이 장면의 단서와 흐름'));
      if(scene.summary)panel.append(clone(scene.summary));
      for(const photo of scene.photos) {
        const fold=node('details','','reader-evidence');
        fold.append(node('summary',text(photo.querySelector('.result-tag'))));
        const body=clone(photo);body.querySelector('.result-tag')?.remove();fold.append(body);panel.append(fold);
      }
    } else if(state.inspector==='learning') {
      panel.append(panelHeading('이 장면의 학습 설계'));
      let count=0;
      for(const page of scene.pages) {
        const found=page.nodes.flatMap(n=>[...n.querySelectorAll('details')]).filter(n=>text(n.querySelector('summary')).startsWith('학습 설계'));
        if(!found.length)continue;
        const group=node('div','','reader-inspector-group');group.append(node('h4',page.label));
        for(const detail of found)for(const child of unwrap(detail))group.append(clone(child));
        panel.append(group);count++;
      }
      if(!count)panel.append(node('p','이 장면은 대화와 행동을 확인하는 장면이야.'));
    } else {
      panel.append(panelHeading('이 장면의 제작 메모'));
      for(const page of scene.pages) {
        const found=page.nodes.flatMap(n=>[...n.querySelectorAll('details')]).filter(n=>text(n.querySelector('summary')).startsWith('제작 메모'));
        if(!found.length)continue;
        const group=node('div','','reader-inspector-group');group.append(node('h4',page.label));
        for(const detail of found)for(const child of unwrap(detail))group.append(clone(child));
        panel.append(group);
      }
      for(const detail of scene.memo)for(const child of unwrap(detail))panel.append(clone(child));
    }
    panel.scrollTop=0;
  }
  function fillFlow() {
    const canvas=$('reader-canvas');
    if(state.item===0) {
      const box=node('div','','reader-summary');
      const summary=clone(flowItems[0].node);summary.querySelector('.section-head')?.remove();
      summary.lastElementChild?.remove();
      box.append(...summary.children);
      const hero=source.querySelector('.hero');box.append(clone(hero.querySelector('.chips')));
      box.append(clone(hero.querySelector('.lead')),clone(hero.querySelector('figcaption')));
      const note=node('p','금으로 만든 별 하나 · 선물 상자는 숨기는 수단 · 현재 작업은 과거 알리바이가 아님.');box.append(note);
      const b=node('button','해결 흐름도 보기 →','reader-mini');b.type='button';b.dataset.flow='2';box.append(b);
      canvas.append(box);return;
    }
    const flow=node('div','','reader-flow');
    const toolbar=node('div','','reader-flow-toolbar');
    const b=node('button','확대해서 보기','reader-mini');b.type='button';b.dataset.zoom='toggle';b.setAttribute('aria-pressed','false');
    toolbar.append(b,node('span','카드 선택 → 해당 대본'));
    const paper=node('div','','reader-flow-paper');paper.append(clone(flowItems[state.item].node));flow.append(toolbar,paper);canvas.append(flow);
  }
  function render(focusDialogue=false) {
    const current=selected();
    for(const b of root.querySelectorAll('[data-mode]'))b.setAttribute('aria-pressed',String(b.dataset.mode===state.mode));
    $('reader-context').textContent=current.context;
    $('reader-title').textContent=state.mode==='script'?current.title.replace(/^장면 \d+ · /,'').replace(/^.* — /,''):current.title;
    $('reader-purpose').textContent=current.purpose;
    fillList();
    const stage=$('reader-stage');stage.classList.toggle('reader-wide',state.mode!=='script');
    $('reader-inspector').hidden=state.mode!=='script';
    $('reader-jump').hidden=state.mode==='flow'||state.mode==='prep';
    $('reader-jump').classList.toggle('reader-scene-tools',state.mode==='script');
    $('reader-jump').querySelector('label').hidden=state.mode!=='reference';
    $('reader-step').hidden=state.mode!=='reference';
    $('reader-step').replaceChildren();
    if(state.mode==='reference')for(const [index,p] of pages().entries()) {
      const option=node('option',String(index+1).padStart(2,'0')+' · '+p.label);option.value=String(index);$('reader-step').append(option);
    }
    if(state.mode==='reference')$('reader-step').value=String(state.page);
    $('reader-jump').querySelector('label').textContent=state.mode==='reference'?'항목 선택':'대화 선택';
    root.querySelector('[data-details-toggle]').hidden=state.mode!=='script';
    const canvas=$('reader-canvas');canvas.replaceChildren();
    if(state.mode==='flow')fillFlow();
    else {
      const page=node('div','',state.mode==='script'?'reader-page reader-transcript':'reader-reference');
      const groups=state.mode==='script'?selected().pages:[pages()[state.page]];
      for(const [index,group] of groups.entries()) {
        const block=node('div','',state.mode==='script'?'reader-dialogue-block':'reader-reference-block');
        if(state.mode==='script')block.dataset.dialogueIndex=String(index);
        for(const n of group.nodes) {
          if(n.matches('.plan-anchor'))continue;
          const c=clone(n);
          if(state.mode==='script')for(const detail of c.querySelectorAll('details')) {
            if(/^(학습 설계|제작 메모)/.test(text(detail.querySelector('summary'))))detail.remove();
          }
          block.append(c);
        }
        page.append(block);
      }
      canvas.append(page);
      if(state.mode==='script')highlightLearning(page);
    }
    const prev=$('reader-prev'),next=$('reader-next');
    prev.disabled=state.item===0 && (state.mode==='script'||state.page===0);
    next.disabled=state.mode!=='prep' && state.item===items().length-1 && (state.mode==='script'||state.page===pages().length-1);
    prev.textContent=state.mode==='script'?'← 이전 장면':'← 이전';
    next.textContent=state.mode==='prep'?'대본 보기 →':state.mode==='script'?'다음 장면 →':'다음 →';
    $('reader-position').textContent=state.mode==='flow'?(state.item+1)+' / '+items().length:
      state.mode==='script'?'장면 '+(state.item+1)+' / '+items().length:
      state.mode==='prep'?'예습':'항목 '+(state.page+1)+' / '+pages().length;
    fillInspector();
    canvas.scrollTop=state.mode==='script'?(sceneScroll.get(state.item)||0):0;
    if(state.mode==='script' && focusDialogue) {
      const target=canvas.querySelector('[data-dialogue-index="'+state.page+'"]');
      canvas.scrollTop=Math.max(0,(target?.offsetTop||0)-12);
    }
  }
  function restoreRoute() {
    let hash='';try{hash=decodeURIComponent(location.hash.slice(1));}catch{}
    const target=routes.get(hash) || (hash==='flow-truth'?{mode:'flow',item:1,page:0}:null);
    if(target)select(target.mode,target.item,target.page,false);
    else select('flow',0,0,false);
  }
  root.addEventListener('click',event=> {
    const button=event.target.closest('button');
    if(!button)return;
    if(button.dataset.mode) {
      const mode=button.dataset.mode;
      select(mode,mode===state.mode?state.item:lastItems[mode],undefined,true,true);
    } else if(button.dataset.item!==undefined)select(state.mode,Number(button.dataset.item),undefined,true,true);
    else if(button.dataset.page!==undefined)select('script',state.item,Number(button.dataset.page));
    else if(button.dataset.inspector) {state.inspector=button.dataset.inspector;fillInspector();}
    else if(button.hasAttribute('data-details-toggle'))root.dataset.details=root.dataset.details==='open'?'closed':'open';
    else if(button.dataset.flow)select('flow',Number(button.dataset.flow),0,true,true);
    else if(button.dataset.zoom) {
      state.zoom=!state.zoom;
      root.querySelector('.reader-flow').classList.toggle('is-zoomed',state.zoom);
      button.textContent=state.zoom?'전체 보기':'확대해서 보기';button.setAttribute('aria-pressed',String(state.zoom));
    }
  });
  document.addEventListener('click',event=> {
    const link=event.target.closest('a[href^="#"]');if(!link)return;
    const id=decodeURIComponent(link.getAttribute('href').slice(1)),target=routes.get(id);
    if(target){event.preventDefault();select(target.mode,target.item,target.page,true,true);}
  });
  $('reader-mobile-select').addEventListener('change',e=>select(state.mode,Number(e.target.value),undefined,true,true));
  $('reader-step').addEventListener('change',e=>select(state.mode,state.item,Number(e.target.value)));
  $('reader-prev').addEventListener('click',()=>navigate(-1));$('reader-next').addEventListener('click',()=>navigate(1));
  root.querySelector('[role="tablist"]').addEventListener('keydown',event=> {
    if(!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;
    const tabs=[...root.querySelectorAll('[data-inspector]')];let index=tabs.findIndex(b=>b.dataset.inspector===state.inspector);
    index=event.key==='Home'?0:event.key==='End'?tabs.length-1:(index+(event.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;
    event.preventDefault();event.stopPropagation();state.inspector=tabs[index].dataset.inspector;fillInspector();tabs[index].focus();
  });
  root.addEventListener('keydown',event=> {
    if(event.altKey||event.ctrlKey||event.metaKey||event.shiftKey||event.target.closest('select,input,textarea,summary'))return;
    if(event.key==='ArrowLeft'||event.key==='ArrowRight'){event.preventDefault();navigate(event.key==='ArrowLeft'?-1:1);}
  });
  addEventListener('hashchange',restoreRoute);addEventListener('popstate',restoreRoute);
  // Inspection hook for document verification; it does not change story or game data.
  window.christmasPlanningReader={
    snapshot:()=>({state:{...state},scenes:scenes.map(s=>({id:s.id,pages:s.pages.map(p=>p.anchor)})),routes:[...routes.keys()]}),
    select:(mode,item,page)=>select(mode,item,page),navigate
  };
  restoreRoute();
})();
</script></body></html>
