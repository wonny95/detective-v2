<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light"><title>사라진 크리스마스트리의 별 · 금으로 만든 별 절도안</title>
<!--
사건 상세 기획 공통 서식 v1 (사용자 결정)
1. 이 파일을 case-XX-사건이름.html로 복사한다. {{...}}와 샘플 항목을 사건 내용으로 교체한다.
2. case-plan-common 스타일 블록은 그대로 사용한다. 사건마다 색·글꼴·너비·카드·대본 서식을 다시 만들거나 뒤에서 덮어쓰지 않는다.
3. 문서 순서: 표지 → 장면별 스토리 → 현장 조사 → 배경·클릭 TTS → 한눈에 → 인물·장소 → 단서 비교 → 학습 → 제작 범위.
4. 대화는 turn / turn det, 질문·답·노트는 question-choice / note-task, 클릭 TTS도 turn det를 쓴다.
5. 인물·장소·질문 수에 맞춰 같은 카드를 반복한다. 그림과 사건에만 필요한 도해는 추가할 수 있으나 공통 서식을 바꾸지 않는다.
6. 사용자 요청으로 서식 자체를 바꿀 때만 이 템플릿과 미인계 사건의 동일 스타일 블록을 함께 갱신한다.
7. 인계된 사건은 직접 고치지 않고 STORY_LOG의 개발 요청에 대상 파일·동일 서식 적용 범위를 적는다.
-->
<style id="case-plan-common" data-version="1">
:root { --ink:#44362c; --muted:#786b5d; --paper:#fffaf0; --line:#dfd2bc; --honey:#f1ce75; --rose:#b65f79; --sage:#e5ede0; --green:#456f54; --shadow:0 12px 36px rgba(66,49,30,.09); }

    a { color:inherit; }
    .wrap { width:min(1120px,calc(100% - 36px)); margin:auto; }

    .back-mark { display:grid; place-items:center; width:32px; height:32px; border:2px solid var(--ink); border-radius:50%; background:var(--honey); line-height:1; }

    .nav::-webkit-scrollbar { display:none; }
    .nav a { padding:13px 0; text-decoration:none; }
    .nav a:hover,.back:hover,.text-link:hover { color:var(--rose); }
    main { padding:28px 0 80px; }
    section { scroll-margin-top:94px; margin-top:58px; }
    .hero { display:grid; grid-template-columns:minmax(0,1.6fr) minmax(240px,.7fr); gap:20px; margin-top:0; }
    .hero-copy,.hero-art,.panel,.story-card,.place-card,.person-card,.clue-card,.flow-card,.learning-card,.script-card,.end-card,.status-card { background:var(--paper); border:1.5px solid var(--line); border-radius:26px; box-shadow:var(--shadow); }
    .hero-copy { padding:40px 42px; background:radial-gradient(circle at 92% 10%,#faeab8 0 12%,transparent 12.5%),var(--paper); }

    .learning-card code { font-family:inherit; font-weight:800; color:#476b50; }

</div></main><template id="reader-source"><section class="hero"><div class="hero-copy"><span class="eyebrow">L1-05 · 10 B · 금으로 만든 별 절도안</span><h1>사라진 크리스마스트리의 별</h1><p class="lead">축제를 준비하는 여러 친구가 드나든 창고에서 금으로 만든 별이 사라졌다. 현재 작업에 관한 진술을 대조하고, 개봉 뒤 별 자체의 잎사귀 무늬와 보관함 출처를 확인한다.</p><div class="chips"><span class="chip">면담 15문항 · 37칸</span><span class="chip">필수 사진 6장 · 선택 3장 · 추리 7문항</span><span class="chip status">대본 사용자 검토 대기 · 개발 미인계</span></div></div><figure class="hero-art"><div class="plan-art-pending">속까지 꽉 찬, 금으로 만든 별<br>전구·전선·배터리 없음 · 그림 미제작</div><figcaption>엘라·벤·경사 재사용 / 홀리·메이·니코 신규</figcaption></figure></section><section class="story-card" id="case-summary"><div class="section-head"><h2>사건 한눈에</h2></div><div class="grid-3"><div class="object-card"><h3>의뢰</h3><p>창고에 보관한 금으로 만든 별이 사라져 엘라가 탐정에게 도움을 청한다.</p></div><div class="object-card"><h3>조사</h3><p>창고의 흔적과 친구들의 말을 모으고, 니코의 운반 설명을 벤의 진술과 대조한다.</p></div><div class="object-card"><h3>해결</h3><p>탐정이 상자를 열어 별을 확인하고, 출처·허락·목적을 들은 뒤 엘라에게 돌려준다.</p></div></div><p style="margin-top:14px">아래는 제작자용 기획서야. 장면별 대본은 펼쳐 두고, 학습 설계와 제작 메모는 필요할 때 열어 볼 수 있어.</p></section><section class="story-card" id="flow-overview"><div class="section-head"><h2>사건 흐름도</h2></div>
<span class="plan-anchor" id="event-flow"></span>

<p>사건의 진실과 플레이 순서를 나눈 제작자용 흐름도다. 창고를 살피고 두 바닥 사진의 자국을 대조한다. 썰매 앞에서 벤의 진술을 듣고 니코의 운반 설명을 대조한 뒤 탐정이 상자를 연다. 별 실물·잎사귀 무늬·출처 확인은 개봉 뒤다. 선물 상자 자체는 물증으로 쓰지 않는다.</p>
<h4>01 · 사건이 벌어진 과정</h4>
<p>제작자용 진실 · 탐정이 오기 전</p>

="137" text-anchor="middle" fill="#605347" font-size="16.5">창고의 별을 빈 선물 상자에 숨김</text><text x="500.0" y="164" text-anchor="middle" fill="#605347" font-size="16.5">닫힌 상자 밖으로는 보이지 않음</text></g><g data-flow-node="t3"><rect x="695" y="65" width="290" height="165" rx="12" fill="#e3ede2" stroke="#658868" stroke-opacity=".65" stroke-width="1.5"></rect><text x="840.0" y="102" text-anchor="middle" fill="#44362c" font-size="21" font-weight="700">아이들 선물로 위장</text><text x="840.0" y="137" text-anchor="middle" fill="#605347" font-size="16.5">선물 상자로 위장해 썰매로 옮김</text><text x="840.0" y="164" text-anchor="middle" fill="#605347" font-size="16.5">니코는 선물 운반·배송만 담당</text></g><g data-flow-node="t4"><rect x="1035" y="65" width="290" height="165" rx="12" fill="#e2edf4" stroke="#688da6" stroke-opacity=".65" stroke-width="1.5"></rect><text x="1180.0" y="102" text-anchor="middle" fill="#44362c" font-size="21" font-weight="700">엘라가 분실을 발견</text><text x="1180.0" y="137" text-anchor="middle" fill="#605347" font-size="16.5">창고 보관함에서 별의 분실 확인</text><text x="1180.0" y="164" text-anchor="middle" fill="#605347" font-size="16.5">엘라가 탐정에게 찾아 달라고 의뢰</text></g></svg></div><figcaption style="color:var(--muted);font-size:14px;margin-top:9px">사건 전말을 보여 주는 제작자용 흐름입니다.</figcaption></figure>

</section><section id="prep"><div class="object-grid"><article class="object-card"><h3>긍정 · be + -ing</h3><p>지금 하는 일을 말한다.</p><ul><li><strong>I&#x27;m reading a book.</strong><p>난 책을 읽고 있어.</p></li><li><strong>She&#x27;s washing a cup.</strong><p>그 애는 컵을 씻고 있어.</p></li><li><strong>They&#x27;re drawing maps.</strong><p>그 애들은 지도를 그리고 있어.</p></li></ul></article><article class="object-card"><h3>부정 · be not + -ing</h3><p>not을 놓치면 반대 행동으로 기록한다.</p><ul><li><strong>I&#x27;m not sleeping.</strong><p>난 자고 있지 않아.</p></li><li><strong>He isn&#x27;t cooking.</strong><p>그 애는 요리하고 있지 않아.</p></li><li><strong>We aren&#x27;t running.</strong><p>우리는 달리고 있지 않아.</p></li></ul></article><article class="object-card"><h3>확인 · be + 주어 + -ing?</h3><p>상대의 현재 행동을 확인한다. Are you로 물으면 자기 행동을 I am으로 답한다.</p><ul><li><strong>Are you reading?</strong><p>너 읽고 있어?</p></li><li><strong>Is she dancing?</strong><p>그 애는 춤추고 있어?</p></li><li><strong>Are they swimming?</strong><p>그 애들은 수영하고 있어?</p></li></ul></article><article class="object-card"><h3>행동·대상 질문 · What + be + 주어 + -ing?</h3><p>지금 하는 행동이나 포장하는 대상을 묻는다.</p><ul><li><strong>What are you reading?</strong><p>무엇을 읽고 있어?</p></li><li><strong>What is he drawing?</strong><p>그 애는 무엇을 그리고 있어?</p></li><li><strong>What are they carrying?</strong><p>그 애들은 무엇을 들고 있어?</p></li></ul></article></div></section><section class="storyboard-section" id="storyboard"><div class="section-head"><h2>장면별 대본</h2></div><nav class="scene-index" aria-label="장면 이동"><a href="#scene-0">준비</a><a href="#scene-1">엘라 의뢰</a><a href="#scene-2">창고·홀리</a><a href="#scene-3">메이</a><a href="#scene-4">벤 첫 방문</a><a href="#scene-5">니코</a><a href="#ben-recheck">썰매 앞 벤 확인</a><a href="#scene-6">추리</a><a href="#scene-7">개봉·별 조사</a><a href="#scene-8">출처·목적</a><a href="#scene-9">반환</a></nav><span id="plan-a"></span>
<article class="scene" id="scene-1"><div class="scene-head"><span class="scene-kicker">트리 광장 · 엘라 · 경사</span><h3>장면 1 · 트리 광장 — 경사의 의뢰와 엘라 면담</h3><p>지붕보다 훨씬 높은 크리스마스트리 아래에서 엘라와 경사를 만난다.</p></div><div class="scene-body"><aside class="object-card" data-character-poses="1"><h4>일러스트 연출</h4><p><strong>엘라 · </strong>광장 안내대에서 펼쳐진 축제 안내지를 접는 중이야. 안내지를 내려놓고 탐정을 바라봐.</p><p><strong>오소리 경사 · </strong>안내대 옆에서 신고를 적던 수첩을 덮어. 엘라 쪽을 손바닥으로 가리키며 탐정에게 안내해.</p></aside>

<div class="scene-next"><strong>얻은 정보</strong><p>진짜 금 · 뒷면 잎사귀 무늬 · 창고 선반 보관함</p><p style="margin-top:6px">다음 · 축제 창고로</p></div><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">제작 메모 · 장면 조건과 연출</summary><div style="display:grid;gap:12px;padding-top:14px"><p>엘라와 경사가 트리 광장에 함께 있다. 광장 중앙의 크리스마스트리는 주변 건물 지붕보다 훨씬 높고, 아래에 선 엘라와 경사가 작아 보인다. 광장 안에서는 아래쪽 가지가 배경을 넓게 채우고 꼭대기는 화면 위로 넘어간다. 경사가 먼저 별 분실 신고를 전하고 탐정에게 조사를 부탁한 뒤 엘라에게 안내한다. 엘라의 인사 뒤 첫 선택지는 e0 하나다. 탐정이 엘라에게 무슨 일이 있었는지 묻고 답을 기록하면 e1·e2가 열린다. e2 기록 뒤 탐정은 창고로 갈 수 있고, 경사는 축제장 주변을 살핀다.</p><ul><li>badger:hello · 경사 · 자동</li><li>badger:request · 경사 · 자동</li><li>ella:hello · 엘라 · 자동</li><li>badger:split-search · 경사 · 자동</li><li>det:storeroom-thought · 탐정 · 생각</li><li>move:storeroom · 이동 · 이동 버튼</li></ul></div></details></div></article>

        </svg><figcaption class="fine">촬영 구도 예시 · 창고 앞 바닥</figcaption></figure><p class="en" style="margin-top:10px;font-weight:750">There are long marks on the ground.</p><p class="ko">바닥에 긴 자국이 있어.</p><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">촬영·활용 메모</summary><div style="display:grid;gap:12px;padding-top:14px"><p>c-track-yard · e2 기록 뒤 창고 입구 바닥 조사</p><p>얇게 눈이 덮인 창고 앞 길을 넓게 찍는다. 평행한 자국 두 벌 중 한 벌은 트리 광장 입구 쪽으로 굽고, 다른 벌은 나무 표지 기둥을 지나 프레임 밖으로 이어진다. 광장 입구 뒤로 멀리서도 눈에 띄는 커다란 크리스마스트리의 전체 윤곽이 보인다. 트리는 두 자국과 나무 표지 기둥을 가리지 않는다. 자국에 도구명이나 정답 표시는 붙이지 않는다.</p><p>창고 앞에서 자국이 나뉘는 모습을 기록한다. 홀리의 손수레 운반 진술과 후속 사진을 대조한다.</p></div></details></aside><div class="turn det" data-line="det:ask-cart"><span class="who">탐정 · 선택 질문</span><p class="en">Did you move any decorations today?</p><p class="ko">오늘 장식품을 옮겼어?</p></div>

<div class="scene-next"><strong>얻은 정보</strong><p>빈 보관함과 바닥 사진 · 홀리의 손수레 진술 · 포장 천막 위치</p><p style="margin-top:6px">다음 · 포장 천막의 메이·벤에게</p></div><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">제작 메모 · 장면 조건과 연출</summary><div style="display:grid;gap:12px;padding-top:14px"><p>엘라 e2 기록으로 창고를 발견하고 직접 이동한다. 홀리는 문 앞 작업대에, 보관함은 안쪽 선반에 있다. 양의 이름은 자기소개 전에는 표시하지 않는다. 창고는 포장재·장식품을 함께 보관하는 정상 작업 공간이고, 누구나 드나들었다는 사실은 범행을 뜻하지 않는다.</p><p>홀리는 엘라와 함께 축제를 준비하는 성인 양이다. 장식을 정리하고 리본을 달지만 선물을 포장하거나 배송하지 않는다. 본인도 창고에 들어갔다고 답한다. 목격의 범위는 사람들의 출입까지이며 별을 가져가는 손동작·반출품·범행은 보지 못했다.</p><p>e2 기록 뒤 창고 선반의 빈 보관함을 c-case로 촬영할 수 있다. 홀리에게 묻기 전후 어느 쪽이든 가능하다. 관찰: <strong>An empty case on the storeroom shelf. / 창고 선반에 빈 보관함이 있어.</strong> 보관함 사진에 출입자·범인·사람의 목격담을 적지 않는다. 안쪽에서 공용 포장재 선반(c-supplies)과 문턱에서 본 선반의 시야(c-door-view)도 선택 촬영할 수 있다. 공용 포장재는 창고에 들어갈 일상적인 이유를, 문턱 사진은 홀리가 보지 못한 범위를 이해하는 데 쓴다. e2 기록 뒤 입구의 바닥도 c-track-yard로 촬영한다. 탐정은 바닥에 긴 자국이 보인다고만 말한다. 촬영 뒤 홀리에게 장식을 옮긴 적 있는지 묻는다. 홀리는 손수레로 트리 광장까지 옮겼다고 답한다. 이 문답은 받아쓰기 없이 기록한다. h3 기록으로 포장 천막을 발견한다.</p><ul><li>holly:hello · 홀리 · 자동</li><li>det:holly-intro · 탐정 · 자동</li><li>holly:ready · 홀리 · 자동</li><li>det:ask-cart · 탐정 · 선택 질문</li><li>holly:cart · 홀리 · 자동</li><li>det:gift-thought · 탐정 · 생각</li><li>move:gift · 이동 · 이동 버튼</li></ul></div></details></div></article>

n is still [wrapping his gifts].<em>벤은 자기 선물을 아직 포장하고 있어.</em></p><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">학습 설계 보기 · 보기·맞장구·힌트·근거</summary><div style="display:grid;gap:12px;padding-top:14px"><p>보기 · wrapping his gifts · delivering his gifts · loading the sleigh · opening the case · carrying Nico&#x27;s box · wrapping cookies</p><p>맞장구 · The wrapping is still in progress.</p><p>포장이 아직 진행 중이야.</p><p>힌트 · Listen to Ben by the sleigh.</p><p>썰매 앞에서 들은 벤의 대답을 들어 봐.</p><p>근거 · ben:b2 + c-books. 과거 알리바이가 아니라 현재 물건 상태를 확인</p></div></details></div><div class="question-choice" id="deduction-4" data-deduction="deduction:q4"><span class="choice-no">추리 4</span><p class="ask">Which gifts does the photo show on Ben&#x27;s table?</p><p class="translation">사진 속 벤의 작업대에는 어떤 선물이 있어?</p><p class="reply">The photo shows [all three book gifts].<em>사진에는 책 선물 세 개가 전부 보여.</em></p><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">학습 설계 보기 · 보기·맞장구·힌트·근거</summary><div style="display:grid;gap:12px;padding-top:14px"><p>보기 · all three book gifts · two book gifts · one book gift · the cookies · an empty box · the star</p><p>맞장구 · The list says three, and three are on the table.</p><p>준비표에 세 개라고 적혀 있고, 작업대에도 세 개가 있어.</p><p>힌트 · Compare the list with the gifts on the table.</p><p>배송 준비표에 적힌 수량과 작업대 위 선물을 비교해 봐.</p><p>근거 · c-books: 이번 배송 준비표의 수량 3과 사진에 보이는 책 선물 3개가 일치한다. 촬영 뒤 인계 여부는 ben:b2의 No와 They&#x27;re all here.로 확인한다.</p></div></details></div><div class="question-choice" id="deduction-5" data-deduction="deduction:q5"><span class="choice-no">추리 5</span><p class="ask">Does Nico&#x27;s account match Ben&#x27;s answer?</p><p class="translation">니코의 설명은 벤의 대답과 맞아?</p><p class="reply">The two accounts [do not match].<em>두 설명은 맞지 않아.</em></p><details style="padding:12px 0;border-top:1px dashed var(- 택지</strong><p>Check the explanation. / 설명 확인하기</p></div><div class="scene-next"><strong>얻은 정보</strong><p>두 사진의 자국 동선 · 운반 설명의 불일치 · 재확인 대상</p><p style="margin-top:6px">다음 · 니코의 설명 다시 확인</p></div><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">제작 메모 · 장면 조건과 연출</summary><div style="display:grid;gap:12px;padding-top:14px"><p>행동 선택지: <strong>Compare the clues. / 단서 비교하기</strong>. 전체 면담15개(벤 재확인 포함)와 개봉 전 필수 사진 c-case·c-books·c-track-yard·c-track-sleigh와 두 현장 답변(홀리 손수레·니코 썰매)이 모이면 추리를 연다. 창고 보조 사진과 쿠키 사진은 선택이다. 메이·벤 방문은 자유이며 메이의 남은 기록도 추리 직전에는 모아야 한다. 개수는 제작 조건이고 플레이 화면에는 표시하지 않는다.</p><p>7절의 7문항을 푼다. 자국 비교 문항에서는 두 사진에 공통으로 보이는 나무 기둥을 기준으로 어느 경로가 썰매 아래까지 이어지는지 플레이어가 직접 고른다. 홀리는 여러 사람의 창고 출입을 봤으므로 그 말만으로 특정하지 않는다. 니코의 운반 주장과 배송 준비표·책 선물 세 개가 담긴 사진 및 벤의 현장 답변을 대조해 설명을 다시 확인할 사람을 고른다. 아직 별을 찾았거나 범인을 확정했다고 말하지 않는다. 완료 뒤 <strong>Check the explanation. / 설명 확인하기</strong>를 선택하고 썰매 앞에 머문다.</p><ul><li>det:compare-thought · 탐정 · 생각</li></ul></div></details></div></article>

<aside class="object-card" data-evidence="c-mark"><span class="result-tag">필수 사진 · 별 뒷면</span><p class="en" style="margin-top:10px;font-weight:750">A small leaf pattern on the back of the star.</p><p class="ko">별 뒷면에 작은 잎사귀 모양이 있어.</p><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">촬영·활용 메모</summary><div style="display:grid;gap:12px;padding-top:14px"><p>c-mark · 개봉 후 c-open 촬영·뒷면 확인 선택지로 별을 가까이 조사</p><p>별 뒷면에 원래 새겨진 작은 잎사귀 음각 무늬를 알아볼 수 있게 촬영. 글자·주인 이름·기념 날짜·범인 표시는 없다. 앞서 엘라 e1이 설명한 같은 무늬. 추가 별 소품이나 별의 파손은 없음.</p><p>별 자체의 식별 특징을 엘라 e1 진술과 대조하는 물증. 일반적인 다섯 끝 모양보다 구체적인 확인이며 니코의 창고 보관함 출처 답변·무허락 인정·엘라의 최종 실물 확인과 함께 쓴다. 이 무늬만으로 범인을 확정하지 않음.</p></div></details></aside><div class="scene-next"><strong>얻은 정보</strong><p>상자 안 별 사진 · 뒷면 무늬 사진</p><p style="margin-top:6px">다음 · 경사의 발견 여부 질문</p></div><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">제작 메모 · 장면 조건과 연출</summary><div style="display:grid;gap:12px;padding-top:14px"><p>탐정은 썰매 앞에서 니코에게 운반 대상에 관한 설명을 다시 묻고 증거를 제시한다. 이때 경사는 축제장 주변을 확인 중이다.</p><p>썰매 앞에서 들은 벤 b2 진술을 바탕으로 증거를 고른다. 정답은 책 선물 세 개와 배송 준비표를 함께 찍은 c-books다. 탐정이 그 사진을 니코에게 직접 내밀면, 사진 속 세 개가 현재도 작업대에 있다는 점을 짚는 대사가 열린다. 사진이 보여 주는 것은 이번 배송분과 그 위치이며, 닫힌 상자의 내용물은 개봉 뒤 확인한다. 오답 반응: <strong>That doesn&#x27;t show what&#x27;s on Ben&#x27;s table. / 그건 벤 작업대에 뭐가 있는지 보여 주지 않아.</strong> 같은 단계에서 다시 고른다.</p><p>c-books 사진 제시 뒤 니코가 누구의 선물인지 답하지 못하면 썰매 위의 닫힌 상자를 조사할 수 있다. 플레이어가 상자 열기를 선택하면 탐정이 직접 열고 별이 처음 보인다. 이후 c-open을 촬영한다. 관찰: <strong>A star inside the box. / 상자 안에 별이 있어.</strong> 장식품은 옮기지 않는다는 n4 진술과 실제 장식품을 대조하되 금빛만으로 재질·마을 소유·범행을 확정하지 않는다.</p><p>별 전체를 촬영한 뒤 뒷면을 가까이 조사한다. 별은 조사하는 동안 상자에 둔다. 기존 확대 조사 동작으로 뒷면을 볼 수 있는지는 개발 점검 대상이며 미지원이면 엔진 추가 필요다.</p><p>뒷면의 작은 잎사귀 무늬를 c-mark로 직접 촬영한다. 관찰: <strong>A small leaf pattern on the back of the star. / 별 뒷면에 작은 잎사귀 모양이 있어.</strong> 엘라 e1의 설명과 대조하는 실물 특징이다. 문자로 주인을 써 주거나 범인 이름을 알려 주지 않는다. 한 장의 사진만으로 범행을 확정하지 않고 출처·허락·목적을 더 확인한다.</p><ul><li>present:c-books · 행동 · 증거 제시 선택지</li><li>det:open-q1 · 탐정 · 사진 제시 뒤 선택 대사</li><li>nico:open-a1 · 니코 · 자동</li><li>det:check-claim · 탐정 · 선택 질문</li><li>nico:pause · 연출 · 무음 연출</li><li>open:box · 행동 · 탐정 조사 행동</li><li>look:star-back · 행동 · 조사 행동</li></ul></div></details></div></article>

<span class="plan-anchor" id="cast"></span>
<p>경사의 조사 의뢰·엘라의 경위 설명 → 창고의 빈 보관함·홀리의 출입 목격 → 천막의 메이·벤 → 썰매의 니코 → 같은 자리에서 벤 확인 → 추리 → 니코에게 책 선물·준비표 사진 제시 → 니코의 버티기 → 탐정의 개봉 → 별 전체·잎사귀 무늬 확인 → 경사의 발견 여부 질문 → 출처·허락·목적 질문과 니코 인계 → 엘라 확인·보고·반환.</p>
<div class="matrix"><table><thead><tr><th>인물</th><th>신규/재사용</th><th>현재 위치</th><th>제작자용 역할·아는 범위</th></tr></thead><tbody>

<tr><td>홀리 · 양 · 성인</td><td>신규 제안</td><td>축제 창고 문 앞 작업대</td><td>엘라와 함께 축제 준비. 장식 정리·리본 달기. 본인과 메이·벤·니코의 창고 출입까지만 앎</td></tr>
<tr><td>메이 · 생쥐 · 성인</td><td>신규</td><td>포장 천막</td><td>쿠키 포장. 창고에 포장지를 가지러 간 정상 배경. 과거 알리바이로 자동 제외하지 않음</td></tr>
<tr><td>벤 · 비버 · 성인</td><td>소풍 인물 재사용</td><td>같은 천막의 작업대</td><td>빈 상자를 가지러 창고 사용. 이번 배송의 자기 선물 전부를 아직 작업대에서 포장</td></tr>
<tr><td>니코 · 펭귄 · 성인</td><td>신규</td><td>썰매 앞</td><td>선물 운반·배송만 담당. 운반용 상자를 가지러 창고에 드나들다 별을 숨김</td></tr>
<tr><td>오소리 경사</td><td>재사용</td><td>초반 트리 광장·후반 썰매 앞</td><td>엘라 신고 확인·주변 순찰·별 발견 확인·니코 인계</td></tr>

<p>인물6명·장소4곳이다. 면담은5명이며 초반과 후반에 등장하는 경사1명을 포함해 L1 인물 기본4–5명을1명 초과한다. 새 준비 담당자를 추가하라는 사용자 요청을 반영한 예외다. 면담15개·37칸은 유지해 언어량과 장소 난도를 함께 늘리지 않는다. 경사는 받아쓰기0개다. 재사용3명·신규3명, 탐정은 기존 다람쥐다.</p>
<p>창고 선반 안쪽은 문 앞 장식 더미 때문에 계속 보이지 않는다. 홀리는 출입은 봤지만 손에 든 것·별 반출은 못 봤다. 창고의 물건·방문자 이름은 자기소개·답변 기록·실제 증거 발견 범위에 맞춰 공개한다. 장식 정리는 선물을 포장하는 일과 다르며 현재 행동을 과거 무죄 근거로 쓰지 않는다.</p>

<p>새 의미 대조는 현재 작업이 진행 중인지·어떤 행동을 하는지다. 벤이 니코에게 건넸는지에 대한 직접 답변으로 인계 여부를 확인하고, still wrapping과 all로 현재 작업과 선물 전체 범위를 구분한다. 사진 c-books의 예정 수량과 작업대의 실제 세 개를 대조해 설명 확인 때 니코에게 내민다. 니코의 not moving decorations 진술은 개봉 뒤 실제 별 장식과 대조한다. 현재 행동을 과거 알리바이로 만들지 않는다. 홀리의 saw·went는 출입 목격의 짧은 배경 표현이며 별도 과거 시제 숙달 목표로 확대하지 않는다.</p>

<tr><td>홀리 h1 sorting decorations·helping Ella / h3 hanging ribbons·gift tent</td><td>장식 준비와 선물 포장을 구별. 새 인물도 창고 사용자임을 조사</td></tr>
<tr><td>홀리 h2 I saw May, Ben, and Nico go in. I went in, too.</td><td>여러 사람의 출입을 알지만 그중 누가 별을 가져갔는지는 모름</td></tr>
<tr><td>니코 n2 taking Ben&#x27;s gift / 벤 b2 No·still wrapping·all here</td><td>운반 대상 주장과 전부 여기에서 포장 중이라는 현재 사실을 대조</td></tr>
<tr><td>니코 n3 not opening / loading</td><td>상자를 여는지 싣는지 구별. 내용물은 알 수 없음</td></tr>
<tr><td>니코 n4 not moving decorations / loading gifts</td><td>선물만 나른다는 말과 개봉 뒤 실제 별 장식을 대조</td></tr>
<tr><td>엘라 e1 gold·leaf·back / e2 case·storeroom·shelf</td><td>별의 실물 식별·원래 보관 위치를 알게 됨</td></tr>
<tr><td>니코의 storeroom shelf / without asking / sell</td><td>무늬·빈 보관 위치와 함께 출처·허락·목적을 확인</td></tr>
</tbody></table></div>
<h3>열쇠 형태·실제 복습 발화·사건 밖 예문</h3>
<h4>긍정 · be + -ing</h4>
<p>지금 하는 일을 말한다.</p>
<p>실제 발화: <strong>I&#x27;m wrapping cookies. We&#x27;re all volunteers for the Christmas party.</strong> · mae:m1</p>
<div class="matrix"><table><thead><tr><th>사건 밖 예문</th><th>반말 해석</th></tr></thead><tbody>
<tr><td>I&#x27;m reading a book.</td><td>난 책을 읽고 있어.</td></tr>
<tr><td>She&#x27;s washing a cup.</td><td>그 애는 컵을 씻고 있어.</td></tr>
<tr><td>They&#x27;re drawing maps.</td><td>그 애들은 지도를 그리고 있어.</td></tr>
</tbody></table></div>
<h4>부정 · be not + -ing</h4>
<p>not을 놓치면 반대 행동으로 기록한다.</p>
<p>실제 발화: <strong>No, I&#x27;m not opening it. I&#x27;m loading it for delivery.</strong> · nico:n3</p>
<div class="matrix"><table><thead><tr><th>사건 밖 예문</th><th>반말 해석</th></tr></thead><tbody>
<tr><td>I&#x27;m not sleeping.</td><td>난 자고 있지 않아.</td></tr>
<tr><td>He isn&#x27;t cooking.</td><td>그 애는 요리하고 있지 않아.</td></tr>
<tr><td>We aren&#x27;t running.</td><td>우리는 달리고 있지 않아.</td></tr>
</tbody></table></div>
<h4>확인 · be + 주어 + -ing?</h4>
<p>상대의 현재 행동을 확인한다. Are you로 물으면 자기 행동을 I am으로 답한다.</p>
<p>실제 발화: <strong>Are you sorting decorations?</strong> · holly:h1 질문</p>
<div class="matrix"><table><thead><tr><th>사건 밖 예문</th><th>반말 해석</th></tr></thead><tbody>
<tr><td>Are you reading?</td><td>너 읽고 있어?</td></tr>
<tr><td>Is she dancing?</td><td>그 애는 춤추고 있어?</td></tr>
<tr><td>Are they swimming?</td><td>그 애들은 수영하고 있어?</td></tr>
</tbody></table></div>
<h4>행동·대상 질문 · What + be + 주어 + -ing?</h4>
<p>지금 하는 행동이나 포장하는 대상을 묻는다.</p>
<p>실제 발화: <strong>What are you carrying?</strong> · nico:n2 질문</p>
<div class="matrix"><table><thead><tr><th>사건 밖 예문</th><th>반말 해석</th></tr></thead><tbody>
<tr><td>What are you reading?</td><td>무엇을 읽고 있어?</td></tr>
<tr><td>What is he drawing?</td><td>그 애는 무엇을 그리고 있어?</td></tr>
<tr><td>What are they carrying?</td><td>그 애들은 무엇을 들고 있어?</td></tr>
</tbody></table></div>
<p>look for·give back·I don&#x27;t know.는 표현 목록이며 문법과 구분한다. 인물 이름은 복습 단어에 넣지 않는다. 노트는 들은 문장 그대로 인용하고 빈칸에 대명사를 바꾸지 않는다.</p>
<h3>복습 단어</h3>

<p>추가 제안 어휘는 빈칸 단어와 구분한다: volunteers / 자원봉사자들(mae:m1: We&#x27;re all volunteers for the Christmas party.), ribbons / 리본들(holly:h3: I&#x27;m hanging ribbons.), pattern / 무늬(ella:e1·c-mark), sell / 팔다(nico:motive: I want to sell it.).</p>
<p>해결 뒤 복습: <strong>Nico took the town&#x27;s gold star from the storeroom. He hid it in a gift box to sell it. The detective brought it back to Ella. / 니코가 창고에서 마을의 금으로 만든 별을 가져갔어. 팔려고 선물 상자에 숨겼어. 탐정이 엘라에게 돌려줬어.</strong> 범인 얼굴·인정 내용은 해결 뒤 복습에서만 요약한다.</p>
<h3>새 상황 확인·지연 복습</h3>
<ul>
<li>질문: <strong>Are you washing the cup? / 컵을 씻고 있어?</strong></li>
<li>대답: <strong>No, I&#x27;m not washing it. I&#x27;m drying it. / 아니, 씻는 게 아니야. 말리고 있어.</strong></li>
<li>확인: <strong>What is the speaker doing? / 말하는 사람은 무엇을 하고 있어?</strong></li>
<li>보기: drying the cup · washing the cup · painting the cup · filling the cup · buying the cup · dropping the cup.</li>
<li>정답: <strong>The speaker is drying the cup. / 말하는 사람은 컵을 말리고 있어.</strong></li>
<li>피드백: <strong>Listen for “not washing” and “drying.” / “not washing”과 “drying”을 들어 봐.</strong></li>
<li>다른 날 질문: <strong>Are you cutting the paper? / 종이를 자르고 있어?</strong></li>
<li>대답: <strong>No, I&#x27;m not cutting it. I&#x27;m folding it. / 아니, 자르는 게 아니야. 접고 있어.</strong></li>
<li>확인: <strong>What is the speaker doing? / 말하는 사람은 무엇을 하고 있어?</strong></li>
<li>보기: folding the paper · cutting the paper · drawing on the paper · gluing the paper · tearing the paper · carrying the paper.</li>
<li>정답: <strong>The speaker is folding the paper. / 말하는 사람은 종이를 접고 있어.</strong></li>
</ul>
<p>학생의 직접 표현은 새 그림을 보고 I&#x27;m …ing / I&#x27;m not …ing로 짧게 말하기다. 이 추가 활동의 실행·평가는 하지 않았다.</p>

<tr><td>추가 행동 선택 질문</td><td>별도 공개</td><td>책 조사 허락·손수레와 썰매 이동 확인·반출 허락 확인 등. 받아쓰기 질문은 아님</td></tr>

<p>긍정은 실제 답변의 현재진행형(벤의 still 포함), 부정은 not + -ing, 확인은 Are you + -ing, 행동 질문은 What are you + -ing를 센다. 명사 wrapping이나 missing 형용사, 보기·예습·힌트·나레이션·이동·추리 완성문장·복습·다시 듣기는 기본 횟수에서 제외한다. 열쇠 반복 횟수가 학습 효과 검증은 아니다.</p>

<p>기준 사건 수치는 인계 설계서를 읽어 센 문서 비교이며 실제 학생 난도·소요 시간 비교가 아니다. 인계 설계서는 수정하지 않는다.</p>
</div></details></section><section class="story-card" id="truth"><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">제작자용 진실·행동 이유</summary><div style="display:grid;gap:12px;padding-top:14px"><div class="callout"><strong>현재안: 금으로 만든 별 절도.</strong> 선물 상자는 숨기는 수단이다. 창고 목격·현재 작업 진술·별 실물의 특징을 함께 확인한다.</div><p><strong>L1-05 현재진행형 · 2단계 수정 대본 검토 대기 · 개발 미인계.</strong> <a href="case-10-christmas-star.html">장면별 기획</a></p><p>마을의 큰 크리스마스 축제를 위해 어른들이 아이들 선물을 자원해서 준비한다. 엘라는 축제를 안내하고, 새 인물 홀리는 창고와 장식을 정리한다. 메이는 쿠키, 벤은 책 선물을 포장하고 니코는 완성된 선물을 썰매에 나르고 배송하는 역할만 맡는다. 니코는 창고에 보관한 금으로 만든 별을 선물 상자 안에 완전히 숨겨 나른다. <strong>선물 상자 자체·상자의 출처·손잡이·종이 조각은 범행 물증으로 쓰지 않는다.</strong></p><p>별은 속까지 꽉 찬 실제 금으로 만든 장식 하나뿐이다. 밖으로 별 끝이나 금빛이 보이는 설정은 없다. 별 뒷면의 작은 잎사귀 음각 무늬가 실제 물건 확인에 쓰인다. 새 인물 이름·종(양 홀리)과 무늬·구체 대사는 기획자 제안이며 사용자 결정으로 적지 않는다. 새 인물·창고 보관·추가 근거를 넣는 방향은 사용자 승인 사항이다. 그림·음성 생성이나 게임 구현은 하지 않는다.</p><div class="section-head"><h2>1. 제작자용 진실·행동 이유</h2></div>
<ol>
<li>별은 마을이 해마다 쓰는 귀중품이며 창고 선반의 전용 보관함에 둔다. 뒷면에는 작은 잎사귀 무늬가 새겨져 있다. 몸체는 속까지 꽉 차 있고 전기 부품·빈 내부·연결 관은 없다. 순도·무게·크기·트리 고정 방식은 미정이다.</li>
<li>엘라는 설치 준비를 위해 보관함 잠금을 풀고 별을 확인한 뒤, 광장 입구의 어린 친구들을 안내하러 잠시 나간다. 평소에는 잠가 보관한다. 돌아와 별이 없어진 것을 알고 오소리 경사에게 알린다. 경사는 신고를 전하고 탐정에게 조사를 부탁한다. 탐정은 그 자리에 함께 있는 엘라에게 경위를 듣는다. 엘라는 조사 중 안내 자리에 남는다. 경사는 광장 쪽 이야기를 들은 뒤 축제장 주변을 확인한다. 후보를 직접 지목하지 않고 위치·특징만 답한다. 사전 별 사진은 없다.</li>
<li>홀리는 창고의 장식을 손수레로 트리 광장에 옮긴 뒤 문 앞 작업대에서 장식을 정리하고 리본을 단다. 손수레의 두 바퀴가 남긴 자국은 트리 광장 쪽으로 굽는다. 본인도 창고를 사용한다. 메이는 포장지를, 벤은 빈 선물 상자를 가지러 드나들고, 니코는 선물 운반에 쓸 상자를 가지러 들어온다. 홀리는 이 세 친구가 들어가는 것은 봤지만 선반 안쪽에서 무엇을 집었는지 계속 보지는 못했다. 출입 목격만으로 별을 가져간 사람을 알 수 없다.</li>
<li>니코는 준비 시간에 창고 앞에서 빈 운반 상자를 썰매에 싣고 천막 옆에 다시 세웠다. 나중에 창고에 걸어서 돌아간 니코는 열린 보관함에서 별을 가져와 준비용 선물 상자 안에 넣고 뚜껑을 닫는다. 다른 선물과 함께 나르려 하며, 무엇을 옮기는지 묻자 벤의 선물이라고 둘러댄다. 정상 역할은 선물 운반·썰매 배송이며 포장을 겸하지 않는다. 닫힌 선물 상자는 숨기는 수단일 뿐 창고 출처를 입증하는 증거가 아니다.</li>
<li>메이·벤은 천막에서 선물을 포장한다. 벤이 이번 배송을 위해 준비한 책 선물은 배송 준비표에 적힌 세 개 전부이며 모두 작업대에 남아 있다. 이미 니코에게 건넨 별도 물량은 없다. 니코는 아직 나머지 선물이 준비되지 않아 출발하지 않는다. 자동 도주·타이머는 없다.</li>
<li>탐정은 창고의 빈 보관함을 촬영하고 홀리에게 현재 작업과 출입을 묻는다. 여러 친구가 출입했으므로 그 말만으로 특정하지 않는다. 천막에서 실제 책 선물 상태를 본 뒤, 니코의 운반 주장을 듣고 썰매 앞에서 옆 천막 입구의 벤에게 바로 묻는다. 벤은 니코에게 선물을 건네지 않았고 전부 여기에서 아직 포장 중이라고 답한다.</li>
<li>니코는 장식품을 옮기지 않고 선물을 싣고 있다고도 말한다. 벤의 전체 선물 진술과 니코의 운반 설명이 맞지 않아 출처를 다시 묻는다. 탐정이 벤의 답변과 작업대 사진을 대조한 뒤 사진을 내밀면 니코는 그냥 선물이라고 버틴다. 누구의 선물인지 답하지 못하자 탐정은 썰매 위에 그대로 놓인 상자를 조사한다. 플레이어가 상자 열기를 선택해 탐정이 직접 연다.</li>
<li>개봉 뒤 처음으로 별을 발견한다. 선물만 나르고 장식품은 옮기지 않는다는 진술과 실제 장식품을 대조한다. 별의 뒷면을 조사·촬영해 엘라가 설명한 작은 잎사귀 무늬를 확인하고, 창고의 빈 보관함·니코의 출처 답변을 함께 본다. 별의 실물과 뒷면을 확인하면 축제장을 살피던 경사가 썰매 앞에 도착해 별을 찾았는지 묻는다. 탐정의 발견 보고 뒤 니코가 창고 선반의 보관함에서 허락 없이 가져왔고 팔려 했다고 인정한다. 경사가 니코를 인계받고 탐정은 별을 받아 엘라에게 확인·보고·반환한다.</li>
</ol>
<p>혼동 요소는 <strong>여러 봉사자가 같은 창고에 드나든 사실</strong>이다. 홀리도 출입했고 현재 장식을 정리하므로 후보에서 자동 제외하지 않는다. 현재 작업은 과거 알리바이가 아니다. 범행 물증은 별의 실물·뒷면 무늬·비어 있는 보관 위치다. 홀리와 벤·니코의 말은 진술로 기록한다. 박스 손잡이 조각·상자 모양·배송 라벨·동물 종·외형·색을 범인 증거로 쓰지 않는다.</p>
</div></details></section><section class="story-card" id="production"><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">그림·녹음·엔진 확인 사항</summary><div style="display:grid;gap:12px;padding-top:14px"><div class="section-head"><h2>9. 제작 범위·남은 확인</h2></div>
<span class="plan-anchor" id="approval"></span>
<p>같은 엔진·같은 화면의 질문과 받아쓰기·첫 질문 제한·행동 선택지·사진·확대 조사·증거 제시·추리·심문·소지품 받기/건네기를 쓴다. 사건 전용 화면·CSS·코드 구현 방식은 정하지 않는다.</p>
<div class="matrix"><table><thead><tr><th>장면</th><th>새 그림·녹음</th><th>재사용</th><th>동작·확인</th></tr></thead><tbody>
<tr><td>광장</td><td>겨울 광장·주변 지붕보다 훨씬 높은 대형 크리스마스트리·엘라 질문/답·보고 음성</td><td>엘라·경사·탐정 외형</td><td>의뢰와 반환에 같은 광장 배경을 쓴다. 가까이서는 트리 꼭대기가 화면 위로 잘리고, 창고 앞 사진에서는 멀리 있는 트리의 전체 윤곽이 보인다.</td></tr>
<tr><td>창고</td><td>홀리 전신·문 앞 장식 작업대·안쪽 선반·빈 보관함·공용 포장재 선반·시야를 가리는 장식 상자·바닥 자국·클릭 소품·목격/작업 음성</td><td>기존 대화·현장 촬영 화면</td><td>입구에서는 장식 상자 때문에 안쪽 손동작이 가려지고, 통로에 들어가면 보관함이 보이는 구도</td></tr>
<tr><td>포장 천막</td><td>메이 전신·쿠키/책 작업대·책 선물 세 개와 배송 준비표 사진·선택 쿠키 사진·질문 음성</td><td>벤 외형·질문/사진 화면</td><td>썰매 옆 천막 입구에 벤 작업대를 배치하고 책 선물을 첫 면담 때 촬영</td></tr>
<tr><td>썰매</td><td>니코 전신·썰매 짐칸과 바닥 자국·완전히 닫힌 상자/개봉 장면·별 뒷면 잎사귀 무늬·관련 음성</td><td>경사 외형·추리/심문/확대 UI</td><td>벤 현장 확인·자국 사진 대조·c-books 사진 제시·탐정의 직접 개봉·개봉 뒤 사진 2장·허락 뒤 별 받기</td></tr>
<tr><td>반환/복습</td><td>별 소지품·보고/확인/감사·복습 예문 음성</td><td>엘라·광장·복습 화면</td><td>최종 실물 확인·직접 건네기</td></tr>
</tbody></table></div>
<h3>인물 일러스트 · 작업 중과 대화 중</h3>
<p>인물마다 하던 일이 보이는 전신 작업 자세를 기본 원화로 잡는다. 몸과 손이 보이도록 작업대는 인물 옆에 비스듬히 둔다. 말을 걸면 그 자리에서 손을 멈추거나 시선을 드는 자세를 제안한다. 앉아서 일하던 메이는 앉은 채 답한다. 대화 전후 자세 전환 지원은 개발 점검 항목이며, 한 컷만 쓰는 경우에는 작업 자세에서 얼굴을 탐정 쪽으로 조금 열어 둔다. 몸짓과 소품은 현재 작업을 보여 주는 연출이고 범행이나 알리바이의 증거로 세지 않는다.</p>
<div class="matrix"><table><thead><tr><th>장면</th><th>인물</th><th>처음 보이는 자세</th><th>말을 걸거나 보고할 때</th></tr></thead><tbody>
<tr><td>1</td><td>엘라</td><td>광장 안내대에서 펼쳐진 축제 안내지를 접는 중이야.</td><td>안내지를 내려놓고 탐정을 바라봐.</td></tr>
<tr><td>1</td><td>오소리 경사</td><td>안내대 옆에서 신고를 적던 수첩을 덮어.</td><td>엘라 쪽을 손바닥으로 가리키며 탐정에게 안내해.</td></tr>
<tr><td>2</td><td>홀리</td><td>작업대 모서리에서 장식에 리본을 묶고 있어.</td><td>리본 끝을 내려놓고 같은 자리에서 고개를 들어.</td></tr>
<tr><td>3</td><td>메이</td><td>낮은 의자에 앉아 쿠키 선물의 포장지를 접고 있어.</td><td>포장지 위에서 손을 멈추고 앉은 채 탐정을 바라봐.</td></tr>
<tr><td>4</td><td>벤</td><td>천막 입구 작업대에서 책 한 권의 포장지를 눌러 접고 있어.</td><td>한 손으로 종이를 눌러 둔 채 고개를 들어. 썰매 앞에서 다시 말을 걸 때도 같은 자리에서 답해.</td></tr>
<tr><td>5</td><td>니코</td><td>썰매 짐칸에 몸을 살짝 숙이고 닫힌 선물 상자를 밀어 자리를 잡고 있어.</td><td>상자는 짐칸에 두고 고개를 들어. 포장하거나 뚜껑을 여는 손동작은 없어.</td></tr>
<tr><td>8</td><td>오소리 경사</td><td>썰매 곁에 도착해 탐정 쪽으로 몸을 돌려.</td><td>별을 찾았는지 묻고 탐정의 보고를 들어.</td></tr>
<tr><td>9</td><td>엘라</td><td>안내대에서 탐정이 보여 주는 별 쪽으로 몸을 조금 기울여.</td><td>뒷면을 살펴본 뒤 별을 받아.</td></tr>
</tbody></table></div>
<p>기존 동작 조합으로 설계하되 <strong>한 장소에서 다른 인물 기록 뒤 벤 질문 해금</strong>, <strong>추리 뒤 사진 추가·별 뒷면 확대·후속 심문 조건 갱신</strong>, <strong>경사의 첫 의뢰 동석 및 후반 조사 완료 뒤 합류</strong>는 실제 지원 미확인이며 미지원이면 엔진 추가 필요다. 그림·녹음 생성과 게임 실행은 하지 않았다.</p>
<p>사용자 결정: 니코는 선물 운반·썰매 배송만 담당, 새 준비 인물 추가, 별을 창고에 보관, 벤 진술 외의 근거 보강, 선물 상자 자체는 범행 물증으로 쓰지 않음, 속까지 꽉 찬 실제 금으로 만든 별 하나, 이전안 백업 삭제.</p>
<p>기획자 구체화: 성인 양 홀리, 문 앞 장식 작업대의 목격 범위, 별 뒷면 잎사귀 음각 무늬, 니코의 장식품 운반 부인과 실물 대조, 반복 질문을 줄여 면담15·37칸 유지, 필수 사진 6장·선택 3장과 창고 선택 음성 5개 구성이다. 이를 사용자 지정 세부사항으로 적지 않는다.</p>
<p>남은 검토: 창고 문 앞에서의 시야, 별 뒷면 무늬가 실제 그림에서 보이는지, 축제 선물의 구체 배송 목적지, 엔진의 썰매 앞 벤 호출·추리 뒤 탐정 개봉 지원이다.</p>
<p>검증 안 함: 실제 플레이·소요 시간·학습 효과·학생 청취·녹음 속도·실제 원화·엔진 실행. 문서의 문장 길이·원문 노트·보기·조건·대사·사진·흐름도는 대조하지만 사용자 승인 뒤 정식3단계 규칙별 점검을 대신하지 않는다.</p>

    $('reader-step').replaceChildren();
    if(state.mode==='reference')for(const [index,p] of pages().entries()) {
      const option=node('option',String(index+1).padStart(2,'0')+' · '+p.label);option.value=String(index);$('reader-step').append(option);
    }
    if(state.mode==='reference')$('reader-step').value=String(state.page);
    $('reader-jump').querySelector('label').textContent=state.mode==='reference'?'항목 선택':'대화 선택';
    root.querySelector('[data-details-toggle]').hidden=state.mode!=='script';
    const canvas=$('reader-canvas');canvas.replaceChildren();
    if(state.mode==='flow')fillFlow();
    else {
      const page=node('div','',state.mode==='script'?'reader-page reader-transcript':'reader-reference');
      const groups=state.mode==='script'?selected().pages:[pages()[state.page]];
      for(const [index,group] of groups.entries()) {
        const block=node('div','',state.mode==='script'?'reader-dialogue-block':'reader-reference-block');
        if(state.mode==='script')block.dataset.dialogueIndex=String(index);
        for(const n of group.nodes) {
          if(n.matches('.plan-anchor'))continue;
          const c=clone(n);
          if(state.mode==='script')for(const detail of c.querySelectorAll('details')) {
            if(/^(학습 설계|제작 메모)/.test(text(detail.querySelector('summary'))))detail.remove();
          }
          block.append(c);
        }
        page.append(block);
      }
      canvas.append(page);
      if(state.mode==='script')highlightLearning(page);
    }
    const prev=$('reader-prev'),next=$('reader-next');
    prev.disabled=state.item===0 && (state.mode==='script'||state.page===0);
    next.disabled=state.mode!=='prep' && state.item===items().length-1 && (state.mode==='script'||state.page===pages().length-1);
    prev.textContent=state.mode==='script'?'← 이전 장면':'← 이전';
    next.textContent=state.mode==='prep'?'대본 보기 →':state.mode==='script'?'다음 장면 →':'다음 →';
    $('reader-position').textContent=state.mode==='flow'?(state.item+1)+' / '+items().length:
      state.mode==='script'?'장면 '+(state.item+1)+' / '+items().length:
      state.mode==='prep'?'예습':'항목 '+(state.page+1)+' / '+pages().length;
    fillInspector();
    canvas.scrollTop=state.mode==='script'?(sceneScroll.get(state.item)||0):0;
    if(state.mode==='script' && focusDialogue) {
      const target=canvas.querySelector('[data-dialogue-index="'+state.page+'"]');
      canvas.scrollTop=Math.max(0,(target?.offsetTop||0)-12);
    }
  }
  function restoreRoute() {
    let hash='';try{hash=decodeURIComponent(location.hash.slice(1));}catch{}
    const target=routes.get(hash) || (hash==='flow-truth'?{mode:'flow',item:1,page:0}:null);
    if(target)select(target.mode,target.item,target.page,false);
    else select('flow',0,0,false);
  }
  root.addEventListener('click',event=> {
    const button=event.target.closest('button');
    if(!button)return;
    if(button.dataset.mode) {
      const mode=button.dataset.mode;
      select(mode,mode===state.mode?state.item:lastItems[mode],undefined,true,true);
    } else if(button.dataset.item!==undefined)select(state.mode,Number(button.dataset.item),undefined,true,true);
    else if(button.dataset.page!==undefined)select('script',state.item,Number(button.dataset.page));
    else if(button.dataset.inspector) {state.inspector=button.dataset.inspector;fillInspector();}
    else if(button.hasAttribute('data-details-toggle'))root.dataset.details=root.dataset.details==='open'?'closed':'open';
    else if(button.dataset.flow)select('flow',Number(button.dataset.flow),0,true,true);
    else if(button.dataset.zoom) {
      state.zoom=!state.zoom;
      root.querySelector('.reader-flow').classList.toggle('is-zoomed',state.zoom);
      button.textContent=state.zoom?'전체 보기':'확대해서 보기';button.setAttribute('aria-pressed',String(state.zoom));
    }
  });
  document.addEventListener('click',event=> {
    const link=event.target.closest('a[href^="#"]');if(!link)return;
    const id=decodeURIComponent(link.getAttribute('href').slice(1)),target=routes.get(id);
    if(target){event.preventDefault();select(target.mode,target.item,target.page,true,true);}
  });
  $('reader-mobile-select').addEventListener('change',e=>select(state.mode,Number(e.target.value),undefined,true,true));
  $('reader-step').addEventListener('change',e=>select(state.mode,state.item,Number(e.target.value)));
  $('reader-prev').addEventListener('click',()=>navigate(-1));$('reader-next').addEventListener('click',()=>navigate(1));
  root.querySelector('[role="tablist"]').addEventListener('keydown',event=> {
    if(!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;
    const tabs=[...root.querySelectorAll('[data-inspector]')];let index=tabs.findIndex(b=>b.dataset.inspector===state.inspector);
    index=event.key==='Home'?0:event.key==='End'?tabs.length-1:(index+(event.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;
    event.preventDefault();event.stopPropagation();state.inspector=tabs[index].dataset.inspector;fillInspector();tabs[index].focus();
  });
  root.addEventListener('keydown',event=> {
    if(event.altKey||event.ctrlKey||event.metaKey||event.shiftKey||event.target.closest('select,input,textarea,summary'))return;
    if(event.key==='ArrowLeft'||event.key==='ArrowRight'){event.preventDefault();navigate(event.key==='ArrowLeft'?-1:1);}
  });
  addEventListener('hashchange',restoreRoute);addEventListener('popstate',restoreRoute);
  // Inspection hook for document verification; it does not change story or game data.
  window.christmasPlanningReader={
    snapshot:()=>({state:{...state},scenes:scenes.map(s=>({id:s.id,pages:s.pages.map(p=>p.anchor)})),routes:[...routes.keys()]}),
    select:(mode,item,page)=>select(mode,item,page),navigate
  };
  restoreRoute();
})();
</script></body></html>
