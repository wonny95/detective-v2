<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light"><title>사라진 크리스마스트리의 별 · 금으로 만든 별 절도안</title>
<!--
사건 상세 기획 공통 서식 v1 (사용자 결정)
1. 이 파일을 case-XX-사건이름.html로 복사한다. {{...}}와 샘플 항목을 사건 내용으로 교체한다.
2. case-plan-common 스타일 블록은 그대로 사용한다. 사건마다 색·글꼴·너비·카드·대본 서식을 다시 만들거나 뒤에서 덮어쓰지 않는다.
3. 문서 순서: 표지 → 장면별 스토리 → 현장 조사 → 배경·클릭 TTS → 한눈에 → 인물·장소 → 단서 비교 → 학습 → 제작 범위.
4. 대화는 turn / turn det, 질문·답·노트는 question-choice / note-task, 클릭 TTS도 turn det를 쓴다.
5. 인물·장소·질문 수에 맞춰 같은 카드를 반복한다. 그림과 사건에만 필요한 도해는 추가할 수 있으나 공통 서식을 바꾸지 않는다.
6. 사용자 요청으로 서식 자체를 바꿀 때만 이 템플릿과 미인계 사건의 동일 스타일 블록을 함께 갱신한다.
7. 인계된 사건은 직접 고치지 않고 STORY_LOG의 개발 요청에 대상 파일·동일 서식 적용 범위를 적는다.
-->
<style id="case-plan-common" data-version="1">
:root { --ink:#44362c; --muted:#786b5d; --paper:#fffaf0; --line:#dfd2bc; --honey:#f1ce75; --rose:#b65f79; --sage:#e5ede0; --green:#456f54; --shadow:0 12px 36px rgba(66,49,30,.09); }

    a { color:inherit; }
    .wrap { width:min(1120px,calc(100% - 36px)); margin:auto; }

    .back-mark { display:grid; place-items:center; width:32px; height:32px; border:2px solid var(--ink); border-radius:50%; background:var(--honey); line-height:1; }

    .nav::-webkit-scrollbar { display:none; }
    .nav a { padding:13px 0; text-decoration:none; }
    .nav a:hover,.back:hover,.text-link:hover { color:var(--rose); }
    main { padding:28px 0 80px; }
    section { scroll-margin-top:94px; margin-top:58px; }
    .hero { display:grid; grid-template-columns:minmax(0,1.6fr) minmax(240px,.7fr); gap:20px; margin-top:0; }
    .hero-copy,.hero-art,.panel,.story-card,.place-card,.person-card,.clue-card,.flow-card,.learning-card,.script-card,.end-card,.status-card { background:var(--paper); border:1.5px solid var(--line); border-radius:26px; box-shadow:var(--shadow); }
    .hero-copy { padding:40px 42px; background:radial-gradient(circle at 92% 10%,#faeab8 0 12%,transparent 12.5%),var(--paper); }

    .learning-card code { font-family:inherit; font-weight:800; color:#476b50; }

</div></main><template id="reader-source"><section class="hero"><div class="hero-copy"><span class="eyebrow">L1-05 · 10 B · 금으로 만든 별 절도안</span><h1>사라진 크리스마스트리의 별</h1><p class="lead">축제를 준비하는 여러 친구가 드나든 창고에서 금으로 만든 별이 사라졌다. 현재 작업에 관한 진술을 대조하고, 개봉 뒤 별 자체의 잎사귀 무늬와 보관함 출처를 확인한다.</p><div class="chips"><span class="chip">면담 15문항 · 36칸</span><span class="chip">필수 사진 6장 · 선택 3장 · 추리 7문항</span><span class="chip status">대본 사용자 검토 대기 · 개발 미인계</span></div></div><figure class="hero-art"><div class="plan-art-pending">속까지 꽉 찬, 금으로 만든 별<br>전구·전선·배터리 없음 · 그림 미제작</div><figcaption>엘라·테스·경사 재사용 / 홀리·메이·니코 신규</figcaption></figure></section><section class="story-card" id="case-summary"><div class="section-head"><h2>사건 한눈에</h2></div><div class="grid-3"><div class="object-card"><h3>의뢰</h3><p>창고에 보관한 금으로 만든 별이 사라져 엘라가 탐정에게 도움을 청한다.</p></div><div class="object-card"><h3>조사</h3><p>창고의 흔적과 친구들의 말을 모으고, 니코의 운반 설명을 테스의 진술과 대조한다.</p></div><div class="object-card"><h3>해결</h3><p>탐정이 상자를 열어 별을 확인하고, 출처·허락·목적을 들은 뒤 엘라에게 돌려준다.</p></div></div><p style="margin-top:14px">아래는 제작자용 기획서야. 장면별 대본은 펼쳐 두고, 학습 설계와 제작 메모는 필요할 때 열어 볼 수 있어.</p></section><section class="story-card" id="flow-overview"><div class="section-head"><h2>사건 흐름도</h2></div>
<span class="plan-anchor" id="event-flow"></span>

<p>전반부 장면 1–5의 선택 소품 반응은 각 탐색 장면 안에서만 제공하며 흐름도의 다음 장면을 여는 조건이 아니다. 추리 이후에는 추가하지 않는다.</p>
<p>사건의 진실과 플레이 순서를 나눈 제작자용 흐름도다. 창고를 살피고 두 바닥 사진의 자국을 대조한다. 자국은 경로만 보여 주며 발생 시점이나 운전자를 입증하지 않는다. 상자 확인의 핵심 근거는 테스의 장난감 선물 전량과 니코의 주장이 맞지 않는 점이다. 썰매 자리에서 현재 작업대를 살핀다. 탐정은 니코의 주장에 테스의 진술과 선물 사진, 두 바닥 자국 사진을 제시한다. 순찰 중 경사가 도착한다. 니코가 개봉을 거부해도 경사가 엘라가 맡긴 축제 물품 확인을 지시하면 탐정이 상자를 연다. 별 실물·잎사귀 무늬·출처 확인은 개봉 뒤다. 선물 상자 자체는 물증으로 쓰지 않는다.</p>
<h4>01 · 사건이 벌어진 과정</h4>
<p>제작자용 진실 · 탐정이 오기 전</p>

 y="137" text-anchor="middle" fill="#605347" font-size="16.5">창고의 별을 빈 선물 상자에 숨김</text><text x="500.0" y="164" text-anchor="middle" fill="#605347" font-size="16.5">닫힌 상자 밖으로는 보이지 않음</text></g><g data-flow-node="t3"><rect x="695" y="65" width="290" height="165" rx="12" fill="#e3ede2" stroke="#658868" stroke-opacity=".65" stroke-width="1.5"></rect><text x="840.0" y="102" text-anchor="middle" fill="#44362c" font-size="21" font-weight="700">무거운 별을 썰매로 운반</text><text x="840.0" y="137" text-anchor="middle" fill="#605347" font-size="16.5">창고 문 앞 썰매에 상자를 실음</text><text x="840.0" y="164" text-anchor="middle" fill="#605347" font-size="16.5">포장 천막 옆으로 끌고 감</text></g><g data-flow-node="t4"><rect x="1035" y="65" width="290" height="165" rx="12" fill="#e2edf4" stroke="#688da6" stroke-opacity=".65" stroke-width="1.5"></rect><text x="1180.0" y="102" text-anchor="middle" fill="#44362c" font-size="21" font-weight="700">엘라가 분실 신고</text><text x="1180.0" y="137" text-anchor="middle" fill="#605347" font-size="16.5">돌아와 빈 보관함을 발견</text><text x="1180.0" y="164" text-anchor="middle" fill="#605347" font-size="16.5">경사에게 신고·탐정에게 경위 설명</text></g></svg></div><figcaption style="color:var(--muted);font-size:14px;margin-top:9px">사건 전말을 보여 주는 제작자용 흐름입니다.</figcaption></figure>

caption style="color:var(--muted);font-size:14px;margin-top:9px">창고의 질문·촬영과 메이·벤 방문 순서는 자유입니다. 기록은 추리 직전에 합류합니다. 쿠키 사진은 선택이며, 선물 상자 자체는 물증이 아닙니다. 카드를 누르면 같은 페이지의 대본으로 이동합니다.</figcaption></figure>

</section><section id="prep"><div class="object-grid"><article class="object-card"><h3>긍정 · be + -ing</h3><p>지금 하는 일을 말한다.</p><ul><li><strong>I&#x27;m reading a book.</strong><p>난 책을 읽고 있어.</p></li><li><strong>She&#x27;s washing a cup.</strong><p>그 애는 컵을 씻고 있어.</p></li><li><strong>They&#x27;re drawing maps.</strong><p>그 애들은 지도를 그리고 있어.</p></li></ul></article><article class="object-card"><h3>부정 · be not + -ing</h3><p>not을 놓치면 반대 행동으로 기록한다.</p><ul><li><strong>I&#x27;m not sleeping.</strong><p>난 자고 있지 않아.</p></li><li><strong>He isn&#x27;t cooking.</strong><p>그 애는 요리하고 있지 않아.</p></li><li><strong>We aren&#x27;t running.</strong><p>우리는 달리고 있지 않아.</p></li></ul></article><article class="object-card"><h3>확인 · be + 주어 + -ing?</h3><p>상대의 현재 행동을 확인한다. Are you로 물으면 자기 행동을 I am으로 답한다.</p><ul><li><strong>Are you reading?</strong><p>너 읽고 있어?</p></li><li><strong>Is she dancing?</strong><p>그 애는 춤추고 있어?</p></li><li><strong>Are they swimming?</strong><p>그 애들은 수영하고 있어?</p></li></ul></article><article class="object-card"><h3>행동·대상 질문 · What + be + 주어 + -ing?</h3><p>지금 하는 행동이나 포장하는 대상을 묻는다.</p><ul><li><strong>What are you reading?</strong><p>무엇을 읽고 있어?</p></li><li><strong>What is he drawing?</strong><p>그 애는 무엇을 그리고 있어?</p></li><li><strong>What are they carrying?</strong><p>그 애들은 무엇을 들고 있어?</p></li></ul></article></div></section><section class="storyboard-section" id="storyboard"><div class="section-head"><h2>장면별 대본</h2></div><nav class="scene-index" aria-label="장면 이동"><a href="#scene-0">준비</a><a href="#scene-1">엘라 의뢰</a><a href="#scene-2">창고·홀리</a><a href="#scene-3">메이</a><a href="#scene-4">테스</a><a href="#scene-5">니코</a><a href="#tess-table-observation">작업대 관찰</a><a href="#scene-6">추리</a><a href="#scene-7">심문</a><a href="#scene-8">자백</a><a href="#scene-9">반환</a></nav><span id="plan-a"></span>
<article class="scene" id="scene-1"><div class="scene-head"><span class="scene-kicker">트리 광장 · 엘라 · 경사</span><h3>장면 1 · 트리 광장 — 경사의 의뢰와 엘라 면담</h3><p>경사에게 안내대에서 신고가 들어왔다는 말을 듣고 직접 찾아가 엘라에게 말을 건다.</p></div><div class="scene-body"><aside class="object-card" data-character-poses="1"><h4>일러스트 연출</h4><p><strong>엘라 · </strong>광장 안내대에서 펼쳐진 축제 안내지를 접는 중이야. 안내지를 내려놓고 탐정을 바라봐.</p><p><strong>오소리 경사 · </strong>광장 입구에서 신고를 적던 수첩을 덮어. 탐정에게 조사 의뢰를 전하고 순찰하러 떠나.</p></aside>

<div class="turn" data-line="badger:hello"><span class="who">경사</span><p class="en">Detective, the town&#x27;s Christmas star is missing.</p><p class="ko">탐정, 마을의 크리스마스 별이 사라졌대.</p></div>
<div class="turn" data-line="badger:request"><span class="who">경사</span><p class="en">Can you look into it?</p><p class="ko">조사해 줄래?</p></div>
<div class="turn" data-line="badger:desk-lead"><span class="who">경사</span><p class="en">The report came from the information desk. Ask there for more details.</p><p class="ko">안내대에서 신고가 들어왔어. 자세한 이야기는 거기서 들어 봐.</p></div>
<div class="turn" data-line="badger:split-search"><span class="who">경사</span><p class="en">I&#x27;ll look around the festival.</p><p class="ko">난 축제장 주변을 확인할게.</p></div>
<div class="turn det" data-line="det:information-desk-thought"><span class="who">탐정 · 생각</span><p class="en">I&#x27;ll ask at the information desk.</p><p class="ko">안내대에서 물어봐야겠어.</p></div>
<div class="turn" data-line="move:information-desk"><span class="who">이동 · 이동 버튼</span><p class="en">Go to the information desk.</p><p class="ko">안내대로 가기</p></div>
<div class="turn det" data-line="det:ella-greeting"><span class="who">탐정 · 말 걸기 선택지</span><p class="en">Hi. I&#x27;m looking into the missing star.</p><p class="ko">안녕. 사라진 별에 대해 조사하고 있어.</p></div>
<div class="turn" data-line="ella:hello"><span class="who">엘라</span><p class="en">Hi, I&#x27;m Ella. I reported it.</p><p class="ko">안녕, 난 엘라야. 내가 신고했어.</p></div>

<div class="scene-next"><strong>얻은 정보</strong><p>진짜 금 · 뒷면 잎사귀 무늬 · 창고 선반 보관함</p><p style="margin-top:6px">다음 · 축제 창고로</p></div><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">제작 메모 · 장면 조건과 연출</summary><div style="display:grid;gap:12px;padding-top:14px"><p>경사는 트리 광장 입구에 있고 엘라는 같은 광장의 안내대에서 일한다. 광장 중앙의 크리스마스트리는 주변 건물 지붕보다 훨씬 높고, 아래에 선 엘라와 경사가 작아 보인다. 광장 안에서는 아래쪽 가지가 배경을 넓게 채우고 꼭대기는 화면 위로 넘어간다. 경사는 별 분실과 조사 의뢰를 전한 뒤, 안내대에서 신고가 들어왔으니 거기서 자세한 이야기를 들어 보라고 말한다. 그 말을 들으면 안내대 접근이 열린다. 경사는 순찰하러 가고 탐정은 안내대에서 물어보겠다고 생각한다. 플레이어가 안내대로 가기를 선택한 뒤 이름 없는 사슴에게 직접 말을 건다. 엘라가 자기소개하며 신고한 사람이라고 밝히면 첫 질문 e0만 열린다. 안내대는 같은 광장 안의 접근 지점이며 별도 장소를 추가하지 않는다. 경사는 신고 장소만 알려 준다. 엘라를 직접 소개하거나 함께 데려가는 장면은 없다. 탐정이 엘라에게 무슨 일이 있었는지 묻고 답을 기록하면 e1·e2가 열린다. e2 기록 뒤 탐정은 창고로 갈 수 있다. 경사는 이미 주변을 순찰 중이다.</p><p>탐정의 짧은 영어 반응. 누른 소품만 말하며 진행 필수 조건은 아니다.</p><ul><li>badger:hello · 경사 · 자동</li><li>badger:request · 경사 · 자동</li><li>badger:desk-lead · 경사 · 자동</li><li>badger:split-search · 경사 · 자동</li><li>det:information-desk-thought · 탐정 · 생각</li><li>move:information-desk · 이동 · 이동 버튼</li><li>det:ella-greeting · 탐정 · 말 걸기 선택지</li><li>ella:hello · 엘라 · 자동</li><li>ella:check-supplies · 엘라 · 자동</li><li>det:storeroom-thought · 탐정 · 생각</li><li>move:storeroom · 이동 · 이동 버튼</li></ul></div></details></div></article>

</g></svg><figcaption class="fine">촬영 구도 예시 · 작업하던 상자들과 오른쪽 클립보드</figcaption></figure><p class="en" style="margin-top:10px;font-weight:750">Some boxes are still open.</p><p class="ko">아직 열린 상자들이 있네.</p><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">촬영·활용 메모</summary><div style="display:grid;gap:12px;padding-top:14px"><p>c-toys · 테스 t1 기록 뒤 장난감을 보는 행동 선택지·테스 허락</p><p>작업대를 비스듬히 내려다보며 선물 상자 여섯 개와 배송 준비표를 한 프레임에 담는다. 포장을 마친 상자 두 개는 테스가 손을 뻗기 쉬운 옆쪽에 내려놓았고, 포장 중인 두 개는 작업대 가운데에 종이가 반쯤 접힌 채 놓여 있다. 포장 전 두 개는 가까운 빈 자리로 밀어 두어 안에 든 장난감이 보인다. 상자는 같은 줄에 맞추지 않고 간격과 각도를 달리한다. 서로 가려져 상자 수를 세기 어려워지지 않게 한다. 준비표는 작업대 오른쪽 클립보드에 살짝 비스듬히 놓고 짧은 연필을 곁에 둔다. 제목은 “Gifts for This Delivery”다. 전체 수량 “Toy gifts: 6” 아래에 Lumi, Tilly, Bo, Nori, Kit, Poppy를 한 명씩 적고, Lumi와 Tilly의 Packed 칸에만 체크한다. 한 명당 장난감 선물 한 상자다. 명단의 아이들은 이 장면에 등장하지 않는다. 장난감 자동차와 블록 등은 원화 제작 예시이며 종류·색으로 범인을 특정하지 않는다. 미리보기의 자동차 도형은 배치 설명용이며 실제 게임 원화가 아니다.</p><p>준비표에 있는 여섯 명과 첫 사진의 여섯 상자를 대조한다. 썰매 앞에서 현재 작업대의 여섯 상자와 테스의 포장 완료 후 수거 진술 t3를 함께 확인할 수 있다. 심문에서 테스의 진술을 고르면 이 사진을 함께 보여 준다.</p></div></details></aside><div class="turn det" data-line="det:sleigh-thought"><span class="who">탐정 · 생각</span><p class="en">Holly saw Nico go into the storeroom, too. I should talk to him.</p><p class="ko">홀리는 니코도 창고에 들어가는 걸 봤어. 니코한테도 물어봐야겠어.</p></div>
<div class="turn" data-line="move:sleigh"><span class="who">이동 · 이동 버튼</span><p class="en">Go to the Delivery Sleigh.</p><p class="ko">썰매 앞으로 가기</p></div>
<div class="scene-next"><strong>얻은 정보</strong><p>장난감 선물 여섯 개와 배송 준비표 사진 · 밖에서 기다리는 니코</p><p style="margin-top:6px">다음 · 썰매 앞으로</p></div><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">제작 메모 · 장면 조건과 연출</summary><div style="display:grid;gap:12px;padding-top:14px"><p>테스는 우산 사건에 등장한 거북이며 토이 네스트 장난감가게 사장이다. 이번 축제에서는 아이들을 위한 자원봉사자로 참여한다. 테스는 작업대에서 이번 배송분 장난감 선물의 포장을 하고 있다. 이미 포장을 끝낸 선물도 같은 작업대에 모아 둔다. 홀리 h2의 창고 출입 목격과 h3의 천막 위치를 모두 기록한 뒤 테스와 면담할 수 있다. 첫 인사 뒤 탐정은 큰 트리의 별이 창고에서 사라졌다고 설명한다. 테스가 별을 못 봤다고 답하면 탐정은 창고에 들어갔다는 말을 들었다며 그 이유를 묻는다. 빈 상자가 필요했다는 답을 듣고 무엇을 포장하는지 묻는다(t1). 앞선 두 문답은 받아쓰기 없이 듣고, t1을 기록하면 포장한 선물이 어디로 가는지 묻는 t3와 장난감 조사 선택지가 열린다. 테스의 작업대는 포장 천막 안에 있으며 썰매 쪽 열린 옆면 너머로 작업대가 보인다.</p><p>장난감을 보는 선택지는 받거나 건네는 행동 없이 촬영 허락만 구하는, 받아쓰기 없는 행동 선택지다. 허락 뒤 포장 완료 두 개, 포장 중 두 개, 포장 전 두 개와 이번 배송 수량이 적힌 준비표를 한 화면에 담아 c-toys로 촬영한다. 촬영 시점에는 예정된 장난감 선물 여섯 개가 전부 작업대에 있다. 포장 상태는 진행돼도 썰매 자리에서 보이는 작업대의 전체 수량은 여섯 개다. 홀리 h2의 창고 출입 목격이 니코에게 말을 걸 이유다. 테스 t3에서는 포장이 끝나면 니코가 선물을 가져갈 예정이며 지금은 밖에 있다는 말을 듣는다. 답을 기록하면 썰매 앞으로 갈 수 있다.</p><p>탐정의 짧은 영어 반응. 누른 소품만 말하며 진행 필수 조건은 아니다.</p><ul><li>tess:hello · 테스 · 자동</li><li>det:tess-intro · 탐정 · 자동</li><li>tess:ready · 테스 · 자동</li><li>det:tess-star · 탐정 · 선택 질문</li><li>tess:star · 테스 · 자동</li><li>det:tess-storeroom · 탐정 · 선택 질문</li><li>tess:storeroom · 테스 · 자동</li><li>det:toys-q · 탐정 · 행동 선택지</li><li>tess:toys-a · 테스 · 자동</li><li>det:sleigh-thought · 탐정 · 생각</li><li>move:sleigh · 이동 · 이동 버튼</li></ul></div></details></div></article>

        </svg><figcaption class="fine">촬영 구도 예시 · 나무 기둥 너머 바닥</figcaption></figure><p class="en" style="margin-top:10px;font-weight:750">More marks over here.</p><p class="ko">이쪽에도 자국이 있네.</p><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">촬영·활용 메모</summary><div style="display:grid;gap:12px;padding-top:14px"><p>c-track-sleigh · 테스 t3를 기록하고 썰매 앞에 도착한 뒤 바닥 조사</p><p>첫 사진과 같은 나무 표지 기둥, 기둥 옆 바닥, 정차한 썰매 밑부분을 한 프레임에 담는다. 기둥 옆 평행 자국 한 벌이 프레임 안에서 끊기지 않고 썰매 아래로 들어가는 모습이 보인다.</p><p>같은 기둥으로 첫 사진과 연결해 창고 앞에서 썰매 아래까지 이어진 경로를 확인한다. 심문에서 두 사진을 제시하지만 이동 시점이나 운전자를 입증하지 않는다. 상자 확인의 핵심 근거는 니코의 장난감 선물 주장과 테스의 진술·전량이 남은 작업대의 불일치다.</p></div></details></aside><div class="scene-next"><strong>얻은 정보</strong><p>테스의 장난감 선물이라는 주장 · 창고 방문 이유 · 썰매 이동 부인 · 나무 기둥 너머 바닥 사진</p><p style="margin-top:6px">다음 · 천막 쪽 작업대 관찰</p></div><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">제작 메모 · 장면 조건과 연출</summary><div style="display:grid;gap:12px;padding-top:14px"><p>니코는 썰매 짐칸 앞에서 몸을 살짝 숙여, 이미 짐칸에 올라간 닫힌 선물 상자를 손으로 밀어 자리를 잡는다. 움직임은 정지 일러스트의 자세로 보여 준다. 대화할 때 상자는 짐칸에 그대로 둔다. 상자의 외형·손잡이·출처·포장지는 물증이 아니다. 상자를 촬영하는 단서도 없다. 별·금빛·별 끝은 개봉 전에 전혀 보이지 않는다. n2의 loading은 이미 짐칸에 올린 상자의 자리를 잡는 작업까지 포함한다. 상자를 들고 썰매까지 걷는 장면이나 taking ... to the sleigh 대사는 쓰지 않는다. 후속 확인에서 that box는 조금 떨어진 같은 상자를 가리킨다. 니코의 대답은 문법적으로 맞아도 내용은 거짓일 수 있다.</p><p>니코는 처음 만났을 때 다른 봉사자처럼 평소 말투로 답한다. 탐정은 썰매 짐칸에서 일하던 모습을 보고 무엇을 하고 있는지 묻는다.</p><p>니코는 n2에서 테스의 장난감 선물 하나를 싣고 있다고 주장한다. 탐정은 홀리의 출입 목격을 짚고 과거에 창고로 간 이유를 별도 선택 질문으로 묻는다. 니코가 운반에 쓸 빈 상자가 필요했다고 답하면 n3에서 포장도 맡는지 확인한다. 니코는 포장은 메이와 테스가 한다며 부정하고 n4에서는 장식품을 나르지 않는다고 답한다. 아직 별이 든 사실은 알 수 없다. 열린 질문을 마치면 천막 쪽 작업대를 볼 수 있다. 탐정은 선물 포장이나 배송을 돕지 않는다.</p><p>니코의 열린 면담 뒤 썰매를 옮겼는지 묻는다. 받아쓰기 없이 답을 기록하고, 썰매 앞 바닥을 c-track-sleigh로 찍는다. 같은 나무 기둥이 보이도록 구도를 잡는다.</p><p>탐정의 짧은 영어 반응. 누른 소품만 말하며 진행 필수 조건은 아니다.</p><ul><li>nico:hello · 니코 <div class="scene-next"><strong>얻은 정보</strong><p>처음 찍은 사진과 지금 보이는 작업대</p><p style="margin-top:6px">다음 · 단서 비교하기</p></div><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">제작 메모 · 장면 조건과 연출</summary><div style="display:grid;gap:12px;padding-top:14px"><p>관찰 시작 음성: <strong>I can see Tess&#x27;s table. / 테스의 탁자가 보여.</strong> 테스 자기소개와 t3 기록, 니코 면담 뒤 작업대 살펴보기를 선택했을 때만 들린다. 수량·포장 상태의 비교 결과는 말하지 않는다.</p><p>이 관찰은 추리 전에 반드시 완료한다. 테스 t3·c-toys와 니코 면담이 끝나면 작업대를 살펴보는 선택지가 열린다. 선택하면 아래의 현재 작업대 구도를 보여 주고 관찰 완료를 기록한다. 완료 전에는 단서 비교하기가 열리지 않는다. 테스에게 다시 질문하거나 새 사진을 찍을 필요는 없다.</p><p>썰매 자리에서 천막의 열린 옆면 너머 테스의 작업대를 볼 수 있다. 카메라 구도 예시에서는 포장 완료 4개, 포장 중 1개, 포장 전 1개가 보이며 클립보드에도 네 개가 체크되어 있다. 증거 노트의 c-toys는 첫 방문 때 찍은 사진이다. 관찰 장면에서는 상자 수를 대사나 정답 문구로 알려 주지 않는다. 플레이어가 현재 보이는 상자와 처음 기록한 배송 준비표, 테스의 포장 완료 후 수거 설명을 대조한다.</p><ul><li>look:current-table · 행동 · 필수 관찰 선택지</li><li>det:current-table-observation · 탐정 · 관찰 음성</li></ul></div></details></div></article>
<article class="scene" id="scene-6"><div class="scene-head"><span class="scene-kicker">썰매 앞 · 탐정</span><h3>장면 6 · 추리 — 누구에게 재확인할까</h3><p>사진과 진술을 비교해 다시 물어볼 사람을 고른다.</p></div><div class="scene-body"><div class="turn det" data-line="det:compare-thought"><span class="who">탐정 · 생각</span><p class="en">I should compare the notes and the photos.</p><p class="ko">기록과 사진을 비교해 봐야겠어.</p></div><div class="scene-next"><strong>행동 선택지</strong><p>Compare the clues. / 단서 비교하기</p></div>



<div class="question-choice" id="deduction-1" data-deduction="deduction:q1"><span class="choice-no">추리 1</span><p class="ask">What do the storeroom visits tell us?</p><p class="translation">창고 출입 목격으로 무엇을 알 수 있어?</p><p class="reply">Holly saw [several friends] go into the storeroom.<em>홀리는 여러 친구가 창고에 들어가는 걸 봤어.</em></p><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">학습 설계 보기 · 보기·맞장구·힌트·근거</summary><div style="display:grid;gap:12px;padding-top:14px"><p>보기 · several friends · only Nico · only May · only Tess · only Ella · no one</p><p>맞장구 · We still need to check the other information.</p><p>다른 정보도 확인해야 해.</p><p>힌트 · Listen to Holly&#x27;s answer about the visitors.</p><p>홀리의 창고 방문자 대답을 들어 봐.</p><p>근거 · holly:h2. 메이·테스·니코 및 본인의 출입만 알며 누가 별을 가져갔는지는 모름</p></div></details></div><div class="question-choice" id="deduction-2" data-deduction="deduction:q2"><span class="choice-no">추리 2</span><p class="ask">What does Nico say he is loading?</p><p class="translation">니코는 무엇을 싣고 있다고 말해?</p><p class="reply">Nico says he is loading [one of Tess&#x27;s toy gifts].<em>니코는 테스의 장난감 선물 하나를 싣고 있다고 말해.</em></p><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">학습 설계 보기 · 보기·맞장구·힌트·근거</summary><div style="display:grid;gap:12px;padding-top:14px"><p>보기 · one of Tess&#x27;s toy gifts · one of May&#x27;s cookie gifts · Ella&#x27;s empty case · his own clothes · a ribbon basket · an empty box</p><p>맞장구 · That&#x27;s his explanation of the box.</p><p>그 상자에 대한 니코의 설명이야.</p><p>힌트 · Listen to Nico&#x27;s answer about what he is loading.</p><p>무엇을 싣는지에 대한 니코의 대답을 들어 봐.</p><p>근거 · nico:n2. 주장으로 기록하며 실제 주인으로 확정하지 않음</p></div></details></div><div class="question-choice" id="deduction-3" data-deduction="deduction:q3"><span class="choice-no">추리 3</span><p class="ask">What is Tess still doing?</p><p class="translation">테스는 아직 무엇을 하고 있어?</p><p class="reply">Tess is still [wrapping her gifts].<em>테스는 자기 선물을 아직 포장하고 있어.</em></p><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">학습 설계 보기 · 보기·맞장구·힌트·근거</summary><div style="display:grid;gap:12px;padding-top:14px"><p>보기 · wrapping her gifts · delivering her gifts · loading the sleigh · opening the case · carrying Nico&#x27;s box · wrapping cookies</p><p>맞장구 · The wrapping is still in progress.</p><p>포장이 아직 진행 중이야.</p><p>힌트 · Listen to Tess&#x27;s answer about where the gifts go.</p><p>포장이 끝난 선물이 어디로 가는지에 대한 테스의 대답을 다시 들어 봐.</p><p>근거 · tess:t3 + 천막 쪽 작업대 관찰. 아직 포장 중인 선물이 보인다.</p></div></details></div><div class="question-choice" id="deduction-4" data-deduction="deduction:q4"><span class="choice-no">추리 4</span><p class="ask">Which gifts does the photo show on Tess&#x27;s table?</p><p class="translation">사진 속 테스의 작업대에는 어떤 선물이 있어?</p><p class="reply">The photo shows [all six toy gifts].<em>사진에는 장난감 선물 여섯 개가 전부 보여.</em></p><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">학습 설계 보기 · 보기·맞장구·힌트·근거</summary><div style="display:grid;gap:12px;padding-top:14px"><p>보기 · all six toy gifts · four toy gifts · two toy gifts · the cookies · an empty box · the star</p><p>맞장구 · The list says six, and six are on the table.</p><p>준비표에 여섯 개라고 적혀 있고, 작업대에도 여섯 개가 있어.</p><p>힌트 · Compare the list with the gifts on the table.</p><p>배송 준비표에 적힌 수량과 작업대 위 선물을 비교해 봐.</p><p>근거 · c-toys의 배송 준비표에 여섯 명이 있고 첫 사진에 상자가 여섯 개다. 포장이 진행된 현재 작업대에서도 여섯 개가 모두 보인다.</p></div></details></div><div class="question-choice" id="deduction-5" data-deduction="deduction:q5"><span class="choice-no">추리 5</span><p class="ask">Does Nico&#x27;s account match Tess&#x27;s answer?</p><p class="translation">니코의 설명은 테스의 대답과 맞아?</p><p class="reply">The two accounts [do not match].<em>두 설명은 맞지 않아.</em></p><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">학습 설계 보기 · 보기·맞장구·힌트·근거</summary><div style="display:grid;gap:12px;padding-top:14px"><p>보기 · do not match · mention only cookies · name Holly as the thief · prove the star is in the box · say Tess is loading gifts · say the star is back</p><p>맞장구 · We need a clearer explanation.</p><p>더 분명한 설명이 필요해.</p><p>힌트 · Compare what Nico says with how Tess sends out her gifts and what is still on the table.</p><p>니코의 말과 테스가 선물을 보내는 방식, 작업대에 남은 상자를 대조해 봐.</p><p>근거 · nico:n2 + tess:t3 + c-toys + 썰매 앞에서 보이는 현재 작업대. 테스의 선물은 포장이 끝난 뒤 나가는데, 포장 중인 상자가 있고 여섯 개 모두 아직 작업대에 있다.</p></div></details></div><div class="question-choice" id="deduction-6" data-deduction="deduction:tracks"><span class="choice-no">추리 6</span><p class="ask">Which marks continue under the sleigh?</p><p class="translation">어느 자국이 썰매 아래까지 이어져?</p><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px"><figure style="margin:12px 0 4px" data-track-frame="c-track-yard"><svg viewbox="0 0 480 215" style="width:100%;height:auto;display:block;border-radius:8px" role="img" aria-label="창고 앞 눈 위에 자국 두 벌이 보인다. 한 벌은 큰 크리스마스트리가 보이는 트리 광장 입구 쪽으로 굽고, 한 벌은 나무 표지 기둥을 지난다.">

        </svg><figcaption class="fine">촬영 구도 예시 · 나무 기둥 너머 바닥</figcaption></figure></div><p class="reply">[The marks by the wooden post] continue under the sleigh.<em>나무 기둥 옆을 지나는 자국이 썰매 아래까지 이어져.</em></p><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">학습 설계 보기 · 보기·맞장구·힌트·근거</summary><div style="display:grid;gap:12px;padding-top:14px"><p>보기 · The marks by the wooden post · The marks toward the Tree Square · Both sets of marks · The marks ending at the storeroom door · The marks stopping at the wooden post · Neither set of marks</p><p>맞장구 · Look at where the marks go.</p><p>자국이 어디로 이어지는지 봐.</p><p>힌트 · Find the same wooden post in both photos and follow the marks from there.</p><p>두 사진에서 같은 나무 기둥을 찾고 그 자리에서 자국을 따라가 봐.</p><p>근거 · c-track-yard + c-track-sleigh, holly:cart, nico:sleigh-stayed. 공통 기둥으로 두 구간을 잇는다. 광장 쪽 경로는 홀리의 손수레 진술과 맞는다. 썰매 아래까지 이어지는 다른 경로는 창고와 썰매의 연결을 살피는 보조 근거다. 이동 시점·운전자·별 반출은 증명하지 않으며 아침 내내 제자리였다는 말을 반박한 것으로 채점하지 않는다.</p></div></details></div><div class="question-choice" id="deduction-7" data-deduction="deduction:q6"><span class="choice-no">추리 7</span><p class="ask">Who should we ask about the box?</p><p class="translation">누구에게 그 상자에 관해 다시 물어봐야 할까?</p><p class="reply">We should ask [Nico] about the box.<em>니코에게 그 상자에 관해 다시 물어봐야 해.</em></p><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">학습 설계 보기 · 보기·맞장구·힌트·근거</summary><div style="display:grid;gap:12px;padding-top:14px"><p>보기 · May · Tess · Nico · Holly</p><p>맞장구 · Let&#x27;s check Nico&#x27;s explanation.</p><p>니코의 설명을 확인하자.</p><p>힌트 · Compare Nico&#x27;s loading answer with Tess&#x27;s answer and the gifts that are still being wrapped.</p><p>니코가 싣는다는 물건과 테스의 대답, 포장이 덜 끝난 장난감들을 비교해 봐.</p><p>근거 · nico:n2·n4·tess:t3와 현재 작업대·c-toys·holly:h2. 창고 출입만으로 특정하지 않고 현재 운반 대상 설명을 대조. 별 식별·출처 확인은 개봉 후 진행</p></div></details></div><div class="scene-next"><strong>행동 선택지</strong><p>Check the explanation. / 설명 확인하기</p></div><div class="scene-next"><strong>얻은 정보</strong><p>두 사진의 자국 동선 · 운반 설명의 불일치 · 재확인 대상</p><p style="margin-top:6px">다음 · 니코의 설명 다시 확인</p></div><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">제작 메모 · 장면 조건과 연출</summary><div style="display:grid;gap:12px;padding-top:14px"><p>행동 선택지: <strong>Compare the clues. / 단서 비교하기</strong>. 전체 면담 15개와 개봉 전 필수 사진 c-case·c-toys·c-track-yard·c-track-sleigh와 두 현장 답변(홀리 손수레·니코 썰매), 현재 작업대 관찰 완료가 모두 갖춰지면 추리를 연다. 창고 보조 사진과 쿠키 사진은 선택이다. 메이·테스 방문은 자유이며 메이의 남은 기록도 추리 직전에는 모아야 한다. 개수는 제작 조건이고 플레이 화면에는 표시하지 않는다.</p><p>7절의 7문항을 푼다. 자국 비교 문항에서는 두 사진에 공통으로 보이는 나무 기둥을 기준으로 어느 경로가 썰매 아래까지 이어지는지 플레이어가 직접 고른다. 홀리는 여러 사람의 창고 출입을 봤으므로 그 말만으로 특정하지 않는다. 니코의 운반 주장과 배송 준비표·장난감 선물 여섯 개가 담긴 사진 및 테스의 현장 답변을 대조해 설명을 다시 확인할 사람을 고른다. 아직 별을 찾았거나 범인을 확정했다고 말하지 않는다. 현재 작업대 관찰을 완료해야 시작할 수 있다. 완료 뒤 <strong>Check the explanation. / 설명 확인하기</strong>를 선택하고 썰매 앞에 머문다.</p><ul><li>det:compare-thought · 탐정 · 생각</li></ul></div></details></div></article>
<article class="scene" id="scene-7"><div class="scene-head"><span class="scene-kicker">썰매 앞 · 탐정 · 니코 · 경사</span><h3>장면 7 · 상자 개봉·심문</h3><p>장난감 선물 주장은 진술·전량과 대조하고 자국은 경로 확인에 쓴다. 이동 시점은 단정하지 않는다. 상자를 연 뒤 뒷면 사진을 내밀어 마지막 주장에 반박한다.</p></div><div class="scene-body"><aside class="object-card" data-character-poses="7"><h4>일러스트 연출</h4><p><strong>오소리 경사 · </strong>순찰 중 썰매 곁에 도착해. 별을 찾았는지 묻고 탐정이 보여 주는 사진을 살펴봐.</p></aside>

<div class="scene-next"><strong>얻은 정보</strong><p>상자 안 별 사진 · 뒷면 무늬 사진 · 엘라의 진술과 일치</p><p style="margin-top:6px">다음 · 니코의 자백</p></div><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">제작 메모 · 장면 조건과 연출</summary><div style="display:grid;gap:12px;padding-top:14px"><p>대질은 도서관 사건처럼 니코가 먼저 주장하고 플레이어가 증거를 고르는 방식이다. 니코의 주장 아래에는 증거 내밀기만 열리며, 질문 선택지나 받아쓰기는 없다. 탐정의 짧은 선택 대사로 설명의 불일치를 짚으면 니코가 첫 주장을 한다. 경사는 축제장 주변을 확인 중이다.</p><p>첫 주장은 빈 상자의 출처가 아니라 테스가 포장한 장난감 선물을 받았다는 주장이다. 대응하는 정답은 진술 탭의 테스 t3다. 그 진술을 내밀면 작업대와 준비표를 찍은 c-toys를 함께 보여 준다. 탐정은 테스의 선물은 포장이 끝난 뒤 나가는데, 현재도 여섯 개가 작업대에 남아 있다는 점을 짚는다. 촬영 당시 수량은 준비표 사진으로, 현재 남은 수량은 천막 쪽을 보고 판단한다. 오답 반응: <strong>That doesn&#x27;t show Tess&#x27;s toy gifts. / 그건 테스의 장난감 선물을 보여 주지 않잖아.</strong> 같은 주장에 머물며 다시 고른다.</p><p>두 번째 주장에 대응하려면 사진 탭에서 썰매 앞 바닥(c-track-sleigh)을 고른다. 같은 기둥이 보이는 창고 앞 사진(c-track-yard)도 함께 제시한다. 두 사진은 창고 앞에서 현재 썰매 아래까지 이어지는 자국을 보여 준다. 사진에 시각이나 자국을 남긴 사람이 나오지 않으므로, 이 단계는 창고와 썰매의 연결을 확인하는 보조 조사다. 정답 선택은 두 사진의 경로를 연결했다는 뜻이며 니코의 시간 진술을 반박했다는 뜻이 아니다. 탐정도 시점은 모른다고 말한 뒤 해결되지 않은 장난감 선물 주장의 모순으로 돌아온다. 오답 반응: <strong>That doesn&#x27;t show the ground by the sleigh. / 그 사진에는 썰매 옆 바닥이 안 보여.</strong> 같은 주장에 머물며 다시 고른다.</p><p>니코가 자국의 시각을 모르며 창고에서는 빈 상자만 챙겼다고 버티면 순찰 중인 경사가 도착한다. 경사는 탐정에게 별을 찾았는지 묻고, 탐정은 테스의 장난감 선물 진술과 전량이 남은 작업대를 근거로 보고한다. 자국 사진은 경로만 보이는 보조 자료로 함께 보여 준다. 경사는 장난감 선물이라는 설명이 맞지 않아 내용물을 확인해야 한다고 말한다. 니코는 축제 선물이라며 개봉에 반대한다. 경사는 탐정에게 엘라의 물품 확인 요청도 전해 듣고 그 확인의 일부로 이 상자를 열어 보라고 탐정에게 지시하고 썰매 곁에서 지켜본다.</p><p>경사가 현장 확인을 지시한 뒤 썰매 위의 닫힌 상자를 조사할 수 있다. 플레이어가 상자 열기를 선택하면 탐정이 직접 열고 별이 처음 보인다. 이후 c-open을 촬영한다. 관찰: <strong>A star inside the box. / 상자 안에 별이 있어.</strong> 장식품은 옮기지 않는다는 n4 진술과 실제 장식품을 대조하되 금빛만으로 재질·마을 소유·범행을 확정하지 않는다.</p><p>별 전체를 촬영한 뒤 뒷면을 가까이 조사한다. 별은 조사하는 동안 상자에 둔다. 기존 확대 조사 동작으로 뒷면을 볼 수 있는지는 개발 점검 대상이며 미지원이면 엔진 추가 필요다.</p><p>뒷면의 작은 잎사귀 무늬를 c-mark로 직접 촬영한다. 관찰: <strong>A small leaf pattern on the back of the star. / 별 뒷면에 작은 잎사귀 모양이 있어.</strong> 엘라 e1의 설명과 대조하는 실물 특징이다. 문자로 주인을 써 주거나 범인 이름을 알려 주지 않는다. 한 장의 사진만으로 범행을 확정하지 않고 출처·허락·목적을 더 확인한다.</p><p>c-open·c-mark 조사 뒤 니코가 상자 속 장식은 사라진 별이 아니라고 주장한다. 사진 탭에서 별 뒷면 사진(c-mark)을 내밀면, 탐정이 엘라 e1의 설명과 뒷면 무늬를 대조해 경사에게도 들려준다. 오답 반응: <strong>That doesn&#x27;t show the back of the star. / 그건 별 뒷면이 안 보이잖아.</strong> 같은 주장에 머물며 다시 고른다. 반박이 끝나면 자백으로 이어진다.</p><ul><li>det:challenge · 탐정 · 선택 대사</li><li>nico:claim-gift · 니코 · 심문 주장</li><li>present:tess-statement · 행동 · 증거 제시 선택지</li><li>present:c-toys · 행동 · 진술 제시 뒤 함께 보여 주는 사진</li><li>det:open-q1 · 탐정 · 사진 제시 뒤 선택 대사</li><li>nico:claim-sleigh · 니코 · 심문 주장</li><li>present:c-tracks · 행동 · 증거 제시 선택지</li><li>det:show-tracks · 탐정 · 사진 제시 뒤 선택 대사</li><li>nico:tracks-reply · 니코 · 자동</li><li>det:track-limit · 탐정 · 자동</li><li>badger:found-star · 경사 · 자동</li><li>det:brief-badger · 탐정 · 자동</li><li>det:check-permission · 탐정 · 자동</li><li>badger:reason-to-check · 경사 · 자동</li><li>nico:refuse-open · 니코 · 자동</li><li>badger:open-order · 경사 · 자동</li><li>open:box · 행동 · 탐정 조사 행동</li><li>look:star-back · 행동 · 조사 행동</li><li>nico:claim-star · 니코 · 심문 주장</li><li>present:c-mark · 행동 · 증거 제시 선택지</li><li>det:found-star · 탐정 · 자동</li></ul></div></details></div></article>

<div class="scene-next"><strong>얻은 정보</strong><p>창고 보관함 출처 · 금별을 팔려던 동기 · 썰매 운반</p><p style="margin-top:6px">다음 · 엘라에게 발견 소식 알리기</p></div><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">제작 메모 · 장면 조건과 연출</summary><div style="display:grid;gap:12px;padding-top:14px"><p>심문이 끝난 뒤 니코는 별을 가져온 곳과 허락 여부를 스스로 말한다. 열린 보관함의 금별을 보고 욕심이 났고, 별을 팔아 큰돈을 벌 생각이었다고 털어놓는다. 무거운 별을 썰매에 실은 이유도 이어서 밝힌다.</p><p>탐정은 니코의 보관함 진술을 엘라 e2와 빈 보관함 사진 c-case에 대조한다. 경사는 니코와 썰매 쪽에 남는다. 플레이어가 엘라에게 알리기를 고르면, 탐정은 근처 축제 안내 봉사자를 통해 광장에 있는 엘라에게 발견 소식을 전한다. 봉사자는 별도 대화 장면 없이 소식만 전한다. 별은 발견한 상자 안에 그대로 둔다.</p><ul><li>nico:admit · 니코 · 자동</li><li>nico:motive · 니코 · 자동</li><li>nico:weight · 니코 · 자동</li><li>badger:keep · 경사 · 자동</li><li>badger:stay-with-nico · 경사 · 자동</li><li>notify:ella · 행동 · 행동 선택지</li></ul></div></details></div></article>

<p>필수 사진 6장: 개봉 전 c-case·c-toys·c-track-yard·c-track-sleigh, 개봉 뒤 c-open·c-mark. 선택 사진은 창고의 c-supplies·c-door-view와 천막의 c-cookies 총 3장이다. 두 창고 사진은 홀리의 진술을 이해하는 보조 단서다. 선물 상자 겉면·손잡이·찢어진 종이 조각·배송 라벨은 증거로 만들지 않는다. 상자는 숨기는 수단이다. 사진은 별의 실제 존재·무늬·보관 위치, 장난감 선물 여섯 개와 배송 준비표, 두 구간의 바닥 자국을 기록한다. 홀리의 목격·테스의 전체 물량·니코의 운반/장식품 부인은 질문→음성→받아쓰기다. 재질·소유는 엘라의 진술과 최종 실물 확인, 출처·무허락·목적은 니코의 답변으로 확인한다.</p>
</div></details></section><section class="story-card" id="deductions"><h2>추리 문항 전체 자료</h2><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">추리 7문항 · 원문 표 전체</summary><div style="display:grid;gap:12px;padding-top:14px">
<p>추리는 개봉 전 설명을 다시 확인할 사람을 고르는 단계다. 사진만 보고 주인·범인을 알려 주지 않는다. 나중에 보게 되는 별 뒷면 무늬를 개봉 전 추리 정답으로 먼저 쓰지 않는다.</p>
<h3>deduction:q1</h3>
<div class="matrix"><table><thead><tr><th>항목</th><th>내용</th></tr></thead><tbody>

<span class="plan-anchor" id="cast"></span>
<p>경사의 조사 의뢰·신고 장소 안내 → 탐정이 안내대로 이동해 직접 말 걸기·엘라의 경위 설명 → 창고의 빈 보관함·홀리의 출입 목격 → 천막의 메이·테스 → 썰매의 니코 → 천막 쪽 작업대 관찰·추리 → 니코의 선물·썰매 주장에 테스 진술·선물 사진·자국 사진 제시 → 니코의 버티기 → 순찰 중 경사 도착·상황 보고·개봉 지시 → 탐정의 개봉 → 별 전체·잎사귀 무늬 확인과 보고 → 별이 아니라는 주장에 뒷면 사진·엘라 진술 제시 → 니코의 인정과 인계 → 엘라에게 발견 소식 전달 → 엘라가 썰매 앞에 도착해 실물 확인·보고·인수.</p>
<div class="matrix"><table><thead><tr><th>인물</th><th>신규/재사용</th><th>현재 위치</th><th>제작자용 역할·아는 범위</th></tr></thead><tbody>
<tr><td>엘라 · 사슴 · 성인</td><td>우산 인물 재사용</td><td>트리 광장</td><td>의뢰인. 별의 보관 위치·재질·소유·뒷면 무늬를 앎</td></tr>
<tr><td>홀리 · 양 · 성인</td><td>신규 제안</td><td>축제 창고 문 앞 작업대</td><td>엘라와 함께 축제 준비. 장식 정리·리본 달기. 본인과 메이·테스·니코의 창고 출입까지만 앎</td></tr>

<tr><td>테스 · 거북 · 성인</td><td>우산 인물 재사용</td><td>같은 천막의 작업대</td><td>토이 네스트 사장. 빈 상자를 가지러 창고 사용. 축제 봉사자로 장난감 선물을 포장하고 완료한 선물도 그 자리에 둠</td></tr>
<tr><td>니코 · 펭귄 · 성인</td><td>신규</td><td>썰매 앞</td><td>선물 운반·배송만 담당. 운반용 상자를 가지러 창고에 드나들다 별을 숨김</td></tr>
<tr><td>오소리 경사</td><td>재사용</td><td>초반 트리 광장·후반 썰매 앞</td><td>엘라 신고 확인·주변 순찰·별 발견 확인·니코 인계</td></tr>
</tbody></table></div>
<p>인물6명·장소4곳이다. 면담은5명이며 초반과 후반에 등장하는 경사1명을 포함해 L1 인물 기본4–5명을1명 초과한다. 새 준비 담당자를 추가하라는 사용자 요청을 반영한 예외다. 테스 재방문 없이 메이의 창고 방문 이유를 포함해 면담은 15개·36칸이다. 경사는 받아쓰기0개다. 재사용3명·신규3명, 탐정은 기존 다람쥐다.</p>
<p>창고 선반 안쪽은 문 앞 장식 더미 때문에 계속 보이지 않는다. 홀리는 출입은 봤지만 손에 든 것·별 반출은 못 봤다. 창고의 물건·방문자 이름은 자기소개·답변 기록·실제 증거 발견 범위에 맞춰 공개한다. 장식 정리는 선물을 포장하는 일과 다르며 현재 행동을 과거 무죄 근거로 쓰지 않는다.</p>
<span class="plan-anchor" id="map-plan"></span>
<h3>축제장 지도 제작 기획</h3>
<p>사용자 승인 방향이다. 기존 게임의 지도 화면에 쓰는 원화 기획이며, 이미지는 Claude Code가 개발 과정에서 준비한다. 이번 작업에서는 지도 그림·현장 원화·음성을 생성하지 않는다.</p>
<p><strong>범위와 시점</strong>: 사건이 일어나는 작은 축제장 전체를 살짝 위에서 내려다본다. 기존 사건 일러스트와 어울리는 동화책 화풍을 유지한다. 마을 전체를 축소해 넣지 않고, 네 방문 지점의 관계를 알아볼 수 있는 범위로 잡는다.</p>
<div class="matrix"><table><thead><tr><th>지도상 위치</th><th>장소와 눈에 띄는 형태</th><th>연결되는 장면</th></tr></thead><tbody>
<tr><td>중앙 아래</td><td>큰 크리스마스트리와 광장. 작은 안내대가 같은 광장 안에 있다.</td><td>입구에서 경사 의뢰 → 안내대로 직접 다가가 엘라 면담</td></tr>
<tr><td>왼쪽 위</td><td>눈 쌓인 지붕의 축제 창고. 출입문과 앞길이 보인다.</td><td>홀리·빈 보관함·창고 앞 바닥 조사</td></tr>
<tr><td>오른쪽 위</td><td>따뜻한 색의 선물 포장 천막. 썰매 쪽 옆면이 열려 있다.</td><td>메이·테스 면담과 최초 장난감 선물 사진</td></tr>
<tr><td>포장 천막 바로 옆</td><td>열린 옆면에서 가까운 배송용 썰매 자리. 짐칸과 접근 공간이 보인다.</td><td>니코 면담·현재 작업대 관찰·심문·엘라의 최종 확인</td></tr>
</tbody></table></div>
<p>안내대는 광장 안의 접근 지점이며 별도 지도 장소로 늘리지 않는다. 썰매 자리는 천막과 가깝지만 별도의 방문 지점이다. 장소는 트리 광장·축제 창고·선물 포장 천막·썰매 앞의 네 곳을 유지한다. 위의 상하좌우는 원화 구성 기준이며 실제 방위·거리·축척은 아직 확정하지 않았다.</p>
<h4>이동 경로와 현장 그림의 연결</h4>
<div class="matrix"><table><thead><tr><th>연결</th><th>반드시 맞춰야 할 공간 관계</th></tr></thead><tbody>
<tr><td>광장 안 입구 → 안내대</td><td>경사에게 안내대 신고 정보를 들은 뒤 탐정이 직접 다가갈 수 있다. 경사가 엘라를 데리고 오거나 함께 안내하지 않는다.</td></tr>
<tr><td>창고 → 트리 광장</td><td>홀리가 장식을 옮긴 손수레 경로. 창고 앞에서 광장 쪽으로 갈라지는 길이 있다.</td></tr>
<tr><td>창고 → 천막 옆 썰매</td><td>창고 문 앞부터 썰매 자리까지 물건을 끌고 이동할 수 있는 눈길. 중간의 나무 기둥이 두 현장 사진에 같은 모습으로 등장한다.</td></tr>
<tr><td>썰매 자리 → 천막 작업대 시야</td><td>천막의 열린 옆면이 썰매를 향한다. 가까운 작업대에서 여섯 상자가 각각 보이고, 포장이 진행된 상태를 비교할 수 있다. 멀리 떨어진 클립보드의 작은 글자를 읽어야만 풀리게 하지 않는다. 명단·예정 수량은 이미 촬영한 사진에서 확인한다.</td></tr>
<tr><td>광장 → 썰매 앞</td><td>별 발견 소식을 받은 엘라가 걸어와 확인할 수 있는 짧은 동선. 무거운 별은 썰매 위 상자에 그대로 둔다.</td></tr>
</tbody></table></div>
<p>창고 출입문 방향, 천막의 열린 옆면, 테스 작업대, 썰매 방향을 먼저 맞춘 뒤 지도와 현장 배경을 제작한다. 창고 앞 사진의 갈림길과 두 사진에 공통으로 보이는 나무 기둥도 같은 배치를 따른다. 도구를 끌고 이동한 흔적은 현장 촬영에서 발견하며, 지도 원화에 정답 경로나 증거 자국을 강조해 넣지 않는다.</p>
<h4>그림의 강조와 정보 공개</h4>
<ul>
<li>큰 트리가 먼저 눈에 들어오도록 그린다. 주변 지붕보다 훨씬 크되 창고·천막·썰매와 통로를 가리지 않는다.</li>
<li>눈은 푸른 그림자, 천막과 건물은 따뜻한 조명으로 표현한다. 작은 장식을 빽빽하게 채우지 않고 건물 형태와 위치가 구별되게 한다.</li>
<li>장소 이름은 원화에 새기지 않는다. 기존 지도 방식에 따라 발견한 장소부터 이름과 이동 대상을 표시한다. 자기소개 전 인물 이름이나 범인·알리바이를 지도에 노출하지 않는다.</li>
<li>창고는 엘라 e2, 포장 천막은 홀리 h3, 썰매 앞은 테스 t3를 기록한 뒤 방문 가능하다. 이동은 플레이어가 선택한다.</li>
<li>지도는 길과 장소의 관계를 보여 준다. 두 자국이 무엇인지, 언제 생겼는지, 누가 남겼는지는 지도에서 알려 주지 않는다.</li>
</ul>
<p><strong>제작 순서</strong>: 위 배치 기준 확인 → 각 현장 배경의 방향·거리·시야 맞추기 → 개발 단계에서 지도 일러스트 제작. 실제 원화 구도와 게임 지도 동작은 검증 안 함. 이 절의 추가는 개발 인계가 아니다.</p>
</div></details></section><section class="story-card" id="background-tts"><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">배경과 선택 클릭 TTS</summary><div style="display:grid;gap:12px;padding-top:14px"><div class="section-head"><h2>4. 배경과 선택 클릭 TTS</h2></div>

</div></details></section><section class="story-card" id="unlocks"><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">질문 해금·현장 확인 조건</summary><div style="display:grid;gap:12px;padding-top:14px"><div class="section-head"><h2>6. 해금·현장 확인·진행 조건</h2></div>
<div class="matrix"><table><thead><tr><th>기록</th><th>조건</th><th>기록 뒤</th></tr></thead><tbody>

<tr><td>ella:e1</td><td>e0 기록 뒤</td><td>금 재질·별 뒷면의 잎사귀 모양 기록. 실물 식별에 사용</td></tr>

<tr><td>holly:h1</td><td>엘라 e2 기록·창고 도착·홀리 자기소개 뒤 첫 질문</td><td>h2. 출입 목격을 기록하면 h3가 열린다.</td></tr>

<p>경사의 안내대 신고 정보→안내대 접근·탐정의 말 걸기→엘라 자기소개→e0→e1·e2, e2→축제 창고·홀리·c-case·c-track-yard. 창고 바닥 촬영→홀리 손수레 질문. 홀리 h1→h2→h3→포장 천막·메이·테스 면담. 메이 m0 창고 방문 이유→m1 포장 대상→m3 닫힌 상자 확인. 테스 첫 면담은 별 목격 여부→창고에 간 이유(두 문답은 받아쓰기 없음)→t1→t3·장난감 조사 행동, 테스 t3→썰매·니코·c-track-sleigh. 니코의 열린 질문을 마치면 썰매 이동 여부를 묻는다. 니코 n1→n2→창고 방문 이유 선택 질문(받아쓰기 없음)→n3 포장 역할 확인→n4 장식 운반 확인. 니코의 면담을 마치면 썰매 자리에서 천막 쪽 작업대를 볼 수 있다. 테스 면담에서는 t1·t3를 기록하고 장난감 선물을 촬영한다. 두 면담이 열리면 메이·테스 방문 순서는 자유이며 기록은 추리 직전에 합류한다.</p>
<p>면담 15개·두 현장 답변·개봉 전 필수 사진 4장·현재 작업대 필수 관찰 완료 → 추리 7문항 → 니코의 주장에 테스 t3·c-toys와 두 바닥 자국 사진 제시·이동 시점은 모름을 확인 → 장난감 선물 설명의 모순 유지 → 경사 도착·니코의 거부·경사의 개봉 지시 → 탐정이 열어 별 발견 → c-open → 뒷면 조사·c-mark → 니코의 부인에 c-mark·엘라 e1 대조 → 니코의 인정 → 경사의 니코 인계 → 엘라에게 발견 소식 전달 → 엘라가 썰매 앞에 도착해 실물 확인·보고·인수. 선택 사진 세 장은 해금 조건에 포함하지 않는다. 선물 상자 사진은 존재하지 않는다. 모든 이동은 생각과 버튼을 쓰며 발견·촬영 뒤 자동 이동하지 않는다.</p>
</div></details></section><section class="story-card" id="learning"><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">열쇠 표현·복습·균형표</summary><div style="display:grid;gap:12px;padding-top:14px"><div class="section-head"><h2>8. 학습·복습·문서 집계</h2></div>
<p>새 의미 대조는 현재 작업이 진행 중인지·어떤 행동을 하는지다. 테스의 still wrapping과 when I finish wrapping을 듣고, 포장 상태와 선물 전체를 포장이 끝난 뒤 나르는 조건을 구분한다. 사진 c-toys의 예정 수량과 작업대의 실제 여섯 개를 대조해 설명 확인 때 니코에게 내민다. 니코의 not moving decorations 진술은 개봉 뒤 실제 별 장식과 대조한다. 현재 행동을 과거 알리바이로 만들지 않는다. 홀리의 saw·went는 출입 목격의 짧은 배경 표현이며 별도 과거 시제 숙달 목표로 확대하지 않는다.</p>
<div class="matrix"><table><thead><tr><th>들어야 하는 말</th><th>가능한 판단</th></tr></thead><tbody>
<tr><td>홀리 h1 sorting decorations·helping Ella / h3 wrapping·gift tent</td><td>장식 준비와 선물 포장을 구별. 새 인물도 창고 사용자임을 조사</td></tr>
<tr><td>홀리 h2 I saw May, Tess, and Nico go in. I went in, too.</td><td>여러 사람의 출입을 알지만 그중 누가 별을 가져갔는지는 모름</td></tr>
<tr><td>니코 n2 loading one of Tess&#x27;s toy gifts / 테스 t3 still wrapping·when I finish wrapping</td><td>운반 주장과 포장 완료 후 수거 방식, 아직 포장 중이며 전량이 남은 작업대를 대조</td></tr>
<tr><td>니코의 창고 방문 이유 / n3 not wrapping gifts</td><td>과거의 빈 상자 수거 설명과 현재 포장 역할 부인을 구분. 닫힌 상자의 내용은 아직 모름</td></tr>
<tr><td>니코 n4 not moving decorations / loading gifts</td><td>선물만 나른다는 말과 개봉 뒤 실제 별 장식을 대조</td></tr>
<tr><td>엘라 e1 gold·leaf·back / e2 case·storeroom·shelf</td><td>별의 실물 식별·원래 보관 위치를 알게 됨</td></tr>
<tr><td>니코의 storeroom shelf / without asking / sell</td><td>무늬·빈 보관 위치와 함께 출처·허락·목적을 확인</td></tr>
</tbody></table></div>
<h3>열쇠 형태·실제 복습 발화·사건 밖 예문</h3>
<h4>긍정 · be + -ing</h4>
<p>지금 하는 일을 말한다.</p>
<p>실제 발화: <strong>I&#x27;m wrapping cookies. We&#x27;re all volunteers for the Christmas party.</strong> · mae:m1</p>
<div class="matrix"><table><thead><tr><th>사건 밖 예문</th><th>반말 해석</th></tr></thead><tbody>
<tr><td>I&#x27;m reading a book.</td><td>난 책을 읽고 있어.</td></tr>
<tr><td>She&#x27;s washing a cup.</td><td>그 애는 컵을 씻고 있어.</td></tr>
<tr><td>They&#x27;re drawing maps.</td><td>그 애들은 지도를 그리고 있어.</td></tr>
</tbody></table></div>
<h4>부정 · be not + -ing</h4>
<p>not을 놓치면 반대 행동으로 기록한다.</p>
<p>실제 발화: <strong>No, I&#x27;m not moving decorations. I&#x27;m loading gifts.</strong> · nico:n4</p>
<div class="matrix"><table><thead><tr><th>사건 밖 예문</th><th>반말 해석</th></tr></thead><tbody>
<tr><td>I&#x27;m not sleeping.</td><td>난 자고 있지 않아.</td></tr>
<tr><td>He isn&#x27;t cooking.</td><td>그 애는 요리하고 있지 않아.</td></tr>
<tr><td>We aren&#x27;t running.</td><td>우리는 달리고 있지 않아.</td></tr>
</tbody></table></div>
<h4>확인 · be + 주어 + -ing?</h4>
<p>상대의 현재 행동을 확인한다. Are you로 물으면 자기 행동을 I am으로 답한다.</p>
<p>실제 발화: <strong>Are you sorting decorations?</strong> · holly:h1 질문</p>
<div class="matrix"><table><thead><tr><th>사건 밖 예문</th><th>반말 해석</th></tr></thead><tbody>
<tr><td>Are you reading?</td><td>너 읽고 있어?</td></tr>
<tr><td>Is she dancing?</td><td>그 애는 춤추고 있어?</td></tr>
<tr><td>Are they swimming?</td><td>그 애들은 수영하고 있어?</td></tr>
</tbody></table></div>
<h4>행동·대상 질문 · What + be + 주어 + -ing?</h4>
<p>지금 하는 행동이나 포장하는 대상을 묻는다.</p>
<p>실제 발화: <strong>What are you loading?</strong> · nico:n2 질문</p>
<div class="matrix"><table><thead><tr><th>사건 밖 예문</th><th>반말 해석</th></tr></thead><tbody>
<tr><td>What are you reading?</td><td>무엇을 읽고 있어?</td></tr>
<tr><td>What is he drawing?</td><td>그 애는 무엇을 그리고 있어?</td></tr>
<tr><td>What are they carrying?</td><td>그 애들은 무엇을 들고 있어?</td></tr>
</tbody></table></div>
<p>look for·give back·I don&#x27;t know.는 표현 목록이며 문법과 구분한다. 인물 이름은 복습 단어에 넣지 않는다. 노트는 들은 문장 그대로 인용하고 빈칸에 대명사를 바꾸지 않는다.</p>

<p>추가 제안 어휘는 빈칸 단어와 구분한다: volunteers / 자원봉사자들(mae:m1: We&#x27;re all volunteers for the Christmas party.), empty boxes / 빈 상자들(nico:storeroom-reason: I needed empty boxes to carry the gifts.), pattern / 무늬(ella:e1·c-mark), sell / 팔다(nico:motive: I thought the gold would sell for a lot.).</p>
<p>해결 뒤 복습: <strong>Nico took the town&#x27;s gold star from the storeroom. He hid it in a gift box. He saw the open case and got greedy. He thought the gold would sell for a lot. Ella came to the sleigh to check the star. / 니코가 창고에서 마을의 금별을 가져가 선물 상자에 숨겼어. 열린 보관함을 보고 욕심이 났고, 금별을 팔면 큰돈을 받을 수 있을 줄 알았어. 엘라가 썰매 앞으로 와서 별을 확인했어.</strong> 범인 얼굴·인정 내용은 해결 뒤 복습에서만 요약한다.</p>
<h3>새 상황 확인·지연 복습</h3>
<ul>
<li>질문: <strong>Are you washing the cup? / 컵을 씻고 있어?</strong></li>
<li>대답: <strong>No, I&#x27;m not washing it. I&#x27;m drying it. / 아니, 씻는 게 아니야. 말리고 있어.</strong></li>
<li>확인: <strong>What is the speaker doing? / 말하는 사람은 무엇을 하고 있어?</strong></li>
<li>보기: drying the cup · washing the cup · painting the cup · filling the cup · buying the cup · dropping the cup.</li>
<li>정답: <strong>The speaker is drying the cup. / 말하는 사람은 컵을 말리고 있어.</strong></li>
<li>피드백: <strong>Listen for “not washing” and “drying.” / “not washing”과 “drying”을 들어 봐.</strong></li>
<li>다른 날 질문: <strong>Are you cutting the paper? / 종이를 자르고 있어?</strong></li>
<li>대답: <strong>No, I&#x27;m not cutting it. I&#x27;m folding it. / 아니, 자르는 게 아니야. 접고 있어.</strong></li>
<li>확인: <strong>What is the speaker doing? / 말하는 사람은 무엇을 하고 있어?</strong></li>
<li>보기: folding the paper · cutting the paper · drawing on the paper · gluing the paper · tearing the paper · carrying the paper.</li>
<li>정답: <strong>The speaker is folding the paper. / 말하는 사람은 종이를 접고 있어.</strong></li>
</ul>
<p>학생의 직접 표현은 새 그림을 보고 I&#x27;m …ing / I&#x27;m not …ing로 짧게 말하기다. 이 추가 활동의 실행·평가는 하지 않았다.</p>

<p>긍정은 실제 답변의 현재진행형(테스의 still 포함), 부정은 not + -ing, 확인은 Are you + -ing, 행동 질문은 What are you + -ing를 센다. 명사 wrapping이나 missing 형용사, 보기·예습·힌트·나레이션·이동·추리 완성문장·복습·다시 듣기는 기본 횟수에서 제외한다. 열쇠 반복 횟수가 학습 효과 검증은 아니다.</p>

</div></details></section><section class="story-card" id="truth"><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">제작자용 진실·행동 이유</summary><div style="display:grid;gap:12px;padding-top:14px"><div class="callout"><strong>현재안: 금으로 만든 별 절도.</strong> 선물 상자는 숨기는 수단이다. 창고 목격·현재 작업 진술·별 실물의 특징을 함께 확인한다.</div><p><strong>L1-05 현재진행형 · 2단계 수정 대본 검토 대기 · 개발 미인계.</strong> <a href="case-10-christmas-star.html">장면별 기획</a></p><p>마을의 큰 크리스마스 축제를 위해 어른들이 아이들 선물을 자원해서 준비한다. 엘라는 축제를 안내하고, 새 인물 홀리는 창고와 장식을 정리한다. 메이는 쿠키, 테스는 장난감 선물을 포장하고 니코는 완성된 선물을 썰매에 나르고 배송하는 역할만 맡는다. 니코는 창고에 보관한 금으로 만든 별을 선물 상자 안에 완전히 숨겨 나른다. <strong>선물 상자 자체·상자의 출처·손잡이·종이 조각은 범행 물증으로 쓰지 않는다.</strong></p><p>별은 속까지 꽉 찬 실제 금으로 만든 장식 하나뿐이다. 밖으로 별 끝이나 금빛이 보이는 설정은 없다. 별 뒷면의 작은 잎사귀 음각 무늬가 실제 물건 확인에 쓰인다. 새 인물 이름·종(양 홀리)과 무늬·구체 대사는 기획자 제안이며 사용자 결정으로 적지 않는다. 새 인물·창고 보관·추가 근거를 넣는 방향은 사용자 승인 사항이다. 그림·음성 생성이나 게임 구현은 하지 않는다.</p><div class="section-head"><h2>1. 제작자용 진실·행동 이유</h2></div>
<ol>
<li>별은 마을이 해마다 쓰는 귀중품이며 창고 선반의 전용 보관함에 둔다. 뒷면에는 작은 잎사귀 무늬가 새겨져 있다. 몸체는 속까지 꽉 차 있고 전기 부품·빈 내부·연결 관은 없다. 가까운 곳까지 잠깐 들어 옮길 수는 있지만, 계속 들고 마을길을 걷기에는 무겁다. 순도·정확한 무게·크기·트리 고정 방식은 미정이다.</li>
<li>엘라는 설치 준비를 위해 보관함 잠금을 풀고 별을 확인한 뒤, 광장 입구의 어린 친구들을 안내하러 잠시 나간다. 평소에는 잠가 보관한다. 돌아와 별이 없어진 것을 알고 오소리 경사에게 알린다. 경사는 신고를 전하고 탐정에게 조사를 부탁한다. 안내대에서 신고가 들어왔으니 그곳에서 자세한 이야기를 들어 보라고 말한다. 경사가 주변 순찰을 시작하면 탐정은 안내대에서 물어보기로 하고 직접 다가간다. 탐정이 사라진 별을 조사한다고 말을 걸면 엘라가 자기 이름과 신고한 사람임을 밝힌다. 탐정은 이어 경위를 묻는다. 엘라는 축제 준비 담당자로서 별을 찾는 데 필요한 축제 물품의 확인도 경사와 탐정에게 맡기고, 조사 중에는 안내 자리에 남는다. 경사는 의뢰 직후 축제장 주변을 확인한다. 후반 합류 때 탐정에게 엘라의 물품 확인 요청을 전달받는다. 후보를 직접 지목하지 않고 위치·특징만 답한다. 사전 별 사진은 없다.</li>
<li>홀리는 창고의 장식을 손수레로 트리 광장에 옮긴 뒤 문 앞 작업대에서 장식을 정리하고 리본을 단다. 손수레의 두 바퀴가 남긴 자국은 트리 광장 쪽으로 굽는다. 본인도 창고를 사용한다. 메이는 포장지를, 테스는 빈 선물 상자를 가지러 드나들고, 니코는 선물 운반에 쓸 상자를 가지러 들어온다. 홀리는 이 세 친구가 들어가는 것은 봤지만 선반 안쪽에서 무엇을 집었는지 계속 보지는 못했다. 출입 목격만으로 별을 가져간 사람을 알 수 없다.</li>
<li>니코는 창고 문 앞에 축제 배송용 썰매를 세워 둔다. 창고 안의 열린 보관함에서 무거운 별을 꺼내 준비용 선물 상자에 숨기고, 문 앞까지 짧게 들어 썰매에 싣는다. 그 썰매를 포장 천막 옆까지 끌어다 세운다. 창고 앞에서 썰매 아래까지 이어지는 자국은 이때 생겼다. 다른 선물과 함께 나르려 하며, 무엇을 옮기는지 묻자 테스의 선물이라고 둘러댄다. 정상 역할은 선물 운반·썰매 배송이며 포장을 겸하지 않는다. 닫힌 선물 상자는 숨기는 수단일 뿐 창고 출처를 입증하는 증거가 아니다.</li>
<li>메이·테스는 천막에서 선물을 포장한다. 테스가 이번 배송을 위해 준비한 장난감 선물은 배송 준비표에 적힌 여섯 개 전부이며 모두 작업대에 남아 있다. 촬영 시점에는 포장 완료, 포장 중, 포장 전이 두 개씩이다. 이미 니코에게 건넨 별도 물량은 없다. 니코는 아직 나머지 선물이 준비되지 않아 출발하지 않는다. 자동 도주·타이머는 없다.</li>
<li>탐정은 창고의 빈 보관함을 촬영하고 홀리에게 현재 작업과 출입을 묻는다. 여러 친구가 출입했으므로 그 말만으로 특정하지 않는다. 천막에서 테스의 선물을 전부 포장하면 니코가 가져간다는 말을 듣는다. 니코의 운반 주장을 들은 뒤 썰매 자리에서 보이는 작업대에 여섯 개가 그대로 남아 있다.</li>
<li>니코는 장식품을 옮기지 않고 선물을 싣고 있다고도 말한다. 추리를 마치면 탐정이 설명에 맞지 않는 부분이 있다고 짚는다. 니코는 테스가 포장한 장난감 선물을 받아 그 상자를 썰매에 싣고 있다고 주장한다. 탐정은 테스의 진술과 작업대 사진을 내민다. 니코가 자신이 창고에서 가져왔다고 의심하느냐며 썰매를 옮기지 않았다고 주장하자 두 바닥 자국 사진을 대조해 보여 준다. 탐정은 사진으로 이동 시점을 알 수 없음을 인정하고, 테스의 장난감 선물이라는 설명과 남아 있는 전량의 불일치에 집중한다. 니코가 설명을 굽히지 않자 순찰하던 경사가 도착한다. 탐정은 테스의 답과 사진을 보여 준다. 니코는 축제 선물이라며 개봉을 거부한다. 경사는 이 상자가 엘라가 확인을 맡긴 축제 배송 물품에 해당하고 선물이라는 설명이 테스의 답과 맞지 않는다고 판단한다. 이 상자를 현장에서 확인하도록 탐정에게 지시한다. 플레이어가 상자 열기를 선택해 탐정이 직접 연다.</li>
<li>개봉 뒤 처음으로 별을 발견한다. 선물만 나르고 장식품은 옮기지 않는다는 진술과 실제 장식품을 대조한다. 별의 뒷면을 조사·촬영해 엘라가 설명한 작은 잎사귀 무늬를 확인하고, 창고의 빈 보관함·니코의 출처 답변을 함께 본다. 니코가 사라진 별이 아니라고 버티면 탐정은 뒷면 사진과 엘라의 진술을 대조해 경사에게도 들려준다. 이후 니코가 열린 보관함에서 금별을 보고 욕심이 나 허락 없이 가져갔으며, 별을 팔면 큰돈이 될 줄 알았다고 인정한다. 경사가 니코를 인계받는다. 별을 찾았다는 소식을 듣고 엘라가 썰매 앞으로 와서 실물을 확인하고 탐정의 보고를 듣는다.</li>
</ol>
<p>여러 봉사자가 같은 창고에 드나든다. 메이의 닫힌 쿠키 상자도 니코의 상자와 비슷해 보이지만, 메이가 그 상자를 열면 내용물을 확인할 수 있다. 홀리도 출입했고 현재 장식을 정리하므로 후보에서 자동 제외하지 않는다. 현재 작업은 과거 알리바이가 아니다. 범행 물증은 별의 실물·뒷면 무늬·비어 있는 보관 위치다. 홀리와 테스·니코의 말은 진술로 기록한다. 박스 손잡이 조각·상자 모양·배송 라벨·동물 종·외형·색을 범인 증거로 쓰지 않는다.</p>
</div></details></section><section class="story-card" id="production"><details style="padding:12px 0;border-top:1px dashed var(--line)"><summary style="cursor:pointer;font-weight:750;color:var(--muted);font-size:13px">그림·녹음·엔진 확인 사항</summary><div style="display:grid;gap:12px;padding-top:14px"><div class="section-head"><h2>9. 제작 범위·남은 확인</h2></div>
<span class="plan-anchor" id="approval"></span>
<p>같은 엔진·같은 화면의 질문과 받아쓰기·첫 질문 제한·행동 선택지·사진·확대 조사·증거 제시·추리·심문·소지품 받기/건네기를 쓴다. 사건 전용 화면·CSS·코드 구현 방식은 정하지 않는다.</p>
<div class="matrix"><table><thead><tr><th>장면</th><th>새 그림·녹음</th><th>재사용</th><th>동작·확인</th></tr></thead><tbody>
<tr><td>광장</td><td>겨울 광장·주변 지붕보다 훨씬 높은 대형 크리스마스트리·엘라 질문/답·보고 음성</td><td>엘라·경사·탐정 외형</td><td>의뢰에 광장 배경을 쓴다. 결말은 엘라가 썰매 앞으로 와서 확인하는 장면이다. 가까이서는 트리 꼭대기가 화면 위로 잘리고, 창고 앞 사진에서는 멀리 있는 트리의 전체 윤곽이 보인다.</td></tr>
<tr><td>창고</td><td>홀리 전신·문 앞 장식 작업대·안쪽 선반·빈 보관함·공용 포장재 선반·시야를 가리는 장식 상자·바닥 자국·클릭 소품·목격/작업 음성</td><td>기존 대화·현장 촬영 화면</td><td>입구에서는 장식 상자 때문에 안쪽 손동작이 가려지고, 통로에 들어가면 보관함이 보이는 구도</td></tr>
<tr><td>포장 천막</td><td>메이 전신·쿠키/장난감 작업대·장난감 선물 여섯 개와 배송 준비표 사진·선택 쿠키 사진·질문 음성</td><td>테스 외형·질문/사진 화면</td><td>첫 방문 사진과 썰매 쪽에서 바라본 포장이 진행된 작업대 구도</td></tr>
<tr><td>썰매</td><td>니코 전신·썰매 짐칸과 바닥 자국·완전히 닫힌 상자/개봉 장면·별 뒷면 잎사귀 무늬·관련 음성</td><td>경사 외형·추리/심문/확대 UI</td><td>작업대 관찰·c-toys와 자국 사진 두 장 제시·탐정의 직접 개봉·개봉 뒤 사진 2장·별을 같은 썰매에 둠</td></tr>
<tr><td>반환/복습</td><td>엘라의 썰매 앞 합류 자세·보고/확인/감사·복습 예문 음성</td><td>엘라·썰매 앞 배경·복습 화면</td><td>엘라가 썰매 위 실물을 확인하고 탐정에게 보고를 들음</td></tr>

<h3>인물 일러스트 · 작업 중과 대화 중</h3>
<p>인물마다 하던 일이 보이는 전신 작업 자세를 기본 원화로 잡는다. 몸과 손이 보이도록 작업대는 인물 옆에 비스듬히 둔다. 말을 걸면 그 자리에서 손을 멈추거나 시선을 드는 자세를 제안한다. 앉아서 일하던 메이는 앉은 채 답한다. 대화 전후 자세 전환 지원은 개발 점검 항목이며, 한 컷만 쓰는 경우에는 작업 자세에서 얼굴을 탐정 쪽으로 조금 열어 둔다. 몸짓과 소품은 현재 작업을 보여 주는 연출이고 범행이나 알리바이의 증거로 세지 않는다.</p>
<div class="matrix"><table><thead><tr><th>장면</th><th>인물</th><th>처음 보이는 자세</th><th>말을 걸거나 보고할 때</th></tr></thead><tbody>
<tr><td>1</td><td>엘라</td><td>광장 안내대에서 펼쳐진 축제 안내지를 접는 중이야.</td><td>안내지를 내려놓고 탐정을 바라봐.</td></tr>
<tr><td>1</td><td>오소리 경사</td><td>광장 입구에서 신고를 적던 수첩을 덮어.</td><td>탐정에게 조사 의뢰를 전하고 순찰하러 떠나.</td></tr>
<tr><td>2</td><td>홀리</td><td>작업대 모서리에서 장식에 리본을 묶고 있어.</td><td>리본 끝을 내려놓고 같은 자리에서 고개를 들어.</td></tr>
<tr><td>3</td><td>메이</td><td>낮은 의자에 앉아 쿠키 선물을 포장해. 옆에는 니코의 상자와 닮은 닫힌 상자가 있고, 쿠키를 보여 줄 때 그 상자의 뚜껑을 들어.</td><td>포장지 위에서 손을 멈추고 앉은 채 탐정을 바라봐.</td></tr>
<tr><td>4</td><td>테스</td><td>천막 작업대에서 장난감 하나의 포장지를 눌러 접고 있어.</td><td>한 손으로 종이를 눌러 둔 채 고개를 들어. 탐정이 썰매를 조사하는 동안에도 이 자리에서 계속 포장해.</td></tr>
<tr><td>5</td><td>니코</td><td>썰매 짐칸에 몸을 살짝 숙이고 닫힌 선물 상자를 밀어 자리를 잡고 있어.</td><td>상자는 짐칸에 두고 고개를 들어. 포장하거나 뚜껑을 여는 손동작은 없어.</td></tr>
<tr><td>8</td><td>오소리 경사</td><td>썰매 곁에서 열린 상자와 별의 뒷면을 확인해.</td><td>탐정의 보고와 니코의 답을 들어.</td></tr>
<tr><td>9</td><td>엘라</td><td>소식을 듣고 썰매 앞으로 와서 짐칸의 열린 상자로 몸을 기울여.</td><td>별을 들어 올리지 않고 상자 안에서 살짝 기울여 뒷면 무늬를 확인해.</td></tr>
<tr><td>7</td><td>오소리 경사</td><td>순찰 중 썰매 곁에 도착해.</td><td>별을 찾았는지 묻고 탐정이 보여 주는 사진을 살펴봐.</td></tr>
</tbody></table></div>
<p>기존 동작 조합으로 설계하되 <strong>썰매에서 진행된 포장 배경 확인</strong>, <strong>현장에서 대질을 시작해 개봉·촬영을 거친 뒤 재개</strong>, <strong>두 자국 사진 또는 진술과 사진을 함께 제시</strong>, <strong>발견 알림 뒤 엘라가 썰매 앞에 합류</strong>, <strong>추리 뒤 사진 추가·별 뒷면 확대·후속 심문 조건 갱신</strong>, <strong>경사의 의뢰 뒤 순찰 이탈·같은 광장 안내대로 접근해 엘라에게 말 걸기·후반 조사 완료 뒤 합류</strong>는 실제 지원 미확인이며 미지원이면 엔진 추가 필요다. 그림·녹음 생성과 게임 실행은 하지 않았다.</p>
<p>사용자 결정: 벤 대신 우산 사건의 거북 테스를 재사용하고 책 선물 여섯 개를 장난감 선물 여섯 개로 대체한다. 니코는 선물 운반·썰매 배송만 담당, 새 준비 인물 추가, 별을 창고에 보관, 테스 진술 외의 근거 보강, 선물 상자 자체는 범행 물증으로 쓰지 않음, 속까지 꽉 찬 실제 금으로 만든 별 하나, 이전안 백업 삭제.</p>
<p>기획자 구체화: 성인 양 홀리, 문 앞 장식 작업대의 목격 범위, 별 뒷면 잎사귀 음각 무늬, 니코의 장식품 운반 부인과 실물 대조, 메이의 창고 방문 질문을 포함해 면담 15개·36칸으로 조정, 필수 사진 6장·선택 3장 구성이다. 전반부 다섯 장면의 선택 음성 10개는 사용자 승인 제안을 반영했다. 이를 사용자 지정 세부사항으로 적지 않는다.</p>
<p>남은 검토: 창고 문 앞에서의 시야, 별 뒷면 무늬가 실제 그림에서 보이는지, 배송 경로와 각 집의 위치, 엔진의 썰매 쪽 작업대 구도·두 자국 사진 제시·탐정 개봉 지원이다.</p>
<p>검증 안 함: 실제 플레이·소요 시간·학습 효과·학생 청취·녹음 속도·실제 원화·엔진 실행. 문서의 문장 길이·원문 노트·보기·조건·대사·사진·흐름도는 대조하지만 사용자 승인 뒤 정식3단계 규칙별 점검을 대신하지 않는다.</p>
<h3>최종 문서 점검 · 2026-11-09</h3>
<p>사용자 요청으로 전반부 관찰 음성·선택 소품 반응을 반영한 뒤 사건 시작부터 보고까지 문서로 대조했다. 개발 인계 승인이 아니며 기존 대본의 심문·자백·결말에는 새 소품 대사를 추가하지 않았다.</p>

  const scenes=[...source.querySelectorAll('#storyboard > article.scene:not(#scene-0)')].map((article,item) => {
    const head=article.querySelector('.scene-head');
    const body=article.querySelector('.scene-body');

      const current=all[i];

      if(current.tagName==='SPAN' || /^H[34]$/.test(current.tagName)) {pending.push(current);continue;}
      const nodes=[...pending,current];pending=[];
      if(isTurn(current)) {
        const next=all[i+1];
        if(next && isTurn(next)) {
          if(/질문|행동 선택지/.test(kind(current)) && kind(next)==='자동' && who(next)!=='탐정') {
            nodes.push(next);i++;

      const page={nodes,label:title,anchor:actual?.dataset.ref || actual?.dataset.line || actual?.dataset.deduction || actual?.dataset.evidence || current.id || article.id};
      const pageIndex=pages.length;pages.push(page);register(nodes,{mode:'script',item,page:pageIndex});
    }
    if(pending.length) {
      if(pages.length)pages[pages.length-1].nodes.push(...pending);

  });
  const sceneLabels=['경사 의뢰·엘라 면담','창고 조사','메이와 대화','테스과 대화','니코와 대화','작업대 관찰','추리','심문','자백','별 반환'];
  const flowSource=source.querySelector('#flow-overview');
  const figures=[...flowSource.querySelectorAll('figure')];
  const flowItems=[
    {title:'사건 한눈에',context:'L1-05 · 10 B',purpose:'의뢰부터 반환까지 전체 구조를 확인해.',node:source.querySelector('#case-summary')},
    {title:'사건이 벌어진 과정',context:'제작자용 진실',purpose:'탐정이 오기 전 사건의 순서야.',node:figures[0]},
    {title:'탐정이 해결하는 과정',context:'플레이 흐름',purpose:'흐름도의 카드를 누르면 해당 장면의 대본이 열려.',node:figures[1]}
  ];
  for(const [id,item] of [['case-summary',0],['flow-overview',2],['event-flow',2]])routes.set(id,{mode:'flow',item,page:0});
  const refIds=['fieldwork','overview','background-tts','unlocks','learning','deductions','truth','production','next-steps'];
  const refNames=['증거 전체 목록','인물·장소','배경 TTS','해금·현장 확인','열쇠 표현·복습','추리 전체 자료','사건의 진실','제작 범위·남은 확인','다음 단계'];
  const references=refIds.map((id,item) => {
    const section=source.querySelector('#'+id);
    let children=[...section.children];
    if(children.length===1 && children[0].tagName==='DETAILS')children=unwrap(children[0]);
    if(id==='deductions')children=children.flatMap(n=>n.tagName==='DETAILS'?unwrap(n):[n]);

    function flush() {
      if(!block.length)return;

      const anchor=block.find(n=>n.id)?.id || id;

    }
    for(const n of children) {
      if(n.tagName==='H3' && block.some(x=>!x.matches('.plan-anchor'))) {
        const trailing=[];
        while(block.length && block[block.length-1].matches('.plan-anchor'))trailing.unshift(block.pop());
        flush();block=trailing;
      }
      block.push(n);
    }
    flush();
    if(!pages.length)pages.push({nodes:children,label:refNames[item],anchor:id});
    pages.forEach((p,page)=>register(p.nodes,{mode:'reference',item,page}));
    routes.set(id,{mode:'reference',item,page:0});
    return {id,title:refNames[item],context:'전체 설계 자료',purpose:'대본과 함께 검토하는 학습·제작 자료야.',pages};
  });
  const prepSection=source.querySelector('#prep');
  const prepItems=[{
    title:'이번 사건의 열쇠',context:'L1-05 · 현재진행형',
    purpose:'사건에 들어가기 전에 현재 하는 일을 묻고 답하는 표현을 익혀.',
    pages:[{anchor:'prep',nodes:[...prepSection.children]}],
  }];
  for(const id of ['prep','scene-0','plan-a'])routes.set(id,{mode:'prep',item:0,page:0});
  routes.set('storyboard',{mode:'script',item:0,page:0});
  routes.set('reference-index',{mode:'reference',item:0,page:0});
  // Reference copies must not steal the dedicated scene anchor.
  scenes.forEach((s,item)=>routes.set(s.id,{mode:'script',item,page:0}));
  routes.set('det:call-thought',routes.get('scene-7'));
  routes.set('det:confirm-tess-gift',routes.get('nico:claim-gift'));
  routes.set('det:confirm-sleigh',routes.get('nico:claim-sleigh'));
  routes.set('det:box-from-storeroom',routes.get('nico:claim-sleigh'));
  routes.set('tess-recheck',routes.get('tess-table-observation'));
  for(const [oldId,newId] of [['ben-table-observation','tess-table-observation'],['ben-recheck','tess-table-observation'],['ben:b1','tess:t1'],['ben:b3','tess:t3'],['c-books','c-toys']])if(routes.has(newId))routes.set(oldId,routes.get(newId));
  routes.set('tess:t2',routes.get('tess-table-observation'));
  routes.set('take:star',routes.get('notify:ella'));
  routes.set('move:tree',routes.get('notify:ella'));
  routes.set('give:star',routes.get('ella:thanks'));
  const modes={script:scenes,flow:flowItems,prep:prepItems,reference:references};
  const items=()=>modes[state.mode];
  const selected=()=>items()[state.item];
  const pages=()=>state.mode==='flow'?[{anchor:['case-summary','flow-truth','event-flow'][state.item]}]:selected().pages;
  function setHash(anchor,push=false) {
    const hash='#'+encodeURIComponent(anchor).replace(/%3A/g,':');
    if(location.hash!==hash)history[push?'pushState':'replaceState'](null,'',hash);
  }
  function select(mode,item=0,page,updateURL=true,push=false) {
    if(state.mode!=='flow')memories[state.mode].set(state.item,state.page);
    if(state.mode==='script')sceneScroll.set(state.item,$('reader-canvas').scrollTop);
    lastItems[state.mode]=state.item;
    state.mode=mode;state.item=Math.max(0,Math.min(item,items().length-1));
    const remembered=mode==='flow'?0:(memories[mode].get(state.item)||0);
    state.page=Math.max(0,Math.min(page??remembered,pages().length-1));
    root.dataset.details='closed';state.zoom=false;
    render(mode==='script' && page!==undefined);if(updateURL)setHash(pages()[state.page].anchor,push);
  }
  function navigate(direction) {
    if(state.mode==='prep') {
      if(direction>0)select('script',0,0,true,true);
      return;
    }
    if(state.mode==='script') {
      const next=state.item+direction;
      if(next>=0 && next<scenes.length)select('script',next,0);
      return;
    }
    let page=state.page+direction,item=state.item;
    if(page<0) {if(item===0)return;item--;page=state.mode==='flow'?0:items()[item].pages.length-1;}
    else if(page>=pages().length) {if(item===items().length-1)return;item++;page=0;}
    select(state.mode,item,page);
  }
  function fillList() {
    const titles={script:'장면 선택',flow:'사건 흐름',prep:'예습 항목',reference:'점검 항목'};
    $('reader-list-title').textContent=titles[state.mode];
    $('reader-list').replaceChildren();$('reader-mobile-select').replaceChildren();
    items().forEach((item,index)=> {
      const label=state.mode==='script'?sceneLabels[index]:item.title;
      const b=node('button');b.type='button';b.dataset.item=String(index);
      b.append(node('span',String(index+1).padStart(2,'0'),'reader-item-number'),node('span',label,'reader-item-label'));
      b.setAttribute('aria-current',String(index===state.item));

    });

  }
  function panelHeading(textValue) {return node('h3',textValue);}
  function fillInspector() {
    const panel=$('reader-inspector-content');panel.replaceChildren();
    for(const b of root.querySelectorAll('[data-inspector]')) {
      const active=b.dataset.inspector===state.inspector;
      b.setAttribute('aria-selected',String(active));b.tabIndex=active?0:-1;
    }
    panel.setAttribute('aria-labelledby','reader-tab-'+state.inspector);
    if(state.mode!=='script')return;
    const scene=selected();
    if(state.inspector==='clues') {
      panel.append(panelHeading('이 장면의 단서와 흐름'));
      if(scene.summary)panel.append(clone(scene.summary));
      for(const photo of scene.photos) {
        const fold=node('details','','reader-evidence');
        fold.append(node('summary',text(photo.querySelector('.result-tag'))));
        const body=clone(photo);body.querySelector('.result-tag')?.remove();fold.append(body);panel.append(fold);
      }
    } else if(state.inspector==='learning') {
      panel.append(panelHeading('이 장면의 학습 설계'));
      let count=0;
      for(const page of scene.pages) {
        const found=page.nodes.flatMap(n=>[...n.querySelectorAll('details')]).filter(n=>text(n.querySelector('summary')).startsWith('학습 설계'));
        if(!found.length)continue;
        const group=node('div','','reader-inspector-group');group.append(node('h4',page.label));
        for(const detail of found)for(const child of unwrap(detail))group.append(clone(child));
        panel.append(group);count++;
      }
      if(!count)panel.append(node('p','이 장면은 대화와 행동을 확인하는 장면이야.'));
    } else {
      panel.append(panelHeading('이 장면의 제작 메모'));
      for(const page of scene.pages) {
        const found=page.nodes.flatMap(n=>[...n.querySelectorAll('details')]).filter(n=>text(n.querySelector('summary')).startsWith('제작 메모'));
        if(!found.length)continue;
        const group=node('div','','reader-inspector-group');group.append(node('h4',page.label));
        for(const detail of found)for(const child of unwrap(detail))group.append(clone(child));

  }
  function fillFlow() {
    const canvas=$('reader-canvas');
    if(state.item===0) {
      const box=node('div','','reader-summary');
      const summary=clone(flowItems[0].node);summary.querySelector('.section-head')?.remove();
      summary.lastElementChild?.remove();
      box.append(...summary.children);
      const hero=source.querySelector('.hero');box.append(clone(hero.querySelector('.chips')));
      box.append(clone(hero.querySelector('.lead')),clone(hero.querySelector('figcaption')));
      const note=node('p','금으로 만든 별 하나 · 선물 상자는 숨기는 수단 · 현재 작업은 과거 알리바이가 아님.');box.append(note);
      const b=node('button','해결 흐름도 보기 →','reader-mini');b.type='button';b.dataset.flow='2';box.append(b);

    const toolbar=node('div','','reader-flow-toolbar');
    const b=node('button','확대해서 보기','reader-mini');b.type='button';b.dataset.zoom='toggle';b.setAttribute('aria-pressed','false');

  function render(focusDialogue=false) {
    const current=selected();
    for(const b of root.querySelectorAll('[data-mode]'))b.setAttribute('aria-pressed',String(b.dataset.mode===state.mode));

    $('reader-title').textContent=state.mode==='script'?current.title.replace(/^장면 \d+ · /,'').replace(/^.* — /,''):current.title;

    root.querySelector('[data-details-toggle]').hidden=state.mode!=='script';

      const page=node('div','',state.mode==='script'?'reader-page reader-transcript':'reader-reference');
      const groups=state.mode==='script'?selected().pages:[pages()[state.page]];
      for(const [index,group] of groups.entries()) {
        const block=node('div','',state.mode==='script'?'reader-dialogue-block':'reader-reference-block');
        if(state.mode==='script')block.dataset.dialogueIndex=String(index);

          if(state.mode==='script')for(const detail of c.querySelectorAll('details')) {

    prev.disabled=state.item===0 && (state.mode==='script'||state.page===0);

    prev.textContent=state.mode==='script'?'← 이전 장면':'← 이전';
    next.textContent=state.mode==='prep'?'대본 보기 →':state.mode==='script'?'다음 장면 →':'다음 →';
    $('reader-position').textContent=state.mode==='flow'?(state.item+1)+' / '+items().length:
      state.mode==='script'?'장면 '+(state.item+1)+' / '+items().length:

    fillInspector();
    canvas.scrollTop=state.mode==='script'?(sceneScroll.get(state.item)||0):0;
    if(state.mode==='script' && focusDialogue) {
      const target=canvas.querySelector('[data-dialogue-index="'+state.page+'"]');
      canvas.scrollTop=Math.max(0,(target?.offsetTop||0)-12);
    }
  }
  function restoreRoute() {
    let hash='';try{hash=decodeURIComponent(location.hash.slice(1));}catch{}
    const target=routes.get(hash) || (hash==='flow-truth'?{mode:'flow',item:1,page:0}:null);
    if(target)select(target.mode,target.item,target.page,false);
    else select('flow',0,0,false);
  }
  root.addEventListener('click',event=> {
    const button=event.target.closest('button');
    if(!button)return;
    if(button.dataset.mode) {
      const mode=button.dataset.mode;
      select(mode,mode===state.mode?state.item:lastItems[mode],undefined,true,true);

    }
  });
  document.addEventListener('click',event=> {
    const link=event.target.closest('a[href^="#"]');if(!link)return;

  });

    if(event.altKey||event.ctrlKey||event.metaKey||event.shiftKey||event.target.closest('select,input,textarea,summary'))return;

  });

  // Inspection hook for document verification; it does not change story or game data.
  window.christmasPlanningReader={
    snapshot:()=>({state:{...state},scenes:scenes.map(s=>({id:s.id,pages:s.pages.map(p=>p.anchor)})),routes:[...routes.keys()]}),
    select:(mode,item,page)=>select(mode,item,page),navigate
  };
  restoreRoute();
})();
