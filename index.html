<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>숲속 탐정 Pioo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&family=Jua&display=swap">
<style>
/* base reset (was supplied by the artifact host) */
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}

/* Layout: one phone-sized storybook page.
   Conversation view: the person in front of their place's illustration, notebook (Note) docked underneath.
   Part 2 (investigation): one large illustration per place to swipe around and tap for clues; notebook slides up from the Note tab. */
:root{
  --ground:#E6E9D6;
  --paper:#FBF4E6;
  --paper-2:#F4EAD4;
  --line:#E3D5B8;
  --ink:#4A3628;
  --ink-soft:#7D6A58;
  --moss:#8DB48E;
  --moss-deep:#5E8A63;
  --peach:#F6B89A;
  --honey:#F2CF73;
  --berry:#C96F86;
  --sky:#BFD3EE;
  --ok:#5E8A63;
  --no:#C25B5B;
  --f-display:"Jua","Gowun Dodum",system-ui,sans-serif;
  --f-body:"Gowun Dodum",system-ui,sans-serif;
  --f-hand:"Gaegu","Gowun Dodum",cursive;
  --r-wobble:18px 22px 16px 24px / 22px 16px 24px 18px;
  --r-wobble-2:24px 14px 22px 16px / 16px 24px 14px 22px;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--f-body);display:flex;justify-content:center;overflow:hidden;
  background-image:radial-gradient(circle at 20% 30%,rgba(141,180,142,.18) 0 2px,transparent 3px),radial-gradient(circle at 70% 80%,rgba(242,207,115,.2) 0 2px,transparent 3px);background-size:38px 38px,52px 52px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px dashed var(--berry);outline-offset:2px}
.hidden-svg{position:absolute;width:0;height:0}

.app{position:relative;width:100%;max-width:430px;height:100%;display:flex;flex-direction:column;overflow:hidden;overflow:clip;background:var(--paper)}
@media (min-width:520px){
  body{align-items:center;padding-block:16px}
  .app{height:min(900px,calc(100% - 8px));border:3px solid var(--ink);border-radius:38px 42px 36px 44px/44px 36px 42px 38px;box-shadow:8px 10px 0 rgba(74,54,40,.18)}
}
.main{position:relative;flex:1 1 auto;min-height:0;display:flex;flex-direction:column;overflow:hidden;overflow:clip}

/* ---------- stage ---------- */
.scene{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;display:flex;flex-direction:column}
.stage-area{position:absolute;inset:0;overflow:hidden;background:var(--paper-2)}
.stage-area .art{width:var(--world-width);height:var(--world-height);transform-origin:0 0;pointer-events:none}
.art > .art-floor{display:none}
.stage-area .art-floor,.art-wrap .art > .art-floor{display:block;position:absolute;left:0;top:100%;width:100%;height:auto;pointer-events:none}
.art-wrap .art{height:calc(100% * var(--art-share, 1))}
.stage-area .spot,.stage-area .scene-npc span{display:none}
.stage-area .scene-npc{pointer-events:none}
.ask-panel{position:absolute;left:0;right:0;bottom:0;z-index:4;display:flex;flex-direction:column;gap:8px;padding:4px 16px 16px}
.ask-panel:empty{display:none}
.ask-top{display:flex;justify-content:flex-end}
.ask-panel:not(.show-ko) .ko{display:none}
.ask-panel .q{box-shadow:3px 3px 0 rgba(74,54,40,.25)}
.app.notes-open .ask-panel{display:none}
.app.discovering .ask-panel,.app.discovering #hint{display:none}
.app.investigate .scene{display:none}
.chip{position:absolute;top:12px;display:inline-flex;align-items:center;gap:6px;max-width:calc(100% - 140px);box-sizing:border-box;font-family:var(--f-display);font-size:13px;background:var(--paper);border:2px solid var(--ink);border-radius:var(--r-wobble);padding:4px 10px;z-index:4}
.chip.l{left:14px}
.chip-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip-progress{flex:none;font-size:12px;color:var(--ink-soft);white-space:nowrap}
.map-btn{position:relative}
.map-btn:active{transform:translateY(2px);box-shadow:none}
.map-btn.new::after{content:"";position:absolute;top:-5px;right:-5px;width:12px;height:12px;border-radius:50%;background:var(--berry);border:2px solid var(--paper)}
button.chip{color:var(--ink);cursor:pointer;box-shadow:2px 2px 0 rgba(74,54,40,.2)}
button.chip:disabled{cursor:default;box-shadow:none}
.scene-npc .m-open{opacity:0}
.scene-npc.talking .m-open{opacity:1;transform-box:fill-box;transform-origin:center;animation:chat .18s ease-in-out infinite alternate}
.scene-npc.talking .m-closed{opacity:0}
@keyframes chat{from{transform:scaleY(.35)}to{transform:scaleY(1)}}
.npc-breathe,.npc-gesture{transform-box:fill-box;transform-origin:50% 100%}
.npc-breathe{animation:npc-breathe 4.8s ease-in-out infinite;animation-delay:var(--idle-delay,0s)}
.scene-npc.talking .npc-gesture{animation:npc-speak 1.7s ease-in-out infinite}
.npc-mouth{opacity:0;pointer-events:none}
.scene-npc.talking .npc-mouth{animation:npc-mouth var(--talk-cycle,.74s) steps(1,end) infinite}
.npc-mouth-shape{transform:scaleY(var(--mouth-open,.7));transform-origin:0 0}
@keyframes npc-breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.008,1.012)}}
@keyframes npc-speak{0%,100%{transform:rotate(0)}28%{transform:rotate(-.35deg)}65%{transform:rotate(.3deg)}}
@keyframes npc-mouth{0%,43%,85%,100%{opacity:0;--mouth-open:.2}12%,57%{opacity:1;--mouth-open:.55}25%,70%{opacity:1;--mouth-open:1}}
.app.partner .bubble{left:16px;transform:none;animation:pop-side .25s ease-out}
.app.partner .bubble::after{left:70px}
@keyframes pop-side{from{transform:scale(.85);opacity:0}}
/* phase title card (case start / each suspect coming in) */
.app.ending .chip,.app.ending #hint{visibility:hidden}
/* the map/Note bar is gone during the ending, so the scene runs to the bottom edge */
.app.ending .nav{display:none}
.end-tools{display:flex;justify-content:flex-end;gap:8px}
.end-ko{margin:0;background:var(--paper);border:2px solid var(--ink);border-radius:12px;padding:8px 12px;font-size:14px;line-height:1.45;box-shadow:2px 3px 0 rgba(74,54,40,.2)}
.ask-panel .end-leave{align-self:center}
/* a photo held up to the suspect */
.presented{position:absolute;inset:0;z-index:7;display:grid;place-items:center;pointer-events:none}
.presented figure{margin:0;width:64%;aspect-ratio:4/3;overflow:hidden;background:#FFFDF7;border:7px solid #FFFDF7;box-shadow:0 10px 24px rgba(40,30,24,.4);animation:present-in 1.3s ease forwards}
.presented svg{display:block;width:100%;height:100%}
@keyframes present-in{0%{opacity:0;transform:translateY(70px) rotate(-3deg) scale(.8)}22%{opacity:1;transform:translateY(0) rotate(-3deg) scale(1)}80%{opacity:1;transform:rotate(-3deg)}100%{opacity:0;transform:translateY(-12px) rotate(-3deg)}}
/* CASE CLOSED: the case file gets its stamp */
.case-closed{position:absolute;inset:0;z-index:8;display:grid;place-items:center;background:rgba(40,30,24,.45);pointer-events:none;animation:cc-fade 2.6s ease forwards}
.cc-file{position:relative;width:min(76%,290px);padding:34px 18px 64px;text-align:center;background:var(--paper);border:3px solid var(--ink);border-radius:var(--r-wobble);box-shadow:5px 6px 0 rgba(40,30,24,.3);transform:rotate(-1.5deg)}
.cc-file small{display:block;font-size:12px;color:var(--ink-soft)}
.cc-file b{display:block;font-family:var(--f-display);font-weight:400;font-size:24px}
.cc-stamp{position:absolute;left:50%;bottom:16px;font-family:var(--f-display);font-size:26px;letter-spacing:1px;color:#B8433F;border:4px solid #B8433F;border-radius:10px;padding:2px 12px;white-space:nowrap;transform:translateX(-50%) rotate(-10deg);animation:cc-stamp .45s cubic-bezier(.2,1.6,.4,1) .55s both}
@keyframes cc-stamp{from{opacity:0;transform:translateX(-50%) rotate(-10deg) scale(2.4)}to{opacity:.92;transform:translateX(-50%) rotate(-10deg) scale(1)}}
@keyframes cc-fade{0%{opacity:0}10%{opacity:1}86%{opacity:1}100%{opacity:0}}
@media(prefers-reduced-motion:reduce){.presented figure,.cc-stamp{animation:none}}
.stage-card{position:absolute;inset:0;z-index:8;display:grid;place-items:center;background:rgba(74,54,40,.38);pointer-events:none;animation:stage-card 1.9s ease forwards}
.stage-card div{background:var(--paper);border:3px solid var(--ink);border-radius:var(--r-wobble);padding:12px 22px;text-align:center;box-shadow:4px 5px 0 rgba(74,54,40,.25)}
.stage-card small{display:block;font-size:12px;color:var(--ink-soft)}
.stage-card b{display:block;font-family:var(--f-display);font-weight:400;font-size:24px}
@keyframes stage-card{0%{opacity:0}12%{opacity:1}78%{opacity:1}100%{opacity:0}}
.pill.blue{background:var(--sky);color:var(--ink)}

.bubble{position:absolute;left:50%;top:44px;transform:translateX(-50%);z-index:5;width:max-content;max-width:min(88%,340px);background:#FFFDF7;border:2.5px solid var(--ink);border-radius:var(--r-wobble-2);padding:10px 14px;font-family:var(--f-hand);font-size:19px;line-height:1.25;box-shadow:3px 4px 0 rgba(74,54,40,.18);animation:pop .25s ease-out}
.bubble::after{content:"";position:absolute;left:50%;bottom:-13px;width:20px;height:20px;background:#FFFDF7;border-right:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);transform:translateX(-50%) rotate(45deg) skew(8deg,8deg)}
.bubble .tag{display:block;font-family:var(--f-display);font-size:11px;color:var(--berry);margin-bottom:2px}
.bubble button{position:absolute;top:2px;right:6px;border:0;background:none;font-size:16px;line-height:1;padding:4px;color:var(--ink-soft)}
@keyframes pop{from{transform:translateX(-50%) scale(.85);opacity:0}}

/* ---------- docked notebook (Note) ---------- */
/* Note = a notebook the detective pulls up from the bottom (sketch 3) */
/* The case-file picture (assets/ui/casefile-panel.webp: navy folder with one cream sheet, header strip
   at the top, paper clip top right) is scaled to the panel width, so the padding and the header height
   are % of the width (padding % always refers to width): sheet top 7.9%, header strip 13.6%, sheet
   from 6.5% to 93.8%. */
.dock{position:absolute;left:6px;right:6px;bottom:-4px;height:60%;z-index:11;display:flex;flex-direction:column;box-sizing:border-box;padding:7.9% 9% 0 9.5%;transform:translateY(calc(100% + 48px));transition:transform .55s cubic-bezier(.2,.9,.3,1.05)}
/* the picture is a ::before layer so the index tabs (z-index -1) can sit behind it and peek over the folder */
.dock::before{content:"";position:absolute;inset:0;z-index:0;background:url(assets/ui/casefile-panel.webp) top center/100% auto no-repeat;pointer-events:none}
.dock-head,.dock-body{position:relative;z-index:1}
.app.notes-open .dock{transform:translateY(0)}
.app.investigate .dock{height:80%}
.dock-head{flex:none;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:6px 8px;aspect-ratio:81.5 / 13.6;padding:0 2px}
.dock-head h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:18px;display:flex;align-items:center;gap:6px}
.dock-head h2 svg{width:24px;height:24px}
.dock-head .finish{margin-left:auto;padding:6px 14px;background:var(--moss);font-size:15px}
.dock-head .finish[hidden]{display:none}
/* behind the open notebook the scene darkens toward the bottom, so the notebook stands out from
   warm floors while the NPC's face at the top stays clear */
.note-scrim{position:absolute;inset:0;z-index:10;opacity:0;pointer-events:none;transition:opacity .45s;background:linear-gradient(to bottom,rgba(43,30,20,0) 25%,rgba(43,30,20,.45) 75%)}
.app.notes-open .note-scrim{opacity:1;pointer-events:auto}
.app.notes-open .chip,.app.notes-open .bubble{z-index:12}
/* horizontal notebook tabs: the case file + one per person */
/* Tabs: hand-drawn white paper tabs (assets/ui/tab-1…6.png, cycled) tinted with each page's colour:
   the PNG masks the button and is multiplied over --tab-bg, keeping the pencil outline and grain. */
.who{position:absolute;z-index:-1;bottom:100%;margin-bottom:calc(-2.8% - 14px);left:7%;right:22%;display:flex;align-items:flex-end;gap:4px;min-width:0;overflow-x:auto;padding:4px 2px 0;scrollbar-width:none}
.who::-webkit-scrollbar{display:none}
.who:empty{display:none}
.who button{--tab:url(assets/ui/tab-1.png);flex:none;width:46px;height:44px;padding:0;border:0;position:relative;background:var(--tab-bg,var(--paper-2));display:grid;place-items:center;-webkit-mask:var(--tab) center/100% 100% no-repeat;mask:var(--tab) center/100% 100% no-repeat}
.who button:nth-child(6n+2){--tab:url(assets/ui/tab-2.png)}
.who button:nth-child(6n+3){--tab:url(assets/ui/tab-3.png)}
.who button:nth-child(6n+4){--tab:url(assets/ui/tab-4.png)}
.who button:nth-child(6n+5){--tab:url(assets/ui/tab-5.png)}
.who button:nth-child(6n+6){--tab:url(assets/ui/tab-6.png)}
.who button::before{content:"";position:absolute;inset:0;background:var(--tab) center/100% 100% no-repeat;mix-blend-mode:multiply;pointer-events:none}
.who button > *{position:relative}
.who button[aria-pressed="true"]{background:var(--honey);height:52px}
.who button svg{margin-bottom:10px}
.who button:disabled{cursor:default;filter:grayscale(1);opacity:.45}
.who button svg{width:24px;height:24px;display:block;border-radius:50%}
.dock-body{flex:1;min-height:0;overflow-y:auto;padding:12px 2px 18px;display:flex;flex-direction:column;gap:12px}
/* writing goes straight onto the notebook page: no separate card, keep the pink margin line */
.dock .note-page{background:none;border:0;border-radius:0;padding-left:4px}
.dock-head .listen{flex-wrap:nowrap}
.dock-head .listen[hidden]{display:none}
.dock-head .listen .pill{padding:5px 10px;font-size:13px}
.note-page{position:relative}
.note-page.checked::after{content:"확인됨";position:absolute;top:2px;right:4px;transform:rotate(-10deg);border:3px solid var(--no);border-radius:8px;padding:1px 10px;color:var(--no);font-family:var(--f-display);font-size:18px;opacity:.8;pointer-events:none}
/* checking a finished conversation: the notebook rises to the top (tabs stay visible above it) */
.app.note-full .dock{height:calc(100% - 50px)}
.app.note-full .pill.hint,.app.note-full .chip,.app.note-full .bubble{visibility:hidden}
.note-page.checked::after{animation:stamp-in .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes stamp-in{from{transform:rotate(-10deg) scale(1.8);opacity:0}}
.replay-q{display:inline-grid;place-items:center;width:22px;height:22px;margin-left:6px;padding:0;vertical-align:middle;border:1.5px solid var(--ink);border-radius:50%;background:var(--paper)}
.replay-q svg{width:10px;height:10px}
.review{gap:14px}
.rv-stars{font-size:30px;line-height:1;letter-spacing:4px;color:#E0A526}
.rv-person{display:flex;flex-direction:column;gap:10px;padding-top:10px;border-top:2px dashed var(--line)}
.rv-person h3{margin:0;display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:400;font-size:17px}
.rv-person h3 .mini{width:30px;height:30px}
.rv-person h3 small{margin-left:auto;font-size:13px;color:var(--ink-soft)}
.rv-q{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.rv-label{font-size:11px;color:var(--ink-soft)}
.mcard .rv-en{font-family:var(--f-hand);font-size:18px;line-height:1.35}
.mcard .rv-ko{font-size:13px;color:var(--ink-soft)}
.rv-notes{font-family:var(--f-hand);font-size:17px;line-height:1.45;background:#FFFDF7;border:1.5px solid var(--line);border-radius:10px;padding:6px 10px;align-self:stretch}
.rv-notes .ok{color:var(--ok)}
.rv-notes s{color:var(--no)}
.rv-notes .fix{color:var(--ok);text-decoration:underline}
.evidence-page{display:flex;flex-direction:column;gap:18px}
.evidence-page h3{margin:0;font-family:var(--f-display);font-size:18px;font-weight:400}
.evidence-card{padding:10px;background:#FFFDF7;border:2px solid var(--ink);border-radius:5px;box-shadow:3px 4px 0 rgba(74,54,40,.12)}
.evidence-photo{margin:0 0 10px;aspect-ratio:4/3;overflow:hidden;border:1px solid var(--line);background:var(--paper-2)}
.evidence-photo svg{display:block;width:100%;height:100%}
.evidence-card h4{margin:4px 0;font-family:var(--f-hand);font-size:23px}
.evidence-card .place{font-family:var(--f-hand);font-size:16px;color:var(--ink-soft)}
.evidence-card p{margin:8px 0;font-size:16px;line-height:1.5}
.evidence-card .ko{font-size:14px;color:var(--ink-soft)}
.capture-flash{position:absolute;inset:0;z-index:7;background:#fff;pointer-events:none;animation:shutter-flash .38s ease-out forwards}
.capture-view{position:absolute;inset:0;z-index:6;display:grid;place-items:center;background:rgba(30,28,24,.72);overflow:hidden}
.capture-frame{width:calc(100% - 32px);max-width:520px;aspect-ratio:4/3;border:3px solid #FFFDF7;border-radius:6px;overflow:hidden;box-shadow:0 8px 28px #0005;animation:evidence-zoom .45s ease-out both}
.capture-frame svg{display:block;width:100%;height:100%;background:var(--paper)}
@keyframes evidence-zoom{from{transform:scale(.6);opacity:.3}to{transform:scale(1);opacity:1}}
@keyframes shutter-flash{0%{opacity:0}15%{opacity:.78}100%{opacity:0}}
@media(prefers-reduced-motion:reduce){.capture-flash{animation:none;opacity:0}}
@media(prefers-reduced-motion:reduce){.capture-frame{animation:none}}

.choices{border:2.5px solid var(--ink);border-radius:var(--r-wobble-2);background:#EAF2E2;padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px;animation:rise .35s cubic-bezier(.3,1.2,.5,1)}
@keyframes rise{from{transform:translateY(16px);opacity:0}}
.choices .say{font-family:var(--f-display);font-size:14px;display:flex;align-items:center;gap:6px}
.choices .say .pill{margin-left:auto}
.choices:not(.show-ko) .ko{display:none}
.q{width:100%;display:grid;grid-template-columns:28px 1fr;align-items:center;gap:10px;text-align:left;background:#FFFDF7;border:2px solid var(--ink);border-radius:var(--r-wobble);padding:7px 12px 7px 8px;box-shadow:2px 3px 0 rgba(74,54,40,.18)}
.q:active{transform:translateY(2px);box-shadow:none}
.q .n{width:26px;height:26px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-family:var(--f-display);font-size:13px;background:var(--peach)}
/* a question to ask again after a wrong check: blue number */
.q.again .n{background:var(--sky)}
.q .en{display:block;font-family:var(--f-hand);font-weight:700;font-size:19px;line-height:1.1}
.q .ko{display:block;font-size:12px;color:var(--ink-soft);margin-top:2px}

.listen{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--ink);background:var(--paper);border-radius:var(--r-wobble);padding:6px 12px;font-family:var(--f-display);font-size:14px;box-shadow:2px 3px 0 rgba(74,54,40,.2);transition:transform .1s}
.pill:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(74,54,40,.2)}
.pill svg{width:16px;height:16px;flex:none}
.pill.sm{padding:3px 10px;font-size:12px}
.pill[aria-pressed="true"]{background:var(--sky)}
.pill.hint{position:absolute;top:9px;right:14px;z-index:12;box-sizing:border-box;min-height:36px;padding:4px 9px;font-size:13px;background:var(--honey)}
.pill:disabled{opacity:.5;cursor:default}
.acorns{display:inline-flex;gap:2px}
.acorns svg{width:15px;height:15px}
.acorns .used{opacity:.25}

.note-page{background-color:#FFFDF7;background-image:linear-gradient(to right,transparent 30px,rgba(201,111,134,.45) 30px 32px,transparent 32px);border:2px solid var(--ink);border-radius:var(--r-wobble-2);padding:8px 12px 10px 42px;display:flex;flex-direction:column;gap:6px}
.nblock{border-radius:10px;padding:2px 6px;margin-left:-6px}
.nblock.now{background:rgba(242,207,115,.28)}
.nblock .qlabel{display:block;font-size:11px;color:var(--ink-soft);padding-top:4px}
.question-state{display:inline-flex;align-items:center;gap:4px;margin:6px 0 2px;padding:2px 8px;border-radius:12px;font-family:var(--f-display);font-size:12px;line-height:1.5}
.question-state.ok{background:#E8EFDD;color:#466249}
.question-state.review{background:#F8EAC4;color:#816124}
.blank.review{border-bottom-color:#BC9854;border-bottom-style:dotted}
.nline{font-family:var(--f-hand);font-size:20px;line-height:38px;min-height:38px;background-image:linear-gradient(to top,var(--line) 0 2px,transparent 2px)}
.empty-note{font-size:13px;color:var(--ink-soft);line-height:1.6;padding-block:8px}
/* written answers are in neutral pen ink; a check strikes through only the wrong ones */
.blank{font:inherit;font-weight:700;color:#34506E;border:0;border-bottom:2.5px dashed var(--ink-soft);background:transparent;min-width:3.5em;padding:0 4px;margin:0 2px;text-align:center;border-radius:0}
.blank:focus{outline:none;background:rgba(242,207,115,.35)}
.blank.hot{background:rgba(141,180,142,.35)}

.spot{position:absolute;padding:0;border:0;background:transparent;border-radius:16px;cursor:zoom-in}
.tapfx{position:absolute;pointer-events:none;transform:translate(-50%,-50%);animation:tapfx .9s ease-out forwards;white-space:nowrap}
.tapfx.miss{font-family:var(--f-hand);font-weight:700;font-size:18px;color:var(--ink);background:rgba(255,253,247,.85);border-radius:10px;padding:0 8px}

.inv-empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;font-family:var(--f-display);font-size:15px;color:var(--ink-soft)}
.people-here{display:flex;flex-direction:column;gap:6px}
.people-here .lbl{font-family:var(--f-display);font-size:12px;color:var(--ink-soft)}
.people-row{display:flex;gap:8px;flex-wrap:wrap}
.person{display:flex;align-items:center;gap:6px;border:2px solid var(--ink);border-radius:var(--r-wobble);background:#FFFDF7;padding:3px 12px 3px 3px;font-family:var(--f-hand);font-weight:700;font-size:17px;box-shadow:2px 2px 0 rgba(74,54,40,.2)}

/* ---------- bottom navigation ---------- */
.nav{flex:none;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:center;gap:10px;padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:3px solid var(--ink);background:var(--paper-2);position:relative;z-index:20}

.tab svg{width:24px;height:24px;flex:none}

/* ---------- sheets ---------- */
.sheet{position:absolute;left:0;right:0;bottom:0;height:86%;z-index:10;background:var(--paper);border-top:3px solid var(--ink);border-radius:28px 32px 0 0/26px 30px 0 0;box-shadow:0 -6px 0 rgba(74,54,40,.12);transform:translateY(104%);transition:transform .32s cubic-bezier(.3,1.2,.5,1);display:flex;flex-direction:column}

/* it grows out of the button that opened it, in that button's rounded shape (--t/--r/--b/--l = the button's edges, set in JS) */
/* container transform: the frame grows out of the map button while the map picture zooms up from

.sheet.full.open .map-stage{transform:none;opacity:1;transition:transform .56s cubic-bezier(.2,0,0,1),opacity .18s linear}
.sheet.full .map-head,.sheet.full .map-foot{opacity:0;transition:opacity .12s}

/* the map picture (9:16) covers the whole screen; the title and the footer float over it */
.map-head{position:absolute;top:0;left:0;right:0;z-index:1;display:flex;align-items:center;gap:10px;padding:12px 16px 24px;background:linear-gradient(rgba(251,244,230,.85),rgba(251,244,230,0))}
.map-head h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:17px;line-height:1.2;color:var(--ink)}
.map-head .x{margin-left:auto;border:2px solid var(--ink);background:var(--paper);width:36px;height:36px;border-radius:50%;font-size:18px;line-height:1}
.map-stage{position:absolute;inset:0;overflow:hidden;container-type:size;background:#7FA06A}
.map{position:absolute;left:50%;top:50%;width:max(100cqw, 100cqh * 9 / 16);aspect-ratio:9 / 16;transform:translate(-50%,-50%)}
.map-art{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
.map-empty{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);margin:0;background:rgba(251,244,230,.92);border:2px dashed var(--ink-soft);border-radius:14px;padding:8px 14px;font-size:13px;color:var(--ink-soft);white-space:nowrap}
.map-foot{position:absolute;left:0;right:0;bottom:0;z-index:1;display:flex;flex-direction:column;gap:4px;padding:28px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(rgba(251,244,230,0),rgba(251,244,230,.9) 45%)}
.pin{position:absolute;transform:translate(-50%,-50%);border:2px solid var(--ink);background:var(--paper);border-radius:var(--r-wobble);padding:4px 10px;font-family:var(--f-display);font-size:13px;white-space:nowrap;box-shadow:2px 2px 0 rgba(74,54,40,.25);display:flex;flex-direction:column;align-items:center;gap:3px}
.pin.crime{background:var(--berry);color:#FFFDF7}
/* a place that has just become known: the pin pops out, then a honey ring pulses around it */
.pin.fresh{animation:pin-pop .6s cubic-bezier(.22,.7,.25,1) .5s both;z-index:2}
.pin.fresh::after{content:"";position:absolute;inset:-7px;border:2px solid var(--honey);border-radius:20px;opacity:0;pointer-events:none;animation:pin-ring 1.2s ease-out 1.1s 2}
@keyframes pin-pop{from{transform:translate(-50%,-50%) scale(0)}to{transform:translate(-50%,-50%) scale(1)}}
@keyframes pin-ring{0%{opacity:1;transform:scale(.92)}100%{opacity:0;transform:scale(1.45)}}
@media(prefers-reduced-motion:reduce){.pin.fresh,.pin.fresh::after{animation:none}.pin.fresh{box-shadow:0 0 0 4px var(--honey)}}
.pin-label{display:flex;align-items:center;gap:4px}
.pin .done{font-style:normal;font-size:11px;background:var(--moss);color:var(--ink);border:1.5px solid var(--ink);border-radius:50%;width:16px;height:16px;display:grid;place-items:center}
.pin-people{display:flex;gap:2px}
.pin-people .mini{width:24px;height:24px;border-width:1.5px}

/* ---------- modals ---------- */
.modal{position:absolute;inset:0;z-index:40;background:rgba(74,54,40,.38);display:grid;place-items:center;padding:16px}
.modal[hidden]{display:none!important}
.mcard{width:100%;max-width:370px;max-height:100%;overflow-y:auto;background:var(--paper);border:3px solid var(--ink);border-radius:26px 30px 24px 32px/30px 24px 32px 26px;padding:18px 18px 16px;box-shadow:5px 6px 0 rgba(74,54,40,.25);display:flex;flex-direction:column;gap:12px}
.mcard h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:24px;text-wrap:balance}
.mcard p{margin:0;line-height:1.6;font-size:14px}
.eyebrow{font-family:var(--f-hand);font-weight:700;font-size:18px;color:var(--berry)}
.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;counter-reset:s}
.steps li{display:grid;grid-template-columns:26px 1fr;gap:8px;font-size:13px;line-height:1.45;counter-increment:s}
.steps li::before{content:counter(s);width:24px;height:24px;border-radius:50%;border:2px solid var(--ink);background:var(--honey);display:grid;place-items:center;font-family:var(--f-display);font-size:12px}
/* case select: the first screen — a case notebook with one folder card per case */
.cases{box-sizing:border-box;position:absolute;inset:0;z-index:35;overflow-x:hidden;display:flex;flex-direction:column;gap:18px;padding:28px 16px calc(18px + env(safe-area-inset-bottom,0px));overflow-y:auto;background-color:var(--paper);
  background-image:radial-gradient(circle at 20% 30%,rgba(141,180,142,.16) 0 2px,transparent 3px),radial-gradient(circle at 70% 80%,rgba(242,207,115,.18) 0 2px,transparent 3px);background-size:38px 38px,52px 52px}
.cases-head h1{margin:2px 0 0;font-family:var(--f-hand);font-weight:700;font-size:36px;line-height:1}
.case-list{display:flex;flex-direction:column;gap:22px;padding-top:6px}
.case-card{box-sizing:border-box;position:relative;display:grid;grid-template-columns:104px 1fr;gap:14px;align-items:center;width:100%;text-align:left;border:2.5px solid var(--ink);border-radius:6px 18px 16px 20px/6px 20px 16px 18px;background:#FFFDF7;padding:12px;box-shadow:3px 4px 0 rgba(74,54,40,.2)}
.case-card::before{content:"";position:absolute;top:-13px;left:14px;width:64px;height:13px;background:inherit;border:2.5px solid var(--ink);border-bottom:0;border-radius:9px 9px 0 0}
.case-card:not(.locked):active{transform:translateY(2px);box-shadow:1px 2px 0 rgba(74,54,40,.2)}
.case-thumb{width:104px;height:78px;border:2px solid var(--ink);border-radius:10px;overflow:hidden;background:var(--paper-2);display:grid;place-items:center}
.case-thumb svg{width:100%;height:100%;display:block}
.case-no{display:block;font-family:var(--f-display);font-size:12px;color:var(--berry)}
.case-title{display:block;font-family:var(--f-hand);font-weight:700;font-size:25px;line-height:1.1;margin:2px 0 8px}
.badge.st-new{background:var(--honey)}
.badge.st-going{background:var(--sky)}
.badge.st-solved{background:var(--moss)}
.case-card.locked{background:var(--paper-2);border-style:dashed;box-shadow:none;color:var(--ink-soft);cursor:default}
.case-card.locked::before{border-style:dashed}
.case-card.locked .case-thumb{border-style:dashed;background:transparent}
.case-card.locked .case-thumb svg{width:34px;height:34px}
.case-card.locked .case-no{color:var(--ink-soft)}
.case-lock{display:block;font-size:12px}
.cases .linkbtn{margin-top:auto}
.map-links{display:flex;justify-content:center;gap:14px}
.linkbtn{border:0;background:none;padding:4px;text-decoration:underline;font-size:12px;color:var(--ink-soft);align-self:center}
/* tutorial: one step per page, picture guide on top */
.tut{gap:12px}
.tut-top{display:flex;align-items:center;gap:8px}
.tut-count{font-family:var(--f-display);font-size:12px;color:var(--ink-soft)}
.tut-skip{margin-left:auto;border:0;background:none;font-size:12px;color:var(--ink-soft);text-decoration:underline;padding:4px}
.tut-fig{border:2px solid var(--ink);border-radius:var(--r-wobble-2);background:#F3ECDD;overflow:hidden}
.tut-fig svg{display:block;width:100%;height:auto;animation:tutin .3s ease-out}
@keyframes tutin{from{opacity:0;transform:translateY(8px)}}
.tut h2{font-size:22px}
.tut p{font-size:14px;line-height:1.65}
.tut-dots{display:flex;justify-content:center;gap:6px}
.tut-dots i{width:8px;height:8px;border-radius:5px;background:var(--paper);border:1.5px solid var(--ink);transition:width .2s}
.tut-dots i.on{width:22px;background:var(--berry)}
.tut-nav{display:flex;gap:8px}
.tut-nav .big{flex:1;width:auto}
.tut-fig .pulse{transform-box:fill-box;transform-origin:center;animation:tpulse 1.4s ease-in-out infinite}
@keyframes tpulse{0%,100%{transform:scale(.85);opacity:.95}50%{transform:scale(1.2);opacity:.35}}
.tut-fig .wave{animation:twave 1.2s ease-in-out infinite}
.tut-fig .wave.w2{animation-delay:.2s}
.tut-fig .wave.w3{animation-delay:.4s}
@keyframes twave{0%,100%{opacity:.15}50%{opacity:1}}
.tut-fig .drag{animation:tdrag 3.4s ease-in-out infinite}
.tut-fig .drag2{animation:tdrag2 3.4s ease-in-out infinite}
@keyframes tdrag2{0%,15%{transform:translate(0,0)}55%,85%{transform:translate(116px,-46px)}100%{transform:translate(0,0)}}
@keyframes tdrag{0%,15%{transform:translate(0,0)}55%,85%{transform:translate(121px,-90px)}100%{transform:translate(0,0)}}
.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pick button{border:2.5px solid var(--ink);border-radius:var(--r-wobble);background:#FFFDF7;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-family:var(--f-hand);font-weight:700;font-size:16px}
.pick .mini{width:58px;height:58px}

.toast{position:absolute;left:50%;top:58px;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:14px;font-size:13px;max-width:86%;text-align:center;pointer-events:none;transition:opacity .25s}
.toast[hidden]{display:block!important;opacity:0}
.toast.discovery-toast{background:var(--paper);color:var(--ink);border:1.5px solid rgba(74,54,40,.3);box-shadow:0 3px 12px rgba(74,54,40,.12)}

/* test tool outside the frame: left of the phone on wide screens, small top-right badge on phones */
.devtools{position:fixed;z-index:200;top:16px;right:16px;display:flex;gap:6px}
.devbtn[aria-pressed="true"]{background:var(--honey)}
.devbtn{border:2px dashed var(--ink);background:var(--paper-2);color:var(--ink);border-radius:12px;padding:6px 10px;font-family:var(--f-display);font-size:12px;opacity:.9}
@media (min-width:520px){
  .devtools{right:auto;left:16px;flex-direction:column;gap:8px}
  .devbtn{font-size:14px;padding:8px 14px}
}

  const length = text.length * (S.slow ? 95 : 70) + 500;

  if(src){
    clip.src = src;
    clip.preservesPitch = true;
    clip.playbackRate = S.slow ? .75 : 1;
    clip.addEventListener('ended', done, { once:true });

  // No recording: browser TTS. If it never starts (no voices, e.g. inside an app preview), the person
  // still moves their mouth for about as long as the line would take, so the scene reads as speech.
  const mime = () => {

    top = height * (notes ? .42 : .76) - worldHeight * Math.max(...group.map(id => positionOf(id).floor)) / 100 * scale;
  }
  top ??= height * headTop - worldHeight * (position.floor - position.height) / 100 * scale;
  const left = Math.min(0, Math.max(width - worldWidth * scale, width / 2 - worldWidth * centerX / 100 * scale));
  top = Math.min(0, Math.max(height - fullHeight * scale, top));
  const bounds = viewport.getBoundingClientRect();
  const from = fromRect?.width ? `translate(${fromRect.left - bounds.left}px, ${fromRect.top - bounds.top}px) scale(${fromRect.width / worldWidth})`

  animateCamera(art, from, `translate(${left}px, ${top}px) scale(${scale})`);
}

  clearTimeout(greetingTimer);

  if(p.hints <= 0) return toast(`${cur().name}에게 쓸 힌트를 다 썼어요.`);
  p.hints--; p.revealed.add(qid); showBubble(qid); renderDock();

const norm = s => s.toLowerCase().replace(/[.'’,!]/g,'').replace(/\s+/g,' ').trim().replace(/\s?pm$/,'');
function finishRecord(){
  if(S.investigate || st().phase !== 'record' || S.view !== S.cur) return;
  const p = st();
  const qid = p.recording;
  const blanks = [...document.querySelectorAll(`.nblock[data-q="${qid}"] .blank`)];
  const empty = blanks.filter(b => !b.value.trim());
  if(empty.length){ empty[0].focus(); return toast(`빈칸 ${empty.length}개가 남았어요. 모두 채워야 기록이 끝나요.`); }
  const answers = blanksOf(S.cur, [qid]);
  recordFirst(S.cur, qid);
  const correct = answers.every(isRight);
  p.questionChecks[qid] = correct ? 'ok' : 'review';
  answers.forEach(answer => {
    if(correct) p.marks[answer.id] = 'ok';
    else if(!isRight(answer)) p.marks[answer.id] = 'review';
    else delete p.marks[answer.id];
  });
  hideBubble();
  stopVoice();
  if(!correct){
    if(!p.retry.includes(qid)) p.retry.push(qid);
    renderDock();
    return;
  }
  p.retry = p.retry.filter(question => question !== qid);
  p.recording = null;
  p.phase = qs(cur()).every(question => p.questionChecks[question.id] === 'ok') ? 'done' : 'choose';
  const revealed = unlock(cur().unlocks?.[qid], true) || {};
  pendingPins.push(...(revealed.places || []));
  pendingPeople.push(...(revealed.people || []));
  if(p.phase === 'done') checkNotes(S.cur);
  p.feedback = qid;
  renderDock();
  const speakerId = S.cur;
  clearTimeout(stampTimer);
  stampTimer = setTimeout(() => {
    if(S.cur !== speakerId || p.feedback !== qid || S.investigate) return;
    setNotes(false);
    revealDiscoveries();
  }, 1800);
}
// What the header button does on the page being viewed.
function noteMode(){
  if(S.view === 'evidence') return null;
  const p = per(S.view);
  if(noteRaised && p.checked && !p.feedback) return 'summary';
  if(S.view === S.cur && !S.investigate && p.phase === 'record') return 'record';
  return null;
}
const BLANK_RE = /\{\{(\w+)\|([^}]+)\}\}/g;
// Every blank on a person's page, in the order the questions were asked.
function blanksOf(id, qids = per(id).order){
  const s = spk(id), p = per(id), out = [];
  qids.forEach(qid => s.notes[qid].forEach(line => line.replace(BLANK_RE, (m, bid, ans) => {
    out.push({ qid, id:bid, ans, value:p.notes[bid] || '' }); return m;
  })));
  return out;
}
const isRight = b => b.ans.split('/').map(norm).includes(norm(b.value));
function recordFirst(id, qid){
  const p = per(id);
  const questions = qid ? [qid] : p.order;
  questions.forEach(question => {
    if(p.firstQuestions[question]) return;
    const answers = blanksOf(id, [question]), wrong = answers.filter(answer => !isRight(answer));
    p.firstQuestions[question] = {ok:answers.length - wrong.length, total:answers.length};
    Object.assign(p.firstWrong, Object.fromEntries(wrong.map(answer => [answer.id, answer.value])));
  });
  p.first = Object.values(p.firstQuestions).reduce((total, result) => ({ok:total.ok + result.ok, total:total.total + result.total}), {ok:0, total:0});
}
function checkNotes(id){
  const p = per(id);
  if(!qs(spk(id)).every(question => p.questionChecks[question.id] === 'ok')) return;
  p.feedback = null;
  p.checked = true;
}

  input.value = word; input.size = Math.max(5, word.length+1); input.classList.remove('ok','no');

let drag = null;
function dragStart(e){
  const w = e.target.closest('.word'); if(!w) return;
  drag = { w, x:e.clientX, y:e.clientY, ghost:null, hot:null, id:e.pointerId };
  w.setPointerCapture(e.pointerId);
}
function dragMove(e){
  if(!drag || e.pointerId !== drag.id) return;
  if(!drag.ghost){
    if(Math.hypot(e.clientX-drag.x, e.clientY-drag.y) < 6) return;
    drag.ghost = drag.w.cloneNode(true); drag.ghost.classList.add('ghost'); drag.ghost.classList.remove('sel');
    $('#app').appendChild(drag.ghost);
  }
  drag.ghost.style.left = e.clientX+'px'; drag.ghost.style.top = e.clientY+'px';
  const under = document.elementFromPoint(e.clientX, e.clientY);
  const hot = under && under.closest ? under.closest('.blank') : null;
  if(drag.hot && drag.hot !== hot) drag.hot.classList.remove('hot');
  if(hot) hot.classList.add('hot');
  drag.hot = hot;
}
function dragEnd(e){
  if(!drag || e.pointerId !== drag.id) return;
  const word = drag.w.dataset.w;
  if(drag.ghost){
    drag.ghost.remove();
    if(drag.hot){ drag.hot.classList.remove('hot'); fillBlank(drag.hot, word); }
    clearSel();
  } else if(e.type === 'pointerup'){
    const was = S.sel === word; clearSel();
    if(!was){ S.sel = word; drag.w.classList.add('sel'); toast(`'${word}' 카드를 골랐어요. 빈칸을 눌러 넣으세요.`); }
  }
  drag = null;
}

// Only places a character has mentioned appear on the map.
function renderPlaces(){
  const map = $('#map');
  map.querySelectorAll('.pin').forEach(p => p.remove());
  const known = PLACES.filter(pl => S.known.has(pl.id));
  $('#mapEmpty').hidden = known.length > 0;
  known.forEach(pl => {
    const done = S.found[pl.id].size === pl.clues.length, people = peopleAt(pl.id);
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'pin' + (pl.crime ? ' crime' : '') + (freshPins.has(pl.id) ? ' fresh' : '');
    b.style.left = pl.x + '%'; b.style.top = pl.y + '%';
    b.innerHTML = `<span class="pin-label">${esc(pl.label)}${done ? '<i class="done">✓</i>' : ''}</span>` +
      (people.length ? `<span class="pin-people">${people.map(id => `<span class="mini" style="background:${spk(id).bg}">${miniSVG(id)}</span>`).join('')}</span>` : '');
    b.setAttribute('aria-label', [pl.label, done ? '모두 살펴봄' : '', ...people.map(id => spk(id).name)].filter(Boolean).join(', '));
    b.onclick = () => enterPlace(pl.id);
    map.appendChild(b);
  });
}
const placeIdOf = id => S.visit[id]?.place || spk(id).place;
const positionOf = id => S.visit[id] || NPC_POSITIONS[id];
const peopleAt = placeId => S.met.filter(id => placeIdOf(id) === placeId);
// Hearing a line or finding a clue can reveal places and people ({ places:[…], people:[…] }).
// A newly known person brings their place onto the map.
function unlock(u, quiet){
  if(!u) return;
  let newPerson = false;
  const places = [], people = [];
  (u.places || []).forEach(id => { if(!S.known.has(id)){ S.known.add(id); places.push(id); } });
  (u.people || []).forEach(id => {
    if(S.met.includes(id)) return;
    S.met.push(id); people.push(id); newPerson = true;
    if(!S.known.has(spk(id).place)){ S.known.add(spk(id).place); places.push(spk(id).place); }
  });
  const newPlace = places.length > 0;
  if(!newPlace && !newPerson) return {};
  renderPlaces();
  if(newPlace) setMapNew(true);
  if(!quiet){
    pendingPins.push(...places);
    pendingPeople.push(...people);
    revealDiscoveries();
  }
  return { newPlace, newPerson, places, people };
}
// New places from a check wait until the notebook is put away; then the map opens and their pins pop out.
let pendingPins = [], pendingPeople = [], freshPins = new Set(), freshTimer;
function afterMotion(element, callback){
  const animations = element.getAnimations();
  if(!animations.length){ callback(); return; }
  Promise.allSettled(animations.map(animation => animation.finished)).then(callback);
}
function revealDiscoveries(){
  if(!pendingPins.length && !pendingPeople.length) return;
  const run = ++discoveryRun;
  afterMotion($('.dock'), () => {
    if(run !== discoveryRun || $('#app').classList.contains('notes-open') || $('#sheet-map').classList.contains('open') || !$('#caseList').hidden) return;
    presentDiscovery();
  });
}
function presentDiscovery(){
  clearTimeout(discoveryTimer);
  const person = pendingPeople.find(id => spk(id).place === (S.investigate ? S.place : cur().place));
  if(!person){ revealPins(); return; }
  pendingPeople = pendingPeople.filter(id => id !== person);
  const place = spk(person).place;
  const fromRect = $('#art').dataset.scene?.split(':')[0] === place ? $('#art').getBoundingClientRect() : null;
  stopVoice();
  setNotes(false);
  if(S.investigate){
    discoveryOrigin = S.place;
    if(S.place) sceneScroll[S.place] = artWrap.scrollLeft;
    setInvestigate(false);
  }
  discoveryPerson = person;
  $('#app').classList.add('discovering');
  $('#app').classList.remove('discovery-ready');
  renderStage(fromRect);
  renderDock();
  const announce = () => {
    if(discoveryPerson !== person) return;
    $('#app').classList.add('discovery-ready');
    toast('새로운 인물을 알게 됐어요.', true);
    discoveryTimer = setTimeout(finishDiscovery, 2200);
  };
  if(cameraMotion?.playState === 'running') cameraMotion.finished.then(announce).catch(() => {});
  else announce();
}
function finishDiscovery(showMap = true){
  discoveryRun++;
  clearTimeout(discoveryTimer);
  if(discoveryPerson){
    const fromRect = spk(discoveryPerson).place === cur().place ? $('#art').getBoundingClientRect() : null;
    discoveryPerson = null;
    $('#app').classList.remove('discovering', 'discovery-ready');
    $('#toast').hidden = true;
    if(discoveryOrigin){
      const place = discoveryOrigin;
      discoveryOrigin = null;
      enterPlace(place);
    } else {
      renderStage(fromRect);
      renderDock();
    }
  }
  if(showMap) revealPins();
}
function revealPins(){
  if(!pendingPins.length && !pendingPeople.length) return;
  const places = [...new Set(pendingPins)], people = [...new Set(pendingPeople)];
  freshPins = new Set([...places, ...people.map(id => spk(id).place)]);
  pendingPins = []; pendingPeople = [];
  openSheet('map');
  renderPlaces();
  const run = discoveryRun;
  afterMotion($('#sheet-map'), () => {
    if(run !== discoveryRun || !$('#sheet-map').classList.contains('open')) return;
    toast(places.length && people.length ? '새로운 장소와 인물을 알게 됐어요.' : people.length ? '새로운 인물을 알게 됐어요.' : '새로운 장소를 알게 됐어요.', true);
  });
  clearTimeout(freshTimer);
  freshTimer = setTimeout(() => { freshPins.clear(); document.querySelectorAll('.pin.fresh').forEach(pin => pin.classList.remove('fresh')); }, 4200);
}

/* ---------- ending ----------

   evidence notebook (a wrong photo: she brushes it off and the questioning starts over) → ② she confesses → ③ Sgt. Badger,

   What happened is told only by these lines. 해석 appears only once she has confessed.
   Lines without an mp3 in PEOPLE[].audio play with browser TTS. */
const ENDING = {
  confront:[
    { key:'q1', accept:['bakery-0', 'bakery-1'] },   // "at my bakery all evening" → the 7 PM sign / the cold oven
    { key:'q2', accept:['bakery-2'] },               // "Mrs. Bear came in at 8:30" → "No bread tonight"

    { key:'end4', en:"Lots of animals have orange fur!", ko:'주황색 털을 가진 동물은 많잖아요!', accept:['library-1'] }   // → the purple jam

    { key:'confess3', en:"I was so scared, so I ran out through the window. I'm so sorry, Professor.", ko:'너무 무서워서 창문으로 빠져나갔어요. 정말 죄송해요, 교수님.' }

const fionaLine = l => ({ who:'fiona', key:l.key, en:l.en ?? spk('fiona').answers[l.key], ko:l.ko ?? ANSWERS_KO.fiona[l.key] });
// her face: composed for the first two claims, cornered once the bakery story falls apart, sorry when she confesses
const confrontMood = round => round >= 2 ? 'nervous' : null;
function setMood(id, mood){
  if((S.mood[id] || null) === mood) return;

function endingControls(){

    (solved && e.ko ? `<p class="end-ko">${esc(e.line.ko)}</p>` : '');
  if(e.step === 'confront') return tools + `<button class="pill big green" type="button" data-end="present">증거 내밀기</button><button class="pill sm end-leave" type="button" data-end="leave">조금 더 조사할래요</button>`;
  if(e.step === 'wrong') return tools + `<button class="pill big" type="button" data-end="leave">다시 조사하기</button>`;
  return tools + `<button class="pill big" type="button" data-end="next">다음</button>`;
}
function endingAction(action){
  const e = ending; if(!e) return;
  if(action === 'replay') return speak(e.line.en, e.line.key, e.line.who);
  if(action === 'ko'){ e.ko = !e.ko; renderAsk(); return; }
  if(action === 'present'){ stopVoice(); S.view = 'evidence'; setNotes(true); noteRaised = true; renderDock(); return; }
  if(action === 'leave') return leaveEnding();
  if(action === 'next') endingNext();
}
// show someone (camera on them at their place) and play the line
function endingSay(line, mood){
  clearTimeout(endTimer);
  ending.line = line; ending.ko = false;
  if(mood !== undefined){ if(mood) S.mood[line.who] = mood; else delete S.mood[line.who]; }
  if(ending.shown !== line.who || S.investigate){
    const samePlace = ending.shown && !S.investigate && placeIdOf(ending.shown) === placeIdOf(line.who);
    ending.shown = line.who;
    stopVoice(); S.cur = line.who; S.view = line.who; S.sel = null;
    openSheet(null); setNotes(false);
    if(S.investigate) setInvestigate(false);
    if(samePlace){ $('#app').classList.toggle('partner', !!cur().partner); focusCamera(null, true); }
    else renderStage();
  }
  else if(mood !== undefined) renderScene(placeIdOf(S.cur));
  renderDock();
  endTimer = setTimeout(() => { if(ending?.line === line) speak(line.en, line.key, line.who); }, 500);
}
// Sgt. Badger comes along to the bakery and stands by the counter, left of Fiona
const ENDING_VISIT = { badger:{ place:'bakery', x:45, floor:93, height:44 } };
function startEnding(){
  ending = { step:'confront' };
  S.visit = { ...ENDING_VISIT };
  endingRound = 0;   // the questioning always starts from her first claim
  $('#app').classList.add('ending');
  endingSay(fionaLine(ENDING.confront[0]), null);
}
function wrongAccusation(id){
  ending = { step:'wrong' };
  $('#app').classList.add('ending');
  const key = REBUTTAL[id] || 'q2';
  endingSay({ who:id, key, en:spk(id).answers[key], ko:ANSWERS_KO[id]?.[key] || '' });
}
function leaveEnding(){
  clearTimeout(endTimer); stopVoice();

function present(ref){
  if(ending?.step !== 'confront') return;
  clearTimeout(endTimer); stopVoice();
  setNotes(false); renderDock();
  const record = S.evidence.find(r => `${r.placeId}-${r.clueIndex}` === ref);
  const shot = document.createElement('div');
  shot.className = 'presented';
  shot.innerHTML = `<figure>${record.photo}</figure>`;
  $('.scene').appendChild(shot);
  setTimeout(() => shot.remove(), 1300);
  const round = ENDING.confront[endingRound], right = round.accept.includes(ref);
  endTimer = setTimeout(() => {
    if(ending?.step !== 'confront') return;
    if(!right){
      // a wrong photo: she regains her composure and the questioning starts over from her first claim
      endingRound = 0;
      ending.line = null; renderAsk();
      setMood('fiona', null);
      speak(ENDING.miss.en, ENDING.miss.key, 'fiona', () => {
        endTimer = setTimeout(() => ending?.step === 'confront' && endingSay(fionaLine(ENDING.confront[0]), null), 700);
      });
      return;
    }
    endingRound++;
    if(endingRound < ENDING.confront.length) return endingSay(fionaLine(ENDING.confront[endingRound]), confrontMood(endingRound));
    // all four answered: a moment of silence, then she gives in
    ending.step = 'confession'; ending.i = 0; ending.line = null; renderAsk();
    setMood('fiona', 'sad');
    endTimer = setTimeout(() => ending && endingSay(fionaLine(ENDING.confession[0]), 'sad'), 1400);
  }, 1300);
}
function endingNext(){
  const e = ending;
  clearTimeout(endTimer); stopVoice();
  if(e.step === 'confession'){
    if(++e.i < ENDING.confession.length) return endingSay(fionaLine(ENDING.confession[e.i]));
    e.step = 'closing'; return endingSay(ENDING.closing);
  }
  if(e.step === 'closing') return caseClosedStamp();
}

  $('.scene').appendChild(card);

}
function finishEnding(){
  clearTimeout(endTimer); stopVoice();

}

/* ---------- review: after the case, the full lines, Korean, and the blanks missed at the first check ---------- */
function openReview(){
  const people = S.met.filter(id => per(id).order.length);
  people.forEach(id => recordFirst(id));
  const ok = people.reduce((n, id) => n + per(id).first.ok, 0), total = people.reduce((n, id) => n + per(id).first.total, 0);
  const rate = total ? ok / total : 0, stars = rate >= .9 ? 3 : rate >= .7 ? 2 : 1;
  $('#reviewCard').innerHTML = `<span class="eyebrow">Review</span><h2>복습</h2>
    <div class="rv-stars" aria-label="별 ${stars}개">${'★'.repeat(stars)}${'☆'.repeat(3 - stars)}</div>
    <p>처음 확인했을 때 ${total}칸 중 ${ok}칸을 맞혔어요.</p>` +
    people.map(id => {
      const s = spk(id), p = per(id);
      return `<section class="rv-person"><h3><span class="mini" style="background:${s.bg}">${miniSVG(id)}</span>${esc(s.name)}<small>${p.first.ok}/${p.first.total}</small></h3>` +
        p.order.map(qid => {
          const lines = s.notes[qid].map(line => {
            let html = '', last = 0;
            line.replace(BLANK_RE, (m, bid, ans, idx) => {
              const right = esc(ans.split('/')[0]);
              html += esc(line.slice(last, idx)) + (bid in p.firstWrong
                ? `<s>${esc(p.firstWrong[bid] || '…')}</s> <b class="fix">${right}</b>`
                : `<b class="ok">${right}</b>`);
              last = idx + m.length; return m;
            });
            return `<div>${html}${esc(line.slice(last))}</div>`;
          }).join('');
          return `<div class="rv-q"><div class="rv-label">Q. ${esc(qs(s).find(q => q.id === qid).en)}</div>
            <p class="rv-en">${esc(s.answers[qid])} <button class="replay-q" type="button" data-replay="${id}:${qid}" aria-label="다시 듣기">${playIcon}</button></p>
            <p class="rv-ko" hidden>${esc(ANSWERS_KO[id]?.[qid] || '')}</p>
            <button class="pill sm" type="button" data-rv-ko aria-pressed="false">해석</button>
            <div class="rv-notes">${lines}</div></div>`;
        }).join('') + '</section>';
    }).join('') +
    `<button class="pill big" type="button" data-solved>사건 목록으로</button>`;
  $('#review').hidden = false;
  $('#reviewCard').scrollTop = 0;
}
$('#review').addEventListener('click', e => {
  const replay = e.target.closest('[data-replay]');
  if(replay) return replayLine(replay.dataset.replay);

  if(ko){ const t = ko.previousElementSibling; t.hidden = !t.hidden; ko.setAttribute('aria-pressed', !t.hidden); return; }

}

// Floor below each picture's bottom edge (Higgsfield outpaint, cut at the seam). Only the
// conversation camera shows it, behind the question buttons; investigation keeps the original frame.
const ART_FLOOR = {
  library:{ src:'assets/places/library-floor.jpg', h:506 },
  bakery: { src:'assets/places/bakery-floor.jpg', h:518 },
  cafe:   { src:'assets/places/cafe-floor.jpg', h:725 },
  hill:   { src:'assets/places/hill-floor.jpg', h:370 }
};

function placeObj(){ return PLACES.find(p => p.id === S.place); }

// a person's on-picture box in % of the picture: left/right of the sprite, top of the head, plus its height
function npcBox(id, pl){
  const position = positionOf(id), sprite = SPRITES[spriteKey(id)], height = position.height * (sprite?.height || 1);
  const width = height * (pl.artHeight || 600) / (pl.artWidth || 900) * (sprite ? sprite.w / sprite.h : .5);
  const left = position.x - width * (sprite?.anchor ?? .5);
  return { left, right:left + width, top:position.floor - height, width, height };
}
function renderScene(placeId = S.place){
  const pl = placeOf(placeId), art = $('#art');
  if(!pl){ art.innerHTML = ''; return; }
  art.style.aspectRatio = `${pl.artWidth || 900} / ${pl.artHeight || 600}`;
  art.style.setProperty('--world-width', `${pl.artWidth || 900}px`);
  art.style.setProperty('--world-height', `${pl.artHeight || 600}px`);
  const people = peopleAt(pl.id), signature = `${pl.id}:${people.map(spriteKey).join(',')}`;
  if(art.dataset.scene === signature){
    art.querySelectorAll('.spot').forEach(spot => spot.classList.toggle('found', S.found[pl.id].has(+spot.dataset.clue)));
    return;
  }
  art.dataset.scene = signature;
  const floor = ART_FLOOR[pl.id], artHeight = pl.artHeight || 600;
  // the place view shows up to 30% of the floor extension under the picture, so the feet are not on the edge
  art.style.setProperty('--art-share', artHeight / (artHeight + (floor ? Math.min(floor.h, artHeight * .3) : 0)));
  art.innerHTML = `<svg viewBox="0 0 ${pl.artWidth || 900} ${pl.artHeight || 600}" aria-hidden="true">${ART[pl.id]()}</svg>` +
    (floor ? `<img class="art-floor" src="${floor.src}" alt="">` : '') +
    pl.spots.map(s => `<button class="spot${S.found[pl.id].has(s.clue) ? ' found' : ''}" type="button" data-clue="${s.clue}"
      style="left:${s.x}%;top:${s.y}%;width:${s.w}%;height:${s.h}%" aria-label="${esc(pl.clues[s.clue].label)} 살펴보기"></button>`).join('') +
    people.map(id => {
      const position = positionOf(id), sprite = SPRITES[spriteKey(id)], { width, height } = npcBox(id, pl);
      return `<button class="scene-npc" type="button" data-talk="${id}" style="left:${position.x}%;bottom:${100 - position.floor}%;height:${height}%;width:${width}%;transform:translateX(-${(sprite?.anchor ?? .5) * 100}%)" aria-label="${esc(spk(id).name)}와 대화">${fullSVG(id)}<span>${esc(spk(id).name)}</span></button>`;
    }).join('');
}
function tapFx(x, y, kind, text){
  const d = document.createElement('div');
  d.className = 'tapfx ' + kind; d.style.left = x + 'px'; d.style.top = y + 'px';
  if(text) d.textContent = text;
  $('#art').appendChild(d);
  setTimeout(() => d.remove(), 900);
}
function evidencePhoto(place, clueIndex){
  const spot = place.spots.find(item => item.clue === clueIndex);
  if(spot.photo){
    const crop = spot.photo;
    return `<svg viewBox="${crop.x} ${crop.y} ${crop.w} ${crop.h}" aria-hidden="true">${ART[place.id]()}</svg>`;
  }
  const artWidth = place.artWidth || 900, artHeight = place.artHeight || 600;
  const height = Math.min(artHeight, Math.max(spot.h * artHeight / 100 * 1.12, spot.w * artWidth / 100 * .84, 120));
  const width = height * 4 / 3;
  const left = Math.max(0, Math.min(artWidth - width, (spot.x + spot.w / 2) * artWidth / 100 - width / 2));
  const top = Math.max(0, Math.min(artHeight - height, (spot.y + spot.h / 2) * artHeight / 100 - height / 2));
  return `<svg viewBox="${left} ${top} ${width} ${height}" aria-hidden="true">${ART[place.id]()}</svg>`;
}
function playShutter(){
  const shutter = $('#cameraShutter');
  shutter.currentTime = 0;
  shutter.play().catch(() => {});
}
function captureEvidence(place, clueIndex){
  cancelCapture();
  stopVoice();
  const narration = place.clues[clueIndex].audio;
  if(narration) $('#evidenceVoice').src = narration;
  const photo = evidencePhoto(place, clueIndex);
  const preview = document.createElement('div');
  preview.className = 'capture-view'; preview.setAttribute('aria-hidden', 'true');
  preview.innerHTML = `<div class="capture-frame">${photo}</div>`;
  $('.art-stage').appendChild(preview);
  const finishCapture = () => {
    if(!preview.isConnected || !S.investigate || S.place !== place.id) return;
    if(!S.evidence.some(item => item.placeId === place.id && item.clueIndex === clueIndex)){
      S.evidence.push({ placeId:place.id, clueIndex, photo });
    }
    S.view = 'evidence'; renderDock(); setNotes(true);
    toast('증거를 노트에 기록했어요.');
  };
  captureShotTimer = setTimeout(() => {
    if(!preview.isConnected) return;
    playShutter();
    const flash = document.createElement('div');
    flash.className = 'capture-flash'; flash.setAttribute('aria-hidden', 'true');
    preview.appendChild(flash);
    setTimeout(() => flash.remove(), 400);
  }, 500);
  captureTimer = setTimeout(() => {
    if(!preview.isConnected || !S.investigate || S.place !== place.id) return;
    if(narration){
      const voice = $('#evidenceVoice');
      voice.onended = finishCapture;
      voice.onerror = finishCapture;
      voice.currentTime = 0;
      voice.play().catch(finishCapture);
    } else finishCapture();
  }, 1100);
}
function examine(i){
  const pl = placeObj(), fresh = !S.found[pl.id].has(i);
  S.found[pl.id].add(i);
  if(fresh) unlock(pl.clues[i].unlocks);
  renderSceneHead(); renderPlaces();
  if(!S.evidence.some(item => item.placeId === pl.id && item.clueIndex === i)) captureEvidence(pl, i);
  else {
    S.view = 'evidence'; renderDock(); setNotes(true);
    $(`[data-evidence="${pl.id}-${i}"]`).scrollIntoView({block:'nearest'});
  }
}

// mouse drag pans the illustration (touch uses native scrolling); a drag never counts as a tap
const artWrap = $('#artWrap');
let pan = null, panMoved = false;
artWrap.addEventListener('pointerdown', e => {
  $('#swipeHint').hidden = true;
  if(e.pointerType === 'mouse') pan = { x:e.clientX, s:artWrap.scrollLeft, moved:false };
});
window.addEventListener('pointermove', e => {
  if(!pan) return;
  const dx = e.clientX - pan.x;
  if(Math.abs(dx) > 5) pan.moved = true;
  if(pan.moved) artWrap.scrollLeft = pan.s - dx;
});
window.addEventListener('pointerup', () => { if(pan){ panMoved = pan.moved; pan = null; } });
artWrap.addEventListener('wheel', e => {
  if(Math.abs(e.deltaY) > Math.abs(e.deltaX)){ artWrap.scrollLeft += e.deltaY; e.preventDefault(); }
  $('#swipeHint').hidden = true;
}, { passive:false });

$('#art').addEventListener('click', e => {
  if(panMoved){ panMoved = false; return; }
  if(!placeObj()) return;
  const npc = e.target.closest('[data-talk]');
  if(npc){ talkTo(npc.dataset.talk); return; }
  const r = $('#art').getBoundingClientRect();
  const spot = e.target.closest('.spot');
  let x = e.clientX - r.left, y = e.clientY - r.top;
  if(spot && e.detail === 0){ const b = spot.getBoundingClientRect(); x = b.left - r.left + b.width / 2; y = b.top - r.top + b.height / 2; }
  if(spot){ spot.classList.add('found'); examine(+spot.dataset.clue); }
  else tapFx(x, y, 'miss', 'Nothing here.');
});

function enterPlace(id, fromConversation = false){
  if(!S.known.has(id) && !(fromConversation && id === cur().place)) return;
  const fromRect = !S.investigate && id === cur().place ? $('#art').getBoundingClientRect() : null;
  cameraMotion?.cancel();
  if(!S.investigate) setInvestigate(true);
  S.place = id;
  $('#sceneEmpty').hidden = true;
  openSheet(null); setNotes(false);
  const art = $('#art');
  artWrap.appendChild(art);
  art.inert = false;
  art.removeAttribute('aria-hidden');
  art.style.transform = 'none';
  renderSceneHead(); renderScene();
  requestAnimationFrame(() => {
    if(!S.investigate || S.place !== id) return;
    artWrap.scrollLeft = sceneScroll[id] ?? (artWrap.scrollWidth - artWrap.clientWidth) / 2;
    $('#swipeHint').hidden = artWrap.scrollWidth <= artWrap.clientWidth + 4;
    if(fromRect?.width){
      const bounds = art.getBoundingClientRect();
      animateCamera(art, `translate(${fromRect.left - bounds.left}px, ${fromRect.top - bounds.top}px) scale(${fromRect.width / bounds.width})`, 'none');
    }
  });
}

}

  $('#tutCount').textContent = `${tutStep + 1} / ${TUT.length}`;
  $('#tutDots').innerHTML = TUT.map((_, i) => `<i class="${i === tutStep ? 'on' : ''}"></i>`).join('');
  $('#tutPrev').hidden = tutStep === 0;
  $('#tutSkip').hidden = last;
  $('#tutNext').textContent = !last ? '다음' : tutThenStart ? '사건 현장으로 가기' : '닫기';
}
function closeTutorial(){
  markTutSeen();
  $('#intro').hidden = true;
  if(tutThenStart) talkTo('badger');
}
$('#tutNext').onclick = () => { if(tutStep < TUT.length - 1){ tutStep++; renderTut(); } else closeTutorial(); };
$('#tutPrev').onclick = () => { if(tutStep > 0){ tutStep--; renderTut(); } };
$('#tutSkip').onclick = closeTutorial;
document.addEventListener('keydown', e => {
  if($('#intro').hidden) return;
  if(e.key === 'ArrowRight') $('#tutNext').click();
  if(e.key === 'ArrowLeft') $('#tutPrev').click();
});

/* ---------- case select ----------
   Cases open in order (a case unlocks when the one before it is solved). Solved cases are kept on
   this device; the case in progress lives in memory only until saving is added. */
const CASES = [
  { id:'case01', no:'Case 01', title:'도서관 살인사건', art:'library', playable:true },
  { id:'case02', no:'Case 02' },
  { id:'case03', no:'Case 03' }
];
const SOLVED_KEY = 'pioo.solvedCases';
const solvedCases = () => { try { return JSON.parse(localStorage.getItem(SOLVED_KEY) || '[]'); } catch(e){ return []; } };
function markSolved(id){ try { localStorage.setItem(SOLVED_KEY, JSON.stringify([...new Set([...solvedCases(), id])])); } catch(e){} }
const LOCK_ICON = `<svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="#7D6A58" stroke-width="1.8" stroke-linejoin="round"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8.5 10.5 V8 a3.5 3.5 0 0 1 7 0 V10.5"/></g></svg>`;
let caseStarted = false;
function renderCaseList(){
  const solved = solvedCases();
  $('#caseCards').innerHTML = CASES.map((c, i) => {
    const open = i === 0 || solved.includes(CASES[i - 1].id);
    if(!open || !c.playable) return `<div class="case-card locked" aria-label="${c.no} 잠김">
      <span class="case-thumb">${LOCK_ICON}</span>
      <span><span class="case-no">${c.no}</span><span class="case-title">???</span>
        <span class="case-lock">${open ? '준비 중이에요' : `${CASES[i - 1].no}을 해결하면 열려요`}</span></span></div>`;
    const [cls, label] = solved.includes(c.id) ? ['st-solved', '해결 ✓'] : caseStarted ? ['st-going', '수사 중'] : ['st-new', '새 사건'];
    return `<button class="case-card" type="button" data-case="${c.id}">
      <span class="case-thumb"><svg viewBox="0 0 ${placeOf(c.art).artWidth || 900} ${placeOf(c.art).artHeight || 600}" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${ART[c.art]()}</svg></span>
      <span><span class="case-no">${c.no}</span><span class="case-title">${esc(c.title)}</span><span class="badge ${cls}">${label}</span></span></button>`;
  }).join('');
}
function openCaseList(){ if(discoveryPerson) finishDiscovery(false); stopVoice(); hideBubble(); openSheet(null); renderCaseList(); $('#caseList').hidden = false; }
// Opening a case: the first time on this device the tutorial comes first; a case in progress resumes where it was left.
function startCase(){
  $('#caseList').hidden = true;
  if(caseStarted) return;
  caseStarted = true;
  if(tutSeen()) talkTo('badger'); else openTutorial(true);
}
$('#caseCards').addEventListener('click', e => { if(e.target.closest('[data-case]')) startCase(); });
$('#howtoList').onclick = () => openTutorial(false);
$('#toCases').onclick = openCaseList;
$('#howtoMap').onclick = () => openTutorial(false);

/* ---------- test tools ---------- */
// Write the correct answer into every blank of the given questions; returns how many blanks were filled.
function fillAnswers(i, qids, mark){
  const p = per(i); let n = 0;
  qids.forEach(qid => spk(i).notes[qid].forEach(line =>
    line.replace(/\{\{(\w+)\|([^}]+)\}\}/g, (m, id, ans) => {
      p.notes[id] = ans.split('/')[0];
      if(mark) p.marks[id] = 'ok'; else delete p.marks[id];
      n++; return m;
    })
  ));
  return n;
}
// 노트 자동 채우기: every question asked so far, everyone.
$('#devFill').onclick = () => {
  const n = PEOPLE_ORDER.reduce((sum, id) => sum + fillAnswers(id, per(id).order, false), 0);
  if(!n) return toast('채울 빈칸이 없어요. 먼저 질문을 골라 주세요.');
  renderDock();
  toast(`빈칸 ${n}개를 채웠어요.`);
};
// 전체 대화 완료: everyone met, every question asked and recorded correctly, every place known → map.
$('#devDone').onclick = () => {
  stopVoice(); hideBubble(); clearSel();
  $('#intro').hidden = true; $('#caseList').hidden = true; caseStarted = true;
  PEOPLE_ORDER.forEach(id => {
    const p = per(id);
    p.order = qs(spk(id)).map(q => q.id); p.recording = null; p.phase = 'done';
    fillAnswers(id, p.order, false);
  });
  S.met = [...PEOPLE_ORDER];
  PLACES.forEach(pl => S.known.add(pl.id));
  renderPlaces();
  if(S.investigate) renderDock(); else setInvestigate(true);
  openSheet('map');
  toast('모든 대화를 마쳤어요. 지도에서 장소를 골라 보세요.');
};

// 증거 모두 수집: every clue of every place is found and saved in the evidence notebook (no photo sequence).
$('#devEvidence').onclick = () => {
  let n = 0;
  PLACES.forEach(place => place.clues.forEach((clue, clueIndex) => {
    S.found[place.id].add(clueIndex);
    if(S.evidence.some(item => item.placeId === place.id && item.clueIndex === clueIndex)) return;
    S.evidence.push({ placeId:place.id, clueIndex, photo:evidencePhoto(place, clueIndex) }); n++;
  }));
  renderPlaces(); renderDock();
  if(S.investigate && S.place){ renderSceneHead(); renderScene(); }
  toast(n ? `증거 ${n}개를 노트에 기록했어요.` : '이미 모든 증거를 모았어요.');
};

// 튜토리얼 초기화: forget that the tutorial was seen and start over.
$('#devTut').onclick = () => { try { localStorage.removeItem(TUT_KEY); } catch(e){} location.reload(); };

/* ---------- boot ---------- */
renderStage(false); renderDock(); renderPlaces(); renderSceneHead();
// the app opens on the case list (tapping a case is also the tap that lets audio play)
openCaseList();
})();
</script>
</body>
</html>
