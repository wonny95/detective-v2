let cameraMotion;
function animateCamera(art, from, to, ms = 650){
  cameraMotion?.cancel();
  art.style.transform = to;
  if(from && !matchMedia('(prefers-reduced-motion: reduce)').matches){
    cameraMotion = art.animate([{transform:from}, {transform:to}], {duration:ms, easing:ms > 650 ? 'cubic-bezier(.45,0,.3,1)' : 'cubic-bezier(.22,.7,.25,1)'});
    cameraMotion.onfinish = () => { if(!S.investigate) focusCamera(); };
  }
}
// fromRect: the NPC's on-screen rect when coming from the place view. glide: move from the
// current framing (the note opened or closed).
// ms: how long the move takes (a slow pan in the ending)
function focusCamera(fromRect, glide = false, ms){
  if(S.investigate) return;
  const subject = S.cur;
  const viewport = $('#talkCamera'), art = $('#art'), place = placeOf(placeIdOf(subject));
  const width = viewport.clientWidth, height = viewport.clientHeight;
  if(!width || !height) return;
  const position = positionOf(subject);
  const worldWidth = place.artWidth || 900, worldHeight = place.artHeight || 600;
  // Note closed: a 44%-tall NPC fills 58% of the scene with the feet just above the question
  // buttons. Note open: it shrinks to 46% with the head just under the top chips, so the face
  // stays above the note (top ~35%: the writing-down note is 65% tall, user: room for blanks that widen and wrap). The NPC never moves in the world; only the camera does.
  // Below the picture's bottom edge, the outpainted floor (ART_FLOOR) fills the scene.
  const notes = $('#app').classList.contains('notes-open');
  // The interview room leaves more room above the speaker for dialogue, showing the face below the bubble.
  const interview = place.id === INTERVIEW_ROOM.id;
  // (user request: the person stands lower, under the top bubble their lines now come in)
  const share = notes ? .46 : interview ? .52 : .55, headTop = notes ? .07 : interview ? .35 : .31;
  const fullHeight = worldHeight + (ART_FLOOR[place.id]?.h || 0);
  const minScale = Math.max(width / worldWidth, height / fullHeight);
  // a wide sprite (Mia and Ollie side by side) is never cut by the edges: the camera stays far enough to show all of it
  // (smaller then, with the feet where everyone else's are)
  const spriteWidth = npcBox(subject, place).width * worldWidth / 100;
  // sizeRef: a taller picture (one tall picture cut to band + floor) sizes the talk view by the usual 768 band, so the
  // person shows as big as in every other room
  const sizeRef = place.sizeRef || worldHeight;
  const near = height * share / Math.max(sizeRef * .44, worldHeight * position.height / 100), fit = width * .94 / spriteWidth;
  // a wide shot (ending.wide: a line's wide, { x, w }: the middle and the width it shows, in % of the picture) takes in
  // everyone standing there, their feet low in the scene
  // wide.top: world px above the picture to keep in view too (the tree's star, in the sky above it)
  // a peek (ending.peek, { x, y, w }: x in %, y in world px, w the width shown in %): the camera on one spot (the star)
  const wide = ending?.wide, peek = ending?.peek;
  const scale = peek ? Math.max(minScale, width / (worldWidth * peek.w / 100))
    : wide ? Math.max(minScale, Math.min(near, width / (worldWidth * wide.w / 100), wide.top ? height * .86 / (worldHeight * position.floor / 100 + wide.top) : Infinity))
    : Math.max(minScale, Math.min(near, fit));

  const centerX = peek ? peek.x : wide ? wide.x : position.x;

const glossKey = s => s.toLowerCase().replace(/’/g, "'").replace(/\./g, '').replace(/\s+/g, ' ').trim();
let glossNames;
function glossOf(text){
  if(!glossNames){
    glossNames = {};
    Object.values(PEOPLE).forEach(p => {
      const names = [p.name, p.id === 'betty' ? 'Mrs. Bear' : ''].filter(n => n && !n.includes('&'));   // a pair (Mia & Ollie) is in GLOSS
      names.forEach(n => { glossNames[glossKey(n)] = p.ko; const first = glossKey(n).split(' ')[0]; if(!/^(mr|mrs|the)$/.test(first)) glossNames[first] = p.ko; });
    });
  }
  const k = glossKey(text), own = /'s$/.test(k) && !GLOSS[k], base = own ? k.slice(0, -2) : k;
  const m = glossNames[base] || GLOSS[base];
  return m ? m + (own ? '의' : '') : '';
}
// every text in el becomes words that can be tapped (data-gloss), the longest phrase first
function glossify(el){
  const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, { acceptNode: n => n.parentElement.closest('button, .gw, .ko, .np-ko') ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT });
  const nodes = []; while(walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(node => {
    const text = node.textContent, toks = [...text.matchAll(/[A-Za-z]+(?:['’][A-Za-z]+)?/g)];
    if(!toks.length) return;
    const frag = document.createDocumentFragment(); let at = 0, i = 0;
    while(i < toks.length){
      let n = Math.min(4, toks.length - i), hit = '';
      for(; n > 1; n--){
        const gaps = toks.slice(i, i + n - 1).every((t, j) => /^\.?\s+$/.test(text.slice(t.index + t[0].length, toks[i + j + 1].index)));
        if(gaps && (hit = glossOf(toks.slice(i, i + n).map(t => t[0]).join(' ')))) break;
      }
      if(n === 1) hit = glossOf(toks[i][0]);
      const start = toks[i].index, last = toks[i + n - 1], end = last.index + last[0].length;
      if(hit){
        frag.append(text.slice(at, start));
        const w = document.createElement('span'); w.className = 'gw'; w.dataset.gloss = hit; w.textContent = text.slice(start, end);
        frag.append(w); at = end;
      }
      i += n;
    }
    frag.append(text.slice(at)); node.replaceWith(frag);
  });
}

const BLANK_RE = /\{\{(\w+)\|([^}]+)\}\}/g;

}

// swaps:{ qid:[[blank ids], …] } names groups of the same size that may trade places; each blank's ans becomes the one
// of the order that gets the most blanks right (the note's own order wins a tie), so the check, 힌트 and the review
// all follow the order the player wrote.

// A mouse can drag the strip sideways and its wheel scrolls it sideways (a finger already swipes it natively);
// a drag that moved never counts as picking the card it started on.
(strip => {
  let start = null, dragged = false;
  strip.addEventListener('pointerdown', e => {
    if(e.pointerType !== 'mouse' || e.button !== 0) return;
    start = { x:e.clientX, left:strip.scrollLeft }; dragged = false;
  });
  addEventListener('pointermove', e => {
    if(!start) return;
    const dx = e.clientX - start.x;
    if(!dragged && Math.abs(dx) > 5){ dragged = true; strip.classList.add('dragging'); }
    if(dragged) strip.scrollLeft = start.left - dx;
  });
  addEventListener('pointerup', () => { if(start){ start = null; strip.classList.remove('dragging'); } });
  strip.addEventListener('click', e => { if(dragged){ e.stopPropagation(); dragged = false; } }, true);
  strip.addEventListener('wheel', e => {
    if(Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
    strip.scrollLeft += e.deltaY; e.preventDefault();
  }, { passive:false });
})($('#drawerStrip'));

  const width = height * (pl.artHeight || 600) / (pl.artWidth || 900) * (sprite ? sprite.w / sprite.h : .5);

/* ---------- snow ----------
   A place with snow:true (the Christmas square and the sleigh; the storeroom and the tent are indoors) has soft
   round flakes falling over its picture, in the place view and in conversation and the ending alike (user request).
   They fall in screen space, so the camera's moves never drag them; few and slow, so clues stay easy to see. Big near
   flakes are softer and quicker, small far ones crisper and slower; each sways a little as it falls. Off with reduced
   motion. Drawn on the canvas over whichever view is showing (#snowInv, #snowTalk); the loop stops when no snow shows. */
let snowOn = false, snowFrame = 0, snowFlakes = [], snowLast = 0;
const snowSprites = [1.8, 2.8, 4, 5.4].map((r, i) => {
  // drawn at twice the size; the edge fades out over nearly as far again as the flake itself (user request: blurrier
  // edges), the nearest flakes softest
  const rr = r * 2, out = rr * (i > 2 ? 2.1 : 1.8), c = document.createElement('canvas'), size = Math.ceil(out + 2) * 2;
  c.width = c.height = size;
  const g = c.getContext('2d'), m = size / 2;
  const grad = g.createRadialGradient(m, m, 0, m, m, out);
  // a faint grey-blue in the fade keeps them seen over the white snow on the ground
  grad.addColorStop(0, 'rgba(255,252,244,1)'); grad.addColorStop(i > 2 ? .16 : .26, 'rgba(255,252,244,.95)');
  grad.addColorStop(.5, 'rgba(250,250,248,.58)'); grad.addColorStop(.74, 'rgba(196,205,220,.24)'); grad.addColorStop(1, 'rgba(196,205,220,0)');
  g.fillStyle = grad; g.beginPath(); g.arc(m, m, out, 0, Math.PI * 2); g.fill();
  return { c, r, size:size / 4, speed:[16, 24, 34, 46][i], alpha:[.8, .88, .92, .85][i] };
});
function snowFlake(w, h, anywhere){
  const kind = snowSprites[Math.random() < .45 ? 0 : Math.random() < .55 ? 1 : Math.random() < .6 ? 2 : 3];
  return { kind, x:Math.random() * w, y:anywhere ? Math.random() * h : -kind.size, phase:Math.random() * Math.PI * 2,
    sway:6 + Math.random() * 12, swaySpeed:.4 + Math.random() * .6, speed:kind.speed * (.8 + Math.random() * .4) };
}
function snowFor(pl){
  const on = !!pl?.snow && !matchMedia('(prefers-reduced-motion: reduce)').matches;
  $('#snowInv').classList.toggle('on', on); $('#snowTalk').classList.toggle('on', on);
  if(on === snowOn) return;
  snowOn = on; snowFlakes = [];
  if(on){ snowLast = 0; snowFrame = requestAnimationFrame(snowTick); }
  else { cancelAnimationFrame(snowFrame); document.querySelectorAll('.snow').forEach(c => c.getContext('2d').clearRect(0, 0, c.width, c.height)); }
}
function snowTick(now){
  if(!snowOn) return;
  snowFrame = requestAnimationFrame(snowTick);
  const canvas = S.investigate ? $('#snowInv') : $('#snowTalk'), w = canvas.clientWidth, h = canvas.clientHeight;
  if(!w || !h) return;
  const dpr = Math.min(2, devicePixelRatio || 1);
  if(canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)){ canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr); }
  const dt = snowLast ? Math.min(.05, (now - snowLast) / 1000) : 0; snowLast = now;
  // about one flake for every 5000 px² of the view: a light snowfall
  const want = Math.round(w * h / 5000);
  while(snowFlakes.length < want) snowFlakes.push(snowFlake(w, h, true));
  if(snowFlakes.length > want) snowFlakes.length = want;
  const g = canvas.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, w, h);
  snowFlakes.forEach((f, i) => {
    f.y += f.speed * dt; f.phase += f.swaySpeed * dt;
    if(f.y - f.kind.size > h){ snowFlakes[i] = f = snowFlake(w, h); }
    const x = f.x + Math.sin(f.phase) * f.sway, k = f.kind;
    g.globalAlpha = k.alpha; g.drawImage(k.c, x - k.size, f.y - k.size, k.size * 2, k.size * 2);
  });
  g.globalAlpha = 1;
}

   Only where to look, never what it is or what it means. What is still needed comes from the case's own data: the
   questioning's photos of a step no photo answers yet (ENDING.confront), and the photos and looks the deduction waits
   for (PACK.needed, PACK.ready). In the place showing, in this order: such a thing drawn here; the thing that opens a
   close look holding one (Coco's folded slip, the star in Tess's box); in a flip close look, its button when the thing
   is on the other side; someone here who still has questions. Optional looks and the scale are never pointed at.

const clueRefOnly = c => !/^[@!]/.test(c) && !c.startsWith('met:') && !c.includes(':') && c.lastIndexOf('-') > 0;
function stillNeeded(){
  const refs = new Set();

    const photos = step.accept.filter(key => !isSayRef(key));
    if(step.together) photos.filter(key => !cond(key)).forEach(key => refs.add(key));
    else if(photos.length && !photos.some(cond)) photos.forEach(key => refs.add(key));
  });
  [...(PACK?.needed || []), ...(PACK?.ready || [])].filter(clueRefOnly).forEach(key => { if(!cond(key)) refs.add(key); });
  // a flag the deduction waits for that a tap does (take '!flag': Tess's table seen from the sleigh)
  (PACK?.ready || []).filter(c => c.startsWith('!') && !cond(c)).forEach(flag => PLACES.forEach(pl => pl.clues.forEach((c, i) => { if(c.take === flag) refs.add(`${pl.id}-${i}`); })));
  return refs;

      // the two multiplied and the picture swung on its way)

const MATCH_KEY = 'detective.matchesDone';

function openMatchGame(caseId){
  // words whose meaning fits a note (8 letters or fewer), no two with the same meaning on one board
  const pool = SAFE_WORDS.filter(w => WORDS[w][1].length <= 8).sort(() => Math.random() - .5);
  const boards = [], used = new Set();
  for(let b = 0; b < 2; b++){
    const pick = [];
    for(const w of pool){
      if(used.has(w) || pick.some(x => WORDS[x][1] === WORDS[w][1])) continue;
      pick.push(w); used.add(w);
      if(pick.length === 6) break;
    }
    boards.push({ pairs:pick.slice(0, 5), decoy:pick[5] });
  }

  $('#mgDone').hidden = true; $('#mgReward').innerHTML = '';
  $('#matchGame').hidden = false;
  mgLoad();
}
function mgLoad(){
  const b = mg.boards[mg.at];

  const shuffle = a => [...a].sort(() => Math.random() - .5);
  const note = (w, side) => `<button class="mg-note" type="button" data-mg="${w}" data-side="${side}">${side === 'l' ? w : esc(WORDS[w][1])}<span class="pin"></span><span class="ok-stamp">확인</span></button>`;
  $('#mgLeft').innerHTML = shuffle(b.pairs).map(w => note(w, 'l')).join('');

function mgProgress(){

function mgThread(a, b, cut){
  const box = $('#mgStr').getBoundingClientRect(), pin = el => el.querySelector('.pin').getBoundingClientRect();
  const pa = pin(a), pb = pin(b), x1 = pa.left + pa.width / 2 - box.left, y1 = pa.top + pa.height / 2 - box.top;
  let x2 = pb.left + pb.width / 2 - box.left, y2 = pb.top + pb.height / 2 - box.top;
  if(cut){ x2 = x1 + (x2 - x1) * .45; y2 = y1 + (y2 - y1) * .45; }   // a wrong pair: the thread stops halfway and drops
  const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  Object.entries({ x1, y1, x2, y2 }).forEach(([k, v]) => line.setAttribute(k, v.toFixed(1)));

/* ---------- grammar notes ----------
   A checked question gets chips for the grammar in its answer (GRAMMAR_LINES). A chip opens the card:
   the pattern, a Korean explanation, and every learned line that uses it, with the words highlighted. */
// The text with each grammar's words turned into a link to its card (overlapping words: the first one wins).
function markGrammar(text, items = []){
  const ranges = items.map(([g, words]) => ({ g, at:text.indexOf(words), len:words.length })).filter(r => r.at >= 0).sort((a, b) => a.at - b.at);
  let html = '', last = 0;
  let i = 0;
  ranges.forEach(r => {
    if(r.at < last) return;
    // what touches the words (a full stop, 's) stays on their line: the button breaks off like a word of its own
    const end = r.at + r.len, next = Math.min(...ranges.map(o => o.at).filter(at => at >= end), text.length);
    const tail = text.slice(end, next).match(/^\S+/)?.[0] || '';
    html += esc(text.slice(last, r.at)) + (tail ? '<span class="gkeep">' : '') + `<button class="gmark" type="button" data-grammar="${r.g}" data-words="${esc(text.substr(r.at, r.len))}" style="--i:${i++}">${esc(text.substr(r.at, r.len))}</button>` + (tail ? `${esc(tail)}</span>` : '');
    last = end + tail.length;
  });
  return html + esc(text.slice(last));
}
// The 지문 toggle under a checked question in the note (open = the answer text is showing).
const passageToggle = (ref, open) => `<button class="ptoggle" type="button" data-passage="${ref}" aria-pressed="${open}">${open ? '지문 접기' : '지문 보기'}</button>`;
// The sentence of the answer (or the question) that holds the words, with the words marked.
function grammarLine(id, qid, words){
  const s = spk(id), answer = s.answers[qid], question = qs(s).find(q => q.id === qid).en;
  const inAnswer = answer.includes(words), text = inAnswer ? answer : question;
  const parts = sentencesOf(text), idx = Math.max(0, parts.findIndex(part => part.includes(words))), sentence = parts[idx];
  const at = sentence.indexOf(words);
  return { inAnswer, idx, html:esc(sentence.slice(0, at)) + `<mark>${esc(words)}</mark>` + esc(sentence.slice(at + words.length)) };
}
const grammarUses = g => Object.entries(GRAMMAR_LINES).flatMap(([ref, items]) => {
  const [id, qid] = ref.split(':');
  return knownQuestion(id, qid) ? items.filter(([gid]) => gid === g).map(([, words]) => ({ id, qid, words })) : [];
});
// an example's {marked} words
const markForm = t => esc(t).replace(/\{([^}]+)\}/g, '<mark>$1</mark>');
// id or id#head: the grammar, and the form when it is one
function gramEntry(id){
  const [g, head] = id.split('#'), gr = GRAMMAR[g], ex = head ? gr?.examples?.find(x => x.head === head) : null;
  // this case's lines of it (none from another case: its data is not on this page)
  const uses = !gr || (head && !ex) ? [] : ex ? grammarUses(g).filter(u => exampleForm(ex).test(u.words)) : grammarUses(g);
  return { gr, ex, head, uses };
}

// The irregular past tenses in the game's lines, past → base: a card opened from one of them names that verb
// (user: tapping "left" showed come → came, the grammar's general pattern)
const IRREGULAR_PAST = { came:'come', left:'leave', saw:'see', went:'go', took:'take', found:'find', wrote:'write', bought:'buy',
  taught:'teach', brought:'bring', lent:'lend', gave:'give', said:'say', got:'get', made:'make', told:'tell', ran:'run', sat:'sit',
  stood:'stand', knew:'know', thought:'think', felt:'feel', heard:'hear', kept:'keep', lost:'lose', met:'meet', paid:'pay', sold:'sell',
  sent:'send', spent:'spend', forgot:'forget', broke:'break', chose:'choose', fell:'fall', flew:'fly', ate:'eat', drank:'drink',
  drove:'drive', began:'begin', wore:'wear', won:'win', hid:'hide', held:'hold', did:'do', had:'have', put:'put', read:'read' };
const irregularIn = words => (words || '').toLowerCase().match(/[a-z]+/g)?.find(w => IRREGULAR_PAST[w]);
function openGrammar(id, words){
  // from a word in a line, a grammar with forms opens on the form that word is (her bag → his / her, not the whole
  // grammar): the form found earliest in the words, the longer one on a tie (What are you -ing? over Are you -ing?)
  if(words && !id.includes('#') && GRAMMAR[id]?.examples){
    const form = GRAMMAR[id].examples.map(x => ({ x, at:exampleForm(x).exec(words)?.index ?? -1 })).filter(f => f.at >= 0)
      .sort((a, b) => a.at - b.at || b.x.head.length - a.x.head.length)[0];
    if(form) id = `${id}#${form.x.head}`;
  }
  const { gr, ex, uses:all } = gramEntry(id);
  // from a word in a line: an irregular past names its verb in the title; the tapped words' own line(s) come first
  const verb = !ex && id === 'past-irr' ? irregularIn(words) : null;
  const mine = u => u.words === words || (verb && irregularIn(u.words) === verb);
  const uses = words ? [...all.filter(mine), ...all.filter(u => !mine(u))] : all;
  $('#grammarCard').innerHTML = `<div class="gcard-head"><span class="eyebrow">문법 노트 · ${esc(gr.name)}</span><button class="close-button" type="button" data-gclose aria-label="문법 노트 닫기"></button></div>
    <h2 class="gpattern" id="grammarTitle">${esc(ex ? ex.head : verb ? `${IRREGULAR_PAST[verb]} → ${verb}` : gr.pattern)}</h2>
    ${ex ? grammarExplain(ex.why || ex.ko, ex.more) : `<p class="gko">${esc(gr.ko)}</p>`}
    ${!uses.length && ex?.lines?.length ? `<div class="gex"><h3>예문</h3>${ex.lines.map(([en]) => `<div class="gline"><p>${markForm(en)}</p></div>`).join('')}</div>` : ''}
    ${uses.length ? `<div class="gex"><h3>이 문법이 나온 문장</h3>${uses.map(use => {
      // 해석 (user request: the lines here had no Korean): the line's own Korean sentence, as in the review's grammar
      const { id, qid } = use, s = spk(id), { line, ko } = grammarLineParts(use);
      return `<div class="gline"><div class="wtop"><span class="wwho">${line.inAnswer
        ? `<span class="mini" style="background:${s.bg}">${miniSVG(id)}</span>${esc(s.name)}` : '내 질문'}</span>
        ${line.inAnswer ? `<button class="replay-q" type="button" data-replay="${id}:${qid}" data-sent="${line.idx}" aria-label="다시 듣기">${playIcon}</button>` : ''}
        ${ko ? `<button class="pill sm" type="button" data-gko aria-pressed="false"${line.inAnswer ? '' : ' style="margin-left:auto"'}>해석</button>` : ''}</div>
        <p>${line.html}</p>${ko ? `<p class="wko" hidden>${esc(ko)}</p>` : ''}</div>`;
    }).join('')}</div>` : ''}`;
  // the lines' words tapped for their meaning, as on the note (user request: sorting inside a grammar mark had no way to
  // its meaning); the marked words too, here only a highlight
  $('#grammarCard').querySelectorAll('.gline > p:not(.wko)').forEach(glossify);
  $('#grammar').hidden = false;
  $('#grammarCard').scrollTop = 0;
}

  const w = e.target.closest('.gw');
  if(w) return showGloss(w, w.textContent, w.dataset.gloss);
  const replay = e.target.closest('[data-replay]');
  if(replay) return replaySentence(replay.dataset.replay, +replay.dataset.sent);

  if(e.target.closest('[data-gclose]') || e.target.id === 'grammar'){ stopVoice(); $('#grammar').hidden = true; }
});

      ${ex.lines.length ? `<div class="ck-notes">${ex.lines.map(([en, ko], i) => `<p class="ck-note"><span>${markForm(en)}</span><button class="replay-q" type="button" data-ck-play="${g}-${GRAMMAR[g].examples.indexOf(ex) + 1}-${i + 1}" aria-label="예문 듣기">${playIcon}</button><button class="pill sm" type="button" data-ck-ko aria-pressed="false">해석</button><span class="ko">${esc(ko)}</span></p>`).join('')}</div>` : ''}</div>
    <div class="ck-dots" aria-label="${at + 1} / ${caseKeyPages.length}"${caseKeyPages.length < 2 ? ' hidden' : ''}>${caseKeyPages.map((x, i) => `<i${i === at ? ' class="now"' : ''}></i>`).join('')}</div>
    <div class="rv-foot ck-foot">${at ? '<button class="pill" type="button" data-ck-prev>이전</button>' : ''}<button class="pill big" type="button" data-ck-next>${last ? (caseKeyThen ? '사건 시작' : '닫기') : '다음'}</button></div>`;

$('#caseKey').addEventListener('click', e => {
  const play = e.target.closest('[data-ck-play]');

/* ---------- home pages ----------
   홈: the detective's office (name plate), the case to play now, the lines to hear again.
   학습 (user request: 단어장 and 복습 in one, switched 단어 / 문법 / 복습): 단어 = blanks the player has written right
   (every blank once a case is solved), the line it came from plays with ▶, Korean only with 해석; 문법 = grammar cards;
   복습 = solved cases and the lines missed at the first check.
   마이: streak, totals, the how-to and the detective's name. All of it reads only what this device saved or the case in memory. */
let homeTab = 'home', studyMode = 'words';
// A question whose words and grammar count as learned: checked right in the case in memory, or any once the case is solved.
const knownQuestion = (id, qid) => solvedCases().includes(CASE.id) || per(id).questionChecks[qid] === 'ok';
function learnedWords(){
  const seen = new Map();
  PEOPLE_ORDER.forEach(id => {
    const s = spk(id);
    qs(s).forEach(q => {
      if(!knownQuestion(id, q.id)) return;
      (s.notes[q.id] || []).forEach(line => line.replace(BLANK_RE, (m, bid, ans) => {
        const key = ans.split('/')[0].toLowerCase();
        const first = ans.split('/')[0], starts = /^(-\s*)?\{\{/.test(line) && line.indexOf(m) === line.indexOf('{{');
        if(WORDS[key] && !seen.has(key)) seen.set(key, { word:starts && first === first[0].toUpperCase() + key.slice(1) ? key : first, key, line, bid, ref:`${id}:${q.id}`, sent:sentenceFor(s.answers[q.id], ans, line) });
        return m;
      }));
    });
  });
  // the case's phrases: heard in an answer's sentence, or in the detective's question (question: ▶ plays that)
  PHRASE_LINES.forEach(([key, ref, words]) => {
    const [id, qid] = ref.split(':');
    if(seen.has(key) || !knownQuestion(id, qid)) return;
    const s = spk(id), { inAnswer, idx } = grammarLine(id, qid, words);
    const sentence = sentencesOf(inAnswer ? s.answers[qid] : qs(s).find(q => q.id === qid).en)[idx];
    seen.set(key, { word:WORDS[key][3] || key, key, line:sentence.replace(words, `{{p|${words}}}`), bid:'p', ref, sent:idx, question:!inAnswer });
  });
  return [...seen.values()];
}
// Which sentence of the answer a note blank was heard in: one that says the word (any accepted form), the one
// sharing most words with the note line when several or none do.
function sentenceFor(answer, ans, line){
  const tokens = text => text.toLowerCase().replace(/[^a-z0-9: ]/g, ' ').split(/\s+/).filter(Boolean);
  const said = ans.split('/').map(v => new RegExp(`\\b${v.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}\\b`, 'i'));
  const lineWords = new Set(tokens(line.replace(BLANK_RE, (m, bid, a) => a.split('/')[0])));
  let best = 0, top = -1;
  sentencesOf(answer).forEach((sentence, i) => {
    const score = (said.some(re => re.test(sentence)) ? 100 : 0) + tokens(sentence).filter(w => lineWords.has(w)).length;
    if(score > top){ top = score; best = i; }
  });
  return best;
}
// A note line with its blanks filled in; the blank `mark` is highlighted.
function filledLine(line, mark){
  let html = '', last = 0;
  line.replace(BLANK_RE, (m, bid, ans, idx) => {
    const word = esc(ans.split('/')[0]);
    html += esc(line.slice(last, idx)) + (bid === mark ? `<mark>${word}</mark>` : word);
    last = idx + m.length; return m;
  });
  return html + esc(line.slice(last));
}
const koToggle = text => `<p class="wko" hidden>${esc(text)}</p><button class="pill sm" type="button" data-wko aria-pressed="false">해석</button>`;

function studyWords(){

function studyReview(){

    ? `<p class="home-empty">아직 해결한 사건이 없어요.</p>`

/* ---------- test tools ---------- */
// Write the correct answer into every blank of the given questions; returns how many blanks were filled.
// Without mark, a blank already written right is left as it is (its ✓ or acorn kept) and not counted (user request:
// 노트 자동 채우기 said 4 when it filled the 2 empty ones, counting the request already written down)
function fillAnswers(i, qids, mark){
  const p = per(i); let n = 0;
  qids.forEach(qid => spk(i).notes[qid].forEach(line =>
    line.replace(/\{\{(\w+)\|([^}]+)\}\}/g, (m, id, ans) => {
      if(!mark && ans.split('/').map(norm).includes(norm(p.notes[id] || ''))) return m;
      p.notes[id] = ans.split('/')[0];
      if(mark) p.marks[id] = 'ok'; else delete p.marks[id];
      n++; return m;
    })
  ));
  return n;
}

// 증거 모두 수집: every clue of every place is found and saved in the evidence notebook (no photo sequence).
$('#devEvidence').onclick = () => {
  let n = 0;
  const later = new Set((ENDING.script || []).filter(item => item.flag).map(item => item.flag)), questioning = new Set(later);
  const gatedBy = (pl, i, flags) => pl.spots.filter(spot => spot.clue === i).every(spot => (spot.when || []).some(k => k.startsWith('!') && flags.has(k.slice(1))));
  PLACES.forEach(pl => pl.clues.forEach((c, i) => {
    if(!c.take || !c.flag || (PACK?.ready || []).includes('@' + c.take)) return;
    if(!c.take.startsWith('!')) later.add(c.flag);
    // something opened first (flagFirst) is left for play only when it is not tapped here: the Christmas box opens on
    // the scale. The violin's curtain is drawn like before, so the button under it is picked up (user report
    // 2026-11-17: no deduction board in 미리보기 after the curtain got its sound)
    else if(c.flagFirst && gatedBy(pl, i, questioning)) later.add(c.flag);
  }));
  PLACES.forEach(place => place.clues.forEach((clue, clueIndex) => {
    // left for play (play: the kite case's leaves, cleared by hand in a tree's close look)
    if(clue.play) return;
    // only once the questioning has come so far (a flag it sets, or the opened box's): found there in play
    if(place.spots.some(spot => spot.clue === clueIndex) && place.spots.filter(spot => spot.clue === clueIndex).every(spot => (spot.when || []).some(k => k.startsWith('!') && later.has(k.slice(1))))) return;
    // a thing only looked at (seen) counts as seen, with no photo
    if(clue.seen && place.spots.some(spot => spot.clue === clueIndex)){ S.found[place.id].add(clueIndex); return; }
    // the scale's boxes, doors and the buttons into close looks (inspect) are no photos
    if(clue.prop || clue.go || clue.inspect || place.balance || !place.spots.some(spot => spot.clue === clueIndex)) return;
    // what a questioning waits for at a place (ENDING.script until: the star's back, once the box is opened) is found
    // there in play (user report: the questioning went on by itself, with nothing to do at the sleigh)
    if((ENDING.script || []).some(item => item.until?.includes(`${place.id}-${clueIndex}`))) return;
    // only the things the deduction needs (PACK.ready '@item', the violin case's) are picked up; the rest stay where
    // they are, to be found and picked up in play (user report: after 추리 완성 the Christmas scale was gone from the
    // storeroom with no picking up, and the box on the sleigh was already open with the star in the bag)
    if(clue.take && !clue.take.startsWith('!') && !(PACK?.ready || []).includes('@' + clue.take)) return;
    if(clue.take){
      S.found[place.id].add(clueIndex);
      if(clue.take.startsWith('!')) S.flags.add(clue.take.slice(1));
      else if(!S.flags.has(`took:${clue.take}`)){ S.items.push(clue.take); S.flags.add(`took:${clue.take}`); }
      if(clue.flag) S.flags.add(clue.flag);
      return;
    }
    S.found[place.id].add(clueIndex);
    if(S.evidence.some(item => item.placeId === place.id && item.clueIndex === clueIndex)) return;
    S.evidence.push({ placeId:place.id, clueIndex, photo:evidencePhoto(place, clueIndex) }); n++;
  }));
  (PACK?.ready || []).forEach(c => { if(c.startsWith('!')) S.flags.add(c.slice(1)); });
  renderPlaces(); renderDock();
  if(S.investigate && S.place){ renderSceneHead(); renderScene(); }
  toast(n ? `증거 ${n}개를 노트에 기록했어요.` : '이미 모든 증거를 모았어요.');
};

    previewCase(); previewDeduced(); openSheet(null);
    const at = ENDING.script.findLastIndex(item => item.lines && !item.claim && !item.join && !item.ask && !item.scene);
    ENDING.script.slice(0, at).forEach(item => (item.until || []).forEach(ref => { const cut = ref.lastIndexOf('-'), pl = placeOf(ref.slice(0, cut)), i = +ref.slice(cut + 1);
      (S.found[pl.id] ||= new Set()).add(i); if(!S.evidence.some(r => evRef(r) === ref)) S.evidence.push({ placeId:pl.id, clueIndex:i, photo:evidencePhoto(pl, i) }); }));
    PLACES.forEach(pl => pl.clues.forEach(c => { if((c.take || c.give) && c.flag && PACK?.previewHandback?.includes(c.take || c.give)) S.flags.add(c.flag); }));
    if(PACK?.previewHandback) PACK.previewHandback.forEach(id => { if(!S.items.includes(id)){ S.items.push(id); S.flags.add(`took:${id}`); } });
    startScript();
    clearTimeout(endTimer); stopVoice();
    ENDING.script.slice(0, at).forEach(item => {
      if(item.flag) S.flags.add(item.flag);
      (item.join || []).forEach(id => { S.visit[id] = { place:spk(accusedId).place, ...PACK.joinPositions[id], ...(!item.leave || item.leave.includes(id) ? { gone:['!confessed'] } : {}) }; if(!S.met.includes(id)) S.met.push(id); });
    });
    endingRound = ENDING.confront.length; S.mood[accusedId] = 'sad';
    renderScene(placeIdOf(accusedId)); renderInterrogationGauge();
    scriptGo(at);
  },
  // the scale in use (user request 2026-11-16): the questioning paused at the sleigh after the officer's order to open a
  // box, everything before it done (its flags, who joined, the gauge so far), the scale carried, its close look open
  weigh:() => {
    previewCase(); previewDeduced(); openSheet(null);
    const at = ENDING.script.findIndex(item => item.scene);
    startScript(); clearTimeout(endTimer); stopVoice();
    ENDING.script.slice(0, at).forEach(item => {
      if(item.flag) S.flags.add(item.flag);
      (item.join || []).forEach(id => { S.visit[id] = { place:spk(accusedId).place, ...PACK.joinPositions[id], ...(!item.leave || item.leave.includes(id) ? { gone:['!confessed'] } : {}) }; if(!S.met.includes(id)) S.met.push(id); });
    });
    endingRound = ENDING.script.slice(0, at).filter(item => item.claim).length; S.mood[accusedId] = 'nervous';
    if(!S.items.includes('scale')) S.items.push('scale');
    S.flags.add('took:scale');
    pauseScript(at);
    openInspect('weigh', 'sleigh');
  },
  // what the detective carries by then (the star, the violin case): without it the hand-over's 소지품 is empty
  // the box it came out of shown open and empty as well (its flag, took:)
  return:() => { previewCase(); previewDeduced(); openSheet(null); S.flags.add('confessed');
    if(PACK?.previewHandback){ S.items = [...PACK.previewHandback]; S.items.forEach(id => S.flags.add(`took:${id}`));
      PLACES.forEach(pl => pl.clues.forEach(c => { if((c.take || c.give) && c.flag && PACK.previewHandback.includes(c.take || c.give)) S.flags.add(c.flag); })); }
    startScript(); },
  review:() => { previewCase(); previewDeduced(); openSheet(null); openReview(); }
};
const PREVIEW_PARTS = PREVIEW_OF[CASE_ID].map(([id, label]) => [id, label, PREVIEW_RUN[id]]);
let previewCaseShown = CASE_ID;
function renderPreviewTools(){
  const here = previewCaseShown === CASE_ID, parts = PREVIEW_OF[previewCaseShown];
  const cases = CASES.filter(c => c.playable), name = c => esc(`${c.no} ${c.title}`);
  $('#devPreview').innerHTML = '<small>미리보기</small><div class="dev-cases">' +
    `<button class="devbtn" type="button" id="previewCase" aria-haspopup="true" aria-expanded="false" aria-label="미리 볼 사건" title="${name(cases.find(c => c.id === previewCaseShown))}"><span>${name(cases.find(c => c.id === previewCaseShown))}</span></button>` +
    `<div class="dev-case-list" id="previewCaseList" hidden>${cases.map(c => `<button class="devbtn" type="button" data-preview-case="${c.id}" aria-pressed="${previewCaseShown === c.id}">${name(c)}</button>`).join('')}</div></div>` +
    parts.map(([id, label]) => `<button class="devbtn" type="button" data-preview="${id}" aria-pressed="${here && id === PREVIEW}">${label}</button>`).join('') +
    (PREVIEW ? '<button class="devbtn" type="button" data-preview-end>미리보기 끝</button>' : '') +
    '<button class="devbtn" type="button" data-stage-reset>스테이지 리셋</button>';
}
// 스테이지 리셋 (user request: in this list, for the case being played, not the whole game's 리셋): the case picked above
// (the one on this page unless another is picked) starts over: its case in progress, its solved mark and its first-check
// results go; the detective's name, the tutorial, the other cases, the word and grammar books and the study days stay.
// The device's own records (in a preview, not the preview's copy in memory); then that case opens from its start.
function resetStage(id){
  saveOff = true;
  try {
    const ls = window.localStorage, read = (key, empty) => { try { return JSON.parse(ls.getItem(key)) || empty; } catch(e){ return empty; } };
    ls.removeItem(caseSaveKey(id));
    ls.setItem(SOLVED_KEY, JSON.stringify(read(SOLVED_KEY, []).filter(c => c !== id)));
    const stats = read(STATS_KEY, {}); delete stats[id]; ls.setItem(STATS_KEY, JSON.stringify(stats));
  } catch(e){}
  if(!PREVIEW && id === CASE_ID) location.reload(); else location.href = caseHref(id);
}
renderPreviewTools();
function openPreviewCases(open){ $('#previewCaseList').hidden = !open; $('#previewCase').setAttribute('aria-expanded', open); }
document.addEventListener('click', e => { if(!e.target.closest('.dev-cases') && $('#previewCaseList')) openPreviewCases(false); });
$('#devPreview').addEventListener('click', e => {
  if(e.target.closest('#previewCase')) return openPreviewCases($('#previewCaseList').hidden);
  const pick = e.target.closest('[data-preview-case]');
  if(pick){ previewCaseShown = pick.dataset.previewCase; return renderPreviewTools(); }
  if(e.target.closest('[data-stage-reset]')) return resetStage(previewCaseShown);
  const b = e.target.closest('[data-preview],[data-preview-end]'); if(!b) return;
  const param = CASE_PARAMS[b.dataset.preview ? previewCaseShown : CASE_ID];
  const query = [param && `case=${param}`, b.dataset.preview && `preview=${b.dataset.preview}`].filter(Boolean).join('&');
  location.href = location.pathname + (query ? `?${query}` : '');
});
// the questioning's test button is the handing over's in the picnic case
if(ENDING.handoff) $('#devInterro').textContent = '전달 완료';

/* ---------- boot ---------- */
loadGame();
renderStage(false); renderDock(); renderPlaces(); renderSceneHead();
if(PACK){
  // another case's page: its review from 학습, else the case (a new one with its key); never the case cards
  $('#caseList').hidden = true;
  if(new URLSearchParams(location.search).get('review') === '1' && solvedCases().includes(CASE_ID)) openReview(true);
  // without a detective name (리셋 on this page) the first meeting is on 홈, as when the app opens,
  // not straight into this case after the name (user request: it went into the case at once)
  else if(!PREVIEW && !detectiveName()) location.replace(location.pathname);
  else if(!PREVIEW) startCase(false);
} else {
  // the app opens on 홈 (on the case cards when coming back from another case); without a detective name, the first
  // meeting and naming come first (user request)
  openCaseList(location.hash === '#cases' ? 'cases' : 'home');
  if(!detectiveName()) meetDetective(null);
}
// a preview: its part, without the test tools' notes
if(PREVIEW){ PREVIEW_PARTS.find(([id]) => id === PREVIEW)?.[2](); $('#toast').hidden = true; }
})();
</script>
