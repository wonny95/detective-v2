<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>숲속 탐정 Pioo</title>
<link rel="preload" href="assets/fonts/Paperlogy-4Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/ui/complete-stamp.png" as="image">
<style>
/* Paperlogy (SIL OFL 1.1), bundled in assets/fonts. "Paperlogy Display" = the SemiBold cut for titles, buttons and stamps,
   so those rules can keep font-weight:400. */
@font-face{font-family:"Paperlogy";src:url("assets/fonts/Paperlogy-4Regular.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Paperlogy";src:url("assets/fonts/Paperlogy-7Bold.woff2") format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Paperlogy Display";src:url("assets/fonts/Paperlogy-6SemiBold.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Paperlogy Display";src:url("assets/fonts/Paperlogy-7Bold.woff2") format("woff2");font-weight:700;font-display:swap}
/* base reset (was supplied by the artifact host) */
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}
/* like a phone app: lists and notes scroll by touch without a visible scrollbar */
*{scrollbar-width:none}
*::-webkit-scrollbar{display:none}

/* Layout: one phone-sized storybook page.
   Conversation view: the person in front of their place's illustration, notebook (Note) docked underneath.
   Part 2 (investigation): one large illustration per place to swipe around and tap for clues; notebook slides up from the Note tab. */
:root{
  --ground:#E6E9D6;
  --paper:#FBF4E6;
  --paper-2:#F4EAD4;
  --line:#E3D5B8;
  --ink:#4A3628;
  --ink-soft:#7D6A58;
  --moss:#8DB48E;
  --moss-deep:#5E8A63;
  --peach:#F6B89A;
  --honey:#F2CF73;
  --berry:#C96F86;
  --sky:#BFD3EE;
  --ok:#5E8A63;
  --no:#C25B5B;
  --f-display:"Paperlogy Display","Paperlogy",system-ui,sans-serif;
  --f-body:"Paperlogy",system-ui,sans-serif;
  --f-hand:"Paperlogy",system-ui,sans-serif;
  --r-wobble:18px 22px 16px 24px / 22px 16px 24px 18px;
  --r-wobble-2:24px 14px 22px 16px / 16px 24px 14px 22px;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--f-body);display:flex;justify-content:center;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px dashed var(--berry);outline-offset:2px}
.hidden-svg{position:absolute;width:0;height:0}

.app{position:relative;width:100%;max-width:430px;height:100%;display:flex;flex-direction:column;overflow:hidden;overflow:clip;background:var(--paper)}
@media (min-width:520px){
  body{align-items:center;padding-block:16px}
  .app{height:min(900px,calc(100% - 8px));border:3px solid var(--ink);border-radius:38px 42px 36px 44px/44px 36px 42px 38px;box-shadow:8px 10px 0 rgba(74,54,40,.18)}
}
.main{position:relative;flex:1 1 auto;min-height:0;display:flex;flex-direction:column;overflow:hidden;overflow:clip}

/* ---------- stage ---------- */
.scene{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;display:flex;flex-direction:column}
.stage-area{position:absolute;inset:0;overflow:hidden;background:var(--paper-2)}
.stage-area .art{width:var(--world-width);height:var(--world-height);transform-origin:0 0;pointer-events:none}
.art > .art-floor{display:none}
.stage-area .art-floor,.art-wrap .art > .art-floor{display:block;position:absolute;left:0;top:100%;width:100%;height:auto;pointer-events:none}
.art-wrap .art{height:calc(100% * var(--art-share, 1))}
.stage-area .spot,.stage-area .scene-npc span{display:none}
.stage-area .scene-npc{pointer-events:none}
.ask-panel{position:absolute;left:0;right:0;bottom:0;z-index:4;display:flex;flex-direction:column;gap:8px;padding:4px 16px 16px}
.ask-panel:empty{display:none}
.ask-top{display:flex;justify-content:flex-end}
.ask-panel:not(.show-ko) .ko{display:none}
.ask-panel .q{box-shadow:3px 3px 0 rgba(74,54,40,.25)}
.app.notes-open .ask-panel{display:none}
.app.discovering .ask-panel{display:none}
.app.investigate .scene{display:none}
.chip[hidden]{display:none}
.chip{position:absolute;top:12px;display:inline-flex;align-items:center;gap:6px;max-width:calc(100% - 192px);box-sizing:border-box;font-family:var(--f-display);font-size:13px;background:var(--paper);border:2px solid var(--ink);border-radius:var(--r-wobble);padding:4px 10px;z-index:4}
.chip.l{left:66px}
.chip-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.map-btn{position:relative}
.map-btn:active{transform:translateY(2px);box-shadow:none}
.map-btn.new::after{content:"";position:absolute;top:-5px;right:-5px;width:12px;height:12px;border-radius:50%;background:var(--berry);border:2px solid var(--paper)}
button.chip{color:var(--ink);cursor:pointer;box-shadow:2px 2px 0 rgba(74,54,40,.2)}
button.chip:disabled{cursor:default;box-shadow:none}
.scene-npc .m-open{opacity:0}
.scene-npc.talking .m-open{opacity:1;transform-box:fill-box;transform-origin:center;animation:chat .18s ease-in-out infinite alternate}
.scene-npc.talking .m-closed{opacity:0}
@keyframes chat{from{transform:scaleY(.35)}to{transform:scaleY(1)}}
.npc-breathe,.npc-gesture{transform-box:fill-box;transform-origin:50% 100%}
.npc-breathe{animation:npc-breathe 4.8s ease-in-out infinite;animation-delay:var(--idle-delay,0s)}
.scene-npc.talking .npc-gesture{animation:npc-speak 1.7s ease-in-out infinite}
.npc-mouth{opacity:0;pointer-events:none}
.scene-npc.talking .npc-mouth{animation:npc-mouth var(--talk-cycle,.74s) steps(1,end) infinite}
.npc-mouth-shape{transform:scaleY(var(--mouth-open,.7));transform-origin:0 0}
@keyframes npc-breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.008,1.012)}}
@keyframes npc-speak{0%,100%{transform:rotate(0)}28%{transform:rotate(-.35deg)}65%{transform:rotate(.3deg)}}
@keyframes npc-mouth{0%,43%,85%,100%{opacity:0;--mouth-open:.2}12%,57%{opacity:1;--mouth-open:.55}25%,70%{opacity:1;--mouth-open:1}}
.app.partner .bubble{left:16px;transform:none;animation:pop-side .25s ease-out}
.app.partner .bubble::after{left:70px}
@keyframes pop-side{from{transform:scale(.85);opacity:0}}
/* phase title card (case start / each suspect coming in) */
.app.ending .chip{visibility:hidden}
/* the map/Note bar is gone during the ending, so the scene runs to the bottom edge */
.app.ending .nav{display:none}
.app.in-interview .spotlight{opacity:1;background:radial-gradient(ellipse 78% 70% at 50% 40%,rgba(255,225,158,.1) 0 35%,rgba(48,31,20,.15) 70%,rgba(28,23,18,.35) 100%)}
.app.interview-arriving .scene::after{content:"";position:absolute;inset:0;z-index:20;background:#30271E;animation:interview-arrive .75s ease both}
@keyframes interview-arrive{0%,15%{opacity:1}100%{opacity:0}}
@media(prefers-reduced-motion:reduce){.app.interview-arriving .scene::after{animation:none;opacity:0;pointer-events:none}}
.ask-panel .end-leave{align-self:center}
/* a photo held up to the suspect */
.presented{position:absolute;inset:0;z-index:7;display:grid;place-items:center;pointer-events:none}
.presented figure{margin:0;width:64%;aspect-ratio:4/3;overflow:hidden;background:#FFFDF7;border:7px solid #FFFDF7;box-shadow:0 10px 24px rgba(40,30,24,.4);animation:present-in 1.3s ease forwards}
.presented svg{display:block;width:100%;height:100%}
@keyframes present-in{0%{opacity:0;transform:translateY(70px) rotate(-3deg) scale(.8)}22%{opacity:1;transform:translateY(0) rotate(-3deg) scale(1)}80%{opacity:1;transform:rotate(-3deg)}100%{opacity:0;transform:translateY(-12px) rotate(-3deg)}}
/* The case file receives a transparent illustrated completion stamp. */
.case-closed{position:absolute;inset:0;z-index:8;display:grid;place-items:center;background:rgba(40,30,24,.45);pointer-events:none;animation:cc-fade 2.6s ease forwards}
.cc-file{position:relative;width:min(76%,290px);padding:34px 18px 132px;text-align:center;background:var(--paper);border:3px solid var(--ink);border-radius:var(--r-wobble);box-shadow:5px 6px 0 rgba(40,30,24,.3);transform:rotate(-1.5deg)}
.cc-file small{display:block;font-size:12px;color:var(--ink-soft)}
.cc-file b{display:block;font-family:var(--f-display);font-weight:400;font-size:24px}
.cc-stamp{position:absolute;left:50%;bottom:8px;display:block;width:min(86%,240px);height:auto;transform:translateX(-50%) rotate(-10deg);animation:cc-stamp .45s cubic-bezier(.2,1.6,.4,1) .55s both}
@keyframes cc-stamp{from{opacity:0;transform:translateX(-50%) rotate(-10deg) scale(2.4)}to{opacity:.92;transform:translateX(-50%) rotate(-10deg) scale(1)}}
@keyframes cc-fade{0%{opacity:0}10%{opacity:1}86%{opacity:1}100%{opacity:0}}
@media(prefers-reduced-motion:reduce){.presented figure,.cc-stamp{animation:none}}
/* the questioning (confront, confession): the room dims around her; the gauge fills as her claims are answered */
.spotlight{position:absolute;inset:0;z-index:3;pointer-events:none;opacity:0;transition:opacity .9s ease;
  background:radial-gradient(ellipse 66% 48% at 50% 40%,rgba(255,236,190,.12) 0 30%,rgba(34,20,10,.42) 62%,rgba(24,14,8,.82) 100%)}
.app.interrogate .spotlight{opacity:1}
/* in the ending every line is also shown in a speech bubble (user decision) — under the gauge while she is questioned,
   its tail pointing down at whoever speaks; it stays up while the evidence drawer is open */
.app.interrogate .bubble.say{--bubble-top:66px}
.bubble.say .say-ko{display:block;margin-top:6px;padding-top:6px;font-family:var(--f-body);font-size:14px;font-weight:700;line-height:1.45;color:var(--berry)}
.bubble.say .say-ko[hidden]{display:none}
.bubble.say .say-foot{display:flex;flex:none;flex-wrap:wrap;justify-content:flex-end;gap:6px;margin-top:12px;padding-top:9px}
.bubble.say .say-foot button{position:static;border:2px solid transparent;border-image:var(--btn) 60 62 62 62 fill / var(--bw) calc(var(--bw) * 1.03) stretch;min-height:30px;padding:0 10px;font-family:var(--f-display);font-size:12px;color:var(--ink)}
.bubble.say .say-foot svg{width:9px;height:9px}
.interrogation-gauge{position:absolute;top:14px;left:50%;z-index:5;display:flex;align-items:center;gap:10px;width:280px;max-width:calc(100% - 48px);box-sizing:border-box;padding:8px 12px;transform:translateX(-50%);background:rgba(40,28,20,.78);border:1.5px solid rgba(255,239,207,.35);border-radius:18px;box-shadow:0 3px 8px rgba(24,14,8,.2);pointer-events:none}
.gauge-label{flex:none;display:block;width:26px;height:26px;margin:-4px 0}
.gauge-track{flex:1;height:13px;overflow:hidden;border:2px solid #4A3628;border-radius:9px;background:#E4D8C3;box-shadow:inset 0 2px 3px rgba(74,54,40,.18)}
.gauge-fill{display:block;width:0;height:100%;border-radius:6px;background:linear-gradient(#F9DE8F,#E7AE4E);box-shadow:inset 0 2px 0 rgba(255,255,255,.45);transition:width .6s cubic-bezier(.2,.8,.3,1)}
.interrogation-gauge.complete .gauge-fill{background:linear-gradient(#D8E9A3,#9CBA67)}
.interrogation-gauge.hit .gauge-track{animation:gauge-hit .65s ease-out}
.interrogation-gauge.reset .gauge-track{animation:gauge-reset .45s ease-out}
@keyframes gauge-hit{35%{box-shadow:0 0 0 4px rgba(249,222,143,.4),0 0 16px rgba(249,222,143,.6)}}
@keyframes gauge-reset{25%,65%{translate:-3px 0}45%,85%{translate:3px 0}}
/* the evidence drawer: a strip of photos under her; picking one plays its sentence, 내밀기 holds it up */
.drawer{position:absolute;left:0;right:0;bottom:0;z-index:6;display:flex;flex-direction:column;gap:8px;padding:12px 0 16px;background:var(--paper);
  border-top:3px solid var(--ink);border-radius:24px 26px 0 0/20px 22px 0 0;box-shadow:0 -6px 18px rgba(34,20,10,.35);
  transform:translateY(105%);visibility:hidden;transition:transform .38s cubic-bezier(.2,.9,.3,1.05),visibility 0s linear .38s}
.drawer.open{transform:none;visibility:visible;transition:transform .42s cubic-bezier(.2,.9,.3,1.05),visibility 0s}
.app.drawer-open .ask-panel{visibility:hidden}
.drawer-head{display:flex;align-items:center;padding:0 16px}
.drawer-head h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:17px}
.drawer-head .x{margin-left:auto;width:32px;height:32px;border:2px solid var(--ink);border-radius:50%;background:var(--paper);font-size:16px;line-height:1}
/* Leave room inside the scroll viewport for a selected card's lift, rotation, ring and shadow. */
.drawer-strip{display:flex;gap:10px;overflow-x:auto;padding:18px 16px 16px;scroll-padding-inline:16px;scroll-snap-type:x proximity;user-select:none;-webkit-user-select:none;cursor:grab}
.drawer-strip.dragging{scroll-snap-type:none;cursor:grabbing}
.drawer-strip svg,.drawer-strip image{-webkit-user-drag:none;pointer-events:none}
.dcard{flex:none;width:104px;display:flex;flex-direction:column;gap:3px;padding:5px 5px 7px;text-align:left;scroll-snap-align:start;background:#FFFDF7;
  border:2px solid var(--ink);border-radius:5px;box-shadow:2px 3px 0 rgba(74,54,40,.15);transition:transform .2s,box-shadow .2s}
.dcard .evidence-photo{border-width:1px;border-color:var(--line);border-radius:0;margin:0}
.dcard .dlabel{font-family:var(--f-hand);font-weight:700;font-size:13px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.dcard .dplace{font-family:var(--f-body);font-size:11px;line-height:1.25;color:var(--ink-soft);overflow-wrap:anywhere}
.dcard[aria-pressed="true"]{transform:translateY(-6px) rotate(-2deg);border-color:var(--berry);box-shadow:0 0 0 3px var(--berry),3px 8px 10px rgba(74,54,40,.25)}
.drawer-pick{display:flex;flex-direction:column;gap:8px;min-height:92px;padding:0 16px}
.drawer-pick p{margin:0;font-size:15px;line-height:1.45}
.drawer .empty-note{padding:0 16px}
/* holding up a photo: the right one gets a red 모순! stamp, the scene jolts and she flinches; a wrong one wobbles and drops */
.presented .contra{position:absolute;left:50%;top:48%;font-family:var(--f-display);font-size:34px;letter-spacing:2px;color:#B8433F;border:5px solid #B8433F;border-radius:12px;padding:0 14px;background:rgba(255,253,247,.75);white-space:nowrap;animation:contra 1.3s ease forwards}
@keyframes contra{0%,28%{opacity:0;transform:translate(-50%,-50%) rotate(-12deg) scale(2.4)}40%{opacity:1;transform:translate(-50%,-50%) rotate(-12deg) scale(1)}82%{opacity:1;transform:translate(-50%,-50%) rotate(-12deg) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) rotate(-12deg) scale(1)}}
.presented.miss figure{animation:present-miss 1.3s ease forwards}
@keyframes present-miss{0%{opacity:0;transform:translateY(70px) rotate(-3deg) scale(.8)}22%{opacity:1;transform:translateY(0) rotate(-3deg) scale(1)}30%{transform:translateX(-12px) rotate(-7deg)}38%{transform:translateX(10px) rotate(2deg)}46%{transform:translateX(-6px) rotate(-5deg)}56%{opacity:1;transform:rotate(-3deg)}100%{opacity:0;transform:translateY(140px) rotate(10deg) scale(.85)}}
.scene.jolt #talkCamera{animation:jolt .42s ease-out}
@keyframes jolt{15%{translate:-7px 3px}35%{translate:6px -3px}55%{translate:-4px 2px}75%{translate:2px -1px}100%{translate:0 0}}
.scene-npc.flinch svg{animation:flinch .5s ease-out}
@keyframes flinch{20%{translate:6px 0;scale:.96 1.03}45%{translate:-4px 0}100%{translate:0 0;scale:1}}
@media(prefers-reduced-motion:reduce){.presented .contra,.presented.miss figure,.scene.jolt #talkCamera,.scene-npc.flinch svg,.interrogation-gauge.hit .gauge-track,.interrogation-gauge.reset .gauge-track{animation:none}.drawer,.gauge-fill{transition:none}}
.stage-card{position:absolute;inset:0;z-index:8;display:grid;place-items:center;background:rgba(74,54,40,.38);pointer-events:none;animation:stage-card 1.9s ease forwards}
.stage-card div{background:var(--paper);border:3px solid var(--ink);border-radius:var(--r-wobble);padding:12px 22px;text-align:center;box-shadow:4px 5px 0 rgba(74,54,40,.25)}
.stage-card small{display:block;font-size:12px;color:var(--ink-soft)}
.stage-card b{display:block;font-family:var(--f-display);font-weight:400;font-size:24px}
@keyframes stage-card{0%{opacity:0}12%{opacity:1}78%{opacity:1}100%{opacity:0}}
.pill.blue{background:var(--sky);color:var(--ink)}

/* Reusable illustrated skin: nine-slice body, independent tail, live text and controls.
   Keep corner pixels fixed as dialogue grows; long copy scrolls while the controls stay visible. */
.bubble{--bubble-top:44px;--bubble-frame:url(assets/ui/speech-paper-frame.png);--bubble-tail:url(assets/ui/speech-paper-tail.png);position:absolute;left:50%;top:var(--bubble-top);transform:translateX(-50%);z-index:5;display:flex;flex-direction:column;box-sizing:border-box;width:min(88%,380px);max-width:calc(100% - 32px);max-height:calc(100% - var(--bubble-top) - 112px);padding:24px 20px;font-family:var(--f-hand);font-size:17px;line-height:1.42;color:var(--ink);filter:drop-shadow(2px 4px 2px rgba(52,32,17,.2));animation:pop .25s ease-out}
/* Opaque paper behind the translucent image slices prevents hairline seams inside the frame. */
.bubble::before{content:"";position:absolute;inset:-8px -3px;z-index:-1;background-color:var(--bubble-paper,#FFF8E9);background-clip:padding-box;border:20px solid transparent;border-image:var(--bubble-frame) 100 fill / 22px / 0 stretch;pointer-events:none}
.bubble::after{content:"";position:absolute;left:50%;bottom:-14px;width:48px;height:28px;transform:translateX(-50%);background:var(--bubble-tail) center/100% 100% no-repeat;pointer-events:none}
.bubble-copy{min-height:0;overflow-y:auto;overscroll-behavior:contain;overflow-wrap:anywhere}
.bubble .tag{display:block;font-family:var(--f-display);font-size:11px;line-height:1.4;color:var(--berry);margin-bottom:6px;letter-spacing:.02em}
.bubble .say-en{display:block}
#bubble .tag{padding-right:22px}
.bubble .bubble-close{position:absolute;top:10px;right:10px;display:grid;place-items:center;width:28px;height:28px;border:0;background:none;font-size:20px;line-height:1;padding:0;color:var(--ink-soft)}
@media(prefers-reduced-motion:reduce){.bubble,.app.partner .bubble{animation:none}}
@keyframes pop{from{transform:translateX(-50%) scale(.85);opacity:0}}

/* ---------- docked notebook (Note) ---------- */
/* Note = a notebook the detective pulls up from the bottom (sketch 3) */
/* The case-file picture (assets/ui/casefile-panel.webp: navy folder with one cream sheet, header strip
   at the top, paper clip top right) is scaled to the panel width, so the padding and the header height
   are % of the width (padding % always refers to width): sheet top 7.9%, header strip 13.6%, sheet
   from 6.5% to 93.8%. */
.dock{position:absolute;left:6px;right:6px;bottom:-4px;height:60%;z-index:11;display:flex;flex-direction:column;box-sizing:border-box;padding:7.9% 9% 0 9.5%;transform:translateY(calc(100% + 48px));transition:transform .55s cubic-bezier(.2,.9,.3,1.05),height .5s cubic-bezier(.3,.9,.3,1)}
/* the picture is a ::before layer so the index tabs (z-index -1) can sit behind it and peek over the folder */
.dock::before{content:"";position:absolute;inset:0;z-index:0;background:url(assets/ui/casefile-panel.webp) top center/100% auto no-repeat;pointer-events:none}
.dock-head,.dock-body{position:relative;z-index:1}
.app.notes-open .dock{transform:translateY(0)}
.app.investigate .dock{height:80%}
.dock-head{flex:none;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:6px 8px;aspect-ratio:81.5 / 13.6;padding:0 2px}
.dock-head h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:18px;display:flex;align-items:center;gap:6px}
.dock-head h2 svg{width:24px;height:24px}
.dock-head h2[hidden]{display:none}
#personTitle{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.dock-head .finish{margin-left:auto;padding:6px 14px;background:var(--moss);font-size:15px}
.dock-head .finish[hidden]{display:none}
/* behind the open notebook the scene darkens toward the bottom, so the notebook stands out from
   warm floors while the NPC's face at the top stays clear */
.note-scrim{position:absolute;inset:0;z-index:10;opacity:0;pointer-events:none;transition:opacity .45s;background:linear-gradient(to bottom,rgba(43,30,20,0) 25%,rgba(43,30,20,.45) 75%)}
.app.notes-open .note-scrim{opacity:1;pointer-events:auto}
.app.notes-open .chip,.app.notes-open .bubble{z-index:12}
/* horizontal notebook tabs: the case file + one per person */
/* Tabs: hand-drawn white paper tabs (assets/ui/tab-1…6.png, cycled) tinted with each page's colour:
   the PNG masks the button and is multiplied over --tab-bg, keeping the pencil outline and grain. */
.who{position:absolute;z-index:-1;bottom:100%;margin-bottom:calc(-2.8% - 14px);left:7%;right:22%;display:flex;align-items:flex-end;gap:4px;min-width:0;overflow-x:auto;padding:4px 2px 0;scrollbar-width:none}
.who::-webkit-scrollbar{display:none}
.who:empty{display:none}
.who button{--tab:url(assets/ui/tab-1.png);flex:none;width:46px;height:44px;padding:0;border:0;position:relative;background:var(--tab-bg,var(--paper-2));display:grid;place-items:center;-webkit-mask:var(--tab) center/100% 100% no-repeat;mask:var(--tab) center/100% 100% no-repeat}
.who button:nth-child(6n+2){--tab:url(assets/ui/tab-2.png)}
.who button:nth-child(6n+3){--tab:url(assets/ui/tab-3.png)}
.who button:nth-child(6n+4){--tab:url(assets/ui/tab-4.png)}
.who button:nth-child(6n+5){--tab:url(assets/ui/tab-5.png)}
.who button:nth-child(6n+6){--tab:url(assets/ui/tab-6.png)}
.who button::before{content:"";position:absolute;inset:0;background:var(--tab) center/100% 100% no-repeat;mix-blend-mode:multiply;pointer-events:none}
.who button > *{position:relative}
.who button[aria-pressed="true"]{background:var(--honey);height:52px}
.who button svg{margin-bottom:10px}
.who button:disabled{cursor:default;filter:grayscale(1);opacity:.45}
.who button svg{width:24px;height:24px;display:block;border-radius:50%}
/* the hand-drawn icon pictures (camera, faces) are a little larger than the line icons */
.who button img{width:30px;height:30px;display:block;margin-bottom:8px}
.dock-body{flex:1;min-height:0;overflow-y:auto;padding:12px 2px 18px;display:flex;flex-direction:column;gap:12px}
/* writing goes straight onto the notebook page: no separate card, keep the pink margin line */
.dock .note-page{background:none;border:0;border-radius:0;padding-left:0;padding-right:0}
.dock-head .listen{flex-wrap:nowrap}
.dock-head .listen[hidden]{display:none}
.dock-head .listen{gap:4px}
.dock-head .listen .pill{white-space:nowrap}
.note-page{position:relative}
.note-page.checked::after{content:"확인됨";position:absolute;top:2px;right:4px;transform:rotate(-10deg);border:3px solid var(--no);border-radius:8px;padding:1px 10px;color:var(--no);font-family:var(--f-display);font-size:18px;opacity:.8;pointer-events:none}
/* checking a finished conversation: the notebook rises to the top (tabs stay visible above it) */
.app.note-full .dock{height:calc(100% - 50px)}
.app.notes-open.note-full .note-scrim{background:rgba(43,30,20,.68);-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px)}
.app.note-full .chip,.app.note-full .bubble{visibility:hidden}
.note-page.checked::after{animation:stamp-in .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes stamp-in{from{transform:rotate(-10deg) scale(1.8);opacity:0}}
.replay-q{display:inline-grid;place-items:center;width:22px;height:22px;margin-left:6px;padding:0;vertical-align:middle;border:1.5px solid var(--ink);border-radius:50%;background:var(--paper)}
.replay-q svg{width:10px;height:10px}
/* review: a full page the player always goes through after solving (user decision), one step at a time —
   result → lines missed at the first check (refill) → the case's grammar → new words (the player picks what goes
   into the word book). Progress bar on top, one big button at the bottom. */
#review{padding:0;background:var(--paper);place-items:stretch}
#review .mcard.review{max-width:none;max-height:none;height:100%;box-sizing:border-box;overflow:hidden;border:0;border-radius:0;box-shadow:none;padding:16px 16px 18px;gap:14px}
.rv-top{flex:none;display:flex;align-items:center;gap:10px;min-height:30px}
.rv-steps{flex:1;display:flex;gap:6px}
.rv-steps i{flex:1;height:7px;border-radius:4px;background:var(--line)}
.rv-steps i.on{background:#E0A526}
.rv-body{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding:2px 2px 8px;scrollbar-width:none}
.rv-body::-webkit-scrollbar{display:none}
.rv-body.mid{justify-content:center;padding-bottom:40px}
.rv-foot{flex:none}
.rv-foot .pill.big{width:100%}
.rv-title{margin:0;font-family:var(--f-display);font-weight:400;font-size:22px;display:flex;align-items:baseline;gap:8px}
.rv-title small{font-size:14px;color:var(--ink-soft)}
.rv-file{position:relative;align-self:center;display:flex;flex-direction:column;align-items:center;gap:2px;margin-top:10px;padding:14px 26px 30px;background:#FFFDF7;border:2px solid var(--line);border-radius:12px;transform:rotate(-1.5deg)}
.rv-file small{font-family:var(--f-display);font-size:13px;color:var(--berry)}
.rv-file b{font-family:var(--f-hand);font-size:22px}
.rv-file img{position:absolute;right:-34px;bottom:-20px;width:136px;transform:rotate(-12deg);animation:rv-stamp .45s cubic-bezier(.3,1.6,.5,1) .2s both}
@keyframes rv-stamp{from{opacity:0;transform:rotate(-12deg) scale(1.8)}to{opacity:1;transform:rotate(-12deg) scale(1)}}
.rv-stars{display:flex;justify-content:center;gap:8px;margin-top:16px}
.rv-stars img{display:block;width:50px;height:auto;animation:rv-star .4s cubic-bezier(.3,1.7,.5,1) calc(.6s + var(--i) * .22s) both}
@keyframes rv-star{from{opacity:0;transform:scale(2.2) rotate(-20deg)}to{opacity:1;transform:none}}
.rv-score{text-align:center;font-family:var(--f-display);font-size:19px}
.rv-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rv-tiles div{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;background:#FFFDF7;border:2px solid var(--line);border-radius:12px;text-align:center;font-size:12px;color:var(--ink-soft);line-height:1.3}
.rv-tiles b{font-family:var(--f-display);font-weight:400;font-size:24px;color:var(--ink)}
.rv-tiles .all b{color:var(--ok)}
.rv-who{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-size:17px}
.rv-who .mini{width:34px;height:34px}
.rv-who small{margin-left:auto;font-size:13px;color:var(--ink-soft)}
.rv-label{font-size:13px;color:var(--ink-soft)}
.rv-listen{display:flex;gap:8px}
.rv-quiz{padding:6px 12px;background:#FFFDF7;border:2px solid var(--line);border-radius:12px}
.rv-quiz .nline{font-size:17px}
.rv-slot{display:inline-block;box-sizing:border-box;min-width:4.5em;height:28px;margin:0 2px;padding:0 8px;vertical-align:middle;border:0;border-radius:8px;background:rgba(125,106,88,.17);font:inherit;font-weight:700;line-height:28px;color:#34506E;text-align:center}
.rv-slot.hit{background:rgba(94,138,99,.18);color:var(--ok)}
.rv-slot.miss{animation:ink-miss .55s ease-out both}
.rv-quiz .got{font-weight:700;color:var(--ok)}
.rv-first{font-size:13px;color:var(--ink-soft)}
.rv-first s{color:var(--no);font-weight:700}
.rv-gcard{display:flex;flex-direction:column;gap:6px;padding:12px 14px;background:#FFFDF7;border:2px solid var(--line);border-radius:12px}
.rv-gcard header{display:flex;align-items:baseline;gap:8px}
.rv-gcard header b{font-family:var(--f-display);font-weight:400;font-size:17px}
.rv-gcard header small{margin-left:auto;font-size:12px;color:var(--ink-soft)}
.rv-gcard .gpat{font-size:13px;color:var(--ink-soft)}
.rv-gcard p{margin:0;font-family:var(--f-hand);font-size:16px;line-height:1.4}
.rv-gcard mark{background:linear-gradient(transparent 58%,rgba(242,207,115,.6) 58%);color:inherit}
.rv-gcard .gko{font-size:13px;line-height:1.5;color:var(--ink-soft)}
.rv-gbtns{display:flex;gap:6px;align-items:center}
.rv-wsec{margin:4px 0 -4px;font-family:var(--f-display);font-weight:400;font-size:14px;color:var(--ink-soft)}
.rv-word{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:8px;padding:8px 10px;background:#FFFDF7;border:2px solid var(--line);border-radius:12px}
.rv-word.kept{border-color:#9FBF9F;background:#F2F7EC}
.rv-word .wword{font-family:var(--f-hand);font-weight:700;font-size:17px}
.rv-word .wsay{display:block;font-size:12px;color:var(--ink-soft)}
.rv-word .wko{grid-column:2 / -1;margin:0;font-size:13px;color:var(--berry)}
.rv-word .keep[aria-pressed="true"]{--btn:url(assets/ui/buttons/sage-flat.png)}
/* evidence notebook: two photos per row so several fit on screen at once */
/* the list: two photo cards per row, each with only its name and where it was found; a card opens it */
.evidence-page{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 10px;align-items:stretch}
.evidence-page .empty-note,.evidence-page .evidence-detail{grid-column:1 / -1;margin:0}
.ev-card{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:0;box-sizing:border-box;text-align:left;padding:6px 6px 8px;background:#FFFDF7;border:2px solid var(--ink);border-radius:5px;box-shadow:2px 3px 0 rgba(74,54,40,.12)}
.ev-card:active{transform:translateY(1px);box-shadow:1px 1px 0 rgba(74,54,40,.12)}
.ev-card .evidence-photo{margin-bottom:3px;border-width:1px;border-color:var(--line);border-radius:0}
/* every title keeps two lines' room (longer ones end in …), so all cards and their photos line up */
.ev-card .ev-title{align-self:stretch;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;min-height:2.4em;font-family:var(--f-hand);font-weight:700;font-size:15px;line-height:1.2}
.ev-card .place{font-size:11px;color:var(--ink-soft)}
/* one piece of evidence: the photo, the detective's sentence (played on opening, the play button again), 해석, and 내밀기 in the ending */
.evidence-detail{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.ev-back{border:0;background:none;padding:2px 0;font-family:var(--f-display);font-size:14px;color:var(--ink-soft)}
.dock-head .ev-back{justify-self:start;min-height:36px}
.evidence-photo{display:block;align-self:stretch;margin:0 0 2px;aspect-ratio:4/3;overflow:hidden;border:2px solid var(--ink);border-radius:6px;background:var(--paper-2)}
.evidence-photo svg{display:block;width:100%;height:100%}
.evidence-detail .place{font-size:12px;color:var(--ink-soft)}
.evidence-detail h4{margin:0;font-family:var(--f-hand);font-size:20px;line-height:1.2}
.evidence-detail p{margin:0;font-size:16px;line-height:1.5}
.evidence-detail .ko{font-size:14px;font-weight:700;color:var(--berry)}
.ev-btns{display:flex;flex-wrap:wrap;gap:5px;margin-top:auto}
.capture-flash{position:absolute;inset:0;z-index:7;background:#fff;pointer-events:none;animation:shutter-flash .38s ease-out forwards}
.capture-view{position:absolute;inset:0;z-index:6;display:grid;place-items:center;background:rgba(30,28,24,.72);overflow:hidden}
.capture-frame{width:calc(100% - 32px);max-width:520px;aspect-ratio:4/3;border:3px solid #FFFDF7;border-radius:6px;overflow:hidden;box-shadow:0 8px 28px #0005;animation:evidence-zoom .45s ease-out both}
.capture-frame svg{display:block;width:100%;height:100%;background:var(--paper)}
@keyframes evidence-zoom{from{transform:scale(.6);opacity:.3}to{transform:scale(1);opacity:1}}
@keyframes shutter-flash{0%{opacity:0}15%{opacity:.78}100%{opacity:0}}
@media(prefers-reduced-motion:reduce){.capture-flash{animation:none;opacity:0}}
@media(prefers-reduced-motion:reduce){.capture-frame{animation:none}}

.choices{border:2.5px solid var(--ink);border-radius:var(--r-wobble-2);background:#EAF2E2;padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px;animation:rise .35s cubic-bezier(.3,1.2,.5,1)}
@keyframes rise{from{transform:translateY(16px);opacity:0}}
.choices .say{font-family:var(--f-display);font-size:14px;display:flex;align-items:center;gap:6px}
.choices .say .pill{margin-left:auto}
.choices:not(.show-ko) .ko{display:none}
.q{width:100%;display:grid;grid-template-columns:28px 1fr;align-items:center;gap:10px;text-align:left;background:#FFFDF7;border:2px solid var(--ink);border-radius:var(--r-wobble);padding:7px 12px 7px 8px;box-shadow:2px 3px 0 rgba(74,54,40,.18)}
.q:active{transform:translateY(2px);box-shadow:none}
.q .n{width:26px;height:26px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-family:var(--f-display);font-size:13px;background:var(--peach)}
/* a question to ask again after a wrong check: blue number */
.q.again .n{background:var(--sky)}
.q .en{display:block;font-family:var(--f-hand);font-weight:700;font-size:16px;line-height:1.1}
.q .ko{display:block;font-size:12px;color:var(--ink-soft);margin-top:2px}

.listen{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--ink);background:var(--paper);border-radius:var(--r-wobble);padding:6px 12px;font-family:var(--f-display);font-size:14px;box-shadow:2px 3px 0 rgba(74,54,40,.2);transition:transform .1s}
.pill:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(74,54,40,.2)}
.pill svg{width:16px;height:16px;flex:none}
.pill.sm{padding:3px 10px;font-size:12px}
.pill[aria-pressed="true"]{background:var(--sky)}
/* 힌트 (user decision): writes the right word into the first empty or wrong blank of the question being written down;
   acorns left for the whole case beside the word. A hinted blank is tinted honey until it is checked. */
.dock-head .listen .pill.hint{gap:3px;padding:0 8px}
.pill.hint .acorn-n{display:inline-flex;align-items:center;gap:1px;font-size:13px}
.pill.hint .acorn-n img{width:15px;height:15px;display:block}
.pill.hint:disabled{opacity:.5}
.blank.hint{background-color:rgba(242,207,115,.5);color:#7A5A12}
.pill:disabled{opacity:.5;cursor:default}

.note-page{background-color:#FFFDF7;background-image:linear-gradient(to right,transparent 30px,rgba(201,111,134,.45) 30px 32px,transparent 32px);border:2px solid var(--ink);border-radius:var(--r-wobble-2);padding:8px 12px 10px 42px;display:flex;flex-direction:column;gap:6px}
.nblock{border-radius:10px;padding:2px 10px}
.nblock.now{background:rgba(242,207,115,.28)}
.nblock .qlabel{display:block;font-family:var(--f-display);font-size:14px;color:var(--ink-soft);padding:6px 0 8px}
.question-state{display:inline-flex;align-items:center;gap:4px;margin:6px 0 2px;padding:2px 8px;border-radius:12px;font-family:var(--f-display);font-size:12px;line-height:1.5}
.question-state.ok{background:#E8EFDD;color:#466249}
.question-state.review{background:#F8EAC4;color:#816124}
/* grammar chips under a checked question (note, review, word book) and the grammar card they open */
.ptoggle{display:inline-flex;align-items:center;gap:4px;min-height:28px;margin:4px 0 2px;padding:0 2px;border:0;background:none;font-family:var(--f-display);font-size:13px;color:var(--ink-soft)}
.ptoggle::after{content:"▾";font-size:11px}
.ptoggle[aria-pressed="true"]::after{content:"▴"}
/* the answer the person said, shown once the question is checked; grammar words are links to their card */
.npassage{display:flex;flex-direction:column;gap:6px;margin:2px 0 4px;padding:8px 10px;border:1.5px dashed var(--line);border-radius:10px;background:rgba(255,253,247,.75);font-size:15px;line-height:1.65}
.npassage[hidden]{display:none}
.npassage p{margin:0}
.npassage .np-ko{padding-top:6px;border-top:1.5px dashed var(--line);font-size:14px;line-height:1.5;color:var(--berry);font-weight:700}
.np-actions{display:flex;align-items:center;justify-content:flex-end;gap:8px}
.np-actions .replay-q{flex:none;margin:0;width:30px;height:30px}
.gmark{display:inline;margin:0;padding:0 1px;border:0;border-bottom:1.5px solid #C9952E;border-radius:0;background:linear-gradient(transparent 58%,rgba(242,207,115,.55) 58%) no-repeat 0 0/100% 100%;font:inherit;color:inherit}
.gcard .gpattern{margin:0;font-family:var(--f-hand);font-weight:700;font-size:24px;line-height:1.2}
.gcard .gko{margin:0;font-size:14px;line-height:1.6}
.gex{display:flex;flex-direction:column;gap:8px;padding-top:10px;border-top:2px dashed var(--line)}
.gex h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:14px;color:var(--ink-soft)}
.gline{display:flex;flex-direction:column;gap:2px;background:#FFFDF7;border:1.5px solid var(--line);border-radius:10px;padding:6px 10px}
.gline .wwho{font-size:12px}
.gline .wwho .mini{width:22px;height:22px}
.gline p{margin:0;font-family:var(--f-hand);font-size:15px;line-height:1.4}
.gline mark{background:#F8EAC4;color:var(--ink);border-radius:3px;padding:0 2px}
.wb-switch{display:flex;gap:8px}
.blank.review{background-color:rgba(188,152,84,.2);box-shadow:inset 0 0 0 1.5px #BC9854}
.nline{font-family:var(--f-hand);font-size:17px;line-height:38px;min-height:38px;background-image:linear-gradient(to top,var(--line) 0 2px,transparent 2px)}
.empty-note{font-size:13px;color:var(--ink-soft);line-height:1.6;padding-block:8px}
/* written answers are in neutral pen ink. A blank is a faint rounded slot (user decision: no dashed underline) */
.blank{font:inherit;font-weight:700;color:#34506E;border:0;background-color:rgba(125,106,88,.17);min-width:3.5em;padding:0 6px;margin:0 2px;text-align:center;border-radius:7px}
/* in a ruled line the blank still takes the line's full height (so it sits on the ruling), but its slot is
   inset 5px top and bottom by transparent borders */
.nline .blank{box-sizing:border-box;height:38px;vertical-align:bottom;border-block:5px solid transparent;background-clip:padding-box;border-radius:12px}
.blank:focus{outline:none;background-color:rgba(242,207,115,.45)}
.blank.hot{background-color:rgba(141,180,142,.4)}
.blank.ok{background-color:rgba(94,138,99,.13);color:var(--ok)}
/* a question just written down right (.fresh, one render only): the right blanks light up one by one, 확인됨 is
   stamped, the notebook rises, the 지문 toggle floats up, then the passage unfolds and its grammar is highlighted */
.nblock.fresh .blank.ok{animation:ink-ok .5s cubic-bezier(.3,1.5,.5,1) calc(var(--i) * 110ms) both}
@keyframes ink-ok{0%{transform:scale(1)}35%{transform:scale(1.14);background-color:rgba(141,180,142,.45)}100%{transform:scale(1)}}
.nblock.fresh .question-state{animation:state-stamp .45s cubic-bezier(.3,1.6,.5,1) .2s both}
@keyframes state-stamp{from{transform:scale(1.9) rotate(-8deg);opacity:0}}
.nblock.fresh .ptoggle{animation:rise .38s ease-out .6s both}
.nblock.fresh .npassage{animation:unfold .5s ease-out .95s both}
@keyframes unfold{from{opacity:0;transform:translateY(-6px);clip-path:inset(0 0 100% 0)}to{opacity:1;transform:none;clip-path:inset(0 0 -4px 0)}}
.nblock.fresh .gmark{animation:mark-sweep .5s ease-out calc(1.4s + var(--i) * 180ms) both}
@keyframes mark-sweep{from{background-size:0% 100%;border-bottom-color:transparent}}
/* a check with wrong blanks (.miss, one render only): those blanks shake with a red flash and 다시 확인 jolts —
   it still never shows the right answer */
.nblock.miss .blank.review{animation:ink-miss .55s ease-out calc(var(--i) * 50ms) both}
@keyframes ink-miss{0%{transform:translateX(0)}12%{transform:translateX(-6px);background-color:rgba(201,111,134,.4)}28%{transform:translateX(6px)}44%{transform:translateX(-4px)}60%{transform:translateX(4px);background-color:rgba(201,111,134,.25)}78%{transform:translateX(-2px)}100%{transform:translateX(0)}}
.nblock.miss .question-state{animation:state-jolt .5s ease-out .05s both}
@keyframes state-jolt{0%{transform:scale(1.35) rotate(-6deg)}35%{transform:scale(1) rotate(4deg)}60%{transform:rotate(-2deg)}100%{transform:none}}
@media (prefers-reduced-motion:reduce){.nblock.fresh *,.nblock.miss *{animation:none!important}.dock{transition:transform .2s}}
.blank.no{color:var(--no);text-decoration:line-through 2.5px var(--no)}
.howto{font-size:12px;color:var(--ink-soft);margin:0;line-height:1.5}
.bank{display:flex;flex-wrap:wrap;gap:8px}
.word{touch-action:none;user-select:none;-webkit-user-select:none;border:2px solid var(--ink);border-radius:12px 14px 11px 15px;background:var(--honey);padding:4px 11px;font-family:var(--f-hand);font-weight:700;font-size:15px;box-shadow:2px 2px 0 rgba(74,54,40,.22);cursor:grab}
.word:nth-child(3n+1){background:#F8D9C6}
.word:nth-child(3n+2){background:#DCEAD3}
.word.sel{outline:3px solid var(--berry);outline-offset:2px}
.ghost{position:fixed;z-index:100;pointer-events:none;transform:translate(-50%,-60%) rotate(-4deg);opacity:.95}
.word-flight{position:fixed;z-index:100;pointer-events:none;margin:0;box-sizing:border-box;white-space:nowrap;transform-origin:center}
.big{width:100%;justify-content:center;font-size:17px;padding:11px 14px;background:var(--berry);color:#FFFDF7}
.big.green,.sm.green{background:var(--moss);color:var(--ink)}

/* ---------- investigation: one large illustration per place, tap to find clues ---------- */
.inv{display:none;position:relative;flex:1 1 auto;min-height:0;flex-direction:column;background:var(--paper)}
.app.investigate .inv{display:flex}
/* as tall as the hint button beside it (top 10px + 36px + 10px), the place name centred on the same line */
/* the place name floats over the picture as a paper chip, like the top-left chip of a conversation
   (user decision: no header band or rule above the place) */
.inv-head{position:absolute;top:10px;left:66px;right:12px;z-index:4;display:flex;pointer-events:none}
.inv-head h2{--btn:url(assets/ui/buttons/cream-flat.png);--bw:15px;display:inline-flex;align-items:center;box-sizing:border-box;min-height:36px;max-width:100%;margin:0;padding:0 14px;border:2px solid transparent;
  border-image:var(--btn) 60 62 62 62 fill / var(--bw) calc(var(--bw) * 1.03) stretch;font-family:var(--f-display);font-weight:400;font-size:15px;line-height:1;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inv-head h2:empty{display:none}

.badge{display:inline-block;font-family:var(--f-display);font-size:12px;border:1.5px solid var(--ink);border-radius:10px;padding:1px 8px;background:var(--paper);white-space:nowrap}
.art-stage{position:relative;flex:1 1 auto;min-height:0;background:var(--paper-2)}
.art-wrap{position:absolute;inset:0;overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;scrollbar-width:none}
.art-wrap::-webkit-scrollbar{display:none}
.art{position:relative;height:100%;aspect-ratio:3/2;transform-origin:0 0;user-select:none;-webkit-user-select:none}
.art > svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.scene-npc{position:absolute;z-index:2;padding:0;border:0;background:transparent;transform:translateX(-50%);cursor:pointer}
.scene-npc svg{display:block;width:100%;height:100%;overflow:visible}
.scene-npc span{position:absolute;left:50%;bottom:-18px;transform:translateX(-50%);padding:2px 8px;border:1.5px solid var(--ink);border-radius:12px;background:var(--paper);color:var(--ink);font-family:var(--f-hand);font-size:13px;font-weight:700;white-space:nowrap}
.scene-npc:hover span,.scene-npc:focus-visible span{background:var(--honey)}
.scene-npc:focus-visible{outline:3px dashed var(--berry);outline-offset:4px;border-radius:18px}
.spot{position:absolute;padding:0;border:0;background:transparent;border-radius:16px;cursor:zoom-in}
.tapfx{position:absolute;pointer-events:none;transform:translate(-50%,-50%);animation:tapfx .9s ease-out forwards;white-space:nowrap}
.tapfx.miss{font-family:var(--f-hand);font-weight:700;font-size:15px;color:var(--ink);background:rgba(255,253,247,.85);border-radius:10px;padding:0 8px}
@keyframes tapfx{from{opacity:1;transform:translate(-50%,-50%) scale(.6)}to{opacity:0;transform:translate(-50%,-80%) scale(1.15)}}
.swipe-hint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:rgba(74,54,40,.8);color:var(--paper);padding:6px 12px;border-radius:14px;font-size:12px;pointer-events:none;white-space:nowrap}
.people-here{display:flex;flex-direction:column;gap:6px}
.people-here .lbl{font-family:var(--f-display);font-size:12px;color:var(--ink-soft)}
.people-row{display:flex;gap:8px;flex-wrap:wrap}
.person{display:flex;align-items:center;gap:6px;border:2px solid var(--ink);border-radius:var(--r-wobble);background:#FFFDF7;padding:3px 12px 3px 3px;font-family:var(--f-hand);font-weight:700;font-size:14px;box-shadow:2px 2px 0 rgba(74,54,40,.2)}
.person .mini{width:32px;height:32px}

/* ---------- bottom navigation ---------- */
.nav{flex:none;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:center;gap:10px;padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:3px solid var(--ink);background:var(--paper-2);position:relative;z-index:20}
.tab{display:flex;align-items:center;justify-content:center;gap:6px;min-height:46px;border:2.5px solid var(--ink);border-radius:var(--r-wobble);background:var(--paper);font-family:var(--f-display);font-size:15px;box-shadow:2px 3px 0 rgba(74,54,40,.22)}
.tab svg{width:24px;height:24px;flex:none}
/* in a case: the way out to the case list sits top-left (user decision; the case stays as it was and resumes).
   Under the notebook's dimming and the map sheet, which have their own ways back. */
.top-back{position:absolute;top:10px;left:14px;z-index:9;box-sizing:border-box;width:44px;min-height:36px;padding:0;display:grid;place-items:center}
.top-back svg{width:20px;height:20px;display:block}
.app.ending .top-back{display:none}.tab[aria-expanded="true"]{background:var(--honey)}

/* Paper buttons: flat hand-drawn button art (assets/ui/buttons/*-flat.png, no raised edge).
   border-image keeps the rounded ends unstretched; only the straight middle stretches. --bw = drawn corner size. */
.pill,.tab{--btn:url(assets/ui/buttons/cream-flat.png);--bw:15px;border:2px solid transparent;border-radius:0;box-shadow:none!important;background:none!important;
  border-image:var(--btn) 60 62 62 62 fill / var(--bw) calc(var(--bw) * 1.03) stretch}
.pill.sm{--bw:12px}
.pill.big,.tab{--bw:20px}
.pill.big{--btn:url(assets/ui/buttons/berry-flat.png)}
.pill.green,.dock-head .finish{--btn:url(assets/ui/buttons/sage-flat.png)}
.pill.hint,.tab[aria-expanded="true"]{--btn:url(assets/ui/buttons/honey-flat.png)}
.pill[aria-pressed="true"],.pill.blue{--btn:url(assets/ui/buttons/sky-flat.png)}
.pill:active,.tab:active{transform:translateY(1px);filter:brightness(.94)}
/* Toolbar buttons — the top-left way back, the hint, 다시 듣기 / 천천히 and 기록 완료 — share one paper look and
   one size: 36px tall, 14px text; only the colour tells them apart (cream: move/listen, honey: hint, sage: done). */
.chip{--btn:url(assets/ui/buttons/cream-flat.png);--bw:15px;border:2px solid transparent;border-radius:0;background:none;
  border-image:var(--btn) 60 62 62 62 fill / var(--bw) calc(var(--bw) * 1.03) stretch}
button.chip{box-shadow:none}
button.chip:active{transform:translateY(1px);filter:brightness(.94)}
.chip{top:10px}
.chip,.dock-head .listen .pill,.dock-head .finish{box-sizing:border-box;min-height:36px;padding:0 12px;font-size:14px;line-height:1}
/* four buttons share the notebook head now (다시 듣기 · 천천히 · 힌트 · 기록 완료), so they are a little narrower */
.dock-head .listen .pill,.dock-head .finish{padding:0 8px;font-size:13px}

/* ---------- sheets ---------- */
.sheet{position:absolute;left:0;right:0;bottom:0;height:86%;z-index:10;background:var(--paper);border-top:3px solid var(--ink);border-radius:28px 32px 0 0/26px 30px 0 0;box-shadow:0 -6px 0 rgba(74,54,40,.12);transform:translateY(104%);transition:transform .32s cubic-bezier(.3,1.2,.5,1);display:flex;flex-direction:column}
.sheet.open{transform:none}

.mini{width:34px;height:34px;flex:none;border-radius:50%;background:var(--sky);border:2px solid var(--ink);overflow:hidden}
.mini svg{width:100%;height:100%;display:block}
/* the bust sits low in the round frame so the shoulders meet its edge */
.mini img.face{width:100%;height:100%;display:block;transform:translateY(8%) scale(1.06)}

/* village map: full-screen over the whole app (covers the bottom tabs) */
.sheet.full{top:0;height:auto;z-index:30;border-top:0;border-radius:0;box-shadow:none}
/* like a paper map pulled out of the bag: it slides up from below, slightly turned, and settles flat on the table
   with a small bounce; closing slides it back down. The picture keeps its size the whole time. */
.sheet.full{visibility:hidden;transform-origin:50% 100%;transform:translateY(108%) rotate(4deg);box-shadow:0 -4px 18px rgba(50,30,15,.25);
  transition:transform .34s cubic-bezier(.5,0,.9,.4),visibility 0s linear .34s}
.sheet.full.open{visibility:visible;transform:none;transition:transform .5s cubic-bezier(.22,1.12,.36,1),visibility 0s}
.sheet.full .map-head,.sheet.full .map-foot{opacity:0;transition:opacity .12s}
.sheet.full.open .map-head,.sheet.full.open .map-foot{opacity:1;transition:opacity .3s .32s}
@media(prefers-reduced-motion:reduce){.sheet.full,.sheet.full .map-head,.sheet.full .map-foot{transition:none!important}}
/* the map picture (9:16) covers the whole screen; the title and the footer float over it */
/* nothing but the hand-drawn close button over the top of the map (user decision: no title, no white fade) */
.map-head{position:absolute;top:10px;right:12px;z-index:1}
.map-head .x{display:block;width:42px;height:42px;padding:0;border:0;background:url(assets/ui/close-button.png) center/contain no-repeat;filter:drop-shadow(0 3px 0 rgba(74,54,40,.3))}
.map-head .x:active{transform:translateY(1px)}
.map-stage{position:absolute;inset:0;overflow:hidden;container-type:size;background:#7FA06A}
.map{position:absolute;left:50%;top:50%;width:max(100cqw, 100cqh * 9 / 16);aspect-ratio:9 / 16;transform:translate(-50%,-50%)}
.map-art{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
.map-empty{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);margin:0;background:rgba(251,244,230,.92);border:2px dashed var(--ink-soft);border-radius:14px;padding:8px 14px;font-size:13px;color:var(--ink-soft);white-space:nowrap}
.map-foot{position:absolute;left:0;right:0;bottom:0;z-index:1;display:flex;flex-direction:column;gap:4px;padding:0 16px 14px;pointer-events:none}
.map-foot > *{pointer-events:auto}
.map-foot:has(#accuseBtn[hidden]){display:none}
/* 범인 지목하기 is the same big berry button on the map, in a place and in a conversation (once every conversation is done);
   on the map and in a place it floats over the picture with a short brown shadow (user decision: no white fade band) */
.accuse-foot{position:absolute;left:0;right:0;bottom:0;z-index:3;display:flex;flex-direction:column;padding:0 16px 14px;pointer-events:none}
.accuse-foot > *{pointer-events:auto}
.map-foot .pill.big,.accuse-foot .pill.big{filter:drop-shadow(0 4px 0 rgba(74,54,40,.35))}
.art-stage:has(.accuse-foot:not([hidden])) .swipe-hint{bottom:78px}
.pin{position:absolute;transform:translate(-50%,-50%);border:2px solid var(--ink);background:var(--paper);border-radius:var(--r-wobble);padding:4px 10px;font-family:var(--f-display);font-size:13px;white-space:nowrap;box-shadow:2px 2px 0 rgba(74,54,40,.25);display:flex;flex-direction:column;align-items:center;gap:3px}
.pin.crime{background:var(--berry);color:#FFFDF7}
/* a place that has just become known: the pin pops out, then a honey ring pulses around it */
.pin.fresh{animation:pin-pop .6s cubic-bezier(.22,.7,.25,1) .5s both;z-index:2}
.pin.fresh::after{content:"";position:absolute;inset:-7px;border:2px solid var(--honey);border-radius:20px;opacity:0;pointer-events:none;animation:pin-ring 1.2s ease-out 1.1s 2}
@keyframes pin-pop{from{transform:translate(-50%,-50%) scale(0)}to{transform:translate(-50%,-50%) scale(1)}}
@keyframes pin-ring{0%{opacity:1;transform:scale(.92)}100%{opacity:0;transform:scale(1.45)}}
@media(prefers-reduced-motion:reduce){.pin.fresh,.pin.fresh::after{animation:none}.pin.fresh{box-shadow:0 0 0 4px var(--honey)}}
.pin-label{display:flex;align-items:center;gap:4px}
.pin-people{display:flex;gap:2px}
.pin-people .mini{width:24px;height:24px;border-width:1.5px}

/* ---------- modals ---------- */
.modal{position:absolute;inset:0;z-index:40;background:rgba(74,54,40,.38);display:grid;place-items:center;padding:16px}
.modal[hidden]{display:none!important}
.mcard{width:100%;max-width:370px;max-height:100%;overflow-y:auto;background:var(--paper);border:3px solid var(--ink);border-radius:26px 30px 24px 32px/30px 24px 32px 26px;padding:18px 18px 16px;box-shadow:5px 6px 0 rgba(74,54,40,.25);display:flex;flex-direction:column;gap:12px}
.mcard h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:24px;text-wrap:balance}
.mcard p{margin:0;line-height:1.6;font-size:14px}
.eyebrow{font-family:var(--f-hand);font-weight:700;font-size:15px;color:var(--berry)}
.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;counter-reset:s}
.steps li{display:grid;grid-template-columns:26px 1fr;gap:8px;font-size:13px;line-height:1.45;counter-increment:s}
.steps li::before{content:counter(s);width:24px;height:24px;border-radius:50%;border:2px solid var(--ink);background:var(--honey);display:grid;place-items:center;font-family:var(--f-display);font-size:12px}
/* case select: the first screen — a cork board with one pinned photo per case, joined in order by a red string */
.cases{box-sizing:border-box;position:absolute;inset:0;z-index:35;overflow:hidden;display:flex;flex-direction:column;background:var(--paper)}
.cases-head h1{margin:2px 0 0;font-family:var(--f-hand);font-weight:700;font-size:31px;line-height:1}
.cases-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.streak{display:inline-flex;align-items:center;gap:3px;font-family:var(--f-display);font-size:14px;color:var(--ink);background:#FFFDF7;border:2px solid var(--ink);border-radius:14px;padding:2px 10px 2px 6px}
.streak svg{width:18px;height:18px}
.board{position:relative;flex:1 0 auto;min-height:500px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-evenly;gap:10px;padding:36px 8px 20px;
  /* Higgsfield art (assets/ui/README.md): a cork tile repeated as far as the board grows, inside a wooden frame cut
     into nine pieces — the corners stay put, the sides stretch with the board's length */
  border:18px solid transparent;border-radius:9px;border-image:url(assets/ui/corkboard-frame.webp) 86 / 18px stretch;
  background:#D69C62 url(assets/ui/corkboard-cork.webp) 0 0/320px 320px repeat border-box;
  box-shadow:inset 0 3px 14px rgba(60,35,15,.4),inset 0 0 0 1px rgba(74,54,40,.35);filter:drop-shadow(2px 4px 0 rgba(74,54,40,.18))}
/* the photo card is Higgsfield art (assets/ui/polaroid-card.webp), stretched to the card's box */
.polaroid{--tilt:0deg;position:relative;z-index:1;display:block;box-sizing:border-box;width:52%;padding:9px 9px 12px;text-align:left;
  background:url(assets/ui/polaroid-card.webp) 0 0/100% 100% no-repeat;border:0;filter:drop-shadow(2px 5px 4px rgba(50,30,15,.35));transform:rotate(var(--tilt));
  animation:pol-in .5s cubic-bezier(.3,1.4,.5,1) calc(var(--i) * 110ms) both}
.polaroid.l{align-self:flex-start;margin-left:4%}
.polaroid.r{align-self:flex-end;margin-right:4%}
@keyframes pol-in{from{opacity:0;transform:translateY(-18px) rotate(calc(var(--tilt) * -2))}}
button.polaroid:active{transform:rotate(var(--tilt)) translateY(2px) scale(.98);filter:drop-shadow(1px 2px 2px rgba(50,30,15,.35))}
.pol-photo{display:block;aspect-ratio:4/3;border:1.5px solid var(--ink);overflow:hidden;background:#3E3128}
.pol-photo svg{width:100%;height:100%;display:block}
.pol-cap{display:block;padding:8px 2px 0}
.pol-cap .case-title{font-size:17px;margin:1px 0 4px}
.polaroid.current{width:64%}
.polaroid.current .case-title{font-size:20px}
.polaroid.locked{width:42%;cursor:default;filter:saturate(.45) brightness(.94) drop-shadow(2px 4px 3px rgba(50,30,15,.3))}
.polaroid.locked .pol-photo{display:grid;place-items:center;border-style:dashed;background:#5A4A3C;font-family:var(--f-display);font-size:38px;color:rgba(255,253,247,.45)}
.polaroid.locked .case-no{color:var(--ink-soft)}
.case-lock{display:flex;align-items:center;gap:3px;margin-top:2px;font-size:11px;line-height:1.3;color:var(--ink-soft)}
.case-lock svg{flex:none;width:13px;height:13px}
/* Taut thread runs straight between pins; restrained ink layers give it a soft yarn surface. */
.board-thread{fill:none;stroke-linecap:round;stroke-linejoin:round}
.thread-shadow{stroke:rgba(57,31,16,.24);stroke-width:3.2;transform:translate(1px,1.6px)}
.thread-edge{stroke:#843A34;stroke-width:2.7}
.thread-core{stroke:#B64D44;stroke-width:1.9}
.thread-light{stroke:#E19A80;stroke-opacity:.55;stroke-width:.65;transform:translate(-.3px,-.4px)}
/* Upper-left highlights on the tack art cast its alpha silhouette down and right. */
.board-string .tack{filter:drop-shadow(4px 6px 2px rgba(57,31,16,.38))}
.board-string{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none;overflow:visible;animation:fade-in .4s ease-out .55s both}
@keyframes fade-in{from{opacity:0}}
@media (prefers-reduced-motion:reduce){.polaroid,.board-string{animation:none}}
.case-no{display:block;font-family:var(--f-display);font-size:12px;color:var(--berry)}
.case-title{display:block;font-family:var(--f-hand);font-weight:700;font-size:21px;line-height:1.1;margin:2px 0 8px}
.badge.st-new{background:var(--honey)}
.badge.st-going{background:var(--sky)}
.badge.st-solved{background:var(--moss)}
.case-focus{display:block;font-size:12px;color:var(--ink-soft);margin:0 0 6px}
.case-stars{display:inline-flex;gap:1px;margin-left:6px;vertical-align:middle}
.case-stars img{display:block;width:16px;height:auto}
/* home: the screens outside a case (사건 · 단어장 · 복습 · 내 기록), each scrolling above the app menu */
.home-page{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:18px;padding:28px 16px 20px}
.home-page[hidden]{display:none}
.cases .nav{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding-left:12px;padding-right:12px}
.cases .nav .tab{--bw:16px;flex-direction:column;gap:1px;min-height:54px;font-size:13px}
.cases .nav .tab svg{width:22px;height:22px}
.cases .nav .tab[aria-current="page"]{--btn:url(assets/ui/buttons/honey-flat.png)}
.home-sec{margin:4px 0 0;font-family:var(--f-display);font-weight:400;font-size:16px}
.home-sec small{font-size:13px;color:var(--ink-soft)}
.home-empty{margin:20px 0;text-align:center;font-size:14px;color:var(--ink-soft)}
.wcard{display:flex;flex-direction:column;gap:5px;align-items:flex-start;background:#FFFDF7;border:2px solid var(--ink);border-radius:12px 16px 14px 18px/16px 12px 18px 14px;padding:10px 12px}
.wtop{display:flex;align-items:center;gap:8px;width:100%;min-width:0}
.wtop .replay-q{margin-left:auto;flex:none}
.wword{font-family:var(--f-hand);font-weight:700;font-size:20px;line-height:1.15}
.wsay{display:block;font-size:12px;color:var(--ink-soft)}
.wline{margin:0;font-family:var(--f-hand);font-size:14px;line-height:1.4;color:var(--ink-soft)}
.wline mark{background:#F8EAC4;color:var(--ink);border-radius:3px;padding:0 2px}
.wko{margin:0;font-size:14px;font-weight:700;color:var(--berry)}
.wwho{display:flex;align-items:center;gap:6px;font-family:var(--f-display);font-size:14px}
.wwho .mini{width:26px;height:26px}
.wq{font-size:12px;color:var(--ink-soft)}
.wbtns{display:flex;gap:6px}
.rv-case{flex-direction:row;align-items:center;gap:10px}
.rv-case > span{flex:1;min-width:0}
.stat-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{display:flex;flex-direction:column;gap:2px;background:#FFFDF7;border:2px solid var(--ink);border-radius:12px 16px 14px 18px/16px 12px 18px 14px;padding:10px 12px}
.stat b{font-family:var(--f-display);font-weight:400;font-size:24px;line-height:1.1}
.stat span{font-size:12px;color:var(--ink-soft)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center;font-size:11px;color:var(--ink-soft)}
.week i{display:block;width:26px;height:26px;margin:0 auto 3px;border-radius:50%;border:2px dashed var(--line);box-sizing:border-box}
.week .on i{background:var(--honey);border:2px solid var(--ink)}
.week .today{color:var(--ink);font-weight:700}
.home-page > .pill{align-self:flex-start}
.linkbtn{border:0;background:none;padding:4px;text-decoration:underline;font-size:12px;color:var(--ink-soft);align-self:center}
/* tutorial: one step per page, picture guide on top */
.tut{gap:12px}
.tut-top{display:flex;align-items:center;gap:8px}
.tut-count{font-family:var(--f-display);font-size:12px;color:var(--ink-soft)}
.tut-skip{margin-left:auto;border:0;background:none;font-size:12px;color:var(--ink-soft);text-decoration:underline;padding:4px}
.tut-fig{border:2px solid var(--ink);border-radius:var(--r-wobble-2);background:#F3ECDD;overflow:hidden}
.tut-fig svg{display:block;width:100%;height:auto;animation:tutin .3s ease-out}
@keyframes tutin{from{opacity:0;transform:translateY(8px)}}
.tut h2{font-size:22px}
.tut p{font-size:14px;line-height:1.65}
.tut-dots{display:flex;justify-content:center;gap:6px}
.tut-dots i{width:8px;height:8px;border-radius:5px;background:var(--paper);border:1.5px solid var(--ink);transition:width .2s}
.tut-dots i.on{width:22px;background:var(--berry)}
.tut-nav{display:flex;gap:8px}
.tut-nav .big{flex:1;width:auto}
.tut-fig .pulse{transform-box:fill-box;transform-origin:center;animation:tpulse 1.4s ease-in-out infinite}
@keyframes tpulse{0%,100%{transform:scale(.85);opacity:.95}50%{transform:scale(1.2);opacity:.35}}
.tut-fig .wave{animation:twave 1.2s ease-in-out infinite}
.tut-fig .wave.w2{animation-delay:.2s}
.tut-fig .wave.w3{animation-delay:.4s}
@keyframes twave{0%,100%{opacity:.15}50%{opacity:1}}
.tut-fig .drag{animation:tdrag 3.4s ease-in-out infinite}
.tut-fig .drag2{animation:tdrag2 3.4s ease-in-out infinite}
@keyframes tdrag2{0%,15%{transform:translate(0,0)}55%,85%{transform:translate(116px,-46px)}100%{transform:translate(0,0)}}
@keyframes tdrag{0%,15%{transform:translate(0,0)}55%,85%{transform:translate(121px,-90px)}100%{transform:translate(0,0)}}
.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pick button{border:2.5px solid var(--ink);border-radius:var(--r-wobble);background:#FFFDF7;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-family:var(--f-hand);font-weight:700;font-size:14px}
.pick .mini{width:58px;height:58px}
/* the accusation notice: whom the player just named, before the questioning (or their rebuttal) starts */
.accused{align-items:center;text-align:center;gap:14px;max-width:300px}
.accused .mini{width:84px;height:84px;border-width:2.5px}
.mcard .accused-text{font-family:var(--f-display);font-size:18px;line-height:1.5;text-wrap:balance}
.accused .pill.big{align-self:stretch}
.mcard .leave-sub{margin-top:-8px;font-size:13px;color:var(--ink-soft)}

.toast{position:absolute;left:50%;top:58px;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:14px;font-size:13px;max-width:86%;text-align:center;pointer-events:none;transition:opacity .25s}
.toast[hidden]{display:block!important;opacity:0}
.toast.discovery-toast{background:var(--paper);color:var(--ink);border:1.5px solid rgba(74,54,40,.3);box-shadow:0 3px 12px rgba(74,54,40,.12)}

/* test tool outside the frame: only on screens wide enough to keep it left of the phone; hidden at phone/tablet widths */
.devtools{display:none}
.devbtn[aria-pressed="true"]{background:var(--honey)}
.devbtn{border:2px dashed var(--ink);background:var(--paper-2);color:var(--ink);border-radius:12px;font-family:var(--f-display);font-size:14px;padding:8px 14px;opacity:.9}
@media (min-width:768px){
  .devtools{position:fixed;z-index:200;top:16px;left:16px;display:flex;flex-direction:column;gap:8px}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<svg class="hidden-svg" aria-hidden="true">
  <defs>
    <filter id="wob" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="3"/>
    </filter>
    <symbol id="pine" viewBox="0 0 40 80">
      <path d="M20 2 L35 32 L27 32 L39 58 L1 58 L13 32 L5 32Z" fill="#7FA57F" stroke="#4A3628" stroke-width="2" stroke-linejoin="round"/>
      <rect x="17" y="58" width="6" height="16" fill="#9C7656" stroke="#4A3628" stroke-width="2"/>
    </symbol>
    <symbol id="acorn" viewBox="0 0 20 20">
      <path d="M4 8 Q10 3 16 8 Z" fill="#9C7656" stroke="#4A3628" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M5 8 Q5 16 10 18 Q15 16 15 8Z" fill="#E8B27A" stroke="#4A3628" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M10 4 L10 1.5" stroke="#4A3628" stroke-width="1.6" stroke-linecap="round"/>
    </symbol>
    <symbol id="caseIcon" viewBox="0 0 24 24">
      <g stroke="#4A3628" stroke-width="1.6" stroke-linejoin="round"><path d="M2.5 6.5 h7 l2 2 h10 v11.5 h-19z" fill="#E8C79A"/><path d="M2.5 10 h19" fill="none"/></g>
    </symbol>
    <symbol id="wordIcon" viewBox="0 0 24 24">
      <g stroke="#4A3628" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><path d="M12 6.5 C9.5 4.8 6 4.5 2.5 5.2 V19 C6 18.3 9.5 18.6 12 20.3Z" fill="#DDE8C9"/><path d="M12 6.5 C14.5 4.8 18 4.5 21.5 5.2 V19 C18 18.3 14.5 18.6 12 20.3Z" fill="#CFE0EE"/><path d="M5.5 9.2 h3.6 M5.5 12.4 h3.6 M14.9 9.2 h3.6 M14.9 12.4 h3.6" fill="none"/></g>
    </symbol>
    <symbol id="reviewIcon" viewBox="0 0 24 24">
      <g stroke="#4A3628" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><path d="M4.3 15 V12 a7.7 7.7 0 0 1 15.4 0 V15" fill="none"/><rect x="2.8" y="13" width="5" height="7.5" rx="2" fill="#F6B89A"/><rect x="16.2" y="13" width="5" height="7.5" rx="2" fill="#F6B89A"/></g>
    </symbol>
    <symbol id="meIcon" viewBox="0 0 24 24">
      <g stroke="#4A3628" stroke-width="1.5" stroke-linejoin="round"><path d="M6.5 2.5 h4 l2.2 6 h-4z" fill="#C96F86"/><path d="M17.5 2.5 h-4 l-2.2 6 h4z" fill="#9CC0DE"/><circle cx="12" cy="15" r="6.3" fill="#F2CF73"/><path d="M12 11.6 l1.1 2.2 2.4.3 -1.75 1.65 .45 2.4 -2.2-1.2 -2.2 1.2 .45-2.4 -1.75-1.65 2.4-.3z" fill="#FBF4E6" stroke-width="1.1"/></g>
    </symbol>
    <symbol id="mapIcon" viewBox="0 0 24 24">
      <g stroke="#4A3628" stroke-width="1.6" stroke-linejoin="round"><path d="M2.5 6 L8 4 L16 6 L21.5 4 V18 L16 20 L8 18 L2.5 20Z" fill="#DDE8C9"/><path d="M8 4 V18 M16 6 V20" fill="none"/></g>
      <path d="M12 8.5 a2.6 2.6 0 0 1 2.6 2.6 c0 2 -2.6 4.4 -2.6 4.4 s-2.6 -2.4 -2.6 -4.4 a2.6 2.6 0 0 1 2.6 -2.6z" fill="#C96F86" stroke="#4A3628" stroke-width="1.3"/>
    </symbol>
    <symbol id="noteIcon" viewBox="0 0 24 24">
      <g stroke="#4A3628" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><rect x="4" y="3" width="14" height="18" rx="2" fill="#F2CF73"/><path d="M8 8h6M8 12h6" fill="none"/><path d="M14 18 L20.5 11.5 L22.5 13.5 L16 20 L13.5 20.5Z" fill="#F6B89A"/></g>
      <g fill="#FBF4E6" stroke="#4A3628" stroke-width="1.2"><circle cx="4" cy="7" r="1.3"/><circle cx="4" cy="12" r="1.3"/><circle cx="4" cy="17" r="1.3"/></g>
    </symbol>
  </defs>
</svg>

<div class="app" id="app">
  <audio id="cameraShutter" src="audio/camera-shutter.mp3" preload="auto" hidden></audio>
  <audio id="correctChime" src="audio/note-correct.mp3" preload="auto" hidden></audio>
  <audio id="retryBuzz" src="audio/note-retry.mp3" preload="auto" hidden></audio>
  <audio id="wordPlace" src="audio/word-place.wav" preload="auto" hidden></audio>
  <audio id="evidenceVoice" preload="auto" hidden></audio>
  <div class="main">
    <button class="pill top-back" type="button" id="backTab" aria-label="뒤로">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5 L8 12 L14.5 18.5" fill="none" stroke="#4A3628" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <!-- PART 1: interrogation stage -->
    <section class="scene" aria-label="대화 장면">
      <span class="chip l" id="orderChip" hidden></span>
      <div class="bubble" id="bubble" hidden role="status"></div>
      <div class="stage-area" id="talkCamera"></div>
      <div class="ask-panel" id="askPanel"></div>
      <div class="spotlight" aria-hidden="true"></div>
      <div class="bubble say" id="sayBubble" hidden role="status" aria-live="polite"></div>
      <div class="interrogation-gauge" id="interrogationGauge" role="progressbar" aria-label="심문 진행" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" hidden><img class="gauge-label" src="assets/ui/icons-v2/magnifier.png" alt="" draggable="false"><span class="gauge-track" aria-hidden="true"><span class="gauge-fill"></span></span></div>
      <section class="drawer" id="drawer" aria-label="증거 서랍">
        <div class="drawer-head"><h3>증거</h3><button class="x" type="button" data-drawer-close aria-label="증거 서랍 닫기">×</button></div>
        <div class="drawer-strip" id="drawerStrip"></div>
        <div class="drawer-pick" id="drawerPick"></div>
      </section>
    </section>

    <!-- PART 2: investigation — a large illustration per place; tap suspicious things to find clues -->
    <section class="inv" aria-label="현장 조사">
      <div class="inv-head">
        <h2 id="sceneTitle"></h2>
      </div>
      <div class="art-stage">
        <div class="art-wrap" id="artWrap"><div class="art" id="art"></div></div>
        <div class="accuse-foot" id="accuseFoot" hidden><button class="pill big" type="button" data-accuse>범인 지목하기</button></div>
        <div class="swipe-hint" id="swipeHint" hidden>← 옆으로 밀어서 둘러보기 →</div>
      </div>
    </section>

    <!-- Note: a notebook pulled up from the bottom — automatically while writing down an answer, or from the Note tab -->
    <div class="note-scrim" id="noteScrim" aria-hidden="true"></div>
    <section class="dock" aria-label="노트">
      <div class="who" id="who" aria-label="노트 페이지"></div>
      <div class="dock-head">
        <h2 id="evidenceTitle" hidden>증거 기록</h2>
        <h2 id="personTitle" hidden></h2>
        <button class="ev-back" id="evidenceBack" type="button" hidden>‹ 증거 기록</button>
        <div class="listen" id="listen" hidden>
          <button class="pill" id="replay" type="button">다시 듣기</button>
          <button class="pill" id="slow" type="button" aria-pressed="false">천천히</button>
          <button class="pill hint" type="button" id="hint" aria-label="힌트 3번 남음" disabled>힌트</button>
        </div>
        <button class="pill finish" type="button" id="finish" hidden>기록 완료</button>
      </div>
      <div class="dock-body" id="dockBody"></div>
    </section>

    <!-- the village map: fills the screen above the bottom menu (it lives in .main, so the menu stays). Only places someone has mentioned get a pin. -->
    <section class="sheet full" id="sheet-map" aria-label="마을 지도">
      <div class="map-stage">
        <div class="map" id="map">
          <img class="map-art" src="assets/places/village-map-higgsfield.png" alt="">
          <p class="map-empty" id="mapEmpty">아직 알게 된 장소가 없어요.</p>
        </div>
      </div>
      <div class="map-head">
        <button class="x" type="button" data-close aria-label="지도 닫기"></button>
      </div>
      <div class="map-foot">
        <button class="pill big" id="accuseBtn" type="button" hidden>범인 지목하기</button>
      </div>
    </section>

  </div>


  <nav class="nav" aria-label="메뉴">
    <button class="tab map-btn" type="button" id="mapTab" aria-expanded="false" aria-controls="sheet-map" aria-label="사건 지도 열기">
      <svg aria-hidden="true"><use href="#mapIcon"/></svg>지도
    </button>
    <button class="tab" type="button" id="noteTab" aria-expanded="false" aria-label="노트">
      <svg aria-hidden="true"><use href="#noteIcon"/></svg>Note
    </button>
  </nav>

  <!-- How-to-play tutorial: one step at a time with a picture guide. Shown once per device (localStorage). -->
  <div class="modal" id="intro" hidden>
    <div class="mcard tut" role="dialog" aria-labelledby="tutTitle">
      <div class="tut-top">
        <span class="eyebrow">플레이 방법</span>
        <span class="tut-count" id="tutCount">1 / 3</span>
        <button class="tut-skip" type="button" id="tutSkip">건너뛰기</button>
      </div>
      <div class="tut-fig" id="tutFig"></div>
      <h2 id="tutTitle"></h2>
      <p id="tutText"></p>
      <div class="tut-dots" id="tutDots" aria-hidden="true"></div>
      <div class="tut-nav">
        <button class="pill" type="button" id="tutPrev">이전</button>
        <button class="pill big" type="button" id="tutNext">다음</button>
      </div>
    </div>
  </div>

  <!-- Home: the first screen. Four pages outside a case — case select (cases open in order; a locked card
       shows no title), word book, review, my record — switched by their own bottom menu. -->
  <section class="cases" id="caseList" aria-label="사건 목록">
    <div class="home-page" id="home-cases">
      <header class="cases-head"><h1>사건 목록</h1><span class="streak" id="caseStreak" hidden></span></header>
      <div class="board" id="caseCards"></div>
    </div>
    <div class="home-page" id="home-words" hidden></div>
    <div class="home-page" id="home-review" hidden></div>
    <div class="home-page" id="home-me" hidden></div>
    <nav class="nav" aria-label="앱 메뉴">
      <button class="tab" type="button" data-home="cases" aria-current="page"><svg aria-hidden="true"><use href="#caseIcon"/></svg>사건</button>
      <button class="tab" type="button" data-home="words"><svg aria-hidden="true"><use href="#wordIcon"/></svg>단어장</button>
      <button class="tab" type="button" data-home="review"><svg aria-hidden="true"><use href="#reviewIcon"/></svg>복습</button>
      <button class="tab" type="button" data-home="me"><svg aria-hidden="true"><use href="#meIcon"/></svg>내 기록</button>
    </nav>
  </section>

  <div class="modal" id="accuse" hidden>
    <div class="mcard">
      <span class="eyebrow">Who did it?</span>
      <h2>범인은 누구일까요?</h2>
      <div class="pick" id="pick"></div>
      <button class="pill" type="button" data-dismiss>조금 더 조사할래요</button>
    </div>
  </div>

  <div class="modal" id="accused" hidden>
    <div class="mcard accused" role="alertdialog" aria-labelledby="accusedText">
      <span class="mini" id="accusedFace"></span>
      <p class="accused-text" id="accusedText"></p>
      <button class="pill big" type="button" data-accused-go>심문 시작</button>
      <button class="pill sm" type="button" data-accused-back>다시 고를래요</button>
    </div>
  </div>

  <!-- leaving the case for the case list from a place asks once (user decision); the case is saved either way -->
  <div class="modal" id="leaveCase" hidden>
    <div class="mcard accused" role="alertdialog" aria-labelledby="leaveCaseText">
      <p class="accused-text" id="leaveCaseText">사건 목록으로 나갈까요?</p>
      <p class="leave-sub">지금까지 조사한 내용은 저장돼요.</p>
      <button class="pill big" type="button" data-leave-go>사건 목록으로</button>
      <button class="pill sm" type="button" data-leave-stay>계속 조사하기</button>
    </div>
  </div>

  <div class="modal" id="review" hidden>
    <div class="mcard review" id="reviewCard"></div>
  </div>

  <div class="modal" id="grammar" hidden>
    <div class="mcard gcard" id="grammarCard" role="dialog" aria-labelledby="grammarTitle"></div>
  </div>

  <div class="toast" id="toast" hidden></div>
</div>

<!-- test tools, outside the phone frame -->
<div class="devtools" aria-label="테스트 도구">
  <button class="devbtn" type="button" id="devFill">노트 자동 채우기</button>
  <button class="devbtn" type="button" id="devDone">전체 대화 완료</button>
  <button class="devbtn" type="button" id="devEvidence">증거 모두 수집</button>
  <button class="devbtn" type="button" id="devInterro">심문 완료</button>
  <button class="devbtn" type="button" id="devTut">튜토리얼 초기화</button>
  <button class="devbtn" type="button" id="devReset">리셋</button>
</div>

<script>
(() => {
const QUESTIONS = [
  { id:'q1', en:'Where were you tonight, between 8 and 10 PM?', ko:'오늘 밤 8시~10시에 어디 있었나요?' },
  { id:'q2', en:'Can anyone prove that?', ko:'그걸 증명해 줄 사람이 있나요?' },
  { id:'q3', en:'How did you know Professor Hoot?', ko:'후트 교수와는 어떤 사이였나요?' },
];

/* People. Nobody is rounded up in advance: each person stays at their `place`, and appears
   (at their place and on the map) only after someone names them or a clue points to them.
   `unlocks` = what hearing an answer reveals: { places:[…], people:[…] } (a person brings their place along).
   Each answer has its own note lines and word cards. {{id|answer/alt}} marks a blank. */
const PEOPLE = {
  // the partner — met first, at the crime scene
  badger: { id:'badger', name:'Sgt. Badger', ko:'오소리 경사', job:'동료 경찰', place:'library', partner:true,
    pitch:.9, voice:3, bg:'#DCE3F0', openingQuestion:'b1',
    hello:"Detective! I'm so glad you're here. Let me tell you what happened.",
    // recorded voice (Higgsfield · MiniMax · Fraser)
    audio:{ hello:'audio/badger-hello.mp3', b1:'audio/badger-b1.mp3', b2:'audio/badger-b2.mp3', b3:'audio/badger-b3.mp3',
      closing:'audio/badger-closing.mp3' },
    questions:[
      { id:'b1', en:'What happened here?', ko:'여기서 무슨 일이 있었나요?' },
      { id:'b2', en:'Who found the victim?', ko:'피해자를 누가 발견했나요?' },
      { id:'b3', en:'What should I do next?', ko:'이제 무엇을 하면 되나요?' }
    ],
    unlocks:{ b1:{ places:['library'] }, b2:{ people:['mole'] }, b3:{ places:['library'] } },
    answers:{
      b1:"This is the Old Library. Professor Hoot was found here at nine o'clock tonight. He was lying on the floor.",
      b2:"Mrs. Mole, the librarian, found him. We think it happened between eight and nine. She is still inside, so please talk to her.",
      b3:"Look around the library carefully. When you know who did it, come and tell me."
    },
    notes:{
      b1:["Victim: Professor {{a|Hoot}}.","Place: the Old {{b|Library}}.","He was found at {{c|9 PM/9/nine}}."],
      b2:["{{d|Mrs. Mole/mrs mole}} found him. She is the {{e|librarian}}.","It happened between {{f|8 PM/8/eight}} and {{g|9 PM/9/nine}}."],
      b3:["Look around the {{h|library}} carefully.","When I know who did it, I tell {{i|Sgt. Badger/sgt badger/badger}}."]
    },
    bank:{
      b1:['Hoot','Mole','Library','Bakery','8 PM','9 PM','10 PM'],
      b2:['Mrs. Mole','Mrs. Bear','librarian','baker','7 PM','8 PM','9 PM'],
      b3:['library','bakery','Sgt. Badger','Mrs. Mole']
    }
  },
  // the witness who found the victim — her answers name the people to look for
  mole: { id:'mole', name:'Mrs. Mole', ko:'두더지 부인', job:'사서', place:'library', pitch:1.05, voice:4, bg:'#E8DCCB',
    hello:"Oh, detective. I'm Mrs. Mole, the librarian. What a terrible night.",
    audio:{ hello:'audio/mole-hello.mp3', m1:'audio/mole-m1.mp3', m2:'audio/mole-m2.mp3', m3:'audio/mole-m3.mp3' },
    questions:[
      { id:'m1', en:'What did you see tonight?', ko:'오늘 밤 무엇을 봤나요?' },
      { id:'m2', en:'Did anyone visit the library tonight?', ko:'오늘 밤 도서관에 온 사람이 있나요?' },
      { id:'m3', en:'Did the professor have any problems?', ko:'교수님에게 무슨 문제가 있었나요?' }
    ],
    unlocks:{ m2:{ people:['ray','rosie'] }, m3:{ people:['fiona'] } },
    answers:{
      m1:"I came back at nine to lock the door. The professor was on the floor, and the big clock was not ticking.",
