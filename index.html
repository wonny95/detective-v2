let cameraMotion;
function animateCamera(art, from, to){
  cameraMotion?.cancel();
  art.style.transform = to;
  if(from && !matchMedia('(prefers-reduced-motion: reduce)').matches){
    cameraMotion = art.animate([{transform:from}, {transform:to}], {duration:650, easing:'cubic-bezier(.22,.7,.25,1)'});
    cameraMotion.onfinish = () => { if(!S.investigate) focusCamera(); };
  }
}
// fromRect: the NPC's on-screen rect when coming from the place view. glide: move from the
// current framing (the note opened or closed).
function focusCamera(fromRect, glide = false){
  if(S.investigate) return;
  const subject = S.cur;
  const viewport = $('#talkCamera'), art = $('#art'), place = placeOf(placeIdOf(subject));
  const width = viewport.clientWidth, height = viewport.clientHeight;
  if(!width || !height) return;
  const position = positionOf(subject);
  const worldWidth = place.artWidth || 900, worldHeight = place.artHeight || 600;
  // Note closed: a 44%-tall NPC fills 58% of the scene with the feet just above the question
  // buttons. Note open: it shrinks to 46% with the head just under the top chips, so the face
  // stays above the note (top ~40%). The NPC never moves in the world; only the camera does.
  // Below the picture's bottom edge, the outpainted floor (ART_FLOOR) fills the scene.
  const notes = $('#app').classList.contains('notes-open');
  // The interview room leaves more room above the speaker for dialogue, showing the face below the bubble.
  const interview = place.id === INTERVIEW_ROOM.id;
  const share = notes ? .46 : interview ? .52 : .58, headTop = notes ? .07 : interview ? .35 : .16;
  const fullHeight = worldHeight + (ART_FLOOR[place.id]?.h || 0);
  const minScale = Math.max(width / worldWidth, height / fullHeight);
  const scale = Math.max(minScale, height * share / (worldHeight * Math.max(44, position.height) / 100));
  // in the ending too the camera is on whoever speaks (Fiona while questioned, the partner for his closing line)
  const centerX = position.x;
  let top = height * headTop - worldHeight * (position.floor - position.height) / 100 * scale;
  const left = Math.min(0, Math.max(width - worldWidth * scale, width / 2 - worldWidth * centerX / 100 * scale));
  top = Math.min(0, Math.max(height - fullHeight * scale, top));
  const bounds = viewport.getBoundingClientRect();
  const from = fromRect?.width ? `translate(${fromRect.left - bounds.left}px, ${fromRect.top - bounds.top}px) scale(${fromRect.width / worldWidth})`
    : glide ? getComputedStyle(art).transform : null;
  animateCamera(art, from, `translate(${left}px, ${top}px) scale(${scale})`);
}

function bindDock(){
  const body = $('#dockBody');
  const faces = body.querySelector('.nfaces');
  if(faces){
    let drag = null, moved = false;
    faces.addEventListener('pointerdown', e => {
      if(e.pointerType !== 'mouse' || e.button !== 0) return;
      drag = { id:e.pointerId, x:e.clientX, left:faces.scrollLeft };
      moved = false;
      faces.setPointerCapture(e.pointerId);
    });
    faces.addEventListener('pointermove', e => {
      if(!drag || e.pointerId !== drag.id) return;
      const dx = e.clientX - drag.x;
      if(!moved && Math.abs(dx) > 5){ moved = true; faces.classList.add('dragging'); }
      if(moved){ faces.scrollLeft = drag.left - dx; e.preventDefault(); }
    });
    const endDrag = e => {
      if(!drag || e.pointerId !== drag.id) return;
      drag = null; faces.classList.remove('dragging');
      if(faces.hasPointerCapture(e.pointerId)) faces.releasePointerCapture(e.pointerId);
    };
    faces.addEventListener('pointerup', endDrag);
    faces.addEventListener('pointercancel', e => { endDrag(e); moved = false; });
    faces.addEventListener('click', e => { if(moved){ e.preventDefault(); e.stopPropagation(); moved = false; } }, true);
  }
  body.querySelectorAll('[data-ev-open]').forEach(button => button.addEventListener('click', () => {
    evidenceOpen = button.dataset.evOpen; renderDock(); playEvidence(evidenceOpen);
  }));
  body.querySelectorAll('[data-ev-play]').forEach(button => button.addEventListener('click', () => playEvidence(button.dataset.evPlay)));
  body.querySelectorAll('[data-evidence-ko]').forEach(button => button.addEventListener('click', () => {
    const translation = button.closest('[data-evidence]').querySelector('.ko');
    translation.hidden = !translation.hidden;
    button.setAttribute('aria-pressed', !translation.hidden);
  }));
  body.querySelectorAll('[data-replay]').forEach(button => button.addEventListener('click', () => replayLine(button.dataset.replay)));
  body.querySelectorAll('[data-grammar]').forEach(button => button.addEventListener('click', () => openGrammar(button.dataset.grammar)));
  body.querySelectorAll('[data-passage]').forEach(button => button.addEventListener('click', () => {
    const block = button.closest('.nblock'), text = block.querySelector('.npassage');
    block.classList.remove('fresh');   // the just-checked unfold is played once; showing the passage again is instant
    text.hidden = !text.hidden;
    openPassages[text.hidden ? 'delete' : 'add'](button.dataset.passage);
    button.setAttribute('aria-pressed', !text.hidden);
    button.textContent = text.hidden ? '지문 보기' : '지문 접기';
  }));
  body.querySelectorAll('[data-passage-ko]').forEach(button => button.addEventListener('click', () => {
    const ko = button.closest('.npassage').querySelector('.np-ko');
    ko.hidden = !ko.hidden;
    openPassageKo[ko.hidden ? 'delete' : 'add'](button.dataset.passageKo);
    button.setAttribute('aria-pressed', !ko.hidden);
  }));
  body.querySelectorAll('[data-present]').forEach(button => button.addEventListener('click', () => present(button.dataset.present)));
  body.querySelectorAll('[data-face]').forEach(button => button.addEventListener('click', () => { S.view = button.dataset.face; renderDock(); }));
  body.querySelectorAll('[data-pin]').forEach(button => button.addEventListener('click', e => {
    e.stopPropagation(); togglePin(button.dataset.pin);
    const on = S.memo.pins.includes(button.dataset.pin);
    button.classList.toggle('on', on); button.setAttribute('aria-pressed', on); renderWho();
  }));
  body.querySelectorAll('[data-unpin]').forEach(button => button.addEventListener('click', () => { togglePin(button.dataset.unpin); renderDock(); }));
  body.querySelector('#memoText')?.addEventListener('input', e => { S.memo.text = e.target.value; });
  body.querySelectorAll('[data-pin-note]').forEach(area => {
    // grows with what is written (field-sizing does it where supported)
    const fit = () => { area.style.height = 'auto'; area.style.height = area.scrollHeight + 'px'; };
    if(!CSS.supports('field-sizing', 'content')) requestAnimationFrame(fit);
    area.addEventListener('input', () => {
      if(area.value.trim()) S.memo.notes[area.dataset.pinNote] = area.value; else delete S.memo.notes[area.dataset.pinNote];
      if(!CSS.supports('field-sizing', 'content')) fit();
    });
    area.addEventListener('change', saveGame);
  });
  const bank = body.querySelector('#bank');
  if(bank){
    bank.addEventListener('click', e => {
      const word = e.target.closest('.word');
      if(word && (!suppressWordClick || e.detail === 0)) fillNextBlank(word.dataset.w, word);
      suppressWordClick = false;
    });
    bank.addEventListener('pointerdown', dragStart);
    bank.addEventListener('pointermove', dragMove);
    bank.addEventListener('pointerup', dragEnd);
    bank.addEventListener('pointercancel', dragEnd);
  }
}

// Start or resume a conversation. The first meeting plays the greeting.
let greetingTimer;

  if(recordLocked()) setNotes(true);   // an unfinished recording opens again where it was left

    if(cur().partner) stageCard(CASES[0].title, CASES[0].no);
    greetingTimer = setTimeout(() => {

    }, cur().partner ? 1200 : 600);

// Tapping the scene around the person (not the person, not a button) also goes back to the whole place,

$('#talkCamera').addEventListener('click', e => {

  const r = $(`#talkCamera .scene-npc[data-talk="${S.cur}"]`)?.getBoundingClientRect();
  if(r && e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom) return;

function ask(qid){
  if(S.investigate || st().phase !== 'choose' || !availableQuestions(cur()).some(question => question.id === qid)) return;
  clearTimeout(greetingTimer);
  const p = st();
  p.feedback = null;
  p.phase = 'record'; p.recording = qid;
  if(!p.order.includes(qid)) p.order.push(qid);
  hideBubble();
  // Open the current question immediately, so the player can write while listening.
  S.view = S.cur;
  noteRaised = false;
  renderDock();
  setNotes(true);
  speak(cur().answers[qid], qid, S.cur);
}
// 힌트: the first blank of this question that is empty or wrong gets the right word (an acorn each, 3 per case).
function useHint(){
  const p = st(), qid = p.recording;
  if(S.investigate || p.phase !== 'record' || !qid || S.view !== S.cur) return;
  if(S.hints <= 0) return toast('힌트를 다 썼어요.');
  const blank = blanksOf(S.cur, [qid]).find(b => !b.value.trim() || !isRight(b));
  if(!blank) return toast('더 채울 칸이 없어요.');
  S.hints--;
  p.notes[blank.id] = blank.ans.split('/')[0];
  p.marks[blank.id] = 'hint';
  renderDock();
}
const norm = s => s.toLowerCase().replace(/[.'’,!]/g,'').replace(/\s+/g,' ').trim().replace(/\s?pm$/,'');
function finishRecord(){
  if(S.investigate || st().phase !== 'record' || S.view !== S.cur) return;
  const p = st();
  const qid = p.recording;
  const blanks = [...document.querySelectorAll(`.nblock[data-q="${qid}"] .blank`)];
  const empty = blanks.filter(b => !b.value.trim());
  if(empty.length){ empty[0].focus(); return toast(`빈칸 ${empty.length}개가 남았어요. 모두 채워야 기록이 끝나요.`); }
  markStudyDay();
  const answers = blanksOf(S.cur, [qid]);
  recordFirst(S.cur, qid);
  const correct = answers.every(isRight);
  p.questionChecks[qid] = correct ? 'ok' : 'review';
  answers.forEach(answer => {
    if(correct) p.marks[answer.id] = 'ok';
    else if(!isRight(answer)) p.marks[answer.id] = 'review';
    else delete p.marks[answer.id];
  });
  hideBubble();
  stopVoice();
  if(!correct){
    const buzz = $('#retryBuzz');   // a low falling "bonk" and a short buzz on phones
    buzz.currentTime = 0; buzz.play().catch(() => {});
    if(navigator.userActivation?.hasBeenActive) try { navigator.vibrate?.(90); } catch(e){}
    missCheck = `${S.cur}:${qid}`;
    renderDock();
    return;
  }
  const chime = $('#correctChime');   // a short two-note chime for a question written down right
  chime.currentTime = 0; chime.play().catch(() => {});
  stampSound(340);
  p.recording = null;
  p.phase = qs(cur()).every(question => p.questionChecks[question.id] === 'ok') ? 'done' : 'choose';
  const revealed = unlock(cur().unlocks?.[qid]) || {};
  pendingPins.push(...(revealed.places || []));
  pendingPeople.push(...(revealed.people || []));
  if(p.phase === 'done') checkNotes(S.cur);
  // the checked question stays open (lines, grammar chips) until the player closes the notebook; what it
  // unlocked shows after that (closeNotes)
  p.feedback = qid;
  openPassages.add(`${S.cur}:${qid}`);
  freshCheck = `${S.cur}:${qid}`;
  noteRaised = true;   // the checked question with its passage takes the whole screen for study
  renderDock();
}
// What the header button does on the page being viewed.
function noteMode(){
  if(S.view === 'evidence' || S.view === 'memo') return null;
  const p = per(S.view);
  if(noteRaised && p.checked && !p.feedback) return 'summary';
  if(S.view === S.cur && !S.investigate && p.feedback) return 'feedback';
  if(S.view === S.cur && !S.investigate && p.phase === 'record') return 'record';
  return null;
}
const BLANK_RE = /\{\{(\w+)\|([^}]+)\}\}/g;
// Every blank on a person's page, in the order the questions were asked.
function blanksOf(id, qids = per(id).order){
  const s = spk(id), p = per(id), out = [];
  qids.forEach(qid => s.notes[qid].forEach(line => line.replace(BLANK_RE, (m, bid, ans) => {
    out.push({ qid, id:bid, ans, value:p.notes[bid] || '' }); return m;
  })));
  return out;
}
const isRight = b => b.ans.split('/').map(norm).includes(norm(b.value));
function recordFirst(id, qid){
  const p = per(id);
  const questions = qid ? [qid] : p.order;
  questions.forEach(question => {
    if(p.firstQuestions[question]) return;
    const answers = blanksOf(id, [question]), wrong = answers.filter(answer => !isRight(answer));
    p.firstQuestions[question] = {ok:answers.length - wrong.length, total:answers.length};
    Object.assign(p.firstWrong, Object.fromEntries(wrong.map(answer => [answer.id, answer.value])));
  });
  p.first = Object.values(p.firstQuestions).reduce((total, result) => ({ok:total.ok + result.ok, total:total.total + result.total}), {ok:0, total:0});
}
function checkNotes(id){
  const p = per(id);
  if(!qs(spk(id)).every(question => p.questionChecks[question.id] === 'ok')) return;
  p.feedback = null;
  p.checked = true;
}
function replayLine(ref){
  const [id, qid] = ref.split(':');
  speak(spk(id).answers[qid], qid, id);
}
// Word-book playback uses a bundled pronunciation, never the sentence that taught the word.
function pronounceWord(key){
  if(!Object.prototype.hasOwnProperty.call(WORDS, key)) return;
  stopVoice();
  const turn = speechTurn;
  const voice = $('#wordVoice'), file = key.replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  voice.src = `audio/words/${file}.wav`;
  voice.preservesPitch = true;
  voice.playbackRate = S.slow ? .75 : 1;
  voice.play().catch(() => { if(turn === speechTurn) toast('발음을 재생하지 못했어요. 다시 눌러 주세요.'); });
}
// A form or an example sentence of 이번 사건의 열쇠: its bundled clip (audio/examples/<grammar>-<page>.wav for the
// form, <grammar>-<page>-<line>.wav for a sentence; the word book's local voice), never a person's recording.
function playExample(file){
  stopVoice();
  const turn = speechTurn, voice = $('#wordVoice');
  voice.src = `audio/examples/${file}.wav`;
  voice.preservesPitch = true;
  voice.playbackRate = S.slow ? .75 : 1;
  voice.play().catch(() => { if(turn === speechTurn) toast('예문을 재생하지 못했어요. 다시 눌러 주세요.'); });
}
// One sentence of an answer: the matching part of the recording (or that sentence by browser TTS).
function replaySentence(ref, idx){
  const [id, qid] = ref.split(':'), range = SENTENCE_TIMES[ref]?.[idx];
  if(!range) return replayLine(ref);
  speak(sentencesOf(spk(id).answers[qid])[idx], qid, id, undefined, range);
}
// Switch between the conversation view and the place view. Either can be left and resumed;
// an unfinished recording waits in the notebook until the player comes back.
function setInvestigate(on){
  clearTimeout(greetingTimer);
  cancelCapture();
  S.investigate = on;
  stopVoice(); hideBubble(); clearSel();
  $('#app').classList.remove('expanded', 'notes-open');
  $('#app').classList.toggle('investigate', on);
  $('#noteTab').setAttribute('aria-expanded', 'false');
  renderDock(); renderPlaces(); renderSceneHead();
}
/* ---------- notebook edits + word-card drag ---------- */
$('#dockBody').addEventListener('input', e => {
  const b = e.target.closest('.blank'); if(!b) return;
  b.size = Math.max(5, b.value.length+1); b.classList.remove('ok','no');

$('#dockBody').addEventListener('pointerdown', e => {

});
function fillBlank(input, word){
  if(input.readOnly) return;
  input.value = word; input.size = Math.max(5, word.length+1); input.classList.remove('ok','no');
  const p = per(input.dataset.s); p.notes[input.dataset.id] = word; delete p.marks[input.dataset.id];
  writeState();
}
// the blanks of the question being written down (none on any other page)
const nowBlanks = () => [...document.querySelectorAll('#dockBody .nblock.now .blank')].filter(input => !input.readOnly);
// while writing down: the next empty blank shows (honey line), the words already on the page fade, 기록 완료 stays pale
// until nothing is empty, and the keyboard's return says 다음 until the last blank, then 완료
function writeState(){
  const blanks = nowBlanks(), empty = blanks.filter(input => !input.value.trim());
  blanks.forEach((input, i) => {
    input.classList.toggle('next', input === empty[0]);
    input.enterKeyHint = i === blanks.length - 1 ? 'done' : 'next';
  });
  const key = v => v.trim().toLowerCase(), on = new Set(blanks.map(input => key(input.value)).filter(Boolean));
  document.querySelectorAll('#bank .word').forEach(word => word.classList.toggle('used', on.has(key(word.dataset.w))));
  $('#finish').classList.toggle('wait', noteMode() === 'record' && empty.length > 0);
  const at = blanks.indexOf(document.activeElement);
  $('[data-type="prev"]').disabled = at <= 0;
  $('[data-type="next"]').disabled = at < 0 || at >= blanks.length - 1;
  $('#noteVkb [data-k="done"]').textContent = at >= 0 && at < blanks.length - 1 ? '다음' : '완료';
}
function fillNextBlank(word, source){
  if(S.view !== S.cur || S.investigate || st().phase !== 'record') return;
  const blank = [...document.querySelectorAll('#dockBody .nblock.now .blank')].find(input => !input.readOnly && !input.value.trim());
  if(blank){
    const from = source?.getBoundingClientRect();
    fillBlank(blank, word);   // commit immediately, so rapid taps always reserve different blanks
    wordPlacementFeedback(blank, source, from);
  }

function wordPlacementFeedback(input, source, from){
  const sound = $('#wordPlace');
  sound.volume = .55; sound.currentTime = 0; sound.play().catch(() => {});
  if(!input.animate) return;
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  input.animate(reduced ? [
    {backgroundColor:'rgba(242,207,115,.5)'}, {backgroundColor:'transparent'}
  ] : [
    {transform:'scale(1)',backgroundColor:'rgba(242,207,115,.2)'},
    {transform:'scale(1.07)',backgroundColor:'rgba(242,207,115,.55)',offset:.45},
    {transform:'scale(1)',backgroundColor:'transparent'}
  ], {duration:reduced ? 180 : 360,easing:'ease-out'});
  if(reduced || !source || !from) return;
  source.getAnimations().forEach(animation => animation.cancel());
  source.animate([{transform:'scale(1)'},{transform:'scale(.92)',offset:.3},{transform:'scale(1)'}],{duration:220,easing:'ease-out'});
  const to = input.getBoundingClientRect(), ghost = document.createElement('span');
  ghost.className = 'word word-flight'; ghost.textContent = source.dataset.w;
  ghost.setAttribute('aria-hidden','true');
  Object.assign(ghost.style,{
    left:from.left+'px',top:from.top+'px',width:from.width+'px',height:from.height+'px',
    backgroundColor:getComputedStyle(source).backgroundColor
  });
  document.body.appendChild(ghost);
  const dx = to.left + to.width/2 - from.left - from.width/2;
  const dy = to.top + to.height/2 - from.top - from.height/2;
  const flight = ghost.animate([
    {transform:'translate(0,0) rotate(0deg) scale(1)',opacity:.95},
    {transform:`translate(${dx*.5}px,${dy*.5-16}px) rotate(-4deg) scale(.85)`,opacity:.9,offset:.5},
    {transform:`translate(${dx}px,${dy}px) rotate(0deg) scale(.55)`,opacity:0}
  ],{duration:260,easing:'cubic-bezier(.2,.7,.3,1)',fill:'forwards'});
  flight.finished.then(() => ghost.remove(), () => ghost.remove());
}

let drag = null, suppressWordClick = false;
function dragStart(e){
  const w = e.target.closest('.word'); if(!w || !e.isPrimary || e.button !== 0) return;
  suppressWordClick = false;
  drag = { w, x:e.clientX, y:e.clientY, ghost:null, hot:null, id:e.pointerId };
  w.setPointerCapture(e.pointerId);
}
function dragMove(e){
  if(!drag || e.pointerId !== drag.id) return;
  if(!drag.ghost){
    if(Math.hypot(e.clientX-drag.x, e.clientY-drag.y) < 6) return;
    drag.ghost = drag.w.cloneNode(true); drag.ghost.classList.add('ghost'); drag.ghost.classList.remove('sel');
    $('#app').appendChild(drag.ghost);
  }
  drag.ghost.style.left = e.clientX+'px'; drag.ghost.style.top = e.clientY+'px';
  const under = document.elementFromPoint(e.clientX, e.clientY);
  const target = under?.closest?.('.blank');
  const hot = target && !target.readOnly ? target : null;
  if(drag.hot && drag.hot !== hot) drag.hot.classList.remove('hot');
  if(hot) hot.classList.add('hot');
  drag.hot = hot;
}
function dragEnd(e){
  if(!drag || e.pointerId !== drag.id) return;
  const word = drag.w.dataset.w;
  if(drag.ghost){
    suppressWordClick = true;
    drag.ghost.remove();
    if(drag.hot){
      drag.hot.classList.remove('hot');
      if(e.type === 'pointerup'){ fillBlank(drag.hot, word); wordPlacementFeedback(drag.hot); }
    }
    clearSel();
  }
  drag = null;
}

/* ---------- the caret ---------- */
// The pencil caret (.cute-caret) follows the caret of the focused 이름 or note blank: the text before it is measured in
// the field's own font, inside the field's box (centred text in the blanks, scrolled text when it overflows). It is
// placed every frame while the field has the focus, so it rides along with the notebook and the keyboard moving.
const cuteCaret = Object.assign(document.createElement('span'), { className:'cute-caret', hidden:true });
document.body.appendChild(cuteCaret);
const caretPen = document.createElement('canvas').getContext('2d');
let caretField = null, caretWas = '';
const caretTarget = el => el?.matches?.('input.blank, input.id-name') ? el : null;
document.addEventListener('focusin', e => {
  const el = caretTarget(e.target); if(!el) return;
  const idle = !caretField; caretField = el; caretWas = '';
  if(idle) requestAnimationFrame(placeCaret);
});
document.addEventListener('focusout', e => { if(e.target === caretField){ caretField = null; cuteCaret.hidden = true; } });
function placeCaret(){
  const el = caretField;
  if(!el || document.activeElement !== el){ caretField = null; cuteCaret.hidden = true; return; }
  requestAnimationFrame(placeCaret);
  const r = el.getBoundingClientRect(), k = r.width / el.offsetWidth || 1, cs = getComputedStyle(el);
  const at = el.selectionEnd ?? el.value.length;
  // a selection shows as itself; a read-only field (the stamped name) has no caret
  if(el.readOnly || el.selectionStart !== at || !r.width){ cuteCaret.hidden = true; return; }
  caretPen.font = `${cs.fontStyle} ${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
  caretPen.letterSpacing = cs.letterSpacing === 'normal' ? '0px' : cs.letterSpacing;
  const width = text => caretPen.measureText(text).width;
  const pl = parseFloat(cs.paddingLeft), pr = parseFloat(cs.paddingRight), pt = parseFloat(cs.paddingTop), pb = parseFloat(cs.paddingBottom);
  const room = el.clientWidth - pl - pr, all = width(el.value);
  const lead = cs.textAlign === 'center' && all < room ? (room - all) / 2 : cs.textAlign === 'right' || cs.textAlign === 'end' ? Math.max(0, room - all) : 0;
  const x = Math.min(Math.max(pl + lead + width(el.value.slice(0, at)) - el.scrollLeft, 1), el.clientWidth - 1);
  const size = parseFloat(cs.fontSize) * 1.1, mid = el.clientTop + pt + (el.clientHeight - pt - pb) / 2;
  const X = r.left + (el.clientLeft + x) * k, Y = r.top + mid * k;
  // hidden when the spot is covered or scrolled out of its notebook
  if(document.elementFromPoint(X, Y) !== el){ cuteCaret.hidden = true; return; }
  cuteCaret.hidden = false;
  cuteCaret.style.height = `${size * k}px`;
  cuteCaret.style.transform = `translate(${X + .5}px, ${Y - size * k / 2}px)`;   // just after the letter, not on it
  cuteCaret.style.setProperty('--caret', cs.color);
  // typing keeps it solid: the blink starts over whenever the text or the caret moves
  const now = `${el.value}|${at}`;
  if(now !== caretWas){ caretWas = now; cuteCaret.style.animation = 'none'; void cuteCaret.offsetWidth; cuteCaret.style.animation = ''; }
}

// Hearing a line or finding a clue can reveal places and people ({ places:[…], people:[…] }).
// A newly known person brings their place onto the map.
function unlock(u){
  if(!u) return;
  let newPerson = false;
  const places = [], people = [];
  (u.places || []).forEach(id => { if(!S.known.has(id)){ S.known.add(id); places.push(id); } });
  (u.people || []).forEach(id => {
    if(S.met.includes(id)) return;
    S.met.push(id); people.push(id); newPerson = true;
    if(!S.known.has(spk(id).place)){ S.known.add(spk(id).place); places.push(spk(id).place); }
  });
  const newPlace = places.length > 0;
  if(!newPlace && !newPerson) return {};
  renderPlaces();
  if(newPlace) setMapNew(true);
  return { newPlace, newPerson, places, people };
}

// The evidence drawer: every photo in a strip under her; one picked plays its sentence and can be held up (내밀기).

let drawerPick = null, drawerTab = 'photo', drawerSizeAnimation = null, drawerTextAnimation = null;

const statements = () => PEOPLE_ORDER.flatMap(id => S.per[id] && id !== accusedId && !spk(id).partner ? qs(spk(id)).map(q => `${id}:${q.id}`).filter(sayOk) : []);

function stopDrawerAnimations(){

function pickEvidence(ref){
  const drawer = $('#drawer'), detail = $('#drawerPick');
  const fromHeight = drawer.getBoundingClientRect().height;

  if(isSayRef(ref)){

    const [id, qid] = ref.split(':');
    detail.innerHTML = `<p><b class="who-says">${esc(spk(id).name)}:</b> “${esc(spk(id).answers[qid])}”</p>${drawerTools(ref, ANSWERS_KO[id]?.[qid])}`;
  } else {

  if(drawer.animate && !matchMedia('(prefers-reduced-motion: reduce)').matches){

      {duration:320,easing:'cubic-bezier(.2,.8,.3,1)'});

function drawerTools(ref, ko, mute){

// A mouse can drag the strip sideways and its wheel scrolls it sideways (a finger already swipes it natively);
// a drag that moved never counts as picking the card it started on.
(strip => {
  let start = null, dragged = false;
  strip.addEventListener('pointerdown', e => {
    if(e.pointerType !== 'mouse' || e.button !== 0) return;
    start = { x:e.clientX, left:strip.scrollLeft }; dragged = false;
  });
  addEventListener('pointermove', e => {
    if(!start) return;
    const dx = e.clientX - start.x;
    if(!dragged && Math.abs(dx) > 5){ dragged = true; strip.classList.add('dragging'); }
    if(dragged) strip.scrollLeft = start.left - dx;
  });
  addEventListener('pointerup', () => { if(start){ start = null; strip.classList.remove('dragging'); } });
  strip.addEventListener('click', e => { if(dragged){ e.stopPropagation(); dragged = false; } }, true);
  strip.addEventListener('wheel', e => {
    if(Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
    strip.scrollLeft += e.deltaY; e.preventDefault();
  }, { passive:false });
})($('#drawerStrip'));
$('#drawer').addEventListener('click', e => {
  if(e.target.closest('[data-drawer-close]')) return closeDrawer();
  const tab = e.target.closest('[data-drawer-tab]');
  if(tab){ if(tab.dataset.drawerTab !== drawerTab){ stopVoice(); $('#evidenceVoice').pause(); openDrawer(tab.dataset.drawerTab); } return; }
  const again = e.target.closest('[data-pick-play]');
  if(again) return playPick(again.dataset.pickPlay);
  const ko = e.target.closest('[data-drawer-ko]');
  if(ko){ const text = $('#drawerPick .ko'); text.hidden = !text.hidden; ko.setAttribute('aria-pressed', !text.hidden); return; }
  const card = e.target.closest('[data-pick]');
  if(card) return pickEvidence(card.dataset.pick);
  const give = e.target.closest('[data-present]');
  if(give){ closeDrawer(); present(give.dataset.present); }
});

function endingControls(){

// show someone (camera on them at their place) and play the line
function endingSay(line, mood, onDone){

    ending.shown = line.who;

// The same room, arrival and light for every suspect. Positions stay fixed while the camera follows the speaker.
let interviewTimer;
function enterInterview(id, step){

  ending = { step, returnPlace:spk(id).place };
  S.mood = {};
  S.visit = {

    [id]:{ place:INTERVIEW_ROOM.id, x:64, floor:82, height:44 }
  };

function leaveInterview(){

// After the board, Sgt. Badger asks whether the detective has worked it out. The deduction already named Fiona, so
// the detective answers aloud without another choice, and Badger takes her to the station.
const CALL = {
  ask:{ who:'badger', key:'call1', en:'Detective! Did you find out who did it?', ko:'탐정님! 범인을 알아내셨나요?' },
  answer:id => ({ key:`call-${id}`, en:`Yes. It was ${spk(id).name}.`, ko:`응. ${spk(id).ko}야.` }),
  go:id => ({ who:'badger', key:`call2-${id}`, en:`${spk(id).name}? Then let's bring ${id === 'ray' ? 'him' : 'her'} to the station.`, ko:`${spk(id).ko}요? 그럼 파출소로 데려가요.` })
};
function startCall(){
  ending = { step:'call', i:0, returnPlace:S.place || cur().place };
  $('#app').classList.add('ending');
  endingSay(CALL.ask, undefined, () => {
    endTimer = setTimeout(() => { if(ending?.step === 'call' && !ending.answering) callAnswer(); }, 500);
  });
}
function callAnswer(){
  if(ending?.step !== 'call' || ending.answering) return;
  clearTimeout(endTimer);
  ending.answering = true; ending.line = null; ending.lineDone = null; renderAsk();
  const id = CULPRIT;
  const name = detectiveName(), line = CALL.answer(id);
  renderSay({ ...line, name:name ? `Detective ${name}` : 'Detective', det:true });
  const go = () => { if(ending?.step === 'call'){ ending.i = 1; ending.ready = performance.now() + 600; endingSay(CALL.go(id)); } };
  detectiveSay(line.key, () => { endTimer = setTimeout(go, 500); });
}
function callGo(){
  if(ending?.step !== 'call' || !ending.i || performance.now() < ending.ready) return;
  accusedId = CULPRIT;

}
function startEnding(){

function present(ref){
  if(ending?.step !== 'confront') return;
  clearTimeout(endTimer); stopVoice();
  setNotes(false); renderDock();
  renderSay(null);
  const round = ENDING.confront[endingRound], right = round.accept.includes(ref);
  const shot = document.createElement('div');
  shot.className = `presented ${right ? 'hit' : 'miss'}`;
  let figure;
  if(isSayRef(ref)){
    const [id, qid] = ref.split(':');
    figure = `<figure class="say"><span class="who">${sayFace(id)}${esc(spk(id).name)}</span><p>${esc(writtenLines(id, qid).join(' '))}</p></figure>`;
  } else figure = `<figure>${S.evidence.find(r => `${r.placeId}-${r.clueIndex}` === ref).photo}</figure>`;
  shot.innerHTML = figure + (right ? '<span class="contra">모순!</span>' : '');
  $('.scene').appendChild(shot);
  $('#backTab').disabled = true;   // wait for the photo response before offering to leave
  // the moment it lands: a hit stamps 모순!, jolts the room, makes her flinch and fills the gauge; a miss just bounces off
  const at = endingRound;
  setTimeout(() => {
    if(ending?.step !== 'confront') return;
    const sound = $(right ? '#correctChime' : '#retryBuzz'); sound.currentTime = 0; sound.play().catch(() => {});
    if(!right) return;
    stampSound();
    const scene = $('.scene'), npc = $('#talkCamera .scene-npc[data-talk="fiona"]');
    scene.classList.remove('jolt'); npc?.classList.remove('flinch'); void scene.offsetWidth;
    scene.classList.add('jolt'); npc?.classList.add('flinch');
    updateInterrogationGauge(at + 1, 'hit');
  }, 480);
  setTimeout(() => { shot.remove(); $('.scene').classList.remove('jolt'); }, 1300);
  endTimer = setTimeout(() => {
    if(ending?.step !== 'confront') return;
    if(!right){
      // a wrong photo: keep the completed claims and let the player retry this one
      const retryRound = endingRound;
      ending.line = null; renderAsk();
      renderSay({ who:'fiona', en:ENDING.miss.en, ko:ENDING.miss.ko });
      speak(ENDING.miss.en, ENDING.miss.key, 'fiona', () => {
        endTimer = setTimeout(() => ending?.step === 'confront' && endingSay(fionaLine(ENDING.confront[retryRound]), confrontMood(retryRound)), 700);
      });
      return;
    }
    const next = () => {
      if(ending?.step !== 'confront') return;
      endingRound++;
      if(endingRound < ENDING.confront.length) return endingSay(fionaLine(ENDING.confront[endingRound]), confrontMood(endingRound));
      // all answered: a moment of silence, then she gives in
      ending.step = 'confession'; ending.i = 0; ending.line = null; renderAsk(); renderSay(null);
      setMood('fiona', 'sad');

// First-check results of the case just solved in this visit: totals, stars, and the questions missed at first.
function liveStats(){
  const people = S.met.filter(id => per(id).order.length);
  people.forEach(id => recordFirst(id));
  const ok = people.reduce((n, id) => n + per(id).first.ok, 0), total = people.reduce((n, id) => n + per(id).first.total, 0);
  const rate = total ? ok / total : 0, stars = rate >= .9 ? 3 : rate >= .7 ? 2 : 1;
  const missed = people.flatMap(id => Object.entries(per(id).firstQuestions).filter(([, r]) => r.ok < r.total).map(([qid]) => `${id}:${qid}`));
  // wrong: { 'mole:m2': { blankId: what was written first } }
  const wrong = Object.fromEntries(missed.map(ref => {
    const [id, qid] = ref.split(':'), first = per(id).firstWrong;
    return [ref, Object.fromEntries(blanksOf(id, [qid]).filter(b => b.id in first).map(b => [b.id, first[b.id]]))];
  }));
  return { ok, total, stars, missed, wrong };
}

// The review's grammar rows: the case's key grammar form by form (CASES[].keys, the case key's pages), each with the first
// line of the case that uses that form (from GRAMMAR_LINES: an answer's words matching the form, A and B any words);
// without keys, the case's three most used grammar.
function reviewGrammar(){
  const keys = CASES[0].keys?.length ? CASES[0].keys : caseGrammar().slice(0, 3).map(([g]) => g);
  return keys.flatMap(g => {
    const uses = grammarUses(g).filter(u => spk(u.id).answers[u.qid].includes(u.words));
    return (GRAMMAR[g].examples || [{ head:GRAMMAR[g].name, ko:GRAMMAR[g].pattern }]).map(ex => {
      const form = new RegExp('^' + ex.head.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/\b[AB]\b/g, '.+') + '\\b', 'i');
      return { head:ex.head, name:ex.ko, use:GRAMMAR[g].examples ? uses.find(u => form.test(u.words)) : uses[0] };
    });
  });
}

  if(sent) return replaySentence(sent.dataset.rvSent, +sent.dataset.sent);
  if(e.target.closest('[data-rv-next]')) return reviewNext();

  }

    stopVoice(); rv.filled = {}; rv.solved = false;

  if(e.target.closest('[data-rv-close], [data-rv-done]')) return closeReview();

    return;

  if(e.target.closest('[data-rv-check]')){

    const answers = Object.fromEntries(blanksOf(id, [qid]).map(b => [b.id, b.ans]));

    return;
  }
  art.dataset.scene = signature;
  const floor = ART_FLOOR[pl.id], artHeight = pl.artHeight || 600;
  // the place view shows up to 30% of the floor extension under the picture, so the feet are not on the edge
  art.style.setProperty('--art-share', artHeight / (artHeight + (floor ? Math.min(floor.h, artHeight * .3) : 0)));
  art.innerHTML = `<svg viewBox="0 0 ${pl.artWidth || 900} ${pl.artHeight || 600}" aria-hidden="true">${ART[pl.id]()}</svg>` +
    (floor ? `<img class="art-floor" src="${floor.src}" alt="">` : '') +
    pl.spots.map(s => `<button class="spot${S.found[pl.id].has(s.clue) ? ' found' : ''}" type="button" data-clue="${s.clue}"
      style="left:${s.x}%;top:${s.y}%;width:${s.w}%;height:${s.h}%" aria-label="${esc(pl.clues[s.clue].label)} 살펴보기"></button>`).join('') +
    people.map(id => {

      return `<button class="scene-npc" type="button" data-talk="${id}" style="left:${position.x}%;bottom:${100 - position.floor}%;height:${height}%;width:${width}%;transform:translateX(-${(sprite?.anchor ?? .5) * 100}%)" aria-label="${esc(spk(id).name)}와 대화">${fullSVG(id)}<span>${esc(spk(id).name)}</span></button>`;
    }).join('');
}
function tapFx(x, y, kind, text){
  const d = document.createElement('div');
  d.className = 'tapfx ' + kind; d.style.left = x + 'px'; d.style.top = y + 'px';
  if(text) d.textContent = text;
  $('#art').appendChild(d);
  setTimeout(() => d.remove(), 900);
}
function evidencePhoto(place, clueIndex){
  const spot = place.spots.find(item => item.clue === clueIndex);
  if(spot.photo){
    const crop = spot.photo;
    return `<svg viewBox="${crop.x} ${crop.y} ${crop.w} ${crop.h}" aria-hidden="true">${ART[place.id]()}</svg>`;
  }
  const artWidth = place.artWidth || 900, artHeight = place.artHeight || 600;
  const height = Math.min(artHeight, Math.max(spot.h * artHeight / 100 * 1.12, spot.w * artWidth / 100 * .84, 120));
  const width = height * 4 / 3;
  const left = Math.max(0, Math.min(artWidth - width, (spot.x + spot.w / 2) * artWidth / 100 - width / 2));
  const top = Math.max(0, Math.min(artHeight - height, (spot.y + spot.h / 2) * artHeight / 100 - height / 2));
  return `<svg viewBox="${left} ${top} ${width} ${height}" aria-hidden="true">${ART[place.id]()}</svg>`;
}
function playShutter(){

function captureEvidence(place, clueIndex){

  const preview = document.createElement('div');
  preview.className = 'capture-view'; preview.setAttribute('aria-hidden', 'true');
  preview.innerHTML = `<div class="capture-frame">${photo}</div>`;
  $('.art-stage').appendChild(preview);

    if(!preview.isConnected || !S.investigate || S.place !== place.id) return;
    if(!S.evidence.some(item => item.placeId === place.id && item.clueIndex === clueIndex)){
      S.evidence.push({ placeId:place.id, clueIndex, photo });
    }
    S.view = 'evidence'; setNotes(true);
    evidenceOpen = `${place.id}-${clueIndex}`; renderDock();
    toast('증거를 노트에 기록했어요.');
  };

    if(narration){

// an ordinary object: only the detective's sentence, no photo
function sayProp(clue){
  cancelCapture();

}
function examine(i){
  const pl = placeObj();
  if(pl.clues[i].prop){ sayProp(pl.clues[i]); return; }
  const fresh = !S.found[pl.id].has(i);
  S.found[pl.id].add(i);
  if(fresh){
    const revealed = unlock(pl.clues[i].unlocks) || {};
    pendingPins.push(...(revealed.places || []));
    pendingPeople.push(...(revealed.people || []));
  }
  renderSceneHead(); renderPlaces();
  if(!S.evidence.some(item => item.placeId === pl.id && item.clueIndex === i)) captureEvidence(pl, i);
  else {

// mouse drag pans the illustration (touch uses native scrolling); a drag never counts as a tap
const artWrap = $('#artWrap');

artWrap.addEventListener('pointerdown', e => {

});

  if(!pan) return;
  const dx = e.clientX - pan.x;
  if(Math.abs(dx) > 5) pan.moved = true;

});
window.addEventListener('pointerup', () => { if(pan){ panMoved = pan.moved; pan = null; } });

  const r = $('#art').getBoundingClientRect();

// The nudge: after NUDGE_AFTER ms with no touch, key or wheel, while a place is showing and nothing covers it (no
// notebook, map, drawer, pop-up or tutorial: the head point must be the person's own), the first person there who
// still has questions (phase not 'done') gets the ! (.nudge). Any input takes it away and starts the count again.

function clearNudge(){ document.querySelectorAll('#art .nudge').forEach(n => n.remove()); }
['pointerdown', 'keydown', 'wheel'].forEach(type => addEventListener(type, () => { lastInput = Date.now(); clearNudge(); }, { capture:true, passive:true }));
setInterval(function nudgeTick(){
  if(Date.now() - lastInput < NUDGE_AFTER || !S.investigate || ending || document.hidden || $('#art .nudge')) return;
  const npc = [...$('#art').querySelectorAll('.scene-npc')].find(b => {
    if(per(b.dataset.talk).phase === 'done') return false;

// The interrogation's evidence found so far: a step of ENDING.confront counts once any evidence it accepts is found.
function evidenceNeed(){
  const found = key => { if(isSayRef(key)) return sayOk(key); const at = key.lastIndexOf('-'); return !!S.found[key.slice(0, at)]?.has(+key.slice(at + 1)); };

/* ---------- the detective ----------
   The player is the detective (user request: a squirrel; the name is the player's own). Never seen in a conversation
   or a place (first person): heard as the evidence sentences and a few lines of their own, seen only in the office —

  if(key === 'back') input.setRangeText('', a === b ? Math.max(0, a - 1) : a, b, 'end');
  else input.setRangeText(upper ? key.toUpperCase() : key, a, b, 'end');
  input.dispatchEvent(new Event('input', { bubbles:true }));
}

// Study days (local dates) for the streak on 내 기록: a day counts once a case is opened or a note is checked.
const dayKey = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const studyDays = () => readJSON(DAYS_KEY, []);
function markStudyDay(){
  const today = dayKey(), days = studyDays();
  if(days.includes(today)) return;
  try { localStorage.setItem(DAYS_KEY, JSON.stringify([...days, today].slice(-120))); } catch(e){}
}
function studyStreak(){
  const days = new Set(studyDays()), d = new Date();
  if(!days.has(dayKey(d))) d.setDate(d.getDate() - 1);   // today not studied yet: the streak still counts up to yesterday
  let n = 0;
  while(days.has(dayKey(d))){ n++; d.setDate(d.getDate() - 1); }
  return n;
}

// One continuous, taut red thread between each pair of pins, including locked cases.
// Positions come from layout (offset*), not the screen, so the photos' drop-in animation does not move it.
function drawBoardString(){
  const board = $('#caseCards'), photos = [...board.querySelectorAll('.polaroid')];
  board.querySelectorAll('.board-string').forEach(el => el.remove());
  if(!photos.length || !board.offsetWidth) return;
  const tacks = photos.map(el => {
    const a = parseFloat(el.style.getPropertyValue('--tilt')) * Math.PI / 180, dy = -el.offsetHeight / 2 + 7;
    return { x:el.offsetLeft + el.offsetWidth / 2 - dy * Math.sin(a), y:el.offsetTop + el.offsetHeight / 2 + dy * Math.cos(a), w:el.offsetWidth, locked:el.classList.contains('locked') };
  });
  const n = v => v.toFixed(1);
  const strings = tacks.slice(1).map((t, i) => {
    const f = tacks[i];
    const d = `M${n(f.x)} ${n(f.y)} L${n(t.x)} ${n(t.y)}`;
    return `<g class="board-thread"><path class="thread-shadow" d="${d}"/>
      <path class="thread-edge" d="${d}"/><path class="thread-core" d="${d}"/>
      <path class="thread-light" d="${d}"/></g>`;
  }).join('');
  // the push pins are Higgsfield art (assets/ui/tack-red/-grey.webp): the needle tip, at 36% across and the very
  // bottom of the picture, goes into the tack point; red for an open case, grey for a locked one
  const heads = tacks.map(t => `<ellipse cx="${n(t.x + 2)}" cy="${n(t.y + 1)}" rx="4" ry="1.8" fill="rgba(40,20,10,.35)"/>
    <image class="tack" href="assets/ui/tack-${t.locked ? 'grey' : 'red'}.webp" x="${n(t.x - .363 * 24)}" y="${n(t.y - 33)}" width="24" height="33"/>`).join('');
  board.insertAdjacentHTML('beforeend', `<svg class="board-string" aria-hidden="true">${strings}${heads}</svg>`);
}

// keySeen: the case's key grammar cards (CASES[].keys) were shown; a new case shows them first, over the case cards
function startCase(keySeen = false){
  stopVoice();

  if(!keySeen && !resumePending && !caseStarted && CASES[0].keys?.length) return openCaseKey(CASES[0].keys, () => startCase(true));

  if(caseStarted) return;
  caseStarted = true;

  tutSeen() ? talkTo('badger') : openTutorial(true);
}

/* ---------- save ----------
   The case in progress is kept on this device (SAVE_KEY): the whole state S (Sets stored as { $set:[…] }), and how far
   the ending got. Saved when the page is hidden or closed, on the way out (<), and every few seconds while a case is
   open. On the next visit the case resumes where it was: in the conversation or the place the player had open. Not kept:
   an ending scene in progress (the accusation is made again), a note check's open feedback, a line that was playing. */
const SAVE_KEY = 'pioo.save';
let resumePending = false, saveOff = false;
function saveGame(){
  if(!caseStarted || saveOff) return;
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({ v:1, S:{ ...S, sel:null }, endingRound },
      (key, value) => value instanceof Set ? { $set:[...value] } : value));
  } catch(e){}
}
function loadGame(){
  let data;
  try { data = JSON.parse(localStorage.getItem(SAVE_KEY), (key, value) => value && Array.isArray(value.$set) ? new Set(value.$set) : value); }
  catch(e){ return; }
  if(data?.v !== 1 || !data.S?.per) return;
  const saved = data.S.per;
  Object.assign(S, data.S, { sel:null, mood:{}, visit:{} });
  S.memo = { text:'', pins:[], notes:{}, ...data.S.memo };
  // anyone added to the case since the save starts fresh; a check's open feedback is not kept
  S.per = Object.fromEntries(PEOPLE_ORDER.map(id => [id, { ...newSpeakerState(), ...saved[id], feedback:null }]));
  // Fiona's shortened third reply has new blanks; preserve already checked notes from older saves.
  const fiona = S.per.fiona;
  if(fiona.questionChecks.q3 === 'ok' && !fiona.notes.k){
    Object.assign(fiona.notes, { k:'regular customer', l:'bread', m:'morning' });
    Object.assign(fiona.marks, { k:'ok', l:'ok', m:'ok' });
  }
  PLACES.forEach(place => { if(!(S.found[place.id] instanceof Set)) S.found[place.id] = new Set(); });
  // ordinary objects are no longer photographed: an older save's photos of them are dropped
  S.evidence = (S.evidence || []).filter(item => !placeOf(item.placeId)?.clues[item.clueIndex]?.prop);
  S.met = S.met.filter(id => PEOPLE[id]);
  // the bakery's note became its order board (the case's story changed): an older save's bakery photos show the picture
  // as it is now, and once the board was found its customer is there to talk to
  S.evidence.forEach(item => {
    if(item.placeId === 'bakery' || (item.placeId === 'library' && item.clueIndex === 0))
      item.photo = evidencePhoto(placeOf(item.placeId), item.clueIndex);
  });
  if(S.found.bakery?.has(2) && !S.met.includes('betty')){ S.met.push('betty'); S.known.add(spk('betty').place); }
  endingRound = data.endingRound || 0;
  caseStarted = resumePending = true;
}

  if(S.investigate && S.known.has(S.place)){ S.investigate = false; enterPlace(S.place); }
  else { S.investigate = false; talkTo(S.cur); }
}

/* ---------- grammar notes ----------
   A checked question gets chips for the grammar in its answer (GRAMMAR_LINES). A chip opens the card:
   the pattern, a Korean explanation, and every learned line that uses it, with the words highlighted. */
// The text with each grammar's words turned into a link to its card (overlapping words: the first one wins).
function markGrammar(text, items = []){
  const ranges = items.map(([g, words]) => ({ g, at:text.indexOf(words), len:words.length })).filter(r => r.at >= 0).sort((a, b) => a.at - b.at);
  let html = '', last = 0;
  let i = 0;
  ranges.forEach(r => {
    if(r.at < last) return;
    html += esc(text.slice(last, r.at)) + `<button class="gmark" type="button" data-grammar="${r.g}" style="--i:${i++}">${esc(text.substr(r.at, r.len))}</button>`;
    last = r.at + r.len;
  });
  return html + esc(text.slice(last));
}
// The 지문 toggle under a checked question in the note (open = the answer text is showing).
const passageToggle = (ref, open) => `<button class="ptoggle" type="button" data-passage="${ref}" aria-pressed="${open}">${open ? '지문 접기' : '지문 보기'}</button>`;
// The sentence of the answer (or the question) that holds the words, with the words marked.
function grammarLine(id, qid, words){
  const s = spk(id), answer = s.answers[qid], question = qs(s).find(q => q.id === qid).en;
  const inAnswer = answer.includes(words), text = inAnswer ? answer : question;
  const parts = sentencesOf(text), idx = Math.max(0, parts.findIndex(part => part.includes(words))), sentence = parts[idx];
  const at = sentence.indexOf(words);
  return { inAnswer, idx, html:esc(sentence.slice(0, at)) + `<mark>${esc(words)}</mark>` + esc(sentence.slice(at + words.length)) };
}
const grammarUses = g => Object.entries(GRAMMAR_LINES).flatMap(([ref, items]) => {
  const [id, qid] = ref.split(':');
  return knownQuestion(id, qid) ? items.filter(([gid]) => gid === g).map(([, words]) => ({ id, qid, words })) : [];
});
function learnedGrammar(){
  return Object.keys(GRAMMAR).map(g => [g, grammarUses(g).length]).filter(([, n]) => n);
}

   학습 (user request: 단어장 and 복습 in one, switched 단어 / 문법 / 복습): 단어 = blanks the player has written right
   (every blank once a case is solved), the line it came from plays with ▶, Korean only with 해석; 문법 = grammar cards;
   복습 = solved cases and the lines missed at the first check.
   마이: streak, totals, the how-to and the detective's name. All of it reads only what this device saved or the case in memory. */
let homeTab = 'home', studyMode = 'words';
// A question whose words and grammar count as learned: checked right in the case in memory, or any once the case is solved.
const knownQuestion = (id, qid) => solvedCases().includes(CASES[0].id) || per(id).questionChecks[qid] === 'ok';
function learnedWords(){
  const seen = new Map();
  PEOPLE_ORDER.forEach(id => {
    const s = spk(id);
    qs(s).forEach(q => {
      if(!knownQuestion(id, q.id)) return;
      (s.notes[q.id] || []).forEach(line => line.replace(BLANK_RE, (m, bid, ans) => {
        const key = ans.split('/')[0].toLowerCase();
        if(WORDS[key] && !seen.has(key)) seen.set(key, { word:ans.split('/')[0], key, line, bid, ref:`${id}:${q.id}`, sent:sentenceFor(s.answers[q.id], ans, line) });
        return m;
      }));
    });
  });
  return [...seen.values()];
}
// Which sentence of the answer a note blank was heard in: one that says the word (any accepted form), the one
// sharing most words with the note line when several or none do.
function sentenceFor(answer, ans, line){
  const tokens = text => text.toLowerCase().replace(/[^a-z0-9: ]/g, ' ').split(/\s+/).filter(Boolean);
  const said = ans.split('/').map(v => new RegExp(`\\b${v.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}\\b`, 'i'));
  const lineWords = new Set(tokens(line.replace(BLANK_RE, (m, bid, a) => a.split('/')[0])));
  let best = 0, top = -1;
  sentencesOf(answer).forEach((sentence, i) => {
    const score = (said.some(re => re.test(sentence)) ? 100 : 0) + tokens(sentence).filter(w => lineWords.has(w)).length;
    if(score > top){ top = score; best = i; }
  });
  return best;
}
// A note line with its blanks filled in; the blank `mark` is highlighted.
function filledLine(line, mark){
  let html = '', last = 0;
  line.replace(BLANK_RE, (m, bid, ans, idx) => {
    const word = esc(ans.split('/')[0]);
    html += esc(line.slice(last, idx)) + (bid === mark ? `<mark>${word}</mark>` : word);
    last = idx + m.length; return m;
  });
  return html + esc(line.slice(last));
}

// Write the correct answer into every blank of the given questions; returns how many blanks were filled.
function fillAnswers(i, qids, mark){
  const p = per(i); let n = 0;
  qids.forEach(qid => spk(i).notes[qid].forEach(line =>
    line.replace(/\{\{(\w+)\|([^}]+)\}\}/g, (m, id, ans) => {
      p.notes[id] = ans.split('/')[0];
      if(mark) p.marks[id] = 'ok'; else delete p.marks[id];
      n++; return m;
    })
  ));
  return n;
}

  ['key', '이번 사건의 열쇠', () => startCase()],
  ['tutorial', '튜토리얼', () => { localStorage.removeItem(TUT_KEY); startCase(true); }],
  ['talk', '첫 대화', () => startCase(true)],
  ['map', '지도', previewCase],
  ['place', '현장 조사', () => { previewCase(); openSheet(null); }],
  ['deduce', '추리 보드', () => { previewCase(); openDeduce(); }],
  ['call', '경찰에게 알리기', () => { previewCase(); previewDeduced(); openSheet(null); startCall(); }],
  ['interview', '심문', () => { previewCase(); previewDeduced(); openSheet(null); accusedId = CULPRIT; startEnding(); }],
  ['confession', '자백', () => { previewCase(); $('#devInterro').click(); }],
  ['review', '복습', () => { previewCase(); previewDeduced(); openSheet(null); openReview(); }]
];
$('#devPreview').innerHTML = '<small>미리보기</small>' +
  PREVIEW_PARTS.map(([id, label]) => `<button class="devbtn" type="button" data-preview="${id}" aria-pressed="${id === PREVIEW}">${label}</button>`).join('') +
  (PREVIEW ? '<button class="devbtn" type="button" data-preview-end>미리보기 끝</button>' : '');
$('#devPreview').addEventListener('click', e => {
  const b = e.target.closest('[data-preview],[data-preview-end]'); if(!b) return;
  location.href = location.pathname + (b.dataset.preview ? `?preview=${b.dataset.preview}` : '');
});

/* ---------- boot ---------- */
loadGame();
renderStage(false); renderDock(); renderPlaces(); renderSceneHead();
// the app opens on 홈; without a detective name, the first meeting and naming come first (user request)
openCaseList('home');
if(!detectiveName()) meetDetective(null);
// a preview: its part, without the test tools' notes
if(PREVIEW){ PREVIEW_PARTS.find(([id]) => id === PREVIEW)?.[2](); $('#toast').hidden = true; }
})();
</script>
</body>
</html>
