/* ---------- speech ---------- */
let voices = [];
function loadVoices(){
  if(!('speechSynthesis' in window)) return;
  const all = speechSynthesis.getVoices().filter(v => /^en[-_]/i.test(v.lang));
  voices = all.filter(v => /en[-_](US|GB)/i.test(v.lang)).concat(all.filter(v => !/en[-_](US|GB)/i.test(v.lang)));
}
if('speechSynthesis' in window){ loadVoices(); speechSynthesis.addEventListener?.('voiceschanged', loadVoices); }
let talkT, speechTurn = 0;
let talker = null;   // whose line is playing (a replay from the notebook can be someone else's)
let talkPart = 'main';   // in a picture of two, whose mouth moves: 'main', a part ('ollie') or 'all'
function setTalking(on){
  document.querySelectorAll('.scene-npc').forEach(npc => {
    npc.style.setProperty('--talk-cycle', S.slow ? '.99s' : '.74s');
    npc.classList.toggle('talking', on && npc.dataset.talk === (talker || S.cur));
    npc.querySelectorAll('.npc-mouth[data-part]').forEach(m => m.classList.toggle('quiet', talkPart !== 'all' && m.dataset.part !== talkPart));
  });
}
// whose mouth says this line: the line's own (as.mouth), else the speaker named in it ("Mia: Mine is blue." = Mia's),
// else the picture's own person. A line naming two speakers is split by speakerTurns before it gets here.
function mouthPart(text, who, as){
  if(as?.mouth) return as.mouth;
  const parts = SPRITES[spriteKey(who)]?.parts || {};
  const said = [...text.matchAll(/(?:^|\s)([A-Z][a-z]+):\s/g)].map(m => m[1].toLowerCase());
  return said.length > 1 ? 'all' : parts[said[0]] ? said[0] : 'main';
}
// "Ollie: No. Mine is red. Mia: Mine is blue. Why?" → [{ name:'ollie', text:'No. Mine is red.' }, { name:'mia', … }]
const speakerTurns = text => [...text.matchAll(/(?:^|\s)([A-Z][a-z]+):\s(.*?)(?=\s[A-Z][a-z]+:\s|$)/g)]
  .map(m => ({ name:m[1].toLowerCase(), text:m[2] }));
const clip = new Audio();
clip.preload = 'auto';
clip.onplaying = () => setTalking(true);
clip.onended = clip.onpause = clip.onwaiting = clip.onerror = () => setTalking(false);
function stopVoice(){
  speechTurn++;
  clearTimeout(talkT);
  clip.pause();
  $('#evidenceVoice').pause();
  $('#wordVoice').pause();
  if('speechSynthesis' in window) speechSynthesis.cancel();
  setTalking(false);
}
// Every stamp that lands thuds (user request): ms = when the stamp's animation hits the paper.
function stampSound(ms = 0){ setTimeout(() => { const s = $('#stampThud'); s.currentTime = 0; s.play().catch(() => {}); }, ms); }
const blobSrc = {};
const seekableSrc = src => blobSrc[src] ||= fetch(src).then(r => r.ok ? r.blob() : Promise.reject()).then(b => URL.createObjectURL(b)).catch(() => src);
// onDone runs once the line has finished (not when it is cut off by another line or stopVoice).
// range: [start, end] seconds of the recording to play (one sentence); it never calls onDone.
// as: { pitch, voice } for the browser voice of this line only (Ollie, who shares the figure with Mia)
function speak(text, key, who = S.cur, onDone, range, as){
  // two in one picture answering one question (user request: never at the same time, so each can be heard): they
  // speak in turn, each with their own recording (<key>-<name>, e.g. g1-mia) or browser voice and their own mouth
  const turns = range ? [] : speakerTurns(text);
  if(turns.length > 1){
    const say = i => speak(turns[i].text, `${key}-${turns[i].name}`, who, () => {
      if(i + 1 === turns.length) return onDone?.();
      const turn = speechTurn;
      setTimeout(() => { if(turn === speechTurn) say(i + 1); }, 300);
    }, undefined, spk(who).parts?.[turns[i].name] || { mouth:'main' });
    return say(0);
  }
  stopVoice();
  const turn = speechTurn;
  talker = who; talkPart = mouthPart(text, who, as);
  const done = () => { if(turn === speechTurn) onDone?.(); };
  const length = text.length * (S.slow ? 95 : 70) + 500;
  const src = spk(who).audio?.[key];
  if(src){
    const play = url => {
      if(turn !== speechTurn) return;
      clip.src = url;
      clip.preservesPitch = true;
      clip.playbackRate = S.slow ? .75 : 1;
      clip.addEventListener('ended', done, { once:true });
      clip.play().catch(() => { if(turn === speechTurn){ setTalking(false); toast('음성을 재생하지 못했어요. 다시 듣기를 눌러 주세요.'); done(); } });
    };
    // one sentence: a media fragment on an in-memory copy, which can always seek (a plain file URL can only
    // when the server answers range requests)
    if(range) seekableSrc(src).then(url => {
      play(`${url}#t=${range[0]},${range[1]}`);
      // the fragment end is only checked a few times a second; stop right at the end so the next sentence never leaks in
      const watch = setInterval(() => {
        if(turn !== speechTurn) return clearInterval(watch);
        if(clip.currentTime >= range[1] - .02){ clip.pause(); clearInterval(watch); }
      }, 15);
    });
    else play(src);
    return;
  }
  // No recording: browser TTS. If it never starts (no voices, e.g. inside an app preview), the person
  // still moves their mouth for about as long as the line would take, so the scene reads as speech.
  const mime = () => {
    if(turn !== speechTurn) return;
    setTalking(true);
    clearTimeout(talkT);
    talkT = setTimeout(() => { if(turn === speechTurn){ setTalking(false); done(); } }, length);
  };
  if(!('speechSynthesis' in window)){ mime(); return; }
  const s = { ...spk(who), ...as };
  const u = new SpeechSynthesisUtterance(text.replace(/(^|\s)[A-Z][a-z]+:\s/g, '$1'));
  u.lang = 'en-US'; u.rate = S.slow ? .72 : .95; u.pitch = s.pitch;
  if(voices.length) u.voice = voices[s.voice % voices.length];
  let started = false;
  u.onstart = u.onresume = () => {
    started = true;
    if(turn !== speechTurn) return;
    setTalking(true);
    clearTimeout(talkT);
    talkT = setTimeout(() => { if(turn === speechTurn) setTalking(false); }, length + 300);
  };
  u.onend = () => { if(turn === speechTurn){ setTalking(false); clearTimeout(talkT); done(); } };
  u.onerror = u.onpause = () => { if(turn === speechTurn){ setTalking(false); clearTimeout(talkT); } };
  speechSynthesis.speak(u);
  setTimeout(() => { if(!started) mime(); }, 700);
}

/* ---------- stage ---------- */
let cameraMotion;
function animateCamera(art, from, to, ms = 650){
  cameraMotion?.cancel();
  art.style.transform = to;
  if(from && !matchMedia('(prefers-reduced-motion: reduce)').matches){
    cameraMotion = art.animate([{transform:from}, {transform:to}], {duration:ms, easing:ms > 650 ? 'cubic-bezier(.45,0,.3,1)' : 'cubic-bezier(.22,.7,.25,1)'});
    cameraMotion.onfinish = () => { if(!S.investigate) focusCamera(); };
  }
}
// fromRect: the NPC's on-screen rect when coming from the place view. glide: move from the
// current framing (the note opened or closed).
// ms: how long the move takes (a slow pan in the ending)
function focusCamera(fromRect, glide = false, ms){
  if(S.investigate) return;
  const subject = S.cur;
  const viewport = $('#talkCamera'), art = $('#art'), place = placeOf(placeIdOf(subject));
  const width = viewport.clientWidth, height = viewport.clientHeight;
  if(!width || !height) return;
  const position = positionOf(subject);
  const worldWidth = place.artWidth || 900, worldHeight = place.artHeight || 600;
  // Note closed: a 44%-tall NPC fills 58% of the scene with the feet just above the question
  // buttons. Note open: it shrinks to 46% with the head just under the top chips, so the face
  // stays above the note (top ~35%: the writing-down note is 65% tall, user: room for blanks that widen and wrap). The NPC never moves in the world; only the camera does.
  // Below the picture's bottom edge, the outpainted floor (ART_FLOOR) fills the scene.
  const notes = $('#app').classList.contains('notes-open');
  // The interview room leaves more room above the speaker for dialogue, showing the face below the bubble.
  const interview = place.id === INTERVIEW_ROOM.id;
  // (user request: the person stands lower, under the top bubble their lines now come in)
  const share = notes ? .46 : interview ? .52 : .55, headTop = notes ? .07 : interview ? .35 : .31;
  const fullHeight = worldHeight + (ART_FLOOR[place.id]?.h || 0);
  const minScale = Math.max(width / worldWidth, height / fullHeight);
  // a wide sprite (Mia and Ollie side by side) is never cut by the edges: the camera stays far enough to show all of it
  // (smaller then, with the feet where everyone else's are)
  const spriteWidth = npcBox(subject, place).width * worldWidth / 100;
  const near = height * share / (worldHeight * Math.max(44, position.height) / 100), fit = width * .94 / spriteWidth;
  // a wide shot (ending.wide: a line's wide, { x, w }: the middle and the width it shows, in % of the picture) takes in
  // everyone standing there, their feet low in the scene
  // wide.top: world px above the picture to keep in view too (the tree's star, in the sky above it)
  // a peek (ending.peek, { x, y, w }: x in %, y in world px, w the width shown in %): the camera on one spot (the star)
  const wide = ending?.wide, peek = ending?.peek;
  const scale = peek ? Math.max(minScale, width / (worldWidth * peek.w / 100))
    : wide ? Math.max(minScale, Math.min(near, width / (worldWidth * wide.w / 100), wide.top ? height * .86 / (worldHeight * position.floor / 100 + wide.top) : Infinity))
    : Math.max(minScale, Math.min(near, fit));
  // in the ending too the camera is on whoever speaks (Fiona while questioned, the partner for his closing line)
  const centerX = peek ? peek.x : wide ? wide.x : position.x;
  let top = peek ? height * .3 - peek.y * scale
    : wide ? height * .86 - worldHeight * position.floor / 100 * scale
    : fit < near ? height * (headTop + share) - worldHeight * position.floor / 100 * scale
    : height * headTop - worldHeight * (position.floor - position.height) / 100 * scale;
  const left = Math.min(0, Math.max(width - worldWidth * scale, width / 2 - worldWidth * centerX / 100 * scale));
  const sky = ART_SKY[place.id]?.src ? ART_SKY[place.id].h : 0;
  top = Math.min(sky * scale, Math.max(height - fullHeight * scale, top));
  const bounds = viewport.getBoundingClientRect();
  const from = fromRect?.width ? `translate(${fromRect.left - bounds.left}px, ${fromRect.top - bounds.top}px) scale(${fromRect.width / worldWidth})`
    : glide ? getComputedStyle(art).transform : null;
  animateCamera(art, from, `translate(${left}px, ${top}px) scale(${scale})`, ms);
}

/* ---------- word meanings on the note ---------- */
// A word, or a phrase of two to four words, tapped on the note shows its meaning in a small bubble (user request).
// Only on what the player has already got right: a statement written down right (its question, its lines and its
// passage), an evidence note and the pinned memos. People by their name from the case (spk().ko), then GLOSS; X's adds 의.
const glossKey = s => s.toLowerCase().replace(/’/g, "'").replace(/\./g, '').replace(/\s+/g, ' ').trim();
let glossNames;
function glossOf(text){
  if(!glossNames){
    glossNames = {};
    Object.values(PEOPLE).forEach(p => {
      const names = [p.name, p.id === 'betty' ? 'Mrs. Bear' : ''].filter(n => n && !n.includes('&'));   // a pair (Mia & Ollie) is in GLOSS
      names.forEach(n => { glossNames[glossKey(n)] = p.ko; const first = glossKey(n).split(' ')[0]; if(!/^(mr|mrs|the)$/.test(first)) glossNames[first] = p.ko; });
    });
  }
  const k = glossKey(text), own = /'s$/.test(k) && !GLOSS[k], base = own ? k.slice(0, -2) : k;
  const m = glossNames[base] || GLOSS[base];
  return m ? m + (own ? '의' : '') : '';
}
// every text in el becomes words that can be tapped (data-gloss), the longest phrase first
function glossify(el){
  const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, { acceptNode: n => n.parentElement.closest('button, .gw, .ko, .np-ko') ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT });
  const nodes = []; while(walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(node => {
    const text = node.textContent, toks = [...text.matchAll(/[A-Za-z]+(?:['’][A-Za-z]+)?/g)];
    if(!toks.length) return;
    const frag = document.createDocumentFragment(); let at = 0, i = 0;
    while(i < toks.length){
      let n = Math.min(4, toks.length - i), hit = '';
      for(; n > 1; n--){
        const gaps = toks.slice(i, i + n - 1).every((t, j) => /^\.?\s+$/.test(text.slice(t.index + t[0].length, toks[i + j + 1].index)));
        if(gaps && (hit = glossOf(toks.slice(i, i + n).map(t => t[0]).join(' ')))) break;
      }
      if(n === 1) hit = glossOf(toks[i][0]);
      const start = toks[i].index, last = toks[i + n - 1], end = last.index + last[0].length;
      if(hit){
        frag.append(text.slice(at, start));
        const w = document.createElement('span'); w.className = 'gw'; w.dataset.gloss = hit; w.textContent = text.slice(start, end);
        frag.append(w); at = end;
      }
      i += n;
    }
    frag.append(text.slice(at)); node.replaceWith(frag);
  });
}

function blockHTML(sIdx, qid, now){

function playEvidence(ref){
  const entry = evidenceEntry(ref);
  if(!entry) return;
  if(!entry.audio) return readOut(entry.en);
  // a thing compared (violin case) says its own sentence, then the comparison's
  const [first, ...rest] = [].concat(entry.audio);
  stopVoice();
  const voice = $('#evidenceVoice');
  voice.onended = voice.onerror = null;
  if(!voice.src.endsWith(first)) voice.src = first;
  voice.preservesPitch = true; voice.playbackRate = S.slow ? .75 : 1;
  voice.currentTime = 0;
  if(rest.length) voice.onended = () => { voice.onended = null; detectiveSay(rest[0]); };
  voice.play().catch(() => {});

// One of the detective's own lines (DETECTIVE, audio/detective-<key>.mp3), in the same voice as the evidence sentences.
// onDone runs once it has been said, or at once if it cannot play (not when stopVoice cuts it off); onBlocked instead,
// when given, if the browser holds the sound back until the first tap.
// text: read by the browser's voice when the line has no recording
function detectiveSay(key, onDone, onBlocked, text){
  stopVoice();
  const voice = $('#evidenceVoice'), done = () => { voice.onended = voice.onerror = null; onDone?.(); };
  voice.onended = voice.onerror = null;
  if(text && (!key || PACK?.silent)){ readOut(text, onDone); return; }
  // a key may be a whole path (askAudio); the picnic case's own lines are in audio/picnic/, the umbrella case's all in
  // audio/umbrella/, the violin case's in audio/violin/, the Christmas star's in audio/christmas/
  voice.src = key.includes('/') ? key : DETECTIVE_PICNIC.has(key) ? `audio/picnic/detective-${key}.mp3`
    : UMBRELLA ? `audio/umbrella/detective-${key}.mp3` : VIOLIN ? `audio/violin/detective-${key}.mp3`
    : CHRISTMAS ? `audio/christmas/detective-${key}.mp3` : `audio/detective-${key}.mp3`;
  voice.preservesPitch = true; voice.playbackRate = S.slow ? .75 : 1;
  voice.onended = done; voice.onerror = done;
  voice.play().catch(err => {
    if(err?.name !== 'NotAllowedError' || !onBlocked) return done();
    voice.onended = voice.onerror = null; onBlocked();
  });
}

function readOut(text, onDone){
  stopVoice();
  const turn = speechTurn, done = () => { if(turn === speechTurn) onDone?.(); };
  const length = text.length * (S.slow ? 95 : 70) + 500;
  if(!('speechSynthesis' in window)){ talkT = setTimeout(done, length); return; }
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US'; u.rate = S.slow ? .72 : .95;
  if(voices.length) u.voice = voices[0];
  let started = false;
  u.onstart = () => { started = true; };
  u.onend = u.onerror = done;
  speechSynthesis.speak(u);
  talkT = setTimeout(() => { if(!started) done(); }, length);
}

function bindDock(){
  const body = $('#dockBody');
  glossifyDock(body);
  const faces = body.querySelector('.nfaces');
  if(faces){
    let drag = null, moved = false;
    faces.addEventListener('pointerdown', e => {
      if(e.pointerType !== 'mouse' || e.button !== 0) return;
      drag = { id:e.pointerId, x:e.clientX, left:faces.scrollLeft };
      moved = false;
    });
    faces.addEventListener('pointermove', e => {
      if(!drag || e.pointerId !== drag.id) return;
      const dx = e.clientX - drag.x;
      if(!moved && Math.abs(dx) > 5){ moved = true; faces.classList.add('dragging'); faces.setPointerCapture(e.pointerId); }
      if(moved){ faces.scrollLeft = drag.left - dx; e.preventDefault(); }
    });
    const endDrag = e => {
      if(!drag || e.pointerId !== drag.id) return;
      drag = null; faces.classList.remove('dragging');
      if(faces.hasPointerCapture(e.pointerId)) faces.releasePointerCapture(e.pointerId);
    };
    faces.addEventListener('pointerup', endDrag);
    faces.addEventListener('pointercancel', e => { endDrag(e); moved = false; });
    faces.addEventListener('click', e => { if(moved){ e.preventDefault(); e.stopPropagation(); moved = false; } }, true);
  }
  body.querySelectorAll('[data-ev-open]').forEach(button => button.addEventListener('click', () => {
    evidenceOpen = button.dataset.evOpen; renderDock(); playEvidence(evidenceOpen);
  }));

  body.querySelectorAll('[data-evidence-ko]').forEach(button => button.addEventListener('click', () => {

  }));
  body.querySelectorAll('[data-replay]').forEach(button => button.addEventListener('click', () => replayLine(button.dataset.replay)));
  body.querySelectorAll('[data-grammar]').forEach(button => button.addEventListener('click', () => openGrammar(button.dataset.grammar, button.dataset.words)));
  body.querySelectorAll('[data-passage]').forEach(button => button.addEventListener('click', () => {
    const block = button.closest('.nblock'), text = block.querySelector('.npassage');
    block.classList.remove('fresh');   // the just-checked unfold is played once; showing the passage again is instant
    text.hidden = !text.hidden;
    openPassages[text.hidden ? 'delete' : 'add'](button.dataset.passage);
    button.setAttribute('aria-pressed', !text.hidden);
    button.textContent = text.hidden ? '지문 보기' : '지문 접기';
  }));
  body.querySelectorAll('[data-passage-ko]').forEach(button => button.addEventListener('click', () => {
    const ko = button.closest('.npassage').querySelector('.np-ko');
    ko.hidden = !ko.hidden;
    openPassageKo[ko.hidden ? 'delete' : 'add'](button.dataset.passageKo);
    button.setAttribute('aria-pressed', !ko.hidden);
  }));
  body.querySelectorAll('[data-present]').forEach(button => button.addEventListener('click', () => present(button.dataset.present)));
  body.querySelectorAll('[data-face]').forEach(button => button.addEventListener('click', () => { S.view = button.dataset.face; renderDock(); }));
  body.querySelectorAll('[data-pin]').forEach(button => button.addEventListener('click', e => {
    e.stopPropagation(); togglePin(button.dataset.pin);
    const on = S.memo.pins.includes(button.dataset.pin);
    button.classList.toggle('on', on); button.setAttribute('aria-pressed', on); renderWho();
  }));
  body.querySelectorAll('[data-unpin]').forEach(button => button.addEventListener('click', () => { togglePin(button.dataset.unpin); renderDock(); }));
  body.querySelector('#memoText')?.addEventListener('input', e => { S.memo.text = e.target.value; });
  body.querySelectorAll('[data-pin-note]').forEach(area => {
    // grows with what is written (field-sizing does it where supported)
    const fit = () => { area.style.height = 'auto'; area.style.height = area.scrollHeight + 'px'; };
    if(!CSS.supports('field-sizing', 'content')) requestAnimationFrame(fit);
    area.addEventListener('input', () => {
      if(area.value.trim()) S.memo.notes[area.dataset.pinNote] = area.value; else delete S.memo.notes[area.dataset.pinNote];
      if(!CSS.supports('field-sizing', 'content')) fit();
    });
    area.addEventListener('change', saveGame);
  });
  const bank = body.querySelector('#bank');
  if(bank){
    bank.addEventListener('click', e => {
      const word = e.target.closest('.word');
      if(word && (!suppressWordClick || e.detail === 0)) fillNextBlank(word.dataset.w, word);
      suppressWordClick = false;
    });
    bank.addEventListener('pointerdown', dragStart);
    bank.addEventListener('pointermove', dragMove);
    bank.addEventListener('pointerup', dragEnd);
    bank.addEventListener('pointercancel', dragEnd);
  }
}

/* ---------- interrogation flow ---------- */
function stageCard(title, sub){
  const d = document.createElement('div');
  d.className = 'stage-card';
  d.innerHTML = `<div><small>${esc(sub)}</small><b>${esc(title)}</b></div>`;
  $('.scene').appendChild(d);
  setTimeout(() => d.remove(), 1900);
}
// Start or resume a conversation. The first meeting plays the greeting.
let greetingTimer;
// whom the first-meeting greeting is playing for: their questions wait until it is over (user request), and the
// detective's bubble sits lower meanwhile (.app.greeting)
let greetingId = null, greetingCut;
// A line said in turn in a conversation, the detective's or the person's, waits for the player's tap on the screen before
// the next (user request: they went on by itself; a person's line has no bubble, so a ▼ shows above the tabs instead). tapWait: what goes on, once that line has been said; tapWaited: the time spent waiting so far (ms)
let tapWait = null, tapSince = 0, tapWaited = 0;
function waitTap(go){
  tapWait = go; tapSince = Date.now();
  const bubble = $('#sayBubble');
  if(bubble.hidden) $('#tapCue').hidden = false; else bubble.classList.add('wait-tap');
}
function tapGo(){
  const go = tapWait; if(!go) return false;
  dropTap(); go(); return true;
}
function dropTap(){
  if(tapWait) tapWaited += Date.now() - tapSince;
  tapWait = null; $('#sayBubble').classList.remove('wait-tap'); $('#tapCue').hidden = true;
}
// the fallback for lines said in turn that never report their end: fn after ms, not counting the time spent waiting
// for the player's tap; { stop() } cancels it
function linesCut(ms, fn){
  let seen = tapWaited, t;
  const arm = wait => { t = setTimeout(() => {
    if(tapWait) return arm(1000);
    const extra = tapWaited - seen; seen = tapWaited;
    extra > 0 ? arm(extra) : fn();
  }, wait); };
  arm(ms);
  return { stop:() => clearTimeout(t) };
}
function setGreeting(id){
  greetingCut?.stop();
  greetingId = id;
  $('#app').classList.toggle('greeting', !!id);
}
const sceneScroll = {};
function talkTo(id){
  clearTimeout(greetingTimer);
  const fromRect = S.investigate && S.place === spk(id).place ? $('#art').getBoundingClientRect() : null;
  if(S.investigate && S.place) sceneScroll[S.place] = artWrap.scrollLeft;
  stopVoice();
  // the first meeting, or one whose greeting was cut off (user request: leaving in the middle must not lose it, e.g.
  // Rosie's request): helloCut stays until the greeting has been said to the end
  const met = per(id).phase !== 'wait', first = !met || !!per(id).helloCut;
  S.cur = id; S.view = id; S.sel = null;
  if(!ending) renderSay(null);
  if(!S.met.includes(id)) S.met.push(id);
  if(first){ per(id).phase = 'choose'; per(id).helloCut = true; }
  openSheet(null); setNotes(false);
  if(S.investigate) setInvestigate(false);
  // after leaving the place view, which clears any greeting (a greeting begun there would otherwise never count as said)
  setGreeting(first ? id : null);
  renderStage(fromRect); renderDock();
  if(recordLocked()) setNotes(true);   // an unfinished recording opens again where it was left
  else if(!first) Object.entries(cur().after || {}).forEach(([qid, beat]) => {
    const heard = qid === 'done' ? per(id).phase === 'done' : per(id).questionChecks[qid] === 'ok';
    const missing = (beat.snap || []).some(ref => !S.evidence.some(item => evRef(item) === ref)) || beat.give && !S.items.includes(beat.give) && !S.handoffRound;
    if(heard && missing && !beats.some(b => b.id === id)){ beats.push({ id, ...beat }); greetingTimer = setTimeout(playBeats, 700); }
  });
  if(first){
    if(id === START && !met) stageCard(CASE.title, CASE.no);
    greetingTimer = setTimeout(() => playGreeting(id), id === START ? 1200 : 600);
  }
}
// The first meeting's greeting: `hello` is one line of theirs, or the lines in turn as the case design writes them.
function playGreeting(id){
  if(per(id).phase !== 'choose') return setGreeting(null);
  const lines = [].concat(spk(id).hello), done = () => { if(greetingId === id){ delete per(id).helloCut; setGreeting(null); renderAsk(); } };
  playLines(id, lines, done);
  // the questions come anyway if a line never reports its end (no voice at all)
  greetingCut = linesCut(lines.reduce((t, l) => t + (l.en || l).length * 95 + 2500, 1000), done);
}
// Lines said in turn in a conversation: theirs by them (key: their audio, as: another voice), the detective's (det) in
// the detective's bubble. {name} is the player's detective name on screen; the voice says "the detective" (design).
// Asking a question (it clears greetingTimer) or leaving the conversation cuts them off; onDone once all are said.
function playLines(id, lines, onDone, i = 0){
  const line = lines[i];
  if(S.investigate || S.cur !== id) return;
  if(!line) return onDone?.();
  const next = () => { greetingTimer = setTimeout(() => playLines(id, lines, onDone, i + 1), 400); };
  // a person's line, once said, waits for a tap too; it shows in the bubble at the top, its tail to them (user pick A,
  // the words with the voice): lines that are not written down in the notebook
  const tapNext = () => waitTap(() => { if(S.investigate || S.cur !== id) return; if(!ending) renderSay(null); next(); });
  const theirs = (en, key, as) => {
    const say = () => speak(en, key, id, tapNext, null, as);
    if(!ending) renderSay({ who:id, en, ko:line.ko, replay:() => { dropTap(); say(); } });
    say();
  };
  if(typeof line === 'string') return theirs(line, 'hello');
  if(line.intro && !per(id).introduced){
    per(id).introduced = true; renderWho(); renderChip(); renderPlaces();
    document.querySelectorAll(`.scene-npc[data-talk="${id}"] > span`).forEach(tag => { tag.textContent = spk(id).name; });
  }
  if(line.phone){
    renderSay({ name:line.phone, en:line.en, ko:line.ko, det:true, face:line.face });
    // the caller's recording when they have one (face: who is calling), else the browser's voice
    const heard = () => waitTap(() => { if(S.investigate || S.cur !== id) return; if(!ending) renderSay(null); next(); });
    const rec = line.face && PEOPLE[line.face]?.audio?.[line.key];
    return rec ? detectiveSay(rec, heard, null, line.en) : readOut(line.en, heard);
  }
  if(!line.det) return theirs(line.en, line.key, line.as);
  const name = detectiveName(), named = text => text.replace(' {name}', name ? ` ${name}` : '');
  renderSay(detLine({ ...line, en:named(line.en), ko:named(line.ko) }));
  // the next line waits for a tap on the screen once this one has been said
  detectiveSay(line.key, () => waitTap(() => {
    if(S.investigate || S.cur !== id) return;
    if(!ending) renderSay(null);
    next();
  }), null, line.en.replace('Detective {name}', 'the detective'));
}
// Leave the conversation for the place it happens in; any unfinished recording waits in the notebook.
function leaveTalk(){ enterPlace(cur().place, true); }
// Tapping the scene around the person (not the person, not a button) also goes back to the whole place,
// with the same camera move as the top chip. The picture itself is inert here, so the tap lands on #talkCamera.
// Not while someone is saying their lines (user request: a slip of the finger cut Rosie's greeting off): the greeting,
// an `after` beat, any voice playing. The top chip still leaves.
const linesPlaying = () => !!greetingId || beatOn === S.cur || !clip.paused || !$('#evidenceVoice').paused ||
  ('speechSynthesis' in window && speechSynthesis.speaking);
$('#talkCamera').addEventListener('click', e => {
  if(!S.investigate && tapGo()) return;   // a tap on the screen goes on from a detective line, the person too
  if(S.investigate || ending || talkLocked() || linesPlaying() || $('#app').classList.contains('notes-open')) return;
  const r = $(`#talkCamera .scene-npc[data-talk="${S.cur}"]`)?.getBoundingClientRect();
  if(r && e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom) return;
  leaveTalk();
});
function ask(qid){
  if(S.investigate || st().phase !== 'choose' || !availableQuestions(cur()).some(question => question.id === qid)) return;
  clearTimeout(greetingTimer);
  if(!ending) renderSay(null);   // a greeting line of the detective's is cut off
  const p = st();
  p.feedback = null;
  p.phase = 'record'; p.recording = qid;
  if(!p.order.includes(qid)) p.order.push(qid);
  hideBubble();
  // Open the current question immediately, so the player can write while listening.
  S.view = S.cur;
  noteRaised = false;
  renderDock();
  setNotes(true);
  // the detective asks the question aloud first, then the answer (user request: an answer right after the tap felt
  // abrupt). 다시 듣기 during the question goes straight to the answer; leaving the talk drops it.
  const who = S.cur;
  const turn = speechTurn + 1;   // detectiveSay starts a new turn; 다시 듣기 or leaving starts another
  detectiveSay(askAudio(who, qid), () => setTimeout(() => {
    if(turn === speechTurn && S.cur === who && !S.investigate && per(who).recording === qid) speak(cur().answers[qid], qid, who);
  }, 300), null, qs(cur()).find(question => question.id === qid).en);
}
// an action is offered while its conditions hold (when) and until what it does is done (flag)
const actionOpen = a => (a.when || []).every(cond) && !(a.flag && S.flags.has(a.flag));
// One of the person's actions: the detective asks, they answer (or the lines it has), then what it opens (inspect: the
// close look) and what it marks done (flag). A choice that is not said (say:false) starts with its lines.
function doAction(aid){
  const s = cur(), a = s.actions?.find(x => x.id === aid), who = s.id;
  if(!a || S.investigate || greetingId === who || recordLocked()) return;
  clearTimeout(greetingTimer); hideBubble();
  // the questions stay away while the action is said and answered, as in a greeting (user request: they came back at
  // once under the detective's line)
  const lines = [...(a.say === false ? [] : [{ det:true, key:`${who}-act-${aid}`, en:a.en, ko:a.ko }]), ...(a.lines || [{ key:aid, en:a.answer, ko:a.answerKo }])];
  const done = () => {
    if(greetingId !== who) return;
    setGreeting(null);
    if(a.flag && !S.flags.has(a.flag)){ S.flags.add(a.flag); saveGame(); checkThoughts(); }
    if(a.inspect && S.cur === who && !S.investigate) openInspect(a.inspect);
    else { renderAsk(); if(thoughts.length) playThought(); }
  };
  setGreeting(who); renderAsk();
  playLines(who, lines, done);
  greetingCut = linesCut(lines.reduce((t, l) => t + l.en.length * 95 + 2500, 1000), done);
}
// the close look (a place with inspect: never on the map): folded first; 〈 goes back to the person who handed it over
function openInspect(id = PLACES.find(p => p.inspect)?.id){
  if(!id) return;
  S.unfolded = false;
  if(placeOf(id).balance){ plates = [null, null]; weighFrom = 0; }
  enterPlace(id);
}
// the detective's recorded question: the picnic case keeps its lines in audio/picnic/; the library's three shared
// questions (QUESTIONS) have one file each
function askAudio(id, qid){
  if(PICNIC) return `audio/picnic/detective-${id}-${qid}.mp3`;
  if(UMBRELLA) return `audio/umbrella/detective-${id}-${qid}.mp3`;
  if(VIOLIN) return `audio/violin/detective-${id}-${qid}.mp3`;
  if(CHRISTMAS) return `audio/christmas/detective-${id}-${qid}.mp3`;
  return spk(id).questions ? `audio/detective-ask-${id}-${qid}.mp3` : `audio/detective-ask-${qid}.mp3`;
}
// 힌트: the first blank of this question that is empty or wrong gets the right word (an acorn each, 3 per case).
function useHint(){
  const p = st(), qid = p.recording;
  if(S.investigate || p.phase !== 'record' || !qid || S.view !== S.cur) return;
  if(S.hints <= 0) return toast('힌트를 다 썼어요.');
  const blank = blanksOf(S.cur, [qid]).find(b => !b.value.trim() || !isRight(b));
  if(!blank) return toast('더 채울 칸이 없어요.');
  S.hints--;
  p.notes[blank.id] = blank.ans.split('/')[0];
  p.marks[blank.id] = 'hint';
  renderDock();
}
const norm = s => s.toLowerCase().replace(/[.'’,!]/g,'').replace(/\s+/g,' ').trim().replace(/\s?pm$/,'');
function finishRecord(){
  if(S.investigate || st().phase !== 'record' || S.view !== S.cur) return;
  const p = st();
  const qid = p.recording;
  const blanks = [...document.querySelectorAll(`.nblock[data-q="${qid}"] .blank`)];
  const empty = blanks.filter(b => !b.value.trim());
  if(empty.length){ empty[0].focus(); return toast(`빈칸 ${empty.length}개가 남았어요. 모두 채워야 기록이 끝나요.`); }
  markStudyDay();
  const answers = blanksOf(S.cur, [qid]);
  recordFirst(S.cur, qid);
  const correct = answers.every(isRight);
  p.questionChecks[qid] = correct ? 'ok' : 'review';
  answers.forEach(answer => {
    if(correct) p.marks[answer.id] = 'ok';
    else if(!isRight(answer)) p.marks[answer.id] = 'review';
    else delete p.marks[answer.id];
  });
  hideBubble();
  stopVoice();
  if(!correct){
    const buzz = $('#retryBuzz');   // a low falling "bonk" and a short buzz on phones
    buzz.currentTime = 0; buzz.play().catch(() => {});
    if(navigator.userActivation?.hasBeenActive) try { navigator.vibrate?.(90); } catch(e){}
    missCheck = `${S.cur}:${qid}`;
    renderDock();
    return;
  }
  const chime = $('#correctChime');   // a short two-note chime for a question written down right
  chime.currentTime = 0; chime.play().catch(() => {});
  // no stamp thud: the ✓ 확인됨 stamp is no longer drawn (user request)
  p.recording = null;
  p.phase = qs(cur()).every(question => p.questionChecks[question.id] === 'ok') ? 'done' : 'choose';
  const beat = cur().after?.[qid] || (p.phase === 'done' && cur().after?.done);
  if(beat) beats.push({ id:S.cur, ...beat });
  checkThoughts();
  const revealed = unlock(cur().unlocks?.[qid]) || {};
  // someone named in the line just written down (answer or question) goes by their name from now on, not their animal
  // (user decision: Daisy says "Coco and Tess", Coco is asked "Who is Nico?"); one nobody names waits for their own hello
  const heard = cur().answers[qid] + ' ' + (qs(cur()).find(q => q.id === qid)?.en || '');
  (revealed.people || []).forEach(id => {
    const first = spk(id).fullName?.split(' ')[0];
    if(first && per(id) && new RegExp(`\\b${first}\\b`).test(heard)) per(id).introduced = true;
  });
  pendingPins.push(...(revealed.places || []));
  pendingPeople.push(...(revealed.people || []));
  if(p.phase === 'done') checkNotes(S.cur);
  // the checked question stays open (lines, grammar chips) until the player closes the notebook; what it
  // unlocked shows after that (closeNotes)
  p.feedback = qid;
  openPassages.add(`${S.cur}:${qid}`);
  freshCheck = `${S.cur}:${qid}`;
  noteRaised = true;   // the checked question with its passage takes the whole screen for study
  renderDock();
}
// What the header button does on the page being viewed.
function noteMode(){
  if(S.view === 'evidence' || S.view === 'memo') return null;
  const p = per(S.view);
  if(noteRaised && p.checked && !p.feedback) return 'summary';
  if(S.view === S.cur && !S.investigate && p.feedback) return 'feedback';
  if(S.view === S.cur && !S.investigate && p.phase === 'record') return 'record';
  return null;
}
const BLANK_RE = /\{\{(\w+)\|([^}]+)\}\}/g;
// Every blank on a person's page, in the order the questions were asked.
function blanksOf(id, qids = per(id).order){
  const s = spk(id), p = per(id), out = [];
  qids.forEach(qid => s.notes[qid].forEach(line => line.replace(BLANK_RE, (m, bid, ans) => {
    out.push({ qid, id:bid, ans, value:p.notes[bid] || '' }); return m;
  })));
  return out;
}
const isRight = b => b.ans.split('/').map(norm).includes(norm(b.value));
function recordFirst(id, qid){
  const p = per(id);
  const questions = qid ? [qid] : p.order;
  questions.forEach(question => {
    if(p.firstQuestions[question]) return;
    const answers = blanksOf(id, [question]), wrong = answers.filter(answer => !isRight(answer));
    p.firstQuestions[question] = {ok:answers.length - wrong.length, total:answers.length};
    Object.assign(p.firstWrong, Object.fromEntries(wrong.map(answer => [answer.id, answer.value])));
  });
  p.first = Object.values(p.firstQuestions).reduce((total, result) => ({ok:total.ok + result.ok, total:total.total + result.total}), {ok:0, total:0});
}
function checkNotes(id){
  const p = per(id);
  if(!qs(spk(id)).every(question => p.questionChecks[question.id] === 'ok')) return;
  p.feedback = null;
  p.checked = true;
}
function replayLine(ref){
  const [id, qid] = ref.split(':');

}
// Word-book playback uses a bundled pronunciation, never the sentence that taught the word.
function pronounceWord(key){
  if(!Object.prototype.hasOwnProperty.call(WORDS, key)) return;

  const voice = $('#wordVoice'), file = key.replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  voice.src = `audio/words/${file}.wav`;
  voice.preservesPitch = true;
  voice.playbackRate = S.slow ? .75 : 1;
  voice.play().catch(() => { if(turn === speechTurn) toast('발음을 재생하지 못했어요. 다시 눌러 주세요.'); });
}
// A form or an example sentence of 이번 사건의 열쇠: its bundled clip (audio/examples/<grammar>-<page>.wav for the
// form, <grammar>-<page>-<line>.wav for a sentence; the word book's local voice), never a person's recording.

// One sentence of an answer: the matching part of the recording (or that sentence by browser TTS).
function replaySentence(ref, idx){
  const [id, qid] = ref.split(':'), range = SENTENCE_TIMES[ref]?.[idx];
  if(!range) return replayLine(ref);

// Switch between the conversation view and the place view. Either can be left and resumed;
// an unfinished recording waits in the notebook until the player comes back.
function setInvestigate(on){
  clearTimeout(greetingTimer); setGreeting(null);

  closePropSay();

function wordPlacementFeedback(input, source, from){
  const sound = $('#wordPlace');
  sound.volume = .55; sound.currentTime = 0; sound.play().catch(() => {});
  if(!input.animate) return;
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  input.animate(reduced ? [
    {backgroundColor:'rgba(242,207,115,.5)'}, {backgroundColor:'transparent'}
  ] : [
    {transform:'scale(1)',backgroundColor:'rgba(242,207,115,.2)'},
    {transform:'scale(1.07)',backgroundColor:'rgba(242,207,115,.55)',offset:.45},
    {transform:'scale(1)',backgroundColor:'transparent'}

  if(reduced || !source || !from) return;
  source.getAnimations().forEach(animation => animation.cancel());
  source.animate([{transform:'scale(1)'},{transform:'scale(.92)',offset:.3},{transform:'scale(1)'}],{duration:220,easing:'ease-out'});
  const to = input.getBoundingClientRect(), ghost = document.createElement('span');

    backgroundColor:getComputedStyle(source).backgroundColor

  document.body.appendChild(ghost);
  const dx = to.left + to.width/2 - from.left - from.width/2;
  const dy = to.top + to.height/2 - from.top - from.height/2;
  const flight = ghost.animate([
    {transform:'translate(0,0) rotate(0deg) scale(1)',opacity:.95},
    {transform:`translate(${dx*.5}px,${dy*.5-16}px) rotate(-4deg) scale(.85)`,opacity:.9,offset:.5},
    {transform:`translate(${dx}px,${dy}px) rotate(0deg) scale(.55)`,opacity:0}
  ],{duration:260,easing:'cubic-bezier(.2,.7,.3,1)',fill:'forwards'});
  flight.finished.then(() => ghost.remove(), () => ghost.remove());
}

function dragStart(e){
  const w = e.target.closest('.word'); if(!w || !e.isPrimary || e.button !== 0) return;
  suppressWordClick = false;

function dragMove(e){
  if(!drag || e.pointerId !== drag.id) return;

    if(Math.hypot(e.clientX-drag.x, e.clientY-drag.y) < 6) return;

  const under = document.elementFromPoint(e.clientX, e.clientY);
  const target = under?.closest?.('.blank');

/* ---------- the caret ---------- */
// The pencil caret (.cute-caret) follows the caret of the focused 이름 or note blank: the text before it is measured in
// the field's own font, inside the field's box (centred text in the blanks, scrolled text when it overflows). It is
// placed every frame while the field has the focus, so it rides along with the notebook and the keyboard moving.
const cuteCaret = Object.assign(document.createElement('span'), { className:'cute-caret', hidden:true });
document.body.appendChild(cuteCaret);
const caretPen = document.createElement('canvas').getContext('2d');
let caretField = null, caretWas = '';
const caretTarget = el => el?.matches?.('input.blank, input.id-name') ? el : null;
document.addEventListener('focusin', e => {
  const el = caretTarget(e.target); if(!el) return;
  const idle = !caretField; caretField = el; caretWas = '';
  if(idle) requestAnimationFrame(placeCaret);
});
document.addEventListener('focusout', e => { if(e.target === caretField){ caretField = null; cuteCaret.hidden = true; } });
function placeCaret(){
  const el = caretField;
  if(!el || document.activeElement !== el){ caretField = null; cuteCaret.hidden = true; return; }
  requestAnimationFrame(placeCaret);
  const r = el.getBoundingClientRect(), k = r.width / el.offsetWidth || 1, cs = getComputedStyle(el);
  const at = el.selectionEnd ?? el.value.length;
  // a selection shows as itself; a read-only field (the stamped name) has no caret
  if(el.readOnly || el.selectionStart !== at || !r.width){ cuteCaret.hidden = true; return; }
  caretPen.font = `${cs.fontStyle} ${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
  caretPen.letterSpacing = cs.letterSpacing === 'normal' ? '0px' : cs.letterSpacing;
  const width = text => caretPen.measureText(text).width;
  const pl = parseFloat(cs.paddingLeft), pr = parseFloat(cs.paddingRight), pt = parseFloat(cs.paddingTop), pb = parseFloat(cs.paddingBottom);
  const room = el.clientWidth - pl - pr, all = width(el.value);
  const lead = cs.textAlign === 'center' && all < room ? (room - all) / 2 : cs.textAlign === 'right' || cs.textAlign === 'end' ? Math.max(0, room - all) : 0;
  const x = Math.min(Math.max(pl + lead + width(el.value.slice(0, at)) - el.scrollLeft, 1), el.clientWidth - 1);
  const size = parseFloat(cs.fontSize) * 1.1, mid = el.clientTop + pt + (el.clientHeight - pt - pb) / 2;
  const X = r.left + (el.clientLeft + x) * k, Y = r.top + mid * k;
  // hidden when the spot is covered or scrolled out of its notebook
  if(document.elementFromPoint(X, Y) !== el){ cuteCaret.hidden = true; return; }
  cuteCaret.hidden = false;
  cuteCaret.style.height = `${size * k}px`;
  cuteCaret.style.transform = `translate(${X + .5}px, ${Y - size * k / 2}px)`;   // just after the letter, not on it
  cuteCaret.style.setProperty('--caret', cs.color);
  // typing keeps it solid: the blink starts over whenever the text or the caret moves
  const now = `${el.value}|${at}`;
  if(now !== caretWas){ caretWas = now; cuteCaret.style.animation = 'none'; void cuteCaret.offsetWidth; cuteCaret.style.animation = ''; }
}

function playThought(){
  const t = thoughts.shift(); if(!t) return;
  const revealed = unlock(t.unlocks) || {};
  pendingPins.push(...(revealed.places || [])); pendingPeople.push(...(revealed.people || []));
  const after = () => { revealDiscoveries(); if(thoughts.length) playThought(); };
  // in a conversation: the detective's own bubble over the scene (violin case thoughts)
  if(!S.investigate){
    if(ending) return after();
    renderSay(detLine(t.line));
    return detectiveSay(t.line.key, () => waitTap(() => { renderSay(null); after(); }), null, t.line.en);
  }
  placeLines([t.line], after);
}
// The detective's lines over the place (where the scene and its bubble are hidden): a copy of the detective's bubble on

function placeLines(lines, onDone, n = 0){

function playBeats(){
  const beat = beats.shift(); if(!beat) return;
  let over = false, cut;
  // what it gives comes once the lines are said, or when they are cut off (the player went on); away from that person
  // by now, it still comes, without the lines

  const stage = $('.map-stage'), map = $('#map'), known = PLACES.filter(pl => S.known.has(pl.id));
  const fresh = known.filter(pl => freshPins.has(pl.id)), here = known.filter(pl => pl.id === S.place);
  const look = fresh.length ? fresh : here.length ? here : known;
  const mid = k => look.length ? look.reduce((t, pl) => t + pl[k], 0) / look.length : 50;
  stage.scrollLeft = map.offsetWidth * mid('x') / 100 - stage.clientWidth / 2;
  stage.scrollTop = map.offsetHeight * mid('y') / 100 - stage.clientHeight / 2;
}

window.addEventListener('pointermove', e => {

// Hearing a line or finding a clue can reveal places and people ({ places:[…], people:[…], names:[…] }).
// A newly known person brings their place onto the map; one only named (names) waits for their place to open.
function unlock(u){
  if(!u) return;
  let newPerson = false;
  const places = [], people = [];
  (u.places || []).forEach(id => { if(!S.known.has(id)){ S.known.add(id); places.push(id); } });
  (u.names || []).forEach(id => { if(!S.met.includes(id)){ S.met.push(id); S.named.add(id); people.push(id); newPerson = true; } });
  // quiet: there when their place opens, but not named in the notice (nameless until met)
  (u.quiet || []).forEach(id => { if(!S.met.includes(id)) S.met.push(id); });
  (u.people || []).forEach(id => {
    if(S.met.includes(id)) return;
    S.met.push(id); people.push(id); newPerson = true;
    if(!S.known.has(spk(id).place)){ S.known.add(spk(id).place); places.push(spk(id).place); }
  });
  const newPlace = places.length > 0;
  if(!newPlace && !newPerson) return {};
  renderPlaces();
  if(newPlace) setMapNew(true);
  return { newPlace, newPerson, places, people };
}

// 을/를 after an English name, by how its last word sounds in Korean: Duck(덕)·Rabbit(래빗)·Mole(몰) take 을,
// Beaver(비버)·Fox(폭스)·Ollie(올리)·Hedgehog(헤지호그) take 를
function objectJosa(name){
  const last = name.trim().split(/\s+/).pop().toLowerCase();
  if(/[ou]g$/.test(last)) return '를';   // -og, -ug end in 그 (Hedgehog, Dog, Bug)
  return /le$/.test(last) || /[bcdfghjklmnpqtvwz]$/.test(last) ? '을' : '를';

function evidenceEntry(ref){
  if(!ref) return null;
  if(isItemRef(ref)){
    const id = ref.slice(1), it = itemNow(id), c = PACK?.compare;
    // once compared, the two things' pages have that sentence too
    const more = c?.items.includes(id) && S.flags.has(c.flag) ? c.line : null;
    const audio = more && it.audio ? [it.audio, `audio/violin/detective-${more.key}.mp3`] : it.audio;
    return S.items.includes(id) ? { ref, item:true, label:it.label, place:'소지품', en:more ? `${it.en} ${more.en}` : it.en, ko:more ? `${it.ko} ${more.ko}` : it.ko, audio, photo:itemPhoto(id) } : null;
  }
  const record = S.evidence.find(item => evRef(item) === ref);
  if(!record) return null;
  const place = placeOf(record.placeId), clue = place.clues[record.clueIndex];
  return { ref, label:clue.label, place:place.label, en:clue.en, ko:clue.ko, audio:clue.audio, photo:record.photo };
}
// the notebook's evidence page holds the photos only; things carried are in 소지품 (the bottom menu's drawer)
const evidenceEntries = () => [...S.evidence].reverse().map(record => evidenceEntry(evRef(record)));

function stopDrawerAnimations(){

function openDrawer(tab = 'photo', browse = false){

function pickEvidence(ref){
  const drawer = $('#drawer'), detail = $('#drawerPick');
  const fromHeight = drawer.getBoundingClientRect().height;
  stopDrawerAnimations();
  drawerPick = ref;
  $('#drawerStrip').querySelectorAll('[data-pick]').forEach(card => card.setAttribute('aria-pressed', card.dataset.pick === ref));
  if(isSayRef(ref)){
    // a statement: who said it and what they said (their own recording again), then 내밀기
    const [id, qid] = ref.split(':');
    detail.innerHTML = `<p><b class="who-says">${esc(spk(id).name)}:</b> “${esc(spk(id).answers[qid])}”</p>${drawerTools(ref, ANSWERS_KO[id]?.[qid])}`;
  } else if(isItemRef(ref)){
    const entry = evidenceEntry(ref), id = ref.slice(1);
    detail.innerHTML = (drawerBrowse ? `<figure class="evidence-photo item-big${ITEMS[id].bag && !S.flags.has(`open:${id}`) ? ' bag-pic' : ''}" aria-hidden="true">${S.flags.has(`open:${id}`) ? entry.photo : itemCardPic(id)}</figure>` : '') +
      `<p>${esc(entry.en)}</p>${drawerTools(ref, entry.ko)}`;
  } else {
    const record = S.evidence.find(item => evRef(item) === ref), clue = placeOf(record.placeId).clues[record.clueIndex];
    detail.innerHTML = `<p>${esc(clue.en)}</p>${drawerTools(ref, clue.ko, !clue.audio)}`;
  }
  detail.hidden = false;
  detail.scrollTop = 0;
  const toHeight = drawer.getBoundingClientRect().height;
  // Animate the measured height rather than a fixed maximum: longer descriptions and rapid picks stay smooth.
  // The natural height takes over at the end, so resizing and text wrapping still work afterwards.
  if(drawer.animate && !matchMedia('(prefers-reduced-motion: reduce)').matches){
    drawerSizeAnimation = drawer.animate([{height:`${fromHeight}px`},{height:`${toHeight}px`}],
      {duration:320,easing:'cubic-bezier(.2,.8,.3,1)'});
    drawerTextAnimation = detail.animate([{opacity:0,transform:'translateY(8px)'},{opacity:1,transform:'translateY(0)'}],
      {duration:220,delay:90,fill:'backwards',easing:'ease-out'});
  }
  playPick(ref);
}
// under a picked photo or statement: its Korean (hidden), ▶ and 해석, then 내밀기

    `${ko ? '<button class="pill sm" type="button" data-drawer-ko aria-pressed="false">해석</button>' : ''}${drawerBrowse ? itemButtons(ref.slice(1)) : ''}</div>` +
    (drawerBrowse ? '' : `<button class="pill big" type="button" data-present="${ref}">${ending?.step === 'handoff' ? '건네주기' : '내밀기'}</button>`);

// A mouse can drag the strip sideways and its wheel scrolls it sideways (a finger already swipes it natively);
// a drag that moved never counts as picking the card it started on.
(strip => {
  let start = null, dragged = false;
  strip.addEventListener('pointerdown', e => {
    if(e.pointerType !== 'mouse' || e.button !== 0) return;
    start = { x:e.clientX, left:strip.scrollLeft }; dragged = false;
  });
  addEventListener('pointermove', e => {
    if(!start) return;
    const dx = e.clientX - start.x;
    if(!dragged && Math.abs(dx) > 5){ dragged = true; strip.classList.add('dragging'); }
    if(dragged) strip.scrollLeft = start.left - dx;
  });
  addEventListener('pointerup', () => { if(start){ start = null; strip.classList.remove('dragging'); } });
  strip.addEventListener('click', e => { if(dragged){ e.stopPropagation(); dragged = false; } }, true);
  strip.addEventListener('wheel', e => {
    if(Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
    strip.scrollLeft += e.deltaY; e.preventDefault();
  }, { passive:false });
})($('#drawerStrip'));
$('#drawer').addEventListener('click', e => {
  if(e.target.closest('[data-drawer-close]')) return closeDrawer();
  const tab = e.target.closest('[data-drawer-tab]');
  if(tab){ if(tab.dataset.drawerTab !== drawerTab){ stopVoice(); $('#evidenceVoice').pause(); openDrawer(tab.dataset.drawerTab); } return; }
  const again = e.target.closest('[data-pick-play]');
  if(again) return playPick(again.dataset.pickPlay);
  const ko = e.target.closest('[data-drawer-ko]');
  if(ko){ const text = $('#drawerPick .ko'); text.hidden = !text.hidden; ko.setAttribute('aria-pressed', !text.hidden); return; }
  const card = e.target.closest('[data-pick]');
  if(card) return pickEvidence(card.dataset.pick);
  const give = e.target.closest('[data-present]');
  if(give){ closeDrawer(); present(give.dataset.present); }
  // 소지품's own buttons (itemButtons): open or shut it, hold the two up together, use it here
  const opener = e.target.closest('[data-item-open]');
  if(opener){
    const id = opener.dataset.itemOpen, key = `open:${id}`;
    if(S.flags.has(key)) S.flags.delete(key); else S.flags.add(key);
    saveGame(); $('#drawerStrip').innerHTML = drawerStripHTML(); return pickEvidence(`@${id}`);
  }
  if(e.target.closest('[data-item-compare]')){
    const c = PACK.compare; S.flags.add(c.flag); saveGame(); checkThoughts(); updateAccuse();
    closeDrawer(); return detectiveSay(c.line.key, null, null, c.line.en);
  }
  const use = e.target.closest('[data-item-use]');
  if(use){ closeDrawer(); openInspect(ITEMS[use.dataset.itemUse].use.inspect); }
});

  const e = ending;

  if(e.step === 'ask') return `<button class="pill big green" type="button" data-end="ask">${esc(ENDING.script[e.si].en)}</button>`;
  if(!e.line) return '';

  if(e.step === 'call') return e.i ? '<button class="pill big" type="button" data-end="interview">심문 시작</button>' : '';
  const tools = '';   // 다시 듣기 and 해석 are in the speech bubble
  if(e.step === 'confront') return e.line === ENDING.opening ? '' : tools + `<button class="pill big green" type="button" data-end="present">증거 내밀기</button>`;

}
function endingAction(action, who){
  const e = ending; if(!e) return;
  if(action === 'ask') return scriptAsk();
  if(action === 'present'){ stopVoice(); openDrawer(); return; }
  if(action === 'give'){ stopVoice(); openDrawer('item'); return; }
  if(action === 'next') endingNext();
  if(action === 'go'){ stopVoice(); handoffOpen(); }
  if(action === 'interview') callGo();
}

// After the board, Sgt. Badger asks whether the detective has worked it out. The deduction already named Fiona, so
// the detective answers aloud without another choice, and Badger takes her to the station.
const CALL = {
  ask:{ who:'badger', key:'call1', en:'Detective! Did you find out who did it?', ko:'탐정님! 범인을 알아내셨나요?' },
  answer:id => ({ key:`call-${id}`, en:`Yes. It was ${spk(id).name}.`, ko:`응. ${spk(id).ko}야.` }),
  go:id => ({ who:'badger', key:`call2-${id}`, en:`${spk(id).name}? Then let's bring ${id === 'ray' ? 'him' : 'her'} to the station.`, ko:`${spk(id).ko}요? 그럼 파출소로 데려가요.` })
};
function startCall(){
  ending = { step:'call', i:0, returnPlace:S.place || cur().place };
  $('#app').classList.add('ending');
  endingSay(CALL.ask, undefined, () => {
    endTimer = setTimeout(() => { if(ending?.step === 'call' && !ending.answering) callAnswer(); }, 500);
  });

function callAnswer(){
  if(ending?.step !== 'call' || ending.answering) return;
  clearTimeout(endTimer);
  ending.answering = true; ending.line = null; ending.lineDone = null; renderAsk();
  const id = CULPRIT;
  const name = detectiveName(), line = CALL.answer(id);
  renderSay({ ...line, name:name ? `Detective ${name}` : 'Detective', det:true });
  const go = () => { if(ending?.step === 'call'){ ending.i = 1; ending.ready = performance.now() + 600; endingSay(CALL.go(id)); } };
  detectiveSay(line.key, () => { endTimer = setTimeout(go, 500); });
}
function callGo(){
  if(ending?.step !== 'call' || !ending.i || performance.now() < ending.ready) return;
  accusedId = CULPRIT;
  startEnding();
}
/* The violin case's questioning (ENDING.script, design 9절): in the waiting room with the officer beside them. The
   detective's questions (ask: the player picks the one question), lines said in turn, and Owen's claims (claim) answered
   from the drawer with a statement or a thing (accept: then the lines it leads to, hit; a wrong one: his answer and the
   same claim again). Each claim answered fills the gauge (ENDING.confront). Then the violin back to Tara (handoff); a
   questioning heard to its end is not asked again. */
function startScript(){
  if(S.flags.has('confessed')) return startHandoff();
  // a questioning waiting at a place (scene): back to it, or on once what it waits for is found
  if(S.scriptPause){ if(ENDING.script[S.scriptPause.si].until.every(cond)) return resumeScript(); return enterPlace(ENDING.script[S.scriptPause.si].scene); }
  accusedId = PACK.accused;
  ending = { step:'say', script:true, si:0, returnPlace:S.place || cur().place };
  endingRound = 0; S.mood = {};
  // the officer beside them from the start (violin case), or coming in the middle (lateJoin: a step's join)
  S.visit = PACK.lateJoin ? {} : { badger:{ place:spk(accusedId).place, ...NPC_POSITIONS.badger } };
  if(!PACK.lateJoin && !S.met.includes('badger')){ S.met.push('badger'); ending.joined = 'badger'; }
  $('#app').classList.add('ending');
  endingFocus(accusedId); renderInterrogationGauge();
  scriptLines(ENDING.intro, () => scriptGo(0));
}
// lines in turn: the detective's in their bubble, the others' by them (mood: their face from then on)
function scriptLines(lines, onDone, i = 0){
  if(!ending?.script) return;
  const line = lines[i];
  if(!line) return onDone();
  let went = false;
  const next = () => { if(went) return; went = true; endTimer = setTimeout(() => scriptLines(lines, onDone, i + 1), 500); };
  if(!line.det) return endingSay(line, line.mood, next);
  clearTimeout(endTimer);
  ending.line = detLine(line); ending.lineDone = next;
  renderSay(ending.line); renderAsk();
  endTimer = setTimeout(() => detectiveSay(line.key, next, null, line.en), 400);
}
function scriptGo(i){
  if(!ending?.script) return;
  clearTimeout(endTimer);
  ending.si = i;
  const item = ENDING.script[i];
  if(!item) return scriptEnd();
  if(item.ask){ Object.assign(ending, { step:'ask', line:null, lineDone:null }); renderSay(null); endingFocus(accusedId); return renderAsk(); }
  if(item.scene) return pauseScript(i);
  if(item.flag && !S.flags.has(item.flag)){ S.flags.add(item.flag); saveGame(); }
  // they come to where the questioning is and stay until the end (gone: once the accused owns up)
  (item.join || []).forEach(id => {
    S.visit[id] = { place:spk(accusedId).place, ...PACK.joinPositions[id], gone:['!confessed'] };
    if(!S.met.includes(id)) S.met.push(id);
  });
  if(item.join) renderScene(placeIdOf(accusedId));
  ending.step = 'say';
  scriptLines(item.lines, () => {
    if(!item.claim) return scriptGo(i + 1);
    ending.step = 'confront'; renderAsk(); renderInterrogationGauge();
  });
}
// The questioning waits (scene): the place itself, to look, take and photograph as anywhere; the map is open. Once what
// it waits for is found (until) and the notebook is put away, it goes on from the next step, the gauge where it was.
function pauseScript(i){
  const item = ENDING.script[i];
  S.scriptPause = { si:i, round:endingRound }; saveGame();
  if(item.until.every(cond)) return resumeScript();   // found already (a preview with everything collected)
  clearTimeout(endTimer); stopVoice(); renderSay(null);
  ending = null; $('#app').classList.remove('ending'); renderInterrogationGauge();
  enterPlace(item.scene, true);
}
function resumeScript(){
  const { si, round } = S.scriptPause;
  delete S.scriptPause;
  accusedId = PACK.accused;
  ending = { step:'say', script:true, si, returnPlace:ENDING.script[si].scene };
  endingRound = round;
  $('#app').classList.add('ending');
  endingFocus(accusedId); renderInterrogationGauge();
  scriptGo(si + 1);
}
const scriptResumeDue = () => !!S.scriptPause && !ending && ENDING.script[S.scriptPause.si].until.every(cond);
function scriptAsk(){
  const item = ENDING.script[ending?.si];
  if(ending?.step !== 'ask' || !item?.ask) return;
  ending.step = 'say';
  scriptLines([{ det:true, key:item.key, en:item.en, ko:item.ko }], () => scriptGo(ending.si + 1));
}
// what is held up: a statement (who said it, what was written down) or a photo or thing
function presentFigure(ref){
  if(!isSayRef(ref)) return `<figure>${evidenceEntry(ref)?.photo || ''}</figure>`;
  const [id, qid] = ref.split(':');
  return `<figure class="say"><span class="who">${sayFace(id)}${esc(spk(id).name)}</span><p>${esc(writtenText(id, qid))}</p></figure>`;
}
function scriptPresent(ref){
  if(ending?.step !== 'confront') return;
  const item = ENDING.script[ending.si], right = item.accept.includes(ref);
  clearTimeout(endTimer); stopVoice(); setNotes(false); renderDock(); renderSay(null);
  ending.step = 'say'; ending.line = null; renderAsk();
  const shot = document.createElement('div');
  shot.className = `presented ${right ? 'hit' : 'miss'}`;
  shot.innerHTML = presentFigure(ref) + (right ? '<span class="contra">모순!</span>' : '');
  $('.scene').appendChild(shot);
  $('#backTab').disabled = true;
  setTimeout(() => {
    if(!ending?.script) return;
    const sound = $(right ? '#correctChime' : '#retryBuzz'); sound.currentTime = 0; sound.play().catch(() => {});
    if(!right) return;
    stampSound();
    const scene = $('.scene'), npc = $(`#talkCamera .scene-npc[data-talk="${accusedId}"]`);
    scene.classList.remove('jolt'); npc?.classList.remove('flinch'); void scene.offsetWidth;
    scene.classList.add('jolt'); npc?.classList.add('flinch');
    updateInterrogationGauge(++endingRound, 'hit');
  }, 480);
  setTimeout(() => { shot.remove(); $('.scene').classList.remove('jolt'); if(ending?.script) renderInterrogationGauge(); }, 1300);
  endTimer = setTimeout(() => {
    if(!ending?.script) return;
    if(!right) return scriptLines([item.miss || ENDING.miss], () => { endTimer = setTimeout(() => scriptGo(ending.si), 700); });
    scriptLines(item.hit, () => scriptGo(ending.si + 1));
  }, 1300);
}
function scriptEnd(){
  S.flags.add('confessed'); saveGame();
  renderScene(placeIdOf(accusedId));   // someone taken away on owning up (gone) leaves the scene
  Object.assign(ending, { script:false, round:S.handoffRound || 0 });
  endingRound = 0; renderInterrogationGauge();
  handoffGo();
}
function startEnding(){

function requestLeaveInterrogation(){
  if(!ending || (!ending.script && (ending.step !== 'confront' || !ending.line)) || $('.presented')) return;

function liveStats(){
  const people = S.met.filter(id => per(id).order.length);
  people.forEach(id => recordFirst(id));
  const ok = people.reduce((n, id) => n + per(id).first.ok, 0), total = people.reduce((n, id) => n + per(id).first.total, 0);
  const rate = total ? ok / total : 0, stars = rate >= .9 ? 3 : rate >= .7 ? 2 : 1;
  const missed = people.flatMap(id => Object.entries(per(id).firstQuestions).filter(([, r]) => r.ok < r.total).map(([qid]) => `${id}:${qid}`));

    const [id, qid] = ref.split(':'), first = per(id).firstWrong;
    return [ref, Object.fromEntries(blanksOf(id, [qid]).filter(b => b.id in first).map(b => [b.id, first[b.id]]))];
  }));

  const width = height * (pl.artHeight || 600) / (pl.artWidth || 900) * (sprite ? sprite.w / sprite.h : .5);

/* ---------- snow ----------
   A place with snow:true (the Christmas square and the sleigh; the storeroom and the tent are indoors) has soft
   round flakes falling over its picture, in the place view and in conversation and the ending alike (user request).
   They fall in screen space, so the camera's moves never drag them; few and slow, so clues stay easy to see. Big near
   flakes are softer and quicker, small far ones crisper and slower; each sways a little as it falls. Off with reduced
   motion. Drawn on the canvas over whichever view is showing (#snowInv, #snowTalk); the loop stops when no snow shows. */
let snowOn = false, snowFrame = 0, snowFlakes = [], snowLast = 0;
const snowSprites = [1.8, 2.8, 4, 5.4].map((r, i) => {
  // drawn at twice the size; the edge fades out over nearly as far again as the flake itself (user request: blurrier
  // edges), the nearest flakes softest
  const rr = r * 2, out = rr * (i > 2 ? 2.1 : 1.8), c = document.createElement('canvas'), size = Math.ceil(out + 2) * 2;
  c.width = c.height = size;
  const g = c.getContext('2d'), m = size / 2;
  const grad = g.createRadialGradient(m, m, 0, m, m, out);
  // a faint grey-blue in the fade keeps them seen over the white snow on the ground
  grad.addColorStop(0, 'rgba(255,252,244,1)'); grad.addColorStop(i > 2 ? .16 : .26, 'rgba(255,252,244,.95)');
  grad.addColorStop(.5, 'rgba(250,250,248,.58)'); grad.addColorStop(.74, 'rgba(196,205,220,.24)'); grad.addColorStop(1, 'rgba(196,205,220,0)');
  g.fillStyle = grad; g.beginPath(); g.arc(m, m, out, 0, Math.PI * 2); g.fill();
  return { c, r, size:size / 4, speed:[16, 24, 34, 46][i], alpha:[.8, .88, .92, .85][i] };
});
function snowFlake(w, h, anywhere){
  const kind = snowSprites[Math.random() < .45 ? 0 : Math.random() < .55 ? 1 : Math.random() < .6 ? 2 : 3];
  return { kind, x:Math.random() * w, y:anywhere ? Math.random() * h : -kind.size, phase:Math.random() * Math.PI * 2,
    sway:6 + Math.random() * 12, swaySpeed:.4 + Math.random() * .6, speed:kind.speed * (.8 + Math.random() * .4) };
}
function snowFor(pl){
  const on = !!pl?.snow && !matchMedia('(prefers-reduced-motion: reduce)').matches;
  $('#snowInv').classList.toggle('on', on); $('#snowTalk').classList.toggle('on', on);
  if(on === snowOn) return;
  snowOn = on; snowFlakes = [];
  if(on){ snowLast = 0; snowFrame = requestAnimationFrame(snowTick); }
  else { cancelAnimationFrame(snowFrame); document.querySelectorAll('.snow').forEach(c => c.getContext('2d').clearRect(0, 0, c.width, c.height)); }
}
function snowTick(now){
  if(!snowOn) return;
  snowFrame = requestAnimationFrame(snowTick);
  const canvas = S.investigate ? $('#snowInv') : $('#snowTalk'), w = canvas.clientWidth, h = canvas.clientHeight;
  if(!w || !h) return;
  const dpr = Math.min(2, devicePixelRatio || 1);
  if(canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)){ canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr); }
  const dt = snowLast ? Math.min(.05, (now - snowLast) / 1000) : 0; snowLast = now;
  // about one flake for every 5000 px² of the view: a light snowfall
  const want = Math.round(w * h / 5000);
  while(snowFlakes.length < want) snowFlakes.push(snowFlake(w, h, true));
  if(snowFlakes.length > want) snowFlakes.length = want;
  const g = canvas.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, w, h);
  snowFlakes.forEach((f, i) => {
    f.y += f.speed * dt; f.phase += f.swaySpeed * dt;
    if(f.y - f.kind.size > h){ snowFlakes[i] = f = snowFlake(w, h); }
    const x = f.x + Math.sin(f.phase) * f.sway, k = f.kind;
    g.globalAlpha = k.alpha; g.drawImage(k.c, x - k.size, f.y - k.size, k.size * 2, k.size * 2);
  });
  g.globalAlpha = 1;
}

function evidencePhoto(place, clueIndex){
  const spot = place.spots.find(item => item.clue === clueIndex);
  if(spot.photo){

    const crop = spot.photo, was = S.unfolded;

    S.unfolded = was;
    return `<svg viewBox="${crop.x} ${crop.y} ${crop.w} ${crop.h}" aria-hidden="true">${art}</svg>`;
  }
  const artWidth = place.artWidth || 900, artHeight = place.artHeight || 600;
  const height = Math.min(artHeight, Math.max(spot.h * artHeight / 100 * 1.12, spot.w * artWidth / 100 * .84, 120));

  const left = Math.max(0, Math.min(artWidth - width, (spot.x + spot.w / 2) * artWidth / 100 - width / 2));
  const top = Math.max(0, Math.min(artHeight - height, (spot.y + spot.h / 2) * artHeight / 100 - height / 2));

function peekAt(p){
  const svg = $('#art svg'); if(!svg) return;
  svg.querySelectorAll('.peek').forEach(n => n.remove());
  const img = document.createElementNS('http://www.w3.org/2000/svg', 'image');
  img.setAttribute('class', 'peek'); img.setAttribute('href', (p.img.includes('/') ? '' : 'assets/places/christmas/') + p.img);
  ['x', 'y', 'width', 'height'].forEach((k, n) => img.setAttribute(k, [p.x, p.y, p.w, p.h][n]));
  svg.appendChild(img); setTimeout(() => img.remove(), 1800);
}
// an ordinary object: only the detective's sentence, no photo. The sentence also shows in a small bubble under the
// thing (over it when the thing is low), with 다시 듣기 and 해석 (user pick A); it goes 2 s after the voice ends (not
// while 해석 is open), or at once with a touch anywhere else, a swipe, or another view
let propSay = null, propSayTimer = 0;
function closePropSay(){ clearTimeout(propSayTimer); propSay?.remove(); propSay = null; }
function sayProp(clue, spot){
  cancelCapture();
  stopVoice();
  closePropSay();
  const voice = $('#evidenceVoice');
  const later = ms => { clearTimeout(propSayTimer); propSayTimer = setTimeout(() => { if(propSay?.querySelector('.say-ko')?.hidden !== false) closePropSay(); }, ms); };
  const play = () => {
    clearTimeout(propSayTimer);
    if(!clue.audio){ if(PACK?.silent) readOut(clue.en, () => later(2000)); else later(4000); return; }
    if(!voice.src.endsWith(clue.audio)) voice.src = clue.audio;
    voice.preservesPitch = true; voice.playbackRate = S.slow ? .75 : 1;
    voice.currentTime = 0;
    voice.addEventListener('ended', () => { if(b === propSay) later(2000); }, { once:true });
    voice.play().catch(() => later(4000));
  };
  const stage = $('.art-stage'), b = document.createElement('div');
  if(spot && stage){
    b.className = 'bubble say det prop-say'; b.setAttribute('role', 'status');
    b.innerHTML = `<img class="say-face" src="assets/ui/icons-v2/detective.png" alt=""><div class="bubble-copy"><span class="say-en">${esc(clue.en)}</span>` +
      (clue.ko ? `<span class="say-ko" hidden>${esc(clue.ko)}</span>` : '') + '</div><span class="say-foot">' +
      (clue.audio ? '<button class="play-btn" type="button" data-prop-again aria-label="다시 듣기"></button>' : '') +
      (clue.ko ? '<button class="pill sm" type="button" data-prop-ko aria-pressed="false">해석</button>' : '') + '</span>';
    b.style.visibility = 'hidden';
    stage.appendChild(b);
    // under the thing; over it when there is no room above the buttons at the bottom (추리하기); the tail points at it
    const st = stage.getBoundingClientRect(), s = spot.getBoundingClientRect(), bw = b.offsetWidth, bh = b.offsetHeight;
    const cx = Math.min(Math.max(s.left + s.width / 2, st.left + 16), st.right - 16) - st.left;
    const room = st.height - (stage.querySelector('.accuse-foot:not([hidden])') ? 96 : 24);
    let top = s.bottom - st.top + 20, above = top + bh > room;
    if(above) top = Math.max(8, s.top - st.top - bh - 20);
    const left = Math.min(Math.max(cx - bw / 2, 10), st.width - bw - 10);
    b.classList.toggle('above', above);
    b.style.cssText = `--px:${left}px;--py:${top}px;--tx:${Math.min(Math.max(cx - left, 28), bw - 28)}px`;
    b.addEventListener('click', e => {
      if(e.target.closest('[data-prop-again]')){ stopVoice(); play(); return; }
      const ko = e.target.closest('[data-prop-ko]'); if(!ko) return;
      const text = b.querySelector('.say-ko'); text.hidden = !text.hidden; ko.setAttribute('aria-pressed', !text.hidden);
      if(text.hidden && voice.paused) later(2000); else clearTimeout(propSayTimer);
    });
    propSay = b;
  }
  play();
}
// a touch anywhere but on the bubble, or a swipe of the place, takes it away
addEventListener('pointerdown', e => { if(propSay && !e.target.closest('.prop-say')) closePropSay(); }, { capture:true });
// a spot is there while its conditions hold (when) and none of its unless does
const spotOn = s => (s.when || []).every(cond) && !(s.unless || []).some(cond) &&
  (s.box === undefined || !plates.includes(s.box)) && (s.plate === undefined || plates[s.plate] !== null);   // the scale's boxes (WEIGH)
// A thing picked up where it lies (take, violin case: no photo): the detective's lines over the place, then it goes into
// 소지품 ('!flag' instead: only marks it done, the curtain drawn aside), and any thought now due
function takeFromPlace(pl, i){
  const clue = pl.clues[i];
  if($('.art-stage .think-place')) return;   // already saying something here
  cancelCapture(); stopVoice();
  S.found[pl.id].add(i);
  placeLines(clue.lines || [], () => {
    if(clue.take.startsWith('!')) S.flags.add(clue.take.slice(1));
    else if(!S.items.includes(clue.take) && !S.flags.has(`took:${clue.take}`)){ S.items.push(clue.take); S.flags.add(`took:${clue.take}`); gotItem(); }
    if(clue.flag) S.flags.add(clue.flag);
    saveGame(); renderScene(); renderSceneHead(); renderPlaces(); updateAccuse();
    checkThoughts(); if(thoughts.length) setTimeout(playThought, 2600);
  });
}
function examine(i, spot){
  const pl = placeObj();
  if(pl.balance) return weighTap(pl.clues[i]);
  if(pl.clues[i].inspect) return openInspect(pl.clues[i].inspect);
  if(pl.clues[i].take) return takeFromPlace(pl, i);
  if(pl.clues[i].prop){ sayProp(pl.clues[i], spot); if(pl.clues[i].peek) peekAt(pl.clues[i].peek); return; }
  const fresh = !S.found[pl.id].has(i);
  S.found[pl.id].add(i);
  if(fresh){
    const revealed = unlock(pl.clues[i].unlocks) || {};
    pendingPins.push(...(revealed.places || []));
    pendingPeople.push(...(revealed.people || []));
    // photos that mean something together (PACK.together): once all are found, the detective's thought comes when the
    // notebook is put away, then what they lead to
    (PACK?.together || []).forEach((t, n) => {
      const found = ref => { const at = ref.lastIndexOf('-'); return S.found[ref.slice(0, at)]?.has(+ref.slice(at + 1)); };
      if((S.together ||= []).includes(n) || !t.refs.every(found)) return;
      S.together.push(n); thoughts.push(t);
    });
  }
  renderSceneHead(); renderPlaces();
  if(!S.evidence.some(item => item.placeId === pl.id && item.clueIndex === i)) captureEvidence(pl, i);
  else {
    S.view = 'evidence'; setNotes(true);
    evidenceOpen = `${pl.id}-${i}`; renderDock(); playEvidence(evidenceOpen);
  }
}

// mouse drag pans the illustration (touch uses native scrolling); a drag never counts as a tap
const artWrap = $('#artWrap');
let pan = null, panMoved = false;
artWrap.addEventListener('pointerdown', e => {
  $('#swipeHint').hidden = true;
  if(e.pointerType === 'mouse') pan = { x:e.clientX, s:artWrap.scrollLeft, moved:false };
});
window.addEventListener('pointermove', e => {
  if(!pan) return;
  const dx = e.clientX - pan.x;
  if(Math.abs(dx) > 5) pan.moved = true;
  if(pan.moved) artWrap.scrollLeft = pan.s - dx;
});
window.addEventListener('pointerup', () => { if(pan){ panMoved = pan.moved; pan = null; } });
artWrap.addEventListener('wheel', e => {
  if(Math.abs(e.deltaY) > Math.abs(e.deltaX)){ artWrap.scrollLeft += e.deltaY; e.preventDefault(); }
  $('#swipeHint').hidden = true;
}, { passive:false });

$('#art').addEventListener('click', e => {
  if(panMoved){ panMoved = false; return; }
  if(!placeObj()) return;
  const npc = e.target.closest('[data-talk]');
  if(npc){ talkTo(npc.dataset.talk); return; }
  const r = $('#art').getBoundingClientRect();
  const spot = e.target.closest('.spot');
  let x = e.clientX - r.left, y = e.clientY - r.top;
  if(spot && e.detail === 0){ const b = spot.getBoundingClientRect(); x = b.left - r.left + b.width / 2; y = b.top - r.top + b.height / 2; }
  if(spot){ spot.classList.add('found'); examine(+spot.dataset.clue, spot); }
  else tapFx(x, y, 'miss', 'Nothing here.');
});

// The nudge: after NUDGE_AFTER ms with no touch, key or wheel, while a place is showing and nothing covers it (no
// notebook, map, drawer, pop-up or tutorial: the head point must be the person's own), the first person there who
// still has questions (phase not 'done') gets the ! (.nudge). Any input takes it away and starts the count again.
const NUDGE_AFTER = 8000;
let lastInput = Date.now();
function clearNudge(){ document.querySelectorAll('#art .nudge').forEach(n => n.remove()); }
['pointerdown', 'keydown', 'wheel'].forEach(type => addEventListener(type, () => { lastInput = Date.now(); clearNudge(); }, { capture:true, passive:true }));
setInterval(function nudgeTick(){
  if(Date.now() - lastInput < NUDGE_AFTER || !S.investigate || ending || document.hidden || $('#art .nudge')) return;
  const npc = [...$('#art').querySelectorAll('.scene-npc')].find(b => {
    if(per(b.dataset.talk).phase === 'done') return false;
    const r = b.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height * .25;
    return x > 0 && x < innerWidth && document.elementFromPoint(x, y)?.closest('.scene-npc') === b;
  });
  if(npc) npc.insertAdjacentHTML('beforeend', '<img class="nudge" src="assets/ui/nudge-bang.png" alt="">');
}, 1000);

// the place view's scroll that puts a person in the middle (user: after Sgt. Badger, the view stopped part way to Ella)
let sceneFocus = null;
const sceneLeftFor = id => $('#art').offsetWidth * positionOf(id).x / 100 - artWrap.clientWidth / 2;
function enterPlace(id, fromConversation = false){
  if(!S.known.has(id) && !(fromConversation && id === cur().place) && !placeOf(id)?.inspect) return;
  const fromRect = !S.investigate && id === cur().place ? $('#art').getBoundingClientRect() : null;
  cameraMotion?.cancel();
  if(drawerBrowse) closeDrawer();
  $('#accuseFoot').hidden = true;   // updateAccuse() once the place is in (never over a close look)
  if(!S.investigate) setInvestigate(true);
  S.place = id;
  openSheet(null); setNotes(false);
  const art = $('#art');
  artWrap.appendChild(art);
  art.inert = false;
  art.removeAttribute('aria-hidden');
  art.style.transform = 'none';
  renderSceneHead(); renderScene(); updateAccuse();
  requestAnimationFrame(() => {
    if(!S.investigate || S.place !== id) return;
    // someone just met here (revealDiscoveries) is put in the middle; else where the player left the place
    artWrap.scrollLeft = sceneFocus ? sceneLeftFor(sceneFocus) : sceneScroll[id] ?? (artWrap.scrollWidth - artWrap.clientWidth) / 2;
    sceneFocus = null;
    $('#swipeHint').hidden = artWrap.scrollWidth <= artWrap.clientWidth + 4;
    if(fromRect?.width){
      const bounds = art.getBoundingClientRect();
      animateCamera(art, `translate(${fromRect.left - bounds.left}px, ${fromRect.top - bounds.top}px) scale(${fromRect.width / bounds.width})`, 'none');
    }
  });
}
// The interrogation's evidence found so far: a step of ENDING.confront counts once any photo it accepts is found.
// Only steps a photo answers (user decision: a statement comes anyway, every talk has to be finished): the library's
// Mrs. Bear step is left out, 4. The picnic case has no interrogation, so no chip.
function evidenceNeed(){
  if(!ENDING.confront || PACK?.hideEvidenceCount) return { got:0, of:0 };
  const steps = ENDING.confront.filter(step => step.accept.some(key => !isSayRef(key)));
  const found = key => { if(isSayRef(key)) return false; const at = key.lastIndexOf('-'); return !!S.found[key.slice(0, at)]?.has(+key.slice(at + 1)); };
  return { got:steps.filter(step => step.accept.some(found)).length, of:steps.length };
}
let evShown = null;
function renderSceneHead(){
  const pl = placeObj(), { got, of } = evidenceNeed(), chip = $('#evCount');
  $('#sceneTitle').textContent = pl ? pl.label : '';
  $('#foldFoot').hidden = !(S.investigate && pl?.inspect && pl.spots.some(s => s.folded || s.open));
  $('#foldBtn').textContent = S.unfolded ? '접기' : '펼치기';
  chip.innerHTML = `<img src="assets/ui/icons/magnifier.png" alt="">${got} <small>/ ${of}</small>`;
  chip.setAttribute('aria-label', `심문 증거 ${of}개 중 ${got}개`);
  chip.classList.toggle('all', got === of);
  chip.hidden = !of;
  if(evShown !== null && got > evShown){ chip.classList.remove('bump'); void chip.offsetWidth; chip.classList.add('bump'); }
  evShown = got;
}
$('#evCount').addEventListener('click', () => { S.view = 'evidence'; evidenceOpen = null; setNotes(true); renderDock(); });

// The text with each grammar's words turned into a link to its card (overlapping words: the first one wins).
function markGrammar(text, items = []){
  const ranges = items.map(([g, words]) => ({ g, at:text.indexOf(words), len:words.length })).filter(r => r.at >= 0).sort((a, b) => a.at - b.at);
  let html = '', last = 0;
  let i = 0;
  ranges.forEach(r => {
    if(r.at < last) return;
    html += esc(text.slice(last, r.at)) + `<button class="gmark" type="button" data-grammar="${r.g}" data-words="${esc(text.substr(r.at, r.len))}" style="--i:${i++}">${esc(text.substr(r.at, r.len))}</button>`;
    last = r.at + r.len;

}
