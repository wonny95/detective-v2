      m2:"Ray Raccoon came at seven thirty to borrow a music book. And Rosie Rabbit came at seven to return a book about stars.",
      m3:"Last week, he wrote that Fiona Fox's pies were too sweet. Fiona was very angry about it."
    },
    notes:{
      m1:["She came back at {{a|9 PM/9/nine}} to lock the door.","The big {{b|clock}} was not ticking."],
      m2:["{{c|Ray Raccoon/ray raccoon}} came at 7:30 to borrow a {{d|music}} book.","{{e|Rosie Rabbit/rosie rabbit}} came at {{f|7 PM/7/seven}} to return a book about {{g|stars}}."],
      m3:["Hoot wrote that {{h|Fiona Fox/fiona fox}}'s pies were too {{i|sweet}}.","Fiona was very {{j|angry}}."]
    },
    bank:{
      m1:['8 PM','9 PM','10 PM','clock','door','window'],
      m2:['Ray Raccoon','Rosie Rabbit','Mr. Duck','music','cooking','7 PM','8 PM','stars','flowers'],
      m3:['Fiona Fox','Mrs. Bear','sweet','salty','angry','happy']
    }
  },
  fiona: { id:'fiona', name:'Fiona Fox', ko:'여우 피오나', job:'빵집 주인', place:'bakery', pitch:1.15, voice:0, bg:'#F8D9C6',
    hello:"Good evening, detective. I'm Fiona. Please, make it quick. I have pies to bake.",
    // recorded voice (Higgsfield · MiniMax · Petra). People without clips fall back to browser TTS.
    audio:{ hello:'audio/fiona-hello.mp3', q1:'audio/fiona-q1.mp3', q2:'audio/fiona-q2.mp3', q3:'audio/fiona-q3.mp3',
      // ending (user-made, Petra with emotion): the confrontation, a wrong photo, the confession
      end3:'audio/fiona-end3.mp3', end4:'audio/fiona-end4.mp3', endMiss:'audio/fiona-endMiss.mp3',
      confess1:'audio/fiona-confess1.mp3', confess2:'audio/fiona-confess2.mp3', confess3:'audio/fiona-confess3.mp3' },
    unlocks:{ q1:{ places:['bakery'] } },
    answers:{
      q1:"I was at my bakery all evening, from seven to ten. I was baking blueberry pies for the festival tomorrow.",
      q2:"Of course! Mrs. Bear came in to buy bread at eight thirty. You can ask her.",
      q3:"He came to my bakery every morning. But last week, he said my pies were too sweet. I was a little upset, that's all."
    },
    notes:{
      q1:["Fiona was at the {{a|bakery}} from {{b|7 PM/7/seven}} to {{c|10 PM/10/ten}}.","She was baking {{d|blueberry pies/blueberry pie}}."],
      q2:["{{e|Mrs. Bear/mrs bear}} came to buy bread at {{f|8:30/eight thirty}}."],
      q3:["Hoot came to her bakery every {{g|morning}}.","He said her pies were too {{h|sweet}}. She was {{i|upset}}."]
    },
    bank:{
      q1:['bakery','library','7 PM','9 PM','10 PM','blueberry pies','apple cakes'],
      q2:['Mrs. Bear','Mr. Duck','8:30','8:40','9:30'],
      q3:['morning','night','sweet','salty','upset','happy']
    }
  },
  ray: { id:'ray', name:'Ray Raccoon', ko:'너구리 레이', job:'기타리스트', place:'cafe', pitch:.85, voice:1, bg:'#DDE3EE',
    hello:"Hey, detective. I'm Ray. I didn't do anything, okay?",
    audio:{ hello:'audio/ray-hello.mp3', q1:'audio/ray-q1.mp3', q2:'audio/ray-q2.mp3', q3:'audio/ray-q3.mp3' },
    unlocks:{ q1:{ places:['cafe'] }, q2:{ people:['duck'] } },
    answers:{
      q1:"I was at the Lake Cafe. I played my guitar on stage from eight to nine thirty.",
      q2:"The whole cafe saw me! Ask Mr. Duck. He owns the cafe.",

const clip = new Audio();
clip.preload = 'auto';
clip.onplaying = () => setTalking(true);
clip.onended = clip.onpause = clip.onwaiting = clip.onerror = () => setTalking(false);
function stopVoice(){
  speechTurn++;
  clearTimeout(talkT);
  clip.pause();
  $('#evidenceVoice').pause();
  if('speechSynthesis' in window) speechSynthesis.cancel();
  setTalking(false);
}
const blobSrc = {};
const seekableSrc = src => blobSrc[src] ||= fetch(src).then(r => r.ok ? r.blob() : Promise.reject()).then(b => URL.createObjectURL(b)).catch(() => src);
// onDone runs once the line has finished (not when it is cut off by another line or stopVoice).
// range: [start, end] seconds of the recording to play (one sentence); it never calls onDone.
function speak(text, key, who = S.cur, onDone, range){
  stopVoice();
  const turn = speechTurn;
  talker = who;
  const done = () => { if(turn === speechTurn) onDone?.(); };
  const length = text.length * (S.slow ? 95 : 70) + 500;
  const src = spk(who).audio?.[key];
  if(src){
    const play = url => {
      if(turn !== speechTurn) return;
      clip.src = url;
      clip.preservesPitch = true;
      clip.playbackRate = S.slow ? .75 : 1;
      clip.addEventListener('ended', done, { once:true });
      clip.play().catch(() => { if(turn === speechTurn){ setTalking(false); toast('음성을 재생하지 못했어요. 다시 듣기를 눌러 주세요.'); done(); } });
    };
    // one sentence: a media fragment on an in-memory copy, which can always seek (a plain file URL can only
    // when the server answers range requests)
    if(range) seekableSrc(src).then(url => {
      play(`${url}#t=${range[0]},${range[1]}`);
      // the fragment end is only checked a few times a second; stop right at the end so the next sentence never leaks in
      const watch = setInterval(() => {
        if(turn !== speechTurn) return clearInterval(watch);
        if(clip.currentTime >= range[1] - .02){ clip.pause(); clearInterval(watch); }
      }, 15);
    });
    else play(src);
    return;
  }
  // No recording: browser TTS. If it never starts (no voices, e.g. inside an app preview), the person
  // still moves their mouth for about as long as the line would take, so the scene reads as speech.
  const mime = () => {
    if(turn !== speechTurn) return;
    setTalking(true);
    clearTimeout(talkT);
    talkT = setTimeout(() => { if(turn === speechTurn){ setTalking(false); done(); } }, length);
  };
  if(!('speechSynthesis' in window)){ mime(); return; }
  const s = spk(who);
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US'; u.rate = S.slow ? .72 : .95; u.pitch = s.pitch;
  if(voices.length) u.voice = voices[s.voice % voices.length];
  let started = false;
  u.onstart = u.onresume = () => {
    started = true;
    if(turn !== speechTurn) return;
    setTalking(true);
    clearTimeout(talkT);
    talkT = setTimeout(() => { if(turn === speechTurn) setTalking(false); }, length + 300);
  };
  u.onend = () => { if(turn === speechTurn){ setTalking(false); clearTimeout(talkT); done(); } };
  u.onerror = u.onpause = () => { if(turn === speechTurn){ setTalking(false); clearTimeout(talkT); } };
  speechSynthesis.speak(u);
  setTimeout(() => { if(!started) mime(); }, 700);
}

function animateCamera(art, from, to){
  cameraMotion?.cancel();
  art.style.transform = to;
  if(from && !matchMedia('(prefers-reduced-motion: reduce)').matches){
    cameraMotion = art.animate([{transform:from}, {transform:to}], {duration:650, easing:'cubic-bezier(.22,.7,.25,1)'});
    cameraMotion.onfinish = () => { if(!S.investigate) focusCamera(); };
  }

// fromRect: the NPC's on-screen rect when coming from the place view. glide: move from the
// current framing (the note opened or closed).
function focusCamera(fromRect, glide = false){
  if(S.investigate) return;
  const subject = discoveryPerson || S.cur;
  const viewport = $('#talkCamera'), art = $('#art'), place = placeOf(placeIdOf(subject));
  const width = viewport.clientWidth, height = viewport.clientHeight;
  if(!width || !height) return;
  const position = positionOf(subject);
  const worldWidth = place.artWidth || 900, worldHeight = place.artHeight || 600;
  // Note closed: a 44%-tall NPC fills 58% of the scene with the feet just above the question
  // buttons. Note open: it shrinks to 46% with the head just under the top chips, so the face
  // stays above the note (top ~40%). The NPC never moves in the world; only the camera does.
  // Below the picture's bottom edge, the outpainted floor (ART_FLOOR) fills the scene.
  const notes = $('#app').classList.contains('notes-open');
  // The interview room leaves more room above the speaker for dialogue, showing the face below the bubble.
  const interview = place.id === INTERVIEW_ROOM.id;
  const share = notes ? .46 : interview ? .52 : .58, headTop = notes ? .07 : interview ? .35 : .16;
  const fullHeight = worldHeight + (ART_FLOOR[place.id]?.h || 0);
  const minScale = Math.max(width / worldWidth, height / fullHeight);
  const scale = Math.max(minScale, height * share / (worldHeight * Math.max(44, position.height) / 100));
  // in the ending too the camera is on whoever speaks (Fiona while questioned, the partner for his closing line)
  const centerX = position.x;
  let top = height * headTop - worldHeight * (position.floor - position.height) / 100 * scale;
  const left = Math.min(0, Math.max(width - worldWidth * scale, width / 2 - worldWidth * centerX / 100 * scale));
  top = Math.min(0, Math.max(height - fullHeight * scale, top));
  const bounds = viewport.getBoundingClientRect();
  const from = fromRect?.width ? `translate(${fromRect.left - bounds.left}px, ${fromRect.top - bounds.top}px) scale(${fromRect.width / worldWidth})`
    : glide ? getComputedStyle(art).transform : null;
  animateCamera(art, from, `translate(${left}px, ${top}px) scale(${scale})`);
}

function blockHTML(sIdx, qid, now){
  const s = spk(sIdx), p = per(sIdx), q = qs(s).find(x => x.id === qid);

  const lines = s.notes[qid].map(line => {
    let html = '', last = 0;
    line.replace(/\{\{(\w+)\|([^}]+)\}\}/g, (m, id, ans, idx) => {
      html += esc(line.slice(last, idx));
      const v = p.notes[id] || '', mk = p.marks[id] || '';
      html += `<input class="blank ${mk}" style="--i:${n++}" id="n-${s.id}-${id}" data-s="${sIdx}" data-id="${id}" data-ans="${esc(ans)}" value="${esc(v)}" size="${Math.max(5, v.length+1)}" autocomplete="off" aria-label="빈칸"${p.questionChecks[qid] === 'ok' ? ' readonly' : ''}>`;

  const label = `Q. ${status === 'ok' ? markGrammar(q.en, items) : esc(q.en)}`;

    `<div class="npassage"${openPassages.has(ref) ? '' : ' hidden'}><p>${markGrammar(s.answers[qid], items)}</p>` +
    `<p class="np-ko"${openPassageKo.has(ref) ? '' : ' hidden'}>${esc(ANSWERS_KO[s.id]?.[qid] || '')}</p>` +
    `<div class="np-actions">${replay}<button class="pill sm" type="button" data-passage-ko="${ref}" aria-pressed="${openPassageKo.has(ref)}">해석</button></div></div>` : ''}</div>`;

function stageCard(title, sub){

// Start or resume a conversation. The first meeting plays the greeting.
let greetingTimer;
const sceneScroll = {};
function talkTo(id){
  discoveryRun++;
  if(discoveryPerson) finishDiscovery(false);
  clearTimeout(greetingTimer);
  const fromRect = S.investigate && S.place === spk(id).place ? $('#art').getBoundingClientRect() : null;
  if(S.investigate && S.place) sceneScroll[S.place] = artWrap.scrollLeft;
  stopVoice();
  const first = per(id).phase === 'wait';
  S.cur = id; S.view = id; S.sel = null;
  if(!S.met.includes(id)) S.met.push(id);
  if(first) per(id).phase = 'choose';
  openSheet(null); setNotes(false);
  if(S.investigate) setInvestigate(false);
  renderStage(fromRect); renderDock();
  if(first){
    if(cur().partner) stageCard(CASES[0].title, CASES[0].no);
    greetingTimer = setTimeout(() => {
      if(!S.investigate && S.cur === id && per(id).phase === 'choose') speak(spk(id).hello, 'hello');
    }, cur().partner ? 1200 : 600);
  }
}
// Leave the conversation for the place it happens in; any unfinished recording waits in the notebook.
function leaveTalk(){ enterPlace(cur().place, true); }
// Tapping the scene around the person (not the person, not a button) also goes back to the whole place,
// with the same camera move as the top chip. The picture itself is inert here, so the tap lands on #talkCamera.
$('#talkCamera').addEventListener('click', e => {
  if(S.investigate || ending || discoveryPerson || $('#app').classList.contains('notes-open')) return;
  const r = $(`#talkCamera .scene-npc[data-talk="${S.cur}"]`)?.getBoundingClientRect();
  if(r && e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom) return;
  leaveTalk();
});
function ask(qid){
  if(discoveryPerson || S.investigate || st().phase !== 'choose' || !availableQuestions(cur()).some(question => question.id === qid)) return;
  clearTimeout(greetingTimer);
  discoveryRun++;
  const p = st();
  p.feedback = null;
  p.phase = 'record'; p.recording = qid;
  if(!p.order.includes(qid)) p.order.push(qid);
  hideBubble();
  // the answer is first heard with the camera still close on the speaker (user decision: no zoom-out
  // while it plays); the notebook rises when it ends, unless it was opened by hand meanwhile
  const id = S.cur;
  speak(cur().answers[qid], qid, id, () => {
    if(S.cur === id && !S.investigate && !discoveryPerson && p.phase === 'record' && p.recording === qid && !document.querySelector('.sheet.open')) setNotes(true);
  });
  S.view = S.cur;
  renderDock();
}
// 힌트: the first blank of this question that is empty or wrong gets the right word (an acorn each, 3 per case).
function useHint(){
  const p = st(), qid = p.recording;
  if(S.investigate || p.phase !== 'record' || !qid || S.view !== S.cur) return;
  if(S.hints <= 0) return toast('힌트를 다 썼어요.');
  const blank = blanksOf(S.cur, [qid]).find(b => !b.value.trim() || !isRight(b));
  if(!blank) return toast('더 채울 칸이 없어요.');
  S.hints--;
  p.notes[blank.id] = blank.ans.split('/')[0];
  p.marks[blank.id] = 'hint';
  renderDock();
}
const norm = s => s.toLowerCase().replace(/[.'’,!]/g,'').replace(/\s+/g,' ').trim().replace(/\s?pm$/,'');
function finishRecord(){
  if(S.investigate || st().phase !== 'record' || S.view !== S.cur) return;
  const p = st();
  const qid = p.recording;
  const blanks = [...document.querySelectorAll(`.nblock[data-q="${qid}"] .blank`)];
  const empty = blanks.filter(b => !b.value.trim());
  if(empty.length){ empty[0].focus(); return toast(`빈칸 ${empty.length}개가 남았어요. 모두 채워야 기록이 끝나요.`); }
  markStudyDay();
  const answers = blanksOf(S.cur, [qid]);
  recordFirst(S.cur, qid);
  const correct = answers.every(isRight);
  p.questionChecks[qid] = correct ? 'ok' : 'review';
  answers.forEach(answer => {
    if(correct) p.marks[answer.id] = 'ok';
    else if(!isRight(answer)) p.marks[answer.id] = 'review';
    else delete p.marks[answer.id];
  });
  hideBubble();
  stopVoice();
  if(!correct){
    if(!p.retry.includes(qid)) p.retry.push(qid);
    const buzz = $('#retryBuzz');   // a low falling "bonk" and a short buzz on phones
    buzz.currentTime = 0; buzz.play().catch(() => {});
    if(navigator.userActivation?.hasBeenActive) try { navigator.vibrate?.(90); } catch(e){}
    missCheck = `${S.cur}:${qid}`;
    renderDock();
    return;
  }
  p.retry = p.retry.filter(question => question !== qid);
  const chime = $('#correctChime');   // a short two-note chime for a question written down right
  chime.currentTime = 0; chime.play().catch(() => {});
  p.recording = null;
  p.phase = qs(cur()).every(question => p.questionChecks[question.id] === 'ok') ? 'done' : 'choose';
  const revealed = unlock(cur().unlocks?.[qid], true) || {};
  pendingPins.push(...(revealed.places || []));
  pendingPeople.push(...(revealed.people || []));
  if(p.phase === 'done') checkNotes(S.cur);
  // the checked question stays open (lines, grammar chips) until the player closes the notebook; what it
  // unlocked shows after that (closeNotes)
  p.feedback = qid;
  openPassages.add(`${S.cur}:${qid}`);
  freshCheck = `${S.cur}:${qid}`;
  noteRaised = true;   // the checked question with its passage takes the whole screen for study
  renderDock();
}
// What the header button does on the page being viewed.
function noteMode(){
  if(S.view === 'evidence') return null;
  const p = per(S.view);
  if(noteRaised && p.checked && !p.feedback) return 'summary';
  if(S.view === S.cur && !S.investigate && p.feedback) return 'feedback';
  if(S.view === S.cur && !S.investigate && p.phase === 'record') return 'record';
  return null;
}
const BLANK_RE = /\{\{(\w+)\|([^}]+)\}\}/g;
// Every blank on a person's page, in the order the questions were asked.
function blanksOf(id, qids = per(id).order){
  const s = spk(id), p = per(id), out = [];
  qids.forEach(qid => s.notes[qid].forEach(line => line.replace(BLANK_RE, (m, bid, ans) => {
    out.push({ qid, id:bid, ans, value:p.notes[bid] || '' }); return m;
  })));
  return out;
}
const isRight = b => b.ans.split('/').map(norm).includes(norm(b.value));
function recordFirst(id, qid){
  const p = per(id);
  const questions = qid ? [qid] : p.order;
  questions.forEach(question => {
    if(p.firstQuestions[question]) return;
    const answers = blanksOf(id, [question]), wrong = answers.filter(answer => !isRight(answer));
    p.firstQuestions[question] = {ok:answers.length - wrong.length, total:answers.length};
    Object.assign(p.firstWrong, Object.fromEntries(wrong.map(answer => [answer.id, answer.value])));
  });
  p.first = Object.values(p.firstQuestions).reduce((total, result) => ({ok:total.ok + result.ok, total:total.total + result.total}), {ok:0, total:0});
}
function checkNotes(id){
  const p = per(id);
  if(!qs(spk(id)).every(question => p.questionChecks[question.id] === 'ok')) return;
  p.feedback = null;
  p.checked = true;
}
function replayLine(ref){
  const [id, qid] = ref.split(':');
  speak(spk(id).answers[qid], qid, id);
}
// One sentence of an answer: the matching part of the recording (or that sentence by browser TTS).
function replaySentence(ref, idx){
  const [id, qid] = ref.split(':'), range = SENTENCE_TIMES[ref]?.[idx];
  if(!range) return replayLine(ref);
  speak(sentencesOf(spk(id).answers[qid])[idx], qid, id, undefined, range);
}

function fillBlank(input, word){
  if(input.readOnly) return;
  input.value = word; input.size = Math.max(5, word.length+1); input.classList.remove('ok','no');
  const p = per(input.dataset.s); p.notes[input.dataset.id] = word; delete p.marks[input.dataset.id];

function fillNextBlank(word, source){
  if(S.view !== S.cur || S.investigate || st().phase !== 'record') return;
  const blank = [...document.querySelectorAll('#dockBody .nblock.now .blank')].find(input => !input.readOnly && !input.value.trim());
  if(blank){
    const from = source?.getBoundingClientRect();

    wordPlacementFeedback(blank, source, from);

function clearWordFlights(){ document.querySelectorAll('.word-flight').forEach(el => el.remove()); }
function wordPlacementFeedback(input, source, from){
  const sound = $('#wordPlace');
  sound.volume = .55; sound.currentTime = 0; sound.play().catch(() => {});
  if(!input.animate) return;
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  input.animate(reduced ? [
    {backgroundColor:'rgba(242,207,115,.5)'}, {backgroundColor:'transparent'}
  ] : [
    {transform:'scale(1)',backgroundColor:'rgba(242,207,115,.2)'},
    {transform:'scale(1.07)',backgroundColor:'rgba(242,207,115,.55)',offset:.45},
    {transform:'scale(1)',backgroundColor:'transparent'}
  ], {duration:reduced ? 180 : 360,easing:'ease-out'});
  if(reduced || !source || !from) return;
  source.getAnimations().forEach(animation => animation.cancel());
  source.animate([{transform:'scale(1)'},{transform:'scale(.92)',offset:.3},{transform:'scale(1)'}],{duration:220,easing:'ease-out'});
  const to = input.getBoundingClientRect(), ghost = document.createElement('span');
  ghost.className = 'word word-flight'; ghost.textContent = source.dataset.w;
  ghost.setAttribute('aria-hidden','true');
  Object.assign(ghost.style,{
    left:from.left+'px',top:from.top+'px',width:from.width+'px',height:from.height+'px',
    backgroundColor:getComputedStyle(source).backgroundColor
  });
  document.body.appendChild(ghost);
  const dx = to.left + to.width/2 - from.left - from.width/2;
  const dy = to.top + to.height/2 - from.top - from.height/2;
  const flight = ghost.animate([
    {transform:'translate(0,0) rotate(0deg) scale(1)',opacity:.95},
    {transform:`translate(${dx*.5}px,${dy*.5-16}px) rotate(-4deg) scale(.85)`,opacity:.9,offset:.5},
    {transform:`translate(${dx}px,${dy}px) rotate(0deg) scale(.55)`,opacity:0}
  ],{duration:260,easing:'cubic-bezier(.2,.7,.3,1)',fill:'forwards'});
  flight.finished.then(() => ghost.remove(), () => ghost.remove());
}
function clearSel(){ S.sel = null; document.querySelectorAll('.word.sel').forEach(w => w.classList.remove('sel')); }

let drag = null, suppressWordClick = false;
function dragStart(e){
  const w = e.target.closest('.word'); if(!w || !e.isPrimary || e.button !== 0) return;
  suppressWordClick = false;
  drag = { w, x:e.clientX, y:e.clientY, ghost:null, hot:null, id:e.pointerId };
  w.setPointerCapture(e.pointerId);
}
function dragMove(e){
  if(!drag || e.pointerId !== drag.id) return;
  if(!drag.ghost){
    if(Math.hypot(e.clientX-drag.x, e.clientY-drag.y) < 6) return;
    drag.ghost = drag.w.cloneNode(true); drag.ghost.classList.add('ghost'); drag.ghost.classList.remove('sel');
    $('#app').appendChild(drag.ghost);
  }
  drag.ghost.style.left = e.clientX+'px'; drag.ghost.style.top = e.clientY+'px';
  const under = document.elementFromPoint(e.clientX, e.clientY);
  const target = under?.closest?.('.blank');
  const hot = target && !target.readOnly ? target : null;
  if(drag.hot && drag.hot !== hot) drag.hot.classList.remove('hot');
  if(hot) hot.classList.add('hot');
  drag.hot = hot;
}
function dragEnd(e){
  if(!drag || e.pointerId !== drag.id) return;
  const word = drag.w.dataset.w;
  if(drag.ghost){
    suppressWordClick = true;
    drag.ghost.remove();
    if(drag.hot){
      drag.hot.classList.remove('hot');
      if(e.type === 'pointerup'){ fillBlank(drag.hot, word); wordPlacementFeedback(drag.hot); }
    }
    clearSel();
  }
  drag = null;
}

function renderPlaces(){

const placeIdOf = id => S.visit[id]?.place || spk(id).place;
const positionOf = id => S.visit[id] || NPC_POSITIONS[id];
const peopleAt = placeId => S.met.filter(id => placeIdOf(id) === placeId);
// Hearing a line or finding a clue can reveal places and people ({ places:[…], people:[…] }).
// A newly known person brings their place onto the map.
function unlock(u, quiet){
  if(!u) return;
  let newPerson = false;
  const places = [], people = [];
  (u.places || []).forEach(id => { if(!S.known.has(id)){ S.known.add(id); places.push(id); } });
  (u.people || []).forEach(id => {
    if(S.met.includes(id)) return;
    S.met.push(id); people.push(id); newPerson = true;
    if(!S.known.has(spk(id).place)){ S.known.add(spk(id).place); places.push(spk(id).place); }
  });
  const newPlace = places.length > 0;
  if(!newPlace && !newPerson) return {};
  renderPlaces();
  if(newPlace) setMapNew(true);
  if(!quiet){
    pendingPins.push(...places);
    pendingPeople.push(...people);
    revealDiscoveries();
  }
  return { newPlace, newPerson, places, people };

let pendingPins = [], pendingPeople = [], freshPins = new Set(), freshTimer, mapAutoTimer;
// Where the player is taken once a check's discoveries have been shown: the first new person (their conversation),

let discoveryGoal = null;
const MAP_AUTO_CLOSE_MS = 3000;   // how long a map that opened for new pins stays before it closes by itself
function afterMotion(element, callback){
  const animations = element.getAnimations();

  Promise.allSettled(animations.map(animation => animation.finished)).then(callback);

function revealDiscoveries(){
  if(!pendingPins.length && !pendingPeople.length) return;
  discoveryGoal = pendingPeople.length ? { person:pendingPeople[0] } : { place:pendingPins[0] };
  const run = ++discoveryRun;

function presentDiscovery(){

  if(!person){ revealPins(); return; }
  pendingPeople = pendingPeople.filter(id => id !== person);
  const place = spk(person).place;
  const fromRect = $('#art').dataset.scene?.split(':')[0] === place ? $('#art').getBoundingClientRect() : null;
  stopVoice();
  setNotes(false);
  if(S.investigate){
    discoveryOrigin = S.place;
    if(S.place) sceneScroll[S.place] = artWrap.scrollLeft;
    setInvestigate(false);
  }

  $('#app').classList.add('discovering');

    if(discoveryPerson !== person) return;

function finishDiscovery(showMap = true){
  discoveryRun++;

  if(discoveryPerson){
    const person = discoveryPerson;
    const fromRect = spk(person).place === cur().place ? $('#art').getBoundingClientRect() : null;
    discoveryPerson = null;
    $('#app').classList.remove('discovering', 'discovery-ready');
    $('#toast').hidden = true;
    // introduced right here and nothing else to show: straight into a conversation with them
    if(showMap && discoveryGoal?.person === person && !pendingPins.length && !pendingPeople.length){
      discoveryGoal = null; discoveryOrigin = null;
      talkTo(person);
      return;
    }
    if(discoveryOrigin){
      const place = discoveryOrigin;
      discoveryOrigin = null;
      enterPlace(place);

function revealPins(){
  if(!pendingPins.length && !pendingPeople.length) return;
  const places = [...new Set(pendingPins)], people = [...new Set(pendingPeople)];
  freshPins = new Set([...places, ...people.map(id => spk(id).place)]);

  afterMotion($('#sheet-map'), () => {
    if(run !== discoveryRun || !$('#sheet-map').classList.contains('open')) return;
    toast(places.length && people.length ? '새로운 장소와 인물을 알게 됐어요.' : people.length ? '새로운 인물을 알게 됐어요.' : '새로운 장소를 알게 됐어요.', true);
    // the map opened by itself, so it closes by itself too: to the new person or place (discoveryGoal), or back to
    // where the game was; touching the map (a pin, the menu) keeps it open
    mapAutoTimer = setTimeout(() => {
      if(run === discoveryRun && $('#sheet-map').classList.contains('open')) goToDiscovery();
    }, MAP_AUTO_CLOSE_MS);
  });
  clearTimeout(freshTimer);
  freshTimer = setTimeout(() => { freshPins.clear(); document.querySelectorAll('.pin.fresh').forEach(pin => pin.classList.remove('fresh')); }, 4200);
}

function goToDiscovery(){
  const goal = discoveryGoal;
  discoveryGoal = null;
  if(goal?.person) talkTo(goal.person);
  else if(goal?.place) enterPlace(goal.place);
  else openSheet(null);
}

// A mouse can drag the strip sideways and its wheel scrolls it sideways (a finger already swipes it natively);
// a drag that moved never counts as picking the card it started on.
(strip => {
  let start = null, dragged = false;
  strip.addEventListener('pointerdown', e => {
    if(e.pointerType !== 'mouse' || e.button !== 0) return;
    start = { x:e.clientX, left:strip.scrollLeft }; dragged = false;
  });
  addEventListener('pointermove', e => {
    if(!start) return;
    const dx = e.clientX - start.x;
    if(!dragged && Math.abs(dx) > 5){ dragged = true; strip.classList.add('dragging'); }
    if(dragged) strip.scrollLeft = start.left - dx;
  });
  addEventListener('pointerup', () => { if(start){ start = null; strip.classList.remove('dragging'); } });
  strip.addEventListener('click', e => { if(dragged){ e.stopPropagation(); dragged = false; } }, true);
  strip.addEventListener('wheel', e => {
    if(Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
    strip.scrollLeft += e.deltaY; e.preventDefault();
  }, { passive:false });

/* ---------- review: after the case, the full lines, Korean, and the blanks missed at the first check ---------- */
// First-check results of the case just solved in this visit: totals, stars, and the questions missed at first.
function liveStats(){
  const people = S.met.filter(id => per(id).order.length);
  people.forEach(id => recordFirst(id));
  const ok = people.reduce((n, id) => n + per(id).first.ok, 0), total = people.reduce((n, id) => n + per(id).first.total, 0);
  const rate = total ? ok / total : 0, stars = rate >= .9 ? 3 : rate >= .7 ? 2 : 1;
  const missed = people.flatMap(id => Object.entries(per(id).firstQuestions).filter(([, r]) => r.ok < r.total).map(([qid]) => `${id}:${qid}`));
  // wrong: { 'mole:m2': { blankId: what was written first } }
  const wrong = Object.fromEntries(missed.map(ref => {
    const [id, qid] = ref.split(':'), first = per(id).firstWrong;
    return [ref, Object.fromEntries(blanksOf(id, [qid]).filter(b => b.id in first).map(b => [b.id, first[b.id]]))];
  }));
  return { ok, total, stars, missed, wrong };
}
// Opened right after the case-closed stamp (fromHome false: the case just solved, first-check results in memory; no way

let rv = null;
function openReview(fromHome){
  const stat = fromHome ? caseStats()[CASES[0].id] : liveStats();

  rv = { fromHome:!!fromHome, stat, missed, wrong:stat?.wrong || {}, card:0, filled:{}, step:0,
    steps:['result', ...(missed.length ? ['missed'] : []), 'grammar', 'words'],
    words, keep:new Set(kept ? words.filter(w => kept.includes(w.key)).map(w => w.key) : words.map(w => w.key)) };
  // a first review starts with nothing kept: the player picks
  if(!fromHome && !kept) rv.keep.clear();

  renderReview();
}
// The case's grammar, most used first: [id, uses].
function caseGrammar(){
  return Object.keys(GRAMMAR).map(g => [g, grammarUses(g)]).filter(([, uses]) => uses.length).sort((a, b) => b[1].length - a[1].length);
}
function renderReview(){

    (rv.fromHome ? `<button class="pill sm" type="button" data-rv-close>닫기</button>` : '') + `</div>`;
  let body = '', foot = '';

    const stars = st?.stars || 0, grammar = caseGrammar().length;

      <div class="rv-stars" aria-label="별 ${stars}개">${[0,1,2].map(i => `<img src="assets/ui/${i < stars ? 'star' : 'star-empty'}.png" alt="" style="--i:${i}">`).join('')}</div>
      ${st ? `<p class="rv-score">${st.total}칸 중 ${st.ok}칸</p>` : ''}
      <div class="rv-tiles">
        ${rv.missed.length ? `<div><b>${rv.missed.length}</b>다시 들을<br>문장</div>` : `<div class="all"><b>✓</b>모두<br>맞힘</div>`}
        <div><b>${Math.min(3, grammar)}</b>핵심<br>문법</div>

    const slots = Object.keys(wrong).length ? Object.keys(wrong) : blanksOf(id, [qid]).map(b => b.id);
    const lines = s.notes[qid].map(line => {
      let html = '', last = 0;
      line.replace(BLANK_RE, (m, bid, ans, idx) => {
        html += esc(line.slice(last, idx)) + (slots.includes(bid)

    body = `<div class="rv-who"><span class="mini" style="background:${s.bg}">${miniSVG(id)}</span>${esc(s.name)}<small>${rv.card + 1} / ${rv.missed.length}</small></div>

      <div class="bank">${(s.bank?.[qid] || []).map(w => `<button class="word" type="button" data-rv-word="${esc(w)}">${esc(w)}</button>`).join('')}</div>`;

      const shown = at < 0 ? esc(sent) : esc(sent.slice(0, at)) + `<mark>${esc(use.words)}</mark>` + esc(sent.slice(at + use.words.length));
      return `<div class="rv-gcard"><header><b>${esc(GRAMMAR[g].name)}</b><small>${uses.length}번</small></header>
        <span class="gpat">${esc(GRAMMAR[g].pattern)}</span><p>${shown}</p>
        <p class="gko" hidden>${esc(GRAMMAR[g].ko)}</p>
        <div class="rv-gbtns"><button class="replay-q" type="button" data-rv-sent="${use.id}:${use.qid}" data-sent="${idx}" aria-label="문장 듣기">${playIcon}</button>

    }).join('');
    foot = `<button class="pill big" type="button" data-rv-next>다음</button>`;
  }
  if(step === 'words'){
    const all = rv.words.length && rv.words.every(w => rv.keep.has(w.key));
    body = `<h2 class="rv-title">새 단어 <small>${rv.keep.size} / ${rv.words.length}</small>
        <button class="pill sm" type="button" data-rv-all aria-pressed="${all}" style="margin-left:auto">${all ? '모두 빼기' : '모두 담기'}</button></h2>` +
      WORD_GROUPS.map(([g, label]) => {
        const list = rv.words.filter(w => WORDS[w.key][0] === g);
        return !list.length ? '' : `<h3 class="rv-wsec">${label}</h3>` + list.map(w => {
          const [, ko, say] = WORDS[w.key], on = rv.keep.has(w.key);

            <span><span class="wword">${esc(w.word)}</span>${say ? `<span class="wsay">${esc(say)}</span>` : ''}</span>

  }
  $('#reviewCard').innerHTML = `${bar}<div class="rv-body${step === 'result' ? ' mid' : ''}">${body}</div><div class="rv-foot">${foot}</div>`;
}
function reviewNext(){

// Words the player keeps join the word book; the case's words left out are taken out of it.
function closeReview(){
  stopVoice();

  keepWords([...kept.filter(k => !caseKeys.has(k)), ...rv.keep]);

$('#review').addEventListener('click', e => {
  if(!rv) return;
  const grammar = e.target.closest('[data-grammar]');
  if(grammar) return openGrammar(grammar.dataset.grammar);
  const sent = e.target.closest('[data-rv-sent]');
  if(sent) return replaySentence(sent.dataset.rvSent, +sent.dataset.sent);
  if(e.target.closest('[data-rv-next]')) return reviewNext();
  if(e.target.closest('[data-rv-close], [data-rv-done]')) return closeReview();
  const ref = rv.steps[rv.step] === 'missed' ? rv.missed[rv.card] : null;
  if(e.target.closest('[data-rv-play]')) return replayLine(ref);
  if(e.target.closest('[data-rv-slow]')){ const was = S.slow; S.slow = true; replayLine(ref); S.slow = was; return; }
  const word = e.target.closest('[data-rv-word]');
  if(word){
    const empty = [...document.querySelectorAll('#reviewCard [data-rv-slot]')].find(b => !rv.filled[b.dataset.rvSlot]);
    if(empty){ rv.filled[empty.dataset.rvSlot] = word.dataset.rvWord; empty.textContent = word.dataset.rvWord; empty.classList.remove('miss'); }
    return;
  }
  const slot = e.target.closest('[data-rv-slot]');
  if(slot){ delete rv.filled[slot.dataset.rvSlot]; slot.textContent = ''; return; }
  if(e.target.closest('[data-rv-check]')){
    const [id, qid] = ref.split(':'), slots = [...document.querySelectorAll('#reviewCard [data-rv-slot]')];
    const answers = Object.fromEntries(blanksOf(id, [qid]).map(b => [b.id, b.ans]));
    const wrong = slots.filter(b => !isRight({ ans:answers[b.dataset.rvSlot], value:rv.filled[b.dataset.rvSlot] || '' }));
    const sound = $(wrong.length ? '#retryBuzz' : '#correctChime'); sound.currentTime = 0; sound.play().catch(() => {});
    if(wrong.length){
      // the wrong ones are emptied with a shake; the right answer is never shown
      wrong.forEach(b => { delete rv.filled[b.dataset.rvSlot]; b.textContent = ''; b.classList.remove('miss'); void b.offsetWidth; b.classList.add('miss'); });
      return;
    }
    slots.forEach(b => b.classList.add('hit'));
    e.target.closest('[data-rv-check]').disabled = true;
    setTimeout(() => {
      if(!rv) return;
      rv.filled = {};
      if(rv.card < rv.missed.length - 1){ rv.card++; renderReview(); } else reviewNext();
    }, 750);
    return;
  }
  const gko = e.target.closest('[data-rv-gko]');
  if(gko){ const t = gko.closest('.rv-gcard').querySelector('.gko'); t.hidden = !t.hidden; gko.setAttribute('aria-pressed', !t.hidden); return; }
  const wko = e.target.closest('[data-rv-wko]');
  if(wko){ const t = wko.closest('.rv-word').querySelector('.wko'); t.hidden = !t.hidden; wko.setAttribute('aria-pressed', !t.hidden); return; }
  const keep = e.target.closest('[data-rv-keep]');
  if(keep){
    const k = keep.dataset.rvKeep, on = !rv.keep.has(k);
    if(on) rv.keep.add(k); else rv.keep.delete(k);
    const scroll = $('#reviewCard .rv-body').scrollTop; renderReview(); $('#reviewCard .rv-body').scrollTop = scroll;
    return;
  }
  if(e.target.closest('[data-rv-all]')){
    const all = rv.words.every(w => rv.keep.has(w.key));
    rv.keep = new Set(all ? [] : rv.words.map(w => w.key));
    const scroll = $('#reviewCard .rv-body').scrollTop; renderReview(); $('#reviewCard .rv-body').scrollTop = scroll;
  }
});

// a person's on-picture box in % of the picture: left/right of the sprite, top of the head, plus its height
function npcBox(id, pl){
  const position = positionOf(id), sprite = SPRITES[spriteKey(id)], height = position.height * (sprite?.height || 1);
  const width = height * (pl.artHeight || 600) / (pl.artWidth || 900) * (sprite ? sprite.w / sprite.h : .5);

/* ---------- case select ----------
   Cases open in order (a case unlocks when the one before it is solved). Solved cases are kept on
   this device; the case in progress lives in memory only until saving is added. */
const CASES = [
  { id:'case01', no:'Case 01', title:'도서관 살인사건', art:'library', playable:true, focus:'시간 표현 듣기' },
  { id:'case02', no:'Case 02' },
  { id:'case03', no:'Case 03' },
  { id:'case04', no:'Case 04' },
  { id:'case05', no:'Case 05' }
];
const SOLVED_KEY = 'pioo.solvedCases', STATS_KEY = 'pioo.caseStats', DAYS_KEY = 'pioo.studyDays';
const readJSON = (key, empty) => { try { return JSON.parse(localStorage.getItem(key)) || empty; } catch(e){ return empty; } };
const solvedCases = () => readJSON(SOLVED_KEY, []);
const caseStats = () => readJSON(STATS_KEY, {});   // { caseId: { ok, total, stars, missed:['mole:m2', …], wrong:{ref:{blank:value}} } }, the best first-check result
// The word book holds only the words the player chose to keep in a review (user decision: known words stay out).
// Before the first choice (key missing) it shows every learned word, as before.
const WORDBOOK_KEY = 'pioo.wordBook';
const keptWords = () => readJSON(WORDBOOK_KEY, null);
function keepWords(keys){ try { localStorage.setItem(WORDBOOK_KEY, JSON.stringify([...new Set(keys)])); } catch(e){} }
let solvedThisRun = false;
function markSolved(id){
  solvedThisRun = true;
  const all = caseStats(), now = liveStats(), old = all[id];
  if(!old || now.ok / (now.total || 1) >= old.ok / (old.total || 1)) all[id] = now;
  try {
    localStorage.setItem(SOLVED_KEY, JSON.stringify([...new Set([...solvedCases(), id])]));
    localStorage.setItem(STATS_KEY, JSON.stringify(all));
  } catch(e){}
}
// Study days (local dates) for the streak on 내 기록: a day counts once a case is opened or a note is checked.
const dayKey = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const studyDays = () => readJSON(DAYS_KEY, []);
function markStudyDay(){
  const today = dayKey(), days = studyDays();
  if(days.includes(today)) return;
  try { localStorage.setItem(DAYS_KEY, JSON.stringify([...days, today].slice(-120))); } catch(e){}
}
function studyStreak(){
  const days = new Set(studyDays()), d = new Date();
  if(!days.has(dayKey(d))) d.setDate(d.getDate() - 1);   // today not studied yet: the streak still counts up to yesterday
  let n = 0;
  while(days.has(dayKey(d))){ n++; d.setDate(d.getDate() - 1); }
  return n;
}
const LOCK_ICON = `<svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="#7D6A58" stroke-width="1.8" stroke-linejoin="round"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8.5 10.5 V8 a3.5 3.5 0 0 1 7 0 V10.5"/></g></svg>`;

  requestAnimationFrame(() => {
    drawBoardString();
    // a long board (many cases) scrolls to the case to play next
    const page = $('#home-cases'), next = page.querySelector('.polaroid.current');
    if(next){
      const box = page.getBoundingClientRect(), at = next.getBoundingClientRect();
      if(at.bottom > box.bottom) page.scrollTop += at.top - box.top - (box.height - at.height) / 2;
    }
  });
}
// One continuous, taut red thread between each pair of pins, including locked cases.
// Positions come from layout (offset*), not the screen, so the photos' drop-in animation does not move it.
function drawBoardString(){
  const board = $('#caseCards'), photos = [...board.querySelectorAll('.polaroid')];
  board.querySelectorAll('.board-string').forEach(el => el.remove());
  if(!photos.length || !board.offsetWidth) return;
  const tacks = photos.map(el => {
    const a = parseFloat(el.style.getPropertyValue('--tilt')) * Math.PI / 180, dy = -el.offsetHeight / 2 + 7;
    return { x:el.offsetLeft + el.offsetWidth / 2 - dy * Math.sin(a), y:el.offsetTop + el.offsetHeight / 2 + dy * Math.cos(a), w:el.offsetWidth, locked:el.classList.contains('locked') };
  });
  const n = v => v.toFixed(1);
  const strings = tacks.slice(1).map((t, i) => {
    const f = tacks[i];
    const d = `M${n(f.x)} ${n(f.y)} L${n(t.x)} ${n(t.y)}`;
    return `<g class="board-thread"><path class="thread-shadow" d="${d}"/>
      <path class="thread-edge" d="${d}"/><path class="thread-core" d="${d}"/>
      <path class="thread-light" d="${d}"/></g>`;
  }).join('');
  // the push pins are Higgsfield art (assets/ui/tack-red/-grey.webp): the needle tip, at 36% across and the very
  // bottom of the picture, goes into the tack point; red for an open case, grey for a locked one
  const heads = tacks.map(t => `<ellipse cx="${n(t.x + 2)}" cy="${n(t.y + 1)}" rx="4" ry="1.8" fill="rgba(40,20,10,.35)"/>
    <image class="tack" href="assets/ui/tack-${t.locked ? 'grey' : 'red'}.webp" x="${n(t.x - .363 * 24)}" y="${n(t.y - 33)}" width="24" height="33"/>`).join('');
  board.insertAdjacentHTML('beforeend', `<svg class="board-string" aria-hidden="true">${strings}${heads}</svg>`);
}
new ResizeObserver(() => { if(homeTab === 'cases' && !$('#caseList').hidden) drawBoardString(); }).observe($('#caseCards'));

/* ---------- save ----------
   The case in progress is kept on this device (SAVE_KEY): the whole state S (Sets stored as { $set:[…] }), and how far
   the ending got. Saved when the page is hidden or closed, on the way out (<), and every few seconds while a case is
   open. On the next visit the case resumes where it was: in the conversation or the place the player had open. Not kept:
   an ending scene in progress (the accusation is made again), a note check's open feedback, a line that was playing. */
const SAVE_KEY = 'pioo.save';
let resumePending = false, saveOff = false;
function saveGame(){
  if(!caseStarted || saveOff) return;
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({ v:1, S:{ ...S, sel:null }, endingRound },
      (key, value) => value instanceof Set ? { $set:[...value] } : value));
  } catch(e){}
}
function loadGame(){
  let data;
  try { data = JSON.parse(localStorage.getItem(SAVE_KEY), (key, value) => value && Array.isArray(value.$set) ? new Set(value.$set) : value); }
  catch(e){ return; }
  if(data?.v !== 1 || !data.S?.per) return;
  const saved = data.S.per;
  Object.assign(S, data.S, { sel:null, mood:{}, visit:{} });
  // anyone added to the case since the save starts fresh; a check's open feedback is not kept
  S.per = Object.fromEntries(PEOPLE_ORDER.map(id => [id, { ...newSpeakerState(), ...saved[id], feedback:null }]));
  PLACES.forEach(place => { if(!(S.found[place.id] instanceof Set)) S.found[place.id] = new Set(); });
  S.met = S.met.filter(id => PEOPLE[id]);
  endingRound = data.endingRound || 0;
  caseStarted = resumePending = true;
}
// The saved case on screen again: the place the player had open, else the conversation.
function resumeCase(){
  renderPlaces();
  if(S.investigate && S.known.has(S.place)){ S.investigate = false; enterPlace(S.place); }
  else { S.investigate = false; talkTo(S.cur); }
}
document.addEventListener('visibilitychange', () => { if(document.hidden) saveGame(); });
addEventListener('pagehide', saveGame);
setInterval(() => { if(caseStarted && $('#caseList').hidden) saveGame(); }, 5000);

/* ---------- grammar notes ----------
   A checked question gets chips for the grammar in its answer (GRAMMAR_LINES). A chip opens the card:
   the pattern, a Korean explanation, and every learned line that uses it, with the words highlighted. */
// The text with each grammar's words turned into a link to its card (overlapping words: the first one wins).
function markGrammar(text, items = []){
  const ranges = items.map(([g, words]) => ({ g, at:text.indexOf(words), len:words.length })).filter(r => r.at >= 0).sort((a, b) => a.at - b.at);
  let html = '', last = 0;
  let i = 0;
  ranges.forEach(r => {
    if(r.at < last) return;
    html += esc(text.slice(last, r.at)) + `<button class="gmark" type="button" data-grammar="${r.g}" style="--i:${i++}">${esc(text.substr(r.at, r.len))}</button>`;
    last = r.at + r.len;
  });
  return html + esc(text.slice(last));
}
// The 지문 toggle under a checked question in the note (open = the answer text is showing).
const passageToggle = (ref, open) => `<button class="ptoggle" type="button" data-passage="${ref}" aria-pressed="${open}">${open ? '지문 접기' : '지문 보기'}</button>`;
// The sentence of the answer (or the question) that holds the words, with the words marked.
function grammarLine(id, qid, words){
  const s = spk(id), answer = s.answers[qid], question = qs(s).find(q => q.id === qid).en;
  const inAnswer = answer.includes(words), text = inAnswer ? answer : question;
  const parts = sentencesOf(text), idx = Math.max(0, parts.findIndex(part => part.includes(words))), sentence = parts[idx];
  const at = sentence.indexOf(words);
  return { inAnswer, idx, html:esc(sentence.slice(0, at)) + `<mark>${esc(words)}</mark>` + esc(sentence.slice(at + words.length)) };
}
const grammarUses = g => Object.entries(GRAMMAR_LINES).flatMap(([ref, items]) => {
  const [id, qid] = ref.split(':');
  return knownQuestion(id, qid) ? items.filter(([gid]) => gid === g).map(([, words]) => ({ id, qid, words })) : [];
});
function learnedGrammar(){
  return Object.keys(GRAMMAR).map(g => [g, grammarUses(g).length]).filter(([, n]) => n);
}
function openGrammar(g){
  const gr = GRAMMAR[g];
  $('#grammarCard').innerHTML = `<span class="eyebrow">문법 노트 · ${esc(gr.name)}</span>
    <h2 class="gpattern" id="grammarTitle">${esc(gr.pattern)}</h2>
    <p class="gko">${esc(gr.ko)}</p>
    <div class="gex"><h3>이 문법이 나온 문장</h3>${grammarUses(g).map(({ id, qid, words }) => {
      const s = spk(id), line = grammarLine(id, qid, words);
      return `<div class="gline"><div class="wtop"><span class="wwho">${line.inAnswer
        ? `<span class="mini" style="background:${s.bg}">${miniSVG(id)}</span>${esc(s.name)}` : '내 질문'}</span>
        ${line.inAnswer ? `<button class="replay-q" type="button" data-replay="${id}:${qid}" data-sent="${line.idx}" aria-label="다시 듣기">${playIcon}</button>` : ''}</div>
        <p>${line.html}</p></div>`;
    }).join('')}</div>
    <button class="pill big" type="button" data-gclose>닫기</button>`;
  $('#grammar').hidden = false;
  $('#grammarCard').scrollTop = 0;
}
$('#grammar').addEventListener('click', e => {
  const replay = e.target.closest('[data-replay]');
  if(replay) return replaySentence(replay.dataset.replay, +replay.dataset.sent);
  if(e.target.closest('[data-gclose]') || e.target.id === 'grammar'){ stopVoice(); $('#grammar').hidden = true; }
});

/* ---------- home pages ----------
   단어장: blanks the player has written right (every blank once a case is solved). The line it came from
   plays with ▶; Korean only with 해석. 복습: solved cases and the lines missed at the first check.
   내 기록: streak, totals, and the how-to. All of it reads only what this device saved or the case in memory. */
let homeTab = 'cases', wordMode = 'words';
// A question whose words and grammar count as learned: checked right in the case in memory, or any once the case is solved.
const knownQuestion = (id, qid) => solvedCases().includes(CASES[0].id) || per(id).questionChecks[qid] === 'ok';
function learnedWords(){
  const seen = new Map();
  PEOPLE_ORDER.forEach(id => {
    const s = spk(id);
    qs(s).forEach(q => {
      if(!knownQuestion(id, q.id)) return;
      (s.notes[q.id] || []).forEach(line => line.replace(BLANK_RE, (m, bid, ans) => {
        const key = ans.split('/')[0].toLowerCase();
        if(WORDS[key] && !seen.has(key)) seen.set(key, { word:ans.split('/')[0], key, line, bid, ref:`${id}:${q.id}`, sent:sentenceFor(s.answers[q.id], ans, line) });
        return m;
      }));
    });
  });
  return [...seen.values()];
}
// Which sentence of the answer a note blank was heard in: one that says the word (any accepted form), the one
// sharing most words with the note line when several or none do.
function sentenceFor(answer, ans, line){
  const tokens = text => text.toLowerCase().replace(/[^a-z0-9: ]/g, ' ').split(/\s+/).filter(Boolean);
  const said = ans.split('/').map(v => new RegExp(`\\b${v.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}\\b`, 'i'));
  const lineWords = new Set(tokens(line.replace(BLANK_RE, (m, bid, a) => a.split('/')[0])));
  let best = 0, top = -1;
  sentencesOf(answer).forEach((sentence, i) => {
    const score = (said.some(re => re.test(sentence)) ? 100 : 0) + tokens(sentence).filter(w => lineWords.has(w)).length;
    if(score > top){ top = score; best = i; }
  });
  return best;
}
// A note line with its blanks filled in; the blank `mark` is highlighted.
function filledLine(line, mark){
  let html = '', last = 0;
  line.replace(BLANK_RE, (m, bid, ans, idx) => {
    const word = esc(ans.split('/')[0]);
    html += esc(line.slice(last, idx)) + (bid === mark ? `<mark>${word}</mark>` : word);
    last = idx + m.length; return m;
  });
  return html + esc(line.slice(last));
}
const koToggle = text => `<p class="wko" hidden>${esc(text)}</p><button class="pill sm" type="button" data-wko aria-pressed="false">해석</button>`;
// The word book: learned words the player kept (every learned word before the first review choice).
function bookWords(){
  const all = learnedWords(), kept = keptWords();
  return kept ? all.filter(w => kept.includes(w.key)) : all;
}
function renderWords(){
  const words = bookWords(), switcher = `<div class="wb-switch">${[['words','단어'], ['grammar','문법']].map(([mode, label]) =>
    `<button class="pill sm" type="button" data-wbmode="${mode}" aria-pressed="${wordMode === mode}">${label}</button>`).join('')}</div>`;
  if(wordMode === 'grammar'){
    const list = learnedGrammar();
    $('#home-words').innerHTML = `<header class="cases-head"><h1>단어장</h1></header>${switcher}` + (!list.length
      ? `<p class="home-empty">아직 모은 문법이 없어요.</p>`
      : list.map(([g, n]) => `<button class="wcard" type="button" data-grammar="${g}" style="text-align:left;width:100%">
          <span class="wword">${esc(GRAMMAR[g].pattern)}</span><span class="wsay">${esc(GRAMMAR[g].name)} · 문장 ${n}</span></button>`).join(''));
    return;
  }
  $('#home-words').innerHTML = `<header class="cases-head"><h1>단어장</h1></header>${switcher}` + (!words.length
    ? `<p class="home-empty">아직 모은 단어가 없어요.</p>`
    : WORD_GROUPS.map(([g, label]) => {
        const list = words.filter(w => WORDS[w.key][0] === g);
        return !list.length ? '' : `<h2 class="home-sec">${label} <small>${list.length}</small></h2>` + list.map(w => {
          const [, ko, say] = WORDS[w.key];
          return `<div class="wcard"><div class="wtop"><span><span class="wword">${esc(w.word)}</span>${say ? `<span class="wsay">${esc(say)}</span>` : ''}</span>
            <button class="replay-q" type="button" data-wplay="${w.ref}" data-sent="${w.sent}" aria-label="문장 듣기">${playIcon}</button></div>
            <p class="wline">${filledLine(w.line, w.bid)}</p>${koToggle(ko)}</div>`;
        }).join('');
      }).join(''));
}
function renderReviewTab(){
  const stats = caseStats(), solved = CASES.filter(c => solvedCases().includes(c.id));
  const missed = solved.flatMap(c => stats[c.id]?.missed || []);
  $('#home-review').innerHTML = `<header class="cases-head"><h1>복습</h1></header>` + (!solved.length
    ? `<p class="home-empty">아직 해결한 사건이 없어요.</p>`
    : solved.map(c => {
        const st = stats[c.id];
        return `<div class="wcard rv-case"><span><span class="case-no">${c.no}</span><span class="wword">${esc(c.title)}</span>
          ${st ? `<span class="wsay">별 ${st.stars}개 · 처음 확인 ${st.ok}/${st.total}칸</span>` : ''}</span>
          <button class="pill sm" type="button" data-open-review>복습 보기</button></div>`;
      }).join('') +
      `<h2 class="home-sec">다시 들을 문장 <small>${missed.length}</small></h2>` + (!missed.length
        ? `<p class="home-empty">처음부터 모두 맞혔어요.</p>`
        : missed.map(ref => {
            const [id, qid] = ref.split(':'), s = spk(id);
            return `<div class="wcard"><div class="wtop"><span class="wwho"><span class="mini" style="background:${s.bg}">${miniSVG(id)}</span>${esc(s.name)}</span>
              <button class="replay-q" type="button" data-wplay="${ref}" aria-label="다시 듣기">${playIcon}</button></div>
              <span class="wq">Q. ${esc(qs(s).find(q => q.id === qid).en)}</span>
              <p class="wline" hidden>${esc(s.answers[qid])}</p>
              <p class="wko" hidden>${esc(ANSWERS_KO[id]?.[qid] || '')}</p>
              <span class="wbtns"><button class="pill sm" type="button" data-wen aria-pressed="false">문장</button><button class="pill sm" type="button" data-wko aria-pressed="false">해석</button></span></div>`;
          }).join('')));
}
function renderMe(){
  const stats = Object.values(caseStats()), ok = stats.reduce((n, s) => n + s.ok, 0), total = stats.reduce((n, s) => n + s.total, 0);
  const days = new Set(studyDays()), today = new Date(), monday = new Date(today);
  monday.setDate(today.getDate() - (today.getDay() + 6) % 7);
  const week = [...'월화수목금토일'].map((label, i) => {
    const d = new Date(monday); d.setDate(monday.getDate() + i);
    return `<span class="${days.has(dayKey(d)) ? 'on' : ''} ${dayKey(d) === dayKey(today) ? 'today' : ''}"><i></i>${label}</span>`;
  }).join('');
  $('#home-me').innerHTML = `<header class="cases-head"><h1>내 기록</h1></header>
    <div class="stat-grid">
      <div class="stat"><b>${studyStreak()}일</b><span>연속 학습</span></div>
      <div class="stat"><b>${solvedCases().length}</b><span>해결한 사건</span></div>
      <div class="stat"><b>${total ? Math.round(ok / total * 100) + '%' : '–'}</b><span>처음 확인 정확도</span></div>
      <div class="stat"><b>${bookWords().length}</b><span>모은 단어</span></div>
    </div>
    <h2 class="home-sec">이번 주</h2><div class="week">${week}</div>
    <h2 class="home-sec">설정</h2>
    <button class="pill" type="button" data-howto>플레이 방법 다시 보기</button>`;
}
function renderHome(){
  stopVoice();
  ({ cases:renderCaseList, words:renderWords, review:renderReviewTab, me:renderMe })[homeTab]();
  document.querySelectorAll('.home-page').forEach(page => { page.hidden = page.id !== `home-${homeTab}`; });
  document.querySelectorAll('[data-home]').forEach(b => b.dataset.home === homeTab ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current'));
  $(`#home-${homeTab}`).scrollTop = 0;
}
$('#caseList').addEventListener('click', e => {
  const tab = e.target.closest('[data-home]');
  if(tab){ if(tab.dataset.home !== homeTab){ homeTab = tab.dataset.home; renderHome(); } return; }
  const play = e.target.closest('[data-wplay]');
  if(play) return play.dataset.sent ? replaySentence(play.dataset.wplay, +play.dataset.sent) : replayLine(play.dataset.wplay);
  const mode = e.target.closest('[data-wbmode]');
  if(mode){ wordMode = mode.dataset.wbmode; renderWords(); $('#home-words').scrollTop = 0; return; }
  const grammar = e.target.closest('[data-grammar]');
  if(grammar) return openGrammar(grammar.dataset.grammar);
  const toggle = e.target.closest('[data-wko], [data-wen]');
  if(toggle){
    const box = toggle.closest('.wcard').querySelector(toggle.hasAttribute('data-wko') ? '.wko' : '.wline');
    box.hidden = !box.hidden; toggle.setAttribute('aria-pressed', !box.hidden); return;
  }
  if(e.target.closest('[data-open-review]')) return openReview(true);
  if(e.target.closest('[data-howto]')) openTutorial(false);
});

/* ---------- test tools ---------- */
// Write the correct answer into every blank of the given questions; returns how many blanks were filled.
function fillAnswers(i, qids, mark){
  const p = per(i); let n = 0;
  qids.forEach(qid => spk(i).notes[qid].forEach(line =>
    line.replace(/\{\{(\w+)\|([^}]+)\}\}/g, (m, id, ans) => {
      p.notes[id] = ans.split('/')[0];
      if(mark) p.marks[id] = 'ok'; else delete p.marks[id];
      n++; return m;
    })
  ));
  return n;
}
// 노트 자동 채우기: every question asked so far, everyone.
$('#devFill').onclick = () => {
  const n = PEOPLE_ORDER.reduce((sum, id) => sum + fillAnswers(id, per(id).order, false), 0);
  if(!n) return toast('채울 빈칸이 없어요. 먼저 질문을 골라 주세요.');
  renderDock();
  toast(`빈칸 ${n}개를 채웠어요.`);
};
// 전체 대화 완료: everyone met, every question asked and recorded correctly, every place known → the map, opened over
// the place of the current conversation (so closing it never leaves an empty place view).
$('#devDone').onclick = () => {
  stopVoice(); hideBubble(); clearSel();
  $('#intro').hidden = true; $('#caseList').hidden = true; caseStarted = true;
  PEOPLE_ORDER.forEach(id => {
    const p = per(id);
    p.order = qs(spk(id)).map(q => q.id); p.recording = null; p.phase = 'done';
    fillAnswers(id, p.order, false);
  });
  S.met = [...PEOPLE_ORDER];
  PLACES.forEach(pl => S.known.add(pl.id));
  renderPlaces();
  if(S.investigate && S.place) renderDock(); else enterPlace(cur().place, true);
  openSheet('map');
  toast('모든 대화를 마쳤어요. 지도에서 장소를 골라 보세요.');
};

// 증거 모두 수집: every clue and prop of every place is found and saved in the evidence notebook (no photo sequence).
$('#devEvidence').onclick = () => {
  let n = 0;
  PLACES.forEach(place => place.clues.forEach((clue, clueIndex) => {
    S.found[place.id].add(clueIndex);
    if(S.evidence.some(item => item.placeId === place.id && item.clueIndex === clueIndex)) return;
    S.evidence.push({ placeId:place.id, clueIndex, photo:evidencePhoto(place, clueIndex) }); n++;
  }));
  renderPlaces(); renderDock();
  if(S.investigate && S.place){ renderSceneHead(); renderScene(); }
  toast(n ? `증거 ${n}개를 노트에 기록했어요.` : '이미 모든 증거를 모았어요.');
};

// 심문 완료: skip the questioning — from anywhere in the case (every conversation and clue done first) straight to the
// silence before Fiona gives in, so the confession, the COMPLETE stamp and the review can be checked.
$('#devInterro').onclick = () => {
  if(ending?.step !== 'confront'){
    if(ending) leaveEnding();
    if(!allConversationsDone()) $('#devDone').click();
    $('#devEvidence').click();
    $('#accuse').hidden = true; $('#accused').hidden = true;
    startEnding();
  }
  clearTimeout(endTimer); stopVoice(); closeDrawer();
  endingRound = ENDING.confront.length;
  ending.step = 'confession'; ending.i = 0; ending.line = null; renderAsk(); renderSay(null);
  renderInterrogationGauge();
  setMood('fiona', 'sad');
  endTimer = setTimeout(() => ending && endingSay(fionaLine(ENDING.confession[0]), 'sad'), 1400);
};

// 튜토리얼 초기화: forget that the tutorial was seen and start over.
$('#devTut').onclick = () => { try { localStorage.removeItem(TUT_KEY); } catch(e){} location.reload(); };

// 리셋: everything this game keeps on the device (case in progress, solved cases, records, study days, tutorial) is
// forgotten and the app starts over.
$('#devReset').onclick = () => {
  saveOff = true;
  try { Object.keys(localStorage).filter(key => key.startsWith('pioo.')).forEach(key => localStorage.removeItem(key)); } catch(e){}
  location.reload();
};

/* ---------- boot ---------- */
loadGame();
renderStage(false); renderDock(); renderPlaces(); renderSceneHead();
// the app opens on the case list (tapping a case is also the tap that lets audio play)
openCaseList();
})();
</script>
