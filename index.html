// The sentence of the answer (or the question) that holds the words, with the words marked.
function grammarLine(id, qid, words){
  const s = spk(id), answer = s.answers[qid], question = qs(s).find(q => q.id === qid).en;
  const inAnswer = answer.includes(words), text = inAnswer ? answer : question;
  const parts = sentencesOf(text), idx = Math.max(0, parts.findIndex(part => part.includes(words))), sentence = parts[idx];
  const at = sentence.indexOf(words);
  return { inAnswer, idx, html:esc(sentence.slice(0, at)) + `<mark>${esc(words)}</mark>` + esc(sentence.slice(at + words.length)) };

/* ---------- home pages ----------
   홈: the detective's office (name plate), the case to play now, the lines to hear again.
   학습 (user request: 단어장 and 복습 in one, switched 단어 / 문법 / 복습): 단어 = blanks the player has written right
   (every blank once a case is solved), the line it came from plays with ▶, Korean only with 해석; 문법 = grammar cards;
   복습 = solved cases and the lines missed at the first check.
   마이: streak, totals, the how-to and the detective's name. All of it reads only what this device saved or the case in memory. */
let homeTab = 'home', studyMode = 'words';
// A question whose words and grammar count as learned: checked right in the case in memory, or any once the case is solved.
const knownQuestion = (id, qid) => solvedCases().includes(CASE.id) || per(id).questionChecks[qid] === 'ok';
function learnedWords(){
  const seen = new Map();
  PEOPLE_ORDER.forEach(id => {
    const s = spk(id);
    qs(s).forEach(q => {
      if(!knownQuestion(id, q.id)) return;
      (s.notes[q.id] || []).forEach(line => line.replace(BLANK_RE, (m, bid, ans) => {
        const key = ans.split('/')[0].toLowerCase();
        if(WORDS[key] && !seen.has(key)) seen.set(key, { word:ans.split('/')[0], key, line, bid, ref:`${id}:${q.id}`, sent:sentenceFor(s.answers[q.id], ans, line) });
        return m;
      }));
    });
  });
  // the case's phrases: heard in an answer's sentence, or in the detective's question (question: ▶ plays that)
  PHRASE_LINES.forEach(([key, ref, words]) => {
    const [id, qid] = ref.split(':');
    if(seen.has(key) || !knownQuestion(id, qid)) return;
    const s = spk(id), { inAnswer, idx } = grammarLine(id, qid, words);
    const sentence = sentencesOf(inAnswer ? s.answers[qid] : qs(s).find(q => q.id === qid).en)[idx];
    seen.set(key, { word:WORDS[key][3] || key, key, line:sentence.replace(words, `{{p|${words}}}`), bid:'p', ref, sent:idx, question:!inAnswer });
  });
  return [...seen.values()];
}
// Which sentence of the answer a note blank was heard in: one that says the word (any accepted form), the one
// sharing most words with the note line when several or none do.
function sentenceFor(answer, ans, line){
  const tokens = text => text.toLowerCase().replace(/[^a-z0-9: ]/g, ' ').split(/\s+/).filter(Boolean);
  const said = ans.split('/').map(v => new RegExp(`\\b${v.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}\\b`, 'i'));
  const lineWords = new Set(tokens(line.replace(BLANK_RE, (m, bid, a) => a.split('/')[0])));
  let best = 0, top = -1;
  sentencesOf(answer).forEach((sentence, i) => {
    const score = (said.some(re => re.test(sentence)) ? 100 : 0) + tokens(sentence).filter(w => lineWords.has(w)).length;
    if(score > top){ top = score; best = i; }
  });
  return best;
}
// A note line with its blanks filled in; the blank `mark` is highlighted.
function filledLine(line, mark){
  let html = '', last = 0;
  line.replace(BLANK_RE, (m, bid, ans, idx) => {
    const word = esc(ans.split('/')[0]);
    html += esc(line.slice(last, idx)) + (bid === mark ? `<mark>${word}</mark>` : word);
    last = idx + m.length; return m;
  });
  return html + esc(line.slice(last));
}

// Write the correct answer into every blank of the given questions; returns how many blanks were filled.
function fillAnswers(i, qids, mark){
  const p = per(i); let n = 0;
  qids.forEach(qid => spk(i).notes[qid].forEach(line =>
    line.replace(/\{\{(\w+)\|([^}]+)\}\}/g, (m, id, ans) => {
      p.notes[id] = ans.split('/')[0];
      if(mark) p.marks[id] = 'ok'; else delete p.marks[id];
      n++; return m;
    })
  ));
  return n;
}

// 증거 모두 수집: every clue of every place is found and saved in the evidence notebook (no photo sequence).
$('#devEvidence').onclick = () => {
  let n = 0;
  PLACES.forEach(place => place.clues.forEach((clue, clueIndex) => {
    if(clue.prop || place.balance || !place.spots.some(spot => spot.clue === clueIndex)) return;   // the scale's boxes are no photos
    // only the things the deduction needs (PACK.ready '@item', the violin case's) are picked up; the rest stay where
    // they are, to be found and picked up in play (user report: after 추리 완성 the Christmas scale was gone from the
    // storeroom with no picking up, and the box on the sleigh was already open with the star in the bag)
    if(clue.take && !clue.take.startsWith('!') && !(PACK?.ready || []).includes('@' + clue.take)) return;
    if(clue.take){
      S.found[place.id].add(clueIndex);
      if(clue.take.startsWith('!')) S.flags.add(clue.take.slice(1));
      else if(!S.flags.has(`took:${clue.take}`)){ S.items.push(clue.take); S.flags.add(`took:${clue.take}`); }
      if(clue.flag) S.flags.add(clue.flag);
      return;
    }
    S.found[place.id].add(clueIndex);
    if(S.evidence.some(item => item.placeId === place.id && item.clueIndex === clueIndex)) return;
    S.evidence.push({ placeId:place.id, clueIndex, photo:evidencePhoto(place, clueIndex) }); n++;
  }));
  (PACK?.ready || []).forEach(c => { if(c.startsWith('!')) S.flags.add(c.slice(1)); });

  // another case's page: its review from 학습, else the case (a new one with its key); never the case cards
  $('#caseList').hidden = true;
  if(new URLSearchParams(location.search).get('review') === '1' && solvedCases().includes(CASE_ID)) openReview(true);
  // without a detective name (리셋 on this page) the first meeting is on 홈, as when the app opens,
  // not straight into this case after the name (user request: it went into the case at once)
  else if(!PREVIEW && !detectiveName()) location.replace(location.pathname);
  else if(!PREVIEW) startCase(false);
} else {
  // the app opens on 홈 (on the case cards when coming back from another case); without a detective name, the first
  // meeting and naming come first (user request)
  openCaseList(location.hash === '#cases' ? 'cases' : 'home');
  if(!detectiveName()) meetDetective(null);
}
// a preview: its part, without the test tools' notes
if(PREVIEW){ PREVIEW_PARTS.find(([id]) => id === PREVIEW)?.[2](); $('#toast').hidden = true; }
})();
</script>
