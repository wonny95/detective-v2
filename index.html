<html lang="ko">
<head>

<title>숲속 탐정 Pioo</title>
<link rel="preload" href="assets/fonts/Paperlogy-4Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/ui/complete-stamp.png" as="image">
<style>
/* Paperlogy (SIL OFL 1.1), bundled in assets/fonts. "Paperlogy Display" = the SemiBold cut for titles, buttons and stamps,
   so those rules can keep font-weight:400. */
@font-face{font-family:"Paperlogy";src:url("assets/fonts/Paperlogy-4Regular.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Paperlogy";src:url("assets/fonts/Paperlogy-7Bold.woff2") format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Paperlogy Display";src:url("assets/fonts/Paperlogy-6SemiBold.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Paperlogy Display";src:url("assets/fonts/Paperlogy-7Bold.woff2") format("woff2");font-weight:700;font-display:swap}
/* base reset (was supplied by the artifact host) */
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}
/* like a phone app: lists and notes scroll by touch without a visible scrollbar */
*{scrollbar-width:none}
*::-webkit-scrollbar{display:none}

/* Layout: one phone-sized storybook page.
   Conversation view: the person in front of their place's illustration, notebook (Note) docked underneath.
   Part 2 (investigation): one large illustration per place to swipe around and tap for clues; notebook slides up from the Note tab. */
:root{
  --ground:#B6BDA5;
  --paper:#FBF4E6;
  --paper-2:#F4EAD4;
  --line:#E3D5B8;
  --ink:#4A3628;
  --ink-soft:#7D6A58;
  --moss:#8DB48E;
  --moss-deep:#5E8A63;
  --peach:#F6B89A;
  --honey:#F2CF73;
  --berry:#C96F86;
  --sky:#BFD3EE;
  --ok:#5E8A63;
  --no:#C25B5B;
  --f-display:"Paperlogy Display","Paperlogy",system-ui,sans-serif;
  --f-body:"Paperlogy",system-ui,sans-serif;
  --f-hand:"Paperlogy",system-ui,sans-serif;
  --r-wobble:18px 22px 16px 24px / 22px 16px 24px 18px;
  --r-wobble-2:24px 14px 22px 16px / 16px 24px 14px 22px;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--f-body);display:flex;justify-content:center;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px dashed var(--berry);outline-offset:2px}
.hidden-svg{position:absolute;width:0;height:0}

.app{position:relative;width:100%;max-width:430px;height:100%;display:flex;flex-direction:column;overflow:hidden;overflow:clip;background:var(--paper)}
@media (min-width:520px){
  body{align-items:center;padding-block:16px}
  .app{height:min(900px,calc(100% - 8px));border:0;border-radius:38px 42px 36px 44px/44px 36px 42px 38px;box-shadow:none}
}
.main{position:relative;flex:1 1 auto;min-height:0;display:flex;flex-direction:column;overflow:hidden;overflow:clip}

/* ---------- stage ---------- */
.scene{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;display:flex;flex-direction:column}
.stage-area{position:absolute;inset:0;overflow:hidden;background:var(--paper-2)}
.stage-area .art{width:var(--world-width);height:var(--world-height);transform-origin:0 0;pointer-events:none}
.art > .art-floor{display:none}
.stage-area .art-floor,.art-wrap .art > .art-floor{display:block;position:absolute;left:0;top:100%;width:100%;height:auto;pointer-events:none}
.art-wrap .art{height:calc(100% * var(--art-share, 1))}
.stage-area .spot,.stage-area .scene-npc span{display:none}
.stage-area .scene-npc{pointer-events:none}
.ask-panel{position:absolute;left:0;right:0;bottom:0;z-index:4;display:flex;flex-direction:column;gap:8px;padding:4px 16px 16px}
.ask-panel:empty{display:none}
.ask-top{display:flex;justify-content:flex-end}
.ask-panel:not(.show-ko) .ko{display:none}
.ask-panel .q{box-shadow:3px 3px 0 rgba(74,54,40,.25)}
.app.notes-open .ask-panel{display:none}
.app.investigate .scene{display:none}
.chip[hidden]{display:none}
.chip{position:absolute;top:12px;display:inline-flex;align-items:center;gap:6px;max-width:calc(100% - 192px);box-sizing:border-box;font-family:var(--f-display);font-size:13px;background:var(--paper);border:2px solid var(--ink);border-radius:var(--r-wobble);padding:4px 10px;z-index:4}
.chip.l{left:66px}
.chip-label{min-width:0;padding-block:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.map-btn{position:relative}
.map-btn:active{transform:translateY(2px);box-shadow:none}
/* a conversation under way is finished before anything else (talkLocked): the map waits, dimmed */
.app.talk-locked #mapTab{opacity:.45}
.map-btn.new .hn-ic::after{content:"";position:absolute;z-index:2;top:0;right:6px;width:12px;height:12px;border-radius:50%;background:var(--berry);border:2px solid var(--paper)}
button.chip{color:var(--ink);cursor:pointer;box-shadow:2px 2px 0 rgba(74,54,40,.2)}
button.chip:disabled{cursor:default;box-shadow:none}
.scene-npc .m-open{opacity:0}
.scene-npc.talking .m-open{opacity:1;transform-box:fill-box;transform-origin:center;animation:chat .18s ease-in-out infinite alternate}
.scene-npc.talking .m-closed{opacity:0}
@keyframes chat{from{transform:scaleY(.35)}to{transform:scaleY(1)}}
.npc-breathe,.npc-gesture{transform-box:fill-box;transform-origin:50% 100%}
.npc-breathe{animation:npc-breathe 4.8s ease-in-out infinite;animation-delay:var(--idle-delay,0s)}
.scene-npc.talking .npc-gesture{animation:npc-speak 1.7s ease-in-out infinite}
/* NPC mouths (user request): the drawn mouth is covered and a closed and an open mouth picture take turns while they
   talk (assets/characters/mouths, MOUTHS); quiet, the closed one shows */
.npc-mouth{pointer-events:none}
.npc-mouth.open{opacity:0}
.scene-npc.talking .npc-mouth.open,.det.talking .npc-mouth.open{animation:npc-mouth-open var(--talk-cycle,.74s) steps(1,end) infinite}
.scene-npc.talking .npc-mouth.closed,.det.talking .npc-mouth.closed{animation:npc-mouth-closed var(--talk-cycle,.74s) steps(1,end) infinite}
@keyframes npc-breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.008,1.012)}}
@keyframes npc-speak{0%,100%{transform:rotate(0)}28%{transform:rotate(-.35deg)}65%{transform:rotate(.3deg)}}
@keyframes npc-mouth-open{0%,43%,85%,100%{opacity:0}12%,57%{opacity:1}}
@keyframes npc-mouth-closed{0%,43%,85%,100%{opacity:1}12%,57%{opacity:0}}
.app.partner .bubble{transform-origin:70px calc(100% + 21px)}
.app.partner .bubble::after{left:70px}
/* phase title card (case start / each suspect coming in) */
.app.ending .chip{visibility:hidden}
/* the map/Note bar is gone during the ending, so the scene runs to the bottom edge */
.app.ending .nav{display:none}
.app.in-interview .spotlight{opacity:1;background:radial-gradient(ellipse 78% 70% at 50% 40%,rgba(255,225,158,.1) 0 35%,rgba(48,31,20,.15) 70%,rgba(28,23,18,.35) 100%)}
.app.interview-arriving .scene::after{content:"";position:absolute;inset:0;z-index:20;background:#30271E;animation:interview-arrive .75s ease both}
@keyframes interview-arrive{0%,15%{opacity:1}100%{opacity:0}}
@media(prefers-reduced-motion:reduce){.app.interview-arriving .scene::after{animation:none;opacity:0;pointer-events:none}}
/* a photo held up to the suspect */
.presented{position:absolute;inset:0;z-index:7;display:grid;place-items:center;pointer-events:none}
/* a wrong accusation: the person's board photo, crossed out while Badger confirms the alibi; then they leave */
.clear-card{position:absolute;right:7%;top:38%;z-index:7;pointer-events:none}
.clear-card .ded-sus{transform:scale(1.25) rotate(6deg);animation:clear-in .45s cubic-bezier(.3,1.5,.5,1) both}
.clear-card .ded-sus::after{animation:clear-x .35s ease-out .35s both}
@keyframes clear-in{from{opacity:0;transform:scale(.6) rotate(-6deg)}}
@keyframes clear-x{from{opacity:0;transform:scale(1.6)}}
.scene-npc.leaving{transition:opacity .6s ease-in,translate .6s ease-in;opacity:0;translate:18% 0}
@media(prefers-reduced-motion:reduce){.clear-card .ded-sus,.clear-card .ded-sus::after{animation:none}.scene-npc.leaving{transition:none}}
.presented figure{margin:0;width:64%;aspect-ratio:4/3;overflow:hidden;background:#FFFDF7;border:7px solid #FFFDF7;box-shadow:0 10px 24px rgba(40,30,24,.4);animation:present-in 1.3s ease forwards}
.presented svg{display:block;width:100%;height:100%}
@keyframes present-in{0%{opacity:0;transform:translateY(70px) rotate(-3deg) scale(.8)}22%{opacity:1;transform:translateY(0) rotate(-3deg) scale(1)}80%{opacity:1;transform:rotate(-3deg)}100%{opacity:0;transform:translateY(-12px) rotate(-3deg)}}
@media(prefers-reduced-motion:reduce){.presented figure{animation:none}}
/* the questioning (confront, confession): the room dims around her; the gauge fills as her claims are answered */
.spotlight{position:absolute;inset:0;z-index:3;pointer-events:none;opacity:0;transition:opacity .9s ease;
  background:radial-gradient(ellipse 66% 48% at 50% 40%,rgba(255,236,190,.12) 0 30%,rgba(34,20,10,.42) 62%,rgba(24,14,8,.82) 100%)}
.app.interrogate .spotlight{opacity:1}
/* Keep the speech bubble below the gauge only while she is questioned; confession uses the normal top spacing. */
.app.questioning .bubble.say{--bubble-top:66px}
/* the detective's own line: low on the screen with no tail (it comes from the player, off screen), honey paper and their
   face, as on the deduction board (user pick A, no tail) */
.bubble.say.det{top:auto;bottom:calc(92px + env(safe-area-inset-bottom, 0px));max-height:calc(100% - 180px);padding-left:76px;--bubble-paper:#FFF0BF;transform-origin:50% 100%}
.bubble.say.det::after{display:none}
.bubble.say .say-face{position:absolute;left:24px;top:24px;width:44px;height:44px;border-radius:50%;background:#F3E6CC;box-shadow:0 0 0 2px #fff}
.bubble.say .say-ko{display:block;margin-top:6px;padding-top:6px;font-family:var(--f-body);font-size:14px;font-weight:700;line-height:1.45;color:var(--berry)}
.bubble.say .say-ko[hidden]{display:none}
.bubble.say .say-foot{display:flex;flex:none;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:6px;margin-top:12px;padding-top:9px}
.bubble.say .say-foot .pill{position:static;border:2px solid transparent;border-image:var(--btn) 60 62 62 62 fill / var(--bw) calc(var(--bw) * 1.03) stretch;min-height:30px;padding:0 10px;font-family:var(--f-display);font-size:12px;color:var(--ink)}
.bubble.say .say-foot svg{width:9px;height:9px}
.interrogation-gauge{position:absolute;top:10px;left:50%;z-index:5;display:flex;align-items:center;width:280px;max-width:calc(100% - 48px);transform:translateX(-50%);pointer-events:none}
.app.questioning .interrogation-gauge{left:74px;right:14px;width:auto;max-width:none;transform:none}
/* Use the same flat paper artwork as the back/replay buttons. The matte pencil icon sits inside the paper;
   a separate clipped channel fills without repainting or stretching the icon and outer outline. */
.gauge-track{position:relative;flex:1;box-sizing:border-box;height:36px}
.gauge-track::before{content:"";position:absolute;inset:0;border:2px solid var(--ink);border-radius:var(--r-wobble);background:var(--paper) url(assets/ui/buttons/cream-flat.png) center/calc(100% + 64px) 400% no-repeat}
.gauge-symbol{position:absolute;left:5px;top:50%;width:34px;height:34px;object-fit:contain;transform:translateY(-50%)}
.gauge-meter{position:absolute;left:45px;right:12px;top:10px;bottom:10px;overflow:hidden;border-radius:8px 10px 7px 9px;background:#E8DCC3}
.gauge-fill{position:absolute;inset:0;background:#F2CF73 url(assets/ui/buttons/honey-flat.png) center/calc(100% + 64px) 400% no-repeat;clip-path:inset(0 calc(100% * (1 - var(--q,0))) 0 0);transition:clip-path .6s cubic-bezier(.2,.8,.3,1)}
.interrogation-gauge.hit .gauge-track{animation:gauge-hit .65s ease-out}
@keyframes gauge-hit{35%{transform:scale(1.025)}}
/* the evidence drawer: a strip of photos under her; picking one plays its sentence, 내밀기 holds it up */
.drawer{position:absolute;left:0;right:0;bottom:0;z-index:6;display:flex;flex-direction:column;gap:8px;box-sizing:border-box;max-height:calc(100% - 70px);overflow:hidden;padding:12px 0 16px;background:var(--paper);
  border-top:3px solid var(--ink);border-radius:24px 26px 0 0/20px 22px 0 0;box-shadow:0 -6px 18px rgba(34,20,10,.35);
  transform:translateY(105%);visibility:hidden;transition:transform .38s cubic-bezier(.2,.9,.3,1.05),visibility 0s linear .38s}
.drawer.open{transform:none;visibility:visible;transition:transform .42s cubic-bezier(.2,.9,.3,1.05),visibility 0s}
.app.drawer-open .ask-panel{visibility:hidden}
.drawer-head{display:flex;align-items:center;padding:0 16px}
.drawer-head h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:17px}
.drawer-head .x{margin-left:auto}
.drawer-head,.drawer-strip{flex-shrink:0}
/* Leave room inside the scroll viewport for a selected card's lift, rotation, ring and shadow. */
.drawer-strip{display:flex;gap:10px;overflow-x:auto;padding:18px 16px 16px;scroll-padding-inline:16px;scroll-snap-type:x proximity;user-select:none;-webkit-user-select:none;cursor:grab}
.drawer-strip.dragging{scroll-snap-type:none;cursor:grabbing}
.drawer-strip svg,.drawer-strip image{-webkit-user-drag:none;pointer-events:none}
.dcard{flex:none;width:104px;display:flex;flex-direction:column;gap:3px;padding:5px 5px 7px;text-align:left;scroll-snap-align:start;background:#FFFDF7;
  border:2px solid var(--ink);border-radius:5px;box-shadow:2px 3px 0 rgba(74,54,40,.15);transition:transform .2s,box-shadow .2s}
.dcard .evidence-photo{border-width:1px;border-color:var(--line);border-radius:0;margin:0}
.dcard .dlabel{font-family:var(--f-hand);font-weight:700;font-size:13px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.dcard .dplace{font-family:var(--f-body);font-size:11px;line-height:1.25;color:var(--ink-soft);overflow-wrap:anywhere}
.dcard[aria-pressed="true"]{transform:translateY(-6px) rotate(-2deg);border-color:var(--berry);box-shadow:0 0 0 3px var(--berry),3px 8px 10px rgba(74,54,40,.25)}
.drawer-pick{display:flex;flex-direction:column;gap:8px;min-height:0;overflow-y:auto;padding:0 16px}
.drawer-pick .pill{flex-shrink:0}
.drawer-pick p{margin:0;font-size:15px;line-height:1.45}
.drawer-pick p.ko{font-size:13.5px;font-weight:700;color:var(--berry)}
/* ▶ and 해석 under the sentence, the same pair as in the speech bubbles (user request) */
.drawer-row{display:flex;align-items:center;gap:8px}
.drawer .empty-note{padding:0 16px}
/* photos or statements (user pick A): two tabs beside the title */
.drawer-tabs{display:flex;gap:6px;margin-left:12px}
.drawer-tabs .pill.sm{box-sizing:border-box;min-height:30px;height:30px;padding:0 12px;font-size:13px}
/* a statement: what the player wrote down for a checked question, on a lined slip with the speaker's face */
.scard{flex:none;width:118px;display:flex;flex-direction:column;gap:4px;padding:8px 8px 9px;text-align:left;scroll-snap-align:start;color:var(--ink);
  background:#FFFDF2 repeating-linear-gradient(transparent 0 17px,rgba(120,150,190,.35) 17px 18px) 0 34px/100% auto no-repeat;
  border:2px solid var(--ink);border-radius:3px 8px 4px 6px;box-shadow:2px 3px 0 rgba(74,54,40,.15);transform:rotate(-1.2deg);transition:transform .2s,box-shadow .2s}
.scard:nth-child(even){transform:rotate(1deg)}
.scard .who{display:flex;align-items:center;gap:6px;font-family:var(--f-display);font-size:12.5px;line-height:1.1}
.scard .say{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:4;overflow:hidden;font-family:var(--f-hand);font-weight:700;font-size:12.5px;line-height:18px}
.scard[aria-pressed="true"]{transform:translateY(-6px) rotate(-2deg);box-shadow:0 0 0 3px var(--berry),3px 8px 10px rgba(74,54,40,.25)}
.say-face{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--ink);background:#FFF8E9 center/88% no-repeat}
.drawer-pick .who-says{font-family:var(--f-display)}
/* a statement held up: the slip instead of a photo */
.presented figure.say{aspect-ratio:auto;display:flex;flex-direction:column;gap:8px;padding:12px 14px 14px;box-sizing:border-box;border:2px solid var(--ink);border-radius:4px 10px 6px 8px;
  background:#FFFDF2 repeating-linear-gradient(transparent 0 25px,rgba(120,150,190,.35) 25px 26px) 0 52px/100% auto no-repeat}
.presented figure.say .who{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-size:16px}
.presented figure.say .say-face{width:40px;height:40px}
.presented figure.say p{margin:0;font-family:var(--f-hand);font-weight:700;font-size:17px;line-height:26px;color:var(--ink)}
/* holding up a photo: the right one gets a red 모순! stamp, the scene jolts and she flinches; a wrong one wobbles and drops */
.presented .contra{position:absolute;left:50%;top:48%;font-family:var(--f-display);font-size:34px;letter-spacing:2px;color:#B8433F;border:5px solid #B8433F;border-radius:12px;padding:0 14px;background:rgba(255,253,247,.75);white-space:nowrap;animation:contra 1.3s ease forwards}
@keyframes contra{0%,28%{opacity:0;transform:translate(-50%,-50%) rotate(-12deg) scale(2.4)}40%{opacity:1;transform:translate(-50%,-50%) rotate(-12deg) scale(1)}82%{opacity:1;transform:translate(-50%,-50%) rotate(-12deg) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) rotate(-12deg) scale(1)}}
.presented.miss figure{animation:present-miss 1.3s ease forwards}
@keyframes present-miss{0%{opacity:0;transform:translateY(70px) rotate(-3deg) scale(.8)}22%{opacity:1;transform:translateY(0) rotate(-3deg) scale(1)}30%{transform:translateX(-12px) rotate(-7deg)}38%{transform:translateX(10px) rotate(2deg)}46%{transform:translateX(-6px) rotate(-5deg)}56%{opacity:1;transform:rotate(-3deg)}100%{opacity:0;transform:translateY(140px) rotate(10deg) scale(.85)}}
.scene.jolt #talkCamera{animation:jolt .42s ease-out}
@keyframes jolt{15%{translate:-7px 3px}35%{translate:6px -3px}55%{translate:-4px 2px}75%{translate:2px -1px}100%{translate:0 0}}
.scene-npc.flinch svg{animation:flinch .5s ease-out}
@keyframes flinch{20%{translate:6px 0;scale:.96 1.03}45%{translate:-4px 0}100%{translate:0 0;scale:1}}
@media(prefers-reduced-motion:reduce){.presented .contra,.presented.miss figure,.scene.jolt #talkCamera,.scene-npc.flinch svg,.interrogation-gauge.hit .gauge-track{animation:none}.drawer,.gauge-fill{transition:none}}
.stage-card{position:absolute;inset:0;z-index:8;display:grid;place-items:center;background:rgba(74,54,40,.38);pointer-events:none;animation:stage-card 1.9s ease forwards}
.stage-card div{background:var(--paper);border:3px solid var(--ink);border-radius:var(--r-wobble);padding:12px 22px;text-align:center;box-shadow:4px 5px 0 rgba(74,54,40,.25)}
.stage-card small{display:block;font-size:12px;color:var(--ink-soft)}
.stage-card b{display:block;font-family:var(--f-display);font-weight:400;font-size:24px}
@keyframes stage-card{0%{opacity:0}12%{opacity:1}78%{opacity:1}100%{opacity:0}}
.pill.blue{background:var(--sky);color:var(--ink)}

/* Reusable illustrated skin: nine-slice body, independent tail, live text and controls.
   Keep corner pixels fixed as dialogue grows; long copy scrolls while the controls stay visible. */
.bubble{--bubble-top:44px;--bubble-frame:url(assets/ui/speech-paper-frame.png);--bubble-tail:url(assets/ui/speech-paper-tail-pencil.png);position:absolute;left:50%;top:var(--bubble-top);transform:translateX(-50%);z-index:5;display:flex;flex-direction:column;box-sizing:border-box;width:min(88%,380px);max-width:calc(100% - 32px);max-height:calc(100% - var(--bubble-top) - 112px);padding:24px 20px;font-family:var(--f-hand);font-size:17px;line-height:1.42;color:var(--ink);filter:drop-shadow(2px 4px 2px rgba(52,32,17,.2));transform-origin:50% calc(100% + 21px);animation:bubble-pop .42s cubic-bezier(.3,1.45,.5,1) both}
/* Opaque paper behind the translucent image slices prevents hairline seams inside the frame. */
.bubble::before{content:"";position:absolute;inset:0;z-index:-1;background-color:var(--bubble-paper,#FFF8E9);background-clip:padding-box;border:20px solid transparent;border-image:var(--bubble-frame) 150 190 fill / 33px 42px / 0 stretch;pointer-events:none}
/* Keep the tail asset's transparent safety margin and aspect ratio, including the complete pencil-drawn V tip. Its open
   top (3.6px down in the 48×30 box) lays its paper over the bubble's bottom outline (the last ~5px), so the two join. */
.bubble::after{content:"";position:absolute;left:50%;bottom:-21px;width:48px;height:30px;transform:translateX(-50%);background:var(--bubble-tail) center/contain no-repeat;pointer-events:none}
.bubble-copy{min-height:0;overflow-y:auto;overscroll-behavior:contain;overflow-wrap:anywhere}
.bubble .tag{display:block;font-family:var(--f-display);font-size:11px;line-height:1.4;color:var(--berry);margin-bottom:6px;letter-spacing:.02em}
.bubble .say-en{display:block}
#bubble .tag{padding-right:22px}
.bubble .bubble-close{position:absolute;top:10px;right:10px;display:grid;place-items:center;width:28px;height:28px;border:0;background:none;font-size:20px;line-height:1;padding:0;color:var(--ink-soft)}
/* Every speech bubble comes out the same way (user request): it pops up from the tip of its tail with a little
   overshoot, then the words and buttons rise in one after another (.bubble, .office-say, and .oh-say on 홈). A bubble
   shown again (hidden, then shown) plays it again. */
@keyframes bubble-pop{from{opacity:0;transform:translateX(-50%) scale(.3)}40%{opacity:1}}

@media(prefers-reduced-motion:reduce){.bubble,.app.partner .bubble,.bubble *,.office-say,.office-say *,.oh-say.pop,.oh-say.pop *,.oh-say.closing,.office-det.hop svg,.oh-det.hop svg{animation:none}}

/* ---------- docked notebook (Note) ---------- */
/* Note = a notebook the detective pulls up from the bottom (sketch 3) */
/* The case-file picture (assets/ui/casefile-panel.webp: navy folder with one cream sheet, header strip
   at the top, paper clip top right) is scaled to the panel width, so the padding and the header height
   are % of the width (padding % always refers to width): sheet top 7.9%, header strip 13.6%, sheet
   from 6.5% to 93.8%. */
.dock{position:absolute;left:6px;right:6px;bottom:-4px;height:60%;z-index:11;container-type:inline-size;display:flex;flex-direction:column;box-sizing:border-box;padding:7.9% 9% 0 9.5%;transform:translateY(calc(100% + 48px));transition:transform .55s cubic-bezier(.2,.9,.3,1.05),height .5s cubic-bezier(.3,.9,.3,1)}
/* the picture is a ::before layer so the index tabs (z-index -1) can sit behind it and peek over the folder */
.dock::before{content:"";position:absolute;inset:0;z-index:0;background:url(assets/ui/casefile-panel.webp) top center/100% auto no-repeat;pointer-events:none}
.dock-head,.dock-body{position:relative;z-index:1}
.app.notes-open .dock{transform:translateY(0)}
.app.investigate .dock{height:80%}
.dock-head{flex:none;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:6px 8px;aspect-ratio:81.5 / 13.6;padding:0 2px}
.dock-head h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:18px;display:flex;align-items:center;gap:6px}
.dock-head h2 svg{width:24px;height:24px}
.dock-head h2[hidden]{display:none}
#personTitle{min-width:0}
#personTitle span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dock-head h2 img{flex:none;width:28px;height:28px;display:block}
/* 기록 완료 (and 계속 / 닫기 / 다시 확인): the one strong button, under the page (user decision: the head holds only the
   listening tools). While writing down, it stays pale until every blank has something (.wait), and still says
   what is missing when pressed */
.dock-foot{position:relative;z-index:1;flex:none;padding:4px 2px 22px}
.dock-foot:has(> .finish[hidden]){display:none}
.dock-foot .finish{width:100%;min-height:46px;justify-content:center;font-size:16px;transition:filter .2s,opacity .2s}
.dock-foot .finish.wait{filter:grayscale(.85) brightness(1.08);opacity:.55}
/* behind the open notebook the scene darkens toward the bottom, so the notebook stands out from
   warm floors while the NPC's face at the top stays clear */
.note-scrim{position:absolute;inset:0;z-index:10;opacity:0;pointer-events:none;transition:opacity .45s;background:linear-gradient(to bottom,rgba(43,30,20,0) 25%,rgba(43,30,20,.45) 75%)}
.app.notes-open .note-scrim{opacity:1;pointer-events:auto}
.app.notes-open .chip,.app.notes-open .bubble{z-index:12}
/* three fixed tabs — 인물 · 증거 · 메모 (user decision: one tab per person overflowed as the cast grew). A stamp each (the row
   is narrow): brown ink when closed, the memo's blue ink with a little tilt when open (user decision).
   Divider sheets behind the note's page (user decision: tabs on the folder's blue band looked apart from the paper):
   every tab comes out from under the page's top edge, the open one is the page itself. The closed ones are kraft paper, a shade darker each one further back; the page's own top edge (assets/ui/casefile-paper-edge.png, cut from the
   picture: the paper and only the last two rows of its pencil line, so a closed tab meets the paper at a thin line, not the
   thick edge drawn against the folder (user request: no gap under the tabs); .note-edge) is laid again over their feet
   with a faint shadow up onto them. The open one sits above that strip, open at the bottom (tab-N.png, its slightly grey last
   rows pushed below) and fading into the cream past the pencil line, so the page's edge runs into its sides with no seam.
   Layers inside the dock: picture < closed tabs < .note-edge < open tab < head and body. The PNG masks the tab's face and
   is multiplied over its colour, keeping the pencil outline; the button carries the shadow. The foot is at 9.5% of the
   dock's width (margin %): the picture's pencil line runs at 6.7–7.6%, the strip from 5.5% to 11.5%. */
.note-cats{position:absolute;bottom:100%;margin-bottom:-9.5%;left:7%;display:flex;gap:5px;align-items:flex-end;transition:opacity .25s}
.app.record-lock .note-cats{opacity:0;pointer-events:none}
.ncat{--tab:url(assets/ui/tab-1.png);position:relative;flex:none;display:block;width:58px;height:44px;padding:0;border:0;background:none;filter:drop-shadow(0 1px 1.2px rgba(30,24,20,.3))}
.ncat:nth-child(2){--tab:url(assets/ui/tab-2.png)}
.ncat:nth-child(3){--tab:url(assets/ui/tab-3.png)}
.ncat .face{position:absolute;inset:0;display:grid;place-items:center;padding-bottom:6px;background:#DCCCA8;
  -webkit-mask:var(--tab) center/100% 100% no-repeat;mask:var(--tab) center/100% 100% no-repeat}
.ncat:nth-child(2) .face{background:#D5C39C}
.ncat:nth-child(3) .face{background:#CFBD96}
.ncat .face::before{content:"";position:absolute;inset:0;background:var(--tab) center/100% 100% no-repeat;mix-blend-mode:multiply;pointer-events:none}
.ncat .stamp{position:relative;display:grid;place-items:center;color:#7A5C47;opacity:.62;filter:url(#inky);mix-blend-mode:multiply;transition:opacity .2s,transform .25s cubic-bezier(.3,1.6,.5,1)}
.ncat .stamp svg{display:block;width:24px;height:24px}
.ncat[aria-pressed="true"]{z-index:1;height:52px;filter:none}
.ncat[aria-pressed="true"] .face{padding-bottom:7px;background:#FCFAED;
  -webkit-mask:var(--tab) top/100% 112% no-repeat,linear-gradient(#000 calc(100% - 5px),transparent);-webkit-mask-composite:source-in;
  mask:var(--tab) top/100% 112% no-repeat,linear-gradient(#000 calc(100% - 5px),transparent);mask-composite:intersect}
.ncat[aria-pressed="true"] .face::before{background-position:top;background-size:100% 112%;
  -webkit-mask:linear-gradient(#000 calc(100% - 2.2cqw),transparent 0);mask:linear-gradient(#000 calc(100% - 2.2cqw),transparent 0)}
.ncat[aria-pressed="true"] .stamp{color:#34506E;opacity:.92;transform:rotate(-6deg)}
.note-edge{position:absolute;left:0;right:0;top:0;margin-top:5.4945%;aspect-ratio:728 / 44;background:url(assets/ui/casefile-paper-edge.png) 0 0/100% 100% no-repeat;
  filter:drop-shadow(0 -.5px .8px rgba(40,28,18,.22));pointer-events:none}
.ncat .badge{position:absolute;top:3px;right:4px;min-width:16px;height:16px;padding:0 4px;box-sizing:border-box;border-radius:8px;background:var(--berry);color:#fff;font-size:10px;line-height:16px;text-align:center;animation:ncat-pop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes ncat-pop{from{transform:scale(0)}}
/* the person page: known speakers as a sideways row under the title; mouse drag and touch swipe reveal later faces */
.nfaces{flex:none;display:flex;gap:4px;overflow-x:auto;overscroll-behavior-x:contain;touch-action:pan-x;scrollbar-width:none;padding:0 2px 6px;margin:-4px -2px 0;border-bottom:2px dashed var(--line);cursor:grab;user-select:none;-webkit-user-select:none}

.nface{flex:none;width:60px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px 5px;border:2px solid transparent;border-radius:12px;background:none;font-family:var(--f-display);font-size:10.5px;line-height:1.15;color:var(--ink-soft);text-align:center}

.nface .pic i{position:absolute;right:-6px;bottom:-3px;display:grid;place-items:center;min-width:19px;height:19px;padding:0 3px;box-sizing:border-box;border-radius:10px;background:#FFFDF7;border:1.5px solid var(--ink);font-style:normal;font-size:9.5px;color:var(--ink)}

.nb-pin{display:inline-grid;place-items:center;width:30px;height:30px;padding:0;border:0;border-radius:50%;background:#FFFDF7;box-shadow:inset 0 0 0 1.5px var(--line);color:var(--ink-soft);vertical-align:middle;transition:background .2s,box-shadow .2s,transform .1s}
/* the pin icon (#pinIcon): a round head, a short needle (user request: a long needle wasn't cute). Off: grey outline lying
   tilted on a cream dot; on: standing on a honey dot, berry head with a shine (--pin-head/--pin-shine reach into <use>) */
.nb-pin svg{width:19px;height:19px;overflow:visible;opacity:.65;transform:rotate(38deg);transition:transform .2s ease-out,opacity .2s}
.nb-pin.on{background:var(--honey);box-shadow:inset 0 0 0 1.5px var(--ink);color:var(--ink);--pin-head:var(--berry);--pin-shine:#FFF4F0}

.memo-page{flex:1;display:flex;flex-direction:column;gap:8px}
.memo-pin{position:relative;display:flex;gap:10px;align-items:flex-start;padding:8px 34px 8px 10px;background:#FFF6DE;border:1.5px solid #E6C77A;border-radius:10px;font-family:var(--f-hand);font-size:14px;line-height:1.45;transform:rotate(var(--r,0deg))}
.memo-pin .mini{display:block;width:30px;height:30px;border-width:1.5px}

.pin-note{display:block;width:100%;box-sizing:border-box;min-height:calc(1.45em + 6px);margin:6px 0 0;padding:4px 0 0;border:0;border-top:1.5px dashed #E6C77A;border-radius:0;outline:none;resize:none;overflow:hidden;field-sizing:content;
  background:transparent;font-family:var(--f-hand);font-size:15px;line-height:1.45;color:#34506E}

.memo-text{flex:1;width:100%;min-height:240px;box-sizing:border-box;resize:none;border:0;outline:none;padding:0 4px;background:transparent repeating-linear-gradient(transparent 0 32px,var(--line) 32px 34px);background-attachment:local;
  font-family:var(--f-hand);font-size:16px;line-height:34px;color:#34506E}

.dock .note-page{background:none;border:0;border-radius:0;padding-left:0;padding-right:0}

.spd{flex:none;height:32px;min-width:48px;padding:0 10px;border:1.5px solid #CDBFA4;border-radius:16px;background:none;font-family:var(--f-display);font-size:13px;color:var(--ink-soft)}

.listen .hint{position:relative;flex:none;display:grid;place-items:center;width:36px;height:36px;margin-left:auto;padding:0;border:0;border-radius:50%;background:none}

.listen .hint .n{position:absolute;right:0;bottom:2px;min-width:16px;height:16px;padding:0 4px;box-sizing:border-box;border-radius:8px;background:var(--ink);color:#FFFDF7;font-family:var(--f-display);font-size:10px;line-height:16px;text-align:center}

.note-page{position:relative}

.app.note-full .dock{height:calc(100% - 50px)}

.type-bar{position:absolute;left:0;right:0;bottom:var(--kb,0px);z-index:13;height:46px;display:none;align-items:center;gap:6px;padding:0 8px;box-sizing:border-box;background:var(--paper-2);border-top:1.5px solid #D8C7A6}

/* the case's photo (CASES[].photo): the culprit's mugshot (a height chart, the picture with its body at --cx of its width

@keyframes rv-star{from{opacity:0;transform:scale(2.2) rotate(-20deg)}to{opacity:1;transform:none}}
/* 사건 요약 (user decision: A, a lined memo; the case is solved, so the review may tell it) */
.rv-story{padding:12px 14px 10px;background:#FFFDF7 repeating-linear-gradient(to bottom,transparent 0 23px,rgba(125,106,88,.16) 23px 24px) 0 9px;border:2px solid var(--line);border-radius:12px;font-size:14px;line-height:24px}
.rv-story h3{margin:0 0 2px;font-family:var(--f-display);font-weight:400;font-size:14px;color:var(--berry)}
.rv-story p{margin:0}
.rv-tiles{display:flex;flex-direction:column;gap:7px}
/* one under another (user request), the name on the left and the number on the right */
.rv-tiles div{display:flex;align-items:center;gap:10px;padding:9px 14px;background:#FFFDF7;border:2px solid var(--line);border-radius:12px;font-family:var(--f-display);font-size:15px;color:var(--ink)}
.rv-tiles b{margin-left:auto;font-family:var(--f-display);font-weight:400;font-size:19px;color:var(--ink)}
.rv-tiles b small{font-size:13px;color:var(--ink-soft)}
.rv-tiles .hot{border-color:#E6C46A;background:#FFF7DE}
/* the line to hear again, kept plain (user request): the question on its own line, then one card with the answer's ▶ and
   천천히 on the right and the note's line(s) with the blanks; no speaker, no first answers, no sentences */
.rv-q{margin:0;font-family:var(--f-display);font-size:17px}
.rv-quiz{padding:12px 14px;background:#FFFDF7;border:2px solid var(--line);border-radius:12px}
.rv-play{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-bottom:4px}
.rv-quiz .nline{font-size:17px;line-height:2}
.rv-slot{display:inline-block;box-sizing:border-box;min-width:4.5em;height:28px;margin:0 2px;padding:0 8px;vertical-align:middle;border:0;border-radius:8px;background:rgba(125,106,88,.17);font:inherit;font-weight:700;line-height:28px;color:#34506E;text-align:center}
.rv-slot.hit{background:rgba(94,138,99,.18);color:var(--ok)}
.rv-slot.miss{animation:ink-miss .55s ease-out both}
.rv-quiz .got{font-weight:700;color:var(--ok)}
/* 이번 사건의 열쇠: the case's key grammar on a whole page before the briefing (user request: not a pop-up), one form a
   page; each example's Korean behind its own 해석 (user request: beside its ▶). User decision (mockup B-2): graph paper, the key on a
   card pinned with the red tack, the examples on three taped notes, each with ▶. The paper, notes and tape are
   hand-drawn (assets/ui/casekey/, user request: in the game's illustration style), the buttons the game's own. */
.ck-top{flex:none;display:flex;align-items:center;gap:10px;min-height:42px;padding-top:10px}
/* the page's title sits under the case name in the top bar (user request), not on the pinned card */
.ck-head{display:flex;flex-direction:column;gap:2px;min-width:0}
.ck-top small{font-family:var(--f-display);font-size:13px;color:var(--berry)}
.ck-top .close-button{margin-left:auto}
.ck-key{display:flex;flex-direction:column;gap:4px}
.ck-key .gpattern{margin:0;font-family:var(--f-hand);font-weight:700;font-size:24px;line-height:1.2}
.ck-key .ck-name{font-family:var(--f-display);font-size:14px;color:var(--ink-soft)}
.ck-key .gko{margin:0;font-size:14px;line-height:1.6}
#caseKey{background:linear-gradient(rgba(250,242,222,.4),rgba(250,242,222,.4)),#F8EED7 url(assets/ui/casekey/graph-paper.webp) 0 0/176px 176px repeat}
#caseKey .mcard.review{background:none}
/* which page: a row of dots above the buttons (user decision: at the bottom, dots), the page shown in honey */
.ck-dots{flex:none;display:flex;justify-content:center;align-items:center;gap:9px;margin-bottom:-4px}
.ck-dots i{width:8px;height:8px;border-radius:50%;background:rgba(74,54,40,.22);transition:background .2s,transform .2s}
.ck-dots i.now{background:#E0A526;transform:scale(1.3)}
#caseKey .rv-body{gap:0;padding:0 6px 12px}
.ck-card{position:relative;display:flex;flex-direction:column;gap:8px;margin:22px 6px 0;padding:8px 8px 4px;border:12px solid transparent;border-image:url(assets/ui/casekey/card.webp) 20 fill / 12px stretch;filter:drop-shadow(2px 4px 4px rgba(70,50,30,.2));transform:rotate(-1.5deg)}
.ck-card::before{content:"";position:absolute;left:50%;top:-28px;width:24px;height:33px;margin-left:-9px;background:url(assets/ui/tack-red.webp) center/100% no-repeat}
.ck-notes{display:flex;flex-direction:column;gap:14px;margin:22px 4px 0}
.ck-note{--note:url(assets/ui/casekey/note-yellow.webp);position:relative;display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:2px 6px;margin:0;padding:3px 0 3px 4px;font-family:var(--f-hand);font-size:17px;line-height:1.35;border:11px solid transparent;border-width:11px 26px 11px 11px;border-image:var(--note) 22 54 22 22 fill / 11px 26px 11px 11px stretch;filter:drop-shadow(1px 3px 3px rgba(70,50,30,.18))}
.ck-note:nth-child(3n+1){transform:rotate(1.2deg);margin-right:20px}
.ck-note:nth-child(3n+2){--note:url(assets/ui/casekey/note-blue.webp);transform:rotate(-1deg);margin-left:20px}
.ck-note:nth-child(3n){--note:url(assets/ui/casekey/note-pink.webp);transform:rotate(.8deg);margin-right:8px}
.ck-note::before{content:"";position:absolute;left:50%;top:-19px;width:58px;height:18px;margin-left:-29px;background:url(assets/ui/casekey/tape.webp) center/100% 100% no-repeat;opacity:.92;transform:rotate(-3deg)}
.ck-note:nth-child(3n+2)::before{transform:rotate(4deg)}
.ck-note mark{background:linear-gradient(transparent 55%,rgba(201,111,134,.35) 55%);color:inherit}
.ck-note .replay-q{grid-row:1;grid-column:2;width:32px;height:32px;margin:0}
/* the round play button: the case key's, and the speech bubbles' 다시 듣기 (user decision: same form, ▶ in a round cream
   button beside a 해석 pill) */
#caseKey .replay-q,.play-btn{border:0;background:url(assets/ui/icons/play.png) 58% 50%/46% auto no-repeat,url(assets/ui/buttons/round-cream.png) center/100% no-repeat}
#caseKey .replay-q:active,.play-btn:active{transform:translateY(1px)}
#caseKey .replay-q svg{display:none}
.play-btn{flex:none;width:32px;height:32px;padding:0}
/* a small pill beside a ▶ (해석, 천천히, 담기) is as tall as the ▶ (user request: 32px) */
.ck-note .pill.sm,.office-foot .pill.sm,.bubble.say .say-foot .pill.sm,.deduce-q-row .pill.sm,.drawer-row .pill.sm,.rv-word .pill.sm,.rv-play .pill.sm{box-sizing:border-box;min-height:32px;height:32px;padding:0 10px}
.ck-note .pill.sm{grid-row:1;grid-column:3}
.ck-note:not(.ko-on) .ko{display:none}
.ck-note .ko{grid-column:1 / -1;font-family:var(--f-body);font-size:12.5px;font-weight:700;color:var(--berry)}
.ck-turn{animation:ck-turn .35s ease-out}
@keyframes ck-turn{from{opacity:0;transform:translateX(16px)}}
@media(prefers-reduced-motion:reduce){.ck-turn{animation:none}}
.ck-foot{display:flex;gap:8px}
.ck-foot .pill:not(.big){flex:none;min-height:50px;padding:0 18px}
.ck-foot .pill.big{flex:1;width:auto}
.ck-key .gpattern{padding-right:44px;font-family:var(--f-display);font-weight:400;font-size:44px;line-height:1.05;text-wrap:balance}
.ck-key .ck-name{font-size:12px}
/* the form's ▶ is pinned to the card's top right corner (user request), clear of the form however it wraps */
.ck-key .gpattern .replay-q{position:absolute;top:2px;right:2px;width:34px;height:34px;margin:0}
.rv-wsec{margin:4px 0 -4px;font-family:var(--f-display);font-weight:400;font-size:14px;color:var(--ink-soft)}
.rv-word{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:8px;padding:8px 10px;background:#FFFDF7;border:2px solid var(--line);border-radius:12px}
.rv-word.kept{border-color:#9FBF9F;background:#F2F7EC}
.rv-word .wword{font-family:var(--f-hand);font-weight:700;font-size:17px}
.rv-word .wsay{display:block;font-size:12px;color:var(--ink-soft)}
.rv-word .wko{display:block;margin-top:3px;font-size:13px;color:var(--berry)}
.rv-word .keep[aria-pressed="true"]{--btn:url(assets/ui/buttons/sage-flat.png)}
/* the case's grammar in the same rows (user request), with more room around and inside them (user request) */
.rv-grams{display:flex;flex-direction:column;gap:12px;margin-top:4px}
/* the case's grammar in the same rows (user request): the form and its short name, a line from the case with the form
   marked, ▶ (that sentence) and 해석 (its Korean, in the row) on the right beside each other */
.rv-gram{align-items:start;column-gap:10px;padding:14px 14px 15px 16px}
.rv-gram .play-btn,.rv-gram .pill{margin-top:2px}
/* the form's meaning on its own line under the form (user request) */
.rv-gram .wword small{display:block;margin-top:2px;font-family:var(--f-body);font-weight:400;font-size:13px;color:var(--ink-soft)}
.rv-gram .gsent{display:block;margin-top:8px;font-size:15px;line-height:1.5}
.rv-gram .wko{margin-top:6px}
.rv-gram mark{background:linear-gradient(transparent 58%,rgba(242,207,115,.6) 58%);color:inherit}
/* evidence notebook: two photos per row so several fit on screen at once */
/* the list: two photo cards per row, each with only its name and where it was found; a card opens it */
.evidence-page{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 10px;align-items:stretch}
.evidence-page .empty-note,.evidence-page .evidence-detail{grid-column:1 / -1;margin:0}
.ev-card{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:0;box-sizing:border-box;text-align:left;padding:6px 6px 8px;background:#FFFDF7;border:2px solid var(--ink);border-radius:5px;box-shadow:2px 3px 0 rgba(74,54,40,.12)}
.ev-card:active{transform:translateY(1px);box-shadow:1px 1px 0 rgba(74,54,40,.12)}
.ev-card .evidence-photo{margin-bottom:3px;border-width:1px;border-color:var(--line);border-radius:0}
/* every title keeps two lines' room (longer ones end in …), so all cards and their photos line up */
.ev-card .ev-title{align-self:stretch;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;min-height:2.4em;font-family:var(--f-hand);font-weight:700;font-size:15px;line-height:1.2}
.ev-card .place{font-size:11px;color:var(--ink-soft)}
/* one piece of evidence: the photo, the detective's sentence (played on opening, the play button again), 해석, and 내밀기 in the ending */
.evidence-detail{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.ev-back{border:0;background:none;padding:2px 0;font-family:var(--f-display);font-size:14px;color:var(--ink-soft)}
.dock-head .ev-back{justify-self:start;min-height:36px}
.evidence-photo{display:block;align-self:stretch;margin:0 0 2px;aspect-ratio:4/3;overflow:hidden;border:2px solid var(--ink);border-radius:6px;background:var(--paper-2)}
.evidence-photo svg{display:block;width:100%;height:100%}
.evidence-detail .place{font-size:12px;color:var(--ink-soft)}
.evidence-detail h4{margin:0;font-family:var(--f-hand);font-size:20px;line-height:1.2}
.evidence-detail p{margin:0;font-size:16px;line-height:1.5}
.evidence-detail .ko{font-size:14px;font-weight:700;color:var(--berry)}
.ev-btns{display:flex;flex-wrap:wrap;gap:5px;margin-top:auto}
.capture-flash{position:absolute;inset:0;z-index:7;background:#fff;pointer-events:none;animation:shutter-flash .38s ease-out forwards}
.capture-view{position:absolute;inset:0;z-index:6;display:grid;place-items:center;background:rgba(30,28,24,.72);overflow:hidden}
.capture-frame{width:calc(100% - 32px);max-width:520px;aspect-ratio:4/3;border:3px solid #FFFDF7;border-radius:6px;overflow:hidden;box-shadow:0 8px 28px #0005;animation:evidence-zoom .45s ease-out both}
.capture-frame svg{display:block;width:100%;height:100%;background:var(--paper)}
@keyframes evidence-zoom{from{transform:scale(.6);opacity:.3}to{transform:scale(1);opacity:1}}
@keyframes shutter-flash{0%{opacity:0}15%{opacity:.78}100%{opacity:0}}
@media(prefers-reduced-motion:reduce){.capture-flash{animation:none;opacity:0}}
@media(prefers-reduced-motion:reduce){.capture-frame{animation:none}}

.choices{border:2.5px solid var(--ink);border-radius:var(--r-wobble-2);background:#EAF2E2;padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px;animation:rise .35s cubic-bezier(.3,1.2,.5,1)}
@keyframes rise{from{transform:translateY(16px);opacity:0}}
.choices .say{font-family:var(--f-display);font-size:14px;display:flex;align-items:center;gap:6px}
.choices .say .pill{margin-left:auto}
.choices:not(.show-ko) .ko{display:none}
/* a question: the English only, no number (user decision A: the asked ones leave, so numbers skipped) */
.q{width:100%;display:block;text-align:left;background:#FFFDF7;border:2px solid var(--ink);border-radius:var(--r-wobble);padding:10px 14px;box-shadow:2px 3px 0 rgba(74,54,40,.18)}
.q:active{transform:translateY(2px);box-shadow:none}
.q .en{display:block;font-family:var(--f-hand);font-weight:700;font-size:16px;line-height:1.1}
.q .ko{display:block;font-size:12px;color:var(--ink-soft);margin-top:2px}

.listen{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--ink);background:var(--paper);border-radius:var(--r-wobble);padding:6px 12px;font-family:var(--f-display);font-size:14px;box-shadow:2px 3px 0 rgba(74,54,40,.2);transition:transform .1s}
.pill:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(74,54,40,.2)}
.pill svg{width:16px;height:16px;flex:none}
.pill.sm{padding:3px 10px;font-size:12px}
.pill[aria-pressed="true"]{background:var(--sky)}
/* 힌트 (user decision): writes the right word into the first empty or wrong blank of the question being written down;
   acorns left for the whole case beside the word. A hinted blank is tinted honey until it is checked. */
.blank.hint{background-color:rgba(242,207,115,.5);color:#7A5A12}
.pill:disabled{opacity:.5;cursor:default}

.note-page{background-color:#FFFDF7;background-image:linear-gradient(to right,transparent 30px,rgba(201,111,134,.45) 30px 32px,transparent 32px);border:2px solid var(--ink);border-radius:var(--r-wobble-2);padding:8px 12px 10px 42px;display:flex;flex-direction:column;gap:6px}
.nblock{border-radius:10px;padding:2px 10px}
.nblock .qlabel{display:block;font-family:var(--f-display);font-size:14px;color:var(--ink-soft);padding:6px 0 8px}
.question-state{display:inline-flex;align-items:center;gap:4px;margin:6px 0 2px;padding:2px 8px;border-radius:12px;font-family:var(--f-display);font-size:12px;line-height:1.5}
.question-state.ok{background:#E8EFDD;color:#466249}
.question-state.review{background:#F8EAC4;color:#816124}
/* grammar chips under a checked question (note, review, word book) and the grammar card they open */
.ptoggle{display:inline-flex;align-items:center;gap:4px;min-height:28px;margin:4px 0 2px;padding:0 2px;border:0;background:none;font-family:var(--f-display);font-size:13px;color:var(--ink-soft)}
.ptoggle::after{content:"▾";font-size:11px}
.ptoggle[aria-pressed="true"]::after{content:"▴"}
/* the answer the person said, shown once the question is checked; grammar words are links to their card */
.npassage{display:flex;flex-direction:column;gap:6px;margin:2px 0 4px;padding:8px 10px;border:1.5px dashed var(--line);border-radius:10px;background:rgba(255,253,247,.75);font-size:15px;line-height:1.65}
.npassage[hidden]{display:none}
.npassage p{margin:0}
.npassage .np-ko{padding-top:6px;border-top:1.5px dashed var(--line);font-size:14px;line-height:1.5;color:var(--berry);font-weight:700}
.np-actions{display:flex;align-items:center;justify-content:flex-end;gap:8px}
.np-actions .replay-q{flex:none;margin:0;width:30px;height:30px}
.gmark{display:inline;margin:0;padding:0 1px;border:0;border-bottom:1.5px solid #C9952E;border-radius:0;background:linear-gradient(transparent 58%,rgba(242,207,115,.55) 58%) no-repeat 0 0/100% 100%;font:inherit;color:inherit}
.gcard .gpattern{margin:0;font-family:var(--f-hand);font-weight:700;font-size:24px;line-height:1.2}
.gcard-head,.accuse-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.gcard .gko{margin:0;font-size:14px;line-height:1.6}
.gex{display:flex;flex-direction:column;gap:8px;padding-top:10px;border-top:2px dashed var(--line)}
.gex h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:14px;color:var(--ink-soft)}
.gline{display:flex;flex-direction:column;gap:2px;background:#FFFDF7;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px}
.gline .wwho{font-size:12px}
.gline .wwho .mini{width:22px;height:22px}
.gline p{margin:0;font-family:var(--f-hand);font-size:15px;line-height:1.4}
.gline mark{background:#F8EAC4;color:var(--ink);border-radius:3px;padding:0 2px}
.wb-switch{display:flex;gap:8px}
.blank.review{background-color:rgba(188,152,84,.2);box-shadow:inset 0 0 0 1.5px #BC9854}
.nline{font-family:var(--f-hand);font-size:17px;line-height:38px;min-height:38px;background-image:linear-gradient(to top,var(--line) 0 2px,transparent 2px)}
.empty-note{font-size:13px;color:var(--ink-soft);line-height:1.6;padding-block:8px}
/* written answers are in neutral pen ink. A blank is a faint rounded slot (user decision: no dashed underline) */
.blank{font:inherit;font-weight:700;color:#34506E;border:0;background-color:rgba(125,106,88,.17);min-width:3.5em;padding:0 6px;margin:0 2px;text-align:center;border-radius:7px}
/* in a ruled line the blank still takes the line's full height (so it sits on the ruling), but its slot is
   inset 5px top and bottom by transparent borders */
.nline .blank{box-sizing:border-box;height:38px;vertical-align:bottom;border-block:5px solid transparent;background-clip:padding-box;border-radius:12px}
/* in a ruled line the blank is a filled slot, the other blanks' faint brown (user pick A: not an underline): the next
   one to fill is honey, the one being typed berry, a right one green, one to check again keeps the gold ring */
.nline .blank{border-radius:10px;background-color:rgba(125,106,88,.15);transition:background-color .2s,box-shadow .2s}
.nline .blank.next{background-color:rgba(242,207,115,.5)}
.nline .blank:focus{background-color:rgba(201,111,134,.16)}
.nline .blank.ok{background-color:rgba(94,138,99,.15)}
.nline .blank.review{background-color:rgba(188,152,84,.2);box-shadow:inset 0 0 0 1.5px #BC9854}
.blank:focus{outline:none;background-color:rgba(242,207,115,.45)}
/* The typing caret (user request: cute, like the drawings): the browser's thin line is hidden and a pencil stroke
   stands in its place, rounded and in the text's own ink (no cap on top, user request); it blinks softly and stays
   solid while typing (placeCaret). The 이름 on the ID card and the note blanks use it. */
.blank,.id-name{caret-color:transparent}
.cute-caret{position:fixed;left:0;top:0;z-index:1000;width:3px;border-radius:2px;background:var(--caret,var(--ink));pointer-events:none;animation:caret-blink 1.1s ease-in-out .5s infinite}
.cute-caret[hidden]{display:none}
@keyframes caret-blink{0%,45%,100%{opacity:1}60%,85%{opacity:.12}}
@media(prefers-reduced-motion:reduce){.cute-caret{animation:none}}
.blank.hot{background-color:rgba(141,180,142,.4)}
.blank.ok{background-color:rgba(94,138,99,.13);color:var(--ok)}
/* a question just written down right (.fresh, one render only): the right blanks light up one by one, 확인됨 is
   stamped, the notebook rises, the 지문 toggle floats up, then the passage unfolds and its grammar is highlighted */
.nblock.fresh .blank.ok{animation:ink-ok .5s cubic-bezier(.3,1.5,.5,1) calc(var(--i) * 110ms) both}
@keyframes ink-ok{0%{transform:scale(1)}35%{transform:scale(1.14);background-color:rgba(141,180,142,.45)}100%{transform:scale(1)}}
.nblock.fresh .question-state{animation:state-stamp .45s cubic-bezier(.3,1.6,.5,1) .2s both}
@keyframes state-stamp{from{transform:scale(1.9) rotate(-8deg);opacity:0}}
.nblock.fresh .ptoggle{animation:rise .38s ease-out .6s both}
.nblock.fresh .npassage{animation:unfold .5s ease-out .95s both}
@keyframes unfold{from{opacity:0;transform:translateY(-6px);clip-path:inset(0 0 100% 0)}to{opacity:1;transform:none;clip-path:inset(0 0 -4px 0)}}
.nblock.fresh .gmark{animation:mark-sweep .5s ease-out calc(1.4s + var(--i) * 180ms) both}
@keyframes mark-sweep{from{background-size:0% 100%;border-bottom-color:transparent}}
/* a check with wrong blanks (.miss, one render only): those blanks shake with a red flash and 다시 확인 jolts —
   it still never shows the right answer */
.nblock.miss .blank.review{animation:ink-miss .55s ease-out calc(var(--i) * 50ms) both}
@keyframes ink-miss{0%{transform:translateX(0)}12%{transform:translateX(-6px);background-color:rgba(201,111,134,.4)}28%{transform:translateX(6px)}44%{transform:translateX(-4px)}60%{transform:translateX(4px);background-color:rgba(201,111,134,.25)}78%{transform:translateX(-2px)}100%{transform:translateX(0)}}
.nblock.miss .question-state{animation:state-jolt .5s ease-out .05s both}
@keyframes state-jolt{0%{transform:scale(1.35) rotate(-6deg)}35%{transform:scale(1) rotate(4deg)}60%{transform:rotate(-2deg)}100%{transform:none}}
@media (prefers-reduced-motion:reduce){.nblock.fresh *,.nblock.miss *{animation:none!important}.dock{transition:transform .2s}}
.blank.no{color:var(--no);text-decoration:line-through 2.5px var(--no)}

.ev-count{pointer-events:auto;margin-left:auto;display:inline-flex;align-items:center;gap:5px;flex:none;min-height:36px;padding:0 11px 0 6px;border:2px solid transparent;background:none;

.deduce-head h2{--btn:url(assets/ui/buttons/cream-flat.png);--bw:15px;display:inline-flex;align-items:center;box-sizing:border-box;min-height:36px;margin:0;padding:0 14px;border:2px solid transparent;

.scene-npc .nudge{position:absolute;left:50%;bottom:100%;height:44px;width:auto;margin-bottom:2px;pointer-events:none;transform:translateX(-50%);transform-origin:50% 100%;filter:drop-shadow(1px 2px 1px rgba(52,32,17,.25));animation:nudge-in .45s cubic-bezier(.3,1.6,.5,1) both,nudge-hop 2.4s ease-in-out .5s infinite}
@keyframes nudge-in{from{opacity:0;transform:translateX(-50%) scale(.2)}}
@keyframes nudge-hop{0%,62%,100%{transform:translateX(-50%)}70%{transform:translateX(-50%) translateY(-8px) rotate(-8deg)}78%{transform:translateX(-50%) rotate(6deg) scale(1.05,.95)}86%{transform:translateX(-50%) rotate(-3deg)}94%{transform:translateX(-50%)}}

@keyframes npc-hop{0%,58%,100%{translate:0 0;scale:1}63%{translate:0 0;scale:1.04 .95}71%{translate:0 -7%;scale:.97 1.04}80%{translate:0 0;scale:1.04 .96}87%{scale:.99 1.01}94%{scale:1}}

/* ---------- deduction (user decision: the detective's questions lead the player's thinking; holding up evidence is for the
   questioning) ----------
   The screen above the menu is the case list's cork board. At the top the detective asks one question at a time (voice,
   ▶ 다시 듣기 · 해석). On the board: the time card, the three suspects (crossed out once their alibi holds, the liar
   circled in red, a memo under each) and a pinned card with the question's sentence. Its blank drops down the words the
   player has met, in the speech paper with a pencil tail (people as a grid of faces). The menu stays, so the notebook
   can be opened to look things up, the same notebook as everywhere else (user request). Script: DEDUCE.qs. */
.deduce{position:absolute;inset:0;z-index:10;overflow:hidden;display:flex;flex-direction:column;padding-top:54px;color:var(--ink);
  background:#D69C62 url(assets/ui/corkboard-cork.webp) 0 0/300px 300px repeat}

  border-image:url(assets/ui/speech-paper-frame.png) 150 190 fill / 33px 42px / 0 stretch;background:#FFF8E9;background-clip:padding-box;transition:background-color .3s}

.deduce-q-row{display:flex;justify-content:flex-end;align-items:center;gap:6px;margin-top:auto;padding-top:6px}
.deduce .pill:not(.big){color:var(--ink)}
.deduce-board{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;align-items:center}
/* the cards: every sentence worked out stays pinned, the next one under it (user request: they pile up downward, no
   separate time card); the list scrolls and follows the newest. A suspect's photo is pinned on the left of their own
   cards, coming up with the first one the detective asks about them (user request) */
.ded-cards{flex:1;min-height:0;width:100%;overflow-y:auto;scrollbar-width:none;display:flex;flex-direction:column;gap:10px;padding:24px 22px 12px;box-sizing:border-box}
.ded-group{display:grid;grid-template-columns:66px minmax(0,1fr);gap:8px;align-items:start}

.ded-group .ded-card{margin:0}
.ded-group .ded-sus{position:sticky;top:0;padding-top:4px}
.ded-group .ded-pol{width:62px;padding:4px 4px 3px;font-size:10.5px}
.ded-group .ded-pol i{width:44px;height:44px}
.ded-sus{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:0;border:0;background:none;color:var(--ink)}
.ded-pol{width:80px;padding:5px 5px 4px;background:url(assets/ui/polaroid-card.webp) 0 0/100% 100%;filter:drop-shadow(1px 3px 2px rgba(40,25,10,.35));text-align:center;font-family:var(--f-display);font-size:12px;transition:filter .3s,opacity .3s}
.ded-sus:nth-child(1) .ded-pol{transform:rotate(-3deg)}.ded-sus:nth-child(2) .ded-pol{transform:rotate(2.5deg)}.ded-sus:nth-child(3) .ded-pol{transform:rotate(-1.5deg)}
.ded-pol i{display:block;width:54px;height:54px;margin:0 auto 1px;border-radius:50%;background:#FFF8E9 center/88% no-repeat}
.ded-sus.out .ded-pol{filter:grayscale(.7) brightness(.9)}
.clear-card .ded-sus.out::after{content:"";position:absolute;left:50%;top:5px;width:72px;height:72px;margin-left:-36px;pointer-events:none;opacity:.85;
  background:linear-gradient(45deg,transparent 46%,#A4352C 46% 54%,transparent 54%),linear-gradient(-45deg,transparent 46%,#A4352C 46% 54%,transparent 54%)}
/* a suspect ruled out: a red crayon X (assets/ui/crayon-x-1/2.png, user request) drawn over the photo stroke by stroke as
   the detective says they couldn't do it, each stroke uncovered along its own direction; still afterwards */
.ded-x{position:absolute;left:50%;top:3px;width:62px;height:62px;margin-left:-31px;pointer-events:none}
.ded-x i{position:absolute;inset:0;background:url(assets/ui/crayon-x-1.png) center/100% no-repeat}

@keyframes ded-x-a{to{clip-path:polygon(0 0,200% 0,0 200%)}}
@keyframes ded-x-b{to{clip-path:polygon(100% 0,-100% 0,100% 200%)}}

/* the culprit: a red crayon loop (assets/ui/crayon-o-1/2.png, user request) drawn round the photo as the detective says she
   lied, started at the bottom and run counter-clockwise, then its end over the start; still afterwards. The masks sweep
   back from the start angle in this box (205deg, the end from 211deg) */
@property --o1{syntax:'<angle>';inherits:false;initial-value:360deg}
@property --o2{syntax:'<angle>';inherits:false;initial-value:62deg}
.ded-o{position:absolute;left:50%;top:-12px;width:80px;height:100px;margin-left:-40px;pointer-events:none;transform:rotate(-5deg)}

.ded-sus.draw .ded-o i{--o1:0deg;-webkit-mask:conic-gradient(from 205deg,transparent calc(360deg - var(--o1)),#000 0);mask:conic-gradient(from 205deg,transparent calc(360deg - var(--o1)),#000 0);animation:ded-o-a .6s ease-in-out forwards}
.ded-sus.draw .ded-o i + i{--o2:0deg;-webkit-mask:conic-gradient(from 211deg,transparent calc(360deg - var(--o2)),#000 0);mask:conic-gradient(from 211deg,transparent calc(360deg - var(--o2)),#000 0);animation:ded-o-b .14s linear .6s forwards}
@keyframes ded-o-a{to{--o1:360deg}}
@keyframes ded-o-b{to{--o2:62deg}}
@media(prefers-reduced-motion:reduce){.ded-sus.draw .ded-o i,.ded-sus.draw .ded-o i + i{-webkit-mask:none;mask:none;animation:none}}

/* every sentence has its own 해석, beside it (user request: one button for all showed lines they did not ask for) */
.ded-line{display:flex;align-items:flex-start;gap:8px}

.office-say.done .office-foot .office-next{opacity:.7;animation:office-next 1s ease-in-out infinite}
@keyframes office-next{50%{transform:translateY(3px)}}
.office-go{position:absolute;left:50%;bottom:6%;z-index:2;width:max-content;transform:translateX(-50%);min-width:150px;justify-content:center}
.office-go[hidden]{display:none}
.office-close{position:absolute;top:14px;right:14px;z-index:3}
.office-close[hidden]{display:none}
.office-go:active{transform:translateX(-50%) translateY(1px)}
.id-wrap{position:absolute;left:0;right:0;top:16%;z-index:2;display:flex;flex-direction:column;align-items:center;gap:20px}
.id-wrap[hidden]{display:none}
/* Center the card and its buttons in the space above the preview keyboard. */
.office:has(.vkb:not([hidden])) .id-wrap{top:0;bottom:336px;justify-content:safe center;padding-block:16px;box-sizing:border-box}
/* the ID card picture (assets/ui/detective-id-card.png); boxes in % of the picture: photo, three lines, stamp circle */
.id-card{position:relative;flex-shrink:0;width:min(90%,350px);aspect-ratio:1143/747;background:url(assets/ui/detective-id-card.png) center/100% 100% no-repeat;filter:drop-shadow(0 6px 6px rgba(30,20,10,.35));transform:rotate(-2deg);animation:id-in .4s cubic-bezier(.2,1.2,.4,1) both}
@keyframes id-in{from{opacity:0;transform:translateY(60px) rotate(-6deg)}}
.id-photo{position:absolute;left:11.3%;top:24.9%;width:29.6%;height:50.6%;background:url(assets/ui/icons-v2/detective.png) center/94% no-repeat}
.id-name{position:absolute;left:47.5%;top:37.1%;width:42.5%;box-sizing:border-box;margin:0;padding:0 0 2px;transform:translateY(-100%);border:0;border-radius:0;background:transparent;font-family:var(--f-hand);font-weight:700;font-size:22px;line-height:1.15;color:var(--ink);caret-color:transparent;outline:none}
.id-name:focus-visible{outline:none}
.id-line{position:absolute;left:47.5%;transform:translateY(-100%);padding-bottom:3px;font-family:var(--f-display);font-size:11px;letter-spacing:.06em;color:var(--ink);opacity:.75}
.id-title{top:49.8%}
.id-town{top:62.5%}
.id-stamp{position:absolute;left:85.1%;top:77.5%;width:15%;aspect-ratio:1;box-sizing:border-box;display:grid;place-items:center;border:3px solid #B9473A;border-radius:50%;opacity:.88;transform:translate(-50%,-50%) rotate(-14deg);animation:id-stamp .4s cubic-bezier(.2,1.6,.4,1) both}
.id-stamp[hidden]{display:none}
.id-stamp img{width:64%;filter:sepia(1) saturate(4) hue-rotate(-30deg) brightness(.75)}
@keyframes id-stamp{from{opacity:0;transform:translate(-50%,-50%) rotate(-14deg) scale(2.4)}}
.id-actions{display:flex;gap:10px}
.id-actions[hidden]{display:none}
/* On a computer (no keyboard of its own on screen) 이름 짓기 shows an iPhone-sized keyboard in the phone frame (user
   request: the preview has to show the room the phone's keyboard takes, to design around it). Sizes follow an iPhone 15
   in portrait, English keys: suggestion bar 45 + keys 216 + globe/mic bar 75 = 336pt. A phone or tablet hides it and
   opens its own; real typing on the computer still goes into the name. The note blanks get the same keyboard
   (#noteVkb, user request: like 이름 짓기), so the typing layout (.app.typing) shows on a computer too. */
.vkb{position:absolute;left:0;right:0;bottom:0;z-index:4;display:flex;flex-direction:column;height:336px;box-sizing:border-box;background:#D1D4DA;font-family:-apple-system,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;color:#000;user-select:none;-webkit-user-select:none;animation:vkb-in .25s ease-out}
.vkb[hidden]{display:none}
.note-vkb{z-index:30}
@keyframes vkb-in{from{transform:translateY(100%)}}
.vkb-suggest{flex:0 0 45px;display:grid;grid-template-columns:repeat(3,1fr);align-items:center}
.vkb-suggest span{height:22px;border-left:1px solid rgba(60,60,67,.29)}
.vkb-suggest span:first-child{border:0}
.vkb-keys{flex:0 0 216px;box-sizing:border-box;display:flex;flex-direction:column;gap:12px;padding:8px 3px 4px}
.vkb-row{display:flex;justify-content:center;gap:6px;height:42px}
.vkb-row button{flex:0 0 calc((100% - 54px) / 10);height:100%;padding:0;border:0;border-radius:5px;background:#FFF;box-shadow:0 1px 0 #898A8D;font:inherit;font-size:22px;line-height:1;color:#000;cursor:pointer}
.vkb-row button:active{background:#ABB0BA}
.vkb-row .k-fn{flex-basis:calc((100% - 54px) / 10 * 1.32);background:#ABB0BA;font-size:16px}
.vkb-row .k-fn:active{background:#FFF}
.vkb-row .k-fn[aria-pressed="true"]{background:#FFF}
.vkb-row .k-gap{flex-basis:calc((100% - 54px) / 10 * .2);visibility:hidden}
.vkb-row .k-space{flex:1 1 auto;font-size:16px}
.vkb-row .k-done{flex-basis:calc((100% - 54px) / 10 * 2.3);background:#0A84FF;color:#FFF;font-size:16px}
.vkb-row .k-done:active{background:#0866CC}
.vkb-bar{flex:1;display:flex;justify-content:space-between;padding:6px 28px 0;font-size:24px;color:#50555C}
.vkb-bar span{line-height:1}
/* 홈 = a living office (user request, plan A, then reworked: the detective in the middle, the thing to do inside their
   speech bubble): the office picture fills the page; the detective stands on the rug in the middle and says a line for
   the moment with the button for it (이어서 수사 / 사건 시작 / 복습하기) beside ▶ 다시 듣기 · 해석; the cork board
   (→ 사건) and the bookshelf (→ 학습) still lead on where they show; name plate and streak on top. */
#home-home{position:relative;padding:0;overflow:hidden;background:#6B4A30;container-type:size}
#home-home[hidden]{display:none}
/* the office is wider than the screen (user request): it pans sideways like a place (touch scrolls, a mouse drags,
   .oh-pan) and opens centred on the detective. The picture's own box fills the height (cropped 62% down on a screen
   wider than the picture), so the detective and the spots stay on their places in it; everything inside is in % of
   the picture (1843×1376) */
.oh-pan{position:absolute;inset:0;overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;scrollbar-width:none;-webkit-user-select:none;user-select:none}
.oh-pan img{-webkit-user-drag:none}
.oh-pan::-webkit-scrollbar{display:none}
.oh-stage{--oh-h:max(100cqh,calc(100cqw * 1376 / 1843));position:relative;top:calc((100cqh - var(--oh-h)) * .62);width:calc(var(--oh-h) * 1843 / 1376);height:var(--oh-h);background:url(assets/places/detective-office-wide.jpg) center/100% 100% no-repeat}
.oh-spot{position:absolute;padding:0;border:0;border-radius:14px;background:transparent;cursor:pointer}
.oh-spot:active{background:rgba(255,248,233,.18)}
/* the box keeps the pose's own shape (--ar): a button sized only by its child's % height collapses and squeezes it */
.oh-det{position:absolute;left:50%;bottom:25%;height:32%;aspect-ratio:var(--ar,627/700);padding:0;border:0;background:none;transform:translateX(calc(var(--ax,.5) * -100%));cursor:pointer}
.oh-det:active{transform:translateX(calc(var(--ax,.5) * -100%)) translateY(1px)}
/* the line above the cork board (user request: raised off the board), its tail down toward the detective; when 해석
   opens it grows downward, its top staying put (user request: growing upward ran it under the name plate on a phone;
   --ko-h, homeKoShift). It is as wide as
   its words and buttons (up to 88% of the screen, with roomy paper margins, user request), centred over the detective; a line can break where its text has \n (user request: home-new) */
.oh-say{position:absolute;left:0;right:0;margin-inline:auto;bottom:calc(72% - var(--ko-h, 0px));z-index:2;box-sizing:border-box;width:fit-content;max-width:88cqw;padding:22px 24px 18px;font-family:var(--f-hand);font-size:16px;line-height:1.38;color:var(--ink);filter:drop-shadow(2px 4px 2px rgba(52,32,17,.2));transform-origin:50% calc(100% + 21px)}
.oh-say[hidden]{display:none}
/* the bubble pops out like every speech bubble (see bubble-pop); .pop/.hop are put back on every time (popHomeSay) so
   a tap on the detective plays it again even while the bubble is open */
.oh-say.pop{animation:bubble-pop-plain .42s cubic-bezier(.3,1.45,.5,1) both}
/* closed with its X (user request: the closing moves too): it goes back into its tail, then hides (closeHomeSay) */
.oh-say.closing{animation:bubble-close-plain .26s ease-in both;pointer-events:none}
.oh-det.hop svg{animation:det-hop .5s ease-out}
.oh-say .office-foot{margin-top:10px}
/* the app's close button, small, in the bubble's top right (user request); a tap on the detective brings the bubble back */
.oh-say .oh-close{position:absolute;top:12px;right:12px;width:30px;height:30px}
.oh-say #homeEn{padding-right:28px}
.oh-say #homeEn,.oh-say #homeKo{white-space:pre-line}
.oh-go{margin-right:auto}
.oh-go[hidden]{display:none}
.oh-top{position:absolute;top:16px;left:16px;right:16px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.oh-plate{box-sizing:border-box;max-width:100%;min-width:0;margin:0;padding:5px 14px;border:2px solid transparent;border-image:url(assets/ui/buttons/cream-flat.png) 60 62 62 62 fill / 15px 15.5px stretch;font-family:var(--f-display);font-weight:400;font-size:17px;line-height:1.4;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}


/* test tool outside the frame: only on screens wide enough to keep it left of the phone; hidden at phone/tablet widths */
.devtools{display:none}
.devbtn[aria-pressed="true"]{background:var(--honey)}
.devbtn{border:2px dashed var(--ink);background:var(--paper-2);color:var(--ink);border-radius:12px;font-family:var(--f-display);font-size:14px;padding:8px 14px;opacity:.9}
@media (min-width:768px){
  .devtools{position:fixed;z-index:200;top:16px;left:16px;display:flex;flex-direction:column;gap:8px}
  .devtools.devpreview{left:auto;right:16px}
}
.devpreview small{font-family:var(--f-display);font-size:13px;color:var(--ink-soft);text-align:center}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>

<body>

<svg class="hidden-svg" aria-hidden="true">
  <defs>
    <filter id="wob" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="7"/>

    </filter>
    <!-- the app menu's honey patch: its edge as if colored in by hand -->
    <!-- the notebook tabs' stamps: a slightly rough ink edge -->
    <filter id="inky"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="1.3"/></filter>
    <filter id="navRough"><feTurbulence type="fractalNoise" baseFrequency=".06" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="5"/></filter>
    <symbol id="pine" viewBox="0 0 40 80">

      <rect x="17" y="58" width="6" height="16" fill="#9C7656" stroke="#4A3628" stroke-width="2"/>
    </symbol>

      <path d="M5 8 Q5 16 10 18 Q15 16 15 8Z" fill="#E8B27A" stroke="#4A3628" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M10 4 L10 1.5" stroke="#4A3628" stroke-width="1.6" stroke-linecap="round"/>

    <symbol id="pinIcon" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M12 2.8a4.2 4.2 0 0 1 2.6 7.5l.4 1.4h1.6a1.6 1.6 0 0 1 0 3.2H7.4a1.6 1.6 0 0 1 0-3.2H9l.4-1.4A4.2 4.2 0 0 1 12 2.8z" style="fill:var(--pin-head,none)"/><path d="M12 14.9v4.3"/><ellipse cx="10.4" cy="6.1" rx="1.2" ry=".8" transform="rotate(-35 10.4 6.1)" stroke="none" style="fill:var(--pin-shine,none)"/></g></symbol>

</svg>

<div class="app" id="app">
  <audio id="cameraShutter" src="audio/camera-shutter.mp3" preload="auto" hidden></audio>
  <audio id="correctChime" src="audio/note-correct.mp3" preload="auto" hidden></audio>
  <audio id="retryBuzz" src="audio/note-retry.mp3" preload="auto" hidden></audio>
  <audio id="wordPlace" src="audio/word-place.wav" preload="auto" hidden></audio>
  <audio id="stampThud" src="audio/stamp.mp3" preload="auto" hidden></audio>
  <audio id="evidenceVoice" preload="auto" hidden></audio>
  <audio id="wordVoice" preload="none" hidden></audio>
  <div class="main">
    <button class="pill top-back" type="button" id="backTab" aria-label="뒤로">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5 L8 12 L14.5 18.5" fill="none" stroke="#4A3628" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <!-- PART 1: interrogation stage -->
    <section class="scene" aria-label="대화 장면">
      <span class="chip l" id="orderChip" hidden></span>
      <div class="bubble" id="bubble" hidden role="status"></div>

      <div class="ask-panel" id="askPanel"></div>
      <div class="spotlight" aria-hidden="true"></div>
      <div class="bubble say" id="sayBubble" hidden role="status" aria-live="polite"></div>

      <section class="drawer" id="drawer" aria-label="증거 서랍">
        <div class="drawer-head"><h3>증거</h3><div class="drawer-tabs"><button class="pill sm" type="button" data-drawer-tab="photo" aria-pressed="true">사진</button><button class="pill sm" type="button" data-drawer-tab="say" aria-pressed="false">진술</button></div><button class="x close-button" type="button" data-drawer-close aria-label="증거 서랍 닫기"></button></div>
        <div class="drawer-strip" id="drawerStrip"></div>
        <div class="drawer-pick" id="drawerPick" hidden></div>
      </section>
    </section>

    <!-- PART 2: investigation — a large illustration per place; tap suspicious things to find clues -->
    <section class="inv" aria-label="현장 조사">
      <div class="inv-head">
        <h2 id="sceneTitle"></h2>
        <button class="ev-count" id="evCount" type="button"></button>
      </div>
      <div class="art-stage">
        <div class="art-wrap" id="artWrap"><div class="art" id="art"></div></div>
        <div class="accuse-foot" id="accuseFoot" hidden><button class="pill big" type="button" data-accuse>추리하기</button></div>
        <div class="swipe-hint" id="swipeHint" hidden>← 옆으로 밀어서 둘러보기 →</div>
      </div>
    </section>

    <!-- Deduction: the cork board where the detective works it out, one question at a time (DEDUCE) -->
    <section class="deduce" id="deduce" aria-label="추리" hidden>
      <div class="deduce-head"><h2>Deduction</h2></div>

        <div class="deduce-q-row"><button class="play-btn" type="button" id="deduceReplay" aria-label="다시 듣기"></button><button class="pill sm" type="button" id="deduceKo" aria-pressed="false">해석</button></div></div></div>
      <div class="deduce-board" id="deduceBoard">
        <div class="ded-cards" id="deduceCards"></div>

      <div class="deduce-drop" id="deduceDrop" role="listbox" hidden></div>

    <!-- Note: a notebook pulled up from the bottom — automatically while writing down an answer, or from the Note tab -->

    </div>
  </div>

  <!-- Home: the screens outside a case, switched by their own bottom menu (user request): 홈 (the detective's office,
       no case list, user request), 사건 (case select; cases open in order, a locked card shows no title), 학습 (words, grammar,
       review in one), 마이 (records and settings). -->
  <section class="cases" id="caseList" aria-label="홈">
    <div class="home-page" id="home-home">
      <div class="oh-pan" id="homePan"><div class="oh-stage">
        <button class="oh-spot" type="button" data-go="cases" style="left:46.5%;top:27.5%;width:18.5%;height:17.5%" aria-label="사건 게시판"></button>
        <button class="oh-spot" type="button" data-go="study" style="left:64.5%;top:51.5%;width:15.5%;height:25.5%" aria-label="책장"></button>
        <button class="oh-det det" type="button" id="officeDetective" aria-label="탐정"></button>
        <div class="oh-say" id="homeSay" hidden aria-live="polite">
          <button class="close-button oh-close" type="button" id="homeSayClose" aria-label="말풍선 닫기"></button>
          <p id="homeEn"></p><p class="office-ko" id="homeKo" hidden></p>
          <div class="office-foot"><button class="pill hint oh-go" type="button" id="homeGo" hidden></button><button class="play-btn" type="button" id="homeReplay" aria-label="다시 듣기"></button><button class="pill sm" type="button" id="homeKoBtn" aria-pressed="false">해석</button></div>
        </div>
      </div></div>
      <div class="oh-top"><h1 class="oh-plate" id="officePlate">탐정 사무소</h1><span class="streak" id="homeStreak" hidden></span></div>

  per:Object.fromEntries(PEOPLE_ORDER.map(id => [id, newSpeakerState()]))

let voices = [];
function loadVoices(){
  if(!('speechSynthesis' in window)) return;
  const all = speechSynthesis.getVoices().filter(v => /^en[-_]/i.test(v.lang));
  voices = all.filter(v => /en[-_](US|GB)/i.test(v.lang)).concat(all.filter(v => !/en[-_](US|GB)/i.test(v.lang)));
}
if('speechSynthesis' in window){ loadVoices(); speechSynthesis.addEventListener?.('voiceschanged', loadVoices); }
let talkT, speechTurn = 0;
let talker = null;   // whose line is playing (a replay from the notebook can be someone else's)
function setTalking(on){
  document.querySelectorAll('.scene-npc').forEach(npc => {
    npc.style.setProperty('--talk-cycle', S.slow ? '.99s' : '.74s');
    npc.classList.toggle('talking', on && npc.dataset.talk === (talker || S.cur));
  });
}
const clip = new Audio();
clip.preload = 'auto';
clip.onplaying = () => setTalking(true);
clip.onended = clip.onpause = clip.onwaiting = clip.onerror = () => setTalking(false);
function stopVoice(){
  speechTurn++;
  clearTimeout(talkT);
  clip.pause();
  $('#evidenceVoice').pause();
  $('#wordVoice').pause();
  if('speechSynthesis' in window) speechSynthesis.cancel();
  setTalking(false);
}
// Every stamp that lands thuds (user request): ms = when the stamp's animation hits the paper.
function stampSound(ms = 0){ setTimeout(() => { const s = $('#stampThud'); s.currentTime = 0; s.play().catch(() => {}); }, ms); }
const blobSrc = {};
const seekableSrc = src => blobSrc[src] ||= fetch(src).then(r => r.ok ? r.blob() : Promise.reject()).then(b => URL.createObjectURL(b)).catch(() => src);
// onDone runs once the line has finished (not when it is cut off by another line or stopVoice).
// range: [start, end] seconds of the recording to play (one sentence); it never calls onDone.
function speak(text, key, who = S.cur, onDone, range){
  stopVoice();
  const turn = speechTurn;
  talker = who;
  const done = () => { if(turn === speechTurn) onDone?.(); };
  const length = text.length * (S.slow ? 95 : 70) + 500;
  const src = spk(who).audio?.[key];
  if(src){
    const play = url => {
      if(turn !== speechTurn) return;
      clip.src = url;
      clip.preservesPitch = true;
      clip.playbackRate = S.slow ? .75 : 1;
      clip.addEventListener('ended', done, { once:true });
      clip.play().catch(() => { if(turn === speechTurn){ setTalking(false); toast('음성을 재생하지 못했어요. 다시 듣기를 눌러 주세요.'); done(); } });
    };
    // one sentence: a media fragment on an in-memory copy, which can always seek (a plain file URL can only
    // when the server answers range requests)
    if(range) seekableSrc(src).then(url => {
      play(`${url}#t=${range[0]},${range[1]}`);
      // the fragment end is only checked a few times a second; stop right at the end so the next sentence never leaks in
      const watch = setInterval(() => {
        if(turn !== speechTurn) return clearInterval(watch);
        if(clip.currentTime >= range[1] - .02){ clip.pause(); clearInterval(watch); }
      }, 15);
    });
    else play(src);
    return;
  }
  // No recording: browser TTS. If it never starts (no voices, e.g. inside an app preview), the person
  // still moves their mouth for about as long as the line would take, so the scene reads as speech.
  const mime = () => {
    if(turn !== speechTurn) return;
    setTalking(true);
    clearTimeout(talkT);
    talkT = setTimeout(() => { if(turn === speechTurn){ setTalking(false); done(); } }, length);
  };
  if(!('speechSynthesis' in window)){ mime(); return; }
  const s = spk(who);
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US'; u.rate = S.slow ? .72 : .95; u.pitch = s.pitch;
  if(voices.length) u.voice = voices[s.voice % voices.length];
  let started = false;
  u.onstart = u.onresume = () => {
    started = true;
    if(turn !== speechTurn) return;
    setTalking(true);
    clearTimeout(talkT);
    talkT = setTimeout(() => { if(turn === speechTurn) setTalking(false); }, length + 300);
  };
  u.onend = () => { if(turn === speechTurn){ setTalking(false); clearTimeout(talkT); done(); } };
  u.onerror = u.onpause = () => { if(turn === speechTurn){ setTalking(false); clearTimeout(talkT); } };
  speechSynthesis.speak(u);
  setTimeout(() => { if(!started) mime(); }, 700);
}
